- id: 689cc2cb-5148-4ae0-9308-6ca7f68aa883
  question: Чем обычно различаются задачи бизнес-аналитика и системного аналитика
    в одной фиче?
  answer: 'Бизнес-аналитик чаще уточняет цели и правила процесса, системный — поведение
    системы, данные и интеграции. Граница зависит от команды: важнее определить владельцев
    решений и передать требования без потерь, чем опираться на название должности.'
