- id: 62fadfe2-3a07-4bd0-9588-a3c5d6d1f1dc
  question: Как выявить исключения в основном пользовательском сценарии?
  answer: Для каждого шага спросить, что происходит при пустых, ошибочных или поздних
    данных, отказе зависимости, повторном действии и отмене. Проверить роли и состояния
    объекта.
  category: Сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a1c19e1d-0beb-4728-9318-837f8b6955cc
  question: Зачем проверять источник данных до записи требования об их отображении?
  answer: Нужно убедиться, что данные существуют, доступны по правам, достаточно свежие
    и имеют владельца. Иначе требование может потребовать отдельной интеграции.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f6de5635-a395-4888-ba38-ee7b93e3ba7f
  question: Чем пользовательское требование отличается от системного?
  answer: Пользовательское описывает необходимый результат в контексте роли и цели;
    системное уточняет проверяемое поведение решения и ограничения. Между ними нужна
    связь.
  category: Уровни требований
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: f21b9d2e-f291-4174-9966-2b8dc3607601
  question: Когда прототип интерфейса помогает выявлению требований?
  answer: Когда участникам трудно обсудить действия и состояния словами. Прототип
    выявляет пропущенные поля, права и ошибки, но не заменяет описание правил.
  category: Методы выявления
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d2ca9c12-a6ec-4952-a13d-bbed27c5a327
  question: Как понять, что информации достаточно для начала разработки небольшой
    задачи?
  answer: Понятны цель, границы, основной и ошибочные сценарии, данные, интерфейсы,
    ограничения и критерии приёмки; критические вопросы имеют ответы или владельцев.
  category: Готовность
  context: 
