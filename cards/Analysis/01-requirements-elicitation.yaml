- id: 0f2a9117-5edd-4112-8d09-e2bba30130bd
  question: Когда наблюдение за работой пользователя полезнее интервью?
  answer: Когда участники не помнят все шаги, описывают нормативный процесс вместо
    фактического или часто обходят ограничения системы. Наблюдения затем нужно проверить
    и согласовать.
  category: Методы выявления
  context: 
