- id: 4b341f27-a392-4944-825a-de9efe03d475
  question: Что такое граница системы и зачем её уточнять до описания сценариев?
  answer: Граница определяет, за что отвечает система, а что делает пользователь или
    внешняя система. Она помогает определить интеграции, владельцев требований и объём
    работы.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
