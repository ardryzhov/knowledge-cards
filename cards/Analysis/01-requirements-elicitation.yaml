- id: 020520a0-151f-43f7-87e1-f69b6b5d3dca
  question: Чем AS-IS отличается от TO-BE?
  answer: AS-IS описывает фактический текущий процесс, TO-BE — целевой после изменения.
    Разница помогает выявить нужные изменения, миграцию и влияние на пользователей.
  category: Процесс
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
