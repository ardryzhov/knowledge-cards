- id: 5ab8c567-67af-4825-ae2c-2cfd5465d65b
  question: Почему вопрос «какие поля нужны?» недостаточен для описания отчёта?
  answer: Нужно уточнить назначение, расчёты, фильтры, период, права, свежесть, объём,
    формат и сверку с источником. Одинаковые поля могут означать разные отчёты.
