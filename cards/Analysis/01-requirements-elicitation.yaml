  question: Зачем проводить интервью с пользователем отдельно от встречи с заказчиком?
  answer: Заказчик описывает цель и ограничения, а пользователь раскрывает реальный
    процесс, исключения и обходные пути. Расхождения помогают обнаружить неверные
    предположения.
  category: Методы выявления
