  question: Когда workshop по требованиям полезнее отдельных интервью?
  answer: Когда несколько сторон должны вместе согласовать спорный процесс или контракт
    и увидеть противоречия. Встречу готовят с целью и полномочными участниками; личные
    вопросы уточняют отдельно.
