- id: 5b6631bd-eb78-42be-bf68-dfeeefdbc36a
  question: Чем бизнес-потребность отличается от предложенного заказчиком решения?
  answer: Потребность описывает проблему или желаемый результат; решение — конкретный
    способ его достижения. Сначала проверяют потребность и альтернативы, иначе можно
    реализовать запрошенную функцию, не решив проблему.
  category: Цель и решение
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: cfe3e7f7-4b08-41c7-995c-25a41f69a18f
  question: Кого считать заинтересованной стороной изменения?
  answer: 'Того, кто влияет на решение или испытывает его последствия: пользователь,
    владелец продукта, поддержка, безопасность, эксплуатация, смежные команды. Состав
    зависит от задачи.'
  category: Стейкхолдеры
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 4ac24a91-8ba2-4eed-8508-471a304391c4
  question: Как выявить скрытых заинтересованных лиц у интеграционной задачи?
  answer: Проследить путь данных через системы и владельцев контрактов; проверить,
    кто отвечает за безопасность, эксплуатацию, мониторинг и поддержку после запуска.
  category: Стейкхолдеры
  context: 
