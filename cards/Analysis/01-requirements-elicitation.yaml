  question: С чего начать анализ запроса «нужна выгрузка операций»?
  answer: Уточнить бизнес-цель, пользователей, состав и объём данных, частоту, формат,
    права доступа и срок. Проверить существующие отчёты, зафиксировать границы задачи
    и открытые вопросы.
  category: Старт анализа
