topic: "Выявление требований"
cards:
  - question: "С чего начать анализ запроса «нужна выгрузка операций»?"
    answer: "Уточнить бизнес-цель, пользователей, состав и объём данных, частоту, формат, права доступа и срок. Проверить существующие отчёты, зафиксировать границы задачи и открытые вопросы."
    category: "Старт анализа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем бизнес-потребность отличается от предложенного заказчиком решения?"
    answer: "Потребность описывает проблему или желаемый результат; решение — конкретный способ его достижения. Сначала проверяют потребность и альтернативы, иначе можно реализовать запрошенную функцию, не решив проблему."
    category: "Цель и решение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Кого считать заинтересованной стороной изменения?"
    answer: "Того, кто влияет на решение или испытывает его последствия: пользователь, владелец продукта, поддержка, безопасность, эксплуатация, смежные команды. Состав зависит от задачи."
    category: "Стейкхолдеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как выявить скрытых заинтересованных лиц у интеграционной задачи?"
    answer: "Проследить путь данных через системы и владельцев контрактов; проверить, кто отвечает за безопасность, эксплуатацию, мониторинг и поддержку после запуска."
    category: "Стейкхолдеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем проводить интервью с пользователем отдельно от встречи с заказчиком?"
    answer: "Заказчик описывает цель и ограничения, а пользователь раскрывает реальный процесс, исключения и обходные пути. Расхождения помогают обнаружить неверные предположения."
    category: "Методы выявления"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда наблюдение за работой пользователя полезнее интервью?"
    answer: "Когда участники не помнят все шаги, описывают нормативный процесс вместо фактического или часто обходят ограничения системы. Наблюдения затем нужно проверить и согласовать."
    category: "Методы выявления"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как уточнить неоднозначное слово «быстро» в требовании?"
    answer: "Выяснить конкретную операцию, типичную и пиковую нагрузку, допустимое время ответа, долю запросов и период измерения. Результат записать измеримым условием."
    category: "Уточнение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отделить факт от предположения в заметках по встрече?"
    answer: "Указать источник и статус каждого важного утверждения: согласованное правило, наблюдение, гипотеза или открытый вопрос. Для гипотезы назначить проверку и ответственного."
    category: "Документирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что стоит подготовить перед встречей по сбору требований?"
    answer: "Изучить цель, текущий процесс, артефакты и участников; составить вопросы, спорные гипотезы и ожидаемый результат встречи."
    category: "Подготовка встречи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как зафиксировать результат встречи для проверки понимания?"
    answer: "Записать решения, вопросы, ответственных, сроки и изменённые требования; передать участникам краткий протокол для подтверждения спорных пунктов."
    category: "Результат встречи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое граница системы и зачем её уточнять до описания сценариев?"
    answer: "Граница определяет, за что отвечает система, а что делает пользователь или внешняя система. Она помогает определить интеграции, владельцев требований и объём работы."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как определить scope и out of scope у изменения?"
    answer: "Описать целевые сценарии, данные, пользователей и затронутые системы, а также явные исключения. Сверить границы с бизнес-целью и зависимостями."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем AS-IS отличается от TO-BE?"
    answer: "AS-IS описывает фактический текущий процесс, TO-BE — целевой после изменения. Разница помогает выявить нужные изменения, миграцию и влияние на пользователей."
    category: "Процесс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему текущий процесс AS-IS не должен быть единственным источником требований?"
    answer: "Он может содержать обходные пути и ограничения старой системы. Его сверяют с бизнес-целью, нормативными правилами, проблемами пользователей и желаемым процессом."
    category: "Процесс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как поступить, если два стейкхолдера дают противоречащие правила?"
    answer: "Зафиксировать конфликт и последствия, выяснить полномочия и цели сторон, предложить варианты и получить решение у ответственного владельца."
    category: "Конфликты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выявить исключения в основном пользовательском сценарии?"
    answer: "Для каждого шага спросить, что происходит при пустых, ошибочных или поздних данных, отказе зависимости, повторном действии и отмене. Проверить роли и состояния объекта."
    category: "Сценарии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем проверять источник данных до записи требования об их отображении?"
    answer: "Нужно убедиться, что данные существуют, доступны по правам, достаточно свежие и имеют владельца. Иначе требование может потребовать отдельной интеграции."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем пользовательское требование отличается от системного?"
    answer: "Пользовательское описывает необходимый результат в контексте роли и цели; системное уточняет проверяемое поведение решения и ограничения. Между ними нужна связь."
    category: "Уровни требований"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда прототип интерфейса помогает выявлению требований?"
    answer: "Когда участникам трудно обсудить действия и состояния словами. Прототип выявляет пропущенные поля, права и ошибки, но не заменяет описание правил."
    category: "Методы выявления"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как понять, что информации достаточно для начала разработки небольшой задачи?"
    answer: "Понятны цель, границы, основной и ошибочные сценарии, данные, интерфейсы, ограничения и критерии приёмки; критические вопросы имеют ответы или владельцев."
    category: "Готовность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему вопрос «какие поля нужны?» недостаточен для описания отчёта?"
    answer: "Нужно уточнить назначение, расчёты, фильтры, период, права, свежесть, объём, формат и сверку с источником. Одинаковые поля могут означать разные отчёты."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если заказчик просит «сделать как в соседней системе»?"
    answer: "Выяснить, какие свойства образца обязательны, проверить ограничения своей системы и записать конкретные правила, а не ссылку на изменяемый чужой интерфейс."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выявить зависимость требования от другой команды?"
    answer: "Проверить владельцев данных, API, прав и окружений; подтвердить готовность контракта и срок. Зависимость записать с ответственным и риском."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем согласовывать словарь терминов предметной области?"
    answer: "Одинаковые слова могут означать разные сущности или состояния, а разные слова — одно и то же. Глоссарий согласует требования, модель данных и контракты."
    category: "Глоссарий"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

