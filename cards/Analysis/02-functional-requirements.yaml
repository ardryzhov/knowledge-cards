- id: 13b9591e-f054-4367-ac39-526b6a8f1c7b
  question: Как определить, что два требования дублируют друг друга?
  answer: Сравнить цель, условия, объект и результат. Если они описывают одно правило,
    оставить единый источник и ссылки; если условия разные, явно разграничить область
    применения.
  category: Качество требования
