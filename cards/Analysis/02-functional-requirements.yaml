- id: e7d80f20-4074-4bbb-9ff9-94b3943146fd
  question: Когда Given–When–Then помогает уточнить критерий приёмки?
  answer: Когда правило можно выразить через исходное состояние, действие и наблюдаемый
    результат. Формат помогает обнаружить пропущенные предусловия и граничные случаи,
    но не заменяет полный контракт сложной интеграции.
  category: Критерии приёмки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
