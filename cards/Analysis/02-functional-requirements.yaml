  question: Как описать пакетную операцию при конфликте одного элемента с бизнес-правилом?
  answer: Нужно решить, отклоняется ли весь пакет или только проблемный элемент, какие
    элементы уже сохранены, как представляются ошибки и можно ли безопасно повторить
    запрос.
  category: Пакетные операции
