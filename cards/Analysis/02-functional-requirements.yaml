- id: 11883006-16b1-43e9-b3c5-237edad2e3a9
  question: Чем предусловие сценария отличается от шага?
  answer: Предусловие истинно до начала сценария; шаг — действие или реакция внутри
    него. Их смешение затрудняет тестирование альтернатив.
  category: Use case
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 7aa9fcac-712c-48d4-b85b-bf8ff5fd077d
  question: Чем альтернативный поток отличается от исключительного?
  answer: Альтернативный поток даёт допустимый вариант результата; исключительный
    описывает ошибку или невозможность продолжить. Для обоих нужен явный итог состояния.
  category: Use case
  context: 
