- id: 1f34c6ca-b3e3-4693-a90c-c030f9ea876c
  question: Чем идентификация, аутентификация и авторизация отличаются в пользовательском
    сценарии?
  answer: Идентификация устанавливает заявленную личность или идентификатор пользователя,
    аутентификация проверяет доказательство этой личности, авторизация решает, какое
    действие с конкретным ресурсом разрешено. Требование к входу не заменяет требование
    к правам на операцию.
  category: Права доступа
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e325f6cb-2c10-4037-8a6a-983a71bf850f
  question: Что нужно описать аналитику помимо макета успешного экрана новой операции?
  answer: Состояния загрузки, пустых данных и ошибок, валидацию, права доступа и результат
    асинхронной операции. Макет помогает обсудить интерфейс, но эти правила должны
    быть проверяемы вне картинки.
