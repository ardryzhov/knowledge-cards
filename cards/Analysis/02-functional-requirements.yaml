- id: 1a86b8f4-0fe9-4362-84be-32c47cc49969
  question: Как сформулировать критерий приёмки для запрета операции сверх лимита?
  answer: 'Задать исходные условия, лимит, действие и наблюдаемый результат: операция
    не создана, возвращена заданная ошибка, остаток не изменён. Отдельно проверить
    границу.'
  category: Критерии приёмки
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 994ab263-217d-4de7-afdd-50479241604f
  question: Чем критерий приёмки отличается от тест-кейса?
  answer: Критерий фиксирует условие принятия и ожидаемое поведение; тест-кейс детализирует
    данные, шаги и проверку конкретного варианта.
  category: Критерии приёмки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ccd43412-bc81-4487-875e-59065a033f25
  question: Когда таблица решений полезнее длинного текста условий?
  answer: 'Когда результат зависит от нескольких независимых условий: таблица показывает
    комбинации и обнаруживает пропуски или противоречия.'
  category: Моделирование правил
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3dfd9949-ff42-424e-afd1-ed5ef3bc684b
  question: Зачем указывать поведение при частичном успехе пакетной операции?
  answer: Иначе неизвестно, сохраняются ли успешные элементы, откатывается ли пакет
    и как клиент узнаёт об ошибках; это влияет на повторы и транзакции.
  category: Пакетные операции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0eefbee0-6f7a-4afb-9282-73366b0eea86
  question: Какие вопросы задать для операции «отменить платёж»?
  answer: Уточнить допустимые состояния и сроки, права, исполнен ли платёж внешней
    системой, смысл повторной отмены и отражение компенсации.
  category: Практический кейс
