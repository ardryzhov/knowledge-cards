- id: 41af95fb-2907-40d9-9c65-4028c9e85256
  question: Что описывает функциональное требование?
  answer: 'Проверяемое поведение системы при определённых условиях: вход, действие,
    результат и ошибки. Оно связано с потребностью и не обязано фиксировать внутреннюю
    реализацию.'
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 2d01eaa6-f268-42e8-8b11-e639094bec82
  question: Чем user story отличается от use case?
  answer: Story кратко выражает роль, цель и ценность; use case подробно описывает
    взаимодействие актёра с системой, предусловия, основной и альтернативные потоки.
  category: Форматы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 1a123ccd-84a2-4379-b215-146962a67e59
  question: Какие элементы нужны для проверяемого use case?
  answer: Цель и актёр, предусловия, триггер, основной поток, альтернативы и ошибки,
    постусловия и бизнес-правила.
  category: Use case
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
