topic: "Функциональные требования"
cards:
  - question: "Что описывает функциональное требование?"
    answer: "Проверяемое поведение системы при определённых условиях: вход, действие, результат и ошибки. Оно связано с потребностью и не обязано фиксировать внутреннюю реализацию."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем user story отличается от use case?"
    answer: "Story кратко выражает роль, цель и ценность; use case подробно описывает взаимодействие актёра с системой, предусловия, основной и альтернативные потоки."
    category: "Форматы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие элементы нужны для проверяемого use case?"
    answer: "Цель и актёр, предусловия, триггер, основной поток, альтернативы и ошибки, постусловия и бизнес-правила."
    category: "Use case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем предусловие сценария отличается от шага?"
    answer: "Предусловие истинно до начала сценария; шаг — действие или реакция внутри него. Их смешение затрудняет тестирование альтернатив."
    category: "Use case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем альтернативный поток отличается от исключительного?"
    answer: "Альтернативный поток даёт допустимый вариант результата; исключительный описывает ошибку или невозможность продолжить. Для обоих нужен явный итог состояния."
    category: "Use case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сформулировать бизнес-правило отдельно от экранного сценария?"
    answer: "Определить условие и результат независимо от интерфейса, затем связать правило с применимыми сценариями, API и фоновыми процессами."
    category: "Бизнес-правила"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему требование «проверить корректность данных» плохо подходит для разработки?"
    answer: "Оно не задаёт поля, допустимые значения, взаимные ограничения и реакцию на нарушение. Нужны конкретные правила и ошибки."
    category: "Качество требования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать поведение при повторном запросе на создание ресурса?"
    answer: "Уточнить ключ идемпотентности или бизнес-ключ, результат повтора и конфликтов, а также поведение после таймаута."
    category: "Повторы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какие состояния объекта стоит выделить при описании жизненного цикла заявки?"
    answer: "Те, для которых различаются разрешённые действия и переходы. У каждого перехода нужны триггер, права, условия и побочные эффекты."
    category: "Состояния"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему список статусов без правил переходов неполон?"
    answer: "Он не отвечает, кто и когда меняет статус, что происходит при повторе или конкуренции и как система реагирует на запрещённый переход."
    category: "Состояния"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать права на действие в функциональном требовании?"
    answer: "Указать полномочие, область данных и условие доступа к конкретному объекту. Одного названия роли часто недостаточно."
    category: "Авторизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно уточнить для операции удаления записи?"
    answer: "Мягкое или физическое удаление, права, связанные данные, последствия для истории и отчётов, восстановление и повторное удаление."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать поиск, чтобы разработчик и тестировщик одинаково его поняли?"
    answer: "Зафиксировать поля, тип сопоставления, регистр, пустой запрос, сортировку, пагинацию, права и ограничения объёма."
    category: "Поиск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему для денежных значений нужно определить валюту и округление?"
    answer: "Число без валюты и точности неоднозначно. Требуются правила хранения, округления, допустимые значения и конвертация."
    category: "Бизнес-правила"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно уточнить для поля «дата операции»?"
    answer: "Календарная дата это или момент времени, временную зону, источник значения, правила отображения и поведение на границе суток."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сформулировать критерий приёмки для запрета операции сверх лимита?"
    answer: "Задать исходные условия, лимит, действие и наблюдаемый результат: операция не создана, возвращена заданная ошибка, остаток не изменён. Отдельно проверить границу."
    category: "Критерии приёмки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем критерий приёмки отличается от тест-кейса?"
    answer: "Критерий фиксирует условие принятия и ожидаемое поведение; тест-кейс детализирует данные, шаги и проверку конкретного варианта."
    category: "Критерии приёмки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда таблица решений полезнее длинного текста условий?"
    answer: "Когда результат зависит от нескольких независимых условий: таблица показывает комбинации и обнаруживает пропуски или противоречия."
    category: "Моделирование правил"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем указывать поведение при частичном успехе пакетной операции?"
    answer: "Иначе неизвестно, сохраняются ли успешные элементы, откатывается ли пакет и как клиент узнаёт об ошибках; это влияет на повторы и транзакции."
    category: "Пакетные операции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие вопросы задать для операции «отменить платёж»?"
    answer: "Уточнить допустимые состояния и сроки, права, исполнен ли платёж внешней системой, смысл повторной отмены и отражение компенсации."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему не стоит прятать бизнес-правило только в макете экрана?"
    answer: "Макет не определяет поведение API и фоновых процессов. Правило нужно записать отдельно и связать со сценариями."
    category: "Качество требования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как описать уведомление пользователя как функциональное требование?"
    answer: "Указать событие, получателей, канал, содержание, срок, повторы и реакцию на ошибку доставки."
    category: "Уведомления"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если при выборе варианта формы меняется набор обязательных полей?"
    answer: "Задать условия обязательности и допустимости каждого поля, серверную валидацию и судьбу уже введённых значений при смене варианта."
    category: "Формы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как определить, что два требования дублируют друг друга?"
    answer: "Сравнить цель, условия, объект и результат. Если они описывают одно правило, оставить единый источник и ссылки; если условия разные, явно разграничить область применения."
    category: "Качество требования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

