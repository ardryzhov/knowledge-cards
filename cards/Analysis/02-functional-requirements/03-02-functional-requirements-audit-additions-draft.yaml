topic: "Функциональные требования"
cards:
  - question: "Чем идентификация, аутентификация и авторизация отличаются в пользовательском сценарии?"
    answer: "Идентификация устанавливает заявленную личность или идентификатор пользователя, аутентификация проверяет доказательство этой личности, авторизация решает, какое действие с конкретным ресурсом разрешено. Требование к входу не заменяет требование к правам на операцию."
    category: "Права доступа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно описать аналитику помимо макета успешного экрана новой операции?"
    answer: "Состояния загрузки, пустых данных и ошибок, валидацию, права доступа и результат асинхронной операции. Макет помогает обсудить интерфейс, но эти правила должны быть проверяемы вне картинки."
    category: "UI и сценарии"
    context: null
