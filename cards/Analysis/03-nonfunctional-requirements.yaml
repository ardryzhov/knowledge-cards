- id: 18a1d765-e93b-4837-bf82-984a69b3f5d5
  question: Чем ограничение проекта отличается от нефункционального требования?
  answer: Ограничение задаёт обязательные рамки решения, например разрешённую платформу;
    NFR задаёт требуемое качество работы. Некоторые требования одновременно влияют
