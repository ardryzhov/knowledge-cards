- id: 500ee9ee-a110-4f5a-90c3-5fdb2bde49ab
  question: Чем доступность сервиса отличается от его надёжности?
  answer: Доступность описывает способность обслуживать запросы в заданный момент
    или период; надёжность шире и включает частоту и характер отказов. Метрика зависит
    от того, что считается успешной операцией.
  category: Доступность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 229efd57-86b8-43a9-988c-7d69336a302b
  question: Как перевести «доступность 99,9%» в проверяемое требование?
  answer: Определить границу сервиса, метод измерения, период, допустимые исключения
    и показатель успешных запросов или времени доступности. Процент без этих условий
    неоднозначен.
  category: Доступность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0733ee45-7601-4cd3-a726-7f839d2204e8
  question: Чем RPO отличается от RTO?
  answer: RPO — максимально допустимая потеря данных по времени; RTO — максимально
    допустимое время восстановления сервиса. Это разные цели для резервирования и
    восстановления.
  category: Восстановление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 30a7f5f7-cf3c-4273-8f20-d2da48b16afa
  question: Какие вопросы задать при требовании «данные нельзя терять»?
  answer: Уточнить какие данные и на каком этапе, допустимое окно потерь, виды отказов,
    подтверждение записи и восстановление из резервной копии. Абсолютное «никогда»
    без модели отказов непроверяемо.
  category: Сохранность данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 856d828f-6cb0-4064-8776-c716ce281df3
  question: Что нужно указать в требовании к хранению персональных данных?
  answer: Категории данных, цели и срок хранения, доступ, шифрование при необходимости,
    аудит, удаление и применимые правила организации и закона.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
