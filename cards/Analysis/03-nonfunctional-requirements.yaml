- id: ae5bd5d3-b796-43b4-b521-f1ab7f95316c
  question: Как проверять требование к восстановлению после сбоя?
  answer: Провести контролируемый сценарий отказа и восстановления, измерить RTO и
    RPO, проверить целостность данных и зафиксировать результат.
