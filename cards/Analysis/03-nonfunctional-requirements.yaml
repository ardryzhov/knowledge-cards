- id: dea1049c-1086-49bb-9c21-242515530ffa
  question: Почему требование к логированию не сводится к «логировать все ошибки»?
  answer: Нужны уровни и структура событий, корреляционный идентификатор, чувствительные
    поля, хранение и возможность найти конкретную операцию.
  category: Наблюдаемость
  context: 
