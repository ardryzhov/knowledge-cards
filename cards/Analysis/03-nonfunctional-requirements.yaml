- id: 6e9d3595-7db8-48ba-ae69-e2abd11c94fe
  question: Чем нефункциональное требование отличается от функционального?
  answer: Функциональное задаёт поведение системы; нефункциональное — измеримые свойства
    и ограничения этого поведения, например задержку, доступность или безопасность.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
