- id: c6eb3bc6-ca31-408e-a7c0-bf0b0481add5
  question: Чем p95 задержки полезнее среднего при описании пользовательского опыта?
  answer: Среднее может скрывать медленный хвост. p95 показывает порог, в который
    укладываются 95% наблюдений; вместе с ним нужны объём выборки и интервал измерения.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8ad8d213-74ae-4565-a1d7-953db9046b4d
  question: Чем throughput отличается от latency?
  answer: Throughput — число завершённых операций за единицу времени; latency — время
    одной операции. Рост нагрузки может поднять throughput до предела и одновременно
    резко ухудшить latency.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 390a29f2-461a-40c8-9dc0-40a4b490250f
  question: Как уточнить требование «система должна выдерживать 10 тысяч пользователей»?
  answer: Нужно узнать одновременность, операции, интенсивность, долю чтений и записей,
    размер данных, длительность пика и приемлемые задержки.
  category: Нагрузка
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
