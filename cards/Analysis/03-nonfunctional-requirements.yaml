- id: 323187dc-c312-48a3-823d-2f8d6d2db895
  question: Какие метрики нужны для асинхронной обработки заявок?
  answer: Например возраст старейшей заявки, размер очереди, скорость поступления
    и обработки, доля ошибок и повторов. Метрики привязывают к целям задержки и алертам.
  category: Наблюдаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 03feaec9-67b8-4474-a130-2ece245a6205
  question: Чем масштабируемость отличается от производительности?
  answer: Производительность описывает текущую скорость или задержку; масштабируемость
    — как показатели меняются при росте ресурсов и нагрузки. Требование должно задавать
    диапазон нагрузки и критерий.
  category: Масштабирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9c0c9702-cc59-48a0-8cda-3b6535ea1f1e
  question: Как сформулировать требование к деградации при отказе внешнего сервиса?
  answer: Указать зависимость, допустимый режим работы, ответ пользователю, очередь
    или повтор, предел ожидания и восстановление. Не все функции обязаны оставаться
    доступными.
  category: Отказоустойчивость
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 104e5c75-0f50-44d0-a8d4-4c09a6abf095
  question: Почему таймаут внешнего вызова является частью нефункционального контракта?
  answer: Он ограничивает время ожидания и расход ресурсов; без него зависание внешней
    системы может сорвать целевую задержку и доступность основного сервиса.
  category: Отказоустойчивость
