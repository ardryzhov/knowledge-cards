- id: f9b28e46-515f-4043-946c-227335578a9c
  question: Почему фраза «система должна быть быстрой» непроверяема?
  answer: Не указаны операция, нагрузка, порог, доля запросов и период измерения.
    Нужно задать измеримую метрику и условия проверки.
  category: Измеримость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4003aa1d-73da-4331-a340-eb619baaec1d
  question: Как сформулировать требование к времени ответа API?
  answer: Указать операцию, профиль и объём нагрузки, процентиль задержки, порог,
    период и место измерения; отдельно определить обработку ошибок и холодного старта,
    если важно.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
