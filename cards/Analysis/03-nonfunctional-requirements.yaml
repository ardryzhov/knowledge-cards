- id: 319312c0-288c-4d7d-b2e9-4084fcdebe95
  question: Почему нужно указывать условия нагрузочного теста для проверки NFR?
  answer: Результат зависит от данных, окружения, нагрузки, прогрева, зависимостей
    и длительности прогона. Без условий цифра невоспроизводима.
