- id: 0d3ce0f0-444e-4caf-bf94-6b5a4c2682d8
  question: Что такое SLA, SLO и SLI в контексте требований?
  answer: 'SLI — измеряемый показатель, SLO — целевое значение показателя, SLA — договорное
    обязательство с условиями. Их нельзя смешивать: SLO может быть внутренним и строже
    SLA.'
  category: Уровень сервиса
  context: 
