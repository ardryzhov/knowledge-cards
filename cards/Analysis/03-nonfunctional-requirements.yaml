- id: b50977d8-43bd-4e89-b0a1-bee8b3a70c19
  question: Как описать требование к аудиту действий пользователя?
  answer: Определить события, идентификатор субъекта и объекта, результат, время,
    источник, срок хранения и защиту записей от изменения; исключить секреты и лишние
    персональные данные.
  category: Аудит
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
