topic: "Нефункциональные требования"
cards:
  - question: "Чем нефункциональное требование отличается от функционального?"
    answer: "Функциональное задаёт поведение системы; нефункциональное — измеримые свойства и ограничения этого поведения, например задержку, доступность или безопасность."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему фраза «система должна быть быстрой» непроверяема?"
    answer: "Не указаны операция, нагрузка, порог, доля запросов и период измерения. Нужно задать измеримую метрику и условия проверки."
    category: "Измеримость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сформулировать требование к времени ответа API?"
    answer: "Указать операцию, профиль и объём нагрузки, процентиль задержки, порог, период и место измерения; отдельно определить обработку ошибок и холодного старта, если важно."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем p95 задержки полезнее среднего при описании пользовательского опыта?"
    answer: "Среднее может скрывать медленный хвост. p95 показывает порог, в который укладываются 95% наблюдений; вместе с ним нужны объём выборки и интервал измерения."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем throughput отличается от latency?"
    answer: "Throughput — число завершённых операций за единицу времени; latency — время одной операции. Рост нагрузки может поднять throughput до предела и одновременно резко ухудшить latency."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как уточнить требование «система должна выдерживать 10 тысяч пользователей»?"
    answer: "Нужно узнать одновременность, операции, интенсивность, долю чтений и записей, размер данных, длительность пика и приемлемые задержки."
    category: "Нагрузка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем доступность сервиса отличается от его надёжности?"
    answer: "Доступность описывает способность обслуживать запросы в заданный момент или период; надёжность шире и включает частоту и характер отказов. Метрика зависит от того, что считается успешной операцией."
    category: "Доступность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как перевести «доступность 99,9%» в проверяемое требование?"
    answer: "Определить границу сервиса, метод измерения, период, допустимые исключения и показатель успешных запросов или времени доступности. Процент без этих условий неоднозначен."
    category: "Доступность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем RPO отличается от RTO?"
    answer: "RPO — максимально допустимая потеря данных по времени; RTO — максимально допустимое время восстановления сервиса. Это разные цели для резервирования и восстановления."
    category: "Восстановление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие вопросы задать при требовании «данные нельзя терять»?"
    answer: "Уточнить какие данные и на каком этапе, допустимое окно потерь, виды отказов, подтверждение записи и восстановление из резервной копии. Абсолютное «никогда» без модели отказов непроверяемо."
    category: "Сохранность данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно указать в требовании к хранению персональных данных?"
    answer: "Категории данных, цели и срок хранения, доступ, шифрование при необходимости, аудит, удаление и применимые правила организации и закона."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как описать требование к аудиту действий пользователя?"
    answer: "Определить события, идентификатор субъекта и объекта, результат, время, источник, срок хранения и защиту записей от изменения; исключить секреты и лишние персональные данные."
    category: "Аудит"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему требование к логированию не сводится к «логировать все ошибки»?"
    answer: "Нужны уровни и структура событий, корреляционный идентификатор, чувствительные поля, хранение и возможность найти конкретную операцию."
    category: "Наблюдаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие метрики нужны для асинхронной обработки заявок?"
    answer: "Например возраст старейшей заявки, размер очереди, скорость поступления и обработки, доля ошибок и повторов. Метрики привязывают к целям задержки и алертам."
    category: "Наблюдаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем масштабируемость отличается от производительности?"
    answer: "Производительность описывает текущую скорость или задержку; масштабируемость — как показатели меняются при росте ресурсов и нагрузки. Требование должно задавать диапазон нагрузки и критерий."
    category: "Масштабирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сформулировать требование к деградации при отказе внешнего сервиса?"
    answer: "Указать зависимость, допустимый режим работы, ответ пользователю, очередь или повтор, предел ожидания и восстановление. Не все функции обязаны оставаться доступными."
    category: "Отказоустойчивость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему таймаут внешнего вызова является частью нефункционального контракта?"
    answer: "Он ограничивает время ожидания и расход ресурсов; без него зависание внешней системы может сорвать целевую задержку и доступность основного сервиса."
    category: "Отказоустойчивость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое SLA, SLO и SLI в контексте требований?"
    answer: "SLI — измеряемый показатель, SLO — целевое значение показателя, SLA — договорное обязательство с условиями. Их нельзя смешивать: SLO может быть внутренним и строже SLA."
    category: "Уровень сервиса"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему нужно указывать условия нагрузочного теста для проверки NFR?"
    answer: "Результат зависит от данных, окружения, нагрузки, прогрева, зависимостей и длительности прогона. Без условий цифра невоспроизводима."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверять требование к восстановлению после сбоя?"
    answer: "Провести контролируемый сценарий отказа и восстановления, измерить RTO и RPO, проверить целостность данных и зафиксировать результат."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как учесть пиковую нагрузку в банковском сценарии?"
    answer: "Выделить календарные и событийные пики, профиль операций, объём данных и допустимую деградацию; проверить запас ресурсов и поведение очередей на выбранном горизонте."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему требования к безопасности нужно связывать с конкретной моделью угроз?"
    answer: "Иначе меры будут либо недостаточны, либо случайны. Нужно определить активы, злоумышленника, точки входа и последствия, затем выбрать проверяемые меры."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как описать требование к совместимости нового API со старыми клиентами?"
    answer: "Указать поддерживаемые версии клиентов и сценарии, правила добавления и удаления полей, срок поддержки и способ проверки контрактов."
    category: "Совместимость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем ограничение проекта отличается от нефункционального требования?"
    answer: "Ограничение задаёт обязательные рамки решения, например разрешённую платформу; NFR задаёт требуемое качество работы. Некоторые требования одновременно влияют на качество и выбор реализации — важно зафиксировать причину."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

