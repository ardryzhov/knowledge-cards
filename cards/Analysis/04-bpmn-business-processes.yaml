topic: BPMN и бизнес-процессы
cards:
- id: ee64bb50-081f-465d-a603-f44ac35c8ceb
  question: Для чего используют BPMN при системном анализе?
  answer: Чтобы согласованно показать участников, действия, события и развилки бизнес-процесса,
    выявить пропуски и границы ответственности. Диаграмма дополняет текстовые правила.
  category: Назначение
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 69fd96a2-737a-4f91-a854-c6c8b2fe30dc
  question: Чем pool отличается от lane?
  answer: Pool представляет участника взаимодействия, например организацию или отдельный
    процесс; lane делит работу внутри pool по ролям или подразделениям.
  category: Участники
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 65254a54-7d61-4b97-94dc-133ed01a082e
  question: Почему sequence flow нельзя проводить между разными pool?
  answer: Sequence flow задаёт порядок действий внутри одного процесса. Взаимодействие
    разных участников показывают message flow.
  category: Потоки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 787805c3-efbc-4487-9919-d6d49b1db982
  question: Чем message flow отличается от sequence flow?
  answer: Message flow показывает обмен сообщениями между участниками, sequence flow
    — порядок выполнения элементов внутри процесса.
  category: Потоки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 371199e5-e83c-4f8f-b327-125e42795a36
  question: Что обозначает start event?
  answer: 'Событие, которое запускает экземпляр процесса. Его тип уточняет способ
    запуска: например сообщение или таймер; не всякий процесс начинается ручным действием.'
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 3c23e186-06ec-4f1a-a333-94aa1786614f
  question: Чем end event отличается от terminate end event?
  answer: Обычный end завершает пришедшую ветку; terminate end прекращает весь соответствующий
    процесс или подпроцесс и активные ветви в его области.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: fa8703db-607f-4ae4-b47a-9a0554637524
  question: Что означает intermediate event в процессе?
  answer: Событие между началом и концом, которое отражает ожидание или наступление
    значимого факта, например сообщения, таймера или ошибки в применимой форме.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6857c6cd-8a76-4640-a485-f365879221d2
  question: Когда использовать timer event?
  answer: Когда процесс запускается или продолжает выполнение по времени либо после
    ожидания, например при истечении срока ответа. Нужно определить календарь и зону
    времени вне одной иконки.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 713334f2-0c6d-4bf3-9566-10665fcc8c0f
  question: Чем boundary event отличается от события внутри последовательного потока?
  answer: Boundary event прикрепляют к задаче или подпроцессу для реакции на событие
    во время их выполнения; он может прервать активность или создать параллельную
    ветку.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8001a832-2092-4e27-83ce-48bac39843fc
  question: В чём разница между interrupting и non-interrupting boundary event?
  answer: Interrupting прекращает выполняемую активность и переводит поток на обработку
    события; non-interrupting запускает дополнительную ветку, сохраняя основную.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 90b1c879-4376-4f95-b7f5-d244ae3eb94e
  question: Как работает exclusive gateway?
  answer: Выбирает одну исходящую ветку по условиям, а при слиянии не синхронизирует
    параллельные токены. Важны взаимоисключающие условия и default-путь.
  category: Шлюзы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c520c257-eb4f-4ff8-8dd0-db1a9e89203e
  question: Как работает parallel gateway при разветвлении и слиянии?
  answer: На разветвлении запускает все исходящие ветви; на слиянии ждёт требуемые
    входящие потоки. Ошибка в паре разветвления и слияния может привести к зависанию
    процесса.
  category: Шлюзы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 6bc06963-4284-413c-b846-2279e4d0b071
  question: Чем inclusive gateway отличается от exclusive?
  answer: Inclusive может выбрать одну или несколько ветвей по истинным условиям;
    при слиянии синхронизирует активированные ветви. Exclusive выбирает одну.
  category: Шлюзы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 3151fbfe-13ec-4194-9a8b-302ebde46552
  question: Когда нужен event-based gateway?
  answer: Когда дальнейшая ветка определяется тем, какое из ожидаемых событий наступит
    первым, например ответ клиента или таймаут, а не вычислением условий над данными.
  category: Шлюзы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c9da6df5-d918-4d1c-8828-3e9d30d8f0aa
  question: Почему gateway не должен заменять описание бизнес-правила?
  answer: Он показывает развилку, но критерии выбора, вычисления и исключения требуют
    явного текста или таблицы решений.
  category: Качество модели
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fc94fd1c-0aa1-4837-a594-59f5fc79f151
  question: Чем task отличается от subprocess?
  answer: Task — единичная работа на выбранном уровне детализации; subprocess группирует
    последовательность действий и позволяет раскрыть её отдельно.
  category: Декомпозиция процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: eaba8af9-62c2-4803-8e98-01c382c1b575
  question: Когда полезен collapsed subprocess?
  answer: Когда основная схема перегружена деталями. Свёрнутый подпроцесс сохраняет
    читаемость, а отдельная схема раскрывает внутренние шаги.
  category: Декомпозиция процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2fa884e1-978b-4420-92c6-ae5d0c7a9d23
  question: Зачем явно показывать альтернативный путь при отказе внешней системы?
  answer: Иначе модель описывает только идеальный сценарий и не даёт понять, кто реагирует
    на ошибку, сколько ждать и как завершается процесс.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7de82ca8-e193-4c25-acf6-8ffc1237b5eb
  question: Как из BPMN-схемы выявить интеграции?
  answer: Искать границы pool, обмены сообщениями и задачи внешних систем; для каждого
    обмена уточнить контракт, корреляцию, таймаут, повтор и ошибку.
  category: Интеграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f655f95d-f271-4f9d-a98f-48b65d769e0e
  question: Что такое token в объяснении выполнения BPMN?
  answer: Это концептуальный маркер продвижения потока по процессу. Он помогает понять
    параллельные ветки и места ожидания, но не обязательно соответствует физическому
    объекту в приложении.
  category: Семантика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8eb2fcb2-ccda-4930-83aa-60e66ff1918a
  question: Почему схема с одной lane «Система» часто недостаточна?
  answer: Она скрывает владельцев действий и границы взаимодействия. Нужно отделить
    пользователя, сервисы и внешних участников там, где это существенно для процесса.
  category: Качество модели
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: cdbee0dc-c4ac-420c-971c-06da75b9b25c
  question: Как проверить BPMN-схему на неполные пути?
  answer: Проследить каждый старт до допустимого завершения, проверить условия шлюзов,
    необработанные ошибки, таймауты и зависшие ветви.
  category: Проверка модели
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 577f7fa0-7807-4358-a89d-06f970d04966
  question: Чем BPMN полезнее обычной блок-схемы для межкомандного процесса?
  answer: Единая нотация различает участников, порядок действий, сообщения и типы
    событий. Это облегчает проверку взаимодействий и исключений.
  category: Назначение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c5a88089-f53c-4cb3-8ff1-c1b1e6d2db6b
  question: Когда BPMN не стоит использовать как единственный артефакт требования?
  answer: Когда важны точные поля API, правила расчёта, модель данных или требования
    к производительности. Для них нужны отдельные контракты и текстовые условия.
  category: Границы нотации
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2f766971-9ab8-4edd-b623-cd9c8ec88560
  question: Чем ошибка BPMN отличается от сообщения об отрицательном бизнес-решении?
  answer: Ошибка моделирует исключительную ситуацию выполнения задачи или подпроцесса;
    отрицательное бизнес-решение может быть обычным результатом процесса и отображаться
    как ветка с условием или сообщением.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2697d05e-f970-49c8-9eb6-62de62f9716c
  question: Когда использовать call activity вместо обычного subprocess?
  answer: Когда нужно сослаться на отдельный переиспользуемый процесс с собственным
    определением. Обычный subprocess описывает вложенные действия внутри текущей модели.
  category: Декомпозиция процесса
