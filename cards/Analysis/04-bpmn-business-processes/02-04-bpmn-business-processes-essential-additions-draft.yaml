topic: "BPMN и бизнес-процессы"
cards:
  - question: "Чем ошибка BPMN отличается от сообщения об отрицательном бизнес-решении?"
    answer: "Ошибка моделирует исключительную ситуацию выполнения задачи или подпроцесса; отрицательное бизнес-решение может быть обычным результатом процесса и отображаться как ветка с условием или сообщением."
    category: "События"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда использовать call activity вместо обычного subprocess?"
    answer: "Когда нужно сослаться на отдельный переиспользуемый процесс с собственным определением. Обычный subprocess описывает вложенные действия внутри текущей модели."
    category: "Декомпозиция процесса"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
