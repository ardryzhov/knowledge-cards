topic: "UML и поведение системы"
cards:
  - question: "Чем include отличается от extend на use case diagram?"
    answer: "include выделяет обязательное повторно используемое поведение, вызываемое базовым случаем; extend добавляет условное расширение в определённой точке базового случая. Для точной логики всё равно нужен текст сценария."
    category: "Use case diagram"
