topic: "UML и поведение системы"
cards:
  - question: "Чем class diagram отличается от ER-диаграммы?"
    answer: "Class diagram моделирует классы, их атрибуты, операции и отношения в программной модели; ER-диаграмма моделирует сущности, атрибуты и связи данных. Они не обязаны совпадать один к одному."
