- id: f638ffd4-8ed0-4531-90a6-331cfa64f4c8
  question: Чем концептуальная модель данных отличается от логической и физической?
  answer: Концептуальная фиксирует бизнес-сущности и связи; логическая уточняет атрибуты
    и правила без привязки к конкретной СУБД; физическая задаёт таблицы, типы, индексы
    и ограничения конкретной БД.
  category: Уровни модели
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 340c68f5-feb7-464d-96e6-c82358fbc08a
  question: Как отличить бизнес-сущность от её атрибута?
  answer: Сущность имеет собственную идентичность и жизненный цикл; атрибут описывает
    свойство другой сущности. Решение зависит от правил предметной области, а не от
    числа полей.
  category: Сущности
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 62af9258-8cfd-4a3d-ab9a-2eddeb425545
  question: Что означает связь один-ко-многим в ER-модели?
  answer: Одному экземпляру первой сущности может соответствовать несколько экземпляров
    второй; обязательность связи и минимальная кратность задаются отдельно.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a6d2376a-0188-4f4f-880f-9690e804e088
  question: Почему кратность связи недостаточна без указания обязательности?
  answer: "«Много» может означать ноль и более или один и более; это разные инварианты
    и ограничения БД."
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
