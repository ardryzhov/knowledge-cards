- id: f2e59f17-ffc5-4d9f-9ded-46bc8670afc4
  question: Что означает нормализация данных и зачем она нужна?
  answer: Разделение данных по зависимостям уменьшает дублирование и аномалии вставки,
    изменения и удаления. Денормализацию вводят осознанно ради чтения с планом поддержания
    согласованности.
  category: Нормализация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 62a536b2-93fe-41ca-964e-c31b820e4f0f
  question: Как распознать нарушение первой нормальной формы в прикладной таблице?
  answer: В ячейке хранится список однотипных значений или повторяющиеся группы полей.
    Нужно определить отдельные записи и связи, если по элементам требуются независимые
    операции.
  category: Нормализация
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 6668f4f1-7970-48d3-a8ad-2824e8333e5f
  question: Почему хранение текущего статуса и истории статусов требует двух разных
    решений?
  answer: Текущий статус нужен для быстрых проверок, история — для аудита и восстановления
    последовательности. Нужно определить источник истины, правила обновления и согласованность
    между ними.
  category: История
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: aa0e308f-1801-429b-9d97-ca2b51eccdc2
  question: Когда нужна отдельная таблица связи многие-ко-многим?
  answer: Когда экземпляр каждой сущности связан с несколькими экземплярами другой.
    Таблица связи хранит пары ключей и при необходимости атрибуты самой связи.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fb805448-42f0-492b-92e6-9f406a95f3fe
  question: Что нужно определить для nullable поля в модели данных?
  answer: Означает ли NULL отсутствие, неизвестность или неприменимость; когда поле
    заполняется и как это влияет на правила, поиск и отчёты.
  category: Атрибуты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 14300c1e-075c-44cb-9d4c-aa5d79bb8e04
  question: Почему нельзя использовать один столбец «дата» без уточнения смысла?
  answer: Дата события, дата записи в систему и бизнес-дата могут различаться. Нужны
    точная семантика, временная зона и источник значения.
  category: Время
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: de571c24-213a-4494-8d04-a9dd0eabf98d
  question: Как выбрать между отдельным полем и JSON для бизнес-атрибута?
  answer: Если поле участвует в правилах, поиске, отчётах и ограничениях, явный типизированный
    столбец обычно проще контролировать. JSON подходит для гибких или редко используемых
    структур, но требует правил схемы и индексации.
  category: Физическая модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d0714654-b1cf-402b-993d-106ed243d3a2
  question: Зачем указывать владельца данных и источник истины?
  answer: Это определяет, где разрешено менять значение, как разрешать расхождения
    и какой сервис отвечает за качество и публикацию данных.
  category: Владение данными
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 685c8964-ba95-487c-918e-c47926aefad3
  question: Как моделировать удаление данных при наличии юридического срока хранения?
  answer: Разделить скрытие из пользовательского сценария, архивирование, анонимизацию
    и физическое удаление; определить сроки, доступ и связанные записи.
  category: Жизненный цикл
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 335ea951-a7f0-41bb-a1f5-bca4d9c23d14
  question: Что нужно учесть при моделировании справочника?
  answer: Кто владеет значениями, как меняются коды, нужны ли версии и даты действия,
    как обрабатываются неизвестные и устаревшие значения.
  category: Справочники
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b7203825-c591-4d75-a067-f9c69bbc2704
  question: Почему изменение схемы БД требует анализа старых и новых версий приложения?
  answer: Во время развёртывания обе версии могут работать одновременно. Миграция
    должна учитывать совместимость чтения и записи, порядок добавления полей и удаление
    старого контракта.
  category: Эволюция схемы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 8a2dec4a-8da9-4ebf-80a6-e3864ba2a58f
  question: Чем логическая связь между сервисами отличается от foreign key в общей
    БД?
  answer: Логическая связь задаёт идентификатор и правила согласования через контракт;
    foreign key контролирует целостность внутри одной БД. Межсервисную связь нельзя
    считать синхронно проверенной без специального механизма.
  category: Распределённые данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: fac3e572-99d6-48a6-98c5-68d9f370f1db
  question: Как определить границу агрегата для изменения нескольких сущностей?
  answer: Искать инварианты, которые должны соблюдаться атомарно, и операции, меняющие
    их вместе. Слишком крупный агрегат усиливает конкуренцию и связанность.
  category: Инварианты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7cf0d0ab-32be-4d7b-a75a-d468af968c81
  question: Что проверить в модели данных для операции «перевод денег»?
  answer: Идентификаторы счетов и операции, сумму и валюту, состояние, связи с проводками,
    идемпотентность, порядок событий и правила аудита. Денежный остаток и история
    должны иметь понятный источник истины.
  category: Практический кейс
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 773c811d-bdf0-4a7b-94e5-b59771b791d4
  question: Почему ER-диаграмма сама по себе не описывает все правила данных?
  answer: Она показывает структуру и связи, но не все условия переходов, права, расчёты
    и зависимость от времени. Эти правила нужно описать отдельно.
  category: Границы модели
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3ccea30f-fb9e-4478-91bb-4e58468a8c69
  question: Как проверить модель данных на пропущенные сущности?
  answer: Пройти ключевые сценарии создания, изменения, поиска и удаления; для каждого
    факта спросить, где он хранится, кто владеет им и как восстановить историю.
  category: Проверка модели
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8000719b-50ac-4fb9-9f46-8921b0705c00
  question: Что проверяет третья нормальная форма при проектировании таблицы?
  answer: В таблице в 3НФ для каждой нетривиальной функциональной зависимости X →
    A либо X является суперключом, либо A входит в какой-либо кандидатный ключ. Практический
    сигнал нарушения — неключевой факт зависит от другого неключевого факта, из-за
    чего появляются аномалии обновления.
  category: Нормализация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c485c2da-2c9a-4d67-aef1-b1c2e15ddc07
  question: Как моделировать связь, которая действует только в определённый период?
  answer: У связи появляются даты или интервалы действия, правила пересечения периодов
    и ограничения на активные записи. Простая внешняя ссылка не хранит историю смены
    отношения.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 3b4cb2b7-428e-4c6d-836c-4cbe23d76b77
  question: Чем вторая нормальная форма отличается от первой?
  answer: 1НФ требует атомарных значений в рамках выбранной модели и отсутствия повторяющихся
    групп; 2НФ добавляет полную зависимость каждого неключевого атрибута от любого
    кандидатного ключа, а не только от части составного ключа.
  category: Нормализация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 03812bdf-7982-4185-967b-b6f15d2fb388
  question: Когда при анализе данных стоит рассмотреть нереляционное хранилище вместо
    PostgreSQL?
  answer: Когда характер данных и запросов плохо согласуется с реляционной моделью
    и подтверждённые требования оправдывают новый тип хранилища. Сравнить согласованность,
    способы поиска, объём, эволюцию схемы и эксплуатационную стоимость; NoSQL не означает
    отсутствие модели данных.
  category: Выбор хранилища
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
