- id: e7d33e22-66c8-4164-8caf-af174413664c
  question: Что такое первичный ключ и почему бизнес-идентификатор не всегда подходит
    для него?
  answer: Первичный ключ однозначно идентифицирует строку. Бизнес-идентификатор может
    измениться, повториться в разных областях или быть не известен при создании; его
    часто защищают отдельным UNIQUE.
  category: Ключи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 35d4c66b-a02c-4f30-814d-8d7f3845f30b
  question: Чем суррогатный ключ отличается от естественного?
  answer: Суррогатный создан для технической идентификации записи; естественный имеет
    смысл в предметной области. Выбор не отменяет уникальности бизнес-ключей.
  category: Ключи
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: dbaae19a-0057-4784-a8f3-89c14b166aa4
  question: Зачем определять уникальность пары полей на уровне БД?
  answer: Проверка в приложении может не выдержать конкурирующие запросы. UNIQUE на
    нужной комбинации сохраняет инвариант независимо от канала записи.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 41bf98de-8a39-4bd4-bfae-96666b27d52b
  question: Как определить составной бизнес-ключ?
  answer: Найти минимальный набор атрибутов, который должен однозначно определять
    объект в нужной области и периоде. Проверить изменения значений и повторное использование.
  category: Ключи
