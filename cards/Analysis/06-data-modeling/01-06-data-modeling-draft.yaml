topic: "Моделирование данных"
cards:
  - question: "Чем концептуальная модель данных отличается от логической и физической?"
    answer: "Концептуальная фиксирует бизнес-сущности и связи; логическая уточняет атрибуты и правила без привязки к конкретной СУБД; физическая задаёт таблицы, типы, индексы и ограничения конкретной БД."
    category: "Уровни модели"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как отличить бизнес-сущность от её атрибута?"
    answer: "Сущность имеет собственную идентичность и жизненный цикл; атрибут описывает свойство другой сущности. Решение зависит от правил предметной области, а не от числа полей."
    category: "Сущности"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает связь один-ко-многим в ER-модели?"
    answer: "Одному экземпляру первой сущности может соответствовать несколько экземпляров второй; обязательность связи и минимальная кратность задаются отдельно."
    category: "Связи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему кратность связи недостаточна без указания обязательности?"
    answer: "«Много» может означать ноль и более или один и более; это разные инварианты и ограничения БД."
    category: "Связи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое первичный ключ и почему бизнес-идентификатор не всегда подходит для него?"
    answer: "Первичный ключ однозначно идентифицирует строку. Бизнес-идентификатор может измениться, повториться в разных областях или быть не известен при создании; его часто защищают отдельным UNIQUE."
    category: "Ключи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем суррогатный ключ отличается от естественного?"
    answer: "Суррогатный создан для технической идентификации записи; естественный имеет смысл в предметной области. Выбор не отменяет уникальности бизнес-ключей."
    category: "Ключи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем определять уникальность пары полей на уровне БД?"
    answer: "Проверка в приложении может не выдержать конкурирующие запросы. UNIQUE на нужной комбинации сохраняет инвариант независимо от канала записи."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить составной бизнес-ключ?"
    answer: "Найти минимальный набор атрибутов, который должен однозначно определять объект в нужной области и периоде. Проверить изменения значений и повторное использование."
    category: "Ключи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает нормализация данных и зачем она нужна?"
    answer: "Разделение данных по зависимостям уменьшает дублирование и аномалии вставки, изменения и удаления. Денормализацию вводят осознанно ради чтения с планом поддержания согласованности."
    category: "Нормализация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как распознать нарушение первой нормальной формы в прикладной таблице?"
    answer: "В ячейке хранится список однотипных значений или повторяющиеся группы полей. Нужно определить отдельные записи и связи, если по элементам требуются независимые операции."
    category: "Нормализация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему хранение текущего статуса и истории статусов требует двух разных решений?"
    answer: "Текущий статус нужен для быстрых проверок, история — для аудита и восстановления последовательности. Нужно определить источник истины, правила обновления и согласованность между ними."
    category: "История"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда нужна отдельная таблица связи многие-ко-многим?"
    answer: "Когда экземпляр каждой сущности связан с несколькими экземплярами другой. Таблица связи хранит пары ключей и при необходимости атрибуты самой связи."
    category: "Связи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно определить для nullable поля в модели данных?"
    answer: "Означает ли NULL отсутствие, неизвестность или неприменимость; когда поле заполняется и как это влияет на правила, поиск и отчёты."
    category: "Атрибуты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему нельзя использовать один столбец «дата» без уточнения смысла?"
    answer: "Дата события, дата записи в систему и бизнес-дата могут различаться. Нужны точная семантика, временная зона и источник значения."
    category: "Время"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выбрать между отдельным полем и JSON для бизнес-атрибута?"
    answer: "Если поле участвует в правилах, поиске, отчётах и ограничениях, явный типизированный столбец обычно проще контролировать. JSON подходит для гибких или редко используемых структур, но требует правил схемы и индексации."
    category: "Физическая модель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем указывать владельца данных и источник истины?"
    answer: "Это определяет, где разрешено менять значение, как разрешать расхождения и какой сервис отвечает за качество и публикацию данных."
    category: "Владение данными"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как моделировать удаление данных при наличии юридического срока хранения?"
    answer: "Разделить скрытие из пользовательского сценария, архивирование, анонимизацию и физическое удаление; определить сроки, доступ и связанные записи."
    category: "Жизненный цикл"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно учесть при моделировании справочника?"
    answer: "Кто владеет значениями, как меняются коды, нужны ли версии и даты действия, как обрабатываются неизвестные и устаревшие значения."
    category: "Справочники"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему изменение схемы БД требует анализа старых и новых версий приложения?"
    answer: "Во время развёртывания обе версии могут работать одновременно. Миграция должна учитывать совместимость чтения и записи, порядок добавления полей и удаление старого контракта."
    category: "Эволюция схемы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем логическая связь между сервисами отличается от foreign key в общей БД?"
    answer: "Логическая связь задаёт идентификатор и правила согласования через контракт; foreign key контролирует целостность внутри одной БД. Межсервисную связь нельзя считать синхронно проверенной без специального механизма."
    category: "Распределённые данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как определить границу агрегата для изменения нескольких сущностей?"
    answer: "Искать инварианты, которые должны соблюдаться атомарно, и операции, меняющие их вместе. Слишком крупный агрегат усиливает конкуренцию и связанность."
    category: "Инварианты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что проверить в модели данных для операции «перевод денег»?"
    answer: "Идентификаторы счетов и операции, сумму и валюту, состояние, связи с проводками, идемпотентность, порядок событий и правила аудита. Денежный остаток и история должны иметь понятный источник истины."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему ER-диаграмма сама по себе не описывает все правила данных?"
    answer: "Она показывает структуру и связи, но не все условия переходов, права, расчёты и зависимость от времени. Эти правила нужно описать отдельно."
    category: "Границы модели"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить модель данных на пропущенные сущности?"
    answer: "Пройти ключевые сценарии создания, изменения, поиска и удаления; для каждого факта спросить, где он хранится, кто владеет им и как восстановить историю."
    category: "Проверка модели"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

