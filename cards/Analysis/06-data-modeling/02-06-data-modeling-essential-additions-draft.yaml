topic: "Моделирование данных"
cards:
  - question: "Что проверяет третья нормальная форма при проектировании таблицы?"
    answer: "В таблице в 3НФ для каждой нетривиальной функциональной зависимости X → A либо X является суперключом, либо A входит в какой-либо кандидатный ключ. Практический сигнал нарушения — неключевой факт зависит от другого неключевого факта, из-за чего появляются аномалии обновления."
    category: "Нормализация"
    context: null
