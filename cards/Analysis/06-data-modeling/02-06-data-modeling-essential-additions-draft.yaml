    hint_2: null
    difficulty: medium
    code: null
  - question: "Как моделировать связь, которая действует только в определённый период?"
    answer: "У связи появляются даты или интервалы действия, правила пересечения периодов и ограничения на активные записи. Простая внешняя ссылка не хранит историю смены отношения."
    category: "Связи"
