topic: "Моделирование данных"
cards:
  - question: "Когда при анализе данных стоит рассмотреть нереляционное хранилище вместо PostgreSQL?"
    answer: "Когда характер данных и запросов плохо согласуется с реляционной моделью и подтверждённые требования оправдывают новый тип хранилища. Сравнить согласованность, способы поиска, объём, эволюцию схемы и эксплуатационную стоимость; NoSQL не означает отсутствие модели данных."
