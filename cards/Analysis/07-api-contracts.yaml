- id: 56b0179f-9f3a-4c7f-82d6-27ce2475b307
  question: Что входит в контракт HTTP API помимо URL?
  answer: Метод, параметры и тело запроса, типы и обязательность полей, ответы и ошибки,
    авторизация, ограничения, идемпотентность и правила совместимости.
  category: Состав контракта
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
