- id: 8a793dba-d24b-4aea-bd8c-b62ccb934671
  question: Чем ресурсный URL отличается от глагольного при проектировании REST API?
  answer: Ресурсный URL обозначает сущность или коллекцию, а действие выражается HTTP-методом.
    Для бизнес-команд возможны отдельные операции, но их семантика должна быть явной.
  category: REST
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c16dfcef-58c9-4a59-b86d-77a52eb084ca
  question: Чем PUT отличается от PATCH по смыслу контракта?
  answer: PUT задаёт замену состояния ресурса предоставленным представлением по контракту,
    PATCH — частичное изменение. Для обоих нужно определить поведение отсутствующих
    полей и конкурентных обновлений.
  category: HTTP методы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ede71517-1c20-424f-97d0-3729f398435a
  question: Что означает идемпотентность HTTP-метода?
  answer: Повтор одинакового запроса имеет тот же предполагаемый эффект на сервере,
    что один запрос; ответы и логи могут отличаться. Это важно при сетевых повторах.
  category: HTTP методы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 2c529aa4-28d4-401b-a71d-d6bdd0c1fbe0
  question: Почему POST может требовать idempotency key?
  answer: После таймаута клиент не знает, создан ли объект. Ключ позволяет серверу
    распознать повтор логически той же операции и вернуть согласованный результат
    без второго создания.
  category: Повторы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e75a7157-34f7-482c-bbad-db64d8a8fdbc
  question: Чем 400 отличается от 422 в API-контракте?
  answer: 400 означает некорректный запрос в широком смысле; 422 используется для
    синтаксически понятного содержимого, которое невозможно обработать по семантике.
    Важнее единообразно описать границу и коды своего API.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dca638d8-5682-4c45-9dfa-bceb2cce95d7
  question: Когда возвращать 409 Conflict?
  answer: Когда операция конфликтует с текущим состоянием ресурса или ограничением,
    например попытка перехода в недопустимый статус. Причину и способ разрешения полезно
    указать в теле ошибки.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dc24964a-766a-497c-ac8c-60ad2e7326b0
  question: Чем 401 отличается от 403?
  answer: 401 означает, что для доступа требуется успешная аутентификация или она
    не прошла; 403 — сервер распознал запрос, но отказывает в доступе. Реальная политика
    скрытия существования ресурса может менять выбор ответа.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 783ab399-6352-43f2-89a5-8c8e855ddb13
  question: Почему тело ошибки должно иметь стабильную схему?
  answer: Клиенту нужны машинный код, понятное сообщение, детали нарушений и идентификатор
    запроса; нестабильный текст нельзя безопасно парсить как контракт.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3dc186b9-abf8-4263-a220-1b22e7381a82
  question: Как описать nullable и отсутствующее поле в JSON-контракте?
  answer: Указать, разрешён ли null, обязательно ли присутствие и чем отсутствие отличается
    от null при создании и обновлении. Эти варианты могут иметь разные бизнес-смыслы.
  category: Схема данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7d23e3bb-dcc3-45f8-8153-beeafef6a89a
  question: Почему изменение типа существующего поля обычно несовместимо?
  answer: Старый клиент ожидает прежний тип и может не распарсить ответ или отправить
    неверный запрос. Нужен план совместимости или новая версия контракта.
  category: Версионирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5110cf1d-5b58-4de8-bfb6-ab42de8d1a72
  question: Какие изменения в JSON-ответе обычно совместимы и при каких условиях?
  answer: Добавление необязательного поля обычно совместимо, если клиенты игнорируют
    неизвестные поля и не зависят от точного набора. Это условие нужно проверять контрактными
    тестами.
  category: Версионирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c907eb13-5457-4352-ba33-aea740316b29
  question: Что нужно описать для пагинации списка?
  answer: Размер страницы, сортировку, курсор или offset, правила следующей страницы,
    фильтры и поведение при изменении данных между запросами.
  category: Пагинация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 44c1e7dc-53e3-4c25-8a95-f90c7009e529
  question: Когда cursor pagination полезнее offset pagination?
  answer: При больших наборах и частых изменениях курсор по стабильному порядку может
    снизить стоимость и пропуски или дубли. Он требует однозначной сортировки и определения
    продолжения.
  category: Пагинация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 278a26a4-b6ab-4a3c-99ce-df14f2b8be86
  question: Зачем API-контракту явно задавать формат даты и временную зону?
  answer: Иначе клиенты по-разному трактуют момент времени. Для момента обычно указывают
    формат с offset или UTC, а для календарной даты — отдельный тип и смысл.
  category: Схема данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4dc9f393-2eb2-422f-b527-db6b3af56e49
  question: Как согласовать API до готовности реализации?
  answer: Зафиксировать OpenAPI или другой контракт, примеры, ошибки и правила безопасности;
    провести ревью с потребителями и тестированием, затем использовать контракт для
    моков и проверок.
  category: Процесс
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1d4048a1-5e88-418e-93cf-d315824c8ae8
  question: Что OpenAPI описывает хорошо, а что требует дополнительного текста?
  answer: OpenAPI формализует операции, параметры, схемы и ответы; сложные бизнес-инварианты,
    последовательность действий и нефункциональные условия обычно нужно пояснять отдельно.
  category: OpenAPI
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f577e744-c26e-4649-903e-d2f95d9dadca
  question: Чем контракт внешнего API отличается от внутреннего?
  answer: Оба требуют точности; внешний обычно сильнее ограничен независимым циклом
    релизов, совместимостью и публичной документацией. Внутренний тоже нельзя менять
    без анализа потребителей.
  category: Совместимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 226f859f-c368-4f16-bc47-1f0ffa26a451
  question: Как описать конкурентное обновление ресурса через HTTP?
  answer: Указать версию или ETag, условный запрос If-Match и результат при несовпадении.
    Это позволяет обнаружить потерянное обновление вместо тихого перезаписывания.
  category: Конкуренция
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: a4e8cc05-e1e4-4791-9e57-1ea47b66f669
  question: Когда API должен отвечать 202 Accepted?
  answer: Когда запрос принят к асинхронной обработке, но результат ещё не готов.
    Контракт должен указать, как узнать статус и итог, включая ошибку обработки.
  category: Асинхронность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b2927ec1-0d7d-4192-b8a7-f980b126cbc2
  question: Что уточнить для загрузки файла через API?
  answer: Размер и формат, способ передачи, проверку содержимого, ограничения безопасности,
    асинхронную обработку, результат ошибки и хранение.
  category: Файлы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b28c2178-374c-4dad-85ed-7ee756242314
  question: Почему нельзя считать пример JSON полным контрактом?
  answer: Пример показывает один случай, но не типы, обязательность, ограничения,
    альтернативы и ошибки. Нужна схема и текстовые правила.
  category: Качество контракта
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 60117c52-8853-443e-9ad4-37a9b8f59505
  question: Как описать фильтр по диапазону дат без неоднозначности?
  answer: Указать включительность границ, временную зону, тип значений и поведение
    пустых границ. Для временных интервалов часто удобен полуоткрытый диапазон.
  category: Фильтрация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b2f4a8be-44b0-4346-90d9-2ef2222418fe
  question: Как выявить сломанный API-контракт до релиза?
  answer: Сравнить новую схему со старой, проверить потребителей, выполнить контрактные
    тесты и пробные запросы на типичных и ошибочных сценариях.
  category: Проверка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: beb8b9a6-f110-44fa-9237-f00825f6be91
  question: Чем 200 OK, 201 Created и 204 No Content отличаются для успешного ответа?
  answer: 200 возвращает успешный результат с представлением по контракту; 201 сообщает
    о создании ресурса и обычно включает его идентификатор или Location; 204 означает
    успех без тела ответа.
  category: HTTP статусы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: fd0ca0ba-1a30-4af3-8de7-ac514c3e2e30
  question: Что нужно указать при ответе 429 Too Many Requests?
  answer: Описать ограничение запросов, область его действия и стратегию клиента;
    Retry-After полезен, когда сервер может сообщить срок ожидания.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2a269042-b1c1-49e2-ad17-2e6b97c7efd1
  question: Чем 502, 503 и 504 различаются при отказе зависимости?
  answer: 502 означает некорректный ответ от upstream, 503 — временную недоступность
    сервиса, 504 — истечение времени ожидания upstream у шлюза. Конкретный код зависит
    от роли сервиса и архитектуры.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0b2eb4d0-a8cb-4870-8fa5-a631ae930e52
  question: Какие различия между REST/JSON и SOAP важны для интеграционного контракта?
  answer: REST/JSON обычно описывает ресурсы и HTTP-семантику; SOAP использует XML-конверт
    и формальный контракт WSDL в распространённой практике. При выборе важны требования
    партнёра, безопасность, ошибки, инструменты и совместимость.
  category: Стили API
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bcdde627-71cc-47ab-84c3-a90feaa1211d
  question: Что нужно описать для авторизации клиента API?
  answer: Тип учётных данных, способ получения и передачи токена, область прав, срок
    жизни, ошибки 401/403 и правила обновления. Секреты и персональные данные не включают
    в примеры реальных запросов.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 479d9e3e-28be-4b3d-a102-a3043654d55c
  question: Что проверяют JSON Schema и XML Schema в контракте интеграции?
  answer: 'Они описывают структуру и ограничения данных: типы, обязательность и допустимые
    формы. Проверка схемы не доказывает выполнение бизнес-правил или авторизации.'
  category: Схема данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: af5a6945-5e95-4b7b-bff0-f9101aeba642
  question: Чем ответ 204 отличается от 404?
  answer: 204 означает успешную обработку без тела ответа; 404 означает, что сервер
    не нашёл целевой ресурс или не раскрывает его существование по политике доступа.
    Отсутствие тела не делает ответы равнозначными.
  category: HTTP статусы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 10d6c190-296b-4141-b46b-bf3631017dd0
  question: Почему GET не должен создавать бизнес-ресурс?
  answer: 'GET определён как безопасный метод: клиент и посредники могут повторять
    или предварительно запрашивать его, не ожидая изменения состояния по инициативе
    клиента. Создание ресурса через GET нарушает эту семантику.'
  category: HTTP методы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
