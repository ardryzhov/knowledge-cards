topic: "API-контракты"
cards:
  - question: "Что входит в контракт HTTP API помимо URL?"
    answer: "Метод, параметры и тело запроса, типы и обязательность полей, ответы и ошибки, авторизация, ограничения, идемпотентность и правила совместимости."
    category: "Состав контракта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем ресурсный URL отличается от глагольного при проектировании REST API?"
    answer: "Ресурсный URL обозначает сущность или коллекцию, а действие выражается HTTP-методом. Для бизнес-команд возможны отдельные операции, но их семантика должна быть явной."
    category: "REST"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем PUT отличается от PATCH по смыслу контракта?"
    answer: "PUT задаёт замену состояния ресурса предоставленным представлением по контракту, PATCH — частичное изменение. Для обоих нужно определить поведение отсутствующих полей и конкурентных обновлений."
    category: "HTTP методы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает идемпотентность HTTP-метода?"
    answer: "Повтор одинакового запроса имеет тот же предполагаемый эффект на сервере, что один запрос; ответы и логи могут отличаться. Это важно при сетевых повторах."
    category: "HTTP методы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему POST может требовать idempotency key?"
    answer: "После таймаута клиент не знает, создан ли объект. Ключ позволяет серверу распознать повтор логически той же операции и вернуть согласованный результат без второго создания."
    category: "Повторы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем 400 отличается от 422 в API-контракте?"
    answer: "400 означает некорректный запрос в широком смысле; 422 используется для синтаксически понятного содержимого, которое невозможно обработать по семантике. Важнее единообразно описать границу и коды своего API."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда возвращать 409 Conflict?"
    answer: "Когда операция конфликтует с текущим состоянием ресурса или ограничением, например попытка перехода в недопустимый статус. Причину и способ разрешения полезно указать в теле ошибки."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем 401 отличается от 403?"
    answer: "401 означает, что для доступа требуется успешная аутентификация или она не прошла; 403 — сервер распознал запрос, но отказывает в доступе. Реальная политика скрытия существования ресурса может менять выбор ответа."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему тело ошибки должно иметь стабильную схему?"
    answer: "Клиенту нужны машинный код, понятное сообщение, детали нарушений и идентификатор запроса; нестабильный текст нельзя безопасно парсить как контракт."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать nullable и отсутствующее поле в JSON-контракте?"
    answer: "Указать, разрешён ли null, обязательно ли присутствие и чем отсутствие отличается от null при создании и обновлении. Эти варианты могут иметь разные бизнес-смыслы."
    category: "Схема данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему изменение типа существующего поля обычно несовместимо?"
    answer: "Старый клиент ожидает прежний тип и может не распарсить ответ или отправить неверный запрос. Нужен план совместимости или новая версия контракта."
    category: "Версионирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие изменения в JSON-ответе обычно совместимы и при каких условиях?"
    answer: "Добавление необязательного поля обычно совместимо, если клиенты игнорируют неизвестные поля и не зависят от точного набора. Это условие нужно проверять контрактными тестами."
    category: "Версионирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что нужно описать для пагинации списка?"
    answer: "Размер страницы, сортировку, курсор или offset, правила следующей страницы, фильтры и поведение при изменении данных между запросами."
    category: "Пагинация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда cursor pagination полезнее offset pagination?"
    answer: "При больших наборах и частых изменениях курсор по стабильному порядку может снизить стоимость и пропуски или дубли. Он требует однозначной сортировки и определения продолжения."
    category: "Пагинация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем API-контракту явно задавать формат даты и временную зону?"
    answer: "Иначе клиенты по-разному трактуют момент времени. Для момента обычно указывают формат с offset или UTC, а для календарной даты — отдельный тип и смысл."
    category: "Схема данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как согласовать API до готовности реализации?"
    answer: "Зафиксировать OpenAPI или другой контракт, примеры, ошибки и правила безопасности; провести ревью с потребителями и тестированием, затем использовать контракт для моков и проверок."
    category: "Процесс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что OpenAPI описывает хорошо, а что требует дополнительного текста?"
    answer: "OpenAPI формализует операции, параметры, схемы и ответы; сложные бизнес-инварианты, последовательность действий и нефункциональные условия обычно нужно пояснять отдельно."
    category: "OpenAPI"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем контракт внешнего API отличается от внутреннего?"
    answer: "Оба требуют точности; внешний обычно сильнее ограничен независимым циклом релизов, совместимостью и публичной документацией. Внутренний тоже нельзя менять без анализа потребителей."
    category: "Совместимость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать конкурентное обновление ресурса через HTTP?"
    answer: "Указать версию или ETag, условный запрос If-Match и результат при несовпадении. Это позволяет обнаружить потерянное обновление вместо тихого перезаписывания."
    category: "Конкуренция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда API должен отвечать 202 Accepted?"
    answer: "Когда запрос принят к асинхронной обработке, но результат ещё не готов. Контракт должен указать, как узнать статус и итог, включая ошибку обработки."
    category: "Асинхронность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что уточнить для загрузки файла через API?"
    answer: "Размер и формат, способ передачи, проверку содержимого, ограничения безопасности, асинхронную обработку, результат ошибки и хранение."
    category: "Файлы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему нельзя считать пример JSON полным контрактом?"
    answer: "Пример показывает один случай, но не типы, обязательность, ограничения, альтернативы и ошибки. Нужна схема и текстовые правила."
    category: "Качество контракта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать фильтр по диапазону дат без неоднозначности?"
    answer: "Указать включительность границ, временную зону, тип значений и поведение пустых границ. Для временных интервалов часто удобен полуоткрытый диапазон."
    category: "Фильтрация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выявить сломанный API-контракт до релиза?"
    answer: "Сравнить новую схему со старой, проверить потребителей, выполнить контрактные тесты и пробные запросы на типичных и ошибочных сценариях."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

