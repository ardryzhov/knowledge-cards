topic: "API-контракты"
cards:
  - question: "Чем 200 OK, 201 Created и 204 No Content отличаются для успешного ответа?"
    answer: "200 возвращает успешный результат с представлением по контракту; 201 сообщает о создании ресурса и обычно включает его идентификатор или Location; 204 означает успех без тела ответа."
    category: "HTTP статусы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что нужно указать при ответе 429 Too Many Requests?"
    answer: "Описать ограничение запросов, область его действия и стратегию клиента; Retry-After полезен, когда сервер может сообщить срок ожидания."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем 502, 503 и 504 различаются при отказе зависимости?"
    answer: "502 означает некорректный ответ от upstream, 503 — временную недоступность сервиса, 504 — истечение времени ожидания upstream у шлюза. Конкретный код зависит от роли сервиса и архитектуры."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие различия между REST/JSON и SOAP важны для интеграционного контракта?"
    answer: "REST/JSON обычно описывает ресурсы и HTTP-семантику; SOAP использует XML-конверт и формальный контракт WSDL в распространённой практике. При выборе важны требования партнёра, безопасность, ошибки, инструменты и совместимость."
    category: "Стили API"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно описать для авторизации клиента API?"
    answer: "Тип учётных данных, способ получения и передачи токена, область прав, срок жизни, ошибки 401/403 и правила обновления. Секреты и персональные данные не включают в примеры реальных запросов."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

