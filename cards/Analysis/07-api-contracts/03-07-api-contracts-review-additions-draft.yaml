topic: "API-контракты"
cards:
  - question: "Что проверяют JSON Schema и XML Schema в контракте интеграции?"
    answer: "Они описывают структуру и ограничения данных: типы, обязательность и допустимые формы. Проверка схемы не доказывает выполнение бизнес-правил или авторизации."
    category: "Схема данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем ответ 204 отличается от 404?"
    answer: "204 означает успешную обработку без тела ответа; 404 означает, что сервер не нашёл целевой ресурс или не раскрывает его существование по политике доступа. Отсутствие тела не делает ответы равнозначными."
    category: "HTTP статусы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему GET не должен создавать бизнес-ресурс?"
    answer: "GET определён как безопасный метод: клиент и посредники могут повторять или предварительно запрашивать его, не ожидая изменения состояния по инициативе клиента. Создание ресурса через GET нарушает эту семантику."
    category: "HTTP методы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

