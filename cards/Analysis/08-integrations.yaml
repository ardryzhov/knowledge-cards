- id: 71cb5a84-c8ba-4c71-9d99-5289d7cf523d
  question: Как выбрать между синхронным API и асинхронным сообщением для взаимодействия
    сервисов?
  answer: Сравнить необходимость немедленного ответа, допустимую задержку, связанность
    по доступности, порядок, нагрузку и обработку ошибок. Выбор закрепляют контрактом
    результата и восстановления.
  category: Выбор взаимодействия
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 88d5ce0d-e644-44ba-9034-c0299a6f3868
  question: Чем команда отличается от события в интеграции?
  answer: Команда просит конкретного исполнителя выполнить действие; событие сообщает
    о состоявшемся факте и может иметь нескольких независимых потребителей.
  category: Семантика сообщений
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 2712321d-f201-4309-af1f-2570d0807d9d
  question: Какие поля нужны для корреляции асинхронного ответа с запросом?
  answer: Устойчивый идентификатор запроса или операции, идентификатор сообщения,
    источник и при необходимости версия. Нужно определить срок ожидания и обработку
    неизвестного ответа.
  category: Корреляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 955be6af-09cb-4cc5-8db9-5b2231eb1e96
  question: Почему доставка сообщения не означает успешное выполнение бизнес-операции?
  answer: Брокер подтверждает транспортное действие в своих границах; consumer ещё
    может не обработать сообщение или откатить изменение. Нужны отдельные статусы
    и подтверждение результата.
  category: Семантика доставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bddcac9d-e5bd-4be9-b839-5574246033db
  question: Что означает at-least-once для потребителя?
  answer: Сообщение может прийти повторно при сбое между обработкой и подтверждением.
    Потребитель должен быть идемпотентным или уметь распознавать уже обработанные
    сообщения.
  category: Семантика доставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 6463c33b-743d-4e67-9e98-3ef0f1c84150
  question: Как задать ключ идемпотентности для входящего события?
  answer: Использовать стабильный уникальный идентификатор бизнес-операции или события
    от producer; зафиксировать область уникальности и срок хранения дедупликации.
  category: Идемпотентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bfa509f8-c54b-4fd9-ae9e-221155934260
  question: Почему одинаковое событие может быть обработано дважды даже при надёжном
    брокере?
  answer: После изменения БД consumer может упасть до ack или commit offset, и брокер
    доставит запись снова. Надёжность транспорта не устраняет этот промежуток.
  category: Идемпотентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 214a371c-5a30-4bef-a60e-388ed79b75b8
  question: Как согласовать запись в БД и публикацию события без распределённой транзакции?
  answer: Сохранить бизнес-изменение и outbox-запись в одной локальной транзакции,
    затем публиковать outbox с повторами; consumer должен учитывать дубли.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 6c269358-688a-4578-a99e-5c237bc2c283
  question: Что нужно описать в контракте события помимо JSON-схемы?
  answer: Значение события, момент возникновения, ключ, порядок, гарантию доставки,
    версию, правила повтора, срок хранения и ответственность за ошибку.
  category: Контракт события
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c0edc65e-fabb-48a8-9fff-4c7fe99bf3a9
  question: Как изменение формата события повлияет на старого consumer?
  answer: Он может не понимать новое поле, тип или смысл, а новые consumers могут
    читать старые события. Нужны правила совместимости и порядок развёртывания версий.
  category: Версионирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e811aa60-cd7e-4077-ba70-aa238139c616
  question: Что нужно уточнить для интеграции с внешней системой, которая может отвечать
    30 секунд?
  answer: Срок ожидания пользователя, таймаут, асинхронный режим, отмену, повтор,
    лимит параллелизма и итог при неизвестном результате.
  category: Таймауты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 686d5a5c-f341-4b2c-bc64-34611cb5ab5f
  question: Когда повтор внешнего HTTP-запроса опасен?
  answer: Когда операция имеет побочный эффект и после таймаута неизвестно, выполнилась
    ли она. Нужны идемпотентный контракт, ключ запроса или проверка статуса.
  category: Повторы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c4a4f760-6736-4709-9882-0ba67906f214
  question: Почему retry без ограничения может усилить аварию?
  answer: Повторы увеличивают нагрузку на отказавшую зависимость и занимают ресурсы
    вызывающего сервиса. Нужны лимит попыток, backoff, jitter и общий deadline.
  category: Повторы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b842cea0-355a-4094-9b24-1d41b56db294
  question: Для чего нужна DLQ и какое решение она не заменяет?
  answer: DLQ изолирует сообщения, которые не удалось обработать по основной политике.
    Она не заменяет диагностику причины, исправление данных и управляемое повторное
    проигрывание.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5e914711-cc72-43fb-8cdf-6b59b65a87a7
  question: Как обрабатывать сообщение, которое пришло раньше события о создании объекта?
  answer: Зафиксировать требования к порядку и допустимой задержке; возможны отложенный
    повтор, хранение ожидающего события или запрос состояния у источника. Нельзя просто
    считать такое событие невозможным.
  category: Порядок
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 5e3a67ca-ee15-4294-a7d8-84cffbaf6e5b
  question: Какой порядок можно гарантировать в партиционированном потоке событий?
  answer: Обычно порядок задаётся внутри партиции или ключа, а не для всех сообщений.
    Контракт должен определить ключ и поведение при параллельной обработке.
  category: Порядок
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c1ab67e9-4929-4b9f-8a77-0111c07c5e0b
  question: Зачем определять владельца контракта интеграции?
  answer: Он согласует изменения, совместимость, сроки поддержки, мониторинг и разбор
    инцидентов. Без владельца потребители могут узнать о несовместимом изменении после
    релиза.
  category: Управление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8aaa4a1d-5be2-430d-8c99-d8a9283488f9
  question: Как описать частичную недоступность внешней системы?
  answer: Указать, какие операции блокируются, какие становятся асинхронными, что
    видит пользователь, сколько хранится запрос и кто отвечает за восстановление.
  category: Отказы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 29458dc6-88cb-4011-99b2-a135c93bb40b
  question: Чем webhook отличается от polling для получения изменений?
  answer: Webhook доставляет уведомление по инициативе источника; polling периодически
    запрашивает состояние. У каждого способа своя задержка и нагрузка; оба требуют
    обработки пропусков, дублей и ошибок.
  category: Способы интеграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c00858c6-d5b8-442c-88f3-6c4b86712a6d
  question: Как защитить входящий webhook от повтора и подделки?
  answer: Проверять подпись и допустимый временной интервал, а также уникальность
    идентификатора события; бизнес-обработку делать идемпотентной.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7603b719-0779-457c-a721-e6d126f5eb5d
  question: Что значит eventual consistency для пользовательского сценария?
  answer: После записи другие представления могут обновиться позже. Нужно определить
    допустимую задержку, временное состояние интерфейса и действия при превышении
    срока.
  category: Согласованность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 158a565a-1b4c-4efa-abd7-e75d02d28535
  question: Почему «exactly-once» следует уточнять по границам систем?
  answer: Гарантия брокера может действовать только внутри его транзакций, а внешняя
    БД и API в неё не входят. Нужно явно описать, где устраняются дубли и как восстанавливается
    результат.
  category: Семантика доставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4ee6b4bd-8837-4393-a1e7-81f76877df0b
  question: Какие метрики нужны для интеграции через очередь?
  answer: Возраст и число ожидающих сообщений, скорость обработки, ошибки, повторы,
    DLQ и задержка полного бизнес-сценария.
  category: Наблюдаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eb5f819c-a580-4c73-9fff-f6f8ff48ecad
  question: Как составить карту зависимостей для новой интеграции?
  answer: Перечислить producer, broker или API, consumers, владельцев данных, схемы,
    права, окружения, сетевые правила и точки мониторинга; отметить критические пути
    и отказные сценарии.
  category: Планирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c700ae5d-1a16-4ebb-b07e-e11cd5c24f41
  question: Чем интеграция через SOAP отличается от вызова REST API при анализе контракта?
  answer: Для SOAP важно прочитать WSDL/XSD, операции и структуру XML, правила ошибок
    и безопасности; для REST/HTTP — методы, URL, схемы представлений и HTTP-статусы.
    В обоих случаях нужны таймауты, повторы и владельцы.
  category: Стили интеграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 28a649b8-e89c-4637-af95-cbd370b87809
  question: Когда нужна сверка данных между системами после асинхронной обработки?
  answer: Когда возможны пропуски, дубли или задержки, а расхождения имеют бизнес-цену.
    Сверка сравнивает идентификаторы и состояния, формирует исключения и способ их
    исправления.
  category: Согласованность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 78ea8d01-2fbe-486a-b758-f6eb2c87546f
  question: Почему контракт интеграции должен включать порядок развёртывания producer
    и consumer?
  answer: Несовместимая схема или смена смысла поля может сломать одну из версий при
    совместной работе. Нужны совместимый переходный период и способ проверить переключение.
  category: Версионирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 644c6588-58e0-41a0-9962-e2abb15ee947
  question: Как выбрать между Kafka-топиком и очередью задач при проектировании интеграции?
  answer: Сравнить потребность в независимых подписчиках, хранении и повторном чтении
    истории, порядке по ключу, конкурирующей обработке и операционной сложности. Конкретные
    гарантии зависят от конфигурации брокера.
  category: Выбор транспорта
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dc19b2a5-bef6-4522-a417-a5f3de2a2590
  question: Когда gRPC уместнее обычного REST/JSON API?
  answer: Когда важны строго типизированный контракт, генерация клиентов, эффективное
    взаимодействие сервисов или streaming при поддержке инфраструктуры. Нужно учитывать
    совместимость клиентов, диагностику и доступность HTTP/2 в среде.
  category: Стили интеграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c919f62d-385c-4275-87a1-00abb1620d39
  question: Для какого сценария WebSocket подходит лучше обычного HTTP-запроса?
  answer: Для длительного двустороннего обмена с частыми обновлениями и низкой задержкой,
    например живой статус операции. Нужно учесть соединения, авторизацию, переподключение
    и масштабирование.
  category: Стили интеграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0550212b-7d81-4c19-960c-769598c4c4ba
  question: Что делает ESB и почему интеграция через него не отменяет контрактов сервисов?
  answer: Enterprise Service Bus может маршрутизировать, преобразовывать и оркестрировать
    сообщения между системами. При этом остаются требования к схемам, владельцам данных,
    ошибкам и совместимости; центральная шина может стать точкой связности и отказа.
  category: Интеграционная архитектура
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: cd0ed0f2-aa83-4964-a215-4a5ac193abd6
  question: Как архитектура монолита или набора микросервисов влияет на описание интеграции?
  answer: В монолите граница может проходить между модулями одного процесса, в микросервисах
    — через сеть и независимые релизы. Во втором случае особенно важно описать контракт,
    таймауты, повтор, совместимость и владение данными.
  category: Интеграционная архитектура
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bb9f4913-95db-435d-91d4-d2aa1e26548f
  question: Чем SOA отличается от простого наличия нескольких сервисов?
  answer: SOA строит систему вокруг явных сервисных контрактов и взаимодействий между
    автономными возможностями. Её реализация может использовать разные технологии
    и промежуточные компоненты; наличие ESB или SOAP само по себе не определяет архитектуру.
  category: Интеграционная архитектура
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8889e422-1674-4490-86ad-fa30444de03a
  question: Какие различия Kafka и RabbitMQ важны аналитику при выборе интеграционного
    сценария?
  answer: Уточнить, нужен ли поток событий с повторным чтением независимыми группами
    или очередь задач с маршрутизацией и подтверждением обработки. Сравнить порядок,
    срок хранения, повторную доставку и контракт потребителей; выбор зависит от требований,
    а не названия брокера.
  category: Выбор транспорта
