topic: "Интеграции"
cards:
  - question: "Как выбрать между синхронным API и асинхронным сообщением для взаимодействия сервисов?"
    answer: "Сравнить необходимость немедленного ответа, допустимую задержку, связанность по доступности, порядок, нагрузку и обработку ошибок. Выбор закрепляют контрактом результата и восстановления."
    category: "Выбор взаимодействия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем команда отличается от события в интеграции?"
    answer: "Команда просит конкретного исполнителя выполнить действие; событие сообщает о состоявшемся факте и может иметь нескольких независимых потребителей."
    category: "Семантика сообщений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие поля нужны для корреляции асинхронного ответа с запросом?"
    answer: "Устойчивый идентификатор запроса или операции, идентификатор сообщения, источник и при необходимости версия. Нужно определить срок ожидания и обработку неизвестного ответа."
    category: "Корреляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему доставка сообщения не означает успешное выполнение бизнес-операции?"
    answer: "Брокер подтверждает транспортное действие в своих границах; consumer ещё может не обработать сообщение или откатить изменение. Нужны отдельные статусы и подтверждение результата."
    category: "Семантика доставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает at-least-once для потребителя?"
    answer: "Сообщение может прийти повторно при сбое между обработкой и подтверждением. Потребитель должен быть идемпотентным или уметь распознавать уже обработанные сообщения."
    category: "Семантика доставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как задать ключ идемпотентности для входящего события?"
    answer: "Использовать стабильный уникальный идентификатор бизнес-операции или события от producer; зафиксировать область уникальности и срок хранения дедупликации."
    category: "Идемпотентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему одинаковое событие может быть обработано дважды даже при надёжном брокере?"
    answer: "После изменения БД consumer может упасть до ack или commit offset, и брокер доставит запись снова. Надёжность транспорта не устраняет этот промежуток."
    category: "Идемпотентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как согласовать запись в БД и публикацию события без распределённой транзакции?"
    answer: "Сохранить бизнес-изменение и outbox-запись в одной локальной транзакции, затем публиковать outbox с повторами; consumer должен учитывать дубли."
    category: "Надёжность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что нужно описать в контракте события помимо JSON-схемы?"
    answer: "Значение события, момент возникновения, ключ, порядок, гарантию доставки, версию, правила повтора, срок хранения и ответственность за ошибку."
    category: "Контракт события"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как изменение формата события повлияет на старого consumer?"
    answer: "Он может не понимать новое поле, тип или смысл, а новые consumers могут читать старые события. Нужны правила совместимости и порядок развёртывания версий."
    category: "Версионирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно уточнить для интеграции с внешней системой, которая может отвечать 30 секунд?"
    answer: "Срок ожидания пользователя, таймаут, асинхронный режим, отмену, повтор, лимит параллелизма и итог при неизвестном результате."
    category: "Таймауты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда повтор внешнего HTTP-запроса опасен?"
    answer: "Когда операция имеет побочный эффект и после таймаута неизвестно, выполнилась ли она. Нужны идемпотентный контракт, ключ запроса или проверка статуса."
    category: "Повторы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему retry без ограничения может усилить аварию?"
    answer: "Повторы увеличивают нагрузку на отказавшую зависимость и занимают ресурсы вызывающего сервиса. Нужны лимит попыток, backoff, jitter и общий deadline."
    category: "Повторы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Для чего нужна DLQ и какое решение она не заменяет?"
    answer: "DLQ изолирует сообщения, которые не удалось обработать по основной политике. Она не заменяет диагностику причины, исправление данных и управляемое повторное проигрывание."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как обрабатывать сообщение, которое пришло раньше события о создании объекта?"
    answer: "Зафиксировать требования к порядку и допустимой задержке; возможны отложенный повтор, хранение ожидающего события или запрос состояния у источника. Нельзя просто считать такое событие невозможным."
    category: "Порядок"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какой порядок можно гарантировать в партиционированном потоке событий?"
    answer: "Обычно порядок задаётся внутри партиции или ключа, а не для всех сообщений. Контракт должен определить ключ и поведение при параллельной обработке."
    category: "Порядок"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем определять владельца контракта интеграции?"
    answer: "Он согласует изменения, совместимость, сроки поддержки, мониторинг и разбор инцидентов. Без владельца потребители могут узнать о несовместимом изменении после релиза."
    category: "Управление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать частичную недоступность внешней системы?"
    answer: "Указать, какие операции блокируются, какие становятся асинхронными, что видит пользователь, сколько хранится запрос и кто отвечает за восстановление."
    category: "Отказы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем webhook отличается от polling для получения изменений?"
    answer: "Webhook доставляет уведомление по инициативе источника; polling периодически запрашивает состояние. У каждого способа своя задержка и нагрузка; оба требуют обработки пропусков, дублей и ошибок."
    category: "Способы интеграции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как защитить входящий webhook от повтора и подделки?"
    answer: "Проверять подпись и допустимый временной интервал, а также уникальность идентификатора события; бизнес-обработку делать идемпотентной."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что значит eventual consistency для пользовательского сценария?"
    answer: "После записи другие представления могут обновиться позже. Нужно определить допустимую задержку, временное состояние интерфейса и действия при превышении срока."
    category: "Согласованность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему «exactly-once» следует уточнять по границам систем?"
    answer: "Гарантия брокера может действовать только внутри его транзакций, а внешняя БД и API в неё не входят. Нужно явно описать, где устраняются дубли и как восстанавливается результат."
    category: "Семантика доставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какие метрики нужны для интеграции через очередь?"
    answer: "Возраст и число ожидающих сообщений, скорость обработки, ошибки, повторы, DLQ и задержка полного бизнес-сценария."
    category: "Наблюдаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как составить карту зависимостей для новой интеграции?"
    answer: "Перечислить producer, broker или API, consumers, владельцев данных, схемы, права, окружения, сетевые правила и точки мониторинга; отметить критические пути и отказные сценарии."
    category: "Планирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

