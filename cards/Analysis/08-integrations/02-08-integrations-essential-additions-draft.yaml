topic: "Интеграции"
cards:
  - question: "Чем интеграция через SOAP отличается от вызова REST API при анализе контракта?"
    answer: "Для SOAP важно прочитать WSDL/XSD, операции и структуру XML, правила ошибок и безопасности; для REST/HTTP — методы, URL, схемы представлений и HTTP-статусы. В обоих случаях нужны таймауты, повторы и владельцы."
    category: "Стили интеграции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда нужна сверка данных между системами после асинхронной обработки?"
    answer: "Когда возможны пропуски, дубли или задержки, а расхождения имеют бизнес-цену. Сверка сравнивает идентификаторы и состояния, формирует исключения и способ их исправления."
    category: "Согласованность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему контракт интеграции должен включать порядок развёртывания producer и consumer?"
    answer: "Несовместимая схема или смена смысла поля может сломать одну из версий при совместной работе. Нужны совместимый переходный период и способ проверить переключение."
    category: "Версионирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать между Kafka-топиком и очередью задач при проектировании интеграции?"
    answer: "Сравнить потребность в независимых подписчиках, хранении и повторном чтении истории, порядке по ключу, конкурирующей обработке и операционной сложности. Конкретные гарантии зависят от конфигурации брокера."
    category: "Выбор транспорта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

