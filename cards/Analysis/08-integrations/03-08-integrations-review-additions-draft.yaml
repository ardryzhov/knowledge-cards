topic: "Интеграции"
cards:
  - question: "Когда gRPC уместнее обычного REST/JSON API?"
    answer: "Когда важны строго типизированный контракт, генерация клиентов, эффективное взаимодействие сервисов или streaming при поддержке инфраструктуры. Нужно учитывать совместимость клиентов, диагностику и доступность HTTP/2 в среде."
    category: "Стили интеграции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Для какого сценария WebSocket подходит лучше обычного HTTP-запроса?"
    answer: "Для длительного двустороннего обмена с частыми обновлениями и низкой задержкой, например живой статус операции. Нужно учесть соединения, авторизацию, переподключение и масштабирование."
    category: "Стили интеграции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делает ESB и почему интеграция через него не отменяет контрактов сервисов?"
    answer: "Enterprise Service Bus может маршрутизировать, преобразовывать и оркестрировать сообщения между системами. При этом остаются требования к схемам, владельцам данных, ошибкам и совместимости; центральная шина может стать точкой связности и отказа."
    category: "Интеграционная архитектура"
    context: null
