topic: "Интеграции"
cards:
  - question: "Как архитектура монолита или набора микросервисов влияет на описание интеграции?"
    answer: "В монолите граница может проходить между модулями одного процесса, в микросервисах — через сеть и независимые релизы. Во втором случае особенно важно описать контракт, таймауты, повтор, совместимость и владение данными."
    category: "Интеграционная архитектура"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем SOA отличается от простого наличия нескольких сервисов?"
    answer: "SOA строит систему вокруг явных сервисных контрактов и взаимодействий между автономными возможностями. Её реализация может использовать разные технологии и промежуточные компоненты; наличие ESB или SOAP само по себе не определяет архитектуру."
    category: "Интеграционная архитектура"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие различия Kafka и RabbitMQ важны аналитику при выборе интеграционного сценария?"
    answer: "Уточнить, нужен ли поток событий с повторным чтением независимыми группами или очередь задач с маршрутизацией и подтверждением обработки. Сравнить порядок, срок хранения, повторную доставку и контракт потребителей; выбор зависит от требований, а не названия брокера."
    category: "Выбор транспорта"
    context: null
