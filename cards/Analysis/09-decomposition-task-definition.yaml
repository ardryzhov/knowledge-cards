topic: Декомпозиция и постановка задач
cards:
- id: cb487de0-cc60-4c71-8a25-305c536e9976
  question: По какому принципу разбивать большую фичу на задачи?
  answer: 'Выделять проверяемые результаты с понятными зависимостями и границами:
    изменения контракта, данных, логики, интерфейса и наблюдаемости. Каждая задача
    должна быть связана с целевым сценарием.'
  category: Декомпозиция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0cb13744-b465-4f84-a599-5ec9f3e661a8
  question: Чем вертикальный срез фичи отличается от разбиения по техническим слоям?
  answer: Вертикальный срез даёт работающий пользовательский сценарий через нужные
    слои; разбиение только на БД, backend и frontend может долго не давать проверяемого
    результата.
  category: Декомпозиция
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c81802c8-9431-45a8-8a97-9dc1766b8c25
  question: Как понять, что задача слишком крупная для спринта?
  answer: У неё много независимых сценариев, неизвестных зависимостей или нет проверяемого
    промежуточного результата. Нужно выделить минимальные ценные срезы или отдельные
    исследования.
  category: Размер задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 10a561a9-cea2-4fce-a28a-9cc2c5200e08
  question: Когда нужна отдельная исследовательская задача?
  answer: 'Когда неизвестность мешает оценке или выбору решения: например неясен контракт
    внешней системы или объём миграции. У исследования должен быть конкретный вопрос
    и ожидаемый артефакт.'
  category: Неопределённость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3d794d31-058f-44fd-84d9-2b50c0aeda0a
  question: Что должно быть в постановке задачи для разработчика?
  answer: Цель и границы, сценарии и правила, данные и контракты, ошибки, нефункциональные
    ограничения, зависимости и проверяемые критерии приёмки.
  category: Постановка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 83d7bef3-e7a4-4307-9917-049dceb02dfc
  question: Чем Definition of Ready отличается от Definition of Done?
  answer: DoR помогает решить, достаточно ли задача понятна для начала работы; DoD
    определяет условия завершения результата. Оба соглашения команды не заменяют требования
    конкретной фичи.
  category: Процесс
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 9bb06dd0-8341-4b38-9e08-ba182fbe8134
  question: Зачем связывать техническую задачу с бизнес-целью?
  answer: Это помогает выбирать объём и компромиссы, а также проверять, что реализация
    решает исходную проблему, а не только закрывает список работ.
  category: Ценность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: aa890371-ec58-42e2-af22-063d81ca7179
  question: Как определить минимальный полезный срез функциональности?
  answer: Найти основной сценарий, который приносит проверяемую ценность, и включить
    необходимые правила безопасности, качества и наблюдаемости. Исключения можно отложить
    только после оценки риска.
  category: Приоритизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7ec5bda3-86a3-4409-af6a-70b4267893a8
  question: Почему MVP не означает отсутствие обработки ошибок?
  answer: Даже первый срез должен предсказуемо реагировать на ошибки в критическом
    сценарии. Можно ограничить охват функций, но нельзя оставлять неопределённое поведение.
  category: Приоритизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 17392bf0-de44-4961-898d-196438fd6bc3
  question: Как описать зависимость между задачами разных команд?
  answer: Указать поставляемый контракт или артефакт, владельца, дату, критерий готовности
    и план при задержке. Слова «ждём соседнюю команду» недостаточно.
  category: Зависимости
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f96d1223-9816-4568-91bf-01993f5ce5f8
  question: Когда стоит согласовать API-контракт до разбиения работ между командами?
  answer: Когда producer и consumer могут разрабатываться параллельно. Раннее согласование
    операций, схем, ошибок и версий уменьшает несовместимости при интеграции.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a636c4fc-1897-4643-a998-58046b282400
  question: Как оценить влияние изменения схемы данных на задачи релиза?
  answer: Проверить миграцию, совместимость старого и нового кода, заполнение данных,
    откат, контракты и мониторинг; разложить изменение на безопасные этапы.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4128ef97-a86c-4475-a4de-5271d2b8d318
  question: Почему оценка задачи без уточнения неопределённостей ненадёжна?
  answer: Неизвестные контракты, данные и правила могут резко изменить объём. Нужно
    перечислить допущения и риски, уточнить их или выделить исследование.
  category: Оценка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 110f5b40-f3f8-4dab-a8d2-f9a09b890b7a
  question: Как применять приоритизацию, если все стейкхолдеры называют задачи срочными?
  answer: Сравнить ценность, сроки, риск, зависимости и стоимость задержки; попросить
    владельца продукта принять явное решение о порядке и компромиссах.
  category: Приоритизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c33db5c6-284f-4378-ba77-d5aacff99048
  question: Как учесть обратную совместимость при декомпозиции API-изменения?
  answer: Отдельно спланировать расширение контракта, поддержку старых клиентов, переключение
    потребителей, наблюдение и удаление устаревшего поведения.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: aa5e224b-9cc0-4b43-9c2a-ca93809ed9f4
  question: Что должно быть в критерии приёмки для интеграционной задачи?
  answer: Успешный обмен и варианты отказа, таймаут, повтор, дубли, порядок, несовместимая
    схема и наблюдаемый итог бизнес-операции.
  category: Критерии приёмки
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2f7d72e9-56c7-4964-ad20-eef9f4e0c303
  question: Как проверить, что критерий приёмки не описывает только реализацию?
  answer: Он должен задавать наблюдаемый результат и условия для пользователя или
    интеграционного потребителя. Название метода или таблицы само по себе не подтверждает
    ценность.
  category: Критерии приёмки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e2e95f65-58fe-4248-a292-c7d4d5a9ade1
  question: Зачем выделять миграцию данных как часть задачи, а не как поздний технический
    шаг?
  answer: От неё зависят корректность старых записей, время развёртывания, права и
    возможность отката. Её объём может быть значительной частью фичи.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fc8ecc2d-2e75-48fe-bc9e-84b9a4bf82a3
  question: Как декомпозировать изменение, затрагивающее UI, API и очередь?
  answer: Согласовать целевой сценарий и контракты, выделить совместимые изменения
    producer и consumer, интерфейс, тесты и наблюдаемость; определить порядок поставки.
  category: Практический кейс
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c352d2e6-f912-4a03-afaf-6596cb63a4a5
  question: Когда можно выпускать backend до frontend?
  answer: Когда контракт совместим, новый код не меняет старое поведение и есть способ
    безопасно включить функцию позже, например флаг или отдельный endpoint.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 15015d7c-7bc2-495f-a43f-7947bc44282b
  question: Почему задача «сделать интеграцию» слишком расплывчата?
  answer: Она не определяет данные, контракт, владельцев, ошибки, безопасность, сроки
    и критерии результата. Её нужно раскрыть до проверяемых сценариев и зависимостей.
  category: Качество постановки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 1bb5cd6c-e74f-46eb-8497-582e1043a0fe
  question: Как учитывать тестирование при декомпозиции, не превращая его в формальность
    в конце?
  answer: Для каждого среза заранее определить проверяемые сценарии, данные, окружение
    и ответственных; включить автоматические проверки в критерий завершения.
  category: Проверка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d1ef56e6-b212-496f-b78d-e86fec812351
  question: Что делать, если во время реализации обнаружилось новое бизнес-правило?
  answer: Зафиксировать источник и влияние на текущий сценарий, согласовать решение
    и обновить постановку и критерии; при необходимости пересмотреть объём и срок.
  category: Изменения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f81d0cae-48d8-4ae3-a385-5d6658586e04
  question: Как завершить аналитическую часть задачи перед передачей в разработку?
  answer: Проверить согласованность цели, сценариев, схем, контрактов и критериев,
    закрыть критические вопросы и явно перечислить остающиеся допущения.
  category: Готовность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 19c82e41-2206-4e78-8441-0aae823b2316
  question: Чем планирование изменения в последовательном Waterfall-процессе отличается
    от итеративной поставки?
  answer: В последовательной схеме этапы и согласования заранее разделены, поэтому
    позднее изменение требования обычно дорого. При итеративной поставке небольшой
    завершённый срез получают раньше и корректируют следующие шаги по обратной связи;
    обязательные согласования сохраняются там, где их требует риск.
  category: Процесс работы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a4aec8ab-92d5-4d07-a755-eb1a9ef3c6e2
  question: Как Scrum и Kanban по-разному влияют на ведение потока задач?
  answer: Scrum организует работу вокруг фиксированных итераций и их целей, Kanban
    — вокруг непрерывного потока с явными состояниями и ограничением незавершённой
    работы. Аналитику важно понимать, когда задача должна быть подготовлена и как
    изменение попадает в работу команды.
  category: Процесс работы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
