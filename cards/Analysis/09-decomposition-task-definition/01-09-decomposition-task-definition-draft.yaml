topic: "Декомпозиция и постановка задач"
cards:
  - question: "По какому принципу разбивать большую фичу на задачи?"
    answer: "Выделять проверяемые результаты с понятными зависимостями и границами: изменения контракта, данных, логики, интерфейса и наблюдаемости. Каждая задача должна быть связана с целевым сценарием."
    category: "Декомпозиция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем вертикальный срез фичи отличается от разбиения по техническим слоям?"
    answer: "Вертикальный срез даёт работающий пользовательский сценарий через нужные слои; разбиение только на БД, backend и frontend может долго не давать проверяемого результата."
    category: "Декомпозиция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как понять, что задача слишком крупная для спринта?"
    answer: "У неё много независимых сценариев, неизвестных зависимостей или нет проверяемого промежуточного результата. Нужно выделить минимальные ценные срезы или отдельные исследования."
    category: "Размер задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда нужна отдельная исследовательская задача?"
    answer: "Когда неизвестность мешает оценке или выбору решения: например неясен контракт внешней системы или объём миграции. У исследования должен быть конкретный вопрос и ожидаемый артефакт."
    category: "Неопределённость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что должно быть в постановке задачи для разработчика?"
    answer: "Цель и границы, сценарии и правила, данные и контракты, ошибки, нефункциональные ограничения, зависимости и проверяемые критерии приёмки."
    category: "Постановка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем Definition of Ready отличается от Definition of Done?"
    answer: "DoR помогает решить, достаточно ли задача понятна для начала работы; DoD определяет условия завершения результата. Оба соглашения команды не заменяют требования конкретной фичи."
    category: "Процесс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем связывать техническую задачу с бизнес-целью?"
    answer: "Это помогает выбирать объём и компромиссы, а также проверять, что реализация решает исходную проблему, а не только закрывает список работ."
    category: "Ценность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как определить минимальный полезный срез функциональности?"
    answer: "Найти основной сценарий, который приносит проверяемую ценность, и включить необходимые правила безопасности, качества и наблюдаемости. Исключения можно отложить только после оценки риска."
    category: "Приоритизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему MVP не означает отсутствие обработки ошибок?"
    answer: "Даже первый срез должен предсказуемо реагировать на ошибки в критическом сценарии. Можно ограничить охват функций, но нельзя оставлять неопределённое поведение."
    category: "Приоритизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как описать зависимость между задачами разных команд?"
    answer: "Указать поставляемый контракт или артефакт, владельца, дату, критерий готовности и план при задержке. Слова «ждём соседнюю команду» недостаточно."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда стоит согласовать API-контракт до разбиения работ между командами?"
    answer: "Когда producer и consumer могут разрабатываться параллельно. Раннее согласование операций, схем, ошибок и версий уменьшает несовместимости при интеграции."
    category: "Контракты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как оценить влияние изменения схемы данных на задачи релиза?"
    answer: "Проверить миграцию, совместимость старого и нового кода, заполнение данных, откат, контракты и мониторинг; разложить изменение на безопасные этапы."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему оценка задачи без уточнения неопределённостей ненадёжна?"
    answer: "Неизвестные контракты, данные и правила могут резко изменить объём. Нужно перечислить допущения и риски, уточнить их или выделить исследование."
    category: "Оценка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как применять приоритизацию, если все стейкхолдеры называют задачи срочными?"
    answer: "Сравнить ценность, сроки, риск, зависимости и стоимость задержки; попросить владельца продукта принять явное решение о порядке и компромиссах."
    category: "Приоритизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как учесть обратную совместимость при декомпозиции API-изменения?"
    answer: "Отдельно спланировать расширение контракта, поддержку старых клиентов, переключение потребителей, наблюдение и удаление устаревшего поведения."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что должно быть в критерии приёмки для интеграционной задачи?"
    answer: "Успешный обмен и варианты отказа, таймаут, повтор, дубли, порядок, несовместимая схема и наблюдаемый итог бизнес-операции."
    category: "Критерии приёмки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, что критерий приёмки не описывает только реализацию?"
    answer: "Он должен задавать наблюдаемый результат и условия для пользователя или интеграционного потребителя. Название метода или таблицы само по себе не подтверждает ценность."
    category: "Критерии приёмки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем выделять миграцию данных как часть задачи, а не как поздний технический шаг?"
    answer: "От неё зависят корректность старых записей, время развёртывания, права и возможность отката. Её объём может быть значительной частью фичи."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как декомпозировать изменение, затрагивающее UI, API и очередь?"
    answer: "Согласовать целевой сценарий и контракты, выделить совместимые изменения producer и consumer, интерфейс, тесты и наблюдаемость; определить порядок поставки."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда можно выпускать backend до frontend?"
    answer: "Когда контракт совместим, новый код не меняет старое поведение и есть способ безопасно включить функцию позже, например флаг или отдельный endpoint."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему задача «сделать интеграцию» слишком расплывчата?"
    answer: "Она не определяет данные, контракт, владельцев, ошибки, безопасность, сроки и критерии результата. Её нужно раскрыть до проверяемых сценариев и зависимостей."
    category: "Качество постановки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как учитывать тестирование при декомпозиции, не превращая его в формальность в конце?"
    answer: "Для каждого среза заранее определить проверяемые сценарии, данные, окружение и ответственных; включить автоматические проверки в критерий завершения."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если во время реализации обнаружилось новое бизнес-правило?"
    answer: "Зафиксировать источник и влияние на текущий сценарий, согласовать решение и обновить постановку и критерии; при необходимости пересмотреть объём и срок."
    category: "Изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как завершить аналитическую часть задачи перед передачей в разработку?"
    answer: "Проверить согласованность цели, сценариев, схем, контрактов и критериев, закрыть критические вопросы и явно перечислить остающиеся допущения."
    category: "Готовность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

