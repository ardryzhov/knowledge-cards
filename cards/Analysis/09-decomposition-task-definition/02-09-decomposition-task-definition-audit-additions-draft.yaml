topic: "Декомпозиция и постановка задач"
cards:
  - question: "Чем планирование изменения в последовательном Waterfall-процессе отличается от итеративной поставки?"
    answer: "В последовательной схеме этапы и согласования заранее разделены, поэтому позднее изменение требования обычно дорого. При итеративной поставке небольшой завершённый срез получают раньше и корректируют следующие шаги по обратной связи; обязательные согласования сохраняются там, где их требует риск."
    category: "Процесс работы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как Scrum и Kanban по-разному влияют на ведение потока задач?"
    answer: "Scrum организует работу вокруг фиксированных итераций и их целей, Kanban — вокруг непрерывного потока с явными состояниями и ограничением незавершённой работы. Аналитику важно понимать, когда задача должна быть подготовлена и как изменение попадает в работу команды."
    category: "Процесс работы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
