topic: Проверка и управление требованиями
cards:
- id: 92e897d6-20e3-4542-a04a-83fa2a2e7993
  question: Чем verification требования отличается от validation?
  answer: Verification проверяет качество формулировки и согласованность с правилами
    описания; validation проверяет, что требование отвечает реальной потребности и
    цели заинтересованных сторон.
  category: Проверка требований
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 2cc943ad-4765-414b-ae6d-9aa2f8f58e71
  question: Какие признаки качественного требования стоит проверить перед согласованием?
  answer: Однозначность, полноту нужного сценария, непротиворечивость, выполнимость,
    проверяемость, источник и связь с целью. Уровень детализации зависит от риска.
  category: Качество
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 798f6fb9-0539-4370-b3f6-04b21a55d09b
  question: Как обнаружить противоречия между текстом, BPMN и API-контрактом?
  answer: Пройти один и тот же сценарий по всем артефактам, сверяя роли, условия,
    поля, ошибки и итоговые состояния; расхождения вынести на решение владельца.
  category: Согласованность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 0ace1f2a-b49c-43e9-a643-4b43c049a676
  question: Что означает трассировка требования?
  answer: Связь требования с источником и целью, а также с реализацией и проверками.
    Она помогает оценивать влияние изменений и находить забытые сценарии.
  category: Трассировка
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 18e0935f-6c3f-4997-82e2-fcdccb99d8bf
  question: Когда матрица трассировки особенно полезна?
  answer: При длинной цепочке требований, нескольких командах, регуляторных ограничениях
    или частых изменениях, когда нужно доказать покрытие от источника до теста.
  category: Трассировка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 96228d02-aa29-49be-b725-5aee6bcc6730
  question: Как провести impact analysis изменения требования?
  answer: Найти связанные сценарии, контракты, данные, код, тесты, документацию, команды
    и сроки; оценить риски, стоимость и варианты реализации.
  category: Изменения
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 64aff804-7a6f-42cf-af15-fc736a0586eb
  question: Почему изменённое требование нельзя просто дописать в конец старого документа?
  answer: Могут остаться противоречащие правила и непонятно, что действует сейчас.
    Нужно обновить единый актуальный источник, историю решения и связанные артефакты.
  category: Изменения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f7bcdab3-66bf-4ebe-9566-b493b339da8a
  question: Что такое baseline требований?
  answer: Согласованный на определённый момент набор требований, относительно которого
    контролируют изменения. Он не запрещает изменения, а делает их явными.
  category: Версии
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 86d7d5f3-704f-49dc-b98f-f47958a780d2
  question: Какие атрибуты полезно хранить у требования?
  answer: Идентификатор, источник, владелец, статус, приоритет, версия, дата решения
    и связи с артефактами. Набор выбирают по потребностям команды.
  category: Управление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 92b36867-61a9-4ad0-b603-8ae16691fdce
  question: Как определить владельца спорного бизнес-правила?
  answer: Найти роль, отвечающую за процесс, результат и риск; зафиксировать право
    принятия решения и согласовать его с затронутыми сторонами.
  category: Ответственность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 60dfd9f3-939d-4cf6-b1e7-aee11448bc09
  question: Как проверять требования с тестировщиком до разработки?
  answer: Попросить вывести позитивные, граничные и ошибочные проверки из формулировок;
    если ожидаемый результат невозможно определить, уточнить правило.
  category: Ревью
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 40cd9568-8695-446a-abdc-a555962b54d1
  question: Как проверять требования с разработчиком до начала реализации?
  answer: Пройти данные, состояния, контракты, ограничения и отказные сценарии; записать
    технические допущения и вопросы, влияющие на объём.
  category: Ревью
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ec192e01-1903-4ed9-86b3-2374b18ac80b
  question: Почему согласование требования не означает, что оно понятно всем исполнителям?
  answer: Участники могут вкладывать разные значения в термины и пропускать исключения.
    Нужны примеры, совместный разбор и проверка понимания на сценариях.
  category: Согласование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f5a3a393-c416-4151-89ae-22f1f25c1625
  question: Как фиксировать решение, принятое устно на встрече?
  answer: Записать правило, обоснование, дату, участников и затронутые артефакты;
    дать ответственным возможность подтвердить запись.
  category: Согласование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f7723e70-9826-4d46-8fa9-872e675507ef
  question: Что делать, если требование изменилось после начала спринта?
  answer: Оценить влияние на текущую работу, ценность и сроки, согласовать решение
    о замене или переносе с владельцем продукта и обновить артефакты и критерии.
  category: Изменения
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c73dd5e5-50d9-4b63-82d2-3afa82cd9311
  question: Как отличить дефект реализации от изменения требований?
  answer: Сравнить наблюдаемое поведение с согласованным на момент реализации контрактом.
    Если контракт не определял случай, требуется решение по требованию; если определял
    и нарушен — дефект.
  category: Классификация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 58d43962-976a-48ff-ade8-a2f92642b97b
  question: Почему важно фиксировать отклонённые варианты решения?
  answer: Иначе позже повторяют уже рассмотренный спор, не зная ограничений и последствий.
    Краткое обоснование сохраняет контекст решения.
  category: История решений
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 46a64e65-65c2-4ae4-8f14-3684fac5aa19
  question: Как убедиться, что реализованная фича решает исходную проблему?
  answer: Сверить результат с целевой метрикой и пользовательским сценарием, получить
    обратную связь и проверить фактическое использование, а не только закрытие задач.
  category: Оценка результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: dc8d0dd9-35b5-44c7-ad0b-7ed240e8afac
  question: Какие сигналы указывают, что требование устарело?
  answer: Изменились процесс, закон или источник данных, владелец, API, метрика цели
    либо реализованное поведение; истёк срок действия правила.
  category: Актуальность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5e856efc-07e8-48d2-84cd-272d18806004
  question: Зачем разделять обязательные требования и пожелания?
  answer: Это делает приоритет и компромиссы явными, помогает выбрать минимальный
    релиз и не потерять регуляторные или критические ограничения.
  category: Приоритизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ca8ec2e5-8b3b-45fa-a114-6e3a04f989ac
  question: Как работать с требованиями нескольких команд к одному API?
  answer: Собрать сценарии потребителей, выявить конфликты, определить владельца контракта,
    согласовать совместимые изменения и план миграции.
  category: Межкомандная работа
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0362adfa-5db4-4989-8a61-fc77be083442
  question: Что делать, если тестировщик нашёл сценарий, которого нет в требованиях?
  answer: Оценить риск и ожидаемое поведение с владельцем правила, затем обновить
    требования, критерии и тесты. Не оставлять решение только в тест-кейсе.
  category: Пробелы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e22ae309-6a5b-46e5-92fd-f82ea81db43a
  question: Как использовать примеры для проверки бизнес-правила?
  answer: Подобрать обычный случай, границы и исключения; попросить участников назвать
    ожидаемый результат. Расхождения выявляют неоднозначность правила.
  category: Примеры
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f914d0ba-a9f0-4aa4-8ff6-5f535f64c3e0
  question: Почему нельзя считать документ завершённым только потому, что у него статус
    «согласовано»?
  answer: Нужно проверить, что актуальная версия доступна команде, связи с реализацией
    и тестами сохранены, а изменения процесса отражены в артефактах.
  category: Жизненный цикл
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9eaf843d-5641-41bb-af85-4a2e6f75f150
  question: Что такое переходные требования?
  answer: 'Они описывают временные условия перехода от текущего решения к целевому:
    миграцию данных, обучение пользователей, параллельную работу версий и вывод старого
    процесса. После перехода часть таких требований теряет актуальность.'
  category: Виды требований
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ae31cbf2-f9c9-4f3a-9ba2-c7df58173575
  question: Когда полезна SRS вместо разрозненных user stories?
  answer: Когда требуется единая спецификация поведения, интерфейсов и ограничений
    сложной системы с несколькими потребителями или формальным согласованием. Её объём
    выбирают по риску и контексту; название документа само по себе не гарантирует
    качества.
  category: Артефакты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fbc07ce8-df23-4d84-b7ed-036feacedb31
  question: Что обычно фиксируют в Vision and Scope до подробной спецификации требований?
  answer: Проблему и цель, заинтересованные стороны, границы решения, ожидаемый результат,
    основные ограничения и то, что остаётся вне объёма. Название документа в командах
    различается; важен согласованный смысл этих решений.
  category: Артефакты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d9e9257a-f726-44f0-b66b-db982a1b115c
  question: Чем BRD отличается от SRS по назначению?
  answer: BRD обычно фиксирует бизнес-цели, потребности и правила, а SRS — требуемое
    поведение системы, интерфейсы и ограничения. Состав документов зависит от процесса
    команды; важнее прослеживаемая связь между бизнес-целью и системным требованием.
  category: Артефакты
  context: 
