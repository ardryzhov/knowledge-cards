topic: "Проверка и управление требованиями"
cards:
  - question: "Чем verification требования отличается от validation?"
    answer: "Verification проверяет качество формулировки и согласованность с правилами описания; validation проверяет, что требование отвечает реальной потребности и цели заинтересованных сторон."
    category: "Проверка требований"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие признаки качественного требования стоит проверить перед согласованием?"
    answer: "Однозначность, полноту нужного сценария, непротиворечивость, выполнимость, проверяемость, источник и связь с целью. Уровень детализации зависит от риска."
    category: "Качество"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как обнаружить противоречия между текстом, BPMN и API-контрактом?"
    answer: "Пройти один и тот же сценарий по всем артефактам, сверяя роли, условия, поля, ошибки и итоговые состояния; расхождения вынести на решение владельца."
    category: "Согласованность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что означает трассировка требования?"
    answer: "Связь требования с источником и целью, а также с реализацией и проверками. Она помогает оценивать влияние изменений и находить забытые сценарии."
    category: "Трассировка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда матрица трассировки особенно полезна?"
    answer: "При длинной цепочке требований, нескольких командах, регуляторных ограничениях или частых изменениях, когда нужно доказать покрытие от источника до теста."
    category: "Трассировка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как провести impact analysis изменения требования?"
    answer: "Найти связанные сценарии, контракты, данные, код, тесты, документацию, команды и сроки; оценить риски, стоимость и варианты реализации."
    category: "Изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему изменённое требование нельзя просто дописать в конец старого документа?"
    answer: "Могут остаться противоречащие правила и непонятно, что действует сейчас. Нужно обновить единый актуальный источник, историю решения и связанные артефакты."
    category: "Изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое baseline требований?"
    answer: "Согласованный на определённый момент набор требований, относительно которого контролируют изменения. Он не запрещает изменения, а делает их явными."
    category: "Версии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие атрибуты полезно хранить у требования?"
    answer: "Идентификатор, источник, владелец, статус, приоритет, версия, дата решения и связи с артефактами. Набор выбирают по потребностям команды."
    category: "Управление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить владельца спорного бизнес-правила?"
    answer: "Найти роль, отвечающую за процесс, результат и риск; зафиксировать право принятия решения и согласовать его с затронутыми сторонами."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверять требования с тестировщиком до разработки?"
    answer: "Попросить вывести позитивные, граничные и ошибочные проверки из формулировок; если ожидаемый результат невозможно определить, уточнить правило."
    category: "Ревью"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверять требования с разработчиком до начала реализации?"
    answer: "Пройти данные, состояния, контракты, ограничения и отказные сценарии; записать технические допущения и вопросы, влияющие на объём."
    category: "Ревью"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему согласование требования не означает, что оно понятно всем исполнителям?"
    answer: "Участники могут вкладывать разные значения в термины и пропускать исключения. Нужны примеры, совместный разбор и проверка понимания на сценариях."
    category: "Согласование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как фиксировать решение, принятое устно на встрече?"
    answer: "Записать правило, обоснование, дату, участников и затронутые артефакты; дать ответственным возможность подтвердить запись."
    category: "Согласование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если требование изменилось после начала спринта?"
    answer: "Оценить влияние на текущую работу, ценность и сроки, согласовать решение о замене или переносе с владельцем продукта и обновить артефакты и критерии."
    category: "Изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как отличить дефект реализации от изменения требований?"
    answer: "Сравнить наблюдаемое поведение с согласованным на момент реализации контрактом. Если контракт не определял случай, требуется решение по требованию; если определял и нарушен — дефект."
    category: "Классификация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему важно фиксировать отклонённые варианты решения?"
    answer: "Иначе позже повторяют уже рассмотренный спор, не зная ограничений и последствий. Краткое обоснование сохраняет контекст решения."
    category: "История решений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как убедиться, что реализованная фича решает исходную проблему?"
    answer: "Сверить результат с целевой метрикой и пользовательским сценарием, получить обратную связь и проверить фактическое использование, а не только закрытие задач."
    category: "Оценка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какие сигналы указывают, что требование устарело?"
    answer: "Изменились процесс, закон или источник данных, владелец, API, метрика цели либо реализованное поведение; истёк срок действия правила."
    category: "Актуальность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем разделять обязательные требования и пожелания?"
    answer: "Это делает приоритет и компромиссы явными, помогает выбрать минимальный релиз и не потерять регуляторные или критические ограничения."
    category: "Приоритизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как работать с требованиями нескольких команд к одному API?"
    answer: "Собрать сценарии потребителей, выявить конфликты, определить владельца контракта, согласовать совместимые изменения и план миграции."
    category: "Межкомандная работа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если тестировщик нашёл сценарий, которого нет в требованиях?"
    answer: "Оценить риск и ожидаемое поведение с владельцем правила, затем обновить требования, критерии и тесты. Не оставлять решение только в тест-кейсе."
    category: "Пробелы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как использовать примеры для проверки бизнес-правила?"
    answer: "Подобрать обычный случай, границы и исключения; попросить участников назвать ожидаемый результат. Расхождения выявляют неоднозначность правила."
    category: "Примеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему нельзя считать документ завершённым только потому, что у него статус «согласовано»?"
    answer: "Нужно проверить, что актуальная версия доступна команде, связи с реализацией и тестами сохранены, а изменения процесса отражены в артефактах."
    category: "Жизненный цикл"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

