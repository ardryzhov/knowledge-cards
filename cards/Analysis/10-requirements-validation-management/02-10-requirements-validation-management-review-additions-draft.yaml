topic: "Проверка и управление требованиями"
cards:
  - question: "Что такое переходные требования?"
    answer: "Они описывают временные условия перехода от текущего решения к целевому: миграцию данных, обучение пользователей, параллельную работу версий и вывод старого процесса. После перехода часть таких требований теряет актуальность."
    category: "Виды требований"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда полезна SRS вместо разрозненных user stories?"
    answer: "Когда требуется единая спецификация поведения, интерфейсов и ограничений сложной системы с несколькими потребителями или формальным согласованием. Её объём выбирают по риску и контексту; название документа само по себе не гарантирует качества."
    category: "Артефакты"
