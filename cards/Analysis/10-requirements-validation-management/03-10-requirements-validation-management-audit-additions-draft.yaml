topic: "Проверка и управление требованиями"
cards:
  - question: "Что обычно фиксируют в Vision and Scope до подробной спецификации требований?"
    answer: "Проблему и цель, заинтересованные стороны, границы решения, ожидаемый результат, основные ограничения и то, что остаётся вне объёма. Название документа в командах различается; важен согласованный смысл этих решений."
    category: "Артефакты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем BRD отличается от SRS по назначению?"
    answer: "BRD обычно фиксирует бизнес-цели, потребности и правила, а SRS — требуемое поведение системы, интерфейсы и ограничения. Состав документов зависит от процесса команды; важнее прослеживаемая связь между бизнес-целью и системным требованием."
    category: "Артефакты"
