- id: 3f1311ed-da28-480f-b883-53766946a165
  question: Что такое opportunity cost в выборе бизнес-инициативы?
  answer: Это ценность лучшей альтернативы, от которой приходится отказаться из-за
    ограниченных ресурсов. Её учитывают при приоритизации, даже если прямых расходов
    на выбранную инициативу немного.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1480dea0-1ea3-45ed-80fa-012dc0e3296a
  question: Как оценивать инициативу, у которой польза связана с выполнением обязательного
    требования, а не с ростом выручки?
  answer: Описать обязательство, последствия невыполнения, сроки, допустимые варианты
    и стоимость соблюдения. Финансовый ROI здесь не единственный критерий; важны риск,
    соответствие требованиям и устойчивость процесса.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a77476dd-4eb7-4635-8565-61250f4e8519
  question: Как отличить подтверждённый факт от допущения при расчёте ожидаемой пользы?
  answer: Для факта указать источник и метод измерения, для допущения — на чём оно
    основано и как его проверить. Критичные допущения вынести в риск решения и не
    представлять прогноз как измеренный результат.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7708c676-248e-439d-b99e-1a9b9d34c0a5
  question: Что проверить перед использованием ROI как аргумента в пользу автоматизации
    процесса?
  answer: Что учтены все существенные затраты и выгоды за один горизонт, а формула
    и исходные данные согласованы. Если экономия времени не приводит к реальному высвобождению
    ресурсов или росту объёма, её нельзя автоматически считать денежной выгодой.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1de80335-8e2c-493c-bf0f-76ed890c9fbd
  question: Что показывает ROI в упрощённой оценке инициативы?
  answer: 'ROI сравнивает чистую выгоду с вложениями: (выгода − затраты) / затраты
    × 100% за одинаковый период. Для решения важно раскрыть, какие выгоды и затраты
    вошли в расчёт и насколько надёжны исходные оценки.'
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 04764e76-fb50-49e1-94b7-0b31096d533a
  question: Как использовать MoSCoW при приоритизации бизнес-требований?
  answer: Разделить требования на Must, Should, Could и Won't для выбранного горизонта
    поставки. Для Must нужен проверяемый аргумент, почему без него результат невозможен
    или нарушено обязательное ограничение; иначе категория потеряет смысл.
  category: Приоритизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: aa31fcaa-5ed9-4e51-93df-e8edeb459fd0
  question: Как связать бизнес-цель с конкретными требованиями к системе?
  answer: Для каждого значимого требования указать, какой пользовательский шаг или
    бизнес-результат оно меняет. Если связи нет, проверить необходимость требования;
    отдельно сохранить ограничения, обязательные независимо от цели.
  category: Трассировка ценности
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 695f979a-9c2e-4e8b-872e-f97957983986
  question: Почему рост числа операций не обязательно означает рост ценности продукта?
  answer: Операции могут повторяться из-за ошибок или дробления работы. Нужно измерять
    завершённый полезный результат вместе с затратами, качеством и влиянием на клиентов.
  category: Измерение результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2b10e87f-c559-4c4f-99be-653fa552c42d
  question: Как выбрать основную метрику для сокращения ручной обработки заявок?
  answer: Измерять, например, долю заявок без ручного вмешательства среди подходящих
    заявок или время до завершения. Определить критерии подходящей заявки, период
    и способ учёта повторов; добавить ограничивающие метрики ошибок и жалоб.
  category: Измерение результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 28e2c05f-5501-4713-bcc5-9eb5ce3430da
  question: Зачем измерять исходное состояние до изменения бизнес-процесса?
  answer: Без него нельзя сопоставить результат с прежней практикой и оценить естественные
    колебания. Зафиксировать период, сегменты, правила расчёта и качество данных.
  category: Измерение результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3a2dcd8e-aa7d-4041-8870-e3b26982fc4f
  question: Почему при оценке улучшения процесса важно сегментировать клиентов или
    типы заявок?
  answer: Среднее по всем заявкам может скрыть ухудшение сложных или приоритетных
    случаев при изменении состава потока. Сравнивать нужно сопоставимые сегменты и
    отдельно проверять критичные группы.
  category: Измерение результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: abc9a062-edc7-49ec-b323-b4043bace79c
  question: Как проверить, что бизнес-цель достижима при существующих ограничениях?
  answer: Оценить данные, полномочия, срок, бюджет, зависимости и обязательные контроли.
    Если цель недостижима в заданных границах, предложить меньший результат или изменить
    условия с владельцем решения.
  category: Оценка осуществимости
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0f8dbc83-71bf-437f-9ed1-7377c3fbe1bd
  question: Что делать, если два стейкхолдера называют разные критерии успеха одной
    инициативы?
  answer: Выяснить, какие результаты каждый защищает и можно ли измерить их вместе.
    Зафиксировать конфликт и передать решение владельцу цели; не выбирать критерий
    только потому, что его легче собрать.
  category: Ценность и стейкхолдеры
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
