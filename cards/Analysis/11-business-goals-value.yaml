- id: 5ca13b4c-68c7-4177-ba9b-f39720c4b9e5
  question: Почему одобрение business case не означает, что исходные оценки больше
    не нужно проверять?
  answer: Стоимость, объём и эффект меняются по мере получения данных. Допущения и
    фактические показатели нужно пересматривать, чтобы вовремя изменить решение или
    остановить инициативу.
  category: Business case
