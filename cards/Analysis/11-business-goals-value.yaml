- id: efbee2cb-aabc-4475-bd5c-aea84020e4ab
  question: Когда бизнес-аналитику стоит предложить изменение процесса без разработки
    нового ПО?
  answer: Когда корневая причина в правилах, распределении ответственности или лишнем
    согласовании, а существующие системы уже поддерживают нужное действие. Сравнить
    стоимость и риск организационного изменения с автоматизацией.
  category: Оценка осуществимости
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
