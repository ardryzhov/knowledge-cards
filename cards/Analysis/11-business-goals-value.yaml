- id: b0c03316-4399-4495-8253-3fa5ebaa5862
  question: Как объяснить заказчику, что предлагаемая функция не закрывает исходную
    бизнес-проблему?
  answer: Показать наблюдаемую причину проблемы, влияние предложенной функции на неё
    и альтернативы. Обсуждать достижение цели и подтверждающие данные, а не спорить
    о предпочтениях в интерфейсе.
