- id: a8316d49-a923-4c1c-9586-483ac564d114
  question: Как выбрать первый полезный срез инициативы, если полный эффект появится
    только после нескольких релизов?
  answer: Выделить завершённый сценарий для конкретной группы с проверяемой промежуточной
    пользой и низким риском. Указать, какие допущения этот срез проверит и что остаётся
    до полной бизнес-цели.
