- id: 65761447-5bea-4234-96de-c8c376d65a55
  question: Как отличить бизнес-проблему от просьбы внедрить конкретную функцию?
  answer: Проблема описывает неудовлетворительный результат процесса или пользователя,
    а функция — один возможный способ его изменить. Уточни текущий результат, причины,
    затронутых людей и желаемое состояние до выбора решения.
  category: Проблема и цель
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 39f69b35-c528-439d-8e5d-5e49f6d5f2eb
  question: С чего начать анализ запроса «сократить время выдачи кредита»?
  answer: Уточнить, какой кредит и этап процесса имеется в виду, как сейчас измеряют
    время, где возникают задержки и кто участвует. Затем определить желаемое изменение
    и ограничения по риску, качеству решений и требованиям банка.
  category: Проблема и цель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b12ffaf7-1ba3-48f2-91bc-8ca8b7deabe3
  question: Как сформулировать измеримую бизнес-цель без подмены её техническим результатом?
  answer: Указать аудиторию, исходное значение, целевой показатель и срок наблюдения.
    Например, сократить медианное время обработки завершённых заявок при сохранении
    допустимой доли ошибок; релиз API сам по себе не цель.
  category: Проблема и цель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d842c832-301d-4760-95c1-7542e050e3bc
  question: Зачем анализировать текущую ситуацию, если заказчик уже предложил решение?
  answer: Предложение может устранять симптом, а не причину, и не учитывать ограничения
    процесса. Анализ текущих данных и практики позволяет сравнить альтернативы и проверить,
    нужен ли вообще новый функционал.
  category: Проблема и цель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 02889f48-7c8d-41ac-83bd-44c326df9307
  question: Чем цель бизнеса отличается от KPI отдельного подразделения?
  answer: Цель описывает желаемое изменение результата, а KPI измеряет определённый
    аспект работы. Локальный KPI может расти при ухудшении сквозного процесса, поэтому
    его связь с бизнес-целью нужно проверять.
  category: Проблема и цель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: df82fac6-b284-49ed-acdd-95c709df2644
  question: Как определить, кто получит ценность от изменения и кто понесёт затраты?
  answer: Составить группы пользователей, операционных команд, владельцев процесса
    и смежных подразделений. Для каждой указать ожидаемую пользу, дополнительные действия
    и риски; решение может помогать одной группе и усложнять работу другой.
  category: Ценность и стейкхолдеры
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b3179da6-2453-4f79-928c-61bac2ae4cd1
  question: Что включить в краткий business case для небольшой фичи?
  answer: Проблему и исходные данные, цель, несколько вариантов решения, ожидаемую
    пользу, затраты и ограничения, ключевые допущения и способ проверить эффект. Объём
    документа выбирают по стоимости и риску решения.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 522e3020-7201-4f1a-93da-457f6cbb2980
  question: Почему в business case полезно рассматривать вариант «ничего не менять»?
  answer: Он даёт базовую стоимость и риск текущего состояния. Без него трудно понять,
    оправдывают ли ожидаемые выгоды затраты и побочные эффекты предложенного изменения.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: db9e7e95-bf85-4e16-98f8-49b8262aa9c2
  question: Как сравнить два решения, если одно дешевле в разработке, а другое снижает
    ручной труд после запуска?
  answer: Считать не только стоимость реализации, но и эксплуатацию, труд сотрудников,
    риск ошибок и длительность эффекта. Зафиксировать горизонт сравнения и неопределённость
    оценок; решение зависит от приоритета бизнеса.
  category: Business case
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
