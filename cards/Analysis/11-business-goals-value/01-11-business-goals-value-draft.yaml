topic: "Бизнес-цели и ценность"
cards:
  - question: "Как отличить бизнес-проблему от просьбы внедрить конкретную функцию?"
    answer: "Проблема описывает неудовлетворительный результат процесса или пользователя, а функция — один возможный способ его изменить. Уточни текущий результат, причины, затронутых людей и желаемое состояние до выбора решения."
    category: "Проблема и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "С чего начать анализ запроса «сократить время выдачи кредита»?"
    answer: "Уточнить, какой кредит и этап процесса имеется в виду, как сейчас измеряют время, где возникают задержки и кто участвует. Затем определить желаемое изменение и ограничения по риску, качеству решений и требованиям банка."
    category: "Проблема и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сформулировать измеримую бизнес-цель без подмены её техническим результатом?"
    answer: "Указать аудиторию, исходное значение, целевой показатель и срок наблюдения. Например, сократить медианное время обработки завершённых заявок при сохранении допустимой доли ошибок; релиз API сам по себе не цель."
    category: "Проблема и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем анализировать текущую ситуацию, если заказчик уже предложил решение?"
    answer: "Предложение может устранять симптом, а не причину, и не учитывать ограничения процесса. Анализ текущих данных и практики позволяет сравнить альтернативы и проверить, нужен ли вообще новый функционал."
    category: "Проблема и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем цель бизнеса отличается от KPI отдельного подразделения?"
    answer: "Цель описывает желаемое изменение результата, а KPI измеряет определённый аспект работы. Локальный KPI может расти при ухудшении сквозного процесса, поэтому его связь с бизнес-целью нужно проверять."
    category: "Проблема и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить, кто получит ценность от изменения и кто понесёт затраты?"
    answer: "Составить группы пользователей, операционных команд, владельцев процесса и смежных подразделений. Для каждой указать ожидаемую пользу, дополнительные действия и риски; решение может помогать одной группе и усложнять работу другой."
    category: "Ценность и стейкхолдеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что включить в краткий business case для небольшой фичи?"
    answer: "Проблему и исходные данные, цель, несколько вариантов решения, ожидаемую пользу, затраты и ограничения, ключевые допущения и способ проверить эффект. Объём документа выбирают по стоимости и риску решения."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему в business case полезно рассматривать вариант «ничего не менять»?"
    answer: "Он даёт базовую стоимость и риск текущего состояния. Без него трудно понять, оправдывают ли ожидаемые выгоды затраты и побочные эффекты предложенного изменения."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сравнить два решения, если одно дешевле в разработке, а другое снижает ручной труд после запуска?"
    answer: "Считать не только стоимость реализации, но и эксплуатацию, труд сотрудников, риск ошибок и длительность эффекта. Зафиксировать горизонт сравнения и неопределённость оценок; решение зависит от приоритета бизнеса."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое opportunity cost в выборе бизнес-инициативы?"
    answer: "Это ценность лучшей альтернативы, от которой приходится отказаться из-за ограниченных ресурсов. Её учитывают при приоритизации, даже если прямых расходов на выбранную инициативу немного."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как оценивать инициативу, у которой польза связана с выполнением обязательного требования, а не с ростом выручки?"
    answer: "Описать обязательство, последствия невыполнения, сроки, допустимые варианты и стоимость соблюдения. Финансовый ROI здесь не единственный критерий; важны риск, соответствие требованиям и устойчивость процесса."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличить подтверждённый факт от допущения при расчёте ожидаемой пользы?"
    answer: "Для факта указать источник и метод измерения, для допущения — на чём оно основано и как его проверить. Критичные допущения вынести в риск решения и не представлять прогноз как измеренный результат."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить перед использованием ROI как аргумента в пользу автоматизации процесса?"
    answer: "Что учтены все существенные затраты и выгоды за один горизонт, а формула и исходные данные согласованы. Если экономия времени не приводит к реальному высвобождению ресурсов или росту объёма, её нельзя автоматически считать денежной выгодой."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что показывает ROI в упрощённой оценке инициативы?"
    answer: "ROI сравнивает чистую выгоду с вложениями: (выгода − затраты) / затраты × 100% за одинаковый период. Для решения важно раскрыть, какие выгоды и затраты вошли в расчёт и насколько надёжны исходные оценки."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как использовать MoSCoW при приоритизации бизнес-требований?"
    answer: "Разделить требования на Must, Should, Could и Won't для выбранного горизонта поставки. Для Must нужен проверяемый аргумент, почему без него результат невозможен или нарушено обязательное ограничение; иначе категория потеряет смысл."
    category: "Приоритизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как связать бизнес-цель с конкретными требованиями к системе?"
    answer: "Для каждого значимого требования указать, какой пользовательский шаг или бизнес-результат оно меняет. Если связи нет, проверить необходимость требования; отдельно сохранить ограничения, обязательные независимо от цели."
    category: "Трассировка ценности"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему рост числа операций не обязательно означает рост ценности продукта?"
    answer: "Операции могут повторяться из-за ошибок или дробления работы. Нужно измерять завершённый полезный результат вместе с затратами, качеством и влиянием на клиентов."
    category: "Измерение результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать основную метрику для сокращения ручной обработки заявок?"
    answer: "Измерять, например, долю заявок без ручного вмешательства среди подходящих заявок или время до завершения. Определить критерии подходящей заявки, период и способ учёта повторов; добавить ограничивающие метрики ошибок и жалоб."
    category: "Измерение результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем измерять исходное состояние до изменения бизнес-процесса?"
    answer: "Без него нельзя сопоставить результат с прежней практикой и оценить естественные колебания. Зафиксировать период, сегменты, правила расчёта и качество данных."
    category: "Измерение результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему при оценке улучшения процесса важно сегментировать клиентов или типы заявок?"
    answer: "Среднее по всем заявкам может скрыть ухудшение сложных или приоритетных случаев при изменении состава потока. Сравнивать нужно сопоставимые сегменты и отдельно проверять критичные группы."
    category: "Измерение результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить, что бизнес-цель достижима при существующих ограничениях?"
    answer: "Оценить данные, полномочия, срок, бюджет, зависимости и обязательные контроли. Если цель недостижима в заданных границах, предложить меньший результат или изменить условия с владельцем решения."
    category: "Оценка осуществимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если два стейкхолдера называют разные критерии успеха одной инициативы?"
    answer: "Выяснить, какие результаты каждый защищает и можно ли измерить их вместе. Зафиксировать конфликт и передать решение владельцу цели; не выбирать критерий только потому, что его легче собрать."
    category: "Ценность и стейкхолдеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выбрать первый полезный срез инициативы, если полный эффект появится только после нескольких релизов?"
    answer: "Выделить завершённый сценарий для конкретной группы с проверяемой промежуточной пользой и низким риском. Указать, какие допущения этот срез проверит и что остаётся до полной бизнес-цели."
    category: "Трассировка ценности"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда бизнес-аналитику стоит предложить изменение процесса без разработки нового ПО?"
    answer: "Когда корневая причина в правилах, распределении ответственности или лишнем согласовании, а существующие системы уже поддерживают нужное действие. Сравнить стоимость и риск организационного изменения с автоматизацией."
    category: "Оценка осуществимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему одобрение business case не означает, что исходные оценки больше не нужно проверять?"
    answer: "Стоимость, объём и эффект меняются по мере получения данных. Допущения и фактические показатели нужно пересматривать, чтобы вовремя изменить решение или остановить инициативу."
    category: "Business case"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как объяснить заказчику, что предлагаемая функция не закрывает исходную бизнес-проблему?"
    answer: "Показать наблюдаемую причину проблемы, влияние предложенной функции на неё и альтернативы. Обсуждать достижение цели и подтверждающие данные, а не спорить о предпочтениях в интерфейсе."
    category: "Ценность и стейкхолдеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
