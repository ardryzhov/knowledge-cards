- id: f9c867a4-3fc9-49ad-aff9-340ac05f79ae
  question: Как определить границы бизнес-процесса перед его улучшением?
  answer: Назвать событие запуска, результат для клиента или бизнеса, участников,
    входы, выходы и смежные процессы. Иначе можно улучшить локальный шаг и не заметить
    задержку до или после него.
  category: Границы процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dbe14e89-8c19-4da6-8a82-e4839119de9e
  question: Какие данные стоит собрать о процессе AS-IS помимо схемы шагов?
  answer: Фактические объёмы, время ожидания и выполнения, долю возвратов, ошибки,
    исключения и ручные обходы. Схема показывает предполагаемый маршрут, а данные
    помогают оценить реальную работу.
  category: Измерение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 87501f8b-9f01-486f-892c-9ed0f895929c
  question: Чем время выполнения операции отличается от времени прохождения заявки
    через процесс?
  answer: Время выполнения отражает активную работу, а время прохождения включает
    очереди, ожидание согласований и передачу между участниками. Для клиента обычно
    важно полное время до результата.
  category: Измерение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: cfc91b92-60bb-4f1b-91df-0f8fcf156bfd
  question: Как обнаружить узкое место в процессе, если все участники говорят, что
    работают быстро?
  answer: 'Измерить поток по этапам: входящий объём, очередь, время ожидания, производительность
    и возвраты. Узкое место может быть в передаче или согласовании, даже если отдельный
    исполнитель работает быстро.'
  category: Узкие места
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0424dc41-5d75-4036-bc4d-a0eab66ff9cc
  question: Почему автоматизация одного шага может не ускорить весь процесс?
  answer: Если следующий этап имеет меньшую пропускную способность или прежние согласования
    остаются, накопится очередь. Нужно оценить сквозной поток и ограничения после
    предлагаемого изменения.
  category: Узкие места
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ce77659e-f3ee-453c-8a70-466e3b9d3299
  question: Как использовать «пять почему» при разборе повторных возвратов заявки?
  answer: Для конкретного наблюдаемого дефекта последовательно спрашивать, почему
    он возник, и проверять ответы фактами. Метод помогает выйти за пределы симптома,
    но число вопросов не является правилом и вывод нужно подтвердить данными.
  category: Поиск причин
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 919917fe-2a61-49e5-b3cc-d412866fda0e
  question: Когда диаграмма Исикавы полезнее одного объяснения причины сбоя процесса?
  answer: Когда на результат могут одновременно влиять люди, правила, данные, система
    и внешние зависимости. Она помогает собрать гипотезы, после чего каждую существенную
    причину проверяют фактами.
  category: Поиск причин
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7edf442c-ebd4-42ea-a43b-02875dbfd1e3
  question: Как отличить корневую причину проблемы процесса от её симптома?
  answer: 'Предложить проверяемую связь: если устранить предполагаемую причину, должен
    измениться наблюдаемый результат. Сопоставить её с несколькими случаями, включая
    исключения, а не опираться на единичный рассказ.'
  category: Поиск причин
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 12da4b36-35b0-473e-96b8-1e387fba34d7
  question: Как провести gap analysis между AS-IS и TO-BE?
  answer: Сравнить нужные способности, роли, правила, данные и контрольные точки текущего
    и целевого процесса. Для каждого разрыва определить изменение, владельца и способ
    проверки, что разрыв закрыт.
  category: Проектирование TO-BE
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 912838ea-1380-4967-b17e-60370c4cbd47
  question: Почему процесс TO-BE не стоит проектировать как AS-IS с добавленным новым
    экраном?
  answer: Так сохраняются старые лишние шаги и ручные обходы. Сначала проверить, какие
    действия действительно нужны для цели и обязательных контролей, затем определить
    роль системы в новом процессе.
  category: Проектирование TO-BE
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 715328ab-ae33-4ab8-ae32-3b40919c422b
  question: Какие исключения нужно учесть при проектировании процесса оформления банковского
    продукта?
  answer: Отказ внешней проверки, неполные данные, отмену клиентом, повторную заявку,
    истечение времени и необходимость ручного решения. Для каждого определить ответственного
    и конечное состояние операции.
  category: Проектирование TO-BE
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 44ffa0a7-2841-4d55-a410-dcefe71c5002
  question: Как проверить, что новый процесс не потерял обязательную контрольную точку?
  answer: Сопоставить действующие правила и риски с шагами TO-BE, определить владельца
    контроля и доказательство его выполнения. Удаление ручного шага не должно незаметно
    удалить проверку, которую он обеспечивал.
  category: Контроли и риски
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 03690df5-2183-4f9d-829b-180010cd32ba
  question: Почему разделение обязанностей может ограничивать автоматизацию банковского
    процесса?
  answer: Некоторые решения требуют независимого подтверждения или разных полномочий.
    Автоматизация должна сохранить требуемый контроль и след решения, а не объединять
    несовместимые действия у одного участника.
  category: Контроли и риски
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e4576909-2b67-45c3-8eb0-d3b4e8e15d73
  question: Как оценить влияние нового процесса на сотрудника, который получает результат
    предыдущего шага?
  answer: Проверить формат и полноту передаваемых данных, изменённое время поступления,
    права и объём ручной проверки. Улучшение для отправителя может создать дополнительную
    работу получателю.
  category: Передачи и роли
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4eba781e-352a-4853-8a80-6d3173b5c3a7
  question: Что делать, если часть сотрудников использует неописанный ручной обход
    официального процесса?
  answer: Выяснить, какую потребность закрывает обход и почему официальный маршрут
    не работает. Зафиксировать частоту и риск, затем решить, нужно ли менять правило,
    систему или обучение; просто запретить обход недостаточно.
  category: Передачи и роли
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 9ca76eaf-ce05-48f9-96fd-318a737108d8
  question: Как измерить объём переработки в процессе заявок?
  answer: Задать событие возврата на предыдущий шаг и считать долю заявок с таким
    возвратом среди сопоставимых заявок, а также число повторов и причину. Сохранять
    идентификатор заявки, чтобы повтор не считался новой заявкой.
  category: Измерение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fcf39a57-9ef8-4733-938f-2bbb4942668f
  question: Зачем при анализе процесса различать входящий поток и незавершённую работу?
  answer: Рост очереди может быть следствием прихода новых задач быстрее, чем их завершения.
    Без обоих показателей нельзя понять, помогает ли ускорение этапа и где возникает
    накопление.
  category: Измерение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ece64d78-cdad-4e9a-9cb3-f3fe5d4511cc
  question: Как проверить, что предлагаемое сокращение согласований не повышает риск
    ошибочных решений?
  answer: Определить, какие ошибки предотвращало согласование, и измерить их частоту
    и последствия. Заменить избыточное действие подходящим контролем или выборочной
    проверкой и наблюдать ограничивающие показатели.
  category: Контроли и риски
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0b525e93-7c54-4dca-a30e-0266a5ff84a5
  question: Когда стоит провести пилот нового бизнес-процесса перед массовым внедрением?
  answer: Когда есть неопределённость в нагрузке, поведении участников или сохранении
    контроля. Выбрать ограниченную группу и критерии успеха, обеспечить возврат к
    прежнему порядку и собрать обратную связь.
  category: Внедрение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 936a8815-1b0e-44b6-afdc-fde222c7d5ca
  question: Как отличить улучшение процесса от переноса работы на другую команду?
  answer: Измерять сквозное время, трудозатраты и ошибки по всем затронутым участникам.
    Если один отдел экономит время, а другой получает равный или больший объём ручной
    работы, общая ценность не выросла.
  category: Узкие места
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 34d94459-80f1-43d3-84fb-7a65898c27a7
  question: Что должно измениться в инструкции сотрудников после внедрения нового
    процесса?
  answer: Шаги и роли, правила исключений, критерии передачи, действия при сбое и
    место фиксации результата. Обновление инструкции следует проверить на реальном
    сценарии с пользователями процесса.
  category: Внедрение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5b8a1e03-5ffc-4788-a50d-6706dcc6fb0c
  question: Как выбрать метрики для процесса, в котором ускорение может ухудшить качество
    решения?
  answer: Задать основную метрику времени или пропускной способности и ограничивающие
    показатели ошибок, возвратов и жалоб. Определить единицу учёта и период, чтобы
    сравнение было корректным.
  category: Измерение процесса
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: da48578f-8a8a-4ff2-90e2-29dc81c13d76
  question: Что делать, если после автоматизации ручной шаг исчез, но число исключений
    выросло?
  answer: Проверить, какие случаи раньше неявно обрабатывал сотрудник, и сопоставить
    новые исключения с правилами TO-BE. Восстановить нужный контроль или изменить
    маршрут, затем повторно измерить сквозной результат.
  category: Внедрение процесса
