topic: "Стейкхолдеры и оценка решения"
cards:
  - question: "Почему список заинтересованных сторон недостаточен для управления изменением?"
    answer: "Нужно понять, как изменение затронет каждую группу, кто принимает решения, кто предоставляет знания и кто будет пользоваться результатом. Это определяет способы вовлечения и согласования."
    category: "Работа со стейкхолдерами"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как использовать карту влияния и заинтересованности стейкхолдеров?"
    answer: "Для каждой группы оценить её влияние на решение и степень затронутости изменением, затем выбрать способ вовлечения. Карта помогает не пропустить ключевых участников, но не определяет автоматически, кто вправе утверждать бизнес-правило."
    category: "Работа со стейкхолдерами"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить владельца бизнес-правила, если его применяют несколько подразделений?"
    answer: "Выяснить, кто отвечает за результат и вправе утвердить изменение правила, а кто лишь использует его. Зафиксировать решение и затронутые стороны; распространённость правила не означает коллективное право каждого переписывать его."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем спонсор инициативы отличается от владельца бизнес-процесса?"
    answer: "Спонсор обычно поддерживает решение о вложении ресурсов и ожидаемой ценности, владелец процесса отвечает за его правила и работу после внедрения. В конкретной организации роли могут совмещаться; полномочия нужно уточнять."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда матрица RACI помогает аналитику?"
    answer: "Когда при передаче задачи между несколькими командами неясно, кто выполняет действие, утверждает решение, консультирует и получает информацию. Матрица помогает выявить пробелы, но не заменяет согласования реальных полномочий."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как работать с влиятельным стейкхолдером, который не будет пользователем решения?"
    answer: "Уточнить его цели, полномочия и критерии согласования, показать влияние вариантов на бизнес-результат. Отдельно получить обратную связь от тех, кто будет ежедневно выполнять процесс."
    category: "Работа со стейкхолдерами"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если пользователи и руководитель по-разному оценивают удобство нового процесса?"
    answer: "Собрать конкретные сценарии, время и ошибки пользователей, сопоставить их с целью руководителя и обязательными ограничениями. Представить варианты с последствиями, а решение зафиксировать у владельца цели."
    category: "Работа со стейкхолдерами"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем планировать встречи и согласования по рискам, а не приглашать всех стейкхолдеров на каждое обсуждение?"
    answer: "Разным решениям нужны разные эксперты и владельцы полномочий. Избыточное участие замедляет работу, а отсутствие нужного участника приводит к поздним изменениям; состав согласования выбирают по затронутому решению."
    category: "Работа со стейкхолдерами"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как понять, что решение было согласовано, а не просто показано на встрече?"
    answer: "Зафиксировать предмет решения, выбранный вариант, условия, ответственного и явное подтверждение по принятому процессу. Молчание участников или отсутствие возражений не всегда означает согласие."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое UAT и какую задачу оно решает?"
    answer: "User Acceptance Testing — проверка решения представителями бизнеса или пользователей на соответствие согласованным сценариям и потребностям. Она помогает принять результат, но не заменяет технические тесты и проверку безопасности."
    category: "Бизнес-приёмка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как подготовить бизнес-приёмку новой функции до её разработки?"
    answer: "Определить целевые пользовательские сценарии, данные, ожидаемые результаты, роли участников и критерии принятия. Заранее уточнить, какие отклонения блокируют выпуск, чтобы приёмка не превратилась в свободное обсуждение вкусов."
    category: "Бизнес-приёмка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему успешный E2E-тест не означает, что бизнес готов принять решение?"
    answer: "Тест проверяет заранее описанное поведение, но пользователи могут обнаружить пропущенный процесс, неудобный ручной шаг или неподходящее правило. Приёмка проверяет практическую пригодность для согласованной цели."
    category: "Бизнес-приёмка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если на UAT обнаружили сценарий, которого нет в согласованных требованиях?"
    answer: "Выяснить, является ли он пропущенным обязательным правилом, дефектом или новой потребностью. Оценить влияние на цель и релиз, согласовать решение с владельцем требования и обновить артефакты."
    category: "Бизнес-приёмка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как оформить результат UAT при известных отклонениях?"
    answer: "Записать проверенные сценарии, фактические результаты, отклонения, их влияние и решение уполномоченного владельца: принять, исправить до релиза или выпустить с ограничением. Статус «пройдено» без условий скрывает риск."
    category: "Бизнес-приёмка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему обучение пользователей может быть частью успешного внедрения даже при правильном коде?"
    answer: "Люди должны понимать новый порядок действий и исключения. Без инструкции и поддержки они могут продолжить старый обход, поэтому ожидаемая ценность не появится."
    category: "Внедрение изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выявить, что подразделение не готово использовать новое решение?"
    answer: "Проверить полномочия, инструкции, обучение, данные, поддержку, нагрузку и зависимые процессы. Техническая готовность сервиса не означает организационную готовность людей и процедур."
    category: "Внедрение изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличить низкое использование новой функции от отсутствия потребности в ней?"
    answer: "Проверить, узнали ли пользователи о функции, имеют ли доступ, подходит ли она реальному сценарию и не мешают ли ошибки. Только после этого пересматривать гипотезу о потребности."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие ограничения внедрённого решения может выявить аналитик после релиза?"
    answer: "Непокрытые сценарии, качество данных, неудобные исключения, задержки и незапланированный ручной труд. Их связывают с целевой пользой и определяют, нужна ли доработка решения."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем ограничение самого решения отличается от ограничения организации при оценке эффекта?"
    answer: "Решение может не поддерживать нужный сценарий или ошибаться; организация может не иметь обученных людей, полномочий или изменённого регламента. Исправления для этих причин различаются."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если функция принята на UAT, но спустя месяц ожидаемого эффекта нет?"
    answer: "Проверить достоверность метрик, фактическое использование, соблюдение нового процесса и внешние изменения. Выяснить, неверна ли гипотеза, мешает ли внедрение или не работает решение; затем предложить действие владельцу инициативы."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, что улучшение после релиза вызвано именно новым решением?"
    answer: "Сравнить сопоставимые группы или периоды, учесть изменения нагрузки, состава клиентов и других инициатив. Если строгий эксперимент невозможен, честно указать ограничения причинного вывода."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Кто должен отвечать за измерение бизнес-эффекта после передачи функции в эксплуатацию?"
    answer: "Нужен назначенный владелец результата и понятный источник метрик; аналитик помогает определить измерение и интерпретировать данные. Без владельца эффект часто перестают проверять после закрытия задачи."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как использовать жалобы и обращения после релиза для оценки решения?"
    answer: "Сгруппировать обращения по сценариям и причинам, сопоставить с объёмом операций и количественными метриками. Единичный отзыв — сигнал для проверки, но не достаточная оценка всего результата."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если новый процесс улучшает KPI руководителя, но увеличивает ошибки у клиентов?"
    answer: "Показать оба эффекта на сопоставимых данных, оценить ущерб и пересмотреть ограничивающие критерии успеха. Эскалировать решение владельцу цели; локальный KPI не должен скрывать ухудшение для клиента."
    category: "Оценка решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как закрыть инициативу так, чтобы результаты бизнес-анализа остались полезны команде?"
    answer: "Сохранить исходную цель, принятые решения, актуальные правила и процесс, результаты приёмки и измеренный эффект либо причину его отсутствия. Назначить владельца дальнейших изменений и открытых ограничений."
    category: "Завершение инициативы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
