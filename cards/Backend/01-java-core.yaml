- id: e93d6186-458e-426e-9199-00ca8f490dc0
  question: Что именно запрещает final для переменной, метода и класса?
  answer: final-переменной нельзя повторно присвоить значение после инициализации;
    если она хранит ссылку, состояние самого объекта всё ещё может меняться. final-метод
    нельзя переопределить в подклассе. От final-класса нельзя наследоваться.
  category: Объектная модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: df0fb578-3ec8-4d9a-9272-f22912b1dacd
  question: Почему одного объявления всех полей final недостаточно, чтобы сделать
    класс неизменяемым?
  answer: Поле final сохраняет ссылку, но не замораживает объект по этой ссылке. Если
    класс принимает или возвращает изменяемые объекты, его наблюдаемое состояние может
    измениться извне. Для неизменяемости нужны контроль над изменяемыми данными и,
    где требуется, защитные копии.
  category: Неизменяемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: cc3c74c1-c980-42d8-904e-f425db3153c1
  question: Почему результат String.replace() нужно сохранить, если требуется изменить
    текст?
  answer: String неизменяем. replace() возвращает строку с результатом замены и не
    меняет исходный объект. Если результат не использовать, значение переменной останется
    прежним.
  category: Строки
  context: 
  hint_1: 
