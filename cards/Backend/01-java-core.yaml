- id: 663079a1-ea13-462f-b848-4043e7761155
  question: В каком порядке try-with-resources закрывает несколько ресурсов?
  answer: 'Ресурсы закрываются в порядке, обратном их объявлению. Это соответствует
    принципу стека: последний открытый ресурс закрывается первым. Такой порядок полезен,
    когда один ресурс зависит от другого.'
