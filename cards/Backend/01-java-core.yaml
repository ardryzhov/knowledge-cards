- id: 9743db43-80df-42a2-8816-0b590982a9d5
  question: Чем Optional.of(value) отличается от Optional.ofNullable(value)?
  answer: Optional.of требует ненулевое значение и выбрасывает NullPointerException
    при null. Optional.ofNullable возвращает пустой Optional для null. Выбор показывает,
    является ли null допустимым входом для конкретного API.
  category: Optional
