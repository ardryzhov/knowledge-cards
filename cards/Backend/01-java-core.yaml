  question: Почему хранить enum в базе только по ordinal рискованно?
  answer: ordinal зависит от порядка объявления констант. Вставка или перестановка
    констант меняет числовые значения старых элементов и может исказить сохранённые
    данные. Стабильный внешний код или имя с явной политикой миграции обычно безопаснее.
