- id: 35ec3842-dd18-4be2-b72b-29ce8eb92952
  question: Как различаются checked и unchecked exceptions с точки зрения компилятора
    и контракта метода?
  answer: Checked exception нужно обработать или объявить в throws; компилятор проверяет
    это требование. RuntimeException и его наследники относятся к unchecked exceptions,
    поэтому такого требования нет. Выбор типа исключения должен отражать смысл ошибки
    и способ реакции вызывающего кода, а не только удобство компиляции.
  category: Исключения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 004caa4b-21a4-4f34-9d8e-690785a01ddd
  question: Что происходит, если при выполнении try-with-resources исключение возникло
    и в основном блоке, и при закрытии ресурса?
  answer: Основным остаётся исключение из блока try. Исключение, возникшее при закрытии
    ресурса, добавляется к нему как suppressed exception; его можно получить через
    getSuppressed(). Это позволяет сохранить обе причины ошибки.
  category: Исключения
  context: 
  hint_1: Механизм старается не потерять первоначальную ошибку.
  hint_2: Вспомни дополнительные исключения, прикреплённые к основному.
  difficulty: hard
  code: 
- id: a09b498f-6d7b-4f18-b392-fcd25eae67f6
  question: Чем orElse() отличается от orElseGet() с точки зрения вычисления запасного
    значения?
  answer: Аргумент orElse() вычисляется до вызова метода, даже если значение внутри
    Optional присутствует. orElseGet() принимает поставщик и вызывает его только тогда,
    когда значение отсутствует. Разница важна, если получение запасного значения дорогое
    или имеет побочный эффект.
  category: Optional
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eca0f736-52bf-455f-b8b9-5bb8d5d0462d
  question: Какой результат даёт Optional.map(), если переданная функция возвращает
    null?
  answer: Результатом будет пустой Optional. map() оборачивает результат функции с
    учётом возможного null. Если функция уже возвращает Optional, обычно нужен flatMap(),
    чтобы не получить вложенный Optional<Optional<T>>.
  category: Optional
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c8df32a2-efea-4035-81cb-57c6f4fddd0f
  question: Гарантирует ли record глубокую неизменяемость объекта?
  answer: Нет. Компоненты record хранятся в final-полях, но сами значения могут ссылаться
    на изменяемые объекты. Например, список внутри record можно изменить, если не
    контролировать его при создании и выдаче. record сокращает шаблонный код для носителя
    данных, но не делает весь граф объектов неизменяемым.
  category: Современная Java
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 906383e7-05dd-42fa-9f34-d75427af440a
  question: Какую задачу решает sealed-класс или интерфейс?
  answer: Он ограничивает набор классов, которым разрешено наследование или реализация.
    Это позволяет явно описать допустимые варианты модели и помогает проверять полноту
    обработки этих вариантов. Разрешённые наследники должны продолжить иерархию согласно
    правилам final, sealed или non-sealed.
  category: Современная Java
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 95b30765-431c-4906-9d07-2cc79f2ee8f4
  question: Почему локальная переменная, объявленная через var, не становится динамически
    типизированной?
  answer: Компилятор выводит её конкретный статический тип из инициализатора. После
    этого действуют обычные проверки типов Java. var сокращает запись объявления,
    но не позволяет переменной произвольно менять тип.
  category: Современная Java
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 506a1cb6-ce9f-4fec-ab7f-d9efa50c1519
  question: Чем switch-выражение отличается от обычного switch-оператора?
  answer: switch-выражение вычисляет значение, поэтому его ветви должны определять
    результат, а набор ветвей должен быть исчерпывающим. В ветви с блоком результат
    передают через yield. Форма со стрелкой также исключает случайный переход в следующую
    ветвь.
  category: Современная Java
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ce596f5d-798d-40b9-9ae6-766886c6ebb5
  question: Почему LocalDateTime нельзя без дополнительного контекста считать однозначным
    моментом времени?
  answer: LocalDateTime содержит дату и время без часового пояса или смещения UTC.
    Одинаковые локальные значения могут соответствовать разным моментам в разных зонах,
    а при переходе на летнее время некоторые локальные значения бывают неоднозначны
    или не существуют. Для конкретного момента времени используют Instant либо задают
    правила интерпретации через зону или смещение.
  category: Date/Time API
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 39ae3899-83b4-4732-abd5-31684b8e4627
  question: Почему BigDecimal("2.0").equals(BigDecimal("2.00")) возвращает false,
    а compareTo() — ноль?
  answer: 'equals сравнивает и числовое значение, и scale; у 2.0 и 2.00 scale различается.
    compareTo сравнивает числовой порядок и считает эти значения равными. Это важно
    при выборе ключа для HashMap или TreeMap: две структуры могут по-разному трактовать
    такие значения.'
  category: Типы и ссылки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |-
    BigDecimal a = new BigDecimal("2.0");
    BigDecimal b = new BigDecimal("2.00");
    System.out.println(a.equals(b));   // false
    System.out.println(a.compareTo(b)); // 0
- id: abbd9b68-f331-4dda-8348-26a280b13a5d
  question: Почему присваивание long результата выражения int * int не предотвращает
    переполнение?
  answer: Оба операнда int, поэтому умножение выполняется как int и может переполниться
    до присваивания long. Нужно преобразовать хотя бы один операнд к long до операции,
    например 1L * a * b. Тип переменной результата не меняет тип уже вычисленного
    выражения.
  category: Типы и ссылки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |-
    int a = 1_500_000_000;
    int b = 2;
    long wrong = a * b;
    long correct = 1L * a * b;
- id: 3dc84130-421c-4ae7-bf60-1d038b00d89f
  question: Чем && отличается от & для boolean-выражений?
  answer: "&& вычисляет правый операнд только если левый равен true. & для boolean
    вычисляет оба операнда всегда. Короткое замыкание важно, например, в проверке
    value != null && value.isValid(); замена на & вызвала бы обращение к null."
  category: Типы и ссылки
