- id: 154df30e-0e84-421f-bd83-8a8699f12ce8
  question: Почему десериализацию недоверенных данных через ObjectInputStream считают
    рискованной?
  answer: Обработка потока может создавать произвольные классы из доступного classpath
    и запускать их логику восстановления объекта, что создаёт поверхность для атак.
    Для недоверенного ввода лучше использовать ограниченный формат и строгую валидацию;
    при необходимости Java-сериализации применяют фильтрацию типов.
