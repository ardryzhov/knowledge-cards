- id: a21911e3-7526-4d8a-9a90-7d7cd2e31796
  question: Почему метод может изменить состояние переданного ему объекта, но не может
    заменить объект в переменной вызывающего кода?
  answer: 'Java передаёт аргументы по значению. Для объекта значением служит ссылка:
    метод получает её копию и может через неё изменить доступный объект. Присваивание
    этой копии другой ссылки не меняет переменную вызывающего кода.'
  category: Типы и ссылки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7a237206-f045-4ac2-80de-b42d2afa1924
  question: Чем сравнение ссылок через == отличается от вызова equals()?
  answer: Для ссылок == проверяет, указывают ли они на один объект. equals() проверяет
    равенство по правилам, заданным классом; реализация Object по умолчанию также
    сравнивает идентичность. Поэтому для сравнения значений нужно понимать реализацию
    equals() у конкретного типа.
  category: Типы и ссылки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 18c71a00-5eeb-4933-a175-8efbec615fb9
  question: Какое обязательное правило связывает equals() и hashCode() при переопределении
    этих методов?
  answer: 'Если два объекта равны согласно equals(), их hashCode() должны совпадать.
    Обратное неверно: одинаковый хеш не означает равенства. Нарушение правила приводит,
    в частности, к некорректному поведению хеш-коллекций.'
  category: Объектная модель
  context: 
  hint_1: Представь, как HashSet сначала ищет место для объекта.
  hint_2: Равные объекты должны попадать в одну область поиска.
  difficulty: medium
  code: 
- id: 4466c34a-5a09-484c-80b4-2bbca3e576b8
  question: Почему изменяемое поле, участвующее в equals() и hashCode(), опасно менять
    после добавления объекта в HashSet?
  answer: После изменения поля может измениться хеш объекта. Коллекция оставит объект
    там, куда поместила его при добавлении, а поиск будет использовать уже новый хеш.
    В результате contains() или remove() могут не найти объект. Это практическое следствие
    выбора изменяемых данных для идентичности объекта.
  category: Объектная модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bc4012b4-65e6-47d8-802e-9d327ccc97e1
  question: Как Java выбирает метод при перегрузке и при переопределении?
  answer: Подходящая перегрузка выбирается при компиляции с учётом объявленных типов
    аргументов. Для переопределённого экземплярного метода конкретная реализация выбирается
    во время выполнения по фактическому классу объекта. Поэтому объявленный тип переменной
    и фактический тип объекта могут влиять на разные этапы выбора.
  category: Полиморфизм
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ca424ad6-6782-422f-bd36-886d0a0451cf
  question: Переопределяются ли в Java static-методы и поля так же, как экземплярные
    методы?
  answer: Нет. Метод экземпляра может быть переопределён и выбран по фактическому
    типу объекта. Одноимённый static-метод в подклассе скрывает метод родителя, а
    обращение к полю определяется типом ссылки или явно указанным классом. Поэтому
    для них не работает тот же динамический полиморфизм.
  category: Полиморфизм
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3925522e-b319-4203-b6a2-00d017ea7bd0
  question: Что должен сделать класс, если два реализуемых интерфейса объявляют несовместимые
    default-реализации метода с одной сигнатурой?
  answer: Класс должен явно переопределить метод и разрешить конфликт. В реализации
    он может написать собственное поведение или вызвать нужную реализацию через ИмяИнтерфейса.super.метод().
    Компилятор не выбирает один из конфликтующих методов произвольно.
  category: Полиморфизм
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
