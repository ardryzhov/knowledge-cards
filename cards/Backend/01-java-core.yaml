- id: 5a3f0e34-5bc8-44f4-a471-fc05fb334880
  question: Зачем сохранять исходную причину при оборачивании исключения?
  answer: Причина сохраняет цепочку ошибок и позволяет увидеть, где сбой возник на
    самом деле. Создавая исключение более высокого уровня, передают исходное как cause,
    например new ServiceException(message, cause), вместо потери stack trace.
