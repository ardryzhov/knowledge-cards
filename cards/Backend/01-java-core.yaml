- id: b7a21eb5-dba1-46c6-bd87-d013817b6fa0
  question: Что определяет RetentionPolicy у аннотации?
  answer: 'Она задаёт, до какого этапа сохраняется аннотация: только исходный код,
    файл класса или доступность во время выполнения через рефлексию. Если аннотацию
    читает runtime-фреймворк, ей нужна RetentionPolicy.RUNTIME.'
