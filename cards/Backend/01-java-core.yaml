- id: 30a2df12-3fc6-402a-af19-f983b60f6e8a
  question: Какие группы методов объявлены в Object и какие из них чаще всего обсуждают
    при проектировании класса?
  answer: В Object есть методы идентичности и представления (equals, hashCode, toString,
    getClass), копирования (clone), ожидания на мониторе (wait, notify, notifyAll)
    и устаревший finalize. Для прикладного класса чаще всего важны согласованные equals/hashCode
    и безопасный toString; wait/notify относятся к синхронизации.
  category: Объектная модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5d4f2117-9fec-4321-9516-b3bfa785052a
  question: Какие свойства обязан соблюдать корректный equals?
  answer: Равенство должно быть рефлексивным, симметричным, транзитивным и согласованным
    при неизменном значимом состоянии объекта; сравнение с null должно возвращать
    false. Нарушение этих свойств делает поведение коллекций и клиентского кода непредсказуемым.
  category: Объектная модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3a7ee0cf-ed52-4eb2-9ba7-a366ea80742f
  question: Почему два массива с одинаковыми элементами обычно не равны через обычный
    equals()?
  answer: Массивы не переопределяют Object.equals для сравнения элементов, поэтому
    вызов equals проверяет идентичность массивов. Для одномерных массивов используют
    Arrays.equals, а для вложенных массивов при нужной семантике — Arrays.deepEquals.
  category: Объектная модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |-
    int[] a = {1, 2};
    int[] b = {1, 2};
    System.out.println(a.equals(b));        // false
    System.out.println(Arrays.equals(a, b)); // true
- id: c9ff3c18-2cd9-482c-8a9f-f7dcd73e2add
  question: В каком порядке выполняются инициализация полей и конструкторы при создании
    объекта подкласса?
  answer: Сначала инициализируются нужные классы, затем память объекта получает значения
    полей по умолчанию. В цепочке конструкторов сначала выполняются инициализаторы
    полей и блоки экземпляра родителя, затем тело его конструктора; после возврата
    из него выполняются инициализаторы и тело конструктора подкласса.
  category: Объектная модель
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 6497709e-cae8-400f-99dd-6fbd9926645e
  question: Чем интерфейс отличается от абстрактного класса при проектировании API?
  answer: Интерфейс задаёт контракт, который класс может реализовать наряду с другими
    интерфейсами. Абстрактный класс может хранить состояние и общую реализацию в единственной
    ветке наследования классов. Выбор зависит от необходимости общего состояния, эволюции
    API и формы связи между типами.
  category: Полиморфизм
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ff53c80f-8e7c-48b4-8c08-abbfdf2047b9
  question: Зачем ставить @Override на метод, который должен переопределять метод
    родителя?
  answer: Аннотация просит компилятор проверить, что метод действительно переопределяет
    или реализует метод супертипа. Ошибка в имени или параметрах тогда обнаружится
    при сборке, а не превратится в случайную перегрузку с другим поведением.
  category: Полиморфизм
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 82a71d39-8584-41bd-a491-ebf575a6f5f6
  question: Чем StringBuilder отличается от StringBuffer?
  answer: Оба предоставляют изменяемую последовательность символов. Методы StringBuffer
    синхронизированы, а StringBuilder не обеспечивает такую встроенную синхронизацию
    и обычно предпочтителен при использовании в одном потоке. Выбор зависит от реальной
    модели совместного доступа.
  category: Строки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c6762520-cafc-44aa-a6cb-16879629839c
  question: Почему String.split(".") не делит строку по буквальной точке?
  answer: Аргумент split — регулярное выражение, где точка означает любой символ.
    Для буквальной точки нужен экранированный шаблон или Pattern.quote. При разборе
    фиксированного разделителя следует учитывать regex-семантику метода.
  category: Строки
  context: 
  hint_1: 
  hint_2: 
