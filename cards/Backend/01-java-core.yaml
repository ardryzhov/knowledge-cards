  code: String[] parts = "a.b".split(".");
- id: c08868a2-7e34-494c-9828-eee5b78a9bf3
  question: Почему length() строки не всегда равно количеству видимых пользователю
    символов?
  answer: String.length считает 16-битные кодовые единицы UTF-16. Символ за пределами
    базовой многоязычной плоскости занимает суррогатную пару, а один видимый графемный
    кластер может состоять из нескольких кодовых точек. Для соответствующей задачи
    нужны codePoints или правила сегментации текста.
