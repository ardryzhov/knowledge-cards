- id: 50369e44-2669-4187-b6e7-5e451b249d86
  question: Почему сравнение двух строк через == иногда возвращает true, хотя строки
    были созданы в разных местах кода?
  answer: Две ссылки могут указывать на один объект строки, например при использовании
    строковых литералов из пула строк. Но это свойство размещения объектов, а не проверка
    равенства текста. Для сравнения содержимого используют equals().
  category: Строки
  context: 
