  - question: Чем интерфейс отличается от абстрактного класса при проектировании API?
    answer: Интерфейс задаёт контракт, который класс может реализовать наряду с другими интерфейсами. Абстрактный класс может хранить состояние и общую реализацию в единственной ветке наследования классов. Выбор зависит от необходимости общего состояния, эволюции API и формы связи между типами.
