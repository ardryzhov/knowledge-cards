  - question: Почему одного вызова InputStream.read(buffer) может быть недостаточно для заполнения buffer?
    answer: read возвращает фактическое число считанных байтов, которое может быть меньше длины буфера даже до конца потока. Код должен обрабатывать частичное чтение и значение -1 при конце потока; для фиксированного объёма можно использовать readNBytes или цикл.
    category: I/O и сериализация
