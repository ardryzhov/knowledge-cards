    code: null
  - question: Почему два массива с одинаковыми элементами обычно не равны через обычный equals()?
    answer: Массивы не переопределяют Object.equals для сравнения элементов, поэтому вызов equals проверяет идентичность массивов. Для одномерных массивов используют Arrays.equals, а для вложенных массивов при нужной семантике — Arrays.deepEquals.
    category: Объектная модель
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |-
      int[] a = {1, 2};
      int[] b = {1, 2};
      System.out.println(a.equals(b));        // false
      System.out.println(Arrays.equals(a, b)); // true
  - question: В каком порядке выполняются инициализация полей и конструкторы при создании объекта подкласса?
    answer: Сначала инициализируются нужные классы, затем память объекта получает значения полей по умолчанию. В цепочке конструкторов сначала выполняются инициализаторы полей и блоки экземпляра родителя, затем тело его конструктора; после возврата из него выполняются инициализаторы и тело конструктора подкласса.
    category: Объектная модель
