  - question: В каком порядке try-with-resources закрывает несколько ресурсов?
    answer: "Ресурсы закрываются в порядке, обратном их объявлению. Это соответствует принципу стека: последний открытый ресурс закрывается первым. Такой порядок полезен, когда один ресурс зависит от другого."
