  - question: Чем Optional.of(value) отличается от Optional.ofNullable(value)?
    answer: Optional.of требует ненулевое значение и выбрасывает NullPointerException при null. Optional.ofNullable возвращает пустой Optional для null. Выбор показывает, является ли null допустимым входом для конкретного API.
    category: Optional
