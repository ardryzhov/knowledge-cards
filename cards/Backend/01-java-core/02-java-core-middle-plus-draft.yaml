  - question: Какие группы методов объявлены в Object и какие из них чаще всего обсуждают при проектировании класса?
    answer: В Object есть методы идентичности и представления (equals, hashCode, toString, getClass), копирования (clone), ожидания на мониторе (wait, notify, notifyAll) и устаревший finalize. Для прикладного класса чаще всего важны согласованные equals/hashCode и безопасный toString; wait/notify относятся к синхронизации.
    category: Объектная модель
    context: null
