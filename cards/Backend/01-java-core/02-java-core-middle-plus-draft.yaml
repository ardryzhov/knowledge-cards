  - question: Чем StringBuilder отличается от StringBuffer?
    answer: Оба предоставляют изменяемую последовательность символов. Методы StringBuffer синхронизированы, а StringBuilder не обеспечивает такую встроенную синхронизацию и обычно предпочтителен при использовании в одном потоке. Выбор зависит от реальной модели совместного доступа.
