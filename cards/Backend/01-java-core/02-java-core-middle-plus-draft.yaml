topic: Java Core
cards:
  - question: Почему BigDecimal("2.0").equals(BigDecimal("2.00")) возвращает false, а compareTo() — ноль?
    answer: "equals сравнивает и числовое значение, и scale; у 2.0 и 2.00 scale различается. compareTo сравнивает числовой порядок и считает эти значения равными. Это важно при выборе ключа для HashMap или TreeMap: две структуры могут по-разному трактовать такие значения."
    category: Типы и ссылки
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |-
      BigDecimal a = new BigDecimal("2.0");
      BigDecimal b = new BigDecimal("2.00");
      System.out.println(a.equals(b));   // false
      System.out.println(a.compareTo(b)); // 0
  - question: Почему присваивание long результата выражения int * int не предотвращает переполнение?
    answer: Оба операнда int, поэтому умножение выполняется как int и может переполниться до присваивания long. Нужно преобразовать хотя бы один операнд к long до операции, например 1L * a * b. Тип переменной результата не меняет тип уже вычисленного выражения.
    category: Типы и ссылки
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |-
      int a = 1_500_000_000;
      int b = 2;
      long wrong = a * b;
      long correct = 1L * a * b;
  - question: Чем && отличается от & для boolean-выражений?
    answer: "&& вычисляет правый операнд только если левый равен true. & для boolean вычисляет оба операнда всегда. Короткое замыкание важно, например, в проверке value != null && value.isValid(); замена на & вызвала бы обращение к null."
    category: Типы и ссылки
