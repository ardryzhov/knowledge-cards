  - question: Что определяет RetentionPolicy у аннотации?
    answer: "Она задаёт, до какого этапа сохраняется аннотация: только исходный код, файл класса или доступность во время выполнения через рефлексию. Если аннотацию читает runtime-фреймворк, ей нужна RetentionPolicy.RUNTIME."
    category: Enum, аннотации и рефлексия
