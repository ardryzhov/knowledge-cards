  - question: Зачем сохранять исходную причину при оборачивании исключения?
    answer: Причина сохраняет цепочку ошибок и позволяет увидеть, где сбой возник на самом деле. Создавая исключение более высокого уровня, передают исходное как cause, например new ServiceException(message, cause), вместо потери stack trace.
