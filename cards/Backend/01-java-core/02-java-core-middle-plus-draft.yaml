  - question: Почему String.split(".") не делит строку по буквальной точке?
    answer: Аргумент split — регулярное выражение, где точка означает любой символ. Для буквальной точки нужен экранированный шаблон или Pattern.quote. При разборе фиксированного разделителя следует учитывать regex-семантику метода.
    category: Строки
