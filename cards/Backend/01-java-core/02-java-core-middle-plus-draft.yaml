  - question: Какие свойства обязан соблюдать корректный equals?
    answer: Равенство должно быть рефлексивным, симметричным, транзитивным и согласованным при неизменном значимом состоянии объекта; сравнение с null должно возвращать false. Нарушение этих свойств делает поведение коллекций и клиентского кода непредсказуемым.
    category: Объектная модель
    context: null
