  - question: Какие методы и члены компилятор автоматически создаёт для record?
    answer: Для компонентов record создаются private final поля и публичные accessor-методы с именами компонентов. Также генерируются канонический конструктор, equals, hashCode и toString на основе компонентов, если они не объявлены явно.
