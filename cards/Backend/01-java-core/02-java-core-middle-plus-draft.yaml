  - question: Зачем ставить @Override на метод, который должен переопределять метод родителя?
    answer: Аннотация просит компилятор проверить, что метод действительно переопределяет или реализует метод супертипа. Ошибка в имени или параметрах тогда обнаружится при сборке, а не превратится в случайную перегрузку с другим поведением.
