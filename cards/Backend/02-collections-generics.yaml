- id: bb053e0c-e67e-4052-9c19-fc43426bf8e5
  question: Почему этот код не компилируется, хотя Integer наследует Number?
  answer: 'Параметризованные типы Java инвариантны: List<Integer> не является подтипом
    List<Number>. Иначе через ссылку List<Number> можно было бы добавить, например,
    Double в список, который должен содержать Integer. Для гибкого чтения или записи
    применяют wildcard с подходящей границей.'
  category: 'Generics: типы и границы'
  context: 
  hint_1: Представь, что стало бы возможно добавить через более общий тип ссылки.
