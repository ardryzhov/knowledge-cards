- id: 6af03a91-b1f4-4bdf-81ef-83aca02e3382
  question: Почему вставка в середину ArrayList имеет сложность O(n), а добавление
    в конец обычно считают амортизированным O(1)?
  answer: При вставке в середину нужно сдвинуть часть элементов массива, поэтому затраты
    растут с их числом. При добавлении в конец обычно записывается один элемент; иногда
    массив приходится расширять и копировать. Стоимость редких расширений распределяется
    по многим добавлениям, что даёт амортизированное O(1).
  category: Списки
  context: 
  hint_1: Раздели обычное добавление и момент, когда места в массиве не осталось.
  hint_2: 
