- id: 6e6bc229-2661-41fa-ae42-18020df17026
  question: Почему обход PriorityQueue не обязан возвращать элементы в том же порядке,
    что последовательные вызовы poll()?
  answer: 'PriorityQueue поддерживает свойство кучи: на голове находится наименьший
    элемент по заданному порядку. Остальные элементы внутри не хранятся как полностью
    отсортированная последовательность. Поэтому poll() последовательно извлекает элементы
    по приоритету, а итератор не гарантирует отсортированный обход.'
  category: Очереди
  context: 
  hint_1: Вспомни разницу между кучей и отсортированным массивом.
