- id: 0e3ab2af-50a5-4554-ae47-00d392112916
  question: Что означает fail-fast поведение итератора и почему на него нельзя полагаться
    как на механизм синхронизации?
  answer: Итератор некоторых коллекций может выбросить ConcurrentModificationException,
    если заметит структурное изменение коллекции вне допустимых операций самого итератора.
    Обнаружение такого изменения не гарантируется во всех гонках и зависит от реализации.
    Это сигнал об ошибочном использовании, а не способ обеспечить потокобезопасность.
  category: Итерация и изменяемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 226e15f6-db02-4263-81dc-1d9c4467e54a
  question: Чем отличается неизменяемая копия List.copyOf(source) от представления
    Collections.unmodifiableList(source)?
  answer: List.copyOf создаёт неизменяемый по структуре результат, который не отражает
    последующие изменения исходного списка; это поверхностная копия, поэтому изменяемые
    элементы внутри могут меняться. Collections.unmodifiableList возвращает представление
    без операций изменения через него, но изменения исходного списка будут видны в
    представлении. Оба подхода не делают изменяемые элементы глубоко неизменяемыми.
  category: Итерация и изменяемость
  context: 
  hint_1: Представление и копия по-разному реагируют на изменение исходного списка.
  hint_2: 
  difficulty: medium
  code: 
- id: 9ccee6e6-af19-4507-bbeb-be5c7242344e
  question: Почему операция get(), а затем put() в ConcurrentHashMap не становится
    атомарной только из-за потокобезопасности самой Map?
  answer: Каждый вызов по отдельности безопасен для конкурентного использования, но
    между get() и put() другой поток может изменить значение. Для условного добавления
    или обновления используют атомарные операции карты, например putIfAbsent(), compute()
    или merge(), выбирая их по нужной семантике.
  category: Конкурентные коллекции
  context: 
  hint_1: Посмотри на промежуток между двумя отдельными вызовами.
  hint_2: 
  difficulty: medium
  code: 
- id: 71975e2d-d4b0-4fd3-b36c-880beacca9da
  question: При каком соотношении чтений и изменений CopyOnWriteArrayList может быть
    полезен и почему?
  answer: 'Он подходит, когда чтений и обходов много, а изменений мало: итераторы
    работают со снимком массива и не требуют блокировки на время обхода. Каждое изменение
    создаёт новую копию внутреннего массива, поэтому частые записи дороги по времени
    и памяти. Итератор также не увидит изменения, сделанные после его создания.'
  category: Конкурентные коллекции
  context: 
  hint_1: Название указывает, что происходит при каждой записи.
  hint_2: 
  difficulty: medium
