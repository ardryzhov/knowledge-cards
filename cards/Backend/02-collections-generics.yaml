- id: be4a086e-4cb5-44f4-8635-61327683e388
  question: Зачем компилятор может создавать bridge method при переопределении generic-метода?
  answer: После стирания типов сигнатуры методов могли бы перестать совпадать для
    полиморфизма. Синтетический bridge method перенаправляет вызов на специализированную
    реализацию и сохраняет переопределение на уровне байткода.
  category: 'Generics: стирание типов'
