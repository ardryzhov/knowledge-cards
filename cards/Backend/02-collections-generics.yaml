- id: 58a84323-882c-4d31-a2e9-78e906ebe175
  question: Почему generic varargs может приводить к heap pollution?
  answer: Varargs реализован массивом, а массив параметризованного типа нельзя полноценно
    проверить во время выполнения из-за стирания. Если метод записывает в такой массив
    значение другого типа, ошибка может проявиться позже при чтении. @SafeVarargs
    допустим только когда реализация действительно безопасна.
  category: 'Generics: стирание типов'
