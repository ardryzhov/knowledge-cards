- id: 19d6f8bc-202c-4538-b7d1-34f71936005a
  question: Как HashMap находит значение по ключу и что происходит при коллизии хешей?
  answer: 'HashMap использует hashCode() ключа, чтобы выбрать область хранения, затем
    сравнивает кандидатов по равенству ключей. Одинаковые хеши не означают одинаковые
    ключи: несколько записей могут находиться в одной области. В современных реализациях
    при определённых условиях длинная цепочка записей может быть преобразована в дерево.
    Средняя сложность поиска при хорошем распределении хешей — O(1); худший случай
    не следует считать постоянным.'
  category: Хеш-коллекции
  context: 
  hint_1: Хеш сужает поиск, но сам по себе не доказывает равенство.
  hint_2: 
  difficulty: medium
  code: 
- id: d1ed9a8b-0c09-41b5-bba1-f311da6307d3
  question: Почему на порядок обхода HashMap нельзя опираться, даже если в тестах
    он кажется стабильным?
  answer: Контракт HashMap не гарантирует порядок итерации. Он может измениться при
    добавлении или удалении записей, изменении ёмкости, реализации JDK или распределения
    хешей. Если порядок важен, нужно явно выбрать структуру с подходящей гарантией,
    например LinkedHashMap или TreeMap.
  category: Хеш-коллекции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2b40b32e-a5e5-4cda-a248-19dd5b87cc18
  question: Чем определяются уникальность и порядок ключей в TreeMap?
  answer: TreeMap упорядочивает ключи по Comparator или их естественному порядку через
    Comparable. Для TreeMap два ключа считаются одинаковыми, если сравнение возвращает
    0, даже когда equals() возвращает false. Поэтому порядок должен быть согласован
    с equals(), если от Map ожидается обычная семантика равенства ключей. Основные
    операции поиска, вставки и удаления имеют сложность O(log n).
  category: Упорядоченные коллекции
  context: 
  hint_1: Подумай, какой результат сравнения означает одну позицию в дереве.
  hint_2: 
  difficulty: hard
  code: 
- id: 847a3b16-9228-4ee5-9be2-9a4cbe65f095
  question: Чем порядок обхода LinkedHashMap отличается от порядка обхода TreeMap?
  answer: LinkedHashMap обычно сохраняет порядок вставки; его также можно настроить
    на порядок доступа. TreeMap сортирует ключи по Comparator или естественному порядку.
    Поэтому LinkedHashMap подходит для предсказуемого порядка добавления, а TreeMap
    — когда нужен отсортированный порядок и навигация по диапазонам ключей.
  category: Упорядоченные коллекции
  context: 
