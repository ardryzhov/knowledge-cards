- id: f01c6c9e-0f3d-4e4e-b2b7-dde197efca23
  question: Почему в List<? extends Number> нельзя безопасно добавить Integer, но
    можно прочитать элемент как Number?
  answer: 'Точный тип элементов неизвестен: это может быть List<Integer>, List<Double>
    или список другого подтипа Number. Добавление Integer нарушило бы тип списка в
    некоторых вариантах. Каждый полученный элемент при этом гарантированно является
    Number. Добавить можно только null.'
  category: 'Generics: типы и границы'
  context: 
  hint_1: Неизвестный подтип Number может отличаться от Integer.
