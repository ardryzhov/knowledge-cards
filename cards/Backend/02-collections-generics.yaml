- id: 9786996e-790f-4e3b-b03c-8147fdbf12db
  question: Чем параметр метода <T> отличается от wildcard <?> в его аргументе?
  answer: T связывает типы нескольких мест сигнатуры, например входа и результата.
    Wildcard обозначает неизвестный тип, когда такую связь выражать не нужно. Лишний
    параметр T усложняет API, а wildcard не позволяет сохранить точный тип результата.
  category: 'Generics: типы и границы'
