- id: 30237a6f-0671-475e-b2a8-2d96c620be71
  question: Когда Collections.binarySearch может вернуть неверный результат?
  answer: Поиск требует, чтобы список был отсортирован тем же порядком, который передан
    для поиска. Если элементы не отсортированы или Comparator отличается, результат
    не определён контрактом. На ArrayList доступ по индексу дешевле, чем на LinkedList.
  category: Контракты коллекций
