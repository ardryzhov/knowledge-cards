- id: 146f9af0-5b8a-4bda-be71-f880a584d8f5
  question: Чем Arrays.asList(array) отличается от List.of(array)?
  answer: 'Arrays.asList возвращает список фиксированного размера, связанный с исходным
    массивом: set меняет массив, а add/remove недоступны. List.of создаёт неизменяемый
    по структуре список и отвергает null; при массиве ссылок его состав не следует
    считать живым представлением исходного массива.'
