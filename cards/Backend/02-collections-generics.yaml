- id: 30a9bddf-d721-4f1c-ad72-5562f9315b50
  question: Как сравнить стоимость поиска, вставки и удаления для ArrayList, LinkedList,
    HashMap и TreeMap?
  answer: У ArrayList поиск по значению и вставка или удаление со сдвигом обычно O(n),
    доступ по индексу O(1). У LinkedList поиск позиции O(n), а изменение через уже
    установленный ListIterator — O(1). У HashMap операции по ключу в среднем O(1),
    у TreeMap — O(log n); худшие случаи оценивают отдельно.
  category: Сложность операций
