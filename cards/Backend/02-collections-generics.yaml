- id: 88ad9720-6462-463e-b576-4cb7d33ef50e
  question: Как удалить элементы из ArrayList во время обхода без ConcurrentModificationException?
  answer: Использовать Iterator.remove после next, removeIf или отдельную фильтрацию.
    Изменение списка через его методы во время работы обычного итератора может нарушить
    его состояние и вызвать fail-fast исключение.
