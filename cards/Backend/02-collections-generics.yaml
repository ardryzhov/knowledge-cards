- id: 4dedc57e-38fe-440f-b028-9e106a436e8e
  question: Какие свойства List, Set и Map определяют выбор между ними для хранения
    данных?
  answer: List хранит последовательность элементов и допускает повторения. Set хранит
    уникальные элементы по правилам конкретной реализации. Map связывает уникальные
    ключи со значениями и допускает повторение значений. Выбор начинается с требований
    к повторениям, доступу по позиции или ключу и порядку обхода.
  category: Контракты коллекций
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: fbc5fc44-01b8-4aa5-b823-59adee2723a4
  question: Почему ArrayList обычно предпочтительнее LinkedList, если часто нужен
    доступ к элементу по индексу?
  answer: ArrayList хранит элементы в массиве и получает элемент по индексу за O(1).
    LinkedList должен пройти по узлам от ближайшего конца, поэтому доступ по индексу
    занимает O(n). Кроме того, связный список создаёт отдельные узлы и обычно хуже
    использует локальность памяти.
  category: Списки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
