- id: ce120954-b08d-4a4d-96cf-862931e06a85
  question: Когда LinkedList действительно может дать преимущество при вставке по
    сравнению с ArrayList?
  answer: Если позиция уже известна через ListIterator, LinkedList вставляет узел
    без сдвига остальных элементов; сама вставка занимает O(1). Если сначала искать
    позицию по индексу, поиск занимает O(n), и преимущество часто исчезает. Решение
    также зависит от расхода памяти и характера обхода.
  category: Списки
  context: 
  hint_1: Учитывай стоимость поиска места вставки отдельно от самой вставки.
