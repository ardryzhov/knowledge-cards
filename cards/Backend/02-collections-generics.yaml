  difficulty: medium
  code: 
- id: 771b3ced-0615-4308-9c41-0f632d140e4b
  question: Почему в List<? super Integer> можно добавить Integer, но результат get()
    имеет тип Object?
  answer: 'Список может иметь тип List<Integer>, List<Number> или List<Object>, поэтому
    Integer допустим для добавления во всех случаях. Но неизвестно, какой именно из
    этих типов у списка, и безопасная верхняя граница прочитанного значения — Object.
    Это пример правила PECS: producer extends, consumer super.'
  category: 'Generics: типы и границы'
  context: 
  hint_1: Рассмотри отдельно безопасность записи и тип прочитанного значения.
