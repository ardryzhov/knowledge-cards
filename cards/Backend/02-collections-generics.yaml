- id: 78c15c3b-603c-412e-86df-4b6cb980ff12
  question: Как load factor влияет на момент расширения HashMap и стоимость операций?
  answer: Когда число записей превышает порог, связанный с ёмкостью и load factor,
    HashMap расширяет таблицу и перераспределяет записи. Слишком высокий коэффициент
    увеличивает коллизии, слишком низкий расходует память; настройки меняют только
    после измерения.
  category: Хеш-коллекции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 796fcf91-cc0e-4562-a526-07fed02ee92c
  question: Почему HashMap с постоянным hashCode остаётся корректным, но может работать
    медленно?
  answer: Равенство ключей всё ещё проверяется через equals, поэтому коллизии не делают
    карту логически неверной. Однако записи концентрируются в малом числе бакетов,
    и поиск теряет ожидаемую среднюю стоимость O(1).
  category: Хеш-коллекции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e0a60d80-f127-4d62-99a6-2b9752043257
  question: Сколько записей останется в HashMap после двух put с разными User, равными
    по полям, если переопределён только equals?
  answer: Однозначного числа без дополнительных условий нет. Object.hashCode у двух
    объектов обычно различается, и тогда останутся две записи; при совпадении хешей
    карта сравнит ключи через equals и второе значение заменит первое. Именно поэтому
    равные по equals объекты обязаны иметь одинаковый hashCode.
  category: Хеш-коллекции
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ca97357a-e53f-4057-8018-78f7a7414eb7
  question: Как HashSet определяет уникальность и при чём здесь HashMap?
  answer: Типичная реализация HashSet хранит элементы как ключи внутренней HashMap.
    Для поиска дубликата используются hashCode и equals, поэтому нарушение их контракта
    ломает ожидаемую уникальность.
