  question: Почему TreeSet может оставить только один из двух объектов, у которых
    equals возвращает false?
  answer: TreeSet использует Comparator или Comparable для определения порядка и эквивалентности.
    Если сравнение возвращает 0, элементы считаются одинаковыми для дерева, даже если
    equals считает их разными. Правило сравнения желательно согласовывать с equals.
