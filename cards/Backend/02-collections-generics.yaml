- id: 2e078746-b138-43ef-9944-065be9238d2b
  question: Что означает стирание типов в Java generics и почему нельзя проверить
    instanceof List<String>?
  answer: Параметры типов в основном используются компилятором для проверки типов,
    а при выполнении стираются до границ или Object; при необходимости компилятор
    добавляет приведения. Во время выполнения объект списка не хранит различие между
    List<String> и List<Integer>, поэтому проверка instanceof List<String> недопустима.
    Проверить можно сырой вид List<?>.
  category: 'Generics: стирание типов'
  context: 
  hint_1: Подумай, какая информация о параметре типа остаётся у самого объекта списка.
  hint_2: 
  difficulty: medium
  code: 
- id: 846499b4-0771-4346-a6c6-46392ee600c2
  question: Чем опасно использование raw type List вместо List<String>?
  answer: Raw type отключает часть проверок параметризованного типа и допускает операции,
    которые приводят к heap pollution. Ошибка может проявиться позже как ClassCastException
    при чтении значения из списка. Raw types нужны главным образом для совместимости
    со старым кодом; в новом коде следует использовать параметризованный тип или wildcard.
  category: 'Generics: стирание типов'
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1c96543c-5eda-46f1-b471-49fac7a08153
  question: Почему в Java нельзя создать массив через new List<String>[10]?
  answer: Массивы знают тип своих элементов во время выполнения и проверяют запись
    в массив. Параметр String у List<String> стирается, поэтому среда выполнения не
    смогла бы проверить этот компонент типа. Такое сочетание могло бы привести к heap
    pollution; создание массива параметризованного типа запрещено. Обычно вместо него
    используют List<List<String>>.
  category: 'Generics: стирание типов'
  context: 
  hint_1: Сравни проверки типов у массивов и у generic-коллекций во время выполнения.
  hint_2: 
  difficulty: hard
  code: 
- id: 80c90f72-096f-491f-a0ae-df70a082548e
  question: Зачем объявлять собственный параметр типа у метода, например <T> T first(List<T>
    values), вместо возврата Object?
  answer: 'Параметр T связывает тип элементов аргумента с типом результата: из List<String>
    метод возвращает String без ручного приведения. Возврат Object теряет эту связь
    и переносит проверку типов на вызывающий код. Ограничение вроде <T extends Number>
    дополнительно задаёт операции, доступные внутри метода.'
  category: 'Generics: типы и границы'
  context: 
  hint_1: Сравни тип результата при вызове с List<String>.
  hint_2: 
  difficulty: medium
