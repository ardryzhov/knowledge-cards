- id: ee9c1a25-a095-40f8-b8fe-b39c1f2256e6
  question: Почему для стека и очереди новых Java-приложений часто выбирают Deque
    вместо Stack?
  answer: Deque предоставляет операции с обоих концов и поддерживает LIFO и FIFO без
    наследия старого класса Stack. ArrayDeque обычно удобен для локального стека или
    очереди без требований конкурентности; он не принимает null.
  category: Очереди
