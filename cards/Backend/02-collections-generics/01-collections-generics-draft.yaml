topic: Collections and Generics
cards:
  - question: "Какие свойства List, Set и Map определяют выбор между ними для хранения данных?"
    answer: "List хранит последовательность элементов и допускает повторения. Set хранит уникальные элементы по правилам конкретной реализации. Map связывает уникальные ключи со значениями и допускает повторение значений. Выбор начинается с требований к повторениям, доступу по позиции или ключу и порядку обхода."
    category: "Контракты коллекций"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Почему ArrayList обычно предпочтительнее LinkedList, если часто нужен доступ к элементу по индексу?"
    answer: "ArrayList хранит элементы в массиве и получает элемент по индексу за O(1). LinkedList должен пройти по узлам от ближайшего конца, поэтому доступ по индексу занимает O(n). Кроме того, связный список создаёт отдельные узлы и обычно хуже использует локальность памяти."
    category: "Списки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему вставка в середину ArrayList имеет сложность O(n), а добавление в конец обычно считают амортизированным O(1)?"
    answer: "При вставке в середину нужно сдвинуть часть элементов массива, поэтому затраты растут с их числом. При добавлении в конец обычно записывается один элемент; иногда массив приходится расширять и копировать. Стоимость редких расширений распределяется по многим добавлениям, что даёт амортизированное O(1)."
    category: "Списки"
    context: null
    hint_1: "Раздели обычное добавление и момент, когда места в массиве не осталось."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда LinkedList действительно может дать преимущество при вставке по сравнению с ArrayList?"
    answer: "Если позиция уже известна через ListIterator, LinkedList вставляет узел без сдвига остальных элементов; сама вставка занимает O(1). Если сначала искать позицию по индексу, поиск занимает O(n), и преимущество часто исчезает. Решение также зависит от расхода памяти и характера обхода."
    category: "Списки"
    context: null
    hint_1: "Учитывай стоимость поиска места вставки отдельно от самой вставки."
    hint_2: null
    difficulty: hard
    code: null

  - question: "Как HashMap находит значение по ключу и что происходит при коллизии хешей?"
    answer: "HashMap использует hashCode() ключа, чтобы выбрать область хранения, затем сравнивает кандидатов по равенству ключей. Одинаковые хеши не означают одинаковые ключи: несколько записей могут находиться в одной области. В современных реализациях при определённых условиях длинная цепочка записей может быть преобразована в дерево. Средняя сложность поиска при хорошем распределении хешей — O(1); худший случай не следует считать постоянным."
    category: "Хеш-коллекции"
    context: null
    hint_1: "Хеш сужает поиск, но сам по себе не доказывает равенство."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему на порядок обхода HashMap нельзя опираться, даже если в тестах он кажется стабильным?"
    answer: "Контракт HashMap не гарантирует порядок итерации. Он может измениться при добавлении или удалении записей, изменении ёмкости, реализации JDK или распределения хешей. Если порядок важен, нужно явно выбрать структуру с подходящей гарантией, например LinkedHashMap или TreeMap."
    category: "Хеш-коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем определяются уникальность и порядок ключей в TreeMap?"
    answer: "TreeMap упорядочивает ключи по Comparator или их естественному порядку через Comparable. Для TreeMap два ключа считаются одинаковыми, если сравнение возвращает 0, даже когда equals() возвращает false. Поэтому порядок должен быть согласован с equals(), если от Map ожидается обычная семантика равенства ключей. Основные операции поиска, вставки и удаления имеют сложность O(log n)."
    category: "Упорядоченные коллекции"
    context: null
    hint_1: "Подумай, какой результат сравнения означает одну позицию в дереве."
    hint_2: null
    difficulty: hard
    code: null

  - question: "Чем порядок обхода LinkedHashMap отличается от порядка обхода TreeMap?"
    answer: "LinkedHashMap обычно сохраняет порядок вставки; его также можно настроить на порядок доступа. TreeMap сортирует ключи по Comparator или естественному порядку. Поэтому LinkedHashMap подходит для предсказуемого порядка добавления, а TreeMap — когда нужен отсортированный порядок и навигация по диапазонам ключей."
    category: "Упорядоченные коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему обход PriorityQueue не обязан возвращать элементы в том же порядке, что последовательные вызовы poll()?"
    answer: "PriorityQueue поддерживает свойство кучи: на голове находится наименьший элемент по заданному порядку. Остальные элементы внутри не хранятся как полностью отсортированная последовательность. Поэтому poll() последовательно извлекает элементы по приоритету, а итератор не гарантирует отсортированный обход."
    category: "Очереди"
    context: null
    hint_1: "Вспомни разницу между кучей и отсортированным массивом."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает fail-fast поведение итератора и почему на него нельзя полагаться как на механизм синхронизации?"
    answer: "Итератор некоторых коллекций может выбросить ConcurrentModificationException, если заметит структурное изменение коллекции вне допустимых операций самого итератора. Обнаружение такого изменения не гарантируется во всех гонках и зависит от реализации. Это сигнал об ошибочном использовании, а не способ обеспечить потокобезопасность."
    category: "Итерация и изменяемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем отличается неизменяемая копия List.copyOf(source) от представления Collections.unmodifiableList(source)?"
    answer: "List.copyOf создаёт неизменяемый по структуре результат, который не отражает последующие изменения исходного списка; это поверхностная копия, поэтому изменяемые элементы внутри могут меняться. Collections.unmodifiableList возвращает представление без операций изменения через него, но изменения исходного списка будут видны в представлении. Оба подхода не делают изменяемые элементы глубоко неизменяемыми."
    category: "Итерация и изменяемость"
    context: null
    hint_1: "Представление и копия по-разному реагируют на изменение исходного списка."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему операция get(), а затем put() в ConcurrentHashMap не становится атомарной только из-за потокобезопасности самой Map?"
    answer: "Каждый вызов по отдельности безопасен для конкурентного использования, но между get() и put() другой поток может изменить значение. Для условного добавления или обновления используют атомарные операции карты, например putIfAbsent(), compute() или merge(), выбирая их по нужной семантике."
    category: "Конкурентные коллекции"
    context: null
    hint_1: "Посмотри на промежуток между двумя отдельными вызовами."
    hint_2: null
    difficulty: medium
    code: null

  - question: "При каком соотношении чтений и изменений CopyOnWriteArrayList может быть полезен и почему?"
    answer: "Он подходит, когда чтений и обходов много, а изменений мало: итераторы работают со снимком массива и не требуют блокировки на время обхода. Каждое изменение создаёт новую копию внутреннего массива, поэтому частые записи дороги по времени и памяти. Итератор также не увидит изменения, сделанные после его создания."
    category: "Конкурентные коллекции"
    context: null
    hint_1: "Название указывает, что происходит при каждой записи."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему этот код не компилируется, хотя Integer наследует Number?"
    answer: "Параметризованные типы Java инвариантны: List<Integer> не является подтипом List<Number>. Иначе через ссылку List<Number> можно было бы добавить, например, Double в список, который должен содержать Integer. Для гибкого чтения или записи применяют wildcard с подходящей границей."
    category: "Generics: типы и границы"
    context: null
    hint_1: "Представь, что стало бы возможно добавить через более общий тип ссылки."
    hint_2: null
    difficulty: medium
    code: |-
      List<Integer> integers = new ArrayList<>();
      List<Number> numbers = integers;
      numbers.add(3.14);

  - question: "Почему в List<? extends Number> нельзя безопасно добавить Integer, но можно прочитать элемент как Number?"
    answer: "Точный тип элементов неизвестен: это может быть List<Integer>, List<Double> или список другого подтипа Number. Добавление Integer нарушило бы тип списка в некоторых вариантах. Каждый полученный элемент при этом гарантированно является Number. Добавить можно только null."
    category: "Generics: типы и границы"
    context: null
    hint_1: "Неизвестный подтип Number может отличаться от Integer."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему в List<? super Integer> можно добавить Integer, но результат get() имеет тип Object?"
    answer: "Список может иметь тип List<Integer>, List<Number> или List<Object>, поэтому Integer допустим для добавления во всех случаях. Но неизвестно, какой именно из этих типов у списка, и безопасная верхняя граница прочитанного значения — Object. Это пример правила PECS: producer extends, consumer super."
    category: "Generics: типы и границы"
    context: null
    hint_1: "Рассмотри отдельно безопасность записи и тип прочитанного значения."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает стирание типов в Java generics и почему нельзя проверить instanceof List<String>?"
    answer: "Параметры типов в основном используются компилятором для проверки типов, а при выполнении стираются до границ или Object; при необходимости компилятор добавляет приведения. Во время выполнения объект списка не хранит различие между List<String> и List<Integer>, поэтому проверка instanceof List<String> недопустима. Проверить можно сырой вид List<?>."
    category: "Generics: стирание типов"
    context: null
    hint_1: "Подумай, какая информация о параметре типа остаётся у самого объекта списка."
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем опасно использование raw type List вместо List<String>?"
    answer: "Raw type отключает часть проверок параметризованного типа и допускает операции, которые приводят к heap pollution. Ошибка может проявиться позже как ClassCastException при чтении значения из списка. Raw types нужны главным образом для совместимости со старым кодом; в новом коде следует использовать параметризованный тип или wildcard."
    category: "Generics: стирание типов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему в Java нельзя создать массив через new List<String>[10]?"
    answer: "Массивы знают тип своих элементов во время выполнения и проверяют запись в массив. Параметр String у List<String> стирается, поэтому среда выполнения не смогла бы проверить этот компонент типа. Такое сочетание могло бы привести к heap pollution; создание массива параметризованного типа запрещено. Обычно вместо него используют List<List<String>>."
    category: "Generics: стирание типов"
    context: null
    hint_1: "Сравни проверки типов у массивов и у generic-коллекций во время выполнения."
    hint_2: null
    difficulty: hard
    code: null

  - question: "Зачем объявлять собственный параметр типа у метода, например <T> T first(List<T> values), вместо возврата Object?"
    answer: "Параметр T связывает тип элементов аргумента с типом результата: из List<String> метод возвращает String без ручного приведения. Возврат Object теряет эту связь и переносит проверку типов на вызывающий код. Ограничение вроде <T extends Number> дополнительно задаёт операции, доступные внутри метода."
    category: "Generics: типы и границы"
    context: null
    hint_1: "Сравни тип результата при вызове с List<String>."
    hint_2: null
    difficulty: medium
    code: null
