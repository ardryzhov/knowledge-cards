    code: null

  - question: "Почему для стека и очереди новых Java-приложений часто выбирают Deque вместо Stack?"
    answer: "Deque предоставляет операции с обоих концов и поддерживает LIFO и FIFO без наследия старого класса Stack. ArrayDeque обычно удобен для локального стека или очереди без требований конкурентности; он не принимает null."
    category: "Очереди"
