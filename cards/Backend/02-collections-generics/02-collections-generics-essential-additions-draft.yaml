topic: "Collections and Generics"
cards:
  - question: "Как load factor влияет на момент расширения HashMap и стоимость операций?"
    answer: "Когда число записей превышает порог, связанный с ёмкостью и load factor, HashMap расширяет таблицу и перераспределяет записи. Слишком высокий коэффициент увеличивает коллизии, слишком низкий расходует память; настройки меняют только после измерения."
    category: "Хеш-коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему HashMap с постоянным hashCode остаётся корректным, но может работать медленно?"
    answer: "Равенство ключей всё ещё проверяется через equals, поэтому коллизии не делают карту логически неверной. Однако записи концентрируются в малом числе бакетов, и поиск теряет ожидаемую среднюю стоимость O(1)."
    category: "Хеш-коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Сколько записей останется в HashMap после двух put с разными User, равными по полям, если переопределён только equals?"
    answer: "Однозначного числа без дополнительных условий нет. Object.hashCode у двух объектов обычно различается, и тогда останутся две записи; при совпадении хешей карта сравнит ключи через equals и второе значение заменит первое. Именно поэтому равные по equals объекты обязаны иметь одинаковый hashCode."
    category: "Хеш-коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Как HashSet определяет уникальность и при чём здесь HashMap?"
    answer: "Типичная реализация HashSet хранит элементы как ключи внутренней HashMap. Для поиска дубликата используются hashCode и equals, поэтому нарушение их контракта ломает ожидаемую уникальность."
    category: "Хеш-коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему TreeSet может оставить только один из двух объектов, у которых equals возвращает false?"
    answer: "TreeSet использует Comparator или Comparable для определения порядка и эквивалентности. Если сравнение возвращает 0, элементы считаются одинаковыми для дерева, даже если equals считает их разными. Правило сравнения желательно согласовывать с equals."
    category: "Упорядоченные коллекции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем Arrays.asList(array) отличается от List.of(array)?"
    answer: "Arrays.asList возвращает список фиксированного размера, связанный с исходным массивом: set меняет массив, а add/remove недоступны. List.of создаёт неизменяемый по структуре список и отвергает null; при массиве ссылок его состав не следует считать живым представлением исходного массива."
    category: "Итерация и изменяемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как удалить элементы из ArrayList во время обхода без ConcurrentModificationException?"
    answer: "Использовать Iterator.remove после next, removeIf или отдельную фильтрацию. Изменение списка через его методы во время работы обычного итератора может нарушить его состояние и вызвать fail-fast исключение."
    category: "Итерация и изменяемость"
