    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда Collections.binarySearch может вернуть неверный результат?"
    answer: "Поиск требует, чтобы список был отсортирован тем же порядком, который передан для поиска. Если элементы не отсортированы или Comparator отличается, результат не определён контрактом. На ArrayList доступ по индексу дешевле, чем на LinkedList."
    category: "Контракты коллекций"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем параметр метода <T> отличается от wildcard <?> в его аргументе?"
    answer: "T связывает типы нескольких мест сигнатуры, например входа и результата. Wildcard обозначает неизвестный тип, когда такую связь выражать не нужно. Лишний параметр T усложняет API, а wildcard не позволяет сохранить точный тип результата."
    category: "Generics: типы и границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем компилятор может создавать bridge method при переопределении generic-метода?"
    answer: "После стирания типов сигнатуры методов могли бы перестать совпадать для полиморфизма. Синтетический bridge method перенаправляет вызов на специализированную реализацию и сохраняет переопределение на уровне байткода."
    category: "Generics: стирание типов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Почему generic varargs может приводить к heap pollution?"
    answer: "Varargs реализован массивом, а массив параметризованного типа нельзя полноценно проверить во время выполнения из-за стирания. Если метод записывает в такой массив значение другого типа, ошибка может проявиться позже при чтении. @SafeVarargs допустим только когда реализация действительно безопасна."
    category: "Generics: стирание типов"
