topic: "Stream API and Functional Style"
cards:
  - question: "Чем Stream отличается от коллекции?"
    answer: "Коллекция хранит элементы, а Stream описывает последовательность вычислений над источником. Stream обычно не хранит данные и после терминальной операции считается использованным; для нового прохода создают новый Stream."
    category: "Основы Stream"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Когда начинают выполняться промежуточные операции Stream?"
    answer: "Промежуточные операции, такие как map и filter, ленивы: они строят конвейер. Обработка элементов начинается при терминальной операции, например collect, count или forEach. Поэтому без терминальной операции побочные эффекты внутри map могут вообще не произойти."
    category: "Основы Stream"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Можно ли повторно выполнить терминальную операцию над тем же Stream?"
    answer: "Нет. После терминальной операции Stream закрыт для повторного использования; повторный вызов обычно приводит к IllegalStateException. Нужно заново получить Stream от источника или создать Supplier<Stream<T>>."
    category: "Основы Stream"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Чем map отличается от flatMap?"
    answer: "map преобразует каждый элемент в один результат, в том числе в контейнер. flatMap преобразует элемент в поток результатов и объединяет вложенные потоки в один. Это удобно для списков списков или цепочек Optional."
    category: "Преобразования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как filter влияет на элементы и исходную коллекцию?"
    answer: "filter пропускает только элементы, удовлетворяющие Predicate, и сам по себе не меняет исходную коллекцию. Его результат — новый Stream. Если предикат имеет побочные эффекты, поведение становится труднее понимать и распараллеливать."
    category: "Преобразования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "По какому правилу Stream.distinct определяет дубликаты?"
    answer: "distinct использует равенство элементов по equals, а для хеш-структур также важен согласованный hashCode. Если класс нарушает контракт равенства, результат удаления дубликатов может быть неверным. Для иной семантики уникальности надо явно выбрать ключ."
    category: "Преобразования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как Stream.sorted выбирает порядок элементов?"
    answer: "Без аргумента требуется естественный порядок Comparable; с Comparator используется переданное правило. sorted является stateful-операцией: ей нужно учитывать множество элементов, поэтому на больших или бесконечных потоках её стоимость существенна."
    category: "Преобразования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем reduce отличается от collect?"
    answer: "reduce сворачивает элементы ассоциативной операцией в итоговое значение. collect предназначен для накопления в изменяемый результат через Collector или поставщик, аккумулятор и объединитель. Для списка или карты обычно выбирают collect, а для суммы — reduce или примитивный sum."
    category: "Терминальные операции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему функция объединения в параллельном reduce должна быть ассоциативной?"
    answer: "Параллельный Stream разбивает данные и объединяет частичные результаты в разном порядке. Если операция не ассоциативна, например вычитание, итог может зависеть от разбиения и порядка выполнения. Нейтральный элемент также должен соответствовать операции."
    category: "Терминальные операции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Что произойдёт при Collectors.toMap, если два элемента дают одинаковый ключ?"
    answer: "Перегрузка без merge-функции выбросит IllegalStateException при дублирующемся ключе. Нужно заранее определить правило: отвергнуть дубликат, оставить первое или последнее значение либо объединить значения, и передать подходящую merge-функцию."
    category: "Collectors"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем groupingBy отличается от partitioningBy?"
    answer: "groupingBy группирует элементы по произвольному ключу классификатора. partitioningBy делит элементы на две группы по boolean-предикату с ключами true и false. Выбор зависит от числа и типа групп."
    category: "Collectors"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Гарантирует ли Collectors.toList конкретный тип или изменяемость полученного списка?"
    answer: "Нет. Контракт Collectors.toList не обещает конкретную реализацию, изменяемость или потокобезопасность. Если нужен конкретный тип, используют toCollection; если нужна неизменяемая структура, выбирают API с явной гарантией."
    category: "Collectors"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем Stream.toList отличается от collect(Collectors.toList())?"
    answer: "Stream.toList возвращает неизменяемый по структуре список. collect(Collectors.toList()) не гарантирует ни изменяемость, ни конкретный тип результата. Нельзя полагаться на случайное поведение текущей реализации."
    category: "Collectors"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему peek не стоит использовать для обязательной бизнес-логики?"
    answer: "peek предназначен прежде всего для наблюдения элементов. Из-за ленивости и оптимизаций Stream вызов peek может не происходить так, как ожидается, если терминальная операция не требует обхода элементов. Значимые действия лучше выполнять явно."
    category: "Поведение конвейера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем findFirst отличается от findAny?"
    answer: "findFirst сохраняет семантику первого элемента при наличии encounter order. findAny может вернуть любой подходящий элемент, что позволяет больше свободы параллельному выполнению. На неупорядоченном источнике ожидать определённый первый элемент нельзя."
    category: "Поведение конвейера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие операции Stream могут завершиться без обхода всех элементов?"
    answer: "Короткозамыкающие терминальные операции вроде anyMatch, findFirst и limit при подходящих условиях могут завершиться раньше конца источника. Поэтому нельзя рассчитывать, что побочный эффект в промежуточной операции выполнится для каждого элемента."
    category: "Поведение конвейера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда parallelStream может ухудшить производительность?"
    answer: "Распараллеливание имеет накладные расходы на разбиение, координацию и объединение. Для малых коллекций, дешёвых операций, блокирующего I/O или общей изменяемой структуры оно может быть медленнее и опаснее. Решение принимают по измерениям."
    category: "Параллелизм"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему изменяемый общий список внутри parallelStream.forEach — плохой способ собирать результат?"
    answer: "Несколько потоков могут одновременно менять список, вызывая гонки и повреждение данных. Даже синхронизация может убрать выгоду параллелизма. Для накопления используют корректный Collector с определённой семантикой объединения."
    category: "Параллелизм"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем нужны IntStream, LongStream и DoubleStream?"
    answer: "Они обрабатывают примитивные значения без упаковки каждого элемента в обёртку и предоставляют операции вроде sum и average. Это может уменьшить расходы памяти и CPU; для перехода от Stream<T> используют mapToInt и аналогичные методы."
    category: "Примитивные потоки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает Stream.ofNullable(value)?"
    answer: "Если value равен null, создаётся пустой Stream; иначе Stream из одного элемента. Это удобно для включения необязательного значения в конвейер. При этом обычный Stream может содержать null, что требует осторожности в операциях, которые его не допускают."
    category: "Примитивные потоки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

