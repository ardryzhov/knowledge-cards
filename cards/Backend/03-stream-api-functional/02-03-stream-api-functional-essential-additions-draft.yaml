topic: "Stream API and Functional Style"
cards:
  - question: "Почему бесконечный Stream.generate требует осторожности с терминальной операцией?"
    answer: "Операция, которой нужен весь поток, например collect в список или count, никогда не завершится на бесконечном источнике. Для ограниченной обработки используют limit или короткозамыкающую терминальную операцию с подходящим условием."
    category: "Основы Stream"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как посчитать число элементов по каждому ключу через groupingBy?"
    answer: "Использовать downstream collector: groupingBy(classifier, counting()). Обычный groupingBy собирает списки элементов и тратит на них память, хотя для счётчиков сами элементы после классификации не нужны."
    category: "Collectors"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем forEachOrdered отличается от forEach в параллельном Stream?"
    answer: "forEach не обязан соблюдать порядок encounter order при параллельном выполнении. forEachOrdered сохраняет этот порядок для источника с определённым порядком, но может уменьшить выигрыш от параллелизма."
    category: "Поведение конвейера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему Stream из файла нужно закрывать, а Stream из List обычно нет?"
    answer: "Files.lines держит открытый файловый ресурс, который закрывается через Stream.close или try-with-resources. Stream из памяти обычно не владеет внешним ресурсом. Терминальная операция сама по себе не обещает закрыть файловый поток."
    category: "Поведение конвейера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что произойдёт, если map вернёт null, а затем вызвать findFirst?"
    answer: "Stream допускает null в некоторых конвейерах, но findFirst возвращает Optional и не может представить присутствующий null; при встрече такого элемента возникнет NullPointerException. Отсутствие результата лучше моделировать через flatMap(Stream::ofNullable) или фильтрацию."
    category: "Преобразования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Почему параллельный Stream над блокирующими HTTP-вызовами может мешать другим задачам?"
    answer: "Типичный parallelStream использует общий ForkJoinPool. Блокирующие вызовы удерживают его рабочие потоки, влияя на другие параллельные операции. Для сетевого I/O лучше выбрать контролируемый executor и явные ограничения конкурентности."
    category: "Параллелизм"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
