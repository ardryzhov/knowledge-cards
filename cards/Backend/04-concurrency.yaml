- id: 88f84158-036c-4925-9db0-7454dd495dab
  question: Почему count++ не является атомарной операцией?
  answer: Инкремент состоит из чтения, вычисления и записи. Два потока могут прочитать
    одно старое значение и записать одинаковый новый результат, потеряв обновление.
    Нужны синхронизация, атомарный тип или другой согласованный механизм.
  category: Гонки данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c4974fee-2185-477e-8eae-f98824e8d24f
  question: Что гарантирует synchronized для кода внутри критической секции?
  answer: Взаимное исключение для потоков, использующих один монитор, и отношения
    видимости памяти при освобождении и последующем захвате этого монитора. Синхронизация
    не помогает, если часть обращений к общему состоянию обходит тот же механизм.
  category: Синхронизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4fb1dd45-1cfc-4ff5-ae84-497d66a998de
  question: Почему volatile не подходит для корректного count++?
  answer: volatile обеспечивает видимость и порядок чтений и записей переменной, но
    не объединяет чтение, изменение и запись в одну атомарную операцию. Для инкремента
    используют AtomicInteger, LongAdder или блокировку.
  category: Модель памяти
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 83d42501-9a8d-46a8-8aef-06ac064a780b
  question: Что означает happens-before в Java Memory Model?
  answer: Это отношение между действиями, при котором эффекты первого гарантированно
    видны второму при соблюдении правил модели памяти. Его создают, например, захват
    и освобождение одного монитора, операции с volatile и завершение потока перед
    успешным join.
  category: Модель памяти
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2038a59e-3225-45fc-8c07-1b4116bd2d55
  question: Как CAS помогает атомарному обновлению и какой у него компромисс?
  answer: Compare-and-set меняет значение только если оно равно ожидаемому; при конфликте
    операция может повторяться. Это позволяет избежать блокировки для простых обновлений,
    но при сильной конкуренции повторы могут быть дорогими, а сложные инварианты требуют
    другого решения.
  category: Атомарность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 59ff2f50-f815-4df7-b259-035b09f2e339
  question: Чем ReentrantLock отличается от synchronized на практике?
  answer: ReentrantLock требует явного unlock в finally, но предоставляет tryLock,
    прерываемое ожидание и возможность настроить справедливость. synchronized освобождает
    монитор автоматически при выходе из блока. Выбирают минимальный механизм, нужный
    конкретному сценарию.
  category: Блокировки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 215f0409-214f-4fb6-898d-860bf09b265a
  question: Что такое deadlock и как уменьшить риск при захвате двух блокировок?
  answer: Deadlock — циклическое ожидание, когда потоки удерживают ресурсы, нужные
    друг другу. Единый порядок захвата блокировок, сокращение вложенных блокировок
    и таймауты помогают его избежать. Диагностировать его можно по thread dump.
  category: Блокировки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 49c6524b-e5c6-4f12-a937-2145e6dbb00e
  question: Чем livelock отличается от deadlock?
  answer: При deadlock потоки стоят и ждут. При livelock они продолжают действовать
    и реагировать друг на друга, но полезная работа не продвигается. Причина часто
    в симметричных повторных попытках без случайной задержки или ограничения.
  category: Блокировки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f6d18752-99e9-4fb8-b9e1-1e198cc0b784
  question: Почему wait обычно вызывают в цикле while, а не в if?
  answer: Пробуждение возможно без выполнения ожидаемого условия, а после notify другой
    поток может изменить состояние до повторного захвата монитора. Цикл заново проверяет
    предикат; вызывать wait нужно при владении монитором соответствующего объекта.
  category: Ожидание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: decee398-a26a-4800-ad80-739c09ae223c
  question: Чем CountDownLatch отличается от CyclicBarrier?
  answer: CountDownLatch позволяет ждать, пока счётчик дойдёт до нуля, и не переиспользуется.
    CyclicBarrier синхронизирует заданное число участников на общей точке и может
    применяться повторно. Их используют для разных схем координации.
  category: Ожидание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f6a7c850-f402-4874-98a1-34f709da0c52
  question: Почему после использования ExecutorService важно вызвать shutdown и дождаться
    завершения задач?
  answer: Пул может удерживать рабочие потоки и ресурсы, поэтому процесс не завершится
    как ожидается. shutdown запрещает новые задачи, а awaitTermination даёт завершить
    уже отправленные. При необходимости применяют контролируемое принудительное завершение.
  category: ExecutorService
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 639c7baa-8866-455a-885b-13483f6f856f
  question: Чем Future отличается от CompletableFuture?
  answer: Future позволяет получить результат и отменить задачу, но комбинирование
    и обработка продолжений неудобны. CompletableFuture поддерживает цепочки преобразований,
    объединение нескольких задач и обработку ошибок; нужно понимать, в каком executor
    выполняются этапы.
  category: ExecutorService
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d1306841-9ea6-478c-b7c5-88fbbb6af434
  question: Что должен сделать код, поймавший InterruptedException, если он не может
    передать его выше?
  answer: Обычно восстановить флаг через Thread.currentThread().interrupt() и корректно
    завершить операцию. Молчаливое игнорирование ломает протокол отмены и завершения.
    Конкретное действие зависит от контракта метода.
  category: Прерывание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 13c81b93-7067-4166-8044-197089f89aae
  question: Какой риск создаёт ThreadLocal в пуле потоков?
  answer: Потоки пула живут дольше одной задачи, поэтому оставленное значение может
    попасть в следующую задачу или удерживать память. Значение следует удалять в finally
    через remove, если оно не должно переживать задачу.
  category: ThreadLocal
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7fd5c145-f23a-4458-b6d3-ff795ecf28fe
  question: Почему get(), затем put() в ConcurrentHashMap не гарантируют атомарность
    всей операции?
  answer: Каждый вызов потокобезопасен по отдельности, но между ними другой поток
    может изменить карту. Для условного обновления нужны атомарные операции putIfAbsent,
    compute или merge с учётом их контракта.
  category: Конкурентные коллекции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f3f8616d-a823-45d2-8e05-54ac61a098eb
  question: Для каких задач виртуальные потоки Java 21 полезны, а для каких не ускоряют
    вычисления?
  answer: Они упрощают масштабирование большого числа блокирующих I/O-задач за счёт
    дешёвого ожидания. CPU-вычисления не становятся быстрее от увеличения числа потоков;
    также важно проверять ограничения библиотек и участки, которые удерживают carrier
    thread.
  category: Виртуальные потоки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 776fbc59-e14b-4e62-9e23-4c4bfbc017df
  question: Как daemon-потоки влияют на завершение JVM?
  answer: JVM может завершиться, когда закончились все недемонические потоки, даже
    если daemon-потоки ещё работают. Поэтому важную работу и сохранение данных нельзя
    оставлять только daemon-потоку без явного ожидания завершения.
  category: Завершение JVM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: facb89a1-2046-4efa-9791-88c44b95ba3b
  question: Что покажет thread dump при расследовании зависшего Java-сервиса?
  answer: Он показывает стеки потоков, их состояния и часто информацию о мониторах
    или блокировках. По нему можно искать deadlock, длительное ожидание и горячие
    участки, но для полной картины иногда нужны несколько снимков во времени.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d365e1bc-6fcf-4e87-a35a-814ae9a59536
  question: Чем Thread.sleep отличается от Object.wait относительно монитора?
  answer: sleep приостанавливает поток, но не освобождает удерживаемый монитор. wait
    вызывают при владении монитором указанного объекта; он временно освобождает именно
    этот монитор и после пробуждения захватывает его снова.
  category: Ожидание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: deed039b-1398-4c9a-9fd9-a9bdc5cd7325
  question: Освобождает ли notify монитор сразу после вызова?
  answer: Нет. notify переводит ожидающий поток к возможности продолжить, но тот должен
    снова захватить монитор. Уведомляющий поток освобождает монитор только при выходе
    из synchronized-блока или метода.
  category: Ожидание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c4aae9cc-72a7-4701-9962-3ed4185e1a05
  question: Когда LongAdder может быть лучше AtomicLong для счётчика?
  answer: При высокой конкуренции LongAdder распределяет обновления по нескольким
    ячейкам и часто даёт большую пропускную способность. sum не является атомарным
    снимком при одновременных обновлениях, поэтому для строгой последовательной семантики
    выбирают AtomicLong.
  category: Атомарность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 74d69753-b016-449f-839d-c45b18cd7352
  question: Что такое ABA-проблема в CAS?
  answer: Значение меняется из A в B и обратно в A, поэтому CAS видит ожидаемое A
    и не замечает промежуточного изменения. Если история изменений важна, используют
    версионирование или атомарную ссылку с меткой.
  category: Атомарность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d3a628af-1b8b-45e6-9cfe-92c5cd6b3ce0
  question: Почему double-checked locking singleton требует volatile у поля экземпляра?
  answer: Без нужных гарантий видимости другой поток может увидеть ссылку на объект
    до безопасного завершения его инициализации. volatile вместе с корректными проверками
    и блокировкой обеспечивает необходимый порядок публикации. Более простой вариант
    — holder или enum.
  category: Синхронизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: f5e9a03f-404e-4ea7-bf5c-b5aa7ab21fc7
  question: Как BlockingQueue упрощает схему producer-consumer?
  answer: Очередь обеспечивает потокобезопасную передачу элементов и операции ожидания
    при пустой или полной очереди. Она убирает необходимость вручную писать wait/notify,
    но ёмкость и политика остановки должны быть выбраны явно.
  category: Ожидание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2170cb55-99c8-482c-b54b-3c8cdd086114
  question: Для чего подходит Semaphore?
  answer: Он ограничивает число одновременно выполняемых операций или пользователей
    ресурса через permits. Например, можно ограничить число одновременных запросов
    к дорогой зависимости. Каждый успешный acquire должен иметь соответствующий release,
    обычно в finally.
  category: Ожидание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bed42e4c-7c11-4307-8560-1b2c49afef98
  question: Чем Callable отличается от Runnable?
  answer: Callable возвращает результат и может объявлять checked exception. Runnable
    ничего не возвращает и не объявляет checked exception в методе run. Оба можно
    отправлять в executor, который возвращает Future для отслеживания выполнения.
  category: ExecutorService
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ba5b59af-d91e-42a1-a467-59b3e4dd8d47
  question: Почему фиксированный пул с неограниченной очередью задач может привести
    к OutOfMemoryError?
  answer: Если задачи поступают быстрее, чем выполняются, очередь растёт без ограничения
    и удерживает объекты в памяти. Нужны ограниченная очередь, политика отказа или
    backpressure и метрики длины ожидания.
  category: ExecutorService
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 954ba4e5-1768-4fae-9ec6-9fecd461930b
  question: Чем CompletableFuture.thenCompose отличается от thenApply?
  answer: thenApply преобразует результат обычной функцией и при функции, возвращающей
    CompletableFuture, создаёт вложенный future. thenCompose объединяет асинхронные
    этапы в один CompletableFuture результата.
  category: ExecutorService
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ca15952d-47df-4c72-91cf-ceec3352f849
  question: Как обработать исключение в цепочке CompletableFuture, не потеряв его
    причину?
  answer: Использовать exceptionally, handle или whenComplete в соответствии с тем,
    нужно ли восстановить значение, преобразовать оба исхода или только наблюдать.
    При get/join исключение может быть обёрнуто; исходную причину нужно извлечь и
    сохранить при передаче выше.
  category: ExecutorService
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b5fb9ec6-1cd3-4dfd-be01-de6e4d2ba159
  question: Когда ArrayBlockingQueue полезна между producer и consumer?
  answer: Когда нужна потокобезопасная очередь фиксированной ёмкости с блокирующим
    ожиданием. Лимит ёмкости не даёт производителям бесконтрольно заполнять память;
    при полной очереди put ждёт, а offer может отказать или ждать заданное время.
  category: Очереди и нагрузка
