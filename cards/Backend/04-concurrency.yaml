- id: 2224ce2d-b570-41ab-b69c-1c41cc25aedd
  question: Чем задача Runnable отличается от потока Thread?
  answer: Runnable описывает работу без результата, а Thread представляет конкретный
    поток выполнения. Разделение задачи и механизма запуска позволяет передавать задачи
    в ExecutorService и переиспользовать потоки.
  category: Потоки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
