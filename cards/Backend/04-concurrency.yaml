- id: 23274db7-d8b3-49db-9553-009f37738bc6
  question: Чем вызов thread.start() отличается от thread.run()?
  answer: start создаёт новый путь выполнения и затем вызывает run в новом потоке.
    Прямой вызов run выполняет метод в текущем потоке как обычный метод. Один объект
    Thread можно запустить через start только один раз.
  category: Потоки
  context: 
