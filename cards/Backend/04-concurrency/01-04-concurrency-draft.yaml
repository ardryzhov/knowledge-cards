    code: null

  - question: "Какой риск создаёт ThreadLocal в пуле потоков?"
    answer: "Потоки пула живут дольше одной задачи, поэтому оставленное значение может попасть в следующую задачу или удерживать память. Значение следует удалять в finally через remove, если оно не должно переживать задачу."
    category: "ThreadLocal"
    context: null
