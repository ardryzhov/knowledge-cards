    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему get(), затем put() в ConcurrentHashMap не гарантируют атомарность всей операции?"
    answer: "Каждый вызов потокобезопасен по отдельности, но между ними другой поток может изменить карту. Для условного обновления нужны атомарные операции putIfAbsent, compute или merge с учётом их контракта."
    category: "Конкурентные коллекции"
