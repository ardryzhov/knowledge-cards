  - question: "Для каких задач виртуальные потоки Java 21 полезны, а для каких не ускоряют вычисления?"
    answer: "Они упрощают масштабирование большого числа блокирующих I/O-задач за счёт дешёвого ожидания. CPU-вычисления не становятся быстрее от увеличения числа потоков; также важно проверять ограничения библиотек и участки, которые удерживают carrier thread."
    category: "Виртуальные потоки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как daemon-потоки влияют на завершение JVM?"
    answer: "JVM может завершиться, когда закончились все недемонические потоки, даже если daemon-потоки ещё работают. Поэтому важную работу и сохранение данных нельзя оставлять только daemon-потоку без явного ожидания завершения."
    category: "Завершение JVM"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что покажет thread dump при расследовании зависшего Java-сервиса?"
    answer: "Он показывает стеки потоков, их состояния и часто информацию о мониторах или блокировках. По нему можно искать deadlock, длительное ожидание и горячие участки, но для полной картины иногда нужны несколько снимков во времени."
    category: "Диагностика"
