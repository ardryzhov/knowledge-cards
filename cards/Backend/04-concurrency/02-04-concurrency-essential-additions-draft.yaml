    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем CompletableFuture.thenCompose отличается от thenApply?"
    answer: "thenApply преобразует результат обычной функцией и при функции, возвращающей CompletableFuture, создаёт вложенный future. thenCompose объединяет асинхронные этапы в один CompletableFuture результата."
    category: "ExecutorService"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как обработать исключение в цепочке CompletableFuture, не потеряв его причину?"
    answer: "Использовать exceptionally, handle или whenComplete в соответствии с тем, нужно ли восстановить значение, преобразовать оба исхода или только наблюдать. При get/join исключение может быть обёрнуто; исходную причину нужно извлечь и сохранить при передаче выше."
    category: "ExecutorService"
