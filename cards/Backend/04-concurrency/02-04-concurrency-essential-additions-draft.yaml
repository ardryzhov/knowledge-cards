    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое ABA-проблема в CAS?"
    answer: "Значение меняется из A в B и обратно в A, поэтому CAS видит ожидаемое A и не замечает промежуточного изменения. Если история изменений важна, используют версионирование или атомарную ссылку с меткой."
    category: "Атомарность"
    context: null
