  - question: "Как BlockingQueue упрощает схему producer-consumer?"
    answer: "Очередь обеспечивает потокобезопасную передачу элементов и операции ожидания при пустой или полной очереди. Она убирает необходимость вручную писать wait/notify, но ёмкость и политика остановки должны быть выбраны явно."
    category: "Ожидание"
