topic: "Java Concurrency"
cards:
  - question: "Чем Thread.sleep отличается от Object.wait относительно монитора?"
    answer: "sleep приостанавливает поток, но не освобождает удерживаемый монитор. wait вызывают при владении монитором указанного объекта; он временно освобождает именно этот монитор и после пробуждения захватывает его снова."
    category: "Ожидание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Освобождает ли notify монитор сразу после вызова?"
    answer: "Нет. notify переводит ожидающий поток к возможности продолжить, но тот должен снова захватить монитор. Уведомляющий поток освобождает монитор только при выходе из synchronized-блока или метода."
    category: "Ожидание"
    context: null
