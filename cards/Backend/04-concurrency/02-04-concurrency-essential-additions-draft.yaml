    code: null

  - question: "Для чего подходит Semaphore?"
    answer: "Он ограничивает число одновременно выполняемых операций или пользователей ресурса через permits. Например, можно ограничить число одновременных запросов к дорогой зависимости. Каждый успешный acquire должен иметь соответствующий release, обычно в finally."
    category: "Ожидание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем Callable отличается от Runnable?"
    answer: "Callable возвращает результат и может объявлять checked exception. Runnable ничего не возвращает и не объявляет checked exception в методе run. Оба можно отправлять в executor, который возвращает Future для отслеживания выполнения."
    category: "ExecutorService"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Почему фиксированный пул с неограниченной очередью задач может привести к OutOfMemoryError?"
    answer: "Если задачи поступают быстрее, чем выполняются, очередь растёт без ограничения и удерживает объекты в памяти. Нужны ограниченная очередь, политика отказа или backpressure и метрики длины ожидания."
    category: "ExecutorService"
    context: null
