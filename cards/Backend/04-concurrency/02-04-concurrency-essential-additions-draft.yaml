    hint_2: null
    difficulty: hard
    code: null

  - question: "Почему double-checked locking singleton требует volatile у поля экземпляра?"
    answer: "Без нужных гарантий видимости другой поток может увидеть ссылку на объект до безопасного завершения его инициализации. volatile вместе с корректными проверками и блокировкой обеспечивает необходимый порядок публикации. Более простой вариант — holder или enum."
    category: "Синхронизация"
