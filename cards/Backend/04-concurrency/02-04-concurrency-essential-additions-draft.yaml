    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда LongAdder может быть лучше AtomicLong для счётчика?"
    answer: "При высокой конкуренции LongAdder распределяет обновления по нескольким ячейкам и часто даёт большую пропускную способность. sum не является атомарным снимком при одновременных обновлениях, поэтому для строгой последовательной семантики выбирают AtomicLong."
    category: "Атомарность"
    context: null
