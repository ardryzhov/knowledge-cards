- id: d1a89d5f-ff9d-4652-950e-d838bbcbffd5
  question: Чем JVM, JDK и Java runtime отличаются друг от друга?
  answer: JVM исполняет байткод и управляет средой выполнения. JDK содержит инструменты
    разработки, включая компилятор и диагностику. Runtime включает необходимые компоненты
    для запуска приложения; состав поставки зависит от версии и дистрибутива.
  category: Платформа
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 30297ad5-b472-4ce4-bb70-7fa28c29f2b9
  question: Как Java-код превращается в выполняемые инструкции?
  answer: Компилятор переводит исходники в байткод, JVM загружает и проверяет классы,
    затем интерпретирует байткод и компилирует горячие участки JIT-компилятором. Поэтому
    производительность может меняться после прогрева.
  category: Исполнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 74c52cb7-9573-4565-b3a5-3b9f604e99a0
  question: Какие этапы проходит класс от загрузки до использования?
  answer: Загрузка находит определение, linking включает проверку и подготовку, а
    инициализация выполняет статические инициализаторы. Эти этапы не обязательно происходят
    одновременно; конкретный момент инициализации определяется правилами активного
    использования.
  category: Загрузка классов
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: aabb40ef-ece3-4462-8160-31b13d9be05c
  question: Почему одинаковые классы с одним именем могут быть несовместимыми в JVM?
  answer: Идентичность класса определяется не только полным именем, но и загрузчиком
    классов. Два загрузчика могут создать разные типы с одинаковым именем, и приведение
    между ними завершится ClassCastException.
  category: Загрузка классов
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d190f40c-6d02-4ce9-a815-2222bfc49918
  question: Чем ClassNotFoundException отличается от NoClassDefFoundError?
  answer: ClassNotFoundException возникает при явной попытке загрузить класс, который
    не найден. NoClassDefFoundError означает, что нужное определение недоступно во
    время выполнения, хотя код рассчитывал на него; причиной может быть отсутствие
    зависимости или сбой инициализации.
  category: Загрузка классов
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 42fce91f-88e1-4327-9be2-aa4322bc9f07
  question: Какие данные обычно размещаются в heap, а какие в стеке потока?
  answer: Объекты и массивы обычно живут в heap. Стек потока хранит кадры вызовов,
    локальные переменные и промежуточные значения; ссылочная переменная может находиться
    в стеке, а объект — в heap. JIT вправе оптимизировать фактическое размещение.
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8894ca9e-1429-4d24-8e81-6513a397b445
  question: Что хранится в Metaspace и чем его переполнение отличается от переполнения
    heap?
  answer: 'Metaspace хранит метаданные классов вне Java heap. Большое число загруженных
    классов или утечка загрузчиков может привести к OutOfMemoryError: Metaspace, хотя
    обычный heap ещё имеет свободное место.'
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 50d35474-145c-43ae-b747-df79a91c2cdc
  question: Что делает объект достижимым для сборщика мусора?
  answer: Объект считается достижимым, если до него есть путь от GC roots, например
    от активных стеков, статических полей или JNI-ссылок. Циклические ссылки сами
    по себе не сохраняют объекты, если весь цикл недостижим от roots.
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f906bd81-3b31-41f5-a168-b0ce68b65600
  question: Почему GC не гарантирует немедленного освобождения памяти после потери
    последней ссылки?
  answer: Сборка запускается по решениям JVM и может произойти позже. Нельзя использовать
    GC как механизм своевременного закрытия файлов или соединений. Такие ресурсы освобождают
    явно.
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 9adccef2-4548-4362-a122-a9479e505604
  question: Зачем сборщики делят объекты по поколениям?
  answer: Во многих приложениях большинство объектов живёт недолго. Генерационный
    подход чаще собирает молодые объекты и реже обрабатывает долгоживущие, уменьшая
    общую стоимость сборки. Конкретные детали зависят от выбранного GC.
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a4ec6331-e379-47bb-8d0f-d7a276317c48
  question: Что означает stop-the-world пауза?
  answer: Во время такой фазы JVM временно останавливает прикладные потоки, чтобы
    выполнить часть работы сборщика или среды выполнения. Важны длительность и частота
    пауз, а не только общая пропускная способность GC.
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7abada40-931d-454d-b2e6-ecb5500d5b82
  question: Как выбирать между пропускной способностью и задержками при настройке
    GC?
  answer: 'Выбор зависит от SLO сервиса: batch-задаче может быть важнее throughput,
    а онлайн-запросам — хвостовые задержки. Настройки и сборщик выбирают после измерения
    пауз, загрузки CPU, heap и времени ответа, а не по названию алгоритма.'
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 490ad60e-1a86-4454-aadf-2fe5f11b6363
  question: Как возможна утечка памяти в языке со сборщиком мусора?
  answer: Если приложение ошибочно удерживает ссылки на больше не нужные объекты,
    они остаются достижимыми и GC не удалит их. Типичные причины — неограниченные
    кэши, статические коллекции, слушатели и ThreadLocal.
  category: Утечки памяти
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f08966a2-4f0f-41ba-bf1b-9f3f82793d16
  question: 'Чем StackOverflowError отличается от OutOfMemoryError: Java heap space?'
  answer: StackOverflowError обычно означает, что стек одного потока исчерпан, например
    из-за бесконечной рекурсии. Ошибка Java heap space означает нехватку места для
    объектов в heap; причины и способы диагностики различаются.
  category: Ошибки памяти
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 82f487a8-0f5b-469c-883b-92f70de91f77
  question: Когда полезен heap dump и что в нём ищут?
  answer: Heap dump показывает объекты и пути удержания памяти на момент снимка. Его
    анализируют при росте heap, подозрении на утечку или OutOfMemoryError, чтобы найти
    крупные структуры и GC roots, удерживающие их.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1794f719-6226-408a-a456-3be1086d520b
  question: Когда полезен thread dump, а когда профилировщик CPU?
  answer: Thread dump помогает понять состояния потоков, блокировки и стеки в момент
    снимка. CPU-профилировщик показывает, где процесс тратит процессорное время за
    интервал наблюдения. Для зависания и для высокой нагрузки нужны разные данные.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 90071596-5055-41c7-94ad-39018820d026
  question: Зачем использовать Java Flight Recorder при расследовании производительности?
  answer: JFR собирает события JVM и приложения, например выделения памяти, паузы
    GC и активность потоков, с относительно низкими накладными расходами. Он помогает
    связать деградацию с конкретными событиями во времени.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c58a1c5d-2ef5-4fe7-84e6-ef584b29d589
  question: Почему увеличение Xmx не является универсальным решением OutOfMemoryError?
  answer: Ошибка может быть связана с утечкой, Metaspace, числом потоков или памятью
    вне heap. Больший heap может лишь отложить проблему и изменить паузы GC. Сначала
    нужно определить область памяти и причину роста.
  category: Тюнинг
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a61ae99f-7447-42fc-8e96-3ea9da6f10f4
  question: Почему микробенчмарк на JVM легко даёт неверный вывод?
  answer: JIT-прогрев, dead-code elimination, сборка мусора и изменения окружения
    влияют на результат. Для сравнения небольших фрагментов используют методику с
    прогревом и специализированные инструменты вроде JMH, а решение для сервиса подтверждают
    профилированием реальной нагрузки.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c32177af-02d8-43a8-b3b9-14526e1c1b2a
  question: Какие данные нужны перед оптимизацией медленного Java-сервиса?
  answer: 'Нужны измеримые симптомы: latency, throughput, CPU, память, GC, блокировки
    и профиль запросов. Сначала находят узкое место и задают цель, затем меняют код
    или конфигурацию и повторяют измерение на сопоставимой нагрузке.'
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b1238550-c513-4966-a009-55e40c63add9
  question: Что такое parent delegation у ClassLoader и зачем оно нужно?
  answer: Загрузчик обычно сначала делегирует поиск родителю, чтобы базовые классы
    платформы не подменялись случайной копией из приложения. Пользовательские загрузчики
    могут менять стратегию, поэтому при диагностике нужно смотреть фактическую цепочку
    загрузки.
  category: Загрузка классов
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b65bb686-cf65-4a29-9c64-8585ee6d9e5f
  question: Почему первое выполнение метода может быть медленнее последующих на JVM?
  answer: Горячий код может сначала интерпретироваться, затем оптимизироваться JIT
    после накопления профиля. Прогрев, загрузка классов и инициализация также добавляют
    стоимость. Сравнивать производительность без учёта прогрева некорректно.
  category: Исполнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e70d81a3-7bc0-4124-b2d2-6c179386a24e
  question: Что такое deoptimization JIT-кода?
  answer: JIT может оптимизировать код на основе наблюдавшихся типов и веток. Если
    предположение перестаёт выполняться, JVM возвращается к менее оптимизированному
    пути и при необходимости компилирует заново. Это одна из причин нестабильного
    времени микробенчмарка.
  category: Исполнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0ed50fe7-ba70-4523-9070-85fa34edd08a
  question: Чем G1 принципиально отличается от сборщика, собирающего весь heap одинаковыми
    порциями?
  answer: G1 делит heap на регионы и выбирает набор регионов для сборки, ориентируясь
    на цель паузы и текущую статистику. Он не гарантирует строго заданную максимальную
    паузу, поэтому результат проверяют по GC-логам и latency сервиса.
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 97fa211b-4460-4828-8042-21aa3e0e3f3c
  question: Когда стоит рассмотреть ZGC?
  answer: Когда для приложения особенно важны короткие паузы на больших heap и есть
    подходящая версия JDK и ресурсы. Выбор требует измерения пропускной способности,
    CPU и задержек; нельзя считать ZGC автоматически лучшим для любого сервиса.
  category: GC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b5fad6de-3028-4128-bfcf-d8e8bfe19ba1
  question: Почему процесс Java может потреблять больше памяти, чем установленный
    Xmx?
  answer: Xmx ограничивает Java heap, но процесс использует также Metaspace, стеки
    потоков, direct buffers, JIT code cache и нативные структуры. В контейнере важно
    учитывать весь RSS и лимит памяти, а не только heap.
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7df2b50f-5914-4460-bb5a-469d0cf304c0
  question: Чем direct buffer отличается от обычного heap byte[]?
  answer: Direct buffer хранит данные вне Java heap и может уменьшать копирование
    при некоторых I/O-операциях. Его память всё равно входит в потребление процесса
    и освобождается не так, как обычный массив; чрезмерное создание может вызвать
    отдельные ошибки памяти.
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a01e2b70-6a22-4d27-9353-293982dbfbe1
  question: Что делает shutdown hook и на что нельзя рассчитывать при остановке процесса?
  answer: Hook позволяет выполнить завершающий код при штатном завершении JVM, например
    закрыть ресурсы. Он не гарантирован при SIGKILL, аварии среды или принудительном
    завершении контейнера. Завершение должно укладываться в предоставленный таймаут.
  category: Завершение JVM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 26fa3ba5-e2ff-466c-b63b-93c5aba1d3e5
  question: Когда JVM обычно начинает штатное завершение после возврата из main?
  answer: Когда завершились все запущенные non-daemon потоки; сам возврат из main
    не завершает процесс, если другие такие потоки продолжают работать. Завершение
    также может быть инициировано явно, например через Runtime.exit.
  category: Завершение JVM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
