topic: "JVM and Performance"
cards:
  - question: "Чем JVM, JDK и Java runtime отличаются друг от друга?"
    answer: "JVM исполняет байткод и управляет средой выполнения. JDK содержит инструменты разработки, включая компилятор и диагностику. Runtime включает необходимые компоненты для запуска приложения; состав поставки зависит от версии и дистрибутива."
    category: "Платформа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Как Java-код превращается в выполняемые инструкции?"
    answer: "Компилятор переводит исходники в байткод, JVM загружает и проверяет классы, затем интерпретирует байткод и компилирует горячие участки JIT-компилятором. Поэтому производительность может меняться после прогрева."
    category: "Исполнение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие этапы проходит класс от загрузки до использования?"
    answer: "Загрузка находит определение, linking включает проверку и подготовку, а инициализация выполняет статические инициализаторы. Эти этапы не обязательно происходят одновременно; конкретный момент инициализации определяется правилами активного использования."
    category: "Загрузка классов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему одинаковые классы с одним именем могут быть несовместимыми в JVM?"
    answer: "Идентичность класса определяется не только полным именем, но и загрузчиком классов. Два загрузчика могут создать разные типы с одинаковым именем, и приведение между ними завершится ClassCastException."
    category: "Загрузка классов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Чем ClassNotFoundException отличается от NoClassDefFoundError?"
    answer: "ClassNotFoundException возникает при явной попытке загрузить класс, который не найден. NoClassDefFoundError означает, что нужное определение недоступно во время выполнения, хотя код рассчитывал на него; причиной может быть отсутствие зависимости или сбой инициализации."
    category: "Загрузка классов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие данные обычно размещаются в heap, а какие в стеке потока?"
    answer: "Объекты и массивы обычно живут в heap. Стек потока хранит кадры вызовов, локальные переменные и промежуточные значения; ссылочная переменная может находиться в стеке, а объект — в heap. JIT вправе оптимизировать фактическое размещение."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что хранится в Metaspace и чем его переполнение отличается от переполнения heap?"
    answer: "Metaspace хранит метаданные классов вне Java heap. Большое число загруженных классов или утечка загрузчиков может привести к OutOfMemoryError: Metaspace, хотя обычный heap ещё имеет свободное место."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает объект достижимым для сборщика мусора?"
    answer: "Объект считается достижимым, если до него есть путь от GC roots, например от активных стеков, статических полей или JNI-ссылок. Циклические ссылки сами по себе не сохраняют объекты, если весь цикл недостижим от roots."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему GC не гарантирует немедленного освобождения памяти после потери последней ссылки?"
    answer: "Сборка запускается по решениям JVM и может произойти позже. Нельзя использовать GC как механизм своевременного закрытия файлов или соединений. Такие ресурсы освобождают явно."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Зачем сборщики делят объекты по поколениям?"
    answer: "Во многих приложениях большинство объектов живёт недолго. Генерационный подход чаще собирает молодые объекты и реже обрабатывает долгоживущие, уменьшая общую стоимость сборки. Конкретные детали зависят от выбранного GC."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает stop-the-world пауза?"
    answer: "Во время такой фазы JVM временно останавливает прикладные потоки, чтобы выполнить часть работы сборщика или среды выполнения. Важны длительность и частота пауз, а не только общая пропускная способность GC."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как выбирать между пропускной способностью и задержками при настройке GC?"
    answer: "Выбор зависит от SLO сервиса: batch-задаче может быть важнее throughput, а онлайн-запросам — хвостовые задержки. Настройки и сборщик выбирают после измерения пауз, загрузки CPU, heap и времени ответа, а не по названию алгоритма."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как возможна утечка памяти в языке со сборщиком мусора?"
    answer: "Если приложение ошибочно удерживает ссылки на больше не нужные объекты, они остаются достижимыми и GC не удалит их. Типичные причины — неограниченные кэши, статические коллекции, слушатели и ThreadLocal."
    category: "Утечки памяти"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем StackOverflowError отличается от OutOfMemoryError: Java heap space?"
    answer: "StackOverflowError обычно означает, что стек одного потока исчерпан, например из-за бесконечной рекурсии. Ошибка Java heap space означает нехватку места для объектов в heap; причины и способы диагностики различаются."
    category: "Ошибки памяти"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда полезен heap dump и что в нём ищут?"
    answer: "Heap dump показывает объекты и пути удержания памяти на момент снимка. Его анализируют при росте heap, подозрении на утечку или OutOfMemoryError, чтобы найти крупные структуры и GC roots, удерживающие их."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда полезен thread dump, а когда профилировщик CPU?"
    answer: "Thread dump помогает понять состояния потоков, блокировки и стеки в момент снимка. CPU-профилировщик показывает, где процесс тратит процессорное время за интервал наблюдения. Для зависания и для высокой нагрузки нужны разные данные."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем использовать Java Flight Recorder при расследовании производительности?"
    answer: "JFR собирает события JVM и приложения, например выделения памяти, паузы GC и активность потоков, с относительно низкими накладными расходами. Он помогает связать деградацию с конкретными событиями во времени."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему увеличение Xmx не является универсальным решением OutOfMemoryError?"
    answer: "Ошибка может быть связана с утечкой, Metaspace, числом потоков или памятью вне heap. Больший heap может лишь отложить проблему и изменить паузы GC. Сначала нужно определить область памяти и причину роста."
    category: "Тюнинг"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему микробенчмарк на JVM легко даёт неверный вывод?"
    answer: "JIT-прогрев, dead-code elimination, сборка мусора и изменения окружения влияют на результат. Для сравнения небольших фрагментов используют методику с прогревом и специализированные инструменты вроде JMH, а решение для сервиса подтверждают профилированием реальной нагрузки."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Какие данные нужны перед оптимизацией медленного Java-сервиса?"
    answer: "Нужны измеримые симптомы: latency, throughput, CPU, память, GC, блокировки и профиль запросов. Сначала находят узкое место и задают цель, затем меняют код или конфигурацию и повторяют измерение на сопоставимой нагрузке."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

