topic: "JVM and Performance"
cards:
  - question: "Что такое parent delegation у ClassLoader и зачем оно нужно?"
    answer: "Загрузчик обычно сначала делегирует поиск родителю, чтобы базовые классы платформы не подменялись случайной копией из приложения. Пользовательские загрузчики могут менять стратегию, поэтому при диагностике нужно смотреть фактическую цепочку загрузки."
    category: "Загрузка классов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему первое выполнение метода может быть медленнее последующих на JVM?"
    answer: "Горячий код может сначала интерпретироваться, затем оптимизироваться JIT после накопления профиля. Прогрев, загрузка классов и инициализация также добавляют стоимость. Сравнивать производительность без учёта прогрева некорректно."
    category: "Исполнение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое deoptimization JIT-кода?"
    answer: "JIT может оптимизировать код на основе наблюдавшихся типов и веток. Если предположение перестаёт выполняться, JVM возвращается к менее оптимизированному пути и при необходимости компилирует заново. Это одна из причин нестабильного времени микробенчмарка."
    category: "Исполнение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Чем G1 принципиально отличается от сборщика, собирающего весь heap одинаковыми порциями?"
    answer: "G1 делит heap на регионы и выбирает набор регионов для сборки, ориентируясь на цель паузы и текущую статистику. Он не гарантирует строго заданную максимальную паузу, поэтому результат проверяют по GC-логам и latency сервиса."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда стоит рассмотреть ZGC?"
    answer: "Когда для приложения особенно важны короткие паузы на больших heap и есть подходящая версия JDK и ресурсы. Выбор требует измерения пропускной способности, CPU и задержек; нельзя считать ZGC автоматически лучшим для любого сервиса."
    category: "GC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему процесс Java может потреблять больше памяти, чем установленный Xmx?"
    answer: "Xmx ограничивает Java heap, но процесс использует также Metaspace, стеки потоков, direct buffers, JIT code cache и нативные структуры. В контейнере важно учитывать весь RSS и лимит памяти, а не только heap."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем direct buffer отличается от обычного heap byte[]?"
    answer: "Direct buffer хранит данные вне Java heap и может уменьшать копирование при некоторых I/O-операциях. Его память всё равно входит в потребление процесса и освобождается не так, как обычный массив; чрезмерное создание может вызвать отдельные ошибки памяти."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает shutdown hook и на что нельзя рассчитывать при остановке процесса?"
    answer: "Hook позволяет выполнить завершающий код при штатном завершении JVM, например закрыть ресурсы. Он не гарантирован при SIGKILL, аварии среды или принудительном завершении контейнера. Завершение должно укладываться в предоставленный таймаут."
    category: "Завершение JVM"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
