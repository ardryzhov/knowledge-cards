topic: "JVM and Performance"
cards:
  - question: "Когда JVM обычно начинает штатное завершение после возврата из main?"
    answer: "Когда завершились все запущенные non-daemon потоки; сам возврат из main не завершает процесс, если другие такие потоки продолжают работать. Завершение также может быть инициировано явно, например через Runtime.exit."
