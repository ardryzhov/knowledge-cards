- id: 0403164b-7ba0-44b2-b348-8e3f0f0eb292
  question: Что означает Inversion of Control в Spring?
  answer: Созданием объектов и связыванием их зависимостей управляет контейнер, а
    не прикладной код вручную по всей программе. Это позволяет заменять реализации,
    централизовать конфигурацию и тестировать компоненты отдельно.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 1d43da68-3dcc-4418-a008-58609e2f8a15
  question: Чем dependency injection отличается от простого вызова new внутри сервиса?
  answer: При DI зависимость передаётся извне по контракту, а сервис не выбирает и
    не создаёт конкретную реализацию. Это снижает связность и делает требования сервиса
    явными. new уместен для локальных value object, которыми контейнеру управлять
    не нужно.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 968728b0-141e-4810-a87f-2062f4ee6f14
  question: Почему constructor injection обычно предпочтительнее field injection?
  answer: Конструктор делает обязательные зависимости явными и позволяет создать валидный
    объект без рефлексивного внедрения. Такой класс проще тестировать и держать неизменяемым.
    Большое число параметров конструктора может также показать, что у класса слишком
    много обязанностей.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7c5169cf-f2e0-4a83-bae9-552a8068e93d
  question: Чем @Component, @Service и @Repository различаются при регистрации бинов?
  answer: Все три помечают класс как кандидат для обнаружения компонентным сканированием.
    @Service выражает роль бизнес-сервиса, @Repository — слоя доступа к данным и участвует
    в переводе исключений доступа к данным при соответствующей настройке. Семантическая
    роль делает архитектуру понятнее.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8dc40a6f-61fd-49f4-93c3-c036fc116d3f
  question: Чем @Bean отличается от @Component?
  answer: "@Component ставят на класс, который Spring обнаруживает при сканировании.
    @Bean ставят на фабричный метод конфигурации, возвращающий объект под управлением
    контейнера; это удобно для библиотечных классов, которые нельзя аннотировать."
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fc681308-b9b7-4b09-85cf-1d19cf581500
  question: Что означает singleton scope в Spring?
  answer: Это один экземпляр конкретного определения бина на контейнер Spring, а не
    обязательно один объект на всю JVM. Несколько ApplicationContext могут иметь разные
    экземпляры; singleton-бин не становится автоматически потокобезопасным.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9b517c82-33d9-4916-ad5d-9c20d8590f23
  question: Когда нужен prototype scope и что важно знать о его жизненном цикле?
  answer: Контейнер создаёт новый экземпляр при каждом запросе prototype-бина. После
    создания Spring обычно не управляет его полным уничтожением так же, как singleton,
    поэтому очистка ресурсов остаётся ответственностью клиента или специальной инфраструктуры.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f9880795-f76b-4940-ba8b-fbc912316d0f
  question: Почему внедрение prototype-бина в singleton через обычный конструктор
    не создаёт новый prototype при каждом вызове?
  answer: Зависимость разрешается при создании singleton и сохраняется в его поле.
    Для получения новых экземпляров по запросу используют ObjectProvider, фабрику
    или scoped proxy, если это действительно требуется.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 09d47eb8-3105-4ae2-bbd9-1dafc3dc2273
  question: Как разрешить неоднозначность, когда для интерфейса найдено несколько
    бинов?
  answer: Можно указать @Qualifier для конкретной точки внедрения, назначить @Primary
    как выбор по умолчанию или внедрить коллекцию реализаций. Выбор должен отражать
    бизнес-смысл, а не зависеть от случайного порядка обнаружения.
  category: Контейнер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ab930bd6-8ff7-46d3-a127-b97f324cd7f0
  question: В какой момент выполняются @PostConstruct и @PreDestroy?
  answer: "@PostConstruct вызывается после создания бина и внедрения зависимостей,
    перед обычным использованием. @PreDestroy вызывается при закрытии контейнера для
    управляемого бина. На prototype-бины стандартное автоматическое уничтожение не
    распространяется так же, как на singleton."
  category: Жизненный цикл
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: deb68f23-985f-4266-a637-5d8b97e9ef26
  question: Почему циклическая зависимость между сервисами является сигналом проблемы
    дизайна?
  answer: Два сервиса требуют друг друга для создания, что усложняет инициализацию,
    тестирование и границы ответственности. Constructor injection делает цикл явным
    и обычно приводит к ошибке запуска. Часто помогает вынести общую ответственность
    в отдельный компонент.
  category: Жизненный цикл
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4874b38b-d443-4599-8d31-e90f14ea467b
  question: Почему вызов аннотированного метода через this внутри того же Spring-бина
    может обойти @Transactional или @Async?
  answer: Типичная реализация Spring AOP применяет поведение через proxy. Внутренний
    вызов this.method не проходит через proxy и не запускает перехватчик. Нужно изменить
    границы компонентов или использовать явный механизм, подходящий задаче.
  category: AOP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 90e19a78-376f-4053-b383-9d33c5f95637
  question: Чем JDK dynamic proxy отличается от class-based proxy в Spring?
  answer: JDK proxy реализует интерфейсы целевого объекта, а class-based proxy создаёт
    подкласс. Ограничения final-классов и final-методов важны для прокси на основе
    наследования. Конкретный выбор зависит от конфигурации Spring и формы целевого
    типа.
  category: AOP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: cb9667cb-1ee4-4238-8748-a32914c85443
  question: Что включает @SpringBootApplication?
  answer: Это составная аннотация, объединяющая конфигурацию приложения, включение
    auto-configuration и component scan от пакета её размещения. Расположение главного
    класса влияет на то, какие компоненты будут обнаружены.
  category: Boot
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5a2337ed-515d-482e-a8d9-fbf7867972cb
  question: Как Spring Boot auto-configuration решает, создавать ли инфраструктурный
    бин?
  answer: 'Конфигурации проверяют условия: наличие классов, свойств или уже определённых
    бинов. Они предоставляют значения по умолчанию, от которых можно отступить явной
    конфигурацией. При неожиданном результате полезен отчёт условий автоконфигурации.'
  category: Boot
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3e8eca2c-99d2-423a-85d3-46ad031aaa9c
  question: Что даёт starter-зависимость Spring Boot?
  answer: Starter объединяет типичный набор зависимостей для функции, например web
    или data-jpa, и помогает согласовать их версии через управление зависимостями
    Boot. Сам starter не заменяет понимания созданных бинов и их настроек.
  category: Boot
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1661a672-4e68-4283-bdc8-727e845184be
  question: Чем @ConfigurationProperties удобнее набора @Value для группы настроек?
  answer: Она связывает и валидирует связанные параметры как типизированный объект.
    Это делает структуру конфигурации видимой, облегчает тестирование и обработку
    ошибок запуска. @Value подходит для отдельных простых значений.
  category: Конфигурация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4a96954a-42ea-4e35-904b-ca8241836af7
  question: Для чего используются Spring profiles и почему они не должны заменять
    бизнес-правила?
  answer: Profiles включают разные наборы бинов или конфигурации для окружений и сценариев
    запуска. Если бизнес-поведение зависит от профиля, его сложнее тестировать и переносить
    между средами; предметные правила лучше выражать явно.
  category: Конфигурация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 77862b4c-543a-409f-82e8-517680b32686
  question: Что показывает Spring Boot Actuator и какие endpoints следует защищать?
  answer: Actuator предоставляет эксплуатационные endpoints, например health, metrics
    и info. Чувствительные endpoints могут раскрывать детали приложения или менять
    состояние, поэтому доступ к ним, состав и экспозицию нужно настраивать осознанно.
  category: Эксплуатация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 642ba775-6015-478f-8dfb-164cb0e31e2a
  question: Почему успешный запуск Spring Boot не гарантирует готовность сервиса принимать
    трафик?
  answer: После старта процесса сервис может ещё инициализировать зависимости, прогревать
    кэши или ждать доступности критичных компонентов. Готовность следует выражать
    отдельной проверкой readiness, отличая её от факта, что процесс жив.
  category: Эксплуатация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c0ce8f6a-7c03-4694-af6c-b04250264cc4
  question: Что делает BeanPostProcessor и почему он важен для Spring AOP?
  answer: Он позволяет изменять или оборачивать бин до и после инициализации. Механизмы
    вроде proxy-based AOP используют эту стадию для создания прокси. Поэтому объект,
    возвращаемый контейнером, может отличаться от первоначально созданного экземпляра.
  category: Жизненный цикл
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 16143a08-c271-477b-83d2-123a88f9b33e
  question: Что меняет @Lazy для Spring-бина?
  answer: Он откладывает создание бина до первого запроса, если это допускает контекст.
    Это может ускорить старт или разорвать некоторые сценарии раннего создания, но
    ошибки конфигурации проявятся позднее, уже во время работы.
  category: Жизненный цикл
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 83e97ffd-1743-44f2-8783-ec6c1539bd03
  question: Почему final-класс или final-метод может мешать class-based proxy?
  answer: Прокси на основе наследования должен создать подкласс и переопределить методы
    для перехвата. final запрещает это. Если выбран JDK proxy по интерфейсу, ограничения
    другие; нужно знать фактический тип прокси.
  category: AOP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: af32e18c-18fc-4e92-b92e-7bf361cde06d
  question: Когда уместно создавать собственный Spring Boot starter?
  answer: Когда несколько сервисов повторяют одну инфраструктурную настройку с согласованными
    зависимостями, свойствами и условным созданием бинов. Starter должен оставлять
    приложению возможность переопределить значения и не скрывать неожиданные побочные
    эффекты.
  category: Boot
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f7b87d32-db51-4c42-a1be-7bce85f490bb
  question: Зачем auto-configuration использует условие отсутствия пользовательского
    бина?
  answer: Так инфраструктура предоставляет значение по умолчанию, но отступает, когда
    приложение явно определило собственную реализацию. Это даёт расширяемость без
    ручного выключения всей автоконфигурации.
  category: Boot
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fd9a625b-3591-4728-a11b-648c959b96f6
  question: Почему секреты не стоит хранить в application.yml внутри репозитория?
  answer: Файл попадает в историю Git, сборочные артефакты и копии проекта. Секреты
    должны поступать через управляемую конфигурацию или хранилище секретов с доступом
    и ротацией. Ссылки на секреты тоже требуют осторожности в логах.
  category: Конфигурация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bc2c556f-3121-4e6c-abe7-c1ecb49128fa
  question: Выполняется ли обычный Spring ApplicationEvent listener асинхронно по
    умолчанию?
  answer: Обычно публикация события вызывает listener синхронно в потоке publisher,
    если не настроен отдельный механизм асинхронного выполнения. Поэтому медленный
    listener может задержать вызывающий код; для надёжной межсервисной доставки локальное
    событие не заменяет брокер.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5b26b7cc-aadc-44aa-927d-0ec90b3704fa
  question: Нужна ли @Autowired на единственном конструкторе Spring-бина?
  answer: В современных версиях Spring Framework единственный конструктор бина используется
    для внедрения зависимостей и без @Autowired. При нескольких конструкторах выбор
    требует явного правила; наличие зависимости всё равно должно проверяться контейнером.
  category: Внедрение зависимостей
