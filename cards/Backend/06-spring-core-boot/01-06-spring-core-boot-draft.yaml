topic: "Spring Core and Boot"
cards:
  - question: "Что означает Inversion of Control в Spring?"
    answer: "Созданием объектов и связыванием их зависимостей управляет контейнер, а не прикладной код вручную по всей программе. Это позволяет заменять реализации, централизовать конфигурацию и тестировать компоненты отдельно."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Чем dependency injection отличается от простого вызова new внутри сервиса?"
    answer: "При DI зависимость передаётся извне по контракту, а сервис не выбирает и не создаёт конкретную реализацию. Это снижает связность и делает требования сервиса явными. new уместен для локальных value object, которыми контейнеру управлять не нужно."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему constructor injection обычно предпочтительнее field injection?"
    answer: "Конструктор делает обязательные зависимости явными и позволяет создать валидный объект без рефлексивного внедрения. Такой класс проще тестировать и держать неизменяемым. Большое число параметров конструктора может также показать, что у класса слишком много обязанностей."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем @Component, @Service и @Repository различаются при регистрации бинов?"
    answer: "Все три помечают класс как кандидат для обнаружения компонентным сканированием. @Service выражает роль бизнес-сервиса, @Repository — слоя доступа к данным и участвует в переводе исключений доступа к данным при соответствующей настройке. Семантическая роль делает архитектуру понятнее."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем @Bean отличается от @Component?"
    answer: "@Component ставят на класс, который Spring обнаруживает при сканировании. @Bean ставят на фабричный метод конфигурации, возвращающий объект под управлением контейнера; это удобно для библиотечных классов, которые нельзя аннотировать."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает singleton scope в Spring?"
    answer: "Это один экземпляр конкретного определения бина на контейнер Spring, а не обязательно один объект на всю JVM. Несколько ApplicationContext могут иметь разные экземпляры; singleton-бин не становится автоматически потокобезопасным."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда нужен prototype scope и что важно знать о его жизненном цикле?"
    answer: "Контейнер создаёт новый экземпляр при каждом запросе prototype-бина. После создания Spring обычно не управляет его полным уничтожением так же, как singleton, поэтому очистка ресурсов остаётся ответственностью клиента или специальной инфраструктуры."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему внедрение prototype-бина в singleton через обычный конструктор не создаёт новый prototype при каждом вызове?"
    answer: "Зависимость разрешается при создании singleton и сохраняется в его поле. Для получения новых экземпляров по запросу используют ObjectProvider, фабрику или scoped proxy, если это действительно требуется."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как разрешить неоднозначность, когда для интерфейса найдено несколько бинов?"
    answer: "Можно указать @Qualifier для конкретной точки внедрения, назначить @Primary как выбор по умолчанию или внедрить коллекцию реализаций. Выбор должен отражать бизнес-смысл, а не зависеть от случайного порядка обнаружения."
    category: "Контейнер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "В какой момент выполняются @PostConstruct и @PreDestroy?"
    answer: "@PostConstruct вызывается после создания бина и внедрения зависимостей, перед обычным использованием. @PreDestroy вызывается при закрытии контейнера для управляемого бина. На prototype-бины стандартное автоматическое уничтожение не распространяется так же, как на singleton."
    category: "Жизненный цикл"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему циклическая зависимость между сервисами является сигналом проблемы дизайна?"
    answer: "Два сервиса требуют друг друга для создания, что усложняет инициализацию, тестирование и границы ответственности. Constructor injection делает цикл явным и обычно приводит к ошибке запуска. Часто помогает вынести общую ответственность в отдельный компонент."
    category: "Жизненный цикл"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему вызов аннотированного метода через this внутри того же Spring-бина может обойти @Transactional или @Async?"
    answer: "Типичная реализация Spring AOP применяет поведение через proxy. Внутренний вызов this.method не проходит через proxy и не запускает перехватчик. Нужно изменить границы компонентов или использовать явный механизм, подходящий задаче."
    category: "AOP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем JDK dynamic proxy отличается от class-based proxy в Spring?"
    answer: "JDK proxy реализует интерфейсы целевого объекта, а class-based proxy создаёт подкласс. Ограничения final-классов и final-методов важны для прокси на основе наследования. Конкретный выбор зависит от конфигурации Spring и формы целевого типа."
    category: "AOP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что включает @SpringBootApplication?"
    answer: "Это составная аннотация, объединяющая конфигурацию приложения, включение auto-configuration и component scan от пакета её размещения. Расположение главного класса влияет на то, какие компоненты будут обнаружены."
    category: "Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как Spring Boot auto-configuration решает, создавать ли инфраструктурный бин?"
    answer: "Конфигурации проверяют условия: наличие классов, свойств или уже определённых бинов. Они предоставляют значения по умолчанию, от которых можно отступить явной конфигурацией. При неожиданном результате полезен отчёт условий автоконфигурации."
    category: "Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что даёт starter-зависимость Spring Boot?"
    answer: "Starter объединяет типичный набор зависимостей для функции, например web или data-jpa, и помогает согласовать их версии через управление зависимостями Boot. Сам starter не заменяет понимания созданных бинов и их настроек."
    category: "Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем @ConfigurationProperties удобнее набора @Value для группы настроек?"
    answer: "Она связывает и валидирует связанные параметры как типизированный объект. Это делает структуру конфигурации видимой, облегчает тестирование и обработку ошибок запуска. @Value подходит для отдельных простых значений."
    category: "Конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Для чего используются Spring profiles и почему они не должны заменять бизнес-правила?"
    answer: "Profiles включают разные наборы бинов или конфигурации для окружений и сценариев запуска. Если бизнес-поведение зависит от профиля, его сложнее тестировать и переносить между средами; предметные правила лучше выражать явно."
    category: "Конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что показывает Spring Boot Actuator и какие endpoints следует защищать?"
    answer: "Actuator предоставляет эксплуатационные endpoints, например health, metrics и info. Чувствительные endpoints могут раскрывать детали приложения или менять состояние, поэтому доступ к ним, состав и экспозицию нужно настраивать осознанно."
    category: "Эксплуатация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему успешный запуск Spring Boot не гарантирует готовность сервиса принимать трафик?"
    answer: "После старта процесса сервис может ещё инициализировать зависимости, прогревать кэши или ждать доступности критичных компонентов. Готовность следует выражать отдельной проверкой readiness, отличая её от факта, что процесс жив."
    category: "Эксплуатация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

