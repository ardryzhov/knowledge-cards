topic: "Spring Core and Boot"
cards:
  - question: "Что делает BeanPostProcessor и почему он важен для Spring AOP?"
    answer: "Он позволяет изменять или оборачивать бин до и после инициализации. Механизмы вроде proxy-based AOP используют эту стадию для создания прокси. Поэтому объект, возвращаемый контейнером, может отличаться от первоначально созданного экземпляра."
    category: "Жизненный цикл"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что меняет @Lazy для Spring-бина?"
    answer: "Он откладывает создание бина до первого запроса, если это допускает контекст. Это может ускорить старт или разорвать некоторые сценарии раннего создания, но ошибки конфигурации проявятся позднее, уже во время работы."
    category: "Жизненный цикл"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему final-класс или final-метод может мешать class-based proxy?"
    answer: "Прокси на основе наследования должен создать подкласс и переопределить методы для перехвата. final запрещает это. Если выбран JDK proxy по интерфейсу, ограничения другие; нужно знать фактический тип прокси."
    category: "AOP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда уместно создавать собственный Spring Boot starter?"
    answer: "Когда несколько сервисов повторяют одну инфраструктурную настройку с согласованными зависимостями, свойствами и условным созданием бинов. Starter должен оставлять приложению возможность переопределить значения и не скрывать неожиданные побочные эффекты."
    category: "Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем auto-configuration использует условие отсутствия пользовательского бина?"
    answer: "Так инфраструктура предоставляет значение по умолчанию, но отступает, когда приложение явно определило собственную реализацию. Это даёт расширяемость без ручного выключения всей автоконфигурации."
    category: "Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему секреты не стоит хранить в application.yml внутри репозитория?"
    answer: "Файл попадает в историю Git, сборочные артефакты и копии проекта. Секреты должны поступать через управляемую конфигурацию или хранилище секретов с доступом и ротацией. Ссылки на секреты тоже требуют осторожности в логах."
    category: "Конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Выполняется ли обычный Spring ApplicationEvent listener асинхронно по умолчанию?"
    answer: "Обычно публикация события вызывает listener синхронно в потоке publisher, если не настроен отдельный механизм асинхронного выполнения. Поэтому медленный listener может задержать вызывающий код; для надёжной межсервисной доставки локальное событие не заменяет брокер."
    category: "События"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

