- id: 687acce4-62f3-4753-ab6f-e9231a0fe2df
  question: Зачем Idempotency-Key для POST, который может быть повторён клиентом?
  answer: При сетевом таймауте клиент не знает, выполнена ли команда, и повтор может
    создать дубль. Ключ позволяет серверу распознать повтор одной операции и вернуть
    согласованный результат. Нужно определить срок хранения и область уникальности
    ключа.
  category: Идемпотентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 291c29e2-6dbf-4ea7-ba52-b03fbbf20f7b
  question: Как ETag и If-Match помогают избежать потерянного обновления ресурса?
  answer: Сервер выдаёт версию представления в ETag. Клиент отправляет If-Match при
    изменении, а сервер отклоняет запрос, если версия уже изменилась. Это форма optimistic
    concurrency на HTTP-границе.
  category: Конкурентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fe5a304c-6572-4f0b-9619-a866fbd25903
  question: Почему у исходящего HTTP-вызова должен быть таймаут?
  answer: Без таймаута ожидание может удерживать поток, соединение и ресурсы сервиса
    неопределённо долго. Отдельно задают сроки соединения и ответа согласно общему
    бюджету операции. Таймаут должен сопровождаться понятной обработкой ошибки.
  category: Клиенты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ce062b02-82a6-4b5e-9865-fff3e54fbfaf
  question: Когда автоматический retry HTTP-вызова безопасен?
  answer: 'Когда операция идемпотентна либо сервер поддерживает ключ идемпотентности,
    а ошибка может быть временной. Повторять без ограничения и задержки нельзя: это
    усиливает перегрузку и может дублировать побочный эффект.'
  category: Клиенты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 61b247b6-a15d-49e9-a5b3-12435d5c5682
  question: Что такое content negotiation в Spring Web?
  answer: Клиент и сервер согласуют представление через заголовки вроде Accept и Content-Type.
    Сервер выбирает подходящий converter или сообщает, что формат не поддержан. Ошибки
    415 и 406 относятся к разным сторонам этого согласования.
  category: Контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 08dd4675-5cb1-4b88-9058-a0b8128e3aa9
  question: Почему API должен явно задавать кодировку и формат дат?
  answer: Клиенты могут использовать разные настройки среды. Явный JSON-контракт,
    согласованный формат дат и зон предотвращают неоднозначность и ошибки при обмене
    между сервисами.
  category: Контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 091296ae-b3fc-4f73-8e6c-e19986b5f22d
  question: Когда стоит версионировать API, а когда можно сделать совместимое расширение?
  answer: Добавление необязательного поля часто возможно без новой версии при устойчивых
    клиентах. Удаление поля, смена смысла или типа обычно требует миграции и иногда
    новой версии. Решение опирается на договорённость с потребителями.
  category: Версии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3415bd65-dd67-4bf2-a7e0-c587948aff93
  question: Что нужно логировать для диагностики одного HTTP-запроса без раскрытия
    секретов?
  answer: Идентификатор корреляции, маршрут, статус, длительность и безопасный контекст
    ошибки. Тело запроса, токены и персональные данные по умолчанию логировать нельзя.
    Метрики задержки и ошибок дополняют логи.
  category: Наблюдаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 34a6b5f7-a4c3-488f-9e8f-1ac5867116c9
  question: Чем @RequestParam, @PathVariable и @RequestBody различаются?
  answer: "@RequestParam связывает параметр запроса, @PathVariable — часть пути, @RequestBody
    — тело запроса через message converter. Выбор должен соответствовать API-контракту;
    валидация и обработка отсутствующих значений задаются отдельно."
  category: Spring MVC
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 63a38ccc-cc6a-4516-a106-884bb16d2373
  question: Чем @RestController отличается от @Controller?
  answer: "@RestController объединяет @Controller и семантику @ResponseBody для методов,
    обычно сериализуя возвращаемые значения в тело HTTP-ответа. @Controller часто
    используют для MVC-представлений; тело ответа можно включить отдельной @ResponseBody."
  category: Spring MVC
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a18bd6e0-14cb-4d11-b221-655609f550ae
  question: Чем @ControllerAdvice отличается от @ExceptionHandler внутри одного контроллера?
  answer: "@ExceptionHandler задаёт обработку исключения для локального контроллера
    или класса advice. @ControllerAdvice позволяет применять обработчики и другие
    настройки к нескольким контроллерам. Порядок и область действия нужно проверять
    при пересечении обработчиков."
  category: Spring MVC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fb0600e7-8115-4670-b891-aedcf3918bcb
  question: Чем 502, 503 и 504 отличаются при сбое зависимости?
  answer: 502 означает некорректный ответ upstream у посредника, 503 — временную недоступность
    сервиса, 504 — истечение времени ожидания upstream у шлюза. Приложение должно
    выбирать статус по своей роли и фактическому виду сбоя, а не все ошибки превращать
    в 500.
  category: HTTP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dd96801a-b284-4b1e-80f5-eaca1c09101e
  question: Почему нельзя полагаться на тело GET-запроса как на универсальный API-контракт?
  answer: Семантика тела GET не стандартизована для общего использования, а прокси
    и клиенты могут его игнорировать или обрабатывать по-разному. Для фильтров обычно
    применяют query-параметры, а для сложного поиска — явно описанный POST endpoint.
  category: Контракт
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0a7e8c94-d3e9-4add-9913-158e08212852
  question: Зачем пул соединений у HTTP-клиента сервиса?
  answer: Повторное использование соединений уменьшает стоимость установки TCP/TLS
    и нагрузку на систему. Пул должен иметь лимиты и таймауты ожидания; иначе зависшая
    внешняя система может исчерпать соединения и потоки.
  category: Клиенты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1d9172b9-adb2-4df4-96f0-50d812b92f76
  question: Когда gRPC может быть удобнее REST/JSON, и что усложняется?
  answer: gRPC с Protobuf удобен для типизированных внутренних контрактов, потоковой
    передачи и эффективного бинарного обмена. Он требует управления схемами, совместимости
    полей и поддержки инфраструктуры HTTP/2. Для публичных браузерных API REST/JSON
    часто проще.
  category: Контракт
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4b8a52b3-fbda-4842-809f-d45b4d1841c9
  question: Почему Bean Validation аннотаций на DTO может быть недостаточно для проверки
    всей операции?
  answer: Аннотации проверяют отдельные поля и некоторые структурные правила. Они
    не знают актуальное состояние БД, права пользователя и межполевые бизнес-инварианты
    без дополнительного кода. Такие проверки должны выполняться в нужной сервисной
    границе.
  category: Валидация
  context: 
