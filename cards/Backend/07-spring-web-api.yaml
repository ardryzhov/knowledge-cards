- id: b9ed82ee-aa7e-49d4-8986-3ecc3f2a5f20
  question: Чем безопасный HTTP-метод отличается от идемпотентного?
  answer: Безопасный метод по контракту не должен запрашивать изменение состояния,
    а идемпотентный даёт тот же эффект от повторения, что и от одного вызова. GET
    обычно безопасен и идемпотентен; PUT и DELETE идемпотентны по семантике, но не
    безопасны.
  category: HTTP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: db1e3a67-d999-4ba6-8e94-5a86a425014f
  question: Когда выбирать POST, PUT и PATCH для изменения ресурса?
  answer: POST обычно создаёт подчинённый ресурс или выполняет команду; PUT задаёт
    полное представление ресурса по известному URI и должен быть идемпотентным; PATCH
    описывает частичное изменение, идемпотентность которого зависит от формата и операции.
  category: HTTP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9bc21278-a7e2-43eb-a1e3-5a366bd9fa4b
  question: Чем 400, 401, 403, 404 и 409 отличаются для ответа API?
  answer: 400 — неверный запрос, 401 — требуется аутентификация, 403 — доступ запрещён
    при известных правах, 404 — ресурс не найден, 409 — конфликт с текущим состоянием.
    Точный код выбирают по контракту, не смешивая ошибки валидации и конфликт версий.
  category: HTTP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d8606077-826e-4e6e-a97a-76175b9b42d7
  question: Когда уместны ответы 201 Created и 204 No Content?
  answer: 201 сообщает об успешном создании ресурса и обычно сопровождается Location
    или представлением. 204 сообщает об успешной операции без тела ответа. Клиент
    не должен пытаться читать JSON из ответа 204.
  category: HTTP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e5dce8f5-efbd-4f47-a366-341e3da8757d
  question: Почему контроллеру лучше возвращать DTO, а не JPA-сущность напрямую?
  answer: DTO задаёт явный публичный контракт и не раскрывает внутреннюю модель хранения,
    lazy-связи или чувствительные поля. Изменение схемы БД тогда не обязательно ломает
    API. Отображение между сущностью и DTO остаётся явной частью приложения.
  category: Контракт
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a4eab88b-4803-428e-b557-485fbdb566ce
  question: Чем path parameter отличается от query parameter в REST API?
  answer: Path обычно идентифицирует ресурс или вложенную часть ресурса, а query задаёт
    параметры выборки, фильтрации и представления. Это соглашение повышает читаемость
    и помогает определить кеширование и маршрутизацию.
  category: Контракт
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 9b1b56e1-6f66-4448-875b-b6ca98b35d09
  question: Как проектировать пагинацию для списка, который растёт во время чтения?
  answer: Offset pagination проста, но вставки и удаления между страницами могут давать
    пропуски или дубли. Keyset/cursor pagination опирается на стабильный порядок и
    последний увиденный ключ; она часто лучше для больших изменяемых наборов.
  category: Контракт
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 41a1c0f5-4bb3-4d4d-9070-cdc2c60cb05e
  question: Почему изменение типа поля или удаление поля в JSON API может сломать
    клиентов?
  answer: Клиенты компилируют ожидания о формате и значениях. Даже если сервер продолжает
    отвечать 200, несовместимое изменение может вызвать ошибку десериализации или
    неверную логику. Контракт меняют с учётом версий и периода миграции.
  category: Контракт
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c86bba49-7cc9-41bf-a3c3-a5daeb49988b
  question: Где должна выполняться валидация входного DTO, а где — проверка бизнес-инварианта?
  answer: Синтаксические и структурные ограничения DTO удобно проверять на границе
    API. Бизнес-инварианты должны проверяться в доменном или сервисном слое независимо
    от способа вызова, чтобы их нельзя было обойти через очередь или внутренний API.
  category: Валидация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 16262c3a-3cd0-4c36-8e56-ed3cf0d4e596
  question: Зачем централизовать преобразование исключений в HTTP-ответы?
  answer: Единый обработчик задаёт стабильный формат ошибок, статус-коды и безопасное
    раскрытие деталей. Это уменьшает дублирование в контроллерах. Не следует возвращать
    клиенту stack trace и внутренние секреты.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9fc94935-407d-429d-9a9c-bb1791d46996
  question: Что должен содержать полезный ответ об ошибке API?
  answer: Стабильный код или тип ошибки, понятное сообщение, при необходимости детали
    полей и идентификатор запроса для диагностики. Формат должен быть частью контракта;
    текст сообщения не стоит использовать как машинный идентификатор.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
