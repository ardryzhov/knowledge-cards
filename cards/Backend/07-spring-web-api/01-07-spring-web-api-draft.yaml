topic: "Spring Web and API"
cards:
  - question: "Чем безопасный HTTP-метод отличается от идемпотентного?"
    answer: "Безопасный метод по контракту не должен запрашивать изменение состояния, а идемпотентный даёт тот же эффект от повторения, что и от одного вызова. GET обычно безопасен и идемпотентен; PUT и DELETE идемпотентны по семантике, но не безопасны."
    category: "HTTP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда выбирать POST, PUT и PATCH для изменения ресурса?"
    answer: "POST обычно создаёт подчинённый ресурс или выполняет команду; PUT задаёт полное представление ресурса по известному URI и должен быть идемпотентным; PATCH описывает частичное изменение, идемпотентность которого зависит от формата и операции."
    category: "HTTP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем 400, 401, 403, 404 и 409 отличаются для ответа API?"
    answer: "400 — неверный запрос, 401 — требуется аутентификация, 403 — доступ запрещён при известных правах, 404 — ресурс не найден, 409 — конфликт с текущим состоянием. Точный код выбирают по контракту, не смешивая ошибки валидации и конфликт версий."
    category: "HTTP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда уместны ответы 201 Created и 204 No Content?"
    answer: "201 сообщает об успешном создании ресурса и обычно сопровождается Location или представлением. 204 сообщает об успешной операции без тела ответа. Клиент не должен пытаться читать JSON из ответа 204."
    category: "HTTP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему контроллеру лучше возвращать DTO, а не JPA-сущность напрямую?"
    answer: "DTO задаёт явный публичный контракт и не раскрывает внутреннюю модель хранения, lazy-связи или чувствительные поля. Изменение схемы БД тогда не обязательно ломает API. Отображение между сущностью и DTO остаётся явной частью приложения."
    category: "Контракт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем path parameter отличается от query parameter в REST API?"
    answer: "Path обычно идентифицирует ресурс или вложенную часть ресурса, а query задаёт параметры выборки, фильтрации и представления. Это соглашение повышает читаемость и помогает определить кеширование и маршрутизацию."
    category: "Контракт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Как проектировать пагинацию для списка, который растёт во время чтения?"
    answer: "Offset pagination проста, но вставки и удаления между страницами могут давать пропуски или дубли. Keyset/cursor pagination опирается на стабильный порядок и последний увиденный ключ; она часто лучше для больших изменяемых наборов."
    category: "Контракт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Почему изменение типа поля или удаление поля в JSON API может сломать клиентов?"
    answer: "Клиенты компилируют ожидания о формате и значениях. Даже если сервер продолжает отвечать 200, несовместимое изменение может вызвать ошибку десериализации или неверную логику. Контракт меняют с учётом версий и периода миграции."
    category: "Контракт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Где должна выполняться валидация входного DTO, а где — проверка бизнес-инварианта?"
    answer: "Синтаксические и структурные ограничения DTO удобно проверять на границе API. Бизнес-инварианты должны проверяться в доменном или сервисном слое независимо от способа вызова, чтобы их нельзя было обойти через очередь или внутренний API."
    category: "Валидация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем централизовать преобразование исключений в HTTP-ответы?"
    answer: "Единый обработчик задаёт стабильный формат ошибок, статус-коды и безопасное раскрытие деталей. Это уменьшает дублирование в контроллерах. Не следует возвращать клиенту stack trace и внутренние секреты."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что должен содержать полезный ответ об ошибке API?"
    answer: "Стабильный код или тип ошибки, понятное сообщение, при необходимости детали полей и идентификатор запроса для диагностики. Формат должен быть частью контракта; текст сообщения не стоит использовать как машинный идентификатор."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем Idempotency-Key для POST, который может быть повторён клиентом?"
    answer: "При сетевом таймауте клиент не знает, выполнена ли команда, и повтор может создать дубль. Ключ позволяет серверу распознать повтор одной операции и вернуть согласованный результат. Нужно определить срок хранения и область уникальности ключа."
    category: "Идемпотентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как ETag и If-Match помогают избежать потерянного обновления ресурса?"
    answer: "Сервер выдаёт версию представления в ETag. Клиент отправляет If-Match при изменении, а сервер отклоняет запрос, если версия уже изменилась. Это форма optimistic concurrency на HTTP-границе."
    category: "Конкурентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему у исходящего HTTP-вызова должен быть таймаут?"
    answer: "Без таймаута ожидание может удерживать поток, соединение и ресурсы сервиса неопределённо долго. Отдельно задают сроки соединения и ответа согласно общему бюджету операции. Таймаут должен сопровождаться понятной обработкой ошибки."
    category: "Клиенты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда автоматический retry HTTP-вызова безопасен?"
    answer: "Когда операция идемпотентна либо сервер поддерживает ключ идемпотентности, а ошибка может быть временной. Повторять без ограничения и задержки нельзя: это усиливает перегрузку и может дублировать побочный эффект."
    category: "Клиенты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое content negotiation в Spring Web?"
    answer: "Клиент и сервер согласуют представление через заголовки вроде Accept и Content-Type. Сервер выбирает подходящий converter или сообщает, что формат не поддержан. Ошибки 415 и 406 относятся к разным сторонам этого согласования."
    category: "Контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему API должен явно задавать кодировку и формат дат?"
    answer: "Клиенты могут использовать разные настройки среды. Явный JSON-контракт, согласованный формат дат и зон предотвращают неоднозначность и ошибки при обмене между сервисами."
    category: "Контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда стоит версионировать API, а когда можно сделать совместимое расширение?"
    answer: "Добавление необязательного поля часто возможно без новой версии при устойчивых клиентах. Удаление поля, смена смысла или типа обычно требует миграции и иногда новой версии. Решение опирается на договорённость с потребителями."
    category: "Версии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что нужно логировать для диагностики одного HTTP-запроса без раскрытия секретов?"
    answer: "Идентификатор корреляции, маршрут, статус, длительность и безопасный контекст ошибки. Тело запроса, токены и персональные данные по умолчанию логировать нельзя. Метрики задержки и ошибок дополняют логи."
    category: "Наблюдаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем @RequestParam, @PathVariable и @RequestBody различаются?"
    answer: "@RequestParam связывает параметр запроса, @PathVariable — часть пути, @RequestBody — тело запроса через message converter. Выбор должен соответствовать API-контракту; валидация и обработка отсутствующих значений задаются отдельно."
    category: "Spring MVC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

