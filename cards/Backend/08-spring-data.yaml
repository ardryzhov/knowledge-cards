- id: da98b33c-893e-4020-98b4-a55f19c4591e
  question: Когда работает optimistic locking с @Version?
  answer: При обновлении ORM проверяет версию строки и повышает её. Если другой участник
    уже изменил запись, обновление затронет ноль строк и возникает конфликт оптимистической
    блокировки. Клиент должен решить, повторять ли всю операцию или показать конфликт.
  category: Транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 103a0433-fd92-46be-a39d-f85cd6a3db81
  question: Когда выбирать pessimistic locking и какой у него риск?
  answer: Когда конфликт вероятен и нужно удержать блокировку строки до завершения
    операции. Это снижает риск одновременных изменений, но увеличивает ожидание, риск
    deadlock и нагрузку. Решение зависит от частоты конфликтов и длительности транзакции.
  category: Транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4c019864-788f-4100-bf12-e1f4c4d4f478
  question: Почему bulk update через JPQL может оставить managed-сущности устаревшими?
  answer: Bulk-операция выполняется напрямую в БД и обходит обычный dirty checking
    объектов в persistence context. Уже загруженные сущности могут содержать старые
    значения. После такой операции контекст при необходимости очищают или обновляют
    явно.
  category: Запросы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2cf3e5fa-1e6d-4267-bef1-179a25308194
  question: Когда DTO-проекция полезнее загрузки полной сущности?
  answer: Для чтения небольшого набора полей, особенно списков и отчётов, проекция
    уменьшает объём данных и избегает ненужного графа связей. Для изменения доменного
    состояния обычно удобнее управляемая сущность с проверкой инвариантов.
  category: Запросы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 59ccbbcd-d4a2-456d-98e5-ad66b9599a9b
  question: Почему пагинация с fetch join коллекции может работать плохо?
  answer: JOIN размножает строки родителя по числу дочерних элементов, поэтому ограничение
    строк SQL не равно ограничению числа сущностей. ORM может применить пагинацию
    в памяти или выдать некорректный результат; часто нужен двухэтапный запрос.
  category: Запросы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 9215aafb-c392-4e84-a48c-2d996553c936
  question: Почему equals/hashCode для JPA-сущности требуют осторожности?
  answer: Идентификатор может появиться только после сохранения, а proxy может менять
    видимый runtime-класс. Если хеш сущности меняется после помещения в Set, коллекция
    работает неверно. Стратегию равенства выбирают по жизненному циклу и бизнес-идентичности.
  category: Сущности
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7d98f105-ce6c-414d-aeb4-b3dbc7a731af
  question: Чем getReference отличается от find?
  answer: getReference может вернуть ссылку-proxy без немедленной загрузки данных,
    если реализация это поддерживает; обращение к полям позже может потребовать SQL
    и завершиться ошибкой, если строки нет. find получает сущность или null в рамках
    обычного поиска.
  category: Сущности
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8448f08f-3046-4033-ad5a-a728b0f3e88f
  question: Почему derived query по имени метода подходит не для любого запроса?
  answer: Для простого поиска он экономит код, но сложное имя становится трудным для
    чтения и контроля SQL. Для сложной фильтрации, агрегации или оптимизации лучше
    явный JPQL, SQL, Specification или отдельный query layer.
  category: Spring Data
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 456bc405-18b6-4218-a04a-a4eb1e4a6797
  question: Почему изменение JPA-сущности само по себе не является безопасной миграцией
    схемы БД?
  answer: Существующие данные, индексы и параллельно работающие версии приложения
    требуют явного плана изменения схемы. Миграции фиксируют порядок и воспроизводимость
    DDL; на проде автогенерацию схемы обычно не используют как основной механизм выпуска.
  category: Миграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ede2563c-401a-4c28-b89e-5e561a871330
  question: Чем first-level cache JPA отличается от second-level cache Hibernate?
  answer: First-level cache принадлежит конкретному persistence context и всегда участвует
    в работе управляемых сущностей. Second-level cache, если включён, может разделяться
    между сессиями и требует политики инвалидирования. Первый не заменяет оптимизацию
    SQL, а второй не включается магически для всего.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 837ce9c1-d8e6-4f32-a22a-c69ab0e1489b
  question: Что может скрывать Open Session in View?
  answer: Он держит persistence context открытым на время web-запроса, позволяя лениво
    догружать связи при сериализации ответа. Это может породить неожиданные запросы
    вне сервисной транзакции и скрыть N+1; нужные данные лучше выбирать явно.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: efa460e4-ca16-444b-83a9-38e4bd9d4a65
  question: Чем save отличается от saveAndFlush в Spring Data JPA?
  answer: save сохраняет или объединяет сущность в контексте, а SQL может выполниться
    позже при flush. saveAndFlush дополнительно вызывает flush до возврата. Ни одна
    операция сама по себе не означает commit внешней транзакции.
  category: Spring Data
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1f752884-a7e0-4b8e-80fd-779fa5859fee
  question: Почему SQL, выполняемый при обращении к LAZY-связи, может возникнуть уже
    после завершения метода repository?
  answer: Репозиторий возвращает сущность с незагруженной связью. Фактический SQL
    запускается при доступе к этой связи, если persistence context ещё открыт. Это
    делает количество запросов зависимым от дальнейшего кода, а не только от метода
    repository.
  category: Запросы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: af068c7a-e60a-4b1b-8f4e-160945b9b483
  question: Как проверить проблему N+1 в конкретном JPA-запросе?
  answer: Запустить типовой сценарий с несколькими родительскими сущностями и посмотреть
    фактическое число SQL-запросов или метрики ORM. Один тест с единственным объектом
    не обнаружит роста N+1; после исправления нужно проверить форму запроса и объём
    строк.
  category: Запросы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fdf446a1-1bc0-4f0f-b072-8e40a1f24fd4
  question: Почему миграция схемы и деплой новой версии приложения иногда требуют
    двух этапов?
  answer: Пока старая и новая версии работают одновременно, резкое удаление или переименование
    столбца ломает одну из них. Сначала делают совместимое расширение схемы, затем
    переводят код и данные, после чего удаляют старое поле отдельным релизом.
  category: Миграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 005d22c9-e4e0-43f0-93e5-cb073d59315b
  question: Как стратегия генерации ID может влиять на пакетную вставку JPA?
  answer: Некоторые стратегии требуют получить ID сразу после каждой вставки, что
    ограничивает возможность JDBC batching. Последовательности позволяют выделять
    ID заранее и лучше группировать INSERT; выбор зависит от СУБД, ORM и требований
    к идентификаторам.
  category: Сущности
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c7ce7a08-4716-45af-816b-6bd72e8d9f9a
  question: Когда optimistic locking с @Version обнаружит конфликт?
  answer: Обычно при flush или commit, когда UPDATE с ожидаемой версией не затронет
    строку. Поэтому метод save может вернуть управление до появления исключения, если
    SQL отложен. Клиент должен обрабатывать конфликт на границе всей операции.
  category: Транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
