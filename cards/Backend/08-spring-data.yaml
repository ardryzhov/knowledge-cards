- id: cfd8f74d-0168-4c52-9db4-f6e77d384e9b
  question: Что такое persistence context?
  answer: Это область управления сущностями, в которой EntityManager отслеживает их
    идентичность и изменения. В рамках одного контекста повторное получение одной
    сущности обычно возвращает тот же управляемый объект. Контекст не равен глобальному
    кэшу приложения.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 37544758-0ac6-430a-bb42-7dea0c3479a4
  question: Чем transient, managed, detached и removed состояния сущности различаются?
  answer: Transient ещё не управляется контекстом; managed отслеживается и может синхронизироваться
    с БД; detached существовала в контексте, но больше не отслеживается; removed помечена
    на удаление. Операции persist, merge и remove меняют эти состояния.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: cecf25e2-9fa4-4864-823a-d1075227bd09
  question: Как работает dirty checking у managed-сущности?
  answer: ORM сравнивает отслеживаемое состояние сущности и при flush формирует SQL
    для изменённых данных. Явный save не всегда нужен для managed-сущности в транзакции.
    На detached-объекте автоматическое отслеживание не работает.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b6c8d848-2daa-433f-8e46-9066146273fe
  question: Чем flush отличается от commit?
  answer: flush синхронизирует изменения persistence context с БД внутри транзакции,
    но не делает транзакцию окончательно зафиксированной. Commit завершает транзакцию
    и делает изменения видимыми согласно изоляции. После flush всё ещё возможен rollback.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 17e2eedc-9485-4af9-9688-b686648a1edd
  question: Чем persist отличается от merge?
  answer: persist делает новый объект управляемым в текущем контексте. merge копирует
    состояние переданного объекта в управляемый экземпляр и возвращает его; исходный
    объект не становится автоматически managed. Использование merge без понимания
    состояния может перезаписать данные.
  category: ORM
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0e0f82ed-e641-440d-80fe-34907d764a6b
  question: Почему LAZY-связь может вызвать LazyInitializationException?
  answer: Доступ к не загруженной связи требует действующего persistence context.
    Если контекст закрыт, ORM не может догрузить данные. Решают это выборкой нужных
    данных внутри границы операции, DTO-проекцией или явной fetch-стратегией, а не
    бесконтрольным расширением транзакции.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e5f510c9-fa3d-4ca5-8031-47b9954c5a9c
  question: Что такое проблема N+1 запросов?
  answer: После одного запроса за списком сущностей обращение к связи каждой из них
    запускает ещё по запросу, создавая N дополнительных обращений к БД. Нужно измерить
    SQL и выбрать подходящий fetch join, entity graph, batch fetching или проекцию.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8aa5d745-376b-4d37-841d-f6a07fc4b328
  question: Почему EAGER не является универсальным решением N+1?
  answer: EAGER требует загрузки связи, но не гарантирует один SQL-запрос и может
    загрузить лишние данные. Для конкретного сценария лучше задавать форму выборки
    явно и проверять фактические запросы.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c520faf4-0475-442f-a540-c9ef31f41283
  question: Чем CascadeType.REMOVE отличается от orphanRemoval?
  answer: REMOVE распространяет удаление родителя на связанные сущности при соответствующей
    операции. orphanRemoval удаляет дочернюю сущность, когда она исключена из отношения
    владения. Неправильная настройка может удалить данные неожиданно.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4eb30dbf-f063-47e1-a1d0-69b1999d7854
  question: Почему двустороннюю связь JPA нужно поддерживать согласованно с обеих
    сторон в памяти?
  answer: Одна сторона владеет внешним ключом, но прикладной код видит оба направления.
    Если обновить только одну коллекцию или ссылку, граф объектов до flush может быть
    противоречивым, а SQL — не соответствовать ожиданиям. Помогают методы связи add/remove.
  category: Связи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
