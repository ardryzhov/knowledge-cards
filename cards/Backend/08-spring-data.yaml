- id: 027df2ac-e837-47fa-b935-91c4f4feef4e
  question: Чем JPA отличается от Hibernate и Spring Data JPA?
  answer: JPA задаёт спецификацию ORM, Hibernate является одной из её реализаций,
    а Spring Data JPA добавляет репозитории и удобный слой доступа поверх JPA. Их
    возможности и поведение нельзя считать полностью одинаковыми.
  category: ORM
  context: 
