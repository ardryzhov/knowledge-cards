topic: "Spring Data and JPA"
cards:
  - question: "Чем first-level cache JPA отличается от second-level cache Hibernate?"
    answer: "First-level cache принадлежит конкретному persistence context и всегда участвует в работе управляемых сущностей. Second-level cache, если включён, может разделяться между сессиями и требует политики инвалидирования. Первый не заменяет оптимизацию SQL, а второй не включается магически для всего."
    category: "ORM"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что может скрывать Open Session in View?"
    answer: "Он держит persistence context открытым на время web-запроса, позволяя лениво догружать связи при сериализации ответа. Это может породить неожиданные запросы вне сервисной транзакции и скрыть N+1; нужные данные лучше выбирать явно."
    category: "ORM"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем save отличается от saveAndFlush в Spring Data JPA?"
    answer: "save сохраняет или объединяет сущность в контексте, а SQL может выполниться позже при flush. saveAndFlush дополнительно вызывает flush до возврата. Ни одна операция сама по себе не означает commit внешней транзакции."
    category: "Spring Data"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему SQL, выполняемый при обращении к LAZY-связи, может возникнуть уже после завершения метода repository?"
    answer: "Репозиторий возвращает сущность с незагруженной связью. Фактический SQL запускается при доступе к этой связи, если persistence context ещё открыт. Это делает количество запросов зависимым от дальнейшего кода, а не только от метода repository."
    category: "Запросы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как проверить проблему N+1 в конкретном JPA-запросе?"
    answer: "Запустить типовой сценарий с несколькими родительскими сущностями и посмотреть фактическое число SQL-запросов или метрики ORM. Один тест с единственным объектом не обнаружит роста N+1; после исправления нужно проверить форму запроса и объём строк."
    category: "Запросы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему миграция схемы и деплой новой версии приложения иногда требуют двух этапов?"
    answer: "Пока старая и новая версии работают одновременно, резкое удаление или переименование столбца ломает одну из них. Сначала делают совместимое расширение схемы, затем переводят код и данные, после чего удаляют старое поле отдельным релизом."
    category: "Миграции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как стратегия генерации ID может влиять на пакетную вставку JPA?"
    answer: "Некоторые стратегии требуют получить ID сразу после каждой вставки, что ограничивает возможность JDBC batching. Последовательности позволяют выделять ID заранее и лучше группировать INSERT; выбор зависит от СУБД, ORM и требований к идентификаторам."
    category: "Сущности"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Когда optimistic locking с @Version обнаружит конфликт?"
    answer: "Обычно при flush или commit, когда UPDATE с ожидаемой версией не затронет строку. Поэтому метод save может вернуть управление до появления исключения, если SQL отложен. Клиент должен обрабатывать конфликт на границе всей операции."
    category: "Транзакции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

