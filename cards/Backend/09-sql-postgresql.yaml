- id: db0886df-951f-4f47-9b5b-a607f44b1a3c
  question: Когда условие нужно размещать в ON, а когда в WHERE при LEFT JOIN?
  answer: Условие в ON определяет, какие строки правой таблицы совпадают, сохраняя
    строки левой. Условие в WHERE фильтрует уже соединённый результат и может исключить
    строки без совпадения. Место условия меняет семантику запроса.
  category: SQL
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ab0f6aaa-d6c5-481f-b597-98112995024b
  question: Чем WHERE отличается от HAVING?
  answer: WHERE фильтрует исходные строки до группировки, а HAVING фильтрует группы
    после GROUP BY и агрегации. Если условие относится к отдельным строкам, его обычно
    лучше применить в WHERE раньше.
  category: SQL
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 1004c95b-12cc-446b-9300-aa2c4201ea88
  question: Почему SELECT с GROUP BY нельзя свободно возвращать любой неагрегированный
    столбец?
  answer: Для каждой группы должно быть определено одно значение столбца. PostgreSQL
    требует включить его в GROUP BY, агрегировать или использовать допустимую функциональную
    зависимость. Иначе результат был бы неоднозначным.
  category: SQL
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0faefc53-a325-4da4-b8e2-2c57b4608ed3
  question: Когда оконная функция удобнее GROUP BY?
  answer: Оконная функция вычисляет агрегат или ранг по набору строк, не сворачивая
    результат в одну строку на группу. Она удобна для нумерации, накопительных сумм
    и выбора последней записи в группе вместе с её полями.
  category: SQL
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
