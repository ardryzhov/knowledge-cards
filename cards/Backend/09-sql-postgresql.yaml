- id: 9bd0256a-2102-4fd3-b49c-f3ba9f99808f
  question: Как B-tree индекс помогает запросу и почему он не всегда используется?
  answer: B-tree упорядочивает ключи и ускоряет поиск и диапазоны по подходящим условиям.
    Планировщик может выбрать последовательное чтение, если таблица мала, условие
    выбирает большую долю строк или статистика показывает низкую выгоду индекса.
  category: Индексы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f60f3cf6-c610-4e82-9c47-26880ea82c9b
  question: Почему порядок столбцов в составном индексе важен?
  answer: B-tree индекс упорядочен сначала по первому столбцу, затем по следующим.
    Условия по ведущим столбцам обычно позволяют сузить диапазон эффективнее; выбор
    порядка зависит от реальных фильтров, сортировки и селективности.
  category: Индексы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5d268e10-8df4-42c7-a5a0-b0736359d8aa
  question: Когда частичный индекс полезен?
  answer: Он индексирует только строки, удовлетворяющие предикату, например активные
    записи. Это уменьшает размер и стоимость обновления по сравнению с полным индексом,
    если запросы часто используют совместимый предикат.
  category: Индексы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f0265890-7acd-4141-b55a-a2eaa4dd777f
  question: Почему дополнительный индекс может замедлить запись?
  answer: При INSERT, UPDATE и DELETE СУБД должна поддерживать соответствующие записи
    в индексах. Индексы занимают память и место на диске. Польза для чтения должна
    оправдывать эту стоимость.
  category: Индексы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eaacc403-c028-4779-a1b2-f7429ad45357
  question: Что показывает EXPLAIN ANALYZE и чем он отличается от EXPLAIN?
  answer: EXPLAIN показывает оценённый план без выполнения запроса. EXPLAIN ANALYZE
    выполняет запрос и добавляет фактические времена и числа строк; для изменяющих
    запросов это может изменить данные, поэтому запуск требует осторожности и часто
    транзакции с откатом.
  category: Планы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b8988b6a-0c09-4558-b9ee-023b8a45d723
  question: Почему большая разница между estimated rows и actual rows важна при анализе
    плана?
  answer: Планировщик выбирает операции по оценкам числа строк. Сильная ошибка оценки
    может привести к неудачному join или сканированию. Нужно проверить статистику,
    распределение данных и форму предикатов.
  category: Планы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
