- id: 7b854237-614d-4808-9677-4eb836ea4851
  question: Что означает MVCC в PostgreSQL?
  answer: Многоверсионность хранит версии строк так, чтобы транзакции читали согласованные
    снимки данных. Обычное чтение обычно не блокирует запись и наоборот, но обновления
    конфликтующих строк всё равно требуют координации.
  category: MVCC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 37c005f0-ea31-430e-ae42-380f5555cc90
  question: Зачем PostgreSQL нужен VACUUM?
  answer: Обновления и удаления оставляют версии строк, которые больше не нужны активным
    снимкам. VACUUM освобождает место для повторного использования и помогает предотвращать
    проблемы с возрастом transaction ID. Без него таблицы и индексы могут разрастаться.
  category: MVCC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f86118f4-8e90-4e10-9b7d-5c3ff6c783f7
  question: Почему UNIQUE не заменяет бизнес-проверку и что происходит с NULL в PostgreSQL?
  answer: UNIQUE надёжно защищает от конкурентных дублей на уровне БД, но приложение
    всё равно должно сообщить понятную ошибку пользователю. По умолчанию PostgreSQL
    считает NULL-значения различными для обычного UNIQUE; при иной семантике нужна
    специальная схема или NULLS NOT DISTINCT.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 519c49c8-0708-4451-ac4f-cb1d47244e84
  question: Зачем нужны FOREIGN KEY, если связи уже проверяет Java-код?
  answer: Внешний ключ защищает целостность для всех клиентов БД и при конкурентных
    изменениях, которые приложение может не предусмотреть. Он также влияет на операции
    удаления и обновления; нужно выбрать подходящие правила и индексы.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6b519412-a547-4e10-a16f-446cfcfa30d8
  question: Что делает SELECT ... FOR UPDATE?
  answer: Он блокирует выбранные строки для конкурирующих изменений до завершения
    транзакции. Это полезно для согласованного изменения данных, но повышает ожидание
    и риск deadlock; блокировка должна быть частью короткой операции.
  category: Конкурентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 25d5bc33-fc1a-40cb-bcae-bbc641e003e9
  question: Почему два UPDATE разных строк могут привести к deadlock?
  answer: Если транзакции захватывают одни и те же строки в разном порядке, каждая
    может удерживать строку, нужную другой. PostgreSQL обнаружит цикл ожидания и прервёт
    одну транзакцию; единый порядок захвата снижает риск.
  category: Конкурентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f87df8d8-7e82-4218-a045-cd1c00ce56f2
  question: Когда использовать INSERT ... ON CONFLICT?
  answer: 'Для атомарной обработки конфликта уникального ограничения: выполнить DO
    NOTHING или DO UPDATE. Это надёжнее схемы сначала SELECT, потом INSERT при конкуренции.
    Нужно явно определить, какое ограничение задаёт конфликт и допустимо ли обновление.'
  category: Запись
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 359762ff-5471-4d27-8acc-57aeda759f03
  question: Почему большой OFFSET ухудшает пагинацию PostgreSQL?
  answer: СУБД должна пройти или отсортировать пропускаемые строки до выдачи следующей
    страницы, поэтому стоимость растёт. Keyset pagination по стабильному ключу может
    быть эффективнее и устойчивее к вставкам между запросами.
  category: Масштабирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7bdbd636-f1ca-4dd7-8d2b-c944cc075f97
  question: Почему нормализация таблиц уменьшает риск аномалий при изменении данных?
  answer: Функционально зависимые данные хранятся в одном определённом месте, поэтому
    изменение значения не требует согласованного обновления многих строк. Денормализацию
    вводят осознанно ради чтения, учитывая цену поддержания согласованности.
  category: Схема данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 97aa1067-b56d-4fd5-8013-3fae1efbe75e
  question: Что добавляет EXPLAIN (ANALYZE, BUFFERS) к обычному плану запроса?
  answer: ANALYZE выполняет запрос и показывает фактическое время и число строк; BUFFERS
    показывает обращения к страницам из кэша и с диска. Это помогает отличить ошибку
    оценки планировщика от затрат на чтение. Для изменяющих запросов выполнение меняет
    данные, поэтому их анализируют осторожно, например в транзакции с откатом.
  category: Планы запросов
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 65ebaeb6-5a63-4af6-a651-7d6a1ce6603d
  question: Почему Index Only Scan всё равно иногда обращается к таблице?
  answer: Индекс содержит нужные столбцы, но PostgreSQL должен проверить видимость
    версии строки по MVCC. Если страница таблицы не помечена all-visible в visibility
    map, требуется heap fetch; VACUUM обновляет эту карту.
  category: Индексы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 840ec1f4-62fa-4ea1-86f9-78b71e0f511d
  question: В каких случаях GIN индекс для jsonb полезнее обычного B-tree?
  answer: GIN индексирует элементы и структуры jsonb и полезен для поддерживаемых
    операторов поиска по содержимому, например containment @>. B-tree больше подходит
    для сравнения значения целиком; для частого поиска по одному извлекаемому полю
    может быть лучше expression index.
  category: Индексы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bd05e90d-e13e-46c6-be74-2c15043c8bfc
  question: Почему долгая транзакция может привести к росту таблиц и ухудшению работы
    VACUUM?
  answer: 'Старая транзакция удерживает горизонт видимости: VACUUM не может удалить
    версии строк, которые потенциально ещё нужны её снимку. Мёртвые версии накапливаются,
    растут таблицы и индексы.'
  category: MVCC и обслуживание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fd5ce9ed-2b3e-4b4e-835f-7486da975f54
  question: Когда EXISTS обычно удобнее JOIN для проверки наличия связанных строк?
  answer: 'EXISTS выражает полусоединение: достаточно найти хотя бы одну подходящую
    строку, а результат не размножается из-за нескольких совпадений. JOIN нужен, когда
    требуются столбцы связанных строк или их множественность.'
  category: SQL запросы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 16c4bb28-78cc-4971-a852-3024ff044107
  question: Почему пул соединений может ускорить приложение, но слишком большой пул
    ухудшить PostgreSQL?
  answer: Пул повторно использует дорогие соединения и ограничивает конкуренцию. Чрезмерное
    число одновременных соединений увеличивает расходы памяти, переключения контекста
    и конкуренцию за ресурсы БД; размер выбирают по измерениям и лимитам.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0ad5f2c5-466c-42a1-9198-294d8ca8b068
  question: Почему CREATE INDEX CONCURRENTLY удобен для большой таблицы под нагрузкой
    и какое у него ограничение?
  answer: Он не блокирует обычные INSERT, UPDATE и DELETE на всё время построения,
    в отличие от обычного CREATE INDEX. Операция занимает больше времени и ресурсов
    и не выполняется внутри явного транзакционного блока.
  category: Миграции
