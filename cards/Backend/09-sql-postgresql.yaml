- id: a1413432-4ebc-4efe-b107-b93edcf63d7e
  question: Чем INNER JOIN отличается от LEFT JOIN?
  answer: INNER JOIN возвращает только строки с совпадением по условию соединения.
    LEFT JOIN сохраняет все строки левой таблицы, подставляя NULL в поля правой при
    отсутствии совпадения. Условия в WHERE могут случайно убрать такие строки и превратить
    результат в аналог INNER JOIN.
  category: SQL
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eec15aac-d04b-4e0e-bc93-8c565f09f7dc
  question: Почему сравнение с NULL через = или != не работает как с обычным значением?
  answer: NULL означает неизвестное или отсутствующее значение; сравнения с ним дают
    UNKNOWN в трёхзначной логике SQL. Для проверки используют IS NULL или IS NOT NULL.
    В WHERE остаются только строки, для которых условие TRUE.
  category: SQL
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
