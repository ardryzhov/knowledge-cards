topic: "SQL and PostgreSQL"
cards:
  - question: "Чем INNER JOIN отличается от LEFT JOIN?"
    answer: "INNER JOIN возвращает только строки с совпадением по условию соединения. LEFT JOIN сохраняет все строки левой таблицы, подставляя NULL в поля правой при отсутствии совпадения. Условия в WHERE могут случайно убрать такие строки и превратить результат в аналог INNER JOIN."
    category: "SQL"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему сравнение с NULL через = или != не работает как с обычным значением?"
    answer: "NULL означает неизвестное или отсутствующее значение; сравнения с ним дают UNKNOWN в трёхзначной логике SQL. Для проверки используют IS NULL или IS NOT NULL. В WHERE остаются только строки, для которых условие TRUE."
    category: "SQL"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Когда условие нужно размещать в ON, а когда в WHERE при LEFT JOIN?"
    answer: "Условие в ON определяет, какие строки правой таблицы совпадают, сохраняя строки левой. Условие в WHERE фильтрует уже соединённый результат и может исключить строки без совпадения. Место условия меняет семантику запроса."
    category: "SQL"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем WHERE отличается от HAVING?"
    answer: "WHERE фильтрует исходные строки до группировки, а HAVING фильтрует группы после GROUP BY и агрегации. Если условие относится к отдельным строкам, его обычно лучше применить в WHERE раньше."
    category: "SQL"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Почему SELECT с GROUP BY нельзя свободно возвращать любой неагрегированный столбец?"
    answer: "Для каждой группы должно быть определено одно значение столбца. PostgreSQL требует включить его в GROUP BY, агрегировать или использовать допустимую функциональную зависимость. Иначе результат был бы неоднозначным."
    category: "SQL"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда оконная функция удобнее GROUP BY?"
    answer: "Оконная функция вычисляет агрегат или ранг по набору строк, не сворачивая результат в одну строку на группу. Она удобна для нумерации, накопительных сумм и выбора последней записи в группе вместе с её полями."
    category: "SQL"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как B-tree индекс помогает запросу и почему он не всегда используется?"
    answer: "B-tree упорядочивает ключи и ускоряет поиск и диапазоны по подходящим условиям. Планировщик может выбрать последовательное чтение, если таблица мала, условие выбирает большую долю строк или статистика показывает низкую выгоду индекса."
    category: "Индексы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему порядок столбцов в составном индексе важен?"
    answer: "B-tree индекс упорядочен сначала по первому столбцу, затем по следующим. Условия по ведущим столбцам обычно позволяют сузить диапазон эффективнее; выбор порядка зависит от реальных фильтров, сортировки и селективности."
    category: "Индексы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда частичный индекс полезен?"
    answer: "Он индексирует только строки, удовлетворяющие предикату, например активные записи. Это уменьшает размер и стоимость обновления по сравнению с полным индексом, если запросы часто используют совместимый предикат."
    category: "Индексы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему дополнительный индекс может замедлить запись?"
    answer: "При INSERT, UPDATE и DELETE СУБД должна поддерживать соответствующие записи в индексах. Индексы занимают память и место на диске. Польза для чтения должна оправдывать эту стоимость."
    category: "Индексы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что показывает EXPLAIN ANALYZE и чем он отличается от EXPLAIN?"
    answer: "EXPLAIN показывает оценённый план без выполнения запроса. EXPLAIN ANALYZE выполняет запрос и добавляет фактические времена и числа строк; для изменяющих запросов это может изменить данные, поэтому запуск требует осторожности и часто транзакции с откатом."
    category: "Планы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему большая разница между estimated rows и actual rows важна при анализе плана?"
    answer: "Планировщик выбирает операции по оценкам числа строк. Сильная ошибка оценки может привести к неудачному join или сканированию. Нужно проверить статистику, распределение данных и форму предикатов."
    category: "Планы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает MVCC в PostgreSQL?"
    answer: "Многоверсионность хранит версии строк так, чтобы транзакции читали согласованные снимки данных. Обычное чтение обычно не блокирует запись и наоборот, но обновления конфликтующих строк всё равно требуют координации."
    category: "MVCC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем PostgreSQL нужен VACUUM?"
    answer: "Обновления и удаления оставляют версии строк, которые больше не нужны активным снимкам. VACUUM освобождает место для повторного использования и помогает предотвращать проблемы с возрастом transaction ID. Без него таблицы и индексы могут разрастаться."
    category: "MVCC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему UNIQUE не заменяет бизнес-проверку и что происходит с NULL в PostgreSQL?"
    answer: "UNIQUE надёжно защищает от конкурентных дублей на уровне БД, но приложение всё равно должно сообщить понятную ошибку пользователю. По умолчанию PostgreSQL считает NULL-значения различными для обычного UNIQUE; при иной семантике нужна специальная схема или NULLS NOT DISTINCT."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем нужны FOREIGN KEY, если связи уже проверяет Java-код?"
    answer: "Внешний ключ защищает целостность для всех клиентов БД и при конкурентных изменениях, которые приложение может не предусмотреть. Он также влияет на операции удаления и обновления; нужно выбрать подходящие правила и индексы."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает SELECT ... FOR UPDATE?"
    answer: "Он блокирует выбранные строки для конкурирующих изменений до завершения транзакции. Это полезно для согласованного изменения данных, но повышает ожидание и риск deadlock; блокировка должна быть частью короткой операции."
    category: "Конкурентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему два UPDATE разных строк могут привести к deadlock?"
    answer: "Если транзакции захватывают одни и те же строки в разном порядке, каждая может удерживать строку, нужную другой. PostgreSQL обнаружит цикл ожидания и прервёт одну транзакцию; единый порядок захвата снижает риск."
    category: "Конкурентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда использовать INSERT ... ON CONFLICT?"
    answer: "Для атомарной обработки конфликта уникального ограничения: выполнить DO NOTHING или DO UPDATE. Это надёжнее схемы сначала SELECT, потом INSERT при конкуренции. Нужно явно определить, какое ограничение задаёт конфликт и допустимо ли обновление."
    category: "Запись"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему большой OFFSET ухудшает пагинацию PostgreSQL?"
    answer: "СУБД должна пройти или отсортировать пропускаемые строки до выдачи следующей страницы, поэтому стоимость растёт. Keyset pagination по стабильному ключу может быть эффективнее и устойчивее к вставкам между запросами."
    category: "Масштабирование"
    context: null
