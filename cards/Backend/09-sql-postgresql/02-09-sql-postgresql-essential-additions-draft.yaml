topic: "SQL PostgreSQL"
cards:
  - question: "Почему нормализация таблиц уменьшает риск аномалий при изменении данных?"
    answer: "Функционально зависимые данные хранятся в одном определённом месте, поэтому изменение значения не требует согласованного обновления многих строк. Денормализацию вводят осознанно ради чтения, учитывая цену поддержания согласованности."
    category: "Схема данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что добавляет EXPLAIN (ANALYZE, BUFFERS) к обычному плану запроса?"
    answer: "ANALYZE выполняет запрос и показывает фактическое время и число строк; BUFFERS показывает обращения к страницам из кэша и с диска. Это помогает отличить ошибку оценки планировщика от затрат на чтение. Для изменяющих запросов выполнение меняет данные, поэтому их анализируют осторожно, например в транзакции с откатом."
    category: "Планы запросов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему Index Only Scan всё равно иногда обращается к таблице?"
    answer: "Индекс содержит нужные столбцы, но PostgreSQL должен проверить видимость версии строки по MVCC. Если страница таблицы не помечена all-visible в visibility map, требуется heap fetch; VACUUM обновляет эту карту."
    category: "Индексы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "В каких случаях GIN индекс для jsonb полезнее обычного B-tree?"
    answer: "GIN индексирует элементы и структуры jsonb и полезен для поддерживаемых операторов поиска по содержимому, например containment @>. B-tree больше подходит для сравнения значения целиком; для частого поиска по одному извлекаемому полю может быть лучше expression index."
    category: "Индексы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему долгая транзакция может привести к росту таблиц и ухудшению работы VACUUM?"
    answer: "Старая транзакция удерживает горизонт видимости: VACUUM не может удалить версии строк, которые потенциально ещё нужны её снимку. Мёртвые версии накапливаются, растут таблицы и индексы."
    category: "MVCC и обслуживание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда EXISTS обычно удобнее JOIN для проверки наличия связанных строк?"
    answer: "EXISTS выражает полусоединение: достаточно найти хотя бы одну подходящую строку, а результат не размножается из-за нескольких совпадений. JOIN нужен, когда требуются столбцы связанных строк или их множественность."
    category: "SQL запросы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему пул соединений может ускорить приложение, но слишком большой пул ухудшить PostgreSQL?"
    answer: "Пул повторно использует дорогие соединения и ограничивает конкуренцию. Чрезмерное число одновременных соединений увеличивает расходы памяти, переключения контекста и конкуренцию за ресурсы БД; размер выбирают по измерениям и лимитам."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему CREATE INDEX CONCURRENTLY удобен для большой таблицы под нагрузкой и какое у него ограничение?"
    answer: "Он не блокирует обычные INSERT, UPDATE и DELETE на всё время построения, в отличие от обычного CREATE INDEX. Операция занимает больше времени и ресурсов и не выполняется внутри явного транзакционного блока."
    category: "Миграции"
    context: null
