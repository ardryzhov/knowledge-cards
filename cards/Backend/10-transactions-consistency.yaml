- id: 33f5b951-e0eb-4281-89f8-cb438a75fc6e
  question: Что такое lost update и как его предотвратить?
  answer: Два участника читают одно значение и записывают результат на основе старого
    состояния, из-за чего изменение одного теряется. Помогают атомарный SQL UPDATE,
    optimistic locking с версией или блокировка строки в зависимости от сценария.
  category: Конкурентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: acf51222-da5c-4ce6-961e-7694448420c2
  question: Чем optimistic locking отличается от pessimistic locking?
  answer: Optimistic locking обнаруживает конфликт при записи, обычно через версию,
    и требует реакции клиента. Pessimistic locking удерживает блокировку заранее,
    снижая параллелизм и повышая риск ожидания. Выбор зависит от частоты конфликтов
    и стоимости повторения.
  category: Конкурентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 87a2c5c8-2a0a-477b-9294-329c5211bae2
  question: Почему @Transactional на private-методе обычно не запускает транзакцию
    в proxy-based Spring AOP?
  answer: Вызов private-метода не проходит через внешний proxy; типичный транзакционный
    перехватчик не видит его как отдельную операцию. Границу транзакции размещают
    на доступном методе сервисного компонента, который вызывается через Spring proxy.
  category: Spring
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8365860e-1ab4-4849-9b83-cd38a24c5491
  question: Почему вызов @Transactional метода из другого метода того же класса может
    не применить настройки транзакции?
  answer: Внутренний вызов через this обходит Spring proxy, поэтому отдельный перехватчик
    не запускается. Если внешний метод уже транзакционный, он остаётся в своей транзакции;
    настройки внутреннего метода, например REQUIRES_NEW, не применятся.
  category: Spring
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: edf4c6e7-9d08-443b-bde7-525895479531
  question: Какие исключения по умолчанию вызывают rollback в Spring @Transactional?
  answer: По умолчанию rollback выполняется для RuntimeException и Error, а checked
    exception сама по себе обычно не запускает откат. Правило можно изменить через
    rollbackFor или noRollbackFor. Нельзя полагаться на тип исключения, не проверив
    фактический контракт.
  category: Spring
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f444cd82-e041-4f44-8a1a-31183e8938ce
  question: Чем REQUIRED отличается от REQUIRES_NEW?
  answer: REQUIRED присоединяется к существующей транзакции или создаёт новую. REQUIRES_NEW
    приостанавливает внешнюю и начинает независимую транзакцию, которая может зафиксироваться
    даже при откате внешней. Это увеличивает использование соединений и меняет атомарность.
  category: Spring
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b8287b2a-a2a7-46c9-8158-e18918a33466
  question: Что означает rollback-only и почему может возникнуть UnexpectedRollbackException?
  answer: Внутренняя операция может пометить общую транзакцию на откат. Даже если
    внешний код поймал исключение и попытался завершиться нормально, commit уже невозможен,
    и Spring сообщает об неожиданном откате. Нужно явно определить границы и обработку
    ошибок.
  category: Spring
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2ce06db7-c430-45ea-8ab8-22293b9aab71
  question: Является ли @Transactional(readOnly = true) гарантией, что запись в БД
    невозможна?
  answer: Нет. Это подсказка для инфраструктуры и ORM, а конкретное поведение зависит
    от менеджера транзакций и драйвера. Для запрета записи нужны права доступа и проверка
    на уровне БД, если это важный инвариант.
  category: Spring
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4ae550a5-56ee-47b6-823f-965b7e05af18
  question: Почему сетевой вызов внутри транзакции БД часто опасен?
  answer: Он удлиняет удержание соединения и блокировок, а также делает время транзакции
    зависимым от внешней системы. Сбой после внешнего побочного эффекта не откатывает
    этот эффект. Нужны разделение шагов и подходящий паттерн согласования.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 276dcbfc-cde9-4f45-ad33-f5cb2b3df1f5
  question: Как Transactional Outbox согласует изменение БД и публикацию события?
  answer: Бизнес-изменение и запись события в outbox сохраняются одной транзакцией
    БД. Отдельный процесс позже публикует событие в брокер и отмечает результат. Публикация
    может повториться, поэтому потребитель должен быть готов к дубликатам.
  category: БД и брокер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dbe5b6a5-f704-4512-afb0-2a8babdcd3bc
  question: Почему локальная транзакция БД не делает отправку Kafka-сообщения атомарной
    с ней?
  answer: БД и брокер — независимые системы с разными транзакциями. Успешный commit
    одной стороны не гарантирует успех другой. Для согласования применяют outbox,
    идемпотентность и явную обработку промежуточного состояния.
  category: БД и брокер
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 13bce24a-74fe-41d3-895e-3cfa97833151
  question: Что делает повторное выполнение операции безопасным после неизвестного
    исхода первого вызова?
  answer: Операция должна распознавать тот же бизнес-запрос по стабильному ключу и
    не создавать второй побочный эффект. Ключ идемпотентности и уникальное ограничение
    в БД помогают защититься от гонок. Нужно также определить, какой ответ возвращать
    на повтор.
  category: Идемпотентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3b907f8c-1689-45eb-9021-2322f171f702
  question: Как обрабатывать deadlock или serialization failure в PostgreSQL?
  answer: Одна транзакция откатывается, поэтому нужно повторить всю операцию с ограничением
    числа попыток и задержкой. До повтора следует убедиться, что внешние побочные
    эффекты не дублируются, и уменьшать конфликты порядком блокировок и короткими
    транзакциями.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 12b0676f-a82e-4a81-a6e6-b58f9a74fe66
  question: Почему тысячи REQUIRES_NEW внутри одной внешней транзакции опасны?
  answer: Каждая внутренняя операция создаёт отдельную транзакцию и может потребовать
    дополнительного соединения, а внешняя удерживается дольше. Это увеличивает нагрузку
    и допускает частичные коммиты. Часто лучше пакетная запись или иная граница транзакции.
  category: Ресурсы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b0cbdb51-4977-4338-8c20-aa0655ac270a
  question: Чем NESTED отличается от REQUIRES_NEW в Spring при наличии внешней транзакции?
  answer: 'NESTED обычно использует savepoint внутри той же физической транзакции:
    внутреннюю часть можно откатить до точки сохранения, но общий commit остаётся
    за внешней транзакцией. REQUIRES_NEW приостанавливает внешнюю и открывает отдельную
    физическую транзакцию; поддержка NESTED зависит от transaction manager и ресурса.'
  category: Spring транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: f2083d41-04ba-4958-92c4-90dcbf5e6792
  question: Почему @Transactional не распространяется автоматически на задачу, запущенную
    через @Async или новый Thread?
  answer: Контекст Spring-транзакции привязан к исполняющему потоку. Задача в другом
    потоке должна открыть собственную транзакцию; нельзя рассчитывать на атомарность
    с транзакцией вызвавшего метода.
  category: Spring транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 395d78d3-142a-43d1-956c-80cd4e928367
  question: Когда срабатывает обработчик @TransactionalEventListener по умолчанию?
  answer: По умолчанию обработчик вызывается в фазе AFTER_COMMIT после успешного commit
    транзакции, в рамках которой опубликовано событие. Он не превращает отправку во
    внешнюю систему в атомарную операцию с commit; для надёжной публикации нужен,
    например, outbox.
  category: Spring транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3daff28c-74c5-4603-b7a2-8cbc5d3db3bf
  question: Что происходит, если время ожидания блокировки при SELECT FOR UPDATE истекло?
  answer: Запрос завершается ошибкой ожидания блокировки при заданном lock_timeout
    или NOWAIT; вызывающий код должен решить, повторять ли всю бизнес-операцию. SKIP
    LOCKED может пропустить занятые строки, что подходит для очереди задач, но не
    для произвольного чтения данных.
  category: Блокировки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a9ef8693-02a6-4f21-bd9e-ccd0b0325733
  question: Почему длинная транзакция с сетевым вызовом может исчерпать пул соединений?
  answer: Пока транзакция ждёт внешний сервис, она часто удерживает соединение БД
    и блокировки. При росте числа параллельных запросов свободные соединения заканчиваются;
    сетевой вызов стоит вынести за границу короткой транзакции, если бизнес-семантика
    позволяет.
  category: Границы транзакции
