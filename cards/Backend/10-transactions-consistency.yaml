topic: Transactions and Consistency
cards:
- id: b5324001-53fe-4215-8f03-364638511dc5
  question: Что означают свойства ACID для транзакции?
  answer: Atomicity — все изменения фиксируются вместе или откатываются; Consistency
    — сохраняются заданные инварианты; Isolation — конкурирующие операции не видят
    недопустимых промежуточных состояний; Durability — зафиксированный результат переживает
    сбой в пределах гарантий системы.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: aa62d8cf-dfb6-4c4d-a44a-0a1a53562df6
  question: Почему границу транзакции выбирают по бизнес-операции, а не по каждому
    вызову repository?
  answer: Несколько записей, составляющих один инвариант, должны завершиться согласованно.
    Если каждая запись фиксируется отдельно, ошибка посередине оставит частичный результат.
    При этом транзакцию держат как можно короче.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 83cda96a-e760-480a-ab46-dbaa40935b29
  question: Что такое dirty read и допускает ли его PostgreSQL Read Committed?
  answer: Dirty read — чтение незакоммиченных изменений другой транзакции. PostgreSQL
    не допускает его даже на Read Committed; уровень Read Uncommitted в PostgreSQL
    фактически ведёт себя как Read Committed.
  category: Изоляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4542cc0f-81a3-448d-96d1-931fdbacb97a
  question: Что может измениться между двумя SELECT в одной транзакции Read Committed
    PostgreSQL?
  answer: Каждый оператор получает собственный снимок данных, поэтому повторный запрос
    может увидеть коммит другой транзакции. Это позволяет неповторяемые чтения и некоторые
    изменения набора строк. Если нужен единый снимок, выбирают другой уровень изоляции.
  category: Изоляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1422bab8-d778-463f-8a64-2bfd8b3ab083
  question: Что гарантирует Repeatable Read в PostgreSQL и какой риск остаётся?
  answer: Транзакция работает с одним снимком и повторные чтения видят согласованное
    состояние. Однако возможны аномалии сериализации, например write skew в подходящем
    сценарии. Для гарантии эквивалентности некоторому последовательному порядку используют
    Serializable с обработкой повторов.
  category: Изоляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1e1c2059-cdf9-47a2-bf13-fe8d529274b0
  question: Почему транзакцию Serializable иногда приходится повторять?
  answer: PostgreSQL может обнаружить конфликт, который нарушил бы сериализуемость,
    и прервать одну транзакцию ошибкой serialization failure. Приложение должно повторить
    всю бизнес-операцию, а не только последний SQL, с учётом идемпотентности внешних
    действий.
  category: Изоляция
  context: 
