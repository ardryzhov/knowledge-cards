topic: "Transactions and Consistency"
cards:
  - question: "Что означают свойства ACID для транзакции?"
    answer: "Atomicity — все изменения фиксируются вместе или откатываются; Consistency — сохраняются заданные инварианты; Isolation — конкурирующие операции не видят недопустимых промежуточных состояний; Durability — зафиксированный результат переживает сбой в пределах гарантий системы."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему границу транзакции выбирают по бизнес-операции, а не по каждому вызову repository?"
    answer: "Несколько записей, составляющих один инвариант, должны завершиться согласованно. Если каждая запись фиксируется отдельно, ошибка посередине оставит частичный результат. При этом транзакцию держат как можно короче."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое dirty read и допускает ли его PostgreSQL Read Committed?"
    answer: "Dirty read — чтение незакоммиченных изменений другой транзакции. PostgreSQL не допускает его даже на Read Committed; уровень Read Uncommitted в PostgreSQL фактически ведёт себя как Read Committed."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что может измениться между двумя SELECT в одной транзакции Read Committed PostgreSQL?"
    answer: "Каждый оператор получает собственный снимок данных, поэтому повторный запрос может увидеть коммит другой транзакции. Это позволяет неповторяемые чтения и некоторые изменения набора строк. Если нужен единый снимок, выбирают другой уровень изоляции."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что гарантирует Repeatable Read в PostgreSQL и какой риск остаётся?"
    answer: "Транзакция работает с одним снимком и повторные чтения видят согласованное состояние. Однако возможны аномалии сериализации, например write skew в подходящем сценарии. Для гарантии эквивалентности некоторому последовательному порядку используют Serializable с обработкой повторов."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Почему транзакцию Serializable иногда приходится повторять?"
    answer: "PostgreSQL может обнаружить конфликт, который нарушил бы сериализуемость, и прервать одну транзакцию ошибкой serialization failure. Приложение должно повторить всю бизнес-операцию, а не только последний SQL, с учётом идемпотентности внешних действий."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Что такое lost update и как его предотвратить?"
    answer: "Два участника читают одно значение и записывают результат на основе старого состояния, из-за чего изменение одного теряется. Помогают атомарный SQL UPDATE, optimistic locking с версией или блокировка строки в зависимости от сценария."
    category: "Конкурентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем optimistic locking отличается от pessimistic locking?"
    answer: "Optimistic locking обнаруживает конфликт при записи, обычно через версию, и требует реакции клиента. Pessimistic locking удерживает блокировку заранее, снижая параллелизм и повышая риск ожидания. Выбор зависит от частоты конфликтов и стоимости повторения."
    category: "Конкурентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему @Transactional на private-методе обычно не запускает транзакцию в proxy-based Spring AOP?"
    answer: "Вызов private-метода не проходит через внешний proxy; типичный транзакционный перехватчик не видит его как отдельную операцию. Границу транзакции размещают на доступном методе сервисного компонента, который вызывается через Spring proxy."
    category: "Spring"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему вызов @Transactional метода из другого метода того же класса может не применить настройки транзакции?"
    answer: "Внутренний вызов через this обходит Spring proxy, поэтому отдельный перехватчик не запускается. Если внешний метод уже транзакционный, он остаётся в своей транзакции; настройки внутреннего метода, например REQUIRES_NEW, не применятся."
    category: "Spring"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие исключения по умолчанию вызывают rollback в Spring @Transactional?"
    answer: "По умолчанию rollback выполняется для RuntimeException и Error, а checked exception сама по себе обычно не запускает откат. Правило можно изменить через rollbackFor или noRollbackFor. Нельзя полагаться на тип исключения, не проверив фактический контракт."
    category: "Spring"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем REQUIRED отличается от REQUIRES_NEW?"
    answer: "REQUIRED присоединяется к существующей транзакции или создаёт новую. REQUIRES_NEW приостанавливает внешнюю и начинает независимую транзакцию, которая может зафиксироваться даже при откате внешней. Это увеличивает использование соединений и меняет атомарность."
    category: "Spring"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает rollback-only и почему может возникнуть UnexpectedRollbackException?"
    answer: "Внутренняя операция может пометить общую транзакцию на откат. Даже если внешний код поймал исключение и попытался завершиться нормально, commit уже невозможен, и Spring сообщает об неожиданном откате. Нужно явно определить границы и обработку ошибок."
    category: "Spring"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Является ли @Transactional(readOnly = true) гарантией, что запись в БД невозможна?"
    answer: "Нет. Это подсказка для инфраструктуры и ORM, а конкретное поведение зависит от менеджера транзакций и драйвера. Для запрета записи нужны права доступа и проверка на уровне БД, если это важный инвариант."
    category: "Spring"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему сетевой вызов внутри транзакции БД часто опасен?"
    answer: "Он удлиняет удержание соединения и блокировок, а также делает время транзакции зависимым от внешней системы. Сбой после внешнего побочного эффекта не откатывает этот эффект. Нужны разделение шагов и подходящий паттерн согласования."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как Transactional Outbox согласует изменение БД и публикацию события?"
    answer: "Бизнес-изменение и запись события в outbox сохраняются одной транзакцией БД. Отдельный процесс позже публикует событие в брокер и отмечает результат. Публикация может повториться, поэтому потребитель должен быть готов к дубликатам."
    category: "БД и брокер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему локальная транзакция БД не делает отправку Kafka-сообщения атомарной с ней?"
    answer: "БД и брокер — независимые системы с разными транзакциями. Успешный commit одной стороны не гарантирует успех другой. Для согласования применяют outbox, идемпотентность и явную обработку промежуточного состояния."
    category: "БД и брокер"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает повторное выполнение операции безопасным после неизвестного исхода первого вызова?"
    answer: "Операция должна распознавать тот же бизнес-запрос по стабильному ключу и не создавать второй побочный эффект. Ключ идемпотентности и уникальное ограничение в БД помогают защититься от гонок. Нужно также определить, какой ответ возвращать на повтор."
    category: "Идемпотентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как обрабатывать deadlock или serialization failure в PostgreSQL?"
    answer: "Одна транзакция откатывается, поэтому нужно повторить всю операцию с ограничением числа попыток и задержкой. До повтора следует убедиться, что внешние побочные эффекты не дублируются, и уменьшать конфликты порядком блокировок и короткими транзакциями."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему тысячи REQUIRES_NEW внутри одной внешней транзакции опасны?"
    answer: "Каждая внутренняя операция создаёт отдельную транзакцию и может потребовать дополнительного соединения, а внешняя удерживается дольше. Это увеличивает нагрузку и допускает частичные коммиты. Часто лучше пакетная запись или иная граница транзакции."
    category: "Ресурсы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
