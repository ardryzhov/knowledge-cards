topic: "Transactions and Consistency"
cards:
  - question: "Чем NESTED отличается от REQUIRES_NEW в Spring при наличии внешней транзакции?"
    answer: "NESTED обычно использует savepoint внутри той же физической транзакции: внутреннюю часть можно откатить до точки сохранения, но общий commit остаётся за внешней транзакцией. REQUIRES_NEW приостанавливает внешнюю и открывает отдельную физическую транзакцию; поддержка NESTED зависит от transaction manager и ресурса."
    category: "Spring транзакции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему @Transactional не распространяется автоматически на задачу, запущенную через @Async или новый Thread?"
    answer: "Контекст Spring-транзакции привязан к исполняющему потоку. Задача в другом потоке должна открыть собственную транзакцию; нельзя рассчитывать на атомарность с транзакцией вызвавшего метода."
    category: "Spring транзакции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда срабатывает обработчик @TransactionalEventListener по умолчанию?"
    answer: "По умолчанию обработчик вызывается в фазе AFTER_COMMIT после успешного commit транзакции, в рамках которой опубликовано событие. Он не превращает отправку во внешнюю систему в атомарную операцию с commit; для надёжной публикации нужен, например, outbox."
    category: "Spring транзакции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что происходит, если время ожидания блокировки при SELECT FOR UPDATE истекло?"
    answer: "Запрос завершается ошибкой ожидания блокировки при заданном lock_timeout или NOWAIT; вызывающий код должен решить, повторять ли всю бизнес-операцию. SKIP LOCKED может пропустить занятые строки, что подходит для очереди задач, но не для произвольного чтения данных."
    category: "Блокировки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему длинная транзакция с сетевым вызовом может исчерпать пул соединений?"
    answer: "Пока транзакция ждёт внешний сервис, она часто удерживает соединение БД и блокировки. При росте числа параллельных запросов свободные соединения заканчиваются; сетевой вызов стоит вынести за границу короткой транзакции, если бизнес-семантика позволяет."
    category: "Границы транзакции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
