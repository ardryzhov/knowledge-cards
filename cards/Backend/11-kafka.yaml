- id: 6490c3c5-4c20-432f-8b89-0eac9d0340a6
  question: Чем topic отличается от partition в Kafka?
  answer: Topic — логический поток записей. Partition — упорядоченный лог внутри topic
    с собственными offset; она задаёт единицу хранения, порядка и параллельного чтения.
    Глобального порядка между партициями нет.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: e36f1216-f33f-4af5-ad17-b32ca138074e
  question: Как ключ сообщения влияет на выбор партиции?
  answer: Типичный producer вычисляет партицию по сериализованному ключу, чтобы одинаковые
    ключи попадали вместе при неизменной конфигурации и числе партиций. Без ключа
    выбор зависит от стратегии producer; нельзя обещать round-robin во всех версиях.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5d59bc0b-0506-4748-bd4a-9e0a0676448e
  question: Какой порядок сообщений Kafka гарантирует?
  answer: Порядок записей определяется внутри одной партиции по offset. Между партициями
    общего порядка нет. При обработке нужно также учитывать повторные доставки, параллелизм
    и поведение producer при сбоях.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ceca92ba-8a0d-494a-a90c-1db331284500
  question: Как consumer group распределяет работу?
  answer: В рамках одной группы каждая партиция в данный момент назначается одному
    её участнику. Разные группы читают topic независимо и имеют собственные offset.
    Число активных потребителей группы не даёт больше параллелизма, чем число партиций.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f0b38c0a-23ab-4a3c-9b63-02e5ca298662
  question: Что означает committed offset и чем он отличается от текущей позиции consumer?
  answer: Позиция показывает следующий offset, который consumer собирается читать
    в текущем процессе. Committed offset хранит точку восстановления группы после
    перезапуска. Если commit не согласован с обработкой, возможны дубли или потери
    обработки.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9a3d406b-0305-4eb7-8777-0b7af27d4d1b
  question: Почему commit offset до успешной обработки сообщения опасен?
  answer: После сбоя группа может возобновить чтение после уже подтверждённого offset,
    хотя бизнес-операция не выполнена. Это даёт потерю обработки. При at-least-once
    offset подтверждают после успешного эффекта, принимая возможность повторов.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 793f38b6-fb25-4a16-a946-e5e9f79034a7
  question: Что такое rebalance и почему он влияет на время обработки?
  answer: При изменении состава группы или партиций Kafka перераспределяет назначения.
    На время перехода обработка может останавливаться или менять владельца, поэтому
    долгие операции, commit и восстановление состояния нужно проектировать с учётом
    rebalance.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0e381031-1887-4ee1-8f73-6c51f01fbe50
  question: Что означает consumer lag и чего он не говорит сам по себе?
  answer: 'Lag — разница между конечным offset партиции и позицией или committed offset
    группы. Он помогает увидеть отставание, но не равен напрямую задержке по времени
    и не объясняет причину: нужны throughput, ошибки и время обработки.'
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2e771e74-6cd8-4ff9-a9b9-94512acc5fa3
  question: Что значит at-least-once для обработки Kafka-сообщения?
  answer: После сбоя сообщение может быть обработано повторно, но при правильной схеме
    подтверждения его не должны молча пропустить. Потребитель должен выдерживать дубликаты.
    Гарантия зависит от границ между чтением, бизнес-эффектом и commit offset.
  category: Доставка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2234c49a-c5f4-4f9e-9a61-7168dace94e7
  question: В каких границах Kafka transactions помогают достичь exactly-once?
  answer: Транзакции и идемпотентный producer позволяют атомарно публиковать записи
    и offset при обработке Kafka-to-Kafka. Они сами по себе не делают запись во внешнюю
    БД или HTTP-вызов exactly-once. Для внешних эффектов нужны отдельные гарантии
    и идемпотентность.
  category: Доставка
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: dba6e089-fb15-4dce-993f-c26aeeb17cc1
  question: Что делает идемпотентный producer Kafka?
  answer: Он использует идентификаторы producer и последовательности записей, чтобы
    брокер мог отфильтровать дубли, возникшие из-за повторов отправки в рамках поддерживаемой
    модели. Это не делает всю бизнес-операцию во внешних системах идемпотентной.
  category: Producer
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 12772cea-1adc-494b-ba4b-90b30c9854dc
  question: Как acks и min.insync.replicas влияют на надёжность записи?
  answer: acks определяет, каких подтверждений ждёт producer, а min.insync.replicas
    задаёт минимальное число синхронных реплик для успешной записи при соответствующей
    настройке. Более строгие настройки уменьшают риск потери подтверждённых данных
    ценой доступности и задержки.
  category: Producer
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ccb9e2c9-d9e0-4584-bc0b-90437e04cb53
  question: Зачем нужны replication factor и лидер партиции?
  answer: Копии партиции на брокерах повышают отказоустойчивость, а лидер обслуживает
    запись и чтение в обычной модели. При отказе лидера выбирается новый из допустимых
    реплик. Настройки репликации влияют на компромисс между доступностью и сохранностью
    данных.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9b709f08-0fb2-4123-9106-4ce6736f4771
  question: Чем retention по времени или размеру отличается от log compaction?
  answer: Retention удаляет старые сегменты по политике хранения, независимо от обработки
    конкретной группой. Compaction стремится сохранить последнее значение для каждого
    ключа, а не полный журнал всех версий. Эти политики решают разные задачи.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 029b02d8-7632-43d6-82a4-5035dd7ccb43
  question: Почему увеличение числа партиций может изменить распределение ключей?
  answer: Хеш ключа сопоставляется с числом партиций. При изменении этого числа тот
    же ключ может попасть в другую партицию, поэтому порядок событий одного ключа
    на границе изменения требует отдельного анализа.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 93de4190-fec0-45de-8ce5-f140700813de
  question: Как обрабатывать сообщение, которое стабильно ломает consumer?
  answer: Нельзя бесконечно повторять его без контроля, блокируя партицию. Обычно
    различают временную и постоянную ошибку, ограничивают retry, фиксируют диагностический
    контекст и отправляют проблемную запись в отдельный поток для разбора.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9dadb805-ef6f-4ab4-af72-6cadf349fe84
  question: Почему DLQ не заменяет исправление причины ошибки?
  answer: DLQ сохраняет проблемное сообщение и позволяет продолжить обработку, но
    может скрыть массовую потерю бизнес-событий, если за ней не следить. Нужны метрики,
    алерты, политика повторной обработки и проверка совместимости схемы.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a5e864c2-1f66-427f-a46e-5d0093b6a0ea
  question: Почему изменение схемы Kafka-события нужно согласовывать с потребителями?
  answer: Producer и consumer могут обновляться независимо и одновременно обрабатывать
    записи старой и новой версии. Совместимые изменения и версионирование схемы помогают
    избежать ошибок десериализации и неверного смысла полей.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6568110d-0fa9-4e6c-be6c-a2c2e71bc4ca
  question: Что проверить, если lag группы растёт?
  answer: Сравнить скорость поступления и обработки, ошибки и retry, число партиций
    и активных consumers, время внешних зависимостей и rebalance. Простое добавление
    consumers не поможет, если партиций меньше или узкое место находится в БД.
  category: Эксплуатация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bb3f166c-9c42-4b8a-927d-098410bde7bd
  question: Когда Kafka подходит лучше обычной очереди задач?
  answer: Когда важны сохраняемый поток событий, независимые группы потребителей,
    повторное чтение и масштабирование по партициям. Для простой адресной доставки
    задачи с гибкой маршрутизацией обычный брокер очередей может быть проще; выбор
    определяется семантикой задачи.
  category: Проектирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3a6a3094-50a4-4a65-ab7a-a1ca0a7aed4d
  question: Чем max.poll.interval.ms отличается от session.timeout.ms у Kafka consumer?
  answer: session.timeout.ms ограничивает время отсутствия heartbeat до признания
    consumer недоступным. max.poll.interval.ms ограничивает паузу между вызовами poll
    и выявляет зависшую обработку, даже если heartbeat продолжает работать; превышение
    может привести к rebalance.
  category: Consumer
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3fe757f4-790b-423f-843f-b352bb3a7ee0
  question: Почему сообщение, постоянно вызывающее ошибку десериализации, может остановить
    продвижение consumer?
  answer: 'Consumer не может успешно обработать запись и сдвинуть подтверждённый offset;
    повторное чтение возвращает ту же запись. Нужна явная политика: диагностировать,
    отправить в DLQ или пропустить по контролируемому решению, сохранив исходные данные
    и причину.'
  category: Обработка ошибок
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0f6b11d0-4847-45b3-88a8-16918033b8bc
  question: Может ли Kafka exactly-once гарантировать однократное изменение внешней
    PostgreSQL базы consumer-ом?
  answer: Нет, транзакции Kafka охватывают операции внутри Kafka, например чтение
    и запись в топики с фиксацией offsets. Изменение внешней БД требует собственного
    механизма идемпотентности, inbox или координации; обещание end-to-end exactly-once
    без этих условий неверно.
  category: Семантика доставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ece09de3-d8af-48f8-8f04-ce57638c133c
  question: Почему retry через отдельный Kafka-топик может нарушить порядок событий
    по одному ключу?
  answer: Пока неуспешное событие отложено в retry-топик, основной consumer продолжит
    читать следующие события того же ключа. Если порядок важен, нужно остановить продвижение
    этой партиции либо спроектировать другую стратегию обработки.
  category: Порядок и retry
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 39923db1-2e19-45d9-b537-296cb717498a
  question: Как изменение схемы события может сломать старого и нового потребителя
    при совместной работе?
  answer: Старый consumer может не понять новое обязательное поле или изменённый тип,
    а новый может не обработать старые записи из retention. Нужно выбирать правила
    backward/forward compatibility и тестировать обе версии на реальных схемах и примерах.
  category: Схемы событий
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 65e2a91a-192c-4382-9aef-e360c04d5e7d
  question: Чем выбор партиции по ключу отличается от round-robin для сообщений без
    ключа?
  answer: Ключ обычно хешируется, поэтому одинаковые ключи стабильно попадают в одну
    партицию при неизменном числе партиций. Для сообщений без ключа конкретная стратегия
    зависит от клиента и его версии; нельзя обещать round-robin как универсальное
    правило.
  category: Producer и партиции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
