topic: "Kafka"
cards:
  - question: "Чем topic отличается от partition в Kafka?"
    answer: "Topic — логический поток записей. Partition — упорядоченный лог внутри topic с собственными offset; она задаёт единицу хранения, порядка и параллельного чтения. Глобального порядка между партициями нет."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Как ключ сообщения влияет на выбор партиции?"
    answer: "Типичный producer вычисляет партицию по сериализованному ключу, чтобы одинаковые ключи попадали вместе при неизменной конфигурации и числе партиций. Без ключа выбор зависит от стратегии producer; нельзя обещать round-robin во всех версиях."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какой порядок сообщений Kafka гарантирует?"
    answer: "Порядок записей определяется внутри одной партиции по offset. Между партициями общего порядка нет. При обработке нужно также учитывать повторные доставки, параллелизм и поведение producer при сбоях."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как consumer group распределяет работу?"
    answer: "В рамках одной группы каждая партиция в данный момент назначается одному её участнику. Разные группы читают topic независимо и имеют собственные offset. Число активных потребителей группы не даёт больше параллелизма, чем число партиций."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает committed offset и чем он отличается от текущей позиции consumer?"
    answer: "Позиция показывает следующий offset, который consumer собирается читать в текущем процессе. Committed offset хранит точку восстановления группы после перезапуска. Если commit не согласован с обработкой, возможны дубли или потери обработки."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему commit offset до успешной обработки сообщения опасен?"
    answer: "После сбоя группа может возобновить чтение после уже подтверждённого offset, хотя бизнес-операция не выполнена. Это даёт потерю обработки. При at-least-once offset подтверждают после успешного эффекта, принимая возможность повторов."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое rebalance и почему он влияет на время обработки?"
    answer: "При изменении состава группы или партиций Kafka перераспределяет назначения. На время перехода обработка может останавливаться или менять владельца, поэтому долгие операции, commit и восстановление состояния нужно проектировать с учётом rebalance."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает consumer lag и чего он не говорит сам по себе?"
    answer: "Lag — разница между конечным offset партиции и позицией или committed offset группы. Он помогает увидеть отставание, но не равен напрямую задержке по времени и не объясняет причину: нужны throughput, ошибки и время обработки."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что значит at-least-once для обработки Kafka-сообщения?"
    answer: "После сбоя сообщение может быть обработано повторно, но при правильной схеме подтверждения его не должны молча пропустить. Потребитель должен выдерживать дубликаты. Гарантия зависит от границ между чтением, бизнес-эффектом и commit offset."
    category: "Доставка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "В каких границах Kafka transactions помогают достичь exactly-once?"
    answer: "Транзакции и идемпотентный producer позволяют атомарно публиковать записи и offset при обработке Kafka-to-Kafka. Они сами по себе не делают запись во внешнюю БД или HTTP-вызов exactly-once. Для внешних эффектов нужны отдельные гарантии и идемпотентность."
    category: "Доставка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Что делает идемпотентный producer Kafka?"
    answer: "Он использует идентификаторы producer и последовательности записей, чтобы брокер мог отфильтровать дубли, возникшие из-за повторов отправки в рамках поддерживаемой модели. Это не делает всю бизнес-операцию во внешних системах идемпотентной."
    category: "Producer"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как acks и min.insync.replicas влияют на надёжность записи?"
    answer: "acks определяет, каких подтверждений ждёт producer, а min.insync.replicas задаёт минимальное число синхронных реплик для успешной записи при соответствующей настройке. Более строгие настройки уменьшают риск потери подтверждённых данных ценой доступности и задержки."
    category: "Producer"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем нужны replication factor и лидер партиции?"
    answer: "Копии партиции на брокерах повышают отказоустойчивость, а лидер обслуживает запись и чтение в обычной модели. При отказе лидера выбирается новый из допустимых реплик. Настройки репликации влияют на компромисс между доступностью и сохранностью данных."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем retention по времени или размеру отличается от log compaction?"
    answer: "Retention удаляет старые сегменты по политике хранения, независимо от обработки конкретной группой. Compaction стремится сохранить последнее значение для каждого ключа, а не полный журнал всех версий. Эти политики решают разные задачи."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему увеличение числа партиций может изменить распределение ключей?"
    answer: "Хеш ключа сопоставляется с числом партиций. При изменении этого числа тот же ключ может попасть в другую партицию, поэтому порядок событий одного ключа на границе изменения требует отдельного анализа."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Как обрабатывать сообщение, которое стабильно ломает consumer?"
    answer: "Нельзя бесконечно повторять его без контроля, блокируя партицию. Обычно различают временную и постоянную ошибку, ограничивают retry, фиксируют диагностический контекст и отправляют проблемную запись в отдельный поток для разбора."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему DLQ не заменяет исправление причины ошибки?"
    answer: "DLQ сохраняет проблемное сообщение и позволяет продолжить обработку, но может скрыть массовую потерю бизнес-событий, если за ней не следить. Нужны метрики, алерты, политика повторной обработки и проверка совместимости схемы."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему изменение схемы Kafka-события нужно согласовывать с потребителями?"
    answer: "Producer и consumer могут обновляться независимо и одновременно обрабатывать записи старой и новой версии. Совместимые изменения и версионирование схемы помогают избежать ошибок десериализации и неверного смысла полей."
    category: "Контракты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что проверить, если lag группы растёт?"
    answer: "Сравнить скорость поступления и обработки, ошибки и retry, число партиций и активных consumers, время внешних зависимостей и rebalance. Простое добавление consumers не поможет, если партиций меньше или узкое место находится в БД."
    category: "Эксплуатация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда Kafka подходит лучше обычной очереди задач?"
    answer: "Когда важны сохраняемый поток событий, независимые группы потребителей, повторное чтение и масштабирование по партициям. Для простой адресной доставки задачи с гибкой маршрутизацией обычный брокер очередей может быть проще; выбор определяется семантикой задачи."
    category: "Проектирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

