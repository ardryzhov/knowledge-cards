- id: 735539d3-e5b8-4bd0-b7e7-ea83876d7d66
  question: Чем JMS Queue отличается от JMS Topic?
  answer: 'Queue предназначена для конкурирующих потребителей: конкретное сообщение
    обычно обрабатывает один из них. Topic предназначен для публикации нескольким
    подпискам, каждая из которых получает свою доставку согласно её настройкам. Поведение
    сохранения зависит от типа подписки.'
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 04fa4fef-f936-42d9-8019-6875776d237b
  question: Что в Artemis означают address, queue и routing type?
  answer: 'Address принимает сообщения, queue хранит их для потребления, а routing
    type определяет, как сообщение направляется на очереди адреса. Это разные сущности:
    один address может быть связан с несколькими очередями.'
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 99f92943-f6b7-4a20-8c49-5d3605bbb82f
  question: Чем anycast отличается от multicast в Artemis?
  answer: Anycast направляет сообщение одной подходящей очереди адреса, реализуя point-to-point.
    Multicast направляет копию сообщения каждой подходящей очереди адреса, реализуя
    publish/subscribe. Выбор должен соответствовать требуемой модели потребления.
  category: Маршрутизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8ac5595a-2f77-4565-b8ad-b782b8ddf683
  question: Почему несколько consumers одной очереди не получают каждый свою копию
    сообщения?
  answer: Они конкурируют за сообщения из общей очереди, и брокер распределяет доставку.
    Если каждому потребителю нужна собственная копия, нужны отдельные очереди или
    подписки, например через multicast.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 36c82916-d5d4-428a-9f50-8fd0792183fa
  question: Зачем подтверждать получение сообщения после успешной обработки?
  answer: Подтверждение сообщает брокеру, что сообщение больше не нужно доставлять
    этому потребителю. Если подтвердить до бизнес-эффекта, сбой может привести к потере
    обработки; если после, возможна повторная доставка, поэтому обработчик должен
    быть идемпотентным.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 55aa234f-173d-4f77-a617-0a60b561335d
  question: Чем AUTO_ACKNOWLEDGE отличается от CLIENT_ACKNOWLEDGE в JMS?
  answer: В AUTO_ACKNOWLEDGE подтверждение управляется JMS-провайдером по правилам
    вызова listener или receive. В CLIENT_ACKNOWLEDGE клиент вызывает acknowledge
    явно; детали границы подтверждения могут охватывать сообщения сессии, поэтому
    нужно понимать контракт провайдера.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2670b7b0-9625-4072-82bb-0754bdc1534d
  question: Что даёт transacted JMS Session?
  answer: Отправка и подтверждение сообщений в рамках JMS-сессии фиксируются при commit
    или откатываются при rollback. Это локальная транзакция брокера; она сама по себе
    не делает запись в PostgreSQL атомарной с JMS-операцией.
  category: Потребители
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a8783772-23fa-4ebd-800a-9b6bd4857488
  question: Когда Artemis повторно доставляет сообщение?
  answer: Повтор возможен после rollback, отсутствия подтверждения, сбоя соединения
    или по политике обработки ошибки. Приложение должно допускать дубликаты и отличать
    временные ошибки от постоянных.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f9add770-3a07-4f66-8da9-2169568808c5
  question: Зачем настраивать redelivery delay?
  answer: Пауза перед повтором даёт внешней системе восстановиться и предотвращает
    быстрый цикл ошибок, который нагружает брокер и сервис. Для постоянной ошибки
    нужны ограничение попыток и отдельная обработка.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 627e0486-e267-45ff-8cc3-10fbfb9fe5c6
  question: Для чего нужна dead-letter address в Artemis?
  answer: После заданного числа безуспешных доставок брокер может переместить сообщение
    на адрес для проблемных сообщений. Это освобождает основную очередь, но требует
    мониторинга, диагностики причины и процедуры повторной обработки.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3221352a-8913-483d-b556-8257b4d90318
  question: Что означает TTL сообщения?
  answer: TTL ограничивает срок, в течение которого сообщение считается пригодным
    для доставки. После истечения брокер обрабатывает его согласно политике expiry.
    Если бизнес-операция не должна теряться, срок и дальнейшую судьбу сообщения нужно
    задать явно.
  category: Время жизни
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7a9e7cab-467a-47d8-a843-36259ae4e98a
  question: Чем expiry address отличается от dead-letter address?
  answer: Expiry address принимает сообщения, срок жизни которых истёк. Dead-letter
    address обычно принимает сообщения после неудачных попыток доставки. Это разные
    причины выбытия из основной очереди и требуют разных действий оператора.
  category: Время жизни
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6a4d9ec9-61d1-4b21-a7dd-d533dba703ba
  question: Чем persistent message отличается от non-persistent в JMS?
  answer: Persistent delivery запрашивает сохранение сообщения с более сильными гарантиями
    переживания сбоя брокера в рамках конфигурации. Non-persistent обычно быстрее,
    но может потеряться при сбое. Фактические гарантии зависят от топологии и настроек
    брокера.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 75727901-d9bc-4733-80d9-c595edce2493
  question: Зачем нужна durable subscription для JMS Topic?
  answer: Она позволяет сохранять сообщения для подписки, когда её потребитель временно
    отключён, согласно правилам брокера и подписки. Недолговечная подписка обычно
    получает только сообщения, отправленные во время её активности.
  category: Подписки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0b3900b7-17d8-4ba6-b7ec-e4925af63ad6
  question: Что делает JMS message selector?
  answer: Selector фильтрует сообщения по заголовкам и свойствам сообщения с SQL-подобным
    выражением. Он не предназначен для произвольного анализа тела; если маршрутизация
    зависит от поля, нужное значение следует вынести в свойство.
  category: Фильтрация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2c2e6821-a642-478a-9e42-52b21d1c0d49
  question: Чем JMS properties отличаются от тела сообщения?
  answer: Тело содержит полезную нагрузку, а свойства — метаданные для маршрутизации,
    селекторов и обработки. Контракт должен определять имена и типы свойств так же
    строго, как формат тела.
  category: Фильтрация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 27c0a5c9-5557-48fc-ad3c-495c01286cfc
  question: Гарантируется ли порядок завершения обработки сообщений при нескольких
    consumers одной очереди?
  answer: Даже если брокер выдаёт сообщения в определённом порядке, параллельные consumers
    могут завершать бизнес-операции в другом порядке. Если строгий порядок критичен,
    нужно ограничить параллелизм или разделить потоки по ключу и обеспечить подходящую
    схему маршрутизации.
  category: Порядок
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 634e2ef0-46b1-4818-891a-856f8055f7f9
  question: Почему нельзя считать отправку JMS-сообщения и commit PostgreSQL одной
    транзакцией по умолчанию?
  answer: Они относятся к разным ресурсам. Успех одной стороны и сбой другой создают
    расхождение. Нужен осознанный механизм согласования, например outbox и идемпотентный
    потребитель, либо специально настроенная распределённая транзакция с её стоимостью.
  category: Интеграция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 08a15759-54e4-472d-8671-9e989b9bc915
  question: Какие метрики важны для очереди Artemis?
  answer: Глубина очереди, возраст старейшего сообщения, скорость поступления и обработки,
    число повторных доставок и сообщений в dead-letter/expiry. Они показывают отставание
    и ошибки лучше, чем один показатель числа сообщений.
  category: Эксплуатация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d6fbb6dd-f777-4248-84a8-f5fb15ec3e4e
  question: Что проверить, если очередь Artemis быстро растёт?
  answer: Сравнить скорость producer и consumer, состояние соединений, ошибки обработки
    и redelivery, ограничения ресурсов брокера и время внешних зависимостей. Увеличение
    числа consumers поможет только если обработка допускает параллелизм и узкое место
    не в общей БД.
  category: Эксплуатация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ba9d0596-7e2b-4206-845c-e014e7a9e04d
  question: Что происходит при переполнении address в Artemis и почему это нужно настраивать
    заранее?
  answer: 'После достижения лимита address-size Artemis применяет настроенную address-full-policy:
    может начать paging на диск, блокировать producer или отклонять сообщения. Поведение
    влияет на задержки и доступность; его нужно проверять под нагрузкой и мониторить
    дисковое пространство.'
  category: Нагрузка и хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8c61b27f-3aef-4a76-a3fc-86a7366d829d
  question: Как duplicate detection в Artemis помогает при повторной отправке сообщения?
  answer: 'Producer задаёт специальный идентификатор дубликата, и broker может распознать
    повторную отправку по своему кэшу идентификаторов. Это снижает число дублей, но
    не заменяет идемпотентную бизнес-обработку: кэш конечен и действуют настройки
    брокера.'
  category: Надёжность доставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4889fa37-f975-43b1-bd9d-40d36e041910
  question: Для чего в Artemis нужна scheduled delivery?
  answer: 'Сообщение можно запланировать к доставке не раньше заданного времени, например
    для отложенной обработки. Это механизм задержки, а не гарантия точного времени
    выполнения бизнес-операции: влияют нагрузка и доступность consumer.'
  category: Доставка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 73261fc7-1c5b-491b-8ea6-7f633d84f221
  question: Можно ли использовать один JMS Session одновременно из нескольких потоков?
  answer: Нет, JMS Session рассчитан на однопоточное последовательное использование.
    Для параллельной обработки нужны отдельные сессии или контейнер слушателей, который
    управляет ими; совместное использование может нарушить контракт API.
  category: JMS API
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eacbc83d-00ab-4a64-8504-52c6327e42f9
  question: Чем durable subscription к topic отличается от обычной очереди для группы
    обработчиков?
  answer: Durable subscription сохраняет сообщения topic для конкретной подписки даже
    во время отсутствия подписчика. Очередь хранит задания для конкурирующих consumers;
    выбор зависит от того, должны ли независимые подписчики получить собственную копию
    события.
  category: Модель подписки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
