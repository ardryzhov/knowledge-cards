topic: "ArtemisMQ and JMS"
cards:
  - question: "Чем JMS Queue отличается от JMS Topic?"
    answer: "Queue предназначена для конкурирующих потребителей: конкретное сообщение обычно обрабатывает один из них. Topic предназначен для публикации нескольким подпискам, каждая из которых получает свою доставку согласно её настройкам. Поведение сохранения зависит от типа подписки."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что в Artemis означают address, queue и routing type?"
    answer: "Address принимает сообщения, queue хранит их для потребления, а routing type определяет, как сообщение направляется на очереди адреса. Это разные сущности: один address может быть связан с несколькими очередями."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем anycast отличается от multicast в Artemis?"
    answer: "Anycast направляет сообщение одной подходящей очереди адреса, реализуя point-to-point. Multicast направляет копию сообщения каждой подходящей очереди адреса, реализуя publish/subscribe. Выбор должен соответствовать требуемой модели потребления."
    category: "Маршрутизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему несколько consumers одной очереди не получают каждый свою копию сообщения?"
    answer: "Они конкурируют за сообщения из общей очереди, и брокер распределяет доставку. Если каждому потребителю нужна собственная копия, нужны отдельные очереди или подписки, например через multicast."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем подтверждать получение сообщения после успешной обработки?"
    answer: "Подтверждение сообщает брокеру, что сообщение больше не нужно доставлять этому потребителю. Если подтвердить до бизнес-эффекта, сбой может привести к потере обработки; если после, возможна повторная доставка, поэтому обработчик должен быть идемпотентным."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем AUTO_ACKNOWLEDGE отличается от CLIENT_ACKNOWLEDGE в JMS?"
    answer: "В AUTO_ACKNOWLEDGE подтверждение управляется JMS-провайдером по правилам вызова listener или receive. В CLIENT_ACKNOWLEDGE клиент вызывает acknowledge явно; детали границы подтверждения могут охватывать сообщения сессии, поэтому нужно понимать контракт провайдера."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что даёт transacted JMS Session?"
    answer: "Отправка и подтверждение сообщений в рамках JMS-сессии фиксируются при commit или откатываются при rollback. Это локальная транзакция брокера; она сама по себе не делает запись в PostgreSQL атомарной с JMS-операцией."
    category: "Потребители"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда Artemis повторно доставляет сообщение?"
    answer: "Повтор возможен после rollback, отсутствия подтверждения, сбоя соединения или по политике обработки ошибки. Приложение должно допускать дубликаты и отличать временные ошибки от постоянных."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем настраивать redelivery delay?"
    answer: "Пауза перед повтором даёт внешней системе восстановиться и предотвращает быстрый цикл ошибок, который нагружает брокер и сервис. Для постоянной ошибки нужны ограничение попыток и отдельная обработка."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Для чего нужна dead-letter address в Artemis?"
    answer: "После заданного числа безуспешных доставок брокер может переместить сообщение на адрес для проблемных сообщений. Это освобождает основную очередь, но требует мониторинга, диагностики причины и процедуры повторной обработки."
    category: "Ошибки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает TTL сообщения?"
    answer: "TTL ограничивает срок, в течение которого сообщение считается пригодным для доставки. После истечения брокер обрабатывает его согласно политике expiry. Если бизнес-операция не должна теряться, срок и дальнейшую судьбу сообщения нужно задать явно."
    category: "Время жизни"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем expiry address отличается от dead-letter address?"
    answer: "Expiry address принимает сообщения, срок жизни которых истёк. Dead-letter address обычно принимает сообщения после неудачных попыток доставки. Это разные причины выбытия из основной очереди и требуют разных действий оператора."
    category: "Время жизни"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем persistent message отличается от non-persistent в JMS?"
    answer: "Persistent delivery запрашивает сохранение сообщения с более сильными гарантиями переживания сбоя брокера в рамках конфигурации. Non-persistent обычно быстрее, но может потеряться при сбое. Фактические гарантии зависят от топологии и настроек брокера."
    category: "Надёжность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем нужна durable subscription для JMS Topic?"
    answer: "Она позволяет сохранять сообщения для подписки, когда её потребитель временно отключён, согласно правилам брокера и подписки. Недолговечная подписка обычно получает только сообщения, отправленные во время её активности."
    category: "Подписки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает JMS message selector?"
    answer: "Selector фильтрует сообщения по заголовкам и свойствам сообщения с SQL-подобным выражением. Он не предназначен для произвольного анализа тела; если маршрутизация зависит от поля, нужное значение следует вынести в свойство."
    category: "Фильтрация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем JMS properties отличаются от тела сообщения?"
    answer: "Тело содержит полезную нагрузку, а свойства — метаданные для маршрутизации, селекторов и обработки. Контракт должен определять имена и типы свойств так же строго, как формат тела."
    category: "Фильтрация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Гарантируется ли порядок завершения обработки сообщений при нескольких consumers одной очереди?"
    answer: "Даже если брокер выдаёт сообщения в определённом порядке, параллельные consumers могут завершать бизнес-операции в другом порядке. Если строгий порядок критичен, нужно ограничить параллелизм или разделить потоки по ключу и обеспечить подходящую схему маршрутизации."
    category: "Порядок"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему нельзя считать отправку JMS-сообщения и commit PostgreSQL одной транзакцией по умолчанию?"
    answer: "Они относятся к разным ресурсам. Успех одной стороны и сбой другой создают расхождение. Нужен осознанный механизм согласования, например outbox и идемпотентный потребитель, либо специально настроенная распределённая транзакция с её стоимостью."
    category: "Интеграция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие метрики важны для очереди Artemis?"
    answer: "Глубина очереди, возраст старейшего сообщения, скорость поступления и обработки, число повторных доставок и сообщений в dead-letter/expiry. Они показывают отставание и ошибки лучше, чем один показатель числа сообщений."
    category: "Эксплуатация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что проверить, если очередь Artemis быстро растёт?"
    answer: "Сравнить скорость producer и consumer, состояние соединений, ошибки обработки и redelivery, ограничения ресурсов брокера и время внешних зависимостей. Увеличение числа consumers поможет только если обработка допускает параллелизм и узкое место не в общей БД."
    category: "Эксплуатация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

