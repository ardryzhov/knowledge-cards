topic: "ArtemisMQ and JMS"
cards:
  - question: "Что происходит при переполнении address в Artemis и почему это нужно настраивать заранее?"
    answer: "После достижения лимита address-size Artemis применяет настроенную address-full-policy: может начать paging на диск, блокировать producer или отклонять сообщения. Поведение влияет на задержки и доступность; его нужно проверять под нагрузкой и мониторить дисковое пространство."
    category: "Нагрузка и хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как duplicate detection в Artemis помогает при повторной отправке сообщения?"
    answer: "Producer задаёт специальный идентификатор дубликата, и broker может распознать повторную отправку по своему кэшу идентификаторов. Это снижает число дублей, но не заменяет идемпотентную бизнес-обработку: кэш конечен и действуют настройки брокера."
    category: "Надёжность доставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Для чего в Artemis нужна scheduled delivery?"
    answer: "Сообщение можно запланировать к доставке не раньше заданного времени, например для отложенной обработки. Это механизм задержки, а не гарантия точного времени выполнения бизнес-операции: влияют нагрузка и доступность consumer."
    category: "Доставка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Можно ли использовать один JMS Session одновременно из нескольких потоков?"
    answer: "Нет, JMS Session рассчитан на однопоточное последовательное использование. Для параллельной обработки нужны отдельные сессии или контейнер слушателей, который управляет ими; совместное использование может нарушить контракт API."
    category: "JMS API"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем durable subscription к topic отличается от обычной очереди для группы обработчиков?"
    answer: "Durable subscription сохраняет сообщения topic для конкретной подписки даже во время отсутствия подписчика. Очередь хранит задания для конкурирующих consumers; выбор зависит от того, должны ли независимые подписчики получить собственную копию события."
    category: "Модель подписки"
    context: null
