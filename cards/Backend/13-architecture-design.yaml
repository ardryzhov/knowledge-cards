- id: 822f5421-656d-47bb-8f45-69d9f30ae1f5
  question: Когда модульный монолит может быть лучше набора микросервисов?
  answer: Если команда и домен ещё меняются, модульный монолит даёт явные границы
    кода без сетевых отказов и распределённых транзакций. Выделение сервисов оправдано
    независимыми потребностями масштабирования, владения и развёртывания, а не только
    размером кодовой базы.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6670863d-d51c-4895-8675-176115a19a44
  question: По каким признакам выделять границу сервиса?
  answer: Смотрят на бизнес-ответственность, данные и инварианты, частоту совместных
    изменений и владельцев. Сервис должен иметь понятный контракт и автономную область
    данных; разрез по техническим слоям часто создаёт избыточные сетевые вызовы.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a55e84af-9812-4db9-adea-6988567b109b
  question: Что такое bounded context в DDD?
  answer: Это граница, внутри которой термины и модель предметной области имеют согласованный
    смысл. Один и тот же термин может означать разное в других контекстах. Интеграция
    между ними требует явного перевода моделей.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bdbab129-2adc-4025-835e-0229f4e07be5
  question: Почему общая БД между сервисами усиливает связанность?
  answer: Один сервис может напрямую зависеть от таблиц и миграций другого, обходя
    его API и инварианты. Изменение схемы требует синхронного согласования релизов.
    Владелец данных должен предоставлять контракт интеграции.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d44e4aa1-4c67-4f71-91a3-4d4f2ef2a318
  question: Какое правило зависимостей лежит в основе Clean или Hexagonal Architecture?
  answer: Бизнес-логика не должна зависеть от деталей транспорта, БД и фреймворка.
    Внешние адаптеры зависят от внутренних контрактов или реализуют их. Это облегчает
    тестирование и замену инфраструктуры, если границы выбраны разумно.
  category: Структура кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a769e39e-7a4a-4b8f-875a-c8ccb4d0f39f
  question: Зачем отделять domain model от DTO и JPA entity?
  answer: 'Каждая модель служит своему контракту: API, хранению или бизнес-инвариантам.
    Смешение приводит к утечке деталей БД наружу и усложняет изменение схемы или интерфейса.
    Для простого сервиса число моделей выбирают без избыточной церемонии.'
  category: Структура кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: adb43565-924c-42cc-b9a2-488d6ddc0a63
  question: Что означает принцип единственной ответственности класса в прикладном
    сервисе?
  answer: Класс должен иметь согласованную причину изменения. Если он одновременно
    валидирует HTTP, выполняет бизнес-правила, строит SQL и отправляет события, изменение
    одной части затрагивает остальные. Разделение помогает тестированию и сопровождению.
  category: Структура кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7c14ed9b-39a6-4bea-85ad-734cc49291ef
  question: Когда применять Strategy вместо длинной цепочки if по типам операций?
  answer: Если набор вариантов поведения должен расширяться и каждый вариант имеет
    отдельную логику, Strategy позволяет выбирать реализацию через общий контракт.
    Для двух простых стабильных веток обычный if может быть яснее.
  category: Структура кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8dc69679-97c7-4342-9728-146f0f936723
  question: Когда синхронный вызов сервиса уместнее события?
  answer: Когда вызывающему нужен ответ прямо сейчас для завершения операции и согласованной
    ошибки. Событие подходит для независимой последующей обработки. Выбор определяет
    задержку, связанность, обработку отказов и семантику результата.
  category: Интеграция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5ea73cc8-6ac7-4c2d-80c4-44610f257fd2
  question: Почему у внешнего API нужны таймауты и ограничение повторов?
  answer: Без таймаута запрос может удерживать ресурсы слишком долго. Неограниченные
    повторы усиливают сбой и могут дублировать побочный эффект. Бюджет времени и политика
    retry должны учитывать идемпотентность и SLO операции.
  category: Интеграция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 81ef0301-afb9-4fb9-8033-418346abe079
  question: Как проектировать обратную совместимость события при независимых релизах
    producer и consumer?
  answer: Некоторое время могут сосуществовать старые и новые версии. Добавляют необязательные
    поля, сохраняют смысл существующих, заранее согласуют удаление или переименование
    и тестируют потребителей на обеих версиях.
  category: Интеграция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8e89268e-1888-4029-a9ef-4f8e44281715
  question: Что такое aggregate в DDD и почему его граница связана с транзакцией?
  answer: Aggregate объединяет сущности и value objects, чьи инварианты должны поддерживаться
    вместе. Одна транзакция обычно изменяет один aggregate; взаимодействие между aggregate
    часто требует асинхронного согласования. Границу выбирают по реальным бизнес-правилам.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: f82451b4-bd55-4ab2-9e34-a513e9c8d8bd
  question: Почему нельзя рассчитывать на одну ACID-транзакцию для нескольких независимых
    сервисов?
  answer: У каждого сервиса своё хранилище и жизненный цикл, поэтому общая локальная
    транзакция отсутствует. Распределённая координация возможна, но дорога и усложняет
    доступность; чаще применяют явные процессы и eventual consistency.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f41b633f-23e1-4bb2-bef8-b6e6e33d6c9e
  question: Какие нефункциональные требования нужно уточнить до выбора архитектуры?
  answer: Ожидаемая нагрузка, задержка, доступность, объём данных, безопасность, аудит,
    восстановление и ограничения интеграций. Без конкретных чисел и сценариев невозможно
    обоснованно сравнить варианты.
  category: Качество
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 37f26ee1-f92c-4185-9ec8-f7959b4b917c
  question: Что такое ADR и когда его полезно писать?
  answer: Architecture Decision Record фиксирует контекст, выбранное решение, альтернативы
    и последствия. Он полезен для значимых решений, к которым команда вернётся при
    изменении требований, а не для каждой строки кода.
  category: Качество
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 03cd0365-bb95-4613-aa04-f5b7ed0ccf08
  question: Чем горизонтальное масштабирование stateless-сервиса упрощается по сравнению
    со stateful?
  answer: Экземпляры stateless-сервиса не держат уникальное состояние сессии в памяти,
    поэтому нагрузку легче распределять между ними и заменять экземпляры. Состояние
    при этом должно храниться в подходящей внешней системе с собственными ограничениями.
  category: Масштабирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0e2b862d-0f34-4a69-925a-0a353e705ba7
  question: Почему кэш может нарушить ожидаемую свежесть данных?
  answer: Кэш хранит копию, которая может отстать от источника после обновления. Нужно
    определить допустимую задержку, TTL или инвалидацию и поведение при промахе. Ускорение
    чтения не должно скрывать нарушение бизнес-инварианта.
  category: Масштабирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b38aa61f-4983-4ed1-abb6-b61af9e8eefa
  question: Как проектировать деградацию сервиса при недоступности необязательной
    зависимости?
  answer: Разделить критичные и необязательные функции, поставить таймауты и пределы
    ресурсов, предусмотреть ограниченный fallback там, где он сохраняет корректность.
    Нельзя возвращать ложный успех вместо явно недоступной критичной операции.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a200cbb7-75a1-47e4-85bc-08b4b33d40c4
  question: Почему архитектурное решение должно включать метрики и трассировку ключевого
    сценария?
  answer: Без наблюдения команда не увидит, выполняется ли требование по задержке
    и где возник сбой в цепочке сервисов. Метрики, логи и trace-id следует проектировать
    вместе с интеграциями, а не после инцидента.
  category: Наблюдаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d0e3857d-ac2c-4d45-ba8f-43e175a1a5ab
  question: Как обосновать выбор между двумя архитектурными вариантами на интервью?
  answer: Назвать требования и ограничения, сравнить варианты по согласованности,
    сложности, отказам, стоимости и эволюции, затем выбрать подходящий под сценарий.
    Важна проверяемая причина выбора и признание последствий, а не список модных паттернов.
  category: Компромиссы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 28e19fc2-381f-45ff-a55a-6872c3336caf
  question: Что такое anti-corruption layer при интеграции с чужой доменной моделью?
  answer: Это слой преобразования внешних данных и терминов в собственную модель сервиса.
    Он удерживает детали чужого API вне доменной логики и уменьшает цену изменения
    интеграции.
  category: Границы системы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 584d741c-8e29-468b-91a9-9ef7bb79f2ae
  question: Почему CAP theorem нельзя использовать как выбор любых двух из трёх свойств
    для обычного сервиса?
  answer: 'CAP описывает поведение распределённой системы во время сетевого разделения:
    тогда приходится выбирать между доступностью запроса и согласованностью в заданном
    смысле. Без разделения такой выбор не описывает все архитектурные компромиссы;
    нужно отдельно определять модель согласованности и требования к отказам.'
  category: Распределённые системы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 62c1c505-a4b3-4657-bf2a-f4a1b42a76d7
  question: Как оценить требуемую пропускную способность и запас для нового сервиса
    до выбора архитектуры?
  answer: Начинают с ожидаемого числа запросов и событий, пикового коэффициента, объёма
    данных, задержек зависимостей и целевых SLO. Затем оценивают нагрузку на БД и
    брокер, проверяют предположения измерениями и нагрузочным тестом; цифры без сценариев
    и ограничений мало полезны.
  category: Нефункциональные требования
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eef7e87c-59e6-4cab-a638-30c27f156707
  question: Зачем разделять команду и событие в интеграции сервисов?
  answer: Команда адресует конкретному обработчику просьбу выполнить действие, а событие
    сообщает об уже произошедшем факте и может иметь нескольких подписчиков. Смешение
    семантики затрудняет ответственность за отказ, повтор и версионирование.
  category: Интеграционная архитектура
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7a1eaf63-b2f7-4778-b866-d28829acec19
  question: Чем локальный кэш Java-сервиса отличается от общего распределённого кэша?
  answer: Локальный кэш быстрый и не требует сетевого вызова, но у разных экземпляров
    данные могут расходиться. Общий кэш облегчает разделение данных между экземплярами,
    но добавляет сетевую зависимость и требует продуманной обработки отказа.
  category: Кэширование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fa95f6a5-14d4-4748-8548-b4b4c95f7b94
  question: Почему TTL сам по себе не гарантирует свежесть данных в кэше?
  answer: До истечения TTL запись может оставаться устаревшей после изменения источника.
    Нужно определить допустимую задержку обновления и выбрать инвалидирование, обновление
    по событию или более короткий срок для критичных данных.
  category: Кэширование
  context: 
