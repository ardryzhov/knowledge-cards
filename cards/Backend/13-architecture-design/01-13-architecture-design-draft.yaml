topic: "Architecture and Design"
cards:
  - question: "Когда модульный монолит может быть лучше набора микросервисов?"
    answer: "Если команда и домен ещё меняются, модульный монолит даёт явные границы кода без сетевых отказов и распределённых транзакций. Выделение сервисов оправдано независимыми потребностями масштабирования, владения и развёртывания, а не только размером кодовой базы."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "По каким признакам выделять границу сервиса?"
    answer: "Смотрят на бизнес-ответственность, данные и инварианты, частоту совместных изменений и владельцев. Сервис должен иметь понятный контракт и автономную область данных; разрез по техническим слоям часто создаёт избыточные сетевые вызовы."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое bounded context в DDD?"
    answer: "Это граница, внутри которой термины и модель предметной области имеют согласованный смысл. Один и тот же термин может означать разное в других контекстах. Интеграция между ними требует явного перевода моделей."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему общая БД между сервисами усиливает связанность?"
    answer: "Один сервис может напрямую зависеть от таблиц и миграций другого, обходя его API и инварианты. Изменение схемы требует синхронного согласования релизов. Владелец данных должен предоставлять контракт интеграции."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какое правило зависимостей лежит в основе Clean или Hexagonal Architecture?"
    answer: "Бизнес-логика не должна зависеть от деталей транспорта, БД и фреймворка. Внешние адаптеры зависят от внутренних контрактов или реализуют их. Это облегчает тестирование и замену инфраструктуры, если границы выбраны разумно."
    category: "Структура кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем отделять domain model от DTO и JPA entity?"
    answer: "Каждая модель служит своему контракту: API, хранению или бизнес-инвариантам. Смешение приводит к утечке деталей БД наружу и усложняет изменение схемы или интерфейса. Для простого сервиса число моделей выбирают без избыточной церемонии."
    category: "Структура кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает принцип единственной ответственности класса в прикладном сервисе?"
    answer: "Класс должен иметь согласованную причину изменения. Если он одновременно валидирует HTTP, выполняет бизнес-правила, строит SQL и отправляет события, изменение одной части затрагивает остальные. Разделение помогает тестированию и сопровождению."
    category: "Структура кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда применять Strategy вместо длинной цепочки if по типам операций?"
    answer: "Если набор вариантов поведения должен расширяться и каждый вариант имеет отдельную логику, Strategy позволяет выбирать реализацию через общий контракт. Для двух простых стабильных веток обычный if может быть яснее."
    category: "Структура кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда синхронный вызов сервиса уместнее события?"
    answer: "Когда вызывающему нужен ответ прямо сейчас для завершения операции и согласованной ошибки. Событие подходит для независимой последующей обработки. Выбор определяет задержку, связанность, обработку отказов и семантику результата."
    category: "Интеграция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему у внешнего API нужны таймауты и ограничение повторов?"
    answer: "Без таймаута запрос может удерживать ресурсы слишком долго. Неограниченные повторы усиливают сбой и могут дублировать побочный эффект. Бюджет времени и политика retry должны учитывать идемпотентность и SLO операции."
    category: "Интеграция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как проектировать обратную совместимость события при независимых релизах producer и consumer?"
    answer: "Некоторое время могут сосуществовать старые и новые версии. Добавляют необязательные поля, сохраняют смысл существующих, заранее согласуют удаление или переименование и тестируют потребителей на обеих версиях."
    category: "Интеграция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое aggregate в DDD и почему его граница связана с транзакцией?"
    answer: "Aggregate объединяет сущности и value objects, чьи инварианты должны поддерживаться вместе. Одна транзакция обычно изменяет один aggregate; взаимодействие между aggregate часто требует асинхронного согласования. Границу выбирают по реальным бизнес-правилам."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

  - question: "Почему нельзя рассчитывать на одну ACID-транзакцию для нескольких независимых сервисов?"
    answer: "У каждого сервиса своё хранилище и жизненный цикл, поэтому общая локальная транзакция отсутствует. Распределённая координация возможна, но дорога и усложняет доступность; чаще применяют явные процессы и eventual consistency."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие нефункциональные требования нужно уточнить до выбора архитектуры?"
    answer: "Ожидаемая нагрузка, задержка, доступность, объём данных, безопасность, аудит, восстановление и ограничения интеграций. Без конкретных чисел и сценариев невозможно обоснованно сравнить варианты."
    category: "Качество"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое ADR и когда его полезно писать?"
    answer: "Architecture Decision Record фиксирует контекст, выбранное решение, альтернативы и последствия. Он полезен для значимых решений, к которым команда вернётся при изменении требований, а не для каждой строки кода."
    category: "Качество"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем горизонтальное масштабирование stateless-сервиса упрощается по сравнению со stateful?"
    answer: "Экземпляры stateless-сервиса не держат уникальное состояние сессии в памяти, поэтому нагрузку легче распределять между ними и заменять экземпляры. Состояние при этом должно храниться в подходящей внешней системе с собственными ограничениями."
    category: "Масштабирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему кэш может нарушить ожидаемую свежесть данных?"
    answer: "Кэш хранит копию, которая может отстать от источника после обновления. Нужно определить допустимую задержку, TTL или инвалидацию и поведение при промахе. Ускорение чтения не должно скрывать нарушение бизнес-инварианта."
    category: "Масштабирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как проектировать деградацию сервиса при недоступности необязательной зависимости?"
    answer: "Разделить критичные и необязательные функции, поставить таймауты и пределы ресурсов, предусмотреть ограниченный fallback там, где он сохраняет корректность. Нельзя возвращать ложный успех вместо явно недоступной критичной операции."
    category: "Надёжность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему архитектурное решение должно включать метрики и трассировку ключевого сценария?"
    answer: "Без наблюдения команда не увидит, выполняется ли требование по задержке и где возник сбой в цепочке сервисов. Метрики, логи и trace-id следует проектировать вместе с интеграциями, а не после инцидента."
    category: "Наблюдаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как обосновать выбор между двумя архитектурными вариантами на интервью?"
    answer: "Назвать требования и ограничения, сравнить варианты по согласованности, сложности, отказам, стоимости и эволюции, затем выбрать подходящий под сценарий. Важна проверяемая причина выбора и признание последствий, а не список модных паттернов."
    category: "Компромиссы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

