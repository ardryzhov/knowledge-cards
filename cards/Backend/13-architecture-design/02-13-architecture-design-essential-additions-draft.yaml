topic: "Architecture and Design"
cards:
  - question: "Что такое anti-corruption layer при интеграции с чужой доменной моделью?"
    answer: "Это слой преобразования внешних данных и терминов в собственную модель сервиса. Он удерживает детали чужого API вне доменной логики и уменьшает цену изменения интеграции."
    category: "Границы системы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему CAP theorem нельзя использовать как выбор любых двух из трёх свойств для обычного сервиса?"
    answer: "CAP описывает поведение распределённой системы во время сетевого разделения: тогда приходится выбирать между доступностью запроса и согласованностью в заданном смысле. Без разделения такой выбор не описывает все архитектурные компромиссы; нужно отдельно определять модель согласованности и требования к отказам."
    category: "Распределённые системы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как оценить требуемую пропускную способность и запас для нового сервиса до выбора архитектуры?"
    answer: "Начинают с ожидаемого числа запросов и событий, пикового коэффициента, объёма данных, задержек зависимостей и целевых SLO. Затем оценивают нагрузку на БД и брокер, проверяют предположения измерениями и нагрузочным тестом; цифры без сценариев и ограничений мало полезны."
    category: "Нефункциональные требования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем разделять команду и событие в интеграции сервисов?"
    answer: "Команда адресует конкретному обработчику просьбу выполнить действие, а событие сообщает об уже произошедшем факте и может иметь нескольких подписчиков. Смешение семантики затрудняет ответственность за отказ, повтор и версионирование."
    category: "Интеграционная архитектура"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

