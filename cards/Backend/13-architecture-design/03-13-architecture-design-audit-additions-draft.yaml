topic: "Architecture and Design"
cards:
  - question: "Чем локальный кэш Java-сервиса отличается от общего распределённого кэша?"
    answer: "Локальный кэш быстрый и не требует сетевого вызова, но у разных экземпляров данные могут расходиться. Общий кэш облегчает разделение данных между экземплярами, но добавляет сетевую зависимость и требует продуманной обработки отказа."
    category: "Кэширование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему TTL сам по себе не гарантирует свежесть данных в кэше?"
    answer: "До истечения TTL запись может оставаться устаревшей после изменения источника. Нужно определить допустимую задержку обновления и выбрать инвалидирование, обновление по событию или более короткий срок для критичных данных."
    category: "Кэширование"
