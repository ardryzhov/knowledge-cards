- id: 4978b32d-0755-4dc6-aff8-850f89884201
  question: Как Transactional Outbox устраняет проблему двойной записи в БД и брокер?
  answer: Бизнес-изменение и запись сообщения в outbox выполняются в одной транзакции
    БД. Отдельный процесс публикует запись в брокер; он может повторить публикацию
    после сбоя. Паттерн даёт согласованную фиксацию намерения, но не исключает дубликаты.
  category: Outbox
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 597f02b7-8aa1-473b-9537-fdb0855b6637
  question: Какие отказы нужно учитывать у процесса публикации outbox?
  answer: Он может упасть до отправки, после отправки до отметки в БД или при недоступности
    брокера. Во втором случае возникнет повторная публикация. Нужны мониторинг отставания,
    безопасный retry и идемпотентный потребитель.
  category: Outbox
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7f69cdd0-bea8-4f35-9c13-4b96ef1790ab
  question: Как Transactional Inbox помогает обработать повторную доставку?
  answer: Потребитель фиксирует идентификатор сообщения и бизнес-изменение в одной
    транзакции БД. Если идентификатор уже обработан, повтор не создаёт новый эффект.
    Уникальное ограничение защищает от конкурентных дублей.
  category: Inbox
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6095ee3a-8d81-4218-9e4a-4ed8ca3d05a1
  question: Почему проверка SELECT перед INSERT не защищает от дубликатов при конкуренции?
  answer: Два обработчика могут одновременно не найти запись и оба попытаться вставить
    её. Защиту должен завершать атомарный механизм БД, например UNIQUE и INSERT ...
    ON CONFLICT, а приложение должно корректно обработать конфликт.
  category: Идемпотентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 65e71e57-3c15-44d7-a207-80cb4d00398a
  question: Когда нужна Saga и что такое компенсация?
  answer: Saga координирует несколько локальных транзакций разных сервисов. При сбое
    последующие шаги останавливаются, а уже выполненные действия компенсируются отдельными
    бизнес-операциями. Компенсация не всегда возвращает мир в буквальное исходное
    состояние.
  category: Saga
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0e3f5320-317e-42ef-9efe-9031fb7d7bbb
  question: Чем orchestration Saga отличается от choreography?
  answer: При orchestration центральный координатор запускает шаги и знает состояние
    процесса. При choreography участники реагируют на события друг друга. Первый вариант
    даёт явный контроль, второй снижает центральную связанность, но цепочку сложнее
    отслеживать.
  category: Saga
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5c242472-f821-4515-8fe2-afed408e7182
  question: Когда retry уместен, а когда ухудшает ситуацию?
  answer: Retry помогает при временных сбоях, если операция безопасна для повтора.
    При постоянной ошибке или перегрузке он увеличивает нагрузку и задержку. Нужны
    ограничение попыток, backoff, jitter и общий бюджет времени.
  category: Retry
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 19d1630f-002e-4bc3-8ffc-fa883669e550
  question: Зачем добавлять jitter к exponential backoff?
  answer: Без случайного разброса множество клиентов повторят запросы одновременно
    и снова перегрузят зависимость. Jitter распределяет попытки во времени. Его применяют
    вместе с ограничением числа повторов.
  category: Retry
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5dd58370-d657-4b39-a351-2b5cd51a403d
  question: Что делает Circuit Breaker?
  answer: Он временно прекращает вызовы зависимости после серии ошибок, быстро возвращая
    отказ или допустимый fallback. Затем ограниченно проверяет восстановление. Это
    защищает ресурсы вызывающего сервиса, но не исправляет зависимость.
  category: Circuit Breaker
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fbabc1bc-0a2a-4fab-8c26-eeee5b601362
  question: Как Bulkhead ограничивает каскадный отказ?
  answer: Он выделяет отдельные пулы или лимиты для разных типов работы, чтобы зависшая
    зависимость не заняла все потоки или соединения сервиса. Изоляция повышает устойчивость
    других сценариев ценой выделенных ресурсов.
  category: Bulkhead
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 829ef60a-e227-431f-8301-20774bcc6554
  question: Чем общий deadline отличается от отдельного таймаута каждого вызова?
  answer: Deadline ограничивает всю бизнес-операцию, включая повторы и цепочку зависимостей.
    Если каждому шагу дать полный таймаут, итоговое время может многократно превысить
    ожидание клиента. Оставшийся бюджет передают дальше.
  category: Timeout
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eab9e20d-a9c6-4223-91c6-f360c5a129c2
  question: Для чего нужна Dead Letter Queue и что в ней важно контролировать?
  answer: Она хранит сообщения, которые не удалось обработать после выбранной политики
    попыток. Нужны алерты, причина ошибки, процедура исправления и повторного запуска;
    сама DLQ не означает успешной обработки бизнес-события.
  category: DLQ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4a07aad8-ad73-478f-b730-c801d076d98a
  question: Как работает Cache-Aside при чтении?
  answer: Приложение сначала ищет значение в кэше, при промахе читает источник и кладёт
    результат в кэш. При изменении данных оно обновляет или инвалидирует запись по
    выбранной стратегии. Основной риск — устаревшие данные и гонки инвалидации.
  category: Cache-Aside
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 654c804d-4d75-47a6-b86d-07074054c21b
  question: Когда CQRS даёт пользу, а когда добавляет лишнюю сложность?
  answer: Разделение моделей записи и чтения помогает, когда у них разные требования
    к форме данных и масштабированию. Оно добавляет синхронизацию проекций и eventual
    consistency. Для простого CRUD обычно достаточно одной модели.
  category: CQRS
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5cd381ff-cb2a-4d0b-a178-80378dabee3b
  question: Чем Event Sourcing отличается от обычного хранения текущего состояния?
  answer: Источником истины становится последовательность доменных событий, из которой
    восстанавливают состояние. Это помогает аудиту и воспроизведению, но усложняет
    эволюцию событий, запросы и исправление ошибок. Не следует путать с простой публикацией
    событий из CRUD-сервиса.
  category: Event Sourcing
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 33e068ce-dfe2-4863-b147-0369251877e9
  question: Какие задачи решает API Gateway и чего он не должен делать?
  answer: Он может маршрутизировать внешние запросы, применять общую аутентификацию
    и ограничения, скрывать внутреннюю топологию. Если поместить в него бизнес-логику
    разных сервисов, он станет узким местом и источником сильной связанности.
  category: API Gateway
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 186f2d81-c063-446d-8420-44c37378a749
  question: Зачем Service Discovery в динамической инфраструктуре?
  answer: Экземпляры сервисов появляются, исчезают и меняют адреса. Discovery позволяет
    находить актуальные endpoints через платформу или реестр вместо жёстко прописанных
    IP. Доступность найденной цели всё равно нужно проверять.
  category: Service Discovery
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 905541ec-ef08-404f-9de8-3e5859e02170
  question: Чем rate limiting отличается от backpressure?
  answer: Rate limiting ограничивает число запросов или сообщений по политике, например
    на клиента. Backpressure позволяет потребителю сигнализировать или ограничивать
    скорость производителя согласно своей способности обрабатывать поток. Оба защищают
    систему, но действуют на разных уровнях.
  category: Rate Limiting
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3723cfec-9c34-4807-b4fc-c309226127df
  question: Для чего используют sidecar рядом с приложением?
  answer: Отдельный контейнер или процесс предоставляет вспомогательную функцию, например
    proxy, сбор телеметрии или обновление секретов, без встраивания её в код приложения.
    Это добавляет ресурсы и операционную сложность.
  category: Sidecar
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 189e58c4-7104-4d01-a3e7-3cd642186c2d
  question: Как Strangler Pattern помогает постепенно заменить старую систему?
  answer: Трафик или функции по частям переводят на новый компонент через стабильную
    границу, пока старая система продолжает работать. Нужны наблюдаемость, маршрутизация
    и план вывода старого кода; иначе временная двойная архитектура закрепится надолго.
  category: Strangler
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 50b895e1-c646-4740-988e-67b26b56cea0
  question: Чем публикация outbox через polling отличается от CDC?
  answer: Polling периодически читает непрочитанные записи таблицы; CDC получает изменения
    из журнала БД. Polling проще внедрить, но создаёт запросы и задержку; CDC снижает
    потребность в опросе, но добавляет инфраструктуру и требования к обработке позиции
    в журнале. Оба способа должны учитывать повторную публикацию.
  category: Transactional Outbox
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7df8c6f2-fcfa-4d48-8263-378306b14029
  question: Почему компенсация в Saga не равна откату транзакции БД?
  answer: Компенсация — новая бизнес-операция, которая может выполниться позже, быть
    частичной или сама завершиться ошибкой. Для неё нужны идемпотентность, повторы
    и состояние процесса, а некоторые действия вообще невозможно полностью отменить.
  category: Saga
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dbdbc92d-ea3e-4d80-9e08-5b9302cde2ce
  question: Что такое cache stampede и как его сдержать?
  answer: При истечении популярной записи много запросов одновременно идут к источнику
    данных и перегружают его. Помогают single-flight или блокировка на ключ, разнесённый
    TTL, предварительное обновление либо stale-while-revalidate в допустимых сценариях.
  category: Кэширование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 12b31509-f68b-4885-8cef-6a267a12c24e
  question: Почему retry budget полезнее неограниченных повторов с backoff?
  answer: Даже с паузами повторы увеличивают нагрузку на больную зависимость и могут
    продлить отказ. Бюджет ограничивает число или долю повторных попыток, а общий
    deadline не позволяет им выйти за допустимое время запроса.
  category: Повторы и таймауты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d2734ec0-9d74-4654-a5ad-080fe1279189
  question: Почему срок хранения ключей дедупликации должен быть связан с окном повторной
    доставки?
  answer: Если ключ удалить раньше возможного повтора сообщения, старый дубликат пройдёт
    как новый. Нужно учитывать retention брокера, задержки retry и ручное переигрывание;
    бесконечное хранение ключей тоже имеет цену.
  category: Идемпотентность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9a43bb6a-0df9-471e-bbd5-a37b398c2afb
  question: Как менять формат события так, чтобы producer и consumer можно было разворачивать
    независимо?
  answer: Добавлять поля совместимо, заранее поддерживать старую и новую формы, затем
    переключать producer и лишь после этого удалять старую поддержку. Для обязательных
    или семантически изменённых полей нужен явный план версионирования и проверка
    контрактов.
  category: Версионирование событий
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
