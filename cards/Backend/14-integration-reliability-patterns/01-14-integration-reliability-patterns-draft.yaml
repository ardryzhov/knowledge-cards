topic: "Integration and Reliability Patterns"
cards:
  - question: "Как Transactional Outbox устраняет проблему двойной записи в БД и брокер?"
    answer: "Бизнес-изменение и запись сообщения в outbox выполняются в одной транзакции БД. Отдельный процесс публикует запись в брокер; он может повторить публикацию после сбоя. Паттерн даёт согласованную фиксацию намерения, но не исключает дубликаты."
    category: "Outbox"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие отказы нужно учитывать у процесса публикации outbox?"
    answer: "Он может упасть до отправки, после отправки до отметки в БД или при недоступности брокера. Во втором случае возникнет повторная публикация. Нужны мониторинг отставания, безопасный retry и идемпотентный потребитель."
    category: "Outbox"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как Transactional Inbox помогает обработать повторную доставку?"
    answer: "Потребитель фиксирует идентификатор сообщения и бизнес-изменение в одной транзакции БД. Если идентификатор уже обработан, повтор не создаёт новый эффект. Уникальное ограничение защищает от конкурентных дублей."
    category: "Inbox"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему проверка SELECT перед INSERT не защищает от дубликатов при конкуренции?"
    answer: "Два обработчика могут одновременно не найти запись и оба попытаться вставить её. Защиту должен завершать атомарный механизм БД, например UNIQUE и INSERT ... ON CONFLICT, а приложение должно корректно обработать конфликт."
    category: "Идемпотентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда нужна Saga и что такое компенсация?"
    answer: "Saga координирует несколько локальных транзакций разных сервисов. При сбое последующие шаги останавливаются, а уже выполненные действия компенсируются отдельными бизнес-операциями. Компенсация не всегда возвращает мир в буквальное исходное состояние."
    category: "Saga"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем orchestration Saga отличается от choreography?"
    answer: "При orchestration центральный координатор запускает шаги и знает состояние процесса. При choreography участники реагируют на события друг друга. Первый вариант даёт явный контроль, второй снижает центральную связанность, но цепочку сложнее отслеживать."
    category: "Saga"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда retry уместен, а когда ухудшает ситуацию?"
    answer: "Retry помогает при временных сбоях, если операция безопасна для повтора. При постоянной ошибке или перегрузке он увеличивает нагрузку и задержку. Нужны ограничение попыток, backoff, jitter и общий бюджет времени."
    category: "Retry"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем добавлять jitter к exponential backoff?"
    answer: "Без случайного разброса множество клиентов повторят запросы одновременно и снова перегрузят зависимость. Jitter распределяет попытки во времени. Его применяют вместе с ограничением числа повторов."
    category: "Retry"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что делает Circuit Breaker?"
    answer: "Он временно прекращает вызовы зависимости после серии ошибок, быстро возвращая отказ или допустимый fallback. Затем ограниченно проверяет восстановление. Это защищает ресурсы вызывающего сервиса, но не исправляет зависимость."
    category: "Circuit Breaker"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как Bulkhead ограничивает каскадный отказ?"
    answer: "Он выделяет отдельные пулы или лимиты для разных типов работы, чтобы зависшая зависимость не заняла все потоки или соединения сервиса. Изоляция повышает устойчивость других сценариев ценой выделенных ресурсов."
    category: "Bulkhead"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем общий deadline отличается от отдельного таймаута каждого вызова?"
    answer: "Deadline ограничивает всю бизнес-операцию, включая повторы и цепочку зависимостей. Если каждому шагу дать полный таймаут, итоговое время может многократно превысить ожидание клиента. Оставшийся бюджет передают дальше."
    category: "Timeout"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Для чего нужна Dead Letter Queue и что в ней важно контролировать?"
    answer: "Она хранит сообщения, которые не удалось обработать после выбранной политики попыток. Нужны алерты, причина ошибки, процедура исправления и повторного запуска; сама DLQ не означает успешной обработки бизнес-события."
    category: "DLQ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как работает Cache-Aside при чтении?"
    answer: "Приложение сначала ищет значение в кэше, при промахе читает источник и кладёт результат в кэш. При изменении данных оно обновляет или инвалидирует запись по выбранной стратегии. Основной риск — устаревшие данные и гонки инвалидации."
    category: "Cache-Aside"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Когда CQRS даёт пользу, а когда добавляет лишнюю сложность?"
    answer: "Разделение моделей записи и чтения помогает, когда у них разные требования к форме данных и масштабированию. Оно добавляет синхронизацию проекций и eventual consistency. Для простого CRUD обычно достаточно одной модели."
    category: "CQRS"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем Event Sourcing отличается от обычного хранения текущего состояния?"
    answer: "Источником истины становится последовательность доменных событий, из которой восстанавливают состояние. Это помогает аудиту и воспроизведению, но усложняет эволюцию событий, запросы и исправление ошибок. Не следует путать с простой публикацией событий из CRUD-сервиса."
    category: "Event Sourcing"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Какие задачи решает API Gateway и чего он не должен делать?"
    answer: "Он может маршрутизировать внешние запросы, применять общую аутентификацию и ограничения, скрывать внутреннюю топологию. Если поместить в него бизнес-логику разных сервисов, он станет узким местом и источником сильной связанности."
    category: "API Gateway"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем Service Discovery в динамической инфраструктуре?"
    answer: "Экземпляры сервисов появляются, исчезают и меняют адреса. Discovery позволяет находить актуальные endpoints через платформу или реестр вместо жёстко прописанных IP. Доступность найденной цели всё равно нужно проверять."
    category: "Service Discovery"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем rate limiting отличается от backpressure?"
    answer: "Rate limiting ограничивает число запросов или сообщений по политике, например на клиента. Backpressure позволяет потребителю сигнализировать или ограничивать скорость производителя согласно своей способности обрабатывать поток. Оба защищают систему, но действуют на разных уровнях."
    category: "Rate Limiting"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Для чего используют sidecar рядом с приложением?"
    answer: "Отдельный контейнер или процесс предоставляет вспомогательную функцию, например proxy, сбор телеметрии или обновление секретов, без встраивания её в код приложения. Это добавляет ресурсы и операционную сложность."
    category: "Sidecar"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как Strangler Pattern помогает постепенно заменить старую систему?"
    answer: "Трафик или функции по частям переводят на новый компонент через стабильную границу, пока старая система продолжает работать. Нужны наблюдаемость, маршрутизация и план вывода старого кода; иначе временная двойная архитектура закрепится надолго."
    category: "Strangler"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

