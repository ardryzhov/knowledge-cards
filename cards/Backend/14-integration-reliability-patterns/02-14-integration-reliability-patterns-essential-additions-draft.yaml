topic: "Integration and Reliability Patterns"
cards:
  - question: "Чем публикация outbox через polling отличается от CDC?"
    answer: "Polling периодически читает непрочитанные записи таблицы; CDC получает изменения из журнала БД. Polling проще внедрить, но создаёт запросы и задержку; CDC снижает потребность в опросе, но добавляет инфраструктуру и требования к обработке позиции в журнале. Оба способа должны учитывать повторную публикацию."
    category: "Transactional Outbox"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему компенсация в Saga не равна откату транзакции БД?"
    answer: "Компенсация — новая бизнес-операция, которая может выполниться позже, быть частичной или сама завершиться ошибкой. Для неё нужны идемпотентность, повторы и состояние процесса, а некоторые действия вообще невозможно полностью отменить."
    category: "Saga"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое cache stampede и как его сдержать?"
    answer: "При истечении популярной записи много запросов одновременно идут к источнику данных и перегружают его. Помогают single-flight или блокировка на ключ, разнесённый TTL, предварительное обновление либо stale-while-revalidate в допустимых сценариях."
    category: "Кэширование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему retry budget полезнее неограниченных повторов с backoff?"
    answer: "Даже с паузами повторы увеличивают нагрузку на больную зависимость и могут продлить отказ. Бюджет ограничивает число или долю повторных попыток, а общий deadline не позволяет им выйти за допустимое время запроса."
    category: "Повторы и таймауты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему срок хранения ключей дедупликации должен быть связан с окном повторной доставки?"
    answer: "Если ключ удалить раньше возможного повтора сообщения, старый дубликат пройдёт как новый. Нужно учитывать retention брокера, задержки retry и ручное переигрывание; бесконечное хранение ключей тоже имеет цену."
    category: "Идемпотентность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как менять формат события так, чтобы producer и consumer можно было разворачивать независимо?"
    answer: "Добавлять поля совместимо, заранее поддерживать старую и новую формы, затем переключать producer и лишь после этого удалять старую поддержку. Для обязательных или семантически изменённых полей нужен явный план версионирования и проверка контрактов."
    category: "Версионирование событий"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

