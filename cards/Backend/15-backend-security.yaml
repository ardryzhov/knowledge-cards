- id: 96ccdc35-067e-4e7a-9afa-bfcce90cf477
  question: Чем аутентификация отличается от авторизации?
  answer: Аутентификация устанавливает, кто обращается к системе. Авторизация решает,
    имеет ли этот субъект право выполнить конкретное действие над конкретным ресурсом.
    Успешный вход не даёт автоматически доступ ко всем данным.
  category: Доступ
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 443a2945-9f1b-4f61-a8f7-2c27048cc259
  question: Почему проверка роли без проверки владельца ресурса может быть недостаточной?
  answer: Пользователь с ролью может получить чужой объект по известному ID, если
    не проверить предметное право на этот ресурс. Это вариант broken object level
    authorization; проверку выполняют на каждом доступе, а не только при отображении
    кнопки.
  category: Доступ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d692a777-fb43-4085-a02f-631bc2440875
  question: Что означает принцип наименьших привилегий для сервиса и его БД-пользователя?
  answer: Каждому компоненту дают только права, необходимые для его операций. Например,
    рабочему сервису не всегда нужны DDL-права, а токену интеграции — доступ ко всем
    API. Это ограничивает последствия ошибки или компрометации.
  category: Доступ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 151094fc-1603-4c80-872e-55e556802283
  question: Почему пароль нельзя хранить как простой SHA-256 хеш?
  answer: Быстрая функция позволяет атакующему проверять множество догадок в секунду.
    Для паролей используют специализированный медленный алгоритм с уникальной солью
    и параметрами стоимости, например Argon2id или bcrypt, с планом обновления параметров.
  category: Пароли
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d2fa4d9a-2886-40e4-af5e-97df8964e4d6
  question: Почему JWT нельзя считать зашифрованным только потому, что он выглядит
    как случайная строка?
  answer: Обычный подписанный JWT кодирует payload, который можно прочитать без секрета.
    Подпись защищает целостность, но не скрывает данные. В токен не помещают секреты
    и проверяют подпись, срок, аудиторию и издателя согласно контракту.
  category: Токены
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 326aa5c3-6acf-4b4e-a238-705b28f6a027
  question: Чем access token отличается от refresh token?
  answer: Access token предъявляется ресурсному серверу для короткого доступа. Refresh
    token служит для получения нового access token и требует более строгого хранения
    и политики отзыва. Конкретный формат и сроки зависят от системы авторизации.
  category: Токены
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5af98d2c-4918-4f7d-85d1-64e35ebeb60b
  question: Чем OAuth 2.0 отличается от OpenID Connect?
  answer: OAuth 2.0 задаёт механизм делегированного доступа к ресурсам. OpenID Connect
    добавляет слой аутентификации поверх OAuth, включая ID token и сведения о пользователе.
    Access token и ID token имеют разные аудитории и назначение.
  category: OAuth/OIDC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 994b5184-bd76-4e1b-bfd7-9d3c1682ab7a
  question: Что защищает TLS при обращении к backend API?
  answer: TLS шифрует и аутентифицирует канал между сторонами при корректной проверке
    сертификата. Он не исправляет ошибку авторизации внутри API и не гарантирует безопасность
    данных после получения на конечной стороне.
  category: Транспорт
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2ab616f5-16b2-4c63-b498-e41a90f165a3
  question: Почему параметризованный SQL защищает от SQL injection лучше ручного экранирования?
  answer: Параметры передаются отдельно от текста запроса, поэтому пользовательское
    значение не становится частью SQL-синтаксиса. Ручное экранирование легко ошибочно
    и зависит от контекста; динамические имена таблиц и колонок всё равно требуют
    whitelist.
  category: SQL injection
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bfb1a46b-0ffb-48c0-898d-f95c6af0bd3e
  question: Почему валидация DTO не заменяет авторизацию и бизнес-проверку?
  answer: DTO-валидация проверяет форму и простые ограничения входа. Она не отвечает,
    кому разрешена операция и выполняются ли доменные инварианты при текущем состоянии
    БД. Эти проверки размещают на соответствующих границах.
  category: Ввод
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 96d135dd-f235-4591-8216-3018bbc5cf79
  question: Что такое CSRF и когда защита особенно важна?
  answer: CSRF заставляет браузер авторизованного пользователя отправить нежелательный
    запрос с автоматически приложенными cookie. Защита важна для cookie-based сессий
    и state-changing запросов; схема с токеном в заголовке имеет другие предпосылки.
  category: Web
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4462d05b-90db-479e-81c1-e893aedccb95
  question: Почему CORS не является механизмом авторизации backend?
  answer: CORS ограничивает, какие browser-скрипты могут читать ответы другого origin.
    Небраузерный клиент может отправить запрос независимо от CORS. Сервер должен проверять
    личность и права отдельно.
  category: Web
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 97d38efd-ffa3-416d-af61-892dea6ae571
  question: Что такое SSRF в backend-сервисе?
  answer: Сервис выполняет исходящий запрос по адресу, частично управляемому пользователем,
    и может обратиться к внутренним узлам или метаданным инфраструктуры. Нужны ограничения
    допустимых назначений, проверка редиректов и сетевые политики.
  category: Сетевые атаки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bd6e6a1b-24b2-47ea-82e3-164a05359231
  question: Почему нельзя логировать токены, пароли и персональные данные для удобства
    диагностики?
  answer: Логи часто копируются в отдельные системы, доступны широкому кругу операторов
    и хранятся долго. Утечка через лог может быть не менее опасной, чем через API.
    Используют маскирование, корреляционные ID и минимально нужный контекст.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2fc20fa1-6c17-43e0-ab04-6c5c1d215a66
  question: Как хранить секреты приложения в разных средах?
  answer: Не включать их в код и репозиторий; передавать через управляемое хранилище
    секретов или защищённую конфигурацию с контролем доступа и ротацией. Переменные
    окружения тоже могут утечь через диагностику и требуют осторожности.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b33ef1c1-5cc3-4321-8e10-4afaff885af1
  question: Почему десериализация недоверенного Java-объекта опасна?
  answer: ObjectInputStream может создавать классы и запускать логику восстановления
    на основе входных байтов. Это создаёт риск выполнения нежелательного поведения.
    Для внешнего ввода выбирают ограниченный формат, whitelist типов и валидацию.
  category: Десериализация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 645dec7d-f91a-4eb5-8ed4-33f86cbec18f
  question: Что такое mass assignment при привязке JSON к объекту?
  answer: Клиент может прислать поля, которые не должен менять, например роль или
    статус, а автоматическое связывание сохранит их. Публичный DTO должен содержать
    только разрешённые поля, а сервер задаёт защищённые значения самостоятельно.
  category: Массовое присваивание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 324bbd5a-cb25-485f-acfb-95c921fe78b8
  question: Зачем rate limiting на публичном API?
  answer: Он ограничивает злоупотребление, перебор паролей и перегрузку дорогих операций.
    Политику выбирают по клиенту, ключу или ресурсу с учётом распределённой инфраструктуры;
    лимит не заменяет масштабирование и защиту на других слоях.
  category: Ограничение нагрузки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 145c75be-cdec-45c4-954c-5ccf8e9dbc4d
  question: Почему зависимость от известной уязвимой библиотеки остаётся риском даже
    при чистом собственном коде?
  answer: Код библиотеки исполняется с привилегиями приложения и может обрабатывать
    недоверенный ввод. Нужны инвентаризация зависимостей, своевременные обновления
    и проверка влияния уязвимости на конкретный сценарий.
  category: Зависимости
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e95ebfc7-d7ff-4502-985c-4bd0667f8230
  question: Чем аудит безопасности отличается от обычного технического лога?
  answer: 'Аудит фиксирует значимые действия субъекта: кто, что, когда и над каким
    ресурсом сделал, с защитой целостности и политикой хранения. Обычный лог прежде
    всего помогает диагностировать работу кода и может не удовлетворять требованиям
    расследования.'
  category: Аудит
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 189cee83-0a6c-4f04-a9a7-7dd94c535751
  question: Для чего PKCE в OAuth authorization code flow?
  answer: Клиент создаёт verifier и отправляет его хеш при запросе авторизации, а
    при обмене кода на токен предъявляет исходный verifier. Это связывает авторизационный
    код с начавшим вход клиентом и снижает риск использования перехваченного кода,
    особенно для публичных клиентов.
  category: OAuth и OIDC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b6bee735-376d-4b1b-99a3-2af049e0d337
  question: Что сервер должен проверить перед доверием к подписи JWT?
  answer: Нужно проверить подпись разрешённым алгоритмом и подходящим ключом, а также
    issuer, audience, срок действия и другие условия контракта. Нельзя выбирать алгоритм
    или ключ только по неподтверждённым данным токена без ограничений; обновление
    ключей требует обработки ротации.
  category: Токены
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: cf88ca7c-1a1d-428e-beb4-b40f09810886
  question: Зачем понимать порядок фильтров Spring Security при диагностике 401 и
    403?
  answer: Аутентификация и авторизация выполняются в цепочке фильтров до контроллера.
    401 обычно означает отсутствие или неуспех аутентификации, 403 — недостаточно
    прав у уже распознанного субъекта; точный ответ зависит от конфигурации фильтров
    и обработчиков ошибок.
  category: Spring Security
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f3ac55cb-3975-4b1b-b676-f8f2562cbe2a
  question: Почему SameSite cookie не отменяет необходимость анализа CSRF для браузерной
    сессии?
  answer: SameSite ограничивает отправку cookie в некоторых межсайтовых контекстах,
    но поведение зависит от режима, доменов и сценария запроса. Для операций с cookie-аутентификацией
    надо оценить источник запросов и при необходимости использовать CSRF-токен и другие
    меры.
  category: Веб-безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b7337e61-849b-407a-8e3e-36e75538c164
  question: Почему consumer сообщения должен проверять полномочия для бизнес-действия,
    даже если HTTP API уже защищён?
  answer: Сообщение может поступить из другого сервиса или быть переиграно; HTTP-фильтр
    не выполняется в асинхронном обработчике. Нужно установить доверенного отправителя
    и проверить право на действие либо явно определить сервисные полномочия, не принимая
    произвольный userId как доказательство доступа.
  category: Авторизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
