- id: db32d2b0-a79b-47c0-a6aa-4ff3a183e92e
  question: Как защитить webhook от подделки и повторного воспроизведения?
  answer: Проверять подпись сообщения по секрету или открытому ключу отправителя на
    исходных байтах, а также timestamp и уникальный идентификатор события в допустимом
    окне. Для защиты от повторной обработки хранить идентификатор и обеспечивать идемпотентность
    бизнес-операции.
  category: Интеграционная безопасность
  context: 
