topic: "Backend Security"
cards:
  - question: "Чем аутентификация отличается от авторизации?"
    answer: "Аутентификация устанавливает, кто обращается к системе. Авторизация решает, имеет ли этот субъект право выполнить конкретное действие над конкретным ресурсом. Успешный вход не даёт автоматически доступ ко всем данным."
    category: "Доступ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null

  - question: "Почему проверка роли без проверки владельца ресурса может быть недостаточной?"
    answer: "Пользователь с ролью может получить чужой объект по известному ID, если не проверить предметное право на этот ресурс. Это вариант broken object level authorization; проверку выполняют на каждом доступе, а не только при отображении кнопки."
    category: "Доступ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что означает принцип наименьших привилегий для сервиса и его БД-пользователя?"
    answer: "Каждому компоненту дают только права, необходимые для его операций. Например, рабочему сервису не всегда нужны DDL-права, а токену интеграции — доступ ко всем API. Это ограничивает последствия ошибки или компрометации."
    category: "Доступ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему пароль нельзя хранить как простой SHA-256 хеш?"
    answer: "Быстрая функция позволяет атакующему проверять множество догадок в секунду. Для паролей используют специализированный медленный алгоритм с уникальной солью и параметрами стоимости, например Argon2id или bcrypt, с планом обновления параметров."
    category: "Пароли"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему JWT нельзя считать зашифрованным только потому, что он выглядит как случайная строка?"
    answer: "Обычный подписанный JWT кодирует payload, который можно прочитать без секрета. Подпись защищает целостность, но не скрывает данные. В токен не помещают секреты и проверяют подпись, срок, аудиторию и издателя согласно контракту."
    category: "Токены"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем access token отличается от refresh token?"
    answer: "Access token предъявляется ресурсному серверу для короткого доступа. Refresh token служит для получения нового access token и требует более строгого хранения и политики отзыва. Конкретный формат и сроки зависят от системы авторизации."
    category: "Токены"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем OAuth 2.0 отличается от OpenID Connect?"
    answer: "OAuth 2.0 задаёт механизм делегированного доступа к ресурсам. OpenID Connect добавляет слой аутентификации поверх OAuth, включая ID token и сведения о пользователе. Access token и ID token имеют разные аудитории и назначение."
    category: "OAuth/OIDC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что защищает TLS при обращении к backend API?"
    answer: "TLS шифрует и аутентифицирует канал между сторонами при корректной проверке сертификата. Он не исправляет ошибку авторизации внутри API и не гарантирует безопасность данных после получения на конечной стороне."
    category: "Транспорт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему параметризованный SQL защищает от SQL injection лучше ручного экранирования?"
    answer: "Параметры передаются отдельно от текста запроса, поэтому пользовательское значение не становится частью SQL-синтаксиса. Ручное экранирование легко ошибочно и зависит от контекста; динамические имена таблиц и колонок всё равно требуют whitelist."
    category: "SQL injection"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему валидация DTO не заменяет авторизацию и бизнес-проверку?"
    answer: "DTO-валидация проверяет форму и простые ограничения входа. Она не отвечает, кому разрешена операция и выполняются ли доменные инварианты при текущем состоянии БД. Эти проверки размещают на соответствующих границах."
    category: "Ввод"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое CSRF и когда защита особенно важна?"
    answer: "CSRF заставляет браузер авторизованного пользователя отправить нежелательный запрос с автоматически приложенными cookie. Защита важна для cookie-based сессий и state-changing запросов; схема с токеном в заголовке имеет другие предпосылки."
    category: "Web"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему CORS не является механизмом авторизации backend?"
    answer: "CORS ограничивает, какие browser-скрипты могут читать ответы другого origin. Небраузерный клиент может отправить запрос независимо от CORS. Сервер должен проверять личность и права отдельно."
    category: "Web"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое SSRF в backend-сервисе?"
    answer: "Сервис выполняет исходящий запрос по адресу, частично управляемому пользователем, и может обратиться к внутренним узлам или метаданным инфраструктуры. Нужны ограничения допустимых назначений, проверка редиректов и сетевые политики."
    category: "Сетевые атаки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему нельзя логировать токены, пароли и персональные данные для удобства диагностики?"
    answer: "Логи часто копируются в отдельные системы, доступны широкому кругу операторов и хранятся долго. Утечка через лог может быть не менее опасной, чем через API. Используют маскирование, корреляционные ID и минимально нужный контекст."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Как хранить секреты приложения в разных средах?"
    answer: "Не включать их в код и репозиторий; передавать через управляемое хранилище секретов или защищённую конфигурацию с контролем доступа и ротацией. Переменные окружения тоже могут утечь через диагностику и требуют осторожности."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему десериализация недоверенного Java-объекта опасна?"
    answer: "ObjectInputStream может создавать классы и запускать логику восстановления на основе входных байтов. Это создаёт риск выполнения нежелательного поведения. Для внешнего ввода выбирают ограниченный формат, whitelist типов и валидацию."
    category: "Десериализация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Что такое mass assignment при привязке JSON к объекту?"
    answer: "Клиент может прислать поля, которые не должен менять, например роль или статус, а автоматическое связывание сохранит их. Публичный DTO должен содержать только разрешённые поля, а сервер задаёт защищённые значения самостоятельно."
    category: "Массовое присваивание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Зачем rate limiting на публичном API?"
    answer: "Он ограничивает злоупотребление, перебор паролей и перегрузку дорогих операций. Политику выбирают по клиенту, ключу или ресурсу с учётом распределённой инфраструктуры; лимит не заменяет масштабирование и защиту на других слоях."
    category: "Ограничение нагрузки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Почему зависимость от известной уязвимой библиотеки остаётся риском даже при чистом собственном коде?"
    answer: "Код библиотеки исполняется с привилегиями приложения и может обрабатывать недоверенный ввод. Нужны инвентаризация зависимостей, своевременные обновления и проверка влияния уязвимости на конкретный сценарий."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

  - question: "Чем аудит безопасности отличается от обычного технического лога?"
    answer: "Аудит фиксирует значимые действия субъекта: кто, что, когда и над каким ресурсом сделал, с защитой целостности и политикой хранения. Обычный лог прежде всего помогает диагностировать работу кода и может не удовлетворять требованиям расследования."
    category: "Аудит"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

