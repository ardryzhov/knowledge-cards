topic: "Backend Security"
cards:
  - question: "Для чего PKCE в OAuth authorization code flow?"
    answer: "Клиент создаёт verifier и отправляет его хеш при запросе авторизации, а при обмене кода на токен предъявляет исходный verifier. Это связывает авторизационный код с начавшим вход клиентом и снижает риск использования перехваченного кода, особенно для публичных клиентов."
    category: "OAuth и OIDC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что сервер должен проверить перед доверием к подписи JWT?"
    answer: "Нужно проверить подпись разрешённым алгоритмом и подходящим ключом, а также issuer, audience, срок действия и другие условия контракта. Нельзя выбирать алгоритм или ключ только по неподтверждённым данным токена без ограничений; обновление ключей требует обработки ротации."
    category: "Токены"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем понимать порядок фильтров Spring Security при диагностике 401 и 403?"
    answer: "Аутентификация и авторизация выполняются в цепочке фильтров до контроллера. 401 обычно означает отсутствие или неуспех аутентификации, 403 — недостаточно прав у уже распознанного субъекта; точный ответ зависит от конфигурации фильтров и обработчиков ошибок."
    category: "Spring Security"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему SameSite cookie не отменяет необходимость анализа CSRF для браузерной сессии?"
    answer: "SameSite ограничивает отправку cookie в некоторых межсайтовых контекстах, но поведение зависит от режима, доменов и сценария запроса. Для операций с cookie-аутентификацией надо оценить источник запросов и при необходимости использовать CSRF-токен и другие меры."
    category: "Веб-безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему consumer сообщения должен проверять полномочия для бизнес-действия, даже если HTTP API уже защищён?"
    answer: "Сообщение может поступить из другого сервиса или быть переиграно; HTTP-фильтр не выполняется в асинхронном обработчике. Нужно установить доверенного отправителя и проверить право на действие либо явно определить сервисные полномочия, не принимая произвольный userId как доказательство доступа."
    category: "Авторизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как защитить webhook от подделки и повторного воспроизведения?"
    answer: "Проверять подпись сообщения по секрету или открытому ключу отправителя на исходных байтах, а также timestamp и уникальный идентификатор события в допустимом окне. Для защиты от повторной обработки хранить идентификатор и обеспечивать идемпотентность бизнес-операции."
    category: "Интеграционная безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

