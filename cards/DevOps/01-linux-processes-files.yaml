- id: d83ba6e3-f4a0-410b-9057-24e8a614eb62
  question: Что показывают PID и PPID?
  answer: PID идентифицирует процесс, PPID — его родителя. Это помогает увидеть дерево
    процессов и выяснить, кто запустил сервис.
  category: Процессы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
