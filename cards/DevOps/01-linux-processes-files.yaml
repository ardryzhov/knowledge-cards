- id: 77102410-66b5-4790-b98c-eeb6f694fea9
  question: Что делает SIGINT и когда его обычно получает процесс?
  answer: SIGINT сигнализирует прерывание, обычно после Ctrl+C в терминале. Приложение
    может обработать его, в отличие от SIGKILL.
  category: Сигналы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
