- id: 01f93085-fee7-4b2a-bdfe-7ed2eaae0850
  question: Чем stdout/stderr процесса отличаются от journalctl?
  answer: stdout и stderr — потоки вывода; journald может собирать их вместе с метаданными
    юнита и времени, а journalctl читает журнал.
  category: Логи
