- id: 1d00b889-c8e8-451c-94d7-eba1a437d91c
  question: Что означают права rwx для файла и каталога?
  answer: 'Для файла: чтение, изменение и исполнение; для каталога: просмотр списка,
    изменение записей и проход по пути. Права на файл не заменяют право прохода по
    каталогам.'
  category: Права
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 458e2798-18d2-48b2-916c-6e5f7fc3a254
  question: Почему chmod 777 для исправления ошибки доступа опасен?
  answer: Он даёт всем пользователям запись и исполнение, скрывая неверного владельца
    или группу. Нужно определить нужного пользователя процесса и выдать минимальные
    права.
  category: Права
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 63bf42eb-3e2a-421f-aa17-15a6df151614
  question: Чем владелец файла отличается от группы в проверке доступа?
  answer: Unix сначала применяет права владельца, затем группы, затем остальных; разрешение
    зависит от идентичности процесса и пути к файлу.
  category: Права
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 18a0894c-0776-4634-bdc9-e209c83a3902
  question: Что показывает df и чем он отличается от du?
  answer: df показывает использование файловой системы, du — размер доступных файлов
    и каталогов. Расхождение бывает из-за удалённых, но ещё открытых файлов и особенностей
    ФС.
  category: Диск
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b75826b3-be7b-4594-ae80-d47b9c4cbd00
  question: Почему удаление большого лог-файла может не освободить место сразу?
  answer: 'Процесс может держать файл открытым: запись удалена из каталога, но блоки
    освободятся после закрытия дескриптора. Проверить можно lsof +L1.'
  category: Диск
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: cb32fda9-d1fb-4d29-b786-86b8b113b9d9
  question: Чем свободная память по free отличается от доступной?
  answer: Linux использует память под кэши; колонка available оценивает, сколько можно
    дать приложениям без сильного свопинга. Малое free само по себе не доказывает
    проблему.
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 078a487c-3086-4bea-8a38-356d8287b57f
  question: Что такое load average и почему оно не равно загрузке CPU?
  answer: Это среднее число задач, готовых к выполнению или ожидающих непрерываемого
    ввода-вывода, за интервалы времени. Для вывода о CPU нужно учитывать число ядер
    и I/O.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7c5c6ee9-42e4-48ee-9cc2-85c832a3d3ca
  question: Как отличить CPU-bound процесс от ожидания диска?
  answer: Сопоставить загрузку CPU, состояние потоков, iowait, счётчики диска и профиль
    процесса; один показатель load average недостаточен.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0f29f2f7-75a3-4fb6-948e-e5b154353231
  question: Зачем использовать tail -f при расследовании запуска сервиса?
  answer: Он показывает новые строки журнала по мере появления. Нужно также смотреть
    предыдущие сообщения, поскольку причина ошибки часто возникла до финального стека.
  category: Логи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e7f07032-b46e-41a5-89be-8810ad51b247
  question: Чем переменная окружения процесса отличается от shell-переменной?
  answer: Shell-переменная остаётся внутри оболочки; экспортированная переменная передаётся
    дочерним процессам. Существующий процесс не получает последующие изменения окружения
    родителя.
  category: Окружение
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 0a9d40ee-47ad-4220-82d7-14661abbb593
  question: Почему секрет в командной строке запуска может утечь?
  answer: Аргументы процесса могут быть видны через средства диагностики и журналы.
    Секреты передают утверждённым механизмом с ограничением доступа и срока жизни.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e817a335-9908-4640-8d06-02667b8ac63e
  question: Что такое файловый дескриптор и как проявляется его исчерпание?
  answer: Это номер открытого ресурса процесса, например файла или сокета. При достижении
    лимита новые файлы и соединения не открываются; нужно искать утечку и сверять
    лимиты.
  category: Ресурсы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 5ef6dfb5-9ffd-4fbd-8210-61e1bef39e39
  question: Как проверить, что приложение действительно слушает 0.0.0.0, а не только
    localhost?
  answer: Посмотреть адрес привязки через ss -ltnp внутри нужного namespace; 127.0.0.1
    принимает только локальные соединения, 0.0.0.0 — на доступных IPv4-интерфейсах.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 58b5640f-5207-4c3f-8a4b-851ec4c34f99
  question: Почему часы сервера важны для TLS и распределённой диагностики?
  answer: Сильный сдвиг времени нарушает проверку срока сертификатов и токенов и делает
    события разных сервисов трудно сопоставимыми. Нужна синхронизация времени.
  category: Время
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d5b54d6e-dac7-48c5-b27b-0bf263cafb4e
  question: Как быстро найти процесс, который потребляет CPU или память на Linux-хосте?
  answer: Использовать top или ps с сортировкой по ресурсу, затем проверить PID, команду,
    пользователя и динамику. Одного снимка недостаточно для вывода о причине.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 89f5f9a7-2023-4cb8-afff-39e69f6d6a44
  question: Почему команда работает от твоего пользователя, но падает под systemd?
  answer: У юнита могут быть другой пользователь, рабочий каталог, окружение, PATH,
    права и лимиты. Нужно сравнить фактический контекст запуска, а не только команду.
