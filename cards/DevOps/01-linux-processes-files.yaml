- id: b0fa4607-747e-44f6-8b53-ce00672d3f47
  question: Почему kill -9 не подходит как обычный способ остановки сервиса?
  answer: Он не даёт закрыть соединения, завершить запросы и сбросить буферы приложения.
    Сначала используют штатное завершение с ограниченным временем ожидания.
  category: Сигналы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
