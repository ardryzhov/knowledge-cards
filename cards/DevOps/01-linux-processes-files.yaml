- id: 9382b74d-4b58-47f3-aa6f-7f6b198b4fd4
  question: Чем процесс отличается от потока в Linux?
  answer: Процесс имеет собственное адресное пространство и ресурсы; потоки одного
    процесса разделяют память и многие ресурсы, но имеют отдельное выполнение и стек.
  category: Процессы
