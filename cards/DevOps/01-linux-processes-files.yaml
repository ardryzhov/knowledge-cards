- id: 8dc9f9b9-7b83-4f79-b95f-6ef56a0239c7
  question: Что означает код выхода процесса 0?
  answer: Успешное завершение по соглашению Unix; ненулевой код обычно сообщает об
    ошибке. Значение зависит от программы и важно для systemd и CI.
  category: Процессы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
