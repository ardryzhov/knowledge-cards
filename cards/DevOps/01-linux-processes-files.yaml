- id: 4751e325-1c8a-4832-b064-8d5ae7766f38
  question: Чем SIGTERM отличается от SIGKILL при остановке Java-сервиса?
  answer: SIGTERM можно обработать и завершить работу корректно; SIGKILL ядро исполняет
    принудительно, процесс не успеет выполнить shutdown hooks и очистку.
  category: Сигналы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
