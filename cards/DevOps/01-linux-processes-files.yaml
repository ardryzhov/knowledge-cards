- id: 1cb12457-8150-4917-81a9-011cbe0e54a5
  question: Как проверить, почему systemd-сервис не запустился?
  answer: Посмотреть systemctl status и journalctl -u для конкретного юнита; затем
    проверить код выхода, конфигурацию, зависимости, права и порт.
  category: systemd
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 62668ea9-f418-45cd-a058-568b7546359d
  question: Что systemd unit определяет для приложения?
  answer: Команду запуска, пользователя, окружение, зависимости, условия перезапуска
    и ограничения. Это декларативное описание жизненного цикла службы.
  category: systemd
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
