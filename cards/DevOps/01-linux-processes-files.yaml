- id: 1528d04e-6994-44b2-872b-215f6cbbd425
  question: Как найти процесс, слушающий заданный TCP-порт?
  answer: Использовать ss -ltnp или lsof -i с нужным портом и правами. Нужно отличать
    прослушивание локального адреса от доступности извне.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
