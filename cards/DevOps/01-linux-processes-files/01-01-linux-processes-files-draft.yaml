topic: "Linux: процессы, файлы и диагностика"
cards:
  - question: "Чем процесс отличается от потока в Linux?"
    answer: "Процесс имеет собственное адресное пространство и ресурсы; потоки одного процесса разделяют память и многие ресурсы, но имеют отдельное выполнение и стек."
    category: "Процессы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что показывают PID и PPID?"
    answer: "PID идентифицирует процесс, PPID — его родителя. Это помогает увидеть дерево процессов и выяснить, кто запустил сервис."
    category: "Процессы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем SIGTERM отличается от SIGKILL при остановке Java-сервиса?"
    answer: "SIGTERM можно обработать и завершить работу корректно; SIGKILL ядро исполняет принудительно, процесс не успеет выполнить shutdown hooks и очистку."
    category: "Сигналы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делает SIGINT и когда его обычно получает процесс?"
    answer: "SIGINT сигнализирует прерывание, обычно после Ctrl+C в терминале. Приложение может обработать его, в отличие от SIGKILL."
    category: "Сигналы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему kill -9 не подходит как обычный способ остановки сервиса?"
    answer: "Он не даёт закрыть соединения, завершить запросы и сбросить буферы приложения. Сначала используют штатное завершение с ограниченным временем ожидания."
    category: "Сигналы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает код выхода процесса 0?"
    answer: "Успешное завершение по соглашению Unix; ненулевой код обычно сообщает об ошибке. Значение зависит от программы и важно для systemd и CI."
    category: "Процессы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как найти процесс, слушающий заданный TCP-порт?"
    answer: "Использовать ss -ltnp или lsof -i с нужным портом и правами. Нужно отличать прослушивание локального адреса от доступности извне."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить, почему systemd-сервис не запустился?"
    answer: "Посмотреть systemctl status и journalctl -u для конкретного юнита; затем проверить код выхода, конфигурацию, зависимости, права и порт."
    category: "systemd"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что systemd unit определяет для приложения?"
    answer: "Команду запуска, пользователя, окружение, зависимости, условия перезапуска и ограничения. Это декларативное описание жизненного цикла службы."
    category: "systemd"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем stdout/stderr процесса отличаются от journalctl?"
    answer: "stdout и stderr — потоки вывода; journald может собирать их вместе с метаданными юнита и времени, а journalctl читает журнал."
    category: "Логи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что означают права rwx для файла и каталога?"
    answer: "Для файла: чтение, изменение и исполнение; для каталога: просмотр списка, изменение записей и проход по пути. Права на файл не заменяют право прохода по каталогам."
    category: "Права"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему chmod 777 для исправления ошибки доступа опасен?"
    answer: "Он даёт всем пользователям запись и исполнение, скрывая неверного владельца или группу. Нужно определить нужного пользователя процесса и выдать минимальные права."
    category: "Права"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем владелец файла отличается от группы в проверке доступа?"
    answer: "Unix сначала применяет права владельца, затем группы, затем остальных; разрешение зависит от идентичности процесса и пути к файлу."
    category: "Права"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что показывает df и чем он отличается от du?"
    answer: "df показывает использование файловой системы, du — размер доступных файлов и каталогов. Расхождение бывает из-за удалённых, но ещё открытых файлов и особенностей ФС."
    category: "Диск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему удаление большого лог-файла может не освободить место сразу?"
    answer: "Процесс может держать файл открытым: запись удалена из каталога, но блоки освободятся после закрытия дескриптора. Проверить можно lsof +L1."
    category: "Диск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем свободная память по free отличается от доступной?"
    answer: "Linux использует память под кэши; колонка available оценивает, сколько можно дать приложениям без сильного свопинга. Малое free само по себе не доказывает проблему."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое load average и почему оно не равно загрузке CPU?"
    answer: "Это среднее число задач, готовых к выполнению или ожидающих непрерываемого ввода-вывода, за интервалы времени. Для вывода о CPU нужно учитывать число ядер и I/O."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как отличить CPU-bound процесс от ожидания диска?"
    answer: "Сопоставить загрузку CPU, состояние потоков, iowait, счётчики диска и профиль процесса; один показатель load average недостаточен."
    category: "Производительность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем использовать tail -f при расследовании запуска сервиса?"
    answer: "Он показывает новые строки журнала по мере появления. Нужно также смотреть предыдущие сообщения, поскольку причина ошибки часто возникла до финального стека."
    category: "Логи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем переменная окружения процесса отличается от shell-переменной?"
    answer: "Shell-переменная остаётся внутри оболочки; экспортированная переменная передаётся дочерним процессам. Существующий процесс не получает последующие изменения окружения родителя."
    category: "Окружение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему секрет в командной строке запуска может утечь?"
    answer: "Аргументы процесса могут быть видны через средства диагностики и журналы. Секреты передают утверждённым механизмом с ограничением доступа и срока жизни."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое файловый дескриптор и как проявляется его исчерпание?"
    answer: "Это номер открытого ресурса процесса, например файла или сокета. При достижении лимита новые файлы и соединения не открываются; нужно искать утечку и сверять лимиты."
    category: "Ресурсы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, что приложение действительно слушает 0.0.0.0, а не только localhost?"
    answer: "Посмотреть адрес привязки через ss -ltnp внутри нужного namespace; 127.0.0.1 принимает только локальные соединения, 0.0.0.0 — на доступных IPv4-интерфейсах."
    category: "Сеть"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему часы сервера важны для TLS и распределённой диагностики?"
    answer: "Сильный сдвиг времени нарушает проверку срока сертификатов и токенов и делает события разных сервисов трудно сопоставимыми. Нужна синхронизация времени."
    category: "Время"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

