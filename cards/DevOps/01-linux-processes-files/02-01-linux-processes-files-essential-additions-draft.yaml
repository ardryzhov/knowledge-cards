topic: "Linux: процессы, файлы и диагностика"
cards:
  - question: "Как быстро найти процесс, который потребляет CPU или память на Linux-хосте?"
    answer: "Использовать top или ps с сортировкой по ресурсу, затем проверить PID, команду, пользователя и динамику. Одного снимка недостаточно для вывода о причине."
