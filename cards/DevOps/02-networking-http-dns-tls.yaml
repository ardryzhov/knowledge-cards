- id: 2a5a9379-4db6-4a2f-a42f-aa785f9590a1
  question: Чем connect timeout отличается от read timeout?
  answer: Connect timeout ограничивает установление соединения; read timeout ограничивает
    ожидание данных после соединения. Общий deadline охватывает всю операцию, включая
    повторы.
  category: Таймауты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c1c8b678-aacb-408b-9df1-cf57c6675df2
  question: Как отличить HTTP 502 от 504 при проблеме upstream?
  answer: 502 означает, что шлюз получил некорректный ответ от upstream; 504 — что
    не дождался его вовремя. Нужно изучить логи шлюза и зависимого сервиса.
  category: HTTP ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0bb7bf0b-cd1a-44eb-abc9-8d129e75ab83
  question: Зачем использовать curl -v при диагностике API?
  answer: Он показывает этапы соединения, TLS и HTTP-обмена; нужно не выводить секретные
    заголовки в общие журналы.
  category: Диагностика
  context: 
