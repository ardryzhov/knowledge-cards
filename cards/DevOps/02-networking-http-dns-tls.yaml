- id: 92565f3d-a234-4f64-a11a-efaa58aadeb2
  question: Чем 127.0.0.1 внутри контейнера отличается от адреса хоста?
  answer: Loopback относится к сетевому namespace контейнера или Pod. Он указывает
    на процессы внутри этого namespace, а не автоматически на машину-хост.
  category: Контейнерная сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 6e083729-7016-44ed-a728-343f36c7c7c9
  question: Что такое NAT и где он может встретиться при выходе Pod во внешнюю сеть?
  answer: NAT меняет адреса или порты в пакетах на сетевом пути. В Kubernetes исходящий
    трафик Pod может маскироваться адресом узла или шлюза в зависимости от CNI и инфраструктуры.
  category: Маршрутизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d5a280c5-baf6-48c9-953b-bb6bc67ecb10
  question: Чем L4-балансировка отличается от L7?
  answer: L4 маршрутизирует по сетевым адресам и портам, L7 понимает протокол приложения,
    например HTTP path или заголовки. Возможности и стоимость зависят от реализации.
  category: Балансировка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2d7b3a5c-7918-458c-b21f-b4398b50ce8d
  question: Что TLS проверяет при подключении к HTTPS-сервису?
  answer: Клиент проверяет цепочку доверия сертификата, имя сервера и срок действия;
    затем стороны устанавливают защищённое соединение. Отключение проверки сертификата
    убирает важную защиту.
  category: TLS
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 460991a2-ef03-4837-8924-16433544d0e9
  question: Что такое mTLS?
  answer: Обе стороны предъявляют и проверяют сертификаты, поэтому сервер аутентифицирует
    клиента на транспортном уровне. Авторизацию конкретной операции всё равно нужно
    определить отдельно.
  category: TLS
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 788c24bf-57ac-46a7-a7c3-b336f726ceed
  question: Почему сертификат может быть действительным по сроку, но соединение всё
    равно отклоняется?
  answer: Возможны несовпадение имени, недоверенный издатель, неполная цепочка, неподходящее
    использование ключа или ограничения протокола.
  category: TLS
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
