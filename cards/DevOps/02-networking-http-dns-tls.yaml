- id: af1f32f8-ce9e-4e73-98ce-60469be0b766
  question: Почему открытый TCP-порт не доказывает готовность приложения?
  answer: Сокет может принимать соединения, но приложение не закончило инициализацию
    или зависимая БД недоступна. Нужна проверка прикладного сценария или readiness.
