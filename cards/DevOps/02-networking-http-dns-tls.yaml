- id: 48e8f1ff-c091-429c-99e3-560245a54d00
  question: Что означает CIDR-нотация /24 для IPv4-сети?
  answer: Первые 24 бита адреса задают сетевой префикс; остаётся 8 бит для адресов
    внутри блока. Реально доступные адреса зависят от сети и её правил.
  category: IP
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 46310a5a-2b36-4124-b9fe-76549064a999
  question: Как понять, что проблема в прокси, а не в приложении?
  answer: Сравнить запрос напрямую и через прокси, коды и логи обоих уровней, адрес
    назначения и заголовки. При этом прямой путь может быть запрещён политикой сети.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
