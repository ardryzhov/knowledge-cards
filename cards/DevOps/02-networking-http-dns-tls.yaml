- id: c0f7ab53-902d-4b07-9794-a5081e698d40
  question: Что происходит при обращении клиента к https URL на уровне основных сетевых
    шагов?
  answer: Клиент получает IP через DNS, устанавливает TCP-соединение, согласует TLS
    и отправляет HTTP-запрос; прокси и балансировщики могут добавлять промежуточные
    шаги.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ab4366e5-c28e-4706-8c82-3b5fc52c50e4
  question: Чем IP-адрес отличается от TCP-порта?
  answer: IP указывает сетевой интерфейс узла, порт — приложение или сокет на этом
    узле в рамках протокола. Для соединения нужны адреса и порты обеих сторон.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 46183366-77c4-4a2f-8742-c6b069f0d8ca
  question: Зачем TCP нужен three-way handshake?
  answer: Стороны согласуют начальные номера последовательности и подтверждают взаимную
    достижимость перед передачей данных.
  category: TCP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: db44d1a4-ac9d-492b-924e-9008d45ff71b
  question: Чем TCP отличается от UDP для приложения?
  answer: TCP предоставляет упорядоченный поток байтов с подтверждениями и повторами;
    UDP передаёт датаграммы без встроенной гарантии доставки и порядка. Приложение
    выбирает нужную семантику.
  category: Транспорт
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 6b1a57ef-e377-474b-8429-0bd812cac16f
  question: Что означает состояние TCP TIME_WAIT?
  answer: Сторона, активно закрывшая соединение, временно сохраняет информацию о нём
    для корректной обработки запоздалых сегментов и завершения закрытия. Большое число
    TIME_WAIT не всегда ошибка.
  category: TCP
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: df32395f-fa52-4a89-8cbf-cc50ccf8d10d
  question: Почему успешный ping не доказывает доступность HTTP API?
  answer: ICMP отвечает только на отдельную сетевую проверку; TCP-порт, TLS, балансировщик
    и приложение могут быть недоступны. И наоборот, ICMP может быть запрещён при работающем
    API.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1881e3fe-70e4-4a14-9d45-b5c70a71bb2d
  question: Чем DNS A-запись отличается от CNAME?
  answer: A связывает имя с IPv4-адресом; CNAME задаёт алиас другого имени. Дальнейшее
    разрешение зависит от DNS и кэшей.
  category: DNS
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ab0410e7-9793-416a-94d5-24a27edd273a
  question: Почему изменение DNS-записи не становится мгновенно видимым всем клиентам?
  answer: Рекурсивные резолверы и клиенты кэшируют ответы по TTL и локальным правилам.
    Старые адреса могут использоваться до истечения кэша.
  category: DNS
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
