  question: Что проверить при ошибке «UnknownHost» внутри Pod?
  answer: Имя и namespace, DNS-конфигурацию Pod, наличие Service, CoreDNS, сетевые
    политики и состояние DNS-запросов; сначала сравнить поведение из того же Pod.
