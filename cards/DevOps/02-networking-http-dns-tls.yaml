- id: efb757f0-6827-4268-ab79-1d128b177588
  question: Чем HTTP Keep-Alive полезен сервису с частыми запросами?
  answer: Повторное использование соединения уменьшает стоимость установления TCP
    и TLS. Нужны настройки пула, таймаутов и поведения при закрытии соединения сервером.
  category: HTTP
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
