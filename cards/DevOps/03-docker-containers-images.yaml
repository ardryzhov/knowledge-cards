- id: 6fbada85-adfb-4fa6-8dc5-29b9e61a360c
  question: Что происходит при docker build с точки зрения слоёв?
  answer: Инструкции формируют слои и метаданные образа; изменённый вход инвалидирует
    зависимую часть кэша. Не каждая инструкция соответствует одному файловому слою
    в современном builder.
  category: Слои
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 476ef03f-ad7c-4f24-b510-7015a463fbd3
  question: Как проверить, под каким пользователем работает процесс в контейнере?
  answer: Посмотреть USER в образе, параметры запуска и фактический uid процесса.
    Наличие USER в Dockerfile может быть переопределено при запуске.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
