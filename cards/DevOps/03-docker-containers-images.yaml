- id: 42ae5d35-3b54-4349-afba-4ceea4901ccf
  question: Почему локально работающий Docker-образ может не запускаться в Kubernetes?
  answer: В кластере могут отличаться права, архитектура узла, настройки сети, секреты,
    ресурсы, writable filesystem и команда запуска.
