  hint_2: 
  difficulty: medium
  code: 
- id: 2b5d81a7-d2de-481f-8894-b8077fd5bfe7
  question: Почему тег latest опасен для релиза?
  answer: Он не говорит, какой именно образ запущен, и может указывать на новое содержимое.
    Это затрудняет воспроизведение и откат.
