- id: b2d624a2-0077-4875-8a18-59dae4a2479e
  question: Зачем запускать контейнер без root там, где возможно?
  answer: Это уменьшает последствия компрометации и случайных изменений в контейнере,
    хотя права хоста и политика runtime всё равно важны.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 091849e4-7028-45e4-86ff-f124b3b6ba77
  question: Чем publish порта отличается от EXPOSE в Dockerfile?
  answer: EXPOSE документирует ожидаемый порт приложения; publish создаёт доступ к
    порту контейнера через хост. Сам EXPOSE не публикует порт наружу.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ac0f234d-21f9-42e3-ab8e-5d45e6edf19a
  question: Как контейнеры одной Docker-сети находят друг друга?
  answer: Обычно по имени или alias через встроенное разрешение имён в пользовательской
    сети; доступность зависит от сети и настроек контейнеров.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8df31605-14a2-461a-ac83-d662b763770f
  question: Что нужно проверить, если контейнер сразу завершился?
  answer: Код выхода, docker logs, команду запуска, переменные, доступность файлов,
    права и ограничения памяти. Контейнер живёт, пока работает его главный процесс.
  category: Диагностика
  context: 
