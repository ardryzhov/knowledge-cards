- id: 9c752d80-3216-449c-9d88-9136806c468d
  question: Чем volume отличается от bind mount?
  answer: Volume управляется Docker и обычно отделён от конкретного пути хоста; bind
    mount подключает явный путь хоста. Правила хранения и доступа различаются.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: f009d09e-e9d7-4286-8b40-e83ebadb757f
  question: Что означает HEALTHCHECK в Dockerfile и равен ли он readiness в Kubernetes?
  answer: HEALTHCHECK задаёт проверку состояния контейнера для Docker; Kubernetes
    использует собственные probes. Наличие HEALTHCHECK не создаёт автоматически корректный
    readiness для Pod.
  category: Готовность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0e6d12a8-8ae2-4af7-9a53-9db7af8dd8f0
  question: Зачем сканировать базовый образ и зависимости перед релизом?
  answer: Образ может содержать уязвимые системные пакеты и библиотеки, даже если
    собственный код не изменился. Результаты нужно оценивать с учётом реальной применимости.
