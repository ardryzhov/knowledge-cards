- id: 97844fa4-96cf-46f3-9f82-1244d1b6fbe8
  question: Чем tag образа отличается от digest?
  answer: Tag — изменяемая метка; digest — идентификатор конкретного содержимого.
    Для воспроизводимого развёртывания надёжнее закреплять digest или неизменяемую
    политику тегов.
  category: Версии
  context: 
