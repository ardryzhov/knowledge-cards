- id: aa818d65-1573-4fa0-a5f3-925cdbded01b
  question: Как уменьшить размер Java-образа без потери диагностируемости?
  answer: Использовать подходящий runtime-образ или multi-stage сборку, исключить
    сборочные инструменты и лишние файлы, но сохранить необходимые CA-сертификаты
    и возможность диагностики.
