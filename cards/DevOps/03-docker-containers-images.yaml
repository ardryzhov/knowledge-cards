- id: 93667115-9820-4328-8209-4f536fdcc1fb
  question: Чем ENTRYPOINT отличается от CMD?
  answer: ENTRYPOINT задаёт основную исполняемую команду, CMD — её аргументы по умолчанию
    либо команду, если ENTRYPOINT нет. Фактическое поведение зависит от exec или shell
    формы.
  category: Запуск
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: cb89783f-eb2a-4c64-87f3-5e68e595bed3
  question: Почему exec-форма команды запуска полезна для Java-приложения?
  answer: Она запускает Java как основной процесс без лишней оболочки, что упрощает
    передачу сигналов и корректное завершение контейнера.
  category: Запуск
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 146457b0-8efd-4594-95b8-2d58d42be633
  question: Почему PID 1 в контейнере требует внимания?
  answer: Главный процесс получает сигналы остановки и отвечает за жизненный цикл;
    оболочка, которая не передаёт сигнал, может помешать graceful shutdown. При дочерних
    процессах нужен корректный reaping.
  category: Запуск
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: cf1c8a5b-29ae-4996-81ca-7f3f9cc58340
  question: Для чего нужен multi-stage build?
  answer: Сборка выполняется в одном этапе с инструментами, а в итоговый образ копируют
    только нужные артефакты. Это уменьшает размер и поверхность атаки.
  category: Сборка
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 128bde2c-d04e-4f32-b0ca-342319cbacfe
  question: Почему COPY исходников до загрузки зависимостей может замедлить повторную
    сборку?
  answer: Изменение исходников инвалидирует кэш последующих слоёв. Если сначала скопировать
    файлы зависимостей и выполнить их загрузку, пересборка кода чаще использует кэш.
  category: Слои
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 15fd5590-a917-4540-bbc7-55e9f24ea35b
  question: Что делает .dockerignore?
  answer: Исключает ненужные файлы из build context, уменьшая передачу данных и риск
    попадания секретов в сборку. Он не удаляет секреты, уже включённые в слои.
  category: Сборка
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 43e37c33-3edd-4f2b-b210-419cfe7685a3
  question: Почему нельзя хранить пароль в ARG или RUN Dockerfile?
  answer: Значение может попасть в метаданные, историю или слои образа и журналы сборки.
    Для доступа на этапе сборки применяют механизм временных build secrets.
  category: Секреты
  context: 
