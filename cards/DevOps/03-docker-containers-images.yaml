- id: 7d105e4f-d55c-481f-a073-2131bf5e45e5
  question: Чем контейнер отличается от виртуальной машины?
  answer: Контейнер изолирует процессы с помощью механизмов ядра и обычно разделяет
    ядро хоста; виртуальная машина запускает гостевую ОС на виртуализированном оборудовании.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 7da9bf04-20d2-4462-986f-e080fac7c848
  question: Чем image отличается от container?
  answer: Image — неизменяемый шаблон файловой системы и метаданных; container — запущенный
    или остановленный экземпляр image с собственным изменяемым слоем и состоянием.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: fd46d802-a8f7-40c7-88cd-fd07eaca6cc1
  question: Как namespaces и cgroups участвуют в работе контейнера?
  answer: Namespaces изолируют видимость процессов, сети и других ресурсов; cgroups
    учитывают и ограничивают потребление ресурсов. Контейнер не является полноценной
    границей безопасности сам по себе.
  category: Изоляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 331f276a-0338-42e5-865c-979bf947a83c
  question: Почему данные в writable layer контейнера не стоит использовать как постоянное
    хранилище?
  answer: Этот слой привязан к экземпляру и теряется при его замене. Постоянные данные
    размещают в volume или внешнем хранилище с понятным резервированием.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 55950194-77d8-4cd1-bd1e-5eb9270a42dd
  question: Для чего нужен Dockerfile?
  answer: 'Он описывает шаги сборки образа: базу, копирование файлов, зависимости,
    пользователя и запуск. Это делает сборку повторяемой при закреплённых входах.'
  category: Сборка
