topic: "Docker и контейнерные образы"
cards:
  - question: "Чем контейнер отличается от виртуальной машины?"
    answer: "Контейнер изолирует процессы с помощью механизмов ядра и обычно разделяет ядро хоста; виртуальная машина запускает гостевую ОС на виртуализированном оборудовании."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем image отличается от container?"
    answer: "Image — неизменяемый шаблон файловой системы и метаданных; container — запущенный или остановленный экземпляр image с собственным изменяемым слоем и состоянием."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как namespaces и cgroups участвуют в работе контейнера?"
    answer: "Namespaces изолируют видимость процессов, сети и других ресурсов; cgroups учитывают и ограничивают потребление ресурсов. Контейнер не является полноценной границей безопасности сам по себе."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему данные в writable layer контейнера не стоит использовать как постоянное хранилище?"
    answer: "Этот слой привязан к экземпляру и теряется при его замене. Постоянные данные размещают в volume или внешнем хранилище с понятным резервированием."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Для чего нужен Dockerfile?"
    answer: "Он описывает шаги сборки образа: базу, копирование файлов, зависимости, пользователя и запуск. Это делает сборку повторяемой при закреплённых входах."
    category: "Сборка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем ENTRYPOINT отличается от CMD?"
    answer: "ENTRYPOINT задаёт основную исполняемую команду, CMD — её аргументы по умолчанию либо команду, если ENTRYPOINT нет. Фактическое поведение зависит от exec или shell формы."
    category: "Запуск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему exec-форма команды запуска полезна для Java-приложения?"
    answer: "Она запускает Java как основной процесс без лишней оболочки, что упрощает передачу сигналов и корректное завершение контейнера."
    category: "Запуск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему PID 1 в контейнере требует внимания?"
    answer: "Главный процесс получает сигналы остановки и отвечает за жизненный цикл; оболочка, которая не передаёт сигнал, может помешать graceful shutdown. При дочерних процессах нужен корректный reaping."
    category: "Запуск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Для чего нужен multi-stage build?"
    answer: "Сборка выполняется в одном этапе с инструментами, а в итоговый образ копируют только нужные артефакты. Это уменьшает размер и поверхность атаки."
    category: "Сборка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему COPY исходников до загрузки зависимостей может замедлить повторную сборку?"
    answer: "Изменение исходников инвалидирует кэш последующих слоёв. Если сначала скопировать файлы зависимостей и выполнить их загрузку, пересборка кода чаще использует кэш."
    category: "Слои"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делает .dockerignore?"
    answer: "Исключает ненужные файлы из build context, уменьшая передачу данных и риск попадания секретов в сборку. Он не удаляет секреты, уже включённые в слои."
    category: "Сборка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему нельзя хранить пароль в ARG или RUN Dockerfile?"
    answer: "Значение может попасть в метаданные, историю или слои образа и журналы сборки. Для доступа на этапе сборки применяют механизм временных build secrets."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем tag образа отличается от digest?"
    answer: "Tag — изменяемая метка; digest — идентификатор конкретного содержимого. Для воспроизводимого развёртывания надёжнее закреплять digest или неизменяемую политику тегов."
    category: "Версии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему тег latest опасен для релиза?"
    answer: "Он не говорит, какой именно образ запущен, и может указывать на новое содержимое. Это затрудняет воспроизведение и откат."
    category: "Версии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что происходит при docker build с точки зрения слоёв?"
    answer: "Инструкции формируют слои и метаданные образа; изменённый вход инвалидирует зависимую часть кэша. Не каждая инструкция соответствует одному файловому слою в современном builder."
    category: "Слои"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, под каким пользователем работает процесс в контейнере?"
    answer: "Посмотреть USER в образе, параметры запуска и фактический uid процесса. Наличие USER в Dockerfile может быть переопределено при запуске."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем запускать контейнер без root там, где возможно?"
    answer: "Это уменьшает последствия компрометации и случайных изменений в контейнере, хотя права хоста и политика runtime всё равно важны."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем publish порта отличается от EXPOSE в Dockerfile?"
    answer: "EXPOSE документирует ожидаемый порт приложения; publish создаёт доступ к порту контейнера через хост. Сам EXPOSE не публикует порт наружу."
    category: "Сеть"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как контейнеры одной Docker-сети находят друг друга?"
    answer: "Обычно по имени или alias через встроенное разрешение имён в пользовательской сети; доступность зависит от сети и настроек контейнеров."
    category: "Сеть"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно проверить, если контейнер сразу завершился?"
    answer: "Код выхода, docker logs, команду запуска, переменные, доступность файлов, права и ограничения памяти. Контейнер живёт, пока работает его главный процесс."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему локально работающий Docker-образ может не запускаться в Kubernetes?"
    answer: "В кластере могут отличаться права, архитектура узла, настройки сети, секреты, ресурсы, writable filesystem и команда запуска."
    category: "Совместимость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем volume отличается от bind mount?"
    answer: "Volume управляется Docker и обычно отделён от конкретного пути хоста; bind mount подключает явный путь хоста. Правила хранения и доступа различаются."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что означает HEALTHCHECK в Dockerfile и равен ли он readiness в Kubernetes?"
    answer: "HEALTHCHECK задаёт проверку состояния контейнера для Docker; Kubernetes использует собственные probes. Наличие HEALTHCHECK не создаёт автоматически корректный readiness для Pod."
    category: "Готовность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем сканировать базовый образ и зависимости перед релизом?"
    answer: "Образ может содержать уязвимые системные пакеты и библиотеки, даже если собственный код не изменился. Результаты нужно оценивать с учётом реальной применимости."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как уменьшить размер Java-образа без потери диагностируемости?"
    answer: "Использовать подходящий runtime-образ или multi-stage сборку, исключить сборочные инструменты и лишние файлы, но сохранить необходимые CA-сертификаты и возможность диагностики."
    category: "Java в контейнере"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

