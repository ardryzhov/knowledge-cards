topic: "Kubernetes: workloads и жизненный цикл"
cards:
  - question: "Из каких компонентов состоит Kubernetes control plane на базовом уровне?"
    answer: "API server принимает изменения, etcd хранит состояние, scheduler выбирает узлы для Pod, controllers приводят фактическое состояние к желаемому."
    category: "Архитектура"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что делает kubelet на worker node?"
    answer: "Следит за Pod, назначенными узлу, и взаимодействует с container runtime для запуска и контроля контейнеров; сообщает состояние в API."
    category: "Архитектура"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем Pod отличается от container?"
    answer: "Pod — минимальная единица размещения Kubernetes; его контейнеры разделяют сеть и некоторые ресурсы, но остаются отдельными процессами и образами."
    category: "Pod"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему Pod обычно не создают вручную для продакшен-сервиса?"
    answer: "Сам по себе Pod не обеспечивает желаемое число реплик и замену при удалении. Для сервиса используют контроллер, например Deployment."
    category: "Pod"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что обеспечивает Deployment?"
    answer: "Управляет желаемым числом реплик и обновлением Pod через ReplicaSet. Его задача — поддерживать указанное состояние приложения."
    category: "Контроллеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем ReplicaSet отличается от Deployment?"
    answer: "ReplicaSet поддерживает число Pod с заданным шаблоном; Deployment управляет ReplicaSet и стратегией обновления версий."
    category: "Контроллеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда StatefulSet уместнее Deployment?"
    answer: "Когда экземплярам нужны устойчивые имена, порядок создания или собственные постоянные тома, например для stateful-системы. Сам StatefulSet не заменяет проектирование консистентности данных."
    category: "Контроллеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем Job отличается от CronJob?"
    answer: "Job выполняет конечную работу до завершения; CronJob создаёт Job по расписанию. Приложение должно учитывать возможные повторы."
    category: "Контроллеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что делает scheduler, когда у Pod заданы resource requests?"
    answer: "Ищет узел с достаточными доступными по учёту запрошенными ресурсами и учитывает прочие правила размещения. Requests не гарантируют реальную скорость выполнения."
    category: "Ресурсы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем CPU request отличается от CPU limit?"
    answer: "Request влияет на планирование и долю ресурса, limit ограничивает использование; при достижении CPU limit возможен throttling и рост задержки."
    category: "Ресурсы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что происходит при превышении memory limit контейнером?"
    answer: "Контейнер может быть завершён из-за OOM и перезапущен согласно политике Pod. Нужно смотреть фактическое потребление, лимит и причины роста памяти."
    category: "Ресурсы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему Xmx Java-приложения не должен автоматически равняться memory limit Pod?"
    answer: "Кроме heap память занимают metaspace, стеки, direct buffers и нативные структуры. Нужен запас для всего процесса и проверки под нагрузкой."
    category: "Java в Kubernetes"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем liveness probe отличается от readiness probe?"
    answer: "Liveness выявляет необходимость перезапуска контейнера; readiness определяет, может ли Pod получать новый сервисный трафик. Плохая readiness не должна без причины приводить к рестарту."
    category: "Probes"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем startup probe приложению с долгой инициализацией?"
    answer: "Она даёт отдельное окно для старта; пока она не стала успешной, liveness и readiness не выполняются. Это предотвращает преждевременные рестарты."
    category: "Probes"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему readiness, проверяющая каждую внешнюю зависимость, может усилить аварию?"
    answer: "При общей проблеме все Pod могут стать неготовыми, хотя часть запросов могла бы обслуживаться в деградированном режиме. Проверка должна отражать реальную способность принимать трафик."
    category: "Probes"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делает RollingUpdate Deployment?"
    answer: "Постепенно заменяет старые Pod новыми, управляя доступностью и дополнительными Pod через maxUnavailable и maxSurge. Без правильной readiness бесшовность не гарантирована."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как maxUnavailable и maxSurge влияют на обновление?"
    answer: "Первый ограничивает число недоступных реплик, второй — число дополнительных сверх желаемого. Значения влияют на скорость и запас ресурсов при rollout."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему сервис может прерывать запросы при rolling update даже с несколькими репликами?"
    answer: "Pod может завершиться до дренирования трафика и активных соединений. Нужны корректный SIGTERM, graceful shutdown, достаточное время и согласованная readiness."
    category: "Остановка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что означает terminationGracePeriodSeconds?"
    answer: "Срок, который Kubernetes даёт Pod на корректное завершение после запроса остановки, прежде чем принудительно завершить оставшиеся процессы."
    category: "Остановка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить текущий статус rollout Deployment?"
    answer: "Смотреть kubectl rollout status, доступные реплики, Pod и events; затем сверить образ, probes и ресурсы. Успешное применение манифеста ещё не означает успешный rollout."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что такое CrashLoopBackOff?"
    answer: "Это задержка между повторными запусками контейнера, который быстро завершается; это симптом, а не первопричина. Нужны предыдущие логи и причина завершения."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает ImagePullBackOff?"
    answer: "Кластер не смог получить образ и увеличивает паузы между попытками. Проверяют имя и tag/digest, доступ к registry, credentials и события Pod."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему Pod может оставаться Pending?"
    answer: "Возможны нехватка ресурсов, ограничения размещения, отсутствие подходящего тома или другие условия scheduling. Причину ищут в events и описании Pod."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем нужны labels и selectors?"
    answer: "Labels помечают объекты; selectors выбирают Pod для контроллеров и Service. Несовпадение selector может оставить сервис без endpoints."
    category: "Метаданные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем namespace отличается от отдельного кластера?"
    answer: "Namespace логически группирует и ограничивает область имён и часть политик внутри кластера; он не создаёт самостоятельную физическую изоляцию."
    category: "Организация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как HPA решает, менять ли число реплик?"
    answer: "Сопоставляет наблюдаемую метрику с целевой и рассчитывает желаемое число реплик с учётом своих правил. Для CPU-процента важны корректные requests."
    category: "Масштабирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему HPA не исправит медленный SQL-запрос автоматически?"
    answer: "Дополнительные реплики могут увеличить конкуренцию за БД и ухудшить ситуацию. Нужно определить узкое место и пределы зависимостей."
    category: "Масштабирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем PodDisruptionBudget при плановом обслуживании узлов?"
    answer: "Он ограничивает число одновременно добровольно вытесненных Pod, сохраняя заданную доступность. Он не защищает от всех видов отказов или неверного приложения."
    category: "Доступность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

