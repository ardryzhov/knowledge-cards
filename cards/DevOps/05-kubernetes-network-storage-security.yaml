- id: a1d61da3-49b8-4b79-8777-e2d23e9c7ab1
  question: Чем ClusterIP отличается от NodePort и LoadBalancer?
  answer: ClusterIP даёт внутренний адрес Service; NodePort открывает порт на узлах;
    LoadBalancer запрашивает внешний балансировщик у поддерживаемой инфраструктуры.
  category: Service
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 1d24373b-eede-4290-b986-40e439cc832f
  question: Что Ingress делает поверх Service?
  answer: Описывает маршрутизацию входящего HTTP(S)-трафика по host и path к Service;
    для работы нужен ingress controller и настройка TLS и сети.
  category: Ingress
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 7b4f1c3e-275c-464b-a473-7c67c1701ad5
  question: Почему создание Ingress без ingress controller не делает приложение доступным?
  answer: Ingress — декларация маршрутов, а выполнять её должен контроллер. Без него
    внешний трафик не будет направлен к Service.
  category: Ingress
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e904d144-a81d-436b-b6e2-84f6dc6b8c11
  question: Чем порт контейнера отличается от port и targetPort у Service?
  answer: Приложение слушает порт внутри Pod; Service принимает на port и отправляет
    к targetPort подходящего Pod. containerPort в манифесте в основном описывает ожидаемый
    порт.
  category: Service
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b89a8641-fe06-4bef-949e-00dca50b11a6
  question: Как обратиться к Service из другого namespace?
  answer: Использовать DNS-имя с namespace, например service.namespace.svc.cluster.local,
    если кластерный домен стандартный. Доступ ещё зависит от сетевых политик.
  category: DNS
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 35433770-deb8-48da-9cf9-6ff5a856cf5c
  question: Почему Pod IP не подходит как стабильный адрес приложения?
  answer: Pod может быть пересоздан с новым IP. Service или другой механизм обнаружения
    предоставляет стабильную точку доступа.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c3e90390-ff98-4ac0-8eac-1f0bf743831d
  question: Для чего нужен NetworkPolicy?
  answer: Он ограничивает разрешённый входящий и исходящий трафик Pod по селекторам
    и портам, если CNI поддерживает enforcement. Без политики поведение зависит от
    сетевой реализации.
  category: Сеть и безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1a3538c6-2c78-4d3f-aad3-1d2d362330f5
  question: Почему NetworkPolicy может не влиять на трафик в кластере?
  answer: Некоторые CNI не реализуют её enforcement; также правило может не выбирать
    нужные Pod или направление. Нужно проверять фактическую реализацию и селекторы.
  category: Сеть и безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
