- id: 5a570fa9-b79b-42f8-9316-f2bc8f950270
  question: Что такое PV и PVC?
  answer: PV описывает ресурс постоянного хранения, PVC — запрос приложения на хранение
    с нужными параметрами. Привязка зависит от StorageClass и возможностей инфраструктуры.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 48ffd04f-bbfd-403e-abb2-3234459ab645
  question: Для чего нужен StorageClass?
  answer: Он описывает класс и способ динамического выделения томов, параметры provisioner
    и режимы жизненного цикла. Конкретные возможности зависят от storage-драйвера.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 88a262ae-1aea-4c3b-b51a-340fd80c7c9d
  question: Чем ReadWriteOnce отличается от ReadWriteMany у тома?
  answer: 'Это режимы доступа: первый допускает монтирование для записи одним узлом,
    второй — несколькими узлами. RWO не обязательно означает только один Pod, а поддержка
    зависит от драйвера.'
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 00b2f2e6-c824-4296-a5e7-6cbe20a8337a
  question: Что происходит с данными PVC после удаления Pod?
  answer: Сам PVC обычно сохраняется, поэтому новый Pod может использовать тот же
    том. Удаление PVC и политика reclaim для PV определяют дальнейшую судьбу хранилища.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 38521895-1eff-47b2-b405-a44116dabbc4
  question: Почему локальная файловая система Pod не подходит для файлов, которые
    должны пережить пересоздание?
  answer: Контейнер и Pod эфемерны; данные в их изменяемом слое могут пропасть. Нужен
    PVC или внешнее хранилище с соответствующими гарантиями.
  category: Хранение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 464235e0-9edf-4536-8987-17ad0840386f
  question: Когда ConfigMap удобнее переменной, зашитой в образ?
  answer: Когда одно и то же приложение запускается с разными несекретными настройками
    в средах. Образ остаётся одинаковым, а конфигурация поставляется отдельно.
  category: Конфигурация
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 51b68e6c-138e-4b21-b8bb-1aa511111aed
  question: Почему обновление ConfigMap не всегда меняет конфигурацию уже работающего
    процесса?
  answer: Процесс может прочитать значение только при старте; env-переменные Pod не
    обновляются, а смонтированные файлы обновляются с задержкой и не во всех способах
    монтирования. Часто нужен rollout.
  category: Конфигурация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 90ae0797-d378-445e-9205-bd00aa8a35e7
  question: Что такое service account в Kubernetes?
  answer: Идентичность workload для обращения к Kubernetes API и других интеграций,
    зависящих от инфраструктуры. Права задаются отдельно через RBAC.
  category: Доступ
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 3cc2a3fc-c26d-4bbd-aa18-2c1176494cb4
  question: Почему контейнеру приложения не стоит давать cluster-admin?
  answer: Он получает слишком широкие права в кластере; компрометация сервиса может
    затронуть другие workloads и секреты. Нужны минимальные права.
  category: Доступ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 054e91fd-dea0-44fa-8c60-b212b62e72b1
  question: Чем Role отличается от ClusterRole?
  answer: Role действует в namespace, ClusterRole задаёт правила, которые могут применяться
    на уровне кластера или через RoleBinding в namespace. Права возникают через binding
    к субъекту.
  category: RBAC
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 28fb3957-dd90-4731-a4e3-881d64d33fef
  question: Зачем imagePullSecret?
  answer: Он предоставляет учётные данные для получения образа из закрытого registry.
    Нужно следить за областью доступа, ротацией и тем, где secret используется.
  category: Образы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9d2b7ccc-e95b-43be-b48a-d5576aa29d2c
  question: Как kubectl port-forward помогает диагностике и каково его ограничение?
  answer: Пробрасывает локальный порт к Pod или Service через Kubernetes API, позволяя
    выполнить запрос без внешнего маршрута. Это временный доступ для диагностики,
    не продакшен-маршрут.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d4f357a6-60bf-4dd6-ac47-ed3cfe83b8d3
  question: Как проверить, почему Service не отдаёт трафик?
  answer: Проверить selector, готовность Pod, EndpointSlice, port и targetPort, сетевые
    политики и логи ingress или приложения в нужном namespace.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4ca50356-1293-41cc-a8bd-379625cc1aed
  question: Чем nodeSelector и affinity помогают размещению Pod?
  answer: Они задают ограничения или предпочтения по узлам и Pod; слишком жёсткие
    условия могут оставить Pod Pending.
  category: Размещение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ffd0caf9-51e5-43d9-9c65-0e7c18838c59
  question: Что делают taints и tolerations?
  answer: Taint на узле отталкивает Pod без подходящей toleration; toleration разрешает
    размещение, но сама не заставляет scheduler выбрать этот узел.
  category: Размещение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 6d374a66-7efd-43ef-8b1b-3edf4d9ddb25
  question: Почему один PVC обычно не делает PostgreSQL кластером высокой доступности?
  answer: Том сохраняет данные, но не создаёт репликацию, согласование лидера и восстановление
    после сбоя. Для HA нужны отдельные механизмы БД и инфраструктуры.
