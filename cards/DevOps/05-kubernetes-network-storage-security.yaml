- id: 43d953b9-45ed-480c-ab00-c167e1fdd27e
  question: Как Service находит Pod, к которым отправлять трафик?
  answer: По selector и готовым endpoints, сформированным из подходящих Pod. Если
    метки не совпадают или Pod не ready, Service может остаться без рабочих endpoints.
  category: Service
  context: 
