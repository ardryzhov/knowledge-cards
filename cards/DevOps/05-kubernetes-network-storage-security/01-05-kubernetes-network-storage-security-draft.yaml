topic: "Kubernetes: сеть, хранение и доступ"
cards:
  - question: "Как Service находит Pod, к которым отправлять трафик?"
    answer: "По selector и готовым endpoints, сформированным из подходящих Pod. Если метки не совпадают или Pod не ready, Service может остаться без рабочих endpoints."
    category: "Service"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем ClusterIP отличается от NodePort и LoadBalancer?"
    answer: "ClusterIP даёт внутренний адрес Service; NodePort открывает порт на узлах; LoadBalancer запрашивает внешний балансировщик у поддерживаемой инфраструктуры."
    category: "Service"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что Ingress делает поверх Service?"
    answer: "Описывает маршрутизацию входящего HTTP(S)-трафика по host и path к Service; для работы нужен ingress controller и настройка TLS и сети."
    category: "Ingress"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему создание Ingress без ingress controller не делает приложение доступным?"
    answer: "Ingress — декларация маршрутов, а выполнять её должен контроллер. Без него внешний трафик не будет направлен к Service."
    category: "Ingress"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем порт контейнера отличается от port и targetPort у Service?"
    answer: "Приложение слушает порт внутри Pod; Service принимает на port и отправляет к targetPort подходящего Pod. containerPort в манифесте в основном описывает ожидаемый порт."
    category: "Service"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как обратиться к Service из другого namespace?"
    answer: "Использовать DNS-имя с namespace, например service.namespace.svc.cluster.local, если кластерный домен стандартный. Доступ ещё зависит от сетевых политик."
    category: "DNS"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему Pod IP не подходит как стабильный адрес приложения?"
    answer: "Pod может быть пересоздан с новым IP. Service или другой механизм обнаружения предоставляет стабильную точку доступа."
    category: "Сеть"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Для чего нужен NetworkPolicy?"
    answer: "Он ограничивает разрешённый входящий и исходящий трафик Pod по селекторам и портам, если CNI поддерживает enforcement. Без политики поведение зависит от сетевой реализации."
    category: "Сеть и безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему NetworkPolicy может не влиять на трафик в кластере?"
    answer: "Некоторые CNI не реализуют её enforcement; также правило может не выбирать нужные Pod или направление. Нужно проверять фактическую реализацию и селекторы."
    category: "Сеть и безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое PV и PVC?"
    answer: "PV описывает ресурс постоянного хранения, PVC — запрос приложения на хранение с нужными параметрами. Привязка зависит от StorageClass и возможностей инфраструктуры."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Для чего нужен StorageClass?"
    answer: "Он описывает класс и способ динамического выделения томов, параметры provisioner и режимы жизненного цикла. Конкретные возможности зависят от storage-драйвера."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем ReadWriteOnce отличается от ReadWriteMany у тома?"
    answer: "Это режимы доступа: первый допускает монтирование для записи одним узлом, второй — несколькими узлами. RWO не обязательно означает только один Pod, а поддержка зависит от драйвера."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что происходит с данными PVC после удаления Pod?"
    answer: "Сам PVC обычно сохраняется, поэтому новый Pod может использовать тот же том. Удаление PVC и политика reclaim для PV определяют дальнейшую судьбу хранилища."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему локальная файловая система Pod не подходит для файлов, которые должны пережить пересоздание?"
    answer: "Контейнер и Pod эфемерны; данные в их изменяемом слое могут пропасть. Нужен PVC или внешнее хранилище с соответствующими гарантиями."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда ConfigMap удобнее переменной, зашитой в образ?"
    answer: "Когда одно и то же приложение запускается с разными несекретными настройками в средах. Образ остаётся одинаковым, а конфигурация поставляется отдельно."
    category: "Конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему обновление ConfigMap не всегда меняет конфигурацию уже работающего процесса?"
    answer: "Процесс может прочитать значение только при старте; env-переменные Pod не обновляются, а смонтированные файлы обновляются с задержкой и не во всех способах монтирования. Часто нужен rollout."
    category: "Конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое service account в Kubernetes?"
    answer: "Идентичность workload для обращения к Kubernetes API и других интеграций, зависящих от инфраструктуры. Права задаются отдельно через RBAC."
    category: "Доступ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему контейнеру приложения не стоит давать cluster-admin?"
    answer: "Он получает слишком широкие права в кластере; компрометация сервиса может затронуть другие workloads и секреты. Нужны минимальные права."
    category: "Доступ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем Role отличается от ClusterRole?"
    answer: "Role действует в namespace, ClusterRole задаёт правила, которые могут применяться на уровне кластера или через RoleBinding в namespace. Права возникают через binding к субъекту."
    category: "RBAC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем imagePullSecret?"
    answer: "Он предоставляет учётные данные для получения образа из закрытого registry. Нужно следить за областью доступа, ротацией и тем, где secret используется."
    category: "Образы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как kubectl port-forward помогает диагностике и каково его ограничение?"
    answer: "Пробрасывает локальный порт к Pod или Service через Kubernetes API, позволяя выполнить запрос без внешнего маршрута. Это временный доступ для диагностики, не продакшен-маршрут."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить, почему Service не отдаёт трафик?"
    answer: "Проверить selector, готовность Pod, EndpointSlice, port и targetPort, сетевые политики и логи ingress или приложения в нужном namespace."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем nodeSelector и affinity помогают размещению Pod?"
    answer: "Они задают ограничения или предпочтения по узлам и Pod; слишком жёсткие условия могут оставить Pod Pending."
    category: "Размещение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делают taints и tolerations?"
    answer: "Taint на узле отталкивает Pod без подходящей toleration; toleration разрешает размещение, но сама не заставляет scheduler выбрать этот узел."
    category: "Размещение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему один PVC обычно не делает PostgreSQL кластером высокой доступности?"
    answer: "Том сохраняет данные, но не создаёт репликацию, согласование лидера и восстановление после сбоя. Для HA нужны отдельные механизмы БД и инфраструктуры."
    category: "Хранение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

