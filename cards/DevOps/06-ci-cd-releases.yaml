topic: CI/CD и выпуск изменений
cards:
- id: 32ad90cb-b456-4533-be15-4030a25627af
  question: Чем CI отличается от CD?
  answer: CI часто объединяет изменения и проверяет их автоматической сборкой и тестами;
    CD автоматизирует доставку проверенного артефакта до среды, с возможным ручным
    решением о релизе.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 890594c4-0384-4ddb-a067-38999c380aa0
  question: Какие этапы нужны типичному pipeline Java-сервиса?
  answer: Сборка и тесты, проверки качества и безопасности, упаковка, публикация версионированного
    образа, развёртывание и проверка работоспособности. Порядок и gates зависят от
    риска.
  category: Pipeline
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: cf71f213-a7a0-4d5d-96c6-bb373cd6b328
  question: Зачем связывать образ с commit SHA и результатом pipeline?
  answer: Это позволяет восстановить исходники, проверки и точную версию работающего
    сервиса при инциденте и откате.
  category: Прослеживаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ba88460c-7e9d-4ed5-b754-728cfce78b3d
  question: Почему повторная сборка из того же commit не всегда даёт тот же артефакт?
  answer: Зависимости, base image, репозитории и инструменты могут измениться. Воспроизводимость
    требует закреплённых версий и контролируемых входов.
  category: Воспроизводимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b4f49eff-2429-4e1b-ac7c-cf3cadd0d9a7
  question: Чем кэш зависимостей отличается от артефакта сборки?
  answer: Кэш ускоряет повторные шаги и может быть удалён без потери результата; артефакт
    — проверенный выход конкретной сборки, который публикуют и разворачивают.
  category: Pipeline
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 0c6221bf-7e84-4679-80e3-4d588438c292
  question: Почему тесты должны выполняться до публикации образа в основной registry?
  answer: Так снижается риск продвижения непроверенного артефакта. При необходимости
    образ сначала публикуют во временное место, а после gate продвигают без пересборки.
  category: Качество
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: edb1a3bd-994f-41dc-bd5c-e1fa4b95b672
  question: Что значит «продвигать один и тот же артефакт между средами»?
  answer: Тот же digest образа проходит test, stage и production; меняется только
    конфигурация среды. Это убирает различия из-за повторной сборки.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9550f5b8-8155-4729-a32a-d3f9dbb94cf5
  question: Чем rolling update отличается от blue-green deployment?
  answer: Rolling постепенно заменяет экземпляры; blue-green держит две полные версии
    и переключает трафик. Blue-green требует больше ресурсов и явного плана миграции
    данных.
  category: Стратегии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0d994fc3-ad5b-4ef7-aae5-0fe88133fabb
  question: Чем canary release отличается от rolling update?
  answer: Canary сначала направляет ограниченную долю трафика на новую версию и сравнивает
    метрики перед расширением; rolling просто поэтапно меняет экземпляры по стратегии.
  category: Стратегии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1579c44a-bd28-4332-b341-464fd1f01a66
  question: Почему успешный rollout не доказывает успешность релиза?
  answer: Pod могут быть ready, но новый бизнес-сценарий ошибаться. Нужны smoke проверки,
    метрики ошибок, задержки и бизнес-результата.
  category: Проверка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 83081750-2d18-4982-81d6-bec60d6b3f9d
  question: Что проверить до отката релиза, в котором была миграция БД?
  answer: Совместимость старой версии приложения с уже изменённой схемой и данными.
    Откат образа может не откатить миграцию или быть опасным для данных.
  category: Откат
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2c87440c-a4b4-4307-9e95-a60898df537c
  question: Зачем использовать expand-and-contract при изменении схемы?
  answer: Сначала добавляют совместимую структуру, затем переключают чтение и запись,
    после проверки удаляют старую. Это поддерживает параллельную работу версий.
  category: Миграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 432c1c20-1d84-4415-904e-429c0ca49a3d
  question: Почему миграцию БД стоит выполнять контролируемым шагом, а не одновременно
    каждым Pod?
  answer: Параллельные запуски могут конфликтовать, создавать блокировки и замедлять
    старт. Нужен один контролируемый исполнитель или механизм синхронизации.
  category: Миграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 51dfe6aa-ee57-4772-897a-4ca7acf65ce3
  question: Что такое feature flag и чем он отличается от деплоя?
  answer: Флаг позволяет включать поведение отдельно от доставки кода. Он помогает
    поэтапному запуску, но требует управления состоянием, сроком жизни и удалением
    старых веток.
  category: Флаги
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: e7dcaf4b-9a04-479f-b5e2-629f15f2cc7e
  question: Как организовать rollback, если новая версия уже отправила события нового
    формата?
  answer: Проверить, понимает ли старая версия новые события; при необходимости заранее
    поддерживать обе схемы или использовать совместимый переходный период.
  category: Откат
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c3aff331-2d8a-49e2-8807-cd574bafbd37
  question: Чем manual approval в pipeline полезен и чего он не заменяет?
  answer: Он даёт точку решения перед рискованным шагом, но не заменяет автоматические
    проверки и критерии готовности релиза.
  category: Управление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 34cb3275-652d-4e2b-a5fc-42ae1d7b6278
  question: Что означает GitOps в доставке Kubernetes-конфигурации?
  answer: Желаемое состояние хранится в Git, а контроллер согласует с ним кластер.
    Важно понимать источник истины и процедуру экстренного изменения.
  category: GitOps
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a20e6f18-fb7a-434f-ba1c-bd935909f3a5
  question: Почему ручная правка объекта kubectl edit может потеряться в GitOps?
  answer: Контроллер увидит дрейф от состояния в Git и вернёт описанную версию. Постоянное
    изменение нужно внести в источник истины.
  category: GitOps
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d5b5a7f3-02a1-47ad-8e32-40bef90d062e
  question: Как проверить, что pipeline использует именно протестированный образ?
  answer: Сравнить digest образа в результате сборки и в развернутом workload; mutable
    tag может указывать на другое содержимое.
  category: Прослеживаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 9bdd7e23-329b-41ef-8569-061ade8ca31d
  question: Зачем разделять права pipeline на сборку и деплой в production?
  answer: Компрометация build job не должна автоматически давать полный доступ к продуктивной
    среде. Нужны минимальные права и контроль критических шагов.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d1a013b8-a5f5-419c-9374-de1329935cf5
  question: Как исключить секреты из журналов pipeline?
  answer: Использовать защищённые переменные и механизмы выдачи, маскирование как
    дополнительную меру, не выводить окружение и командные аргументы с секретами.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 469f6f99-c8c2-456f-a4bc-29c0ecb93ef5
  question: Что делать, если один тест нестабилен и периодически ломает pipeline?
  answer: Выяснить причину, данные и зависимость от времени или окружения; временная
    изоляция с ответственным допустима, но бесконечный retry скрывает дефект.
  category: Качество
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a9b9c3de-7f3d-42c3-9ed7-a26bd3a20971
  question: Почему параллельные деплои одного сервиса в одну среду опасны?
  answer: Они могут перетирать конфигурацию и создавать гонку версий. Нужна сериализация
    или управление конкурентностью по среде.
  category: Управление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 658b56db-80ee-4217-a657-797f05b5df66
  question: Что такое smoke test после деплоя?
  answer: Короткая проверка жизненно важного пути на развернутой версии и среде. Она
    не заменяет полный набор тестов, но быстро выявляет грубый сбой релиза.
  category: Проверка
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a5372abc-9088-4fd9-9105-d5b96c8f4c57
  question: Как выбрать между автоматическим и ручным откатом?
  answer: Зависит от измеримых сигналов, скорости обнаружения, риска ложного срабатывания
    и совместимости данных. Автооткат подходит при надёжных условиях и заранее проверенном
    плане.
  category: Откат
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4edc2c97-f2c8-417c-b865-9a761c431213
  question: Как понять, что pipeline стал слишком медленным?
  answer: Измерить время до первой обратной связи и длительность стадий, найти повторные
    сборки и сериализацию; оптимизировать узкие места без удаления полезных проверок.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5bfaeb1e-fd49-4b9a-8926-bf12bc639e68
  question: Чем merge commit отличается от rebase в истории Git?
  answer: Merge сохраняет ветвление и создаёт объединяющий коммит; rebase переносит
    коммиты на новую базу, меняя их идентификаторы. Публичную историю переписывают
    только по правилам команды.
  category: Git
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5c113d00-85d0-4f77-ae74-f116f0069db7
  question: Зачем защищать основную ветку репозитория?
  answer: Правила ревью, проверок и прав на запись снижают риск непроверенных изменений
    в источнике релизов. Важно понимать, какие проверки действительно блокируют merge.
  category: Git
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 97bf1ba7-617b-4781-8647-934c024a8772
  question: Как связать Git tag релиза с развернутым образом?
  answer: Зафиксировать commit, версию и digest образа в артефактах pipeline и release
    metadata. Сам tag в Git не доказывает, что именно этот образ запущен.
  category: Прослеживаемость
