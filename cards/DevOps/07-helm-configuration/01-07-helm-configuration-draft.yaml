topic: "Helm и конфигурация приложения"
cards:
  - question: "Что такое Helm chart?"
    answer: "Пакет шаблонов Kubernetes-ресурсов, значений и метаданных для установки приложения. Chart помогает повторно использовать конфигурацию между средами."
    category: "Helm"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем chart отличается от release?"
    answer: "Chart — пакет описания ресурсов; release — установленный экземпляр chart с конкретными values и историей изменений."
    category: "Helm"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Для чего нужны Chart.yaml, values.yaml и templates?"
    answer: "Chart.yaml хранит метаданные chart, values.yaml — значения по умолчанию, templates — шаблоны итоговых Kubernetes-манифестов."
    category: "Структура chart"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что делает helm template?"
    answer: "Рендерит манифесты локально из chart и values, позволяя увидеть итог до применения. Это не подтверждает, что ресурсы успешно запустятся в кластере."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем helm lint отличается от проверки готовности приложения?"
    answer: "Lint проверяет структуру и распространённые ошибки chart; готовность приложения зависит от ресурсов кластера, образа, конфигурации и работы сервиса."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как values для разных сред влияют на итоговый Deployment?"
    answer: "Шаблоны подставляют значения выбранных файлов и переопределений. Нужно просматривать итоговый manifest, потому что порядок и правила слияния влияют на результат."
    category: "Values"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему секрет нельзя помещать в обычный values.yaml в Git?"
    answer: "Values может попасть в историю репозитория, вывод helm и артефакты релиза. Секреты передают утверждённым механизмом с ограниченными правами."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить перед helm upgrade в production?"
    answer: "Версию chart и образа, итоговые манифесты и diff, миграции, права, ресурсы, совместимость и план отката."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делает helm rollback и чего он не откатывает автоматически?"
    answer: "Возвращает release к предыдущей ревизии манифестов. Изменения данных, миграции БД и внешние побочные эффекты требуют отдельного плана."
    category: "Откат"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему helm upgrade может пройти успешно, а приложение остаться неисправным?"
    answer: "Применение ресурсов не доказывает корректность бизнес-логики; нужно проверять rollout, probes, логи и пользовательский сценарий."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем ConfigMap отличается от Secret в Kubernetes?"
    answer: "ConfigMap хранит несекретные настройки, Secret предназначен для чувствительных значений и иной обработки доступа. Secret сам по себе не означает шифрование данных в etcd."
    category: "Kubernetes конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как приложение получает значения ConfigMap?"
    answer: "Например через переменные окружения или смонтированные файлы. Поведение при изменении различается: env в существующем Pod не обновляются."
    category: "Kubernetes конфигурация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему изменение ConfigMap не всегда вызывает перезапуск Deployment?"
    answer: "Шаблон Pod не изменился, а Deployment реагирует на изменение своего Pod template. Часто применяют изменение аннотации с checksum или явный rollout."
    category: "Обновление конфигурации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какие уровни конфигурации обычно есть у Spring Boot?"
    answer: "Например файлы приложения, переменные окружения, системные свойства и аргументы запуска; приоритет определяется правилами Spring Boot. Для конкретного случая нужно проверить фактический источник свойства."
    category: "Spring Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как обнаружить, что production использует не тот профиль Spring?"
    answer: "Проверить активные профили, источники конфигурации, переменные Pod, параметры запуска и безопасную диагностику эффективных настроек."
    category: "Spring Boot"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему нельзя полагаться на значение по умолчанию для критичной конфигурации?"
    answer: "Если переменная не передана, приложение может стартовать с неверным адресом, таймаутом или режимом. Критичные параметры проверяют при запуске."
    category: "Качество конфигурации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как настроить изменение конфигурации без пересборки образа?"
    answer: "Вынести параметры среды в ConfigMap, Secret или внешний config service и передавать их при запуске; предусмотреть применение изменений и rollback."
    category: "Качество конфигурации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему тип значения в values.yaml важен?"
    answer: "YAML различает числа, строки и boolean; неверный тип может сломать шаблон или изменить итоговый manifest. Полезны schema и проверка рендера."
    category: "Values"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое Helm dependency?"
    answer: "Другой chart, используемый как зависимость основного. Нужно контролировать версии и понимать, какие ресурсы он добавляет."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему изменение общего chart может затронуть сервисы с разными values?"
    answer: "Шаблоны используются несколькими release; изменение логики рендера может проявиться только при определённой комбинации значений. Нужны тесты ключевых вариантов."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем хранить конфигурацию релиза в Git?"
    answer: "Это делает изменения обозримыми и воспроизводимыми, помогает ревью и расследованию дрейфа. Секретные значения хранят отдельно безопасным способом."
    category: "Управление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как проверить, что параметр values действительно попал в работающий Pod?"
    answer: "Сопоставить values, результат helm template или manifest release, spec Pod и фактическую конфигурацию процесса без раскрытия секретов."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда Kustomize удобнее Helm?"
    answer: "Когда достаточно декларативных наложений на YAML без пакетной системы и шаблонной логики. Выбор зависит от сложности вариаций и стандартов команды."
    category: "Инструменты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему Helm chart не должен содержать все бизнес-настройки как неограниченный список env?"
    answer: "Без схемы, документации и проверки обязательных параметров появляются скрытые зависимости и ошибки между средами. Значения должны быть типизированы и описаны."
    category: "Дизайн конфигурации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

