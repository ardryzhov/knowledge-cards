topic: Секреты, права и безопасность поставки
cards:
- id: 3d645bc9-739f-45ce-b92d-06bb8149fe05
  question: Почему base64 в Kubernetes Secret не является шифрованием?
  answer: Base64 лишь кодирует байты и легко декодируется. Защита требует ограниченного
    API-доступа, шифрования хранилища при необходимости и безопасного способа выдачи.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c0284731-8b30-4a6f-b713-3764d88e8e32
  question: Почему доступ к чтению Secrets в namespace нужно выдавать ограниченно?
  answer: Secret может содержать ключи других приложений; право чтения открывает их
    значения. RBAC задают по минимально необходимым ресурсам и объектам, где возможно.
  category: RBAC
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 62a34092-2987-44e0-b7d5-10b957a8e704
  question: Чем RoleBinding отличается от ClusterRoleBinding?
  answer: RoleBinding выдаёт права в конкретном namespace, в том числе права ClusterRole
    в этом namespace; ClusterRoleBinding выдаёт их на уровне кластера.
  category: RBAC
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b790ffe9-ed85-4ef4-b6c6-91d2ef46d8a8
  question: Как проверить права service account без пробного доступа к чувствительным
    данным?
  answer: Использовать правила RBAC и kubectl auth can-i с impersonation, если есть
    право, либо согласованный механизм проверки. Сверять результат с реальной ролью
    workload.
  category: RBAC
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0063fd61-df1c-4938-9f56-0ec684c75bae
  question: Что даёт workload identity при доступе к внешнему хранилищу секретов?
  answer: Связывает идентичность workload с правами внешней системы без длительно
    живущего статического ключа в манифесте. Конкретные гарантии зависят от платформы.
  category: Идентичность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2acfe612-fd83-46cf-8faa-0186a12839aa
  question: Почему долгоживущий токен CI/CD опасен?
  answer: Его утечка даёт доступ на длительный срок и часто к нескольким средам. Предпочтительны
    краткоживущие учётные данные с узкой областью действия.
  category: CI/CD
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 0f37ea86-fc3e-46fa-84dd-86b70f0bc599
  question: Что должно происходить при ротации секрета БД?
  answer: Нужно выдать новое значение, обновить приложение и соединения, проверить
    успешность, затем отозвать старое с учётом переходного периода. Изменение файла
    не всегда автоматически обновляет процесс.
  category: Ротация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: e25ca805-ea02-4892-839c-5fd450c03ed6
  question: Как избежать раскрытия секрета в логах при ошибке подключения?
  answer: Не логировать полные URL с паролем, заголовки авторизации и окружение; использовать
    безопасную маскировку и проверять сообщения библиотек и pipeline.
  category: Логи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 77c5c558-7231-4ca7-bbef-e1578b88f703
  question: Почему хранение секрета в env-переменной не делает его автоматически безопасным?
  answer: Значение может попасть в dump, диагностику, логи или вывод process tooling
    при определённых правах. Выбор механизма зависит от угроз и политики среды.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2c921a82-34e6-4d2a-8a61-732d3c0052e9
  question: Какие меры нужны после случайного попадания ключа в Git?
  answer: Считать ключ скомпрометированным, отозвать или ротировать, оценить использование
    и доступ, удалить из актуального кода и разобраться с историей и логами. Простое
    удаление строки недостаточно.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: bd16b4d2-61c8-4cb7-a5a3-d799bcf6ad84
  question: Что означает принцип least privilege для Pod?
  answer: Контейнер получает только нужные права к Kubernetes API, файловой системе,
    сети и ОС; запрещают лишние capabilities и привилегированный режим.
  category: Pod security
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 84e9961b-c1fc-4cea-bef7-cbb6eb322fcd
  question: Зачем readOnlyRootFilesystem в securityContext?
  answer: Ограничивает запись в корневую файловую систему контейнера, уменьшая поверхность
    для случайных и злонамеренных изменений. Приложению могут потребоваться явные
    writable mounts.
  category: Pod security
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4a8f550a-7ef0-4858-9d9f-d92b3c63bfad
  question: Почему контейнер с root внутри Pod может представлять дополнительный риск?
  answer: При ошибке изоляции или избыточных capabilities привилегии усиливают последствия
    компрометации. Нужен непривилегированный пользователь там, где это возможно.
  category: Pod security
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f24b3c4c-ee60-4db0-b7b2-3a96d1d005f7
  question: Что такое SBOM и чем она полезна при уязвимости зависимости?
  answer: Software Bill of Materials перечисляет компоненты артефакта, помогая быстро
    найти затронутые образы и версии. Она не доказывает безопасность сама по себе.
  category: Цепочка поставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: bec605b8-7f0c-48c1-a318-d097b8c8962e
  question: Зачем сканировать образ после обновления base image?
  answer: Новые пакеты могут добавить уязвимости или исправления; нужно оценивать
    состав конечного образа, а не только Maven-зависимости.
  category: Цепочка поставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 68f0f80c-58ae-4f37-9aa6-8096a2e28d94
  question: Почему доверять только имени Docker-образа недостаточно?
  answer: Tag может быть изменён, registry или путь могут быть подменены. Для критичных
    поставок полезны закреплённый digest, проверка происхождения и подписи по политике
    организации.
  category: Цепочка поставки
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 6522208e-3813-4c43-bdea-bebd492136d5
  question: Как ограничить исходящий сетевой доступ Pod?
  answer: Настроить egress NetworkPolicy при поддержке CNI и проверить DNS и необходимые
    назначения. Ограничение должно соответствовать реальным интеграциям.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: e4e1bdfa-616d-4552-bc4f-a218a4be0c80
  question: Почему production и test не должны использовать один и тот же секрет БД?
  answer: Компрометация менее защищённой среды даст доступ к production; разные учётные
    данные упрощают минимальные права и ротацию.
  category: Разделение сред
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 6bf9867f-81d1-401a-956e-cb438bcdfffb
  question: Как безопасно передать секрет в pipeline на этапе сборки?
  answer: Использовать утверждённый secret store и временную выдачу в конкретный шаг;
    не передавать через ARG или печатаемые команды и не включать в образ.
  category: CI/CD
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4af6d994-f36c-4c7e-a7f5-be2d351fcf1b
  question: Что делать, если приложению нужен доступ к Kubernetes API?
  answer: Создать отдельный service account с минимальными RBAC-правами, настроить
    доступ только для нужного workload и проверить использование токена.
  category: RBAC
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6c8e6d8f-a1fa-41c4-a99b-4766abebd476
  question: Когда стоит отключить автоматическое монтирование service account token?
  answer: Если workload не обращается к Kubernetes API и не использует этот токен
    для другой платформенной интеграции, его отсутствие уменьшает доступный при компрометации
    ресурс.
  category: Pod security
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: a967ddc0-1eaa-4a1d-89b2-98dd4ce32a40
  question: Чем секрет приложения отличается от несекретной конфигурации с точки зрения
    жизненного цикла?
  answer: Секреты требуют ограниченного доступа, ротации, отзыва и аудита; обычные
    настройки — контроля версий и проверки совместимости. Оба типа могут потребовать
    перезапуска.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2213f625-025f-4ac0-83d2-0297f6da71b6
  question: Почему доступ к registry должен быть разделён на pull и push?
  answer: Приложению обычно нужен только pull, а pipeline публикации — push. Разделение
    прав уменьшает риск подмены образов при компрометации workload.
  category: Registry
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: eb5d9c46-96c0-4faa-8595-bc5c39f6fcbb
  question: Как проверить, что новый релиз не расширил права приложения незаметно?
  answer: Сравнить RBAC, service account, securityContext и сетевые политики с предыдущей
    версией; включить проверку манифестов в ревью и pipeline.
  category: Ревью
  context: 
