topic: "Секреты, права и безопасность поставки"
cards:
  - question: "Почему base64 в Kubernetes Secret не является шифрованием?"
    answer: "Base64 лишь кодирует байты и легко декодируется. Защита требует ограниченного API-доступа, шифрования хранилища при необходимости и безопасного способа выдачи."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему доступ к чтению Secrets в namespace нужно выдавать ограниченно?"
    answer: "Secret может содержать ключи других приложений; право чтения открывает их значения. RBAC задают по минимально необходимым ресурсам и объектам, где возможно."
    category: "RBAC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем RoleBinding отличается от ClusterRoleBinding?"
    answer: "RoleBinding выдаёт права в конкретном namespace, в том числе права ClusterRole в этом namespace; ClusterRoleBinding выдаёт их на уровне кластера."
    category: "RBAC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как проверить права service account без пробного доступа к чувствительным данным?"
    answer: "Использовать правила RBAC и kubectl auth can-i с impersonation, если есть право, либо согласованный механизм проверки. Сверять результат с реальной ролью workload."
    category: "RBAC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что даёт workload identity при доступе к внешнему хранилищу секретов?"
    answer: "Связывает идентичность workload с правами внешней системы без длительно живущего статического ключа в манифесте. Конкретные гарантии зависят от платформы."
    category: "Идентичность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему долгоживущий токен CI/CD опасен?"
    answer: "Его утечка даёт доступ на длительный срок и часто к нескольким средам. Предпочтительны краткоживущие учётные данные с узкой областью действия."
    category: "CI/CD"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что должно происходить при ротации секрета БД?"
    answer: "Нужно выдать новое значение, обновить приложение и соединения, проверить успешность, затем отозвать старое с учётом переходного периода. Изменение файла не всегда автоматически обновляет процесс."
    category: "Ротация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как избежать раскрытия секрета в логах при ошибке подключения?"
    answer: "Не логировать полные URL с паролем, заголовки авторизации и окружение; использовать безопасную маскировку и проверять сообщения библиотек и pipeline."
    category: "Логи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему хранение секрета в env-переменной не делает его автоматически безопасным?"
    answer: "Значение может попасть в dump, диагностику, логи или вывод process tooling при определённых правах. Выбор механизма зависит от угроз и политики среды."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие меры нужны после случайного попадания ключа в Git?"
    answer: "Считать ключ скомпрометированным, отозвать или ротировать, оценить использование и доступ, удалить из актуального кода и разобраться с историей и логами. Простое удаление строки недостаточно."
    category: "Инциденты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что означает принцип least privilege для Pod?"
    answer: "Контейнер получает только нужные права к Kubernetes API, файловой системе, сети и ОС; запрещают лишние capabilities и привилегированный режим."
    category: "Pod security"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем readOnlyRootFilesystem в securityContext?"
    answer: "Ограничивает запись в корневую файловую систему контейнера, уменьшая поверхность для случайных и злонамеренных изменений. Приложению могут потребоваться явные writable mounts."
    category: "Pod security"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему контейнер с root внутри Pod может представлять дополнительный риск?"
    answer: "При ошибке изоляции или избыточных capabilities привилегии усиливают последствия компрометации. Нужен непривилегированный пользователь там, где это возможно."
    category: "Pod security"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое SBOM и чем она полезна при уязвимости зависимости?"
    answer: "Software Bill of Materials перечисляет компоненты артефакта, помогая быстро найти затронутые образы и версии. Она не доказывает безопасность сама по себе."
    category: "Цепочка поставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем сканировать образ после обновления base image?"
    answer: "Новые пакеты могут добавить уязвимости или исправления; нужно оценивать состав конечного образа, а не только Maven-зависимости."
    category: "Цепочка поставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему доверять только имени Docker-образа недостаточно?"
    answer: "Tag может быть изменён, registry или путь могут быть подменены. Для критичных поставок полезны закреплённый digest, проверка происхождения и подписи по политике организации."
    category: "Цепочка поставки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как ограничить исходящий сетевой доступ Pod?"
    answer: "Настроить egress NetworkPolicy при поддержке CNI и проверить DNS и необходимые назначения. Ограничение должно соответствовать реальным интеграциям."
    category: "Сеть"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему production и test не должны использовать один и тот же секрет БД?"
    answer: "Компрометация менее защищённой среды даст доступ к production; разные учётные данные упрощают минимальные права и ротацию."
    category: "Разделение сред"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как безопасно передать секрет в pipeline на этапе сборки?"
    answer: "Использовать утверждённый secret store и временную выдачу в конкретный шаг; не передавать через ARG или печатаемые команды и не включать в образ."
    category: "CI/CD"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если приложению нужен доступ к Kubernetes API?"
    answer: "Создать отдельный service account с минимальными RBAC-правами, настроить доступ только для нужного workload и проверить использование токена."
    category: "RBAC"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда стоит отключить автоматическое монтирование service account token?"
    answer: "Если workload не обращается к Kubernetes API и не использует этот токен для другой платформенной интеграции, его отсутствие уменьшает доступный при компрометации ресурс."
    category: "Pod security"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем секрет приложения отличается от несекретной конфигурации с точки зрения жизненного цикла?"
    answer: "Секреты требуют ограниченного доступа, ротации, отзыва и аудита; обычные настройки — контроля версий и проверки совместимости. Оба типа могут потребовать перезапуска."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему доступ к registry должен быть разделён на pull и push?"
    answer: "Приложению обычно нужен только pull, а pipeline публикации — push. Разделение прав уменьшает риск подмены образов при компрометации workload."
    category: "Registry"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как проверить, что новый релиз не расширил права приложения незаметно?"
    answer: "Сравнить RBAC, service account, securityContext и сетевые политики с предыдущей версией; включить проверку манифестов в ревью и pipeline."
    category: "Ревью"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

