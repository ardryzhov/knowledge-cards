- id: 2f384cff-c510-4f05-acb5-42a12407422f
  question: Как Prometheus обычно получает метрики приложения?
  answer: Он периодически опрашивает настроенные HTTP endpoints и сохраняет временные
    ряды; targets могут обнаруживаться динамически. Пропущенный scrape требует отдельной
    диагностики.
  category: Prometheus
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ca4d483e-19ef-45b2-931f-4f1f1c934680
  question: Какую роль обычно играет Grafana рядом с Prometheus?
  answer: Grafana строит панели и запросы к источнику метрик, а Prometheus собирает
    и хранит временные ряды. Панель не заменяет настройку сбора и алертов.
  category: Дашборды
  context: 
