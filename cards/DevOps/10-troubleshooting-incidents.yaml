topic: Диагностика, инциденты и восстановление
cards:
- id: 62f3fd3d-8f4b-45b9-ae8c-aed291c7964b
  question: С чего начать расследование сообщения «сервис не работает»?
  answer: Уточнить пользовательский симптом, время начала, масштаб и последние изменения;
    проверить ключевой сценарий и метрики, затем сузить проблему до клиента, сети,
    Pod или зависимости.
  category: Подход
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b81237ac-c2de-4e0a-92b9-32a2d60f7284
  question: Почему сначала стоит оценить влияние инцидента, а не сразу искать root
    cause?
  answer: Нужно понять приоритет, затронутых пользователей и необходимость быстрого
    смягчения. Корневую причину можно выяснять после восстановления сервиса.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f9d73dab-a4cd-4772-b35e-9e528626b3de
  question: Как отличить инцидент от проблемы в эксплуатации?
  answer: Инцидент — нарушение или деградация сервиса, требующая восстановления; проблема
    — изучаемая первопричина одного или нескольких инцидентов.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 7568c85e-e8ac-4b1a-8ffb-481cef8a89e0
  question: Что проверить, если Deployment обновился, но новые Pod не Ready?
  answer: Смотреть rollout status, describe Pod и events, логи контейнера, probes,
    ресурсы, образ и зависимости. Проверить отличия от прежней версии.
  category: Kubernetes
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b01e50a6-4e22-4318-ba31-41bf9490f908
  question: Как получить логи предыдущего запуска контейнера после рестарта?
  answer: Использовать kubectl logs для Pod и контейнера с флагом --previous, пока
    предыдущие логи доступны на узле.
  category: Kubernetes
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 5e5e3646-b7e8-430b-b476-701572fc745f
  question: Зачем kubectl describe pod, если уже есть application logs?
  answer: Describe показывает состояние контейнера, причины завершения, probes, scheduling
    и события Kubernetes, которые приложение может не логировать.
  category: Kubernetes
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 62b9c58f-e835-48a5-9047-dbe472e01433
  question: Что означает OOMKilled и какие данные нужны до увеличения лимита?
  answer: Контейнер превысил доступный memory limit и был завершён. Нужно проверить
    потребление процесса, heap и нативную память Java, нагрузку и тренд перед изменением
    лимита.
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 0697ab57-e22e-40ae-96f5-ec022fd3ebf1
  question: Как действовать при CrashLoopBackOff нового релиза?
  answer: Проверить код выхода, предыдущие логи, конфигурацию, секреты и ресурсы;
    если есть пользовательское влияние, оценить безопасный откат с учётом миграции
    данных.
  category: Kubernetes
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fde5e7d2-e3f6-4ec9-8c4c-97f858179920
  question: Почему рост 5xx после деплоя не всегда означает ошибку нового кода?
  answer: Могли измениться конфигурация, нагрузка, upstream, сеть или схема данных.
    Сравнить версии, маршруты и временную корреляцию с метриками зависимостей.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e1e63566-3d08-48b4-915b-7de9cb0f43c4
  question: Что делать, если Pod Ready, но Service возвращает 503?
  answer: Проверить endpoints, selector, port/targetPort, ingress и сеть; readiness
    Pod не гарантирует корректность всей цепочки маршрута.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 019df8b1-2cbc-4c39-83c1-5a4a831f3541
  question: Как проверить доступность внешнего API из Kubernetes без утилит в образе
    приложения?
  answer: Использовать разрешённый диагностический или ephemeral container в том же
    сетевом контексте, проверить DNS, TCP, TLS и HTTP; не изменять production-образ
    ради диагностики.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 06ea1ea5-b508-4508-a045-3524e3fff443
  question: Что проверить, если DNS-имя работает локально, но не внутри Pod?
  answer: Сравнить DNS-конфигурацию, namespace, CoreDNS, NetworkPolicy и выход к нужному
    резолверу из Pod; локальная машина использует другую сеть.
  category: Сеть
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dc67a5d4-8247-42ec-983c-fc7ea653db92
  question: Как отличить отказ БД от исчерпания пула соединений приложения?
  answer: Сопоставить доступность БД напрямую, число активных и ожидающих соединений
    в пуле, задержку запросов и ошибки. БД может быть доступна, но соединения приложения
    заняты.
  category: База данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ab146546-ab83-492b-8102-96a205fc5634
  question: Почему внезапный рост задержки при низком CPU требует проверки зависимостей?
  answer: Потоки могут ждать БД, брокер, внешнее API, блокировку или сетевой таймаут.
    Смотреть traces, pool и метрики зависимостей.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c612d63b-d98f-42e9-91de-3cfcdd5369cb
  question: Что делать, если очередь сообщений растёт быстрее, чем обрабатывается?
  answer: Сравнить скорость поступления и обработки, возраст сообщений, ошибки, redelivery
    и состояние потребителей; затем устранить узкое место или безопасно увеличить
    параллелизм.
  category: Очереди
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3bc34965-b1bb-44e8-a550-024683c2fdc3
  question: Почему увеличение числа consumers может не уменьшить Kafka lag?
  answer: Параллелизм ограничен числом партиций в группе, а общая БД или внешний сервис
    может стать узким местом. Нужно измерить причину задержки.
  category: Kafka
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d083e33b-7734-412c-b18b-fb4a093e5ddc
  question: Как проверить, что инцидент вызван изменением конфигурации?
  answer: Сравнить эффективные values и manifest с предыдущим релизом, время изменения
    и поведение до/после; учитывать дрейф и внешние секреты.
  category: Конфигурация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2a663605-b913-4eb2-ae07-770e94254e1d
  question: Когда rollback быстрее и безопаснее исправления на месте?
  answer: Когда проблема связана с новым релизом, старая версия совместима с данными
    и откат проверен; иначе нужен отдельный план восстановления.
  category: Восстановление
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 8ffa7faa-8672-4bee-9f8d-a52ceee90dad
  question: Почему rollback образа не всегда возвращает систему в прежнее состояние?
  answer: Миграции БД, события и внешние действия уже могли изменить данные. Нужно
    проверять совместимость и предусматривать компенсацию.
  category: Восстановление
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 83ea48fe-625f-4b96-babd-29dd7c5baa8d
  question: Что такое runbook и что в нём должно быть?
  answer: Краткая инструкция по распознаванию симптома, проверкам, безопасным действиям,
    контактам и условиям эскалации и восстановления.
  category: Операционная готовность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 40d21c52-9914-42e8-8e8f-4fb5a00cfb0b
  question: Чем RTO отличается от RPO при плане восстановления?
  answer: RTO ограничивает допустимое время восстановления, RPO — допустимую потерю
    данных по времени. Резервные копии и процедура восстановления должны проверяться
    против обеих целей.
  category: Восстановление
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: c1634339-620d-4b57-87a8-759a9e7d0d51
  question: Почему наличие backup не доказывает возможность восстановить сервис?
  answer: Копия может быть неполной, повреждённой, слишком старой или восстановление
    может не уложиться в RTO. Нужны регулярные тесты восстановления.
  category: Резервирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: a28cc52b-1b34-45f9-b909-b8ea99cdbcf7
  question: Какие факты фиксировать во время инцидента?
  answer: Время симптомов и изменений, масштаб, гипотезы, проверки, действия и их
    результат, участников и ссылки на данные. Это помогает передаче смены и разбору.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 946fbe2b-2253-4659-8b71-2a1cb4730ea8
  question: Что такое postmortem и какой результат от него полезен?
  answer: Разбор хронологии, влияния, технических и процессных факторов с конкретными
    мерами предотвращения и обнаружения; цель — улучшить систему, а не назначить виновного.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 798c3c33-1a2f-490e-94c6-a239ef75415d
  question: Когда нужно эскалировать инцидент другой команде?
  answer: Когда затронута их зона ответственности, не хватает полномочий или знаний,
    превышен срок реакции либо влияние растёт. Передать симптомы, проверки и текущий
    статус.
  category: Коммуникация
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 502b4b24-567e-42e3-9f5c-215551c3ef8c
  question: Почему хаотичное изменение нескольких параметров мешает диагностике?
  answer: После нескольких одновременных изменений нельзя определить, что повлияло
    на результат, и сложнее откатиться. Нужны гипотеза, один контролируемый шаг и
    измерение.
  category: Подход
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0b79a0bf-827f-4367-9a4f-8394d872eebd
  question: Как проверить восстановление после исправления?
  answer: Проверить пользовательский сценарий, ошибки, задержку, очередь и зависимости
    на достаточном окне; убедиться, что временные обходы сняты или зафиксированы.
  category: Восстановление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 95da8df1-64aa-480e-bb3b-f1fcb0673b00
  question: Что делать, если причина неизвестна, но сервис деградирует?
  answer: 'Снизить влияние безопасным обходом: ограничить трафик, отключить неисправную
    функцию или откатить совместимый релиз; параллельно сохранять диагностические
    данные и продолжать поиск.'
  category: Инциденты
  context: 
