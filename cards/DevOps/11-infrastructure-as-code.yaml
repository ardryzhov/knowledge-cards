---
topic: Infrastructure as Code и автоматизация
cards:
- id: 0f3ec5b9-76a8-4162-9c6e-b4abf448a272
  question: Что означает Infrastructure as Code?
  answer: Инфраструктуру описывают в версиях кода и меняют через повторяемый процесс
    с ревью и проверкой плана. Это улучшает прослеживаемость, но не отменяет проверки
    результата.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 323d72be-0e15-4bfd-864d-51763479b1e9
  question: Чем декларативное описание отличается от императивного скрипта?
  answer: Декларативное задаёт желаемое состояние, а инструмент вычисляет необходимые
    действия; императивное перечисляет шаги. Оба подхода требуют контроля побочных
    эффектов.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: f324f0d3-db8e-4622-828c-30e42cb4bf6c
  question: Что делает terraform plan?
  answer: Сравнивает конфигурацию, состояние и доступные сведения о реальных ресурсах,
    показывая ожидаемые действия до apply. План нужно читать, особенно удаления и
    замены.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 232b3601-2ec3-4f9f-9520-8c986cc07606
  question: Что хранит Terraform state?
  answer: Соответствие между ресурсами конфигурации и управляемыми объектами, а также
    их атрибуты. State может содержать чувствительные значения и требует защищённого
    хранения.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3f546be0-4591-463f-9c7d-fa9d90dcfc84
  question: Почему локальный Terraform state плохо подходит для общей команды?
  answer: Он может потеряться и не обеспечивает удобной блокировки и общего источника
    истины. Обычно нужен remote backend с контролем доступа и безопасным хранением.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4d57561d-2a0f-431f-9beb-76f5e617f853
  question: Что такое drift инфраструктуры?
  answer: Фактическое состояние отличается от описанного в коде или state, например
    после ручной правки. Его выявляют планом и разрешают осознанно.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: f884604f-f079-4e54-9e78-ec556a4bc33c
  question: Почему terraform apply без просмотра плана рискован?
  answer: Незамеченная замена ресурса или удаление может вызвать простой и потерю
    данных. Нужны ревью изменений и контроль среды, к которой применяют план.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ba6e6326-4df3-452f-bf89-fdea39cde6f1
  question: Когда Terraform resource нужно импортировать, а не создавать заново?
  answer: Когда объект уже существует и его надо взять под управление конфигурацией.
    Перед импортом сверяют идентичность, параметры и план, чтобы не изменить ресурс
    неожиданно.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1ff7238e-ac26-449d-9cd4-c6ab1ea9c841
  question: Зачем Terraform modules?
  answer: Они позволяют повторно использовать согласованную конфигурацию ресурсов
    с входами и выходами. Важно закреплять версии и не скрывать критичные настройки.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 6ce3e9f0-09f1-4607-ac3e-7759b554b19c
  question: Почему секрет нельзя считать безопасным только из-за пометки sensitive
    в Terraform?
  answer: Пометка скрывает значение в некоторых выводах, но оно может оставаться в
    state. Нужны защищённый backend, доступ и по возможности отдельная выдача секрета.
  category: Terraform
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 41ab5abe-94c1-4eb2-811f-00a85baaeb5e
  question: Что такое Ansible inventory?
  answer: Набор управляемых узлов и групп с параметрами подключения и переменными.
    Он определяет, где playbook выполнит действия.
  category: Ansible
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 757cc559-6f31-47bb-953f-de169d6dca20
  question: Что такое Ansible playbook?
  answer: Описание последовательности plays и tasks для настройки узлов. Обычно используется
    YAML и модули, обеспечивающие желаемое состояние.
  category: Ansible
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 825389f8-1bdb-407b-b376-9f2cd8db09d3
  question: Что означает идемпотентность задачи Ansible?
  answer: 'Повторное выполнение при неизменном входе не должно вносить новые изменения.
    Нужно проверять конкретный модуль и команду: shell-скрипт не становится идемпотентным
    автоматически.'
  category: Ansible
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 41b15a45-96cf-4e48-ab5e-fb9fe0bc30ca
  question: Для чего нужен Ansible handler?
  answer: Он выполняет действие после уведомления от изменившейся задачи, например
    перезапускает сервис при изменении конфигурации. Это избегает ненужных рестартов.
  category: Ansible
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 00a80c64-295a-4942-bc42-5ece41a4615d
  question: Чем Terraform и Ansible обычно различаются по типовым задачам?
  answer: Terraform часто управляет жизненным циклом инфраструктурных ресурсов через
    state; Ansible настраивает системы и приложения через inventory и tasks. Граница
    зависит от платформы и практик команды.
  category: Выбор инструмента
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8230745c-2070-4e26-bc5d-918302d6bb3e
  question: Почему Bash-скрипт деплоя должен завершаться ненулевым кодом при ошибке?
  answer: Иначе pipeline может считать неуспешный шаг успешным и продолжить публикацию
    или релиз. Нужно явно проверять критичные команды и итог.
  category: Shell
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: edaff0c6-b748-4c08-827c-d48153c9a6c5
  question: Чем pipefail полезен в shell pipeline?
  answer: С ним ошибка команды внутри конвейера может сделать весь pipeline неуспешным,
    а не скрыться за успешным кодом последней команды. Поведение зависит от оболочки.
  category: Shell
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8aae6fbd-e008-48ce-ade4-35e93b68553e
  question: Почему set -e не заменяет явную обработку ошибок в Bash?
  answer: Его поведение имеет исключения в условных выражениях, конвейерах и функциях.
    Критичные шаги требуют понятной проверки результата и восстановления.
  category: Shell
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: e816a384-8974-4ac7-9c9f-15b3484e6370
  question: Как избежать применения IaC к неправильной среде?
  answer: Проверять контекст, backend или workspace, credentials, параметры среды
    и план в pipeline; ограничивать права и требовать ревью критичных изменений.
  category: Среды
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b5f726c6-c915-4725-96c5-871e1d9870be
  question: Зачем проверять IaC в CI до apply?
  answer: Форматирование, валидация, анализ плана и политики помогают обнаружить ошибки
    и опасные изменения до применения. Они не доказывают отсутствие runtime-ошибок.
  category: CI/CD
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5d36074a-798c-4a1a-aa3d-93d2ff8465e5
  question: Что делать, если Terraform plan предлагает удалить production БД неожиданно?
  answer: Остановить применение, проверить изменения конфигурации, state, workspace
    и реальные ресурсы; выяснить причину и согласовать безопасный план, не маскируя
    удаление механически.
  category: Практический кейс
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d1ee83e0-5f2a-4767-b8f7-deadadf32a23
  question: Почему ручное исправление инфраструктуры во время инцидента нужно затем
    отразить в IaC?
  answer: Иначе следующий apply может вернуть старое состояние или уничтожить временное
    исправление. После восстановления нужно согласовать код, state и фактический ресурс.
  category: Drift
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
