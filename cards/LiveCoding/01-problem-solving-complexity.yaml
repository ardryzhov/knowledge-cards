- id: b256240e-1051-4e87-abe4-bf3379e0d02b
  question: Что делать, если оптимальное решение не приходит сразу?
  answer: Описать простой вариант и его сложность, найти повторяющуюся работу, выбрать
    подходящий паттерн и проверить улучшение на контрпримере.
  category: Подход
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 70b24aaa-081e-4c26-a75b-7d7079a6f949
  question: Как действовать, если условие задачи неоднозначно?
  answer: Уточнить примером спорный случай, зафиксировать предположение и решить задачу
    в выбранном контракте. Молчаливое угадывание ведёт к неверному решению.
  category: Подход
