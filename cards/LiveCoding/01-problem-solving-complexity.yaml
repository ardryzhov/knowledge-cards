- id: c5e73da8-db54-49c6-85b2-55338480e5aa
  question: Как объяснить корректность решения с HashSet для поиска дубля?
  answer: После обработки префикса set содержит все увиденные значения; новый элемент
    уже в set тогда и только тогда, когда дубль найден в префиксе.
