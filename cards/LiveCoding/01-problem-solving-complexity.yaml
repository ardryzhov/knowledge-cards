- id: f61a3afc-d93a-46ef-8e12-50eda00c819d
  question: Как определить пространственную сложность решения?
  answer: 'Считать дополнительную память относительно входа: новые массивы, map, стек
    рекурсии. Входные данные обычно не включают, а память результата оговаривают отдельно.'
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bb029755-0dd7-41db-b306-5ff7d6baf0bc
  question: Почему рекурсия может иметь O(n) дополнительной памяти без новых коллекций?
  answer: Каждый вложенный вызов занимает кадр стека; глубина n даёт O(n) памяти стека.
  category: Память
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 8887f008-08ba-4b23-84f7-242d3d25d8c5
  question: Когда O(n log n) сортировки выгоднее O(n²) поиска всех пар?
  answer: Если после сортировки пары можно найти линейным проходом, общая стоимость
    O(n log n) лучше квадратичной для больших n. Нужно учитывать изменение порядка
    и память.
  category: Выбор подхода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b17a641e-5864-4980-a7f7-d910ba8b604e
  question: Что означает ограничение входа n ≤ 100 на выбор алгоритма?
  answer: Оно может допускать O(n²), если константы и время разумны. Выбор всё равно
    проверяют по лимитам и числу тестов, а не только по n.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 731d3940-270a-4430-87d0-72e36052ff19
  question: Почему лучший Big O не всегда даёт более быстрое решение на малом входе?
  answer: Константы, аллокации, кэш и сложность реализации могут перевесить асимптотику.
    Для интервью сначала нужна корректность, затем разумный компромисс.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: cdab36fb-4bc4-46b7-a309-6cf64beeaa86
  question: Как оценить сложность цепочки из сортировки и одного прохода?
  answer: 'Сложить этапы: O(n log n)+O(n), доминирует O(n log n). Память оценить отдельно
    по способу сортировки.'
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 87480a15-5c0f-4411-b28d-789d38ad039d
  question: Как оценить сложность перебора всех пар элементов?
  answer: При двух полных вложенных циклах число пар порядка n², значит время O(n²);
    память может оставаться O(1).
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 5e9fecea-4ce7-42c0-95b5-f19578e62884
  question: Когда можно использовать два указателя вместо дополнительного HashSet?
  answer: Часто на отсортированном массиве или строке, когда движение указателей исключает
    уже проверенные варианты. Нужно учесть сортировку, если вход не отсортирован.
  category: Выбор структуры
