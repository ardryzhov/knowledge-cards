- id: ebba38fd-35a9-426a-87c4-db760440842f
  question: Какие условия стоит уточнить до выбора алгоритма?
  answer: Формат входа и выхода, ограничения размера, пустые значения, дубликаты,
    порядок, допустимость изменения входа и требования к памяти. Эти условия могут
    менять подход.
  category: Подход
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: ed2d33e9-b1bd-49b9-a708-33e0fb4fba17
  question: Зачем сначала придумать простое корректное решение?
  answer: Оно задаёт базу для сравнения и помогает проверить понимание задачи. Затем
    ищут узкое место и улучшают сложность, сохраняя корректность.
  category: Подход
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e2cefaf9-3fdc-499e-8299-9ed6efc3349e
  question: Как проверить идею решения до написания кода?
  answer: Пройти вручную обычный, граничный и контрпример, сформулировать инвариант
    и ожидаемую сложность. Если шаг невозможно объяснить, код пока рано писать.
  category: Подход
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a06c23d8-8182-4f77-a738-668daa95134e
  question: Что такое инвариант алгоритма?
  answer: Условие, которое сохраняется на каждом шаге и помогает доказать корректность.
    Например, в двух указателях уже пройденная часть больше не содержит ответа.
  category: Корректность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b76a2635-14e8-4a41-ba45-153405714eaf
  question: Как выбрать тесты для решения на собеседовании?
  answer: Проверить пустой и минимальный вход, дубликаты, границы, уже упорядоченный
    и обратный порядок, переполнение и отсутствие ответа там, где применимо.
  category: Проверка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
