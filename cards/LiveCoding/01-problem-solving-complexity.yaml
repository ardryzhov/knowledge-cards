- id: cccea686-aed7-4e12-8d75-bfd3afdff66c
  question: Почему нельзя оценивать алгоритм только по времени?
  answer: Ограничения памяти и размер входа могут сделать O(n) дополнительного хранения
    неприемлемым; также важны изменения входа и устойчивость к краям.
