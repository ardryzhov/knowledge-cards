- id: e81c50d3-9da2-4892-87e5-044feac53c1c
  question: Что означает O(n) для времени работы?
  answer: При росте входа n число основных операций растёт не быстрее порядка n с
    точностью до постоянных факторов и младших членов.
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 8c28a337-5192-4f3d-9ced-cf0d66762245
  question: Почему два последовательных цикла по n дают O(n), а вложенные — часто
    O(n²)?
  answer: 'В последовательных циклах работы складываются: n+n; во вложенных перемножаются:
    n×n, если каждый проходит весь вход.'
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a3aa9ad2-056f-4b3c-bc3f-3e6837d69bbb
  question: Что означает O(log n) и где оно встречается?
  answer: Число шагов растёт логарифмически, если на каждом шаге размер задачи сокращается
    в постоянное число раз, как в бинарном поиске.
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 971b1997-e6a0-4fb8-af33-2c7800ff5b3a
  question: Почему HashMap не гарантирует строго O(1) для каждой операции?
  answer: Обычно ожидается O(1) в среднем, но коллизии, resize и свойства ключей влияют
    на отдельную операцию и худший случай.
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d41adc4a-f0a8-4dac-9c28-9873aa660ffd
  question: Что означает амортизированная O(1) у добавления в ArrayList?
  answer: Иногда расширение массива требует O(n), но при серии добавлений суммарная
    стоимость распределяется так, что средняя на операцию остаётся O(1).
  category: Big O
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
