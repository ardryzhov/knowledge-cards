topic: "Подход к задаче и сложность"
cards:
  - question: "Какие условия стоит уточнить до выбора алгоритма?"
    answer: "Формат входа и выхода, ограничения размера, пустые значения, дубликаты, порядок, допустимость изменения входа и требования к памяти. Эти условия могут менять подход."
    category: "Подход"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем сначала придумать простое корректное решение?"
    answer: "Оно задаёт базу для сравнения и помогает проверить понимание задачи. Затем ищут узкое место и улучшают сложность, сохраняя корректность."
    category: "Подход"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить идею решения до написания кода?"
    answer: "Пройти вручную обычный, граничный и контрпример, сформулировать инвариант и ожидаемую сложность. Если шаг невозможно объяснить, код пока рано писать."
    category: "Подход"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое инвариант алгоритма?"
    answer: "Условие, которое сохраняется на каждом шаге и помогает доказать корректность. Например, в двух указателях уже пройденная часть больше не содержит ответа."
    category: "Корректность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать тесты для решения на собеседовании?"
    answer: "Проверить пустой и минимальный вход, дубликаты, границы, уже упорядоченный и обратный порядок, переполнение и отсутствие ответа там, где применимо."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает O(n) для времени работы?"
    answer: "При росте входа n число основных операций растёт не быстрее порядка n с точностью до постоянных факторов и младших членов."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему два последовательных цикла по n дают O(n), а вложенные — часто O(n²)?"
    answer: "В последовательных циклах работы складываются: n+n; во вложенных перемножаются: n×n, если каждый проходит весь вход."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что означает O(log n) и где оно встречается?"
    answer: "Число шагов растёт логарифмически, если на каждом шаге размер задачи сокращается в постоянное число раз, как в бинарном поиске."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему HashMap не гарантирует строго O(1) для каждой операции?"
    answer: "Обычно ожидается O(1) в среднем, но коллизии, resize и свойства ключей влияют на отдельную операцию и худший случай."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает амортизированная O(1) у добавления в ArrayList?"
    answer: "Иногда расширение массива требует O(n), но при серии добавлений суммарная стоимость распределяется так, что средняя на операцию остаётся O(1)."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить пространственную сложность решения?"
    answer: "Считать дополнительную память относительно входа: новые массивы, map, стек рекурсии. Входные данные обычно не включают, а память результата оговаривают отдельно."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему рекурсия может иметь O(n) дополнительной памяти без новых коллекций?"
    answer: "Каждый вложенный вызов занимает кадр стека; глубина n даёт O(n) памяти стека."
    category: "Память"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда O(n log n) сортировки выгоднее O(n²) поиска всех пар?"
    answer: "Если после сортировки пары можно найти линейным проходом, общая стоимость O(n log n) лучше квадратичной для больших n. Нужно учитывать изменение порядка и память."
    category: "Выбор подхода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает ограничение входа n ≤ 100 на выбор алгоритма?"
    answer: "Оно может допускать O(n²), если константы и время разумны. Выбор всё равно проверяют по лимитам и числу тестов, а не только по n."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему лучший Big O не всегда даёт более быстрое решение на малом входе?"
    answer: "Константы, аллокации, кэш и сложность реализации могут перевесить асимптотику. Для интервью сначала нужна корректность, затем разумный компромисс."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как оценить сложность цепочки из сортировки и одного прохода?"
    answer: "Сложить этапы: O(n log n)+O(n), доминирует O(n log n). Память оценить отдельно по способу сортировки."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как оценить сложность перебора всех пар элементов?"
    answer: "При двух полных вложенных циклах число пар порядка n², значит время O(n²); память может оставаться O(1)."
    category: "Big O"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда можно использовать два указателя вместо дополнительного HashSet?"
    answer: "Часто на отсортированном массиве или строке, когда движение указателей исключает уже проверенные варианты. Нужно учесть сортировку, если вход не отсортирован."
    category: "Выбор структуры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем проговаривать предположения интервьюеру?"
    answer: "Например, можно ли менять вход и есть ли дубликаты. Явные предположения позволяют согласовать решение и объяснить выбор структуры."
    category: "Коммуникация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как объяснить корректность решения с HashSet для поиска дубля?"
    answer: "После обработки префикса set содержит все увиденные значения; новый элемент уже в set тогда и только тогда, когда дубль найден в префиксе."
    category: "Корректность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если оптимальное решение не приходит сразу?"
    answer: "Описать простой вариант и его сложность, найти повторяющуюся работу, выбрать подходящий паттерн и проверить улучшение на контрпримере."
    category: "Подход"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если условие задачи неоднозначно?"
    answer: "Уточнить примером спорный случай, зафиксировать предположение и решить задачу в выбранном контракте. Молчаливое угадывание ведёт к неверному решению."
    category: "Подход"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему нельзя оценивать алгоритм только по времени?"
    answer: "Ограничения памяти и размер входа могут сделать O(n) дополнительного хранения неприемлемым; также важны изменения входа и устойчивость к краям."
    category: "Компромиссы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить после написания решения перед сдачей?"
    answer: "Пройти минимальный и граничный вход, проверить индексы, null/пустой случай, переполнение, возврат при отсутствии ответа и заявленную сложность."
    category: "Проверка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
