topic: "Паттерны решения задач"
cards:
  - question: "По какому признаку в задаче полезен HashMap или HashSet?"
    answer: "Нужны быстрые проверки «видели ли значение», поиск пары или подсчёт частот. Сначала определить ключ и его корректные equals/hashCode."
    category: "Хеширование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда вместо HashMap нужен TreeMap?"
    answer: "Когда требуется упорядоченный обход ключей или диапазонные операции; плата — O(log n) вместо ожидаемого O(1) для hash-структуры."
    category: "Хеширование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как распознать задачу на два указателя?"
    answer: "Есть упорядоченный вход или возможность двигать границы с исключением вариантов: пара в отсортированном массиве, разворот, фильтрация на месте."
    category: "Два указателя"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какой инвариант у двух указателей при поиске суммы в отсортированном массиве?"
    answer: "Если сумма мала, сдвиг левого указателя вправо исключает меньшие значения; если велика, сдвиг правого влево исключает большие."
    category: "Два указателя"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда подходит скользящее окно?"
    answer: "Ищется непрерывный подотрезок или подстрока с условием, которое можно обновлять при добавлении справа и удалении слева."
    category: "Окно"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему обычное окно с сужением по сумме опасно при отрицательных числах?"
    answer: "Сумма перестаёт монотонно меняться при расширении и сужении, поэтому правило сдвига границ может пропустить ответ."
    category: "Окно"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда использовать префиксные суммы?"
    answer: "Когда нужно быстро вычислять суммы многих диапазонов или искать подотрезки по сумме. После O(n) подготовки запрос диапазона может быть O(1)."
    category: "Префиксные суммы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему для поиска подотрезка с суммой K при отрицательных числах помогает map префиксных сумм?"
    answer: "Если текущая сумма S, нужен ранее встреченный префикс S−K. Разность даёт сумму нужного подотрезка без предположения о знаке чисел."
    category: "Префиксные суммы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда бинарный поиск применим помимо поиска элемента в массиве?"
    answer: "Когда предикат по ответу монотонен: сначала false, затем true или наоборот. Можно искать первую подходящую границу."
    category: "Бинарный поиск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как избежать бесконечного цикла в бинарном поиске границы?"
    answer: "Задать инвариант диапазона, формулу середины и ветви, которые строго уменьшают интервал; проверить случай из одного элемента."
    category: "Бинарный поиск"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда сортировка упрощает задачу?"
    answer: "Если после неё можно группировать равные элементы, пройти интервалы или использовать два указателя. Проверить, допускается ли потеря исходного порядка."
    category: "Сортировка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда стек естественно моделирует задачу?"
    answer: "При вложенности и необходимости обработать последнее незавершённое событие первым: скобки, пути, ближайший больший элемент."
    category: "Стек"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда очередь естественно моделирует задачу?"
    answer: "При обработке в порядке поступления или обходе графа по уровням. Для Java обычно использовать Queue/Deque вместо старого Stack."
    category: "Очередь"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как распознать задачу на BFS?"
    answer: "Нужен кратчайший путь по числу рёбер в невзвешенном графе или обход слоями; используется очередь и множество посещённых."
    category: "Графы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда DFS проще BFS?"
    answer: "Когда нужно обойти все достижимые вершины, проверить компоненту или выполнить поиск с возвратом, а кратчайший путь по рёбрам не требуется."
    category: "Графы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему visited нужен при обходе графа?"
    answer: "Без него циклы могут вызвать бесконечный обход или многократную обработку. Момент пометки важен при BFS для исключения дублей в очереди."
    category: "Графы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда heap или PriorityQueue полезнее сортировки всего входа?"
    answer: "Когда нужны только k лучших элементов или постоянно извлекается минимум/максимум; heap поддерживает эти операции без полной пересортировки."
    category: "Heap"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда использовать частотную map вместо сортировки?"
    answer: "Когда нужно считать повторы без требований к порядку и диапазон ключей удобен для hash; ожидаемое время O(n), память O(u)."
    category: "Частоты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое fast and slow pointers в связном списке?"
    answer: "Два указателя двигаются с разной скоростью; они помогают обнаружить цикл или найти середину без дополнительной коллекции."
    category: "Связный список"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему цикл в списке можно обнаружить двумя указателями?"
    answer: "Если цикл есть, быстрый указатель догонит медленный внутри него; если нет — дойдёт до null. Память O(1)."
    category: "Связный список"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда нужен backtracking?"
    answer: "Когда нужно перебрать комбинации с построением частичного решения и откатом выбора; полезны ранние отсечения недопустимых веток."
    category: "Перебор"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить, что задача подходит для динамического программирования?"
    answer: "Есть повторяющиеся подзадачи и оптимальная структура решения; нужно выбрать состояние, переход, базу и порядок вычисления."
    category: "DP"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему жадный выбор нужно доказывать, а не угадывать?"
    answer: "Локально лучший шаг не всегда ведёт к глобальному оптимуму. Требуется аргумент обмена или контрпример для альтернатив."
    category: "Жадные алгоритмы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выбрать между рекурсией и итерацией?"
    answer: "Сравнить естественность описания, глубину стека, память и риск переполнения стека. Для глубокого обхода явный стек надёжнее."
    category: "Рекурсия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда сравнение строк через частотные массивы лучше сортировки?"
    answer: "Если алфавит фиксирован и невелик, подсчёт частот даёт O(n) времени и O(1) памяти относительно n; сортировка стоит O(n log n)."
    category: "Частоты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

