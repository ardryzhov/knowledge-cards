- id: f893d1a8-7f45-432c-b58f-be026575ed05
  question: Даны две строки из строчных латинских букв. Проверь, являются ли они анаграммами.
  answer: 1) Разная длина сразу даёт false. 2) Увеличиваем частоты букв первой строки
    и уменьшаем по второй. 3) Все частоты нулевые — анаграммы. O(n) времени, O(1)
    памяти.
  category: Частоты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    boolean anagram(String a, String b) {
        if (a.length() != b.length()) return false;
        int[] freq = new int[26];
        for (int i = 0; i < a.length(); i++) {
            freq[a.charAt(i) - 'a']++;
            freq[b.charAt(i) - 'a']--;
        }
        for (int x : freq) if (x != 0) return false;
        return true;
    }
