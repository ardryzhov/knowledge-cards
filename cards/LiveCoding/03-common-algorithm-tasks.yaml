  question: Найди максимальную сумму непустого непрерывного подмассива int[]; вход
    непустой, результат помещается в int.
  answer: '1) На каждом элементе выбираем: продолжить текущий отрезок или начать новый.
    2) Обновляем лучший ответ. O(n) времени, O(1) памяти.'
  category: Динамическое программирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    int maxSubarray(int[] a) {
        int cur = a[0], best = a[0];
        for (int i = 1; i < a.length; i++) {
            cur = Math.max(a[i], cur + a[i]);
            best = Math.max(best, cur);
        }
        return best;
    }
- id: 76965bbc-7160-4d1e-a790-b16274e5ab73
  question: Найди длину самой длинной подстроки без повторяющихся char; сравнение
    идёт по UTF-16 char.
  answer: 1) Храним последний индекс символа. 2) При повторе сдвигаем левую границу
    за прошлое появление. 3) Обновляем максимум. O(n) времени, O(u) памяти.
  category: Скользящее окно
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    int longestUnique(String s) {
        Map<Character, Integer> last = new HashMap<>();
        int left = 0, best = 0;
        for (int right = 0; right < s.length(); right++) {
            char c = s.charAt(right);
            if (last.containsKey(c)) left = Math.max(left, last.get(c) + 1);
            last.put(c, right);
            best = Math.max(best, right - left + 1);
        }
        return best;
    }
- id: d9df485c-7060-4419-8888-748a618bec24
  question: Даны отсортированный int[] и target. Есть ли пара разных элементов с такой
    суммой?
  answer: 1) Ставим указатели по краям. 2) Сумма меньше target — двигаем левый, больше
    — правый. 3) При равенстве нашли ответ. O(n) времени, O(1) памяти.
  category: Два указателя
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    boolean pairSum(int[] a, long target) {
        int l = 0, r = a.length - 1;
        while (l < r) {
            long sum = (long) a[l] + a[r];
            if (sum == target) return true;
            if (sum < target) l++;
            else r--;
        }
        return false;
    }
- id: 940d253c-5cb0-4bbc-b76c-c47c501ea6ea
  question: Проверь, является ли строка палиндромом, игнорируя регистр и неалфавитно-цифровые
    символы; работай с char.
  answer: 1) Два указателя идут навстречу. 2) Пропускаем неподходящие символы. 3)
    Сравниваем после приведения регистра. O(n) времени, O(1) памяти.
  category: Два указателя
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    boolean palindrome(String s) {
        int l = 0, r = s.length() - 1;
        while (l < r) {
            if (!Character.isLetterOrDigit(s.charAt(l))) {
                l++;
                continue;
            }
            if (!Character.isLetterOrDigit(s.charAt(r))) {
                r--;
                continue;
            }
            if (Character.toLowerCase(s.charAt(l)) !=
                Character.toLowerCase(s.charAt(r))) return false;
            l++;
            r--;
        }
        return true;
    }
- id: 37b75bc6-bc0e-4c46-b16b-6507f53c832a
  question: Определи, содержит ли односвязный список цикл; Node содержит поле next.
  answer: 1) Медленный указатель идёт на один узел, быстрый на два. 2) Встретились
    — цикл есть. 3) Быстрый дошёл до null — цикла нет. O(n) времени, O(1) памяти.
  category: Связный список
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    boolean hasCycle(Node head) {
        Node slow = head, fast = head;
        while (fast != null && fast.next != null) {
            slow = slow.next;
            fast = fast.next.next;
            if (slow == fast) return true;
        }
        return false;
    }
- id: 63252bba-0e6c-4785-88aa-f6aaf513caee
  question: Даны два отсортированных int[] a и b. Верни новый отсортированный массив
    всех элементов.
  answer: 1) Держим индекс в каждом входе. 2) Берём меньший элемент. 3) Дописываем
    остаток. O(n+m) времени и O(n+m) памяти для результата.
  category: Слияние
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    int[] merge(int[] a, int[] b) {
        int[] out = new int[a.length + b.length];
        int i = 0, j = 0, k = 0;
        while (i < a.length && j < b.length) {
            if (a[i] <= b[j]) out[k++] = a[i++];
            else out[k++] = b[j++];
        }
        while (i < a.length) {
            out[k++] = a[i++];
        }
        while (j < b.length) {
            out[k++] = b[j++];
        }
        return out;
    }
- id: 5160df0e-7ec2-45c9-a9de-585bd72da911
  question: Дан int[] с возможными отрицательными значениями. Посчитай число непрерывных
    подмассивов с суммой k; ответ помещается в long.
  answer: 1) Храним частоты префиксных сумм, начав с 0→1. 2) Для текущей суммы S добавляем
    частоту S−k. 3) Затем записываем S. Ожидаемо O(n) времени и памяти.
  category: Префиксные суммы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: |
    long countSubarrays(int[] a, long k) {
        Map<Long, Long> freq = new HashMap<>();
        freq.put(0L, 1L);
        long sum = 0, count = 0;
        for (int x : a) {
            sum += x;
            count += freq.getOrDefault(sum - k, 0L);
            freq.merge(sum, 1L, Long::sum);
        }
        return count;
    }
- id: c0fa313f-be36-47d9-80ba-095d4ec707ca
  question: Дан отсортированный int[]. Удали дубликаты на месте и верни новую длину;
    элементы после неё не важны.
  answer: 1) Один указатель читает, второй пишет следующий уникальный элемент. 2)
    Сравниваем с последним записанным. O(n) времени, O(1) памяти.
  category: Два указателя
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    int uniqueLength(int[] a) {
        if (a.length == 0) return 0;
        int write = 1;
        for (int read = 1; read < a.length; read++) {
            if (a[read] != a[write - 1]) {
                a[write] = a[read];
                write++;
            }
        }
        return write;
    }
- id: 957070ce-e7ed-47cf-bea8-7df6e75e6b5b
  question: Найди минимальную длину непрерывного подмассива с суммой ≥ target; все
    элементы положительны, target > 0.
  answer: 1) Расширяем окно вправо. 2) Пока сумма достаточна, обновляем ответ и сужаем
    слева. 3) Если нет ответа, возвращаем 0. O(n) времени, O(1) памяти.
  category: Скользящее окно
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    int minLength(int[] a, long target) {
        int left = 0, best = a.length + 1;
        long sum = 0;
        for (int right = 0; right < a.length; right++) {
            sum += a[right];
            while (sum >= target) {
                best = Math.min(best, right - left + 1);
                sum -= a[left++];
            }
        }
        return best == a.length + 1 ? 0 : best;
    }
