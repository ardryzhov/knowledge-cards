- id: a40764d9-6da8-414b-a6bb-ab149e0d1203
  question: Дан int[] и target. Верни индексы двух разных элементов с суммой target
    или пустой массив; существует не более одного ответа.
  answer: '1) Идём слева направо. 2) Для x ищем target−x среди уже увиденных. 3) Если
    нет — сохраняем x и индекс. Сложность: O(n) времени, O(n) памяти.'
  category: HashMap
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    int[] twoSum(int[] a, int target) {
        Map<Long, Integer> seen = new HashMap<>();
        for (int i = 0; i < a.length; i++) {
            long need = (long) target - a[i];
            if (seen.containsKey(need)) return new int[]{seen.get(need), i};
            seen.put((long) a[i], i);
        }
        return new int[0];
    }
