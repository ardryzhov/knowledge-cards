- id: 86a4080d-c71e-4623-ba16-6a3b4c4b022c
  question: Дан массив закрытых интервалов [start,end], start≤end. Объедини пересекающиеся
    интервалы; вход не меняй.
  answer: 1) Копируем внешний массив и сортируем по start. 2) Каждый интервал либо
    создаёт новую группу, либо расширяет последнюю. O(n log n) времени, O(n) памяти.
  category: Сортировка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    int[][] mergeIntervals(int[][] intervals) {
        int[][] sorted = intervals.clone();
        Arrays.sort(sorted, Comparator.comparingInt(x -> x[0]));
        List<int[]> out = new ArrayList<>();
        for (int[] p : sorted) {
            if (out.isEmpty() || out.get(out.size() - 1)[1] < p[0])
                out.add(new int[]{p[0], p[1]});
            else out.get(out.size() - 1)[1] = Math.max(out.get(out.size() - 1)[1], p[1]);
        }
        return out.toArray(int[][]::new);
    }
- id: 18c1cd6f-86a2-476e-995c-6c1a508a963a
  question: Дан невзвешенный граф `List<List<Integer>> graph` с вершинами 0..n-1.
    Найди минимальное число рёбер от s до t или -1.
  answer: 1) BFS начинает с s. 2) Каждому непосещённому соседу назначаем расстояние
    +1 и ставим в очередь. 3) Первое достижение t минимально. O(V+E) времени, O(V)
    памяти.
  category: BFS
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    int distance(List<List<Integer>> g, int s, int t) {
        int[] d = new int[g.size()];
        Arrays.fill(d, -1);
        Deque<Integer> q = new ArrayDeque<>();
        d[s] = 0;
        q.add(s);
        while (!q.isEmpty()) {
            int v = q.remove();
            if (v == t) return d[v];
            for (int u : g.get(v)) {
                if (d[u] != -1) continue;
                d[u] = d[v] + 1;
                q.add(u);
            }
        }
        return -1;
    }
