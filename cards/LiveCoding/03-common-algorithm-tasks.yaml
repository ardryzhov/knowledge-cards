- id: e3798048-346a-4362-a29a-e61e91484152
  question: Разверни односвязный список на месте; Node содержит int value и Node next.
    Верни новую голову.
  answer: 1) Держим prev и текущий узел. 2) Сохраняем next, меняем ссылку на prev.
    3) Сдвигаем оба указателя. O(n) времени, O(1) памяти.
  category: Связный список
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    Node reverse(Node head) {
        Node prev = null;
        while (head != null) {
            Node next = head.next;
            head.next = prev;
            prev = head;
            head = next;
        }
        return prev;
    }
- id: cd0f9942-c626-43f1-b5fd-bd415c0ac84e
  question: Проверь, корректно ли вложены скобки ()[]{} в строке, содержащей только
    эти символы.
  answer: 1) Открывающие кладём в стек. 2) На закрывающей проверяем ожидаемую открывающую.
    3) В конце стек пуст. O(n) времени и памяти.
  category: Стек
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    boolean valid(String s) {
        Deque<Character> st = new ArrayDeque<>();
        for (char c : s.toCharArray()) {
            if (c == '(') st.push(')');
            else if (c == '[') st.push(']');
            else if (c == '{') st.push('}');
            else if (st.isEmpty() || st.pop() != c) return false;
        }
        return st.isEmpty();
    }
- id: 21dd5e24-f51d-4714-b8a1-b2dd8a428ca3
  question: Найди индекс target в отсортированном int[] без дублей или верни -1.
  answer: 1) Держим полуоткрытый диапазон [l,r). 2) Проверяем середину. 3) Отбрасываем
    половину по сравнению. O(log n) времени, O(1) памяти.
  category: Бинарный поиск
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    int indexOf(int[] a, int target) {
        int l = 0, r = a.length;
        while (l < r) {
            int m = l + (r - l) / 2;
            if (a[m] == target) return m;
            if (a[m] < target) l = m + 1;
            else r = m;
        }
        return -1;
    }
