- id: b9235d63-d1ac-4ab1-81d9-00a806fc2bd4
  question: Дан List<String> с именами. Верни map «первая буква → список имён», пропуская
    null и пустые строки.
  answer: 1) Создаём map списков. 2) Для каждого имени вычисляем ключ и добавляем
    в нужный список. O(n) времени и O(n) памяти.
  category: Map
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    Map<Character, List<String>> byFirst(List<String> names) {
        Map<Character, List<String>> out = new HashMap<>();
        for (String s : names) {
            if (s == null || s.isEmpty()) continue;
            out.computeIfAbsent(s.charAt(0), k -> new ArrayList<>()).add(s);
        }
        return out;
    }
