- id: 0a85f6e2-69de-4a68-825c-1f7bd6879c08
  question: Даны два List<Integer>. Верни их пересечение без дублей в порядке первого
    появления в первом списке.
  answer: 1) Создаём set второго списка. 2) Идём по первому и добавляем совпадения
    в LinkedHashSet. Ожидаемо O(n+m) времени, O(n+m) памяти.
  category: Set
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    List<Integer> intersection(List<Integer> a, List<Integer> b) {
        Set<Integer> bSet = new HashSet<>(b);
        Set<Integer> out = new LinkedHashSet<>();
        for (int x : a) if (bSet.contains(x)) out.add(x);
        return new ArrayList<>(out);
    }
