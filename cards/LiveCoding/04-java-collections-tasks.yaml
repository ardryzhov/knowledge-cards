- id: c30eef30-caa2-45ad-8ffc-57b8abd0d9fa
  question: Дан List<String>. Верни частоту каждого непустого имени, сохранив порядок
    первого появления.
  answer: 1) Идём по списку. 2) Для непустого имени увеличиваем счётчик в LinkedHashMap.
    O(n) времени, O(u) памяти.
  category: Map
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    Map<String, Integer> frequencies(List<String> names) {
        Map<String, Integer> out = new LinkedHashMap<>();
        for (String name : names)
            if (name != null && !name.isBlank())
                out.merge(name, 1, Integer::sum);
        return out;
    }
