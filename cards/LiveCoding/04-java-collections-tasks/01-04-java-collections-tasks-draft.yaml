  - question: "Даны два Map<String,Integer> счётчиков. Слей их в новую map, сложив значения общих ключей."
    answer: "1) Копируем первую map. 2) Для каждой записи второй вызываем merge с суммой. Ожидаемо O(n+m) времени и O(n+m) памяти."
    category: "Map"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      Map<String, Integer> addCounts(Map<String, Integer> a,
                                     Map<String, Integer> b) {
          Map<String, Integer> out = new HashMap<>(a);
          b.forEach((key, value) -> out.merge(key, value, Integer::sum));
          return out;
      }
  - question: "Дан список задач с приоритетами int. Как выдавать задачу с максимальным приоритетом без полной сортировки после каждой вставки?"
