topic: "Java и Collections: практические задачи"
cards:
  - question: "Дан List<String>. Верни частоту каждого непустого имени, сохранив порядок первого появления."
    answer: "1) Идём по списку. 2) Для непустого имени увеличиваем счётчик в LinkedHashMap. O(n) времени, O(u) памяти."
    category: "Map"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      Map<String, Integer> frequencies(List<String> names) {
          Map<String, Integer> out = new LinkedHashMap<>();
          for (String name : names)
              if (name != null && !name.isBlank())
                  out.merge(name, 1, Integer::sum);
          return out;
      }
  - question: "Дан List<Integer>. Удали дубликаты, сохранив порядок первого появления; исходный список не меняй."
    answer: "1) LinkedHashSet одновременно убирает повторы и хранит порядок. 2) Возвращаем новый List. Ожидаемо O(n) времени и памяти."
    category: "Set"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      List<Integer> unique(List<Integer> values) {
          return new ArrayList<>(new LinkedHashSet<>(values));
      }
  - question: "Даны два List<Integer>. Верни их пересечение без дублей в порядке первого появления в первом списке."
    answer: "1) Создаём set второго списка. 2) Идём по первому и добавляем совпадения в LinkedHashSet. Ожидаемо O(n+m) времени, O(n+m) памяти."
    category: "Set"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      List<Integer> intersection(List<Integer> a, List<Integer> b) {
          Set<Integer> bSet = new HashSet<>(b);
          Set<Integer> out = new LinkedHashSet<>();
          for (int x : a) if (bSet.contains(x)) out.add(x);
          return new ArrayList<>(out);
      }
  - question: "Дан List<String>. Найди первое повторившееся значение; null допускается. Верни Optional."
    answer: "1) Храним увиденные значения в set. 2) На первом неуспешном add возвращаем Optional.ofNullable. Но Optional не может представить найденный null — нужен другой контракт. Сложность O(n)."
    category: "Контракт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Дан Map<String,Integer> с ненулевыми оценками. Верни имена с максимальной оценкой в порядке обхода входной map; вход не пустой."
    answer: "1) Найти максимум. 2) Ещё раз пройти entrySet и собрать имена с этой оценкой. O(n) времени, O(k) памяти результата."
    category: "Map"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      List<String> bestNames(Map<String, Integer> scores) {
          int max = Collections.max(scores.values());
          List<String> out = new ArrayList<>();
          for (var e : scores.entrySet())
              if (e.getValue() == max) out.add(e.getKey());
          return out;
      }
  - question: "Дан List<String>. Верни список строк по возрастанию длины, а при равной длине — лексикографически; исходный список не меняй."
    answer: "1) Копируем список. 2) Сортируем компаратором из двух критериев. O(n log n) времени, O(n) памяти копии."
    category: "Comparator"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      List<String> sortNames(List<String> names) {
          List<String> out = new ArrayList<>(names);
          out.sort(Comparator.comparingInt(String::length)
                             .thenComparing(Comparator.naturalOrder()));
          return out;
      }
  - question: "Дан List<Integer>. Верни k наибольших чисел в порядке убывания; 0≤k≤n."
    answer: "1) Держим min-heap не больше k элементов. 2) Вытесняем минимальный при превышении k. 3) Сортируем результат. O(n log(k+1)+k log k) времени, O(k) памяти."
    category: "PriorityQueue"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: |
      List<Integer> topK(List<Integer> a, int k) {
          PriorityQueue<Integer> heap = new PriorityQueue<>();
          for (int x : a) {
              heap.add(x);
              if (heap.size() > k) heap.poll();
          }
          List<Integer> out = new ArrayList<>(heap);
          out.sort(Comparator.reverseOrder());
          return out;
      }
  - question: "Как удалить все отрицательные числа из ArrayList<Integer> без ConcurrentModificationException?"
    answer: "1) Используем removeIf, который управляет изменением коллекции. 2) Проверяем результат. O(n) времени, дополнительная память зависит от реализации."
    category: "Итерация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      void removeNegative(List<Integer> values) {
          values.removeIf(x -> x < 0);
      }
  - question: "Дан List<String> с допустимыми null. Верни первую строку длиной больше 5 или Optional.empty()."
    answer: "1) Идём по списку. 2) Пропускаем null. 3) При первом совпадении возвращаем Optional.of. O(n) времени, O(1) памяти."
    category: "List"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      Optional<String> firstLong(List<String> values) {
          for (String s : values)
              if (s != null && s.length() > 5) return Optional.of(s);
          return Optional.empty();
      }
  - question: "Дана List<Integer> и значение x. Найди количество вхождений x без изменения списка."
    answer: "1) Один проход и счётчик. 2) Для объектов сравниваем через Objects.equals, чтобы корректно обработать null. O(n) времени, O(1) памяти."
    category: "List"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      int count(List<Integer> a, Integer x) {
          int n = 0;
          for (Integer v : a) if (Objects.equals(v, x)) n++;
          return n;
      }
  - question: "Дан List<String> с именами. Верни map «первая буква → список имён», пропуская null и пустые строки."
    answer: "1) Создаём map списков. 2) Для каждого имени вычисляем ключ и добавляем в нужный список. O(n) времени и O(n) памяти."
    category: "Map"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      Map<Character, List<String>> byFirst(List<String> names) {
          Map<Character, List<String>> out = new HashMap<>();
          for (String s : names) {
              if (s == null || s.isEmpty()) continue;
              out.computeIfAbsent(s.charAt(0), k -> new ArrayList<>()).add(s);
          }
          return out;
      }
  - question: "Дан Map<String,List<Integer>>. Верни общее число чисел во всех списках; значения map не null."
    answer: "1) Пройти values. 2) Суммировать size каждого списка. O(g) времени, где g — число групп, O(1) памяти."
    category: "Map"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      long totalCount(Map<String, List<Integer>> groups) {
          long n = 0;
          for (List<Integer> values : groups.values()) n += values.size();
          return n;
      }
  - question: "Дан List<User>, где User — record с полями name и age. Как найти дубли по паре этих полей, не полагаясь на equals User?"
    answer: "1) Создать отдельный ключ record(name,age). 2) Хранить ключи в set. 3) Повтор ключа означает дубль. Ожидаемо O(n) времени и памяти."
    category: "Ключи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      record Key(String name, int age) {}
      boolean hasDuplicateUsers(List<User> users) {
          Set<Key> seen = new HashSet<>();
          for (User u : users)
              if (!seen.add(new Key(u.name(), u.age()))) return true;
          return false;
      }
  - question: "Дан List<Integer>. Верни медиану нечётного числа элементов; вход не пустой и меняется только копия."
    answer: "1) Скопировать список. 2) Отсортировать. 3) Взять середину. O(n log n) времени, O(n) памяти копии."
    category: "Сортировка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      int median(List<Integer> values) {
          List<Integer> copy = new ArrayList<>(values);
          copy.sort(Integer::compareTo);
          return copy.get(copy.size() / 2);
      }
  - question: "Дан Map<String,Integer>. Увеличь значение ключа на 1, считая отсутствующий ключ нулём."
    answer: "1) Использовать merge с начальным значением 1. 2) При наличии сложить старое и новое. Ожидаемо O(1) времени."
    category: "Map"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      void increment(Map<String, Integer> counts, String key) {
          counts.merge(key, 1, Integer::sum);
      }
  - question: "Дан List<String>. Какие изменения нужны, если его будут читать и одновременно изменять разные потоки?"
    answer: "1) Уточнить соотношение чтений и записей. 2) Выбрать согласованный механизм, например CopyOnWriteArrayList для редких изменений или внешнюю блокировку. 3) Проверить составные операции. Единого универсального контейнера нет."
    category: "Конкурентность"
    context: null
    hint_1: null
