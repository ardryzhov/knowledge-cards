topic: "Java и Collections: практические задачи"
cards:
  - question: "Реализуй Iterator<T>, который последовательно проходит список итераторов; пустые итераторы пропускает, remove не поддерживает."
    answer: "1) Храним индекс текущего итератора. 2) hasNext пропускает исчерпанные. 3) next проверяет hasNext и берёт следующий элемент. Время O(k+n), память O(1) помимо списка."
    category: "Iterator"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: |
      class SequentialIterator<T> implements Iterator<T> {
          private final List<Iterator<T>> iterators;
          private int index;
          SequentialIterator(List<Iterator<T>> iterators) {
              this.iterators = List.copyOf(iterators);
          }
          public boolean hasNext() {
              while (index < iterators.size() &&
                     !iterators.get(index).hasNext()) index++;
              return index < iterators.size();
          }
          public T next() {
              if (!hasNext()) throw new NoSuchElementException();
              return iterators.get(index).next();
          }
      }

