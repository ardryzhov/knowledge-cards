- id: 981d65b8-d4d2-4488-8c4d-9956d9ba21c6
  question: Дан List<Order>, где Order имеет метод amount(), нужен только первый заказ
    с amount > 100. Почему findFirst лучше collect(...).get(0)?
  answer: findFirst может завершить обход на первом совпадении и возвращает Optional
    для отсутствия результата. collect обходит всё и выделяет список.
  category: short-circuit
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    Optional<Order> firstBig(List<Order> orders) {
        return orders.stream().filter(o -> o.amount() > 100)
            .findFirst();
    }
