  question: Нужно дождаться запуска трёх worker перед продолжением main. Что использовать?
  answer: 1) CountDownLatch(3). 2) Каждый worker делает countDown после готовности.
    3) main вызывает await с timeout. Латч одноразовый.
  category: CountDownLatch
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    CountDownLatch ready = new CountDownLatch(3);
    // каждый worker после старта:
    ready.countDown();
    // main:
    ready.await();
