  question: Как сделать инкремент общего счётчика с synchronized без AtomicInteger?
  answer: 1) Все записи и чтения должны использовать один монитор. 2) Метод инкремента
    синхронизируем; чтение после join видит итог. O(1) на операцию, но потоки конкурируют
    за lock.
