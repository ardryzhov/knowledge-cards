    counts.merge(key, 1, Integer::sum);
- id: 929bdbed-139e-474b-b0b2-c3f059ceaa5a
  question: Нужно ограничить одновременные вызовы внешнего API до пяти. Какой примитив
    выбрать?
  answer: 1) Создать Semaphore на 5 permits. 2) acquire перед вызовом, release в finally.
    3) Добавить timeout/interrupt по контракту. Память O(1).
  category: Semaphore
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    Semaphore limit = new Semaphore(5);
    limit.acquire();
    try {
        callExternal();
    } finally {
        limit.release();
    }
