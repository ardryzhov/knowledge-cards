- id: 9dfab56f-ea43-4c57-8768-16f181a4e614
  question: Нужно атомарно увеличить счётчик в ConcurrentHashMap<String,Integer>.
    Почему get/put нельзя, и что написать?
  answer: 1) get и put отдельно потокобезопасны, вместе — нет. 2) merge выполняет
    обновление ключа атомарно по контракту Map implementation. 3) Для высокой конкуренции
    можно хранить LongAdder.
  category: ConcurrentHashMap
