  question: Почему результат parallelStream().forEach(list::add) с обычным ArrayList
    некорректен?
  answer: ArrayList не потокобезопасен; параллельные add могут потерять элементы или
    нарушить структуру. Использовать collect или потокобезопасную стратегию сбора.
  category: Parallel stream
