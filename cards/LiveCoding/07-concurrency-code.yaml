- id: 45088d0d-c09e-496c-94ab-697be71f2e6b
  question: Два потока по 100 раз выполняют count++ над общим int, затем main делает
    join. Гарантирован ли результат 200? Как исправить?
  answer: 1) count++ состоит из чтения, сложения и записи; обновления теряются. 2)
    join лишь ждёт завершения. 3) Используем AtomicInteger или общий lock. Итог после
    join — 200.
  category: Race condition
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    AtomicInteger count = new AtomicInteger();
    Runnable increment100 = () -> {
        for (int i = 0; i < 100; i++) {
            count.incrementAndGet();
        }
    };
    Thread a = new Thread(increment100);
    Thread b = new Thread(increment100);
    a.start();
    b.start();
    a.join();
    b.join();
    System.out.println(count.get());
