topic: "Многопоточность: задачи по коду"
cards:
  - question: "Два потока по 100 раз выполняют count++ над общим int, затем main делает join. Гарантирован ли результат 200? Как исправить?"
    answer: "1) count++ состоит из чтения, сложения и записи; обновления теряются. 2) join лишь ждёт завершения. 3) Используем AtomicInteger или общий lock. Итог после join — 200."
    category: "Race condition"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      AtomicInteger count = new AtomicInteger();
      Runnable increment100 = () -> {
          for (int i = 0; i < 100; i++) {
              count.incrementAndGet();
          }
      };
      Thread a = new Thread(increment100);
      Thread b = new Thread(increment100);
      a.start();
      b.start();
      a.join();
      b.join();
      System.out.println(count.get());
  - question: "Как сделать инкремент общего счётчика с synchronized без AtomicInteger?"
    answer: "1) Все записи и чтения должны использовать один монитор. 2) Метод инкремента синхронизируем; чтение после join видит итог. O(1) на операцию, но потоки конкурируют за lock."
    category: "Блокировка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      private int count;
      synchronized void increment() {
          count++;
      }
      synchronized int value() {
          return count;
      }
  - question: "Два потока захватывают lockA и lockB в обратном порядке. Как убрать риск deadlock?"
    answer: "1) Задать общий порядок захвата. 2) Оба потока всегда берут A, затем B. 3) Убедиться, что другие пути соблюдают тот же порядок."
    category: "Deadlock"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      synchronized (lockA) {
          synchronized (lockB) {
              update();
          }
      }
  - question: "Почему volatile int count не исправляет count++?"
    answer: "volatile обеспечивает видимость отдельного чтения и записи, но не делает их общую последовательность атомарной. Нужны atomic class или lock."
    category: "volatile"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Нужно атомарно увеличить счётчик в ConcurrentHashMap<String,Integer>. Почему get/put нельзя, и что написать?"
    answer: "1) get и put отдельно потокобезопасны, вместе — нет. 2) merge выполняет обновление ключа атомарно по контракту Map implementation. 3) Для высокой конкуренции можно хранить LongAdder."
    category: "ConcurrentHashMap"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      ConcurrentHashMap<String, Integer> counts = new ConcurrentHashMap<>();
      counts.merge(key, 1, Integer::sum);
  - question: "Нужно ограничить одновременные вызовы внешнего API до пяти. Какой примитив выбрать?"
    answer: "1) Создать Semaphore на 5 permits. 2) acquire перед вызовом, release в finally. 3) Добавить timeout/interrupt по контракту. Память O(1)."
    category: "Semaphore"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      Semaphore limit = new Semaphore(5);
      limit.acquire();
      try {
          callExternal();
      } finally {
          limit.release();
      }
  - question: "Как дождаться завершения двух задач ExecutorService и получить результаты, не теряя исключений?"
    answer: "1) Submit возвращает Future. 2) get ждёт и передаёт ошибку через ExecutionException. 3) Пул закрыть в finally или управляемом жизненном цикле."
    category: "Executor"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      Future<Integer> a = pool.submit(this::first);
      Future<Integer> b = pool.submit(this::second);
      int total = a.get() + b.get();
  - question: "Чем CompletableFuture.thenApply отличается от thenCompose при асинхронном запросе?"
    answer: "thenApply преобразует результат и с асинхронной функцией даст вложенный future; thenCompose разворачивает его в один future. Выбираем compose при зависимом async-шаге."
    category: "CompletableFuture"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      CompletableFuture<User> user = loadId()
          .thenCompose(this::loadUser);
  - question: "Почему ThreadLocal с userId может передать чужой контекст следующей задаче пула?"
    answer: "Поток переиспользуется, а ThreadLocal остаётся, если его не очистить. 1) Устанавливать контекст перед задачей. 2) Удалять в finally. Предпочтительнее явная передача данных."
    category: "ThreadLocal"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: |
      USER_ID.set(userId);
      try {
          process();
      } finally {
          USER_ID.remove();
      }
  - question: "Как безопасно остановить цикл worker после InterruptedException?"
    answer: "1) Если нельзя пробросить исключение, восстановить флаг прерывания. 2) Завершить цикл и выполнить очистку. Нельзя просто проглотить interrupt."
    category: "Interrupt"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      try { queue.take(); }
      catch (InterruptedException e) {
          Thread.currentThread().interrupt();
          return;
      }
  - question: "Почему wait() нужно вызывать внутри цикла проверки условия?"
    answer: "Пробуждение может быть ложным или другой поток успеет забрать ресурс. После возврата из wait проверяют условие снова под тем же монитором."
    category: "wait/notify"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: |
      synchronized (lock) {
          while (queue.isEmpty()) lock.wait();
          item = queue.remove();
      }
  - question: "Нужно дождаться запуска трёх worker перед продолжением main. Что использовать?"
    answer: "1) CountDownLatch(3). 2) Каждый worker делает countDown после готовности. 3) main вызывает await с timeout. Латч одноразовый."
    category: "CountDownLatch"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: |
      CountDownLatch ready = new CountDownLatch(3);
      // каждый worker после старта:
      ready.countDown();
      // main:
      ready.await();
  - question: "Как проверить, что исправление race condition работает, если один прогон всегда выдаёт 200?"
    answer: "1) Построить повторяемый конкурентный тест с барьером старта и многими итерациями. 2) Проверить итоговый инвариант. 3) Рассуждать о happens-before; успешные прогоны не доказывают отсутствие гонки."
    category: "Тестирование"
