- id: 3a0c9ab5-c10d-4531-94cc-26d7968187d6
  question: Есть `Data data = new Data(new ArrayList<>());`, где `record Data(List<String>
    names) {}`. Что сделает `data.names().add("x")`?
  answer: Если список изменяемый, его содержимое изменится. record не обеспечивает
    глубокую неизменяемость; нужна защитная копия.
  category: Records
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    record Data(List<String> names) {
        Data {
            names = List.copyOf(names);
        }
    }
