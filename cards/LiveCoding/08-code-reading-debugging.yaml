  question: Почему код `if (map.containsKey(k)) map.put(k, map.get(k)+1)` небезопасен
    при общей HashMap?
  answer: HashMap не потокобезопасна, а проверка и обновление неатомарны. Нужны ConcurrentHashMap
    и атомарный merge/compute либо блокировка.
