- id: 5344697c-9c6a-4ea7-b438-d6ef00232415
  question: 'Что не так: catch (InterruptedException e) { } в worker?'
  answer: Прерывание потеряно, worker может продолжить работу вопреки запросу остановки.
    Нужно пробросить исключение или восстановить флаг и завершить цикл.
  category: Concurrency
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    catch (InterruptedException e) {
        Thread.currentThread().interrupt();
        return;
    }
