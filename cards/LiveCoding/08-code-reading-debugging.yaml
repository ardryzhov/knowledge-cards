- id: d0ef7dee-7f9b-4163-a952-3bb364977605
  question: Дан обычный PostgreSQL `SELECT ... JOIN ... WHERE ...` без FOR UPDATE.
    Достаточно ли его самого, чтобы показать deadlock между двумя транзакциями?
  answer: Нет. Нужны конкретные конкурирующие действия и порядок несовместимых блокировок.
    Обычный SELECT берёт AccessShareLock на таблицы и не блокирует строки; он может
    участвовать в более сложном deadlock с DDL, но один запрос этого не показывает.
  category: SQL и блокировки
