- id: d4784adb-7231-4d36-b532-1f221d168253
  question: В методе подряд идут `if (size > 2) ...; if (size == 1) ...; else ...`.
    Где риск?
  answer: else относится ко второму if; при size>2 выполнится первая ветка и затем
    else, перезаписав результат. Нужна взаимоисключающая цепочка if/else if/else.
  category: Логика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    if (size == 1) rank = "Начинающий";
    else if (size == 2) rank = "Двоих";
    else if (size > 2) rank = "Почётный";
