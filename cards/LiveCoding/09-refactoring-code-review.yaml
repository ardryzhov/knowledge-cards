- id: 0faafe2a-3a44-4974-9153-685e00f68a56
  question: В коде `BigDecimal` создают как `new BigDecimal(0.1)`. Почему результат
    может удивить?
  answer: double не хранит 0.1 точно, а конструктор сохраняет его двоичное приближение.
    Использовать строку или BigDecimal.valueOf(double), если вход уже double.
  category: Числа
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 'BigDecimal rate = new BigDecimal("0.1");'
