- id: 79e3faab-bb27-4c4c-ad52-60f9cdb3a27a
  question: В проверке `if (age < 18 && age > 65)` пытаются отклонить возраст вне
    диапазона 18–65. Что исправить?
  answer: 1) Условия не могут быть истинными одновременно. 2) Для значений вне диапазона
    нужен OR. 3) Проверить 17,18,65,66.
  category: Логика
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    if (age < 18 || age > 65) {
        throw new IllegalArgumentException("age");
    }
- id: 9966ba0e-c4d7-4b54-91c4-c73045e6baf7
  question: Код `name.charAt(0)` проверяет первую букву. Какой крайний случай пропущен?
  answer: Пустая строка вызывает StringIndexOutOfBoundsException, null — NPE. Сначала
    явно проверить обязательность и непустоту, затем первый символ.
  category: Валидация
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: |
    if (name == null || name.isEmpty())
        throw new IllegalArgumentException("name");
    if (name.charAt(0) == 'Ы')
        throw new IllegalArgumentException("first letter");
- id: 19a18784-df0a-4548-98ce-42fe352de837
  question: В record Person(String name, int age, String rank) метод пишет `person.rank
    = "X"`. Что исправить?
  answer: record не позволяет присваивать полю. Вычислить новое звание и вернуть новый
    Person; контракт метода должен предусматривать возврат значения.
  category: Records
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: |
    Person withRank(Person p, String rank) {
        return new Person(p.name(), p.age(), rank);
    }
