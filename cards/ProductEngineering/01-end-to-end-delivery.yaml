  question: Что делать, если бизнес-цель понятна, но критерии приёмки не определены?
  answer: Предложить наблюдаемые примеры успеха и ошибки, обсудить их с владельцем
    правила и записать согласованный результат. Нельзя подменять это собственным предположением.
