- id: 926f10f0-31a2-4cfc-a6a1-4f8be1388eba
  question: Какие нефункциональные требования нужно проверить до реализации нового
    массового экспорта?
  answer: Ограничения объёма и времени, права на данные, нагрузку на БД, хранение
    файла, срок жизни ссылки и реакцию на отказ. Эти условия могут изменить архитектуру
    решения.
  category: Ограничения
