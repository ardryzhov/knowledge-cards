- id: 1d82884b-9f41-43b4-b6e2-45a2289830d0
  question: Что нужно проверить перед изменением существующего API в рамках фичи?
  answer: Найти потребителей, текущий контракт, совместимые и несовместимые изменения,
    план развёртывания и контрактные проверки. Обновление одного сервиса не гарантирует
    готовность всей цепочки.
