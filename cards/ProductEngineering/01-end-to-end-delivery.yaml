  question: Когда Product Engineer вправе считать задачу завершённой?
  answer: Когда согласованный результат работает в целевой среде, критичные проверки
    пройдены, влияние на метрики оценено, документация и сопровождение готовы, а оставшиеся
    ограничения известны владельцам.
