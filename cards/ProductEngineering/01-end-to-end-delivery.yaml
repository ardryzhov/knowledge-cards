  question: Как поступить, если смежная команда задерживает контракт, без которого
    фича не завершится?
  answer: Уточнить точную зависимость и дату, согласовать временный stub или меньший
    независимый срез, отразить риск в плане и не объявлять сквозной сценарий завершённым.
