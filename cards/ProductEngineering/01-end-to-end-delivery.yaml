- id: 47569894-29c4-479a-9167-926343bd0d56
  question: Какие доказательства готовности нужны перед выпуском изменения?
  answer: Согласованные критерии, результат проверок, ревью, версия артефакта, оценка
    миграции, метрики наблюдения и план отката. Состав должен соответствовать риску
    фичи.
