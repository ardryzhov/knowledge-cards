  question: Как поступить, если новая фича требует изменения схемы БД и одновременно
    работают старая и новая версии сервиса?
  answer: 'Спланировать совместимый переход: сначала расширить схему, затем перевести
    чтение и запись, после проверки удалить старые элементы. Оценить миграцию данных
