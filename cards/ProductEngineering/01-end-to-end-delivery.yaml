  question: Как контролировать работу ИИ-агента, которому поручили изменение нескольких
    слоёв сервиса?
  answer: Разбить работу на проверяемые шаги, отслеживать изменённые файлы и допущения,
    сверять контракт и тесты, запускать сборку. При расхождении остановить или скорректировать
    задачу до следующего шага.
