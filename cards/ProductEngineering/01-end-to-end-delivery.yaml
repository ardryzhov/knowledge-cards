- id: 66205919-511c-4ab4-b046-727819e2bd82
  question: Как решать конфликт между быстрым выпуском и требованием безопасности?
  answer: Уточнить риск и обязательное ограничение, предложить меньший безопасный
    срез или иной способ доставки и зафиксировать решение ответственного владельца.
    Срок не отменяет обязательные проверки.
