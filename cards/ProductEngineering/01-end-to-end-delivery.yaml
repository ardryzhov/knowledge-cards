- id: f09ec311-1969-4f15-8cc9-834ff26de2f9
  question: Почему ответственность за фичу не означает, что инженер обязан лично знать
    все четыре области одинаково глубоко?
  answer: Он должен понимать границы своей компетенции, получать нужную экспертизу
    и проверять общий результат. Владение сквозной задачей требует координации и решений,
    а не безошибочного выполнения любой специальной работы в одиночку.
