  question: Как определить, что можно поручить ИИ-агенту в сквозной задаче?
  answer: 'Дать ему ограниченную проверяемую часть: собрать варианты, подготовить
    черновик контракта, изменить код или написать тесты. Для каждой части задать входы,
    ограничения и критерий проверки человеком.'
