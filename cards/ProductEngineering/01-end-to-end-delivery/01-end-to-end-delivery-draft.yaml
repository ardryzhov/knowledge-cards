topic: "Сквозное ведение задачи"
cards:
  - question: "К тебе пришли с запросом «добавить кнопку экспорта операций». С чего начать работу над фичей?"
    answer: "Уточнить, какую задачу решает экспорт, кто им пользуется, какие данные и ограничения нужны. Проверить существующие способы, затем зафиксировать целевой сценарий и измеримый результат до выбора реализации."
    category: "Цель и границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему запрос заинтересованной стороны нельзя автоматически считать готовым техническим заданием?"
    answer: "Он часто описывает желаемое решение, но не цель, исключения, права и ограничения. Product Engineer уточняет эти пробелы и согласует проверяемое поведение."
    category: "Цель и границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как определить, какие роли и команды затронет изменение в банковском сервисе?"
    answer: "Проследить путь данных и операции: пользователь, владелец процесса, API-потребители, безопасность, эксплуатация и смежные сервисы. Для каждого отметить зависимость и владельца решения."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как зафиксировать границы небольшой фичи до разработки?"
    answer: "Описать основной сценарий, пользователей, данные, затронутые системы и явные исключения. Проверить, что исключения не делают целевой результат недостижимым."
    category: "Цель и границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если бизнес-цель понятна, но критерии приёмки не определены?"
    answer: "Предложить наблюдаемые примеры успеха и ошибки, обсудить их с владельцем правила и записать согласованный результат. Нельзя подменять это собственным предположением."
    category: "Готовность задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как понять, что задача достаточно подготовлена для реализации?"
    answer: "Понятны цель, границы, поведение, данные, интерфейсы, критичные ограничения и критерии приёмки. Открытые вопросы имеют владельцев и не блокируют безопасное начало работы."
    category: "Готовность задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать первый поставляемый срез большой фичи?"
    answer: "Выделить минимальный полный сценарий, который приносит проверяемую пользу, включая необходимые права, ошибки и наблюдаемость. Остальные сценарии отделить с явным приоритетом."
    category: "Планирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему разбивка только на «аналитика → backend → тесты → деплой» не всегда помогает вести фичу?"
    answer: "Такие этапы сами по себе не дают работающего пользовательского результата. Нужны поставляемые срезы и ранняя проверка интеграций между этапами."
    category: "Планирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно проверить перед изменением существующего API в рамках фичи?"
    answer: "Найти потребителей, текущий контракт, совместимые и несовместимые изменения, план развёртывания и контрактные проверки. Обновление одного сервиса не гарантирует готовность всей цепочки."
    category: "Контракты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как поступить, если новая фича требует изменения схемы БД и одновременно работают старая и новая версии сервиса?"
    answer: "Спланировать совместимый переход: сначала расширить схему, затем перевести чтение и запись, после проверки удалить старые элементы. Оценить миграцию данных и откат."
    category: "Данные и релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какие нефункциональные требования нужно проверить до реализации нового массового экспорта?"
    answer: "Ограничения объёма и времени, права на данные, нагрузку на БД, хранение файла, срок жизни ссылки и реакцию на отказ. Эти условия могут изменить архитектуру решения."
    category: "Ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как решать конфликт между быстрым выпуском и требованием безопасности?"
    answer: "Уточнить риск и обязательное ограничение, предложить меньший безопасный срез или иной способ доставки и зафиксировать решение ответственного владельца. Срок не отменяет обязательные проверки."
    category: "Риски"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как определить, что можно поручить ИИ-агенту в сквозной задаче?"
    answer: "Дать ему ограниченную проверяемую часть: собрать варианты, подготовить черновик контракта, изменить код или написать тесты. Для каждой части задать входы, ограничения и критерий проверки человеком."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему черновик требований, написанный ИИ, нельзя сразу передавать в разработку?"
    answer: "Агент может убедительно заполнить пробелы выдуманными правилами. Нужно сверить источники, согласовать спорное с владельцем процесса и проверить исключения и контракты."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как контролировать работу ИИ-агента, которому поручили изменение нескольких слоёв сервиса?"
    answer: "Разбить работу на проверяемые шаги, отслеживать изменённые файлы и допущения, сверять контракт и тесты, запускать сборку. При расхождении остановить или скорректировать задачу до следующего шага."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему «агент написал код и тесты, оба зелёные» не доказывает выполнение задачи?"
    answer: "Тесты могли повторить неверное предположение агента. Нужно независимо сопоставить реализацию с согласованными критериями, проверить границы и поведение в среде."
    category: "Проверка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как составить минимальный план проверки фичи, затрагивающей PostgreSQL и Kafka?"
    answer: "Проверить бизнес-правило на unit-уровне, реальные транзакции и схему БД интеграционно, публикацию и повтор события, затем ключевой сквозной сценарий. Набор зависит от риска изменения."
    category: "Проверка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если интеграционные тесты проходят, но не проверена работа новой версии с уже накопленными событиями?"
    answer: "Добавить примеры старого формата и сценарий чтения из retention; проверить совместимость и план развёртывания producer и consumer."
    category: "Проверка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие доказательства готовности нужны перед выпуском изменения?"
    answer: "Согласованные критерии, результат проверок, ревью, версия артефакта, оценка миграции, метрики наблюдения и план отката. Состав должен соответствовать риску фичи."
    category: "Готовность релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему успешный pipeline не означает, что фича уже доставлена пользователю?"
    answer: "Он подтверждает только пройденные проверки и шаги доставки. Нужно убедиться в успешном rollout, доступности сценария и ожидаемом бизнес-результате."
    category: "Готовность релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что проверить сразу после деплоя новой фичи?"
    answer: "Версию и состояние сервиса, ошибки и задержку ключевого сценария, состояние очередей и БД, а также целевую продуктовую метрику после достаточного окна наблюдения."
    category: "После релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как планировать откат, если изменение уже записало данные в новом формате?"
    answer: "Проверить, умеет ли старая версия читать новые данные и события; если нет, нужен совместимый переход или отдельная процедура восстановления. Откат образа не откатывает данные."
    category: "Данные и релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если после релиза растёт число ошибок, но health check зелёный?"
    answer: "Оценить влияние на пользовательский сценарий, сравнить метрики и логи по версиям, при необходимости остановить расширение или откатить совместимую версию. Health check проверяет лишь часть системы."
    category: "После релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда Product Engineer вправе считать задачу завершённой?"
    answer: "Когда согласованный результат работает в целевой среде, критичные проверки пройдены, влияние на метрики оценено, документация и сопровождение готовы, а оставшиеся ограничения известны владельцам."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если во время реализации обнаружилось новое бизнес-правило?"
    answer: "Зафиксировать источник и влияние на контракт, оценку, тесты и срок; согласовать решение с владельцем и обновить артефакты до продолжения зависимых изменений."
    category: "Изменения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как поступить, если смежная команда задерживает контракт, без которого фича не завершится?"
    answer: "Уточнить точную зависимость и дату, согласовать временный stub или меньший независимый срез, отразить риск в плане и не объявлять сквозной сценарий завершённым."
    category: "Зависимости"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему ответственность за фичу не означает, что инженер обязан лично знать все четыре области одинаково глубоко?"
    answer: "Он должен понимать границы своей компетенции, получать нужную экспертизу и проверять общий результат. Владение сквозной задачей требует координации и решений, а не безошибочного выполнения любой специальной работы в одиночку."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как объяснить на интервью свою роль в фиче, которую частично сделали коллеги и ИИ?"
    answer: "Разделить цель, собственные решения, порученные части, способ проверки, итог и метрики. Не присваивать чужую работу и не выдавать активность агента за подтверждённый результат."
    category: "Ответственность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если фича выпущена, но целевая продуктовая метрика не изменилась?"
    answer: "Проверить, что фича доступна и используется, корректно ли измерение и верна ли исходная гипотеза. Затем решить, менять продукт, измерение или объём работ, опираясь на данные."
    category: "После релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как не потерять связь между исходной целью, кодом, тестами и релизом?"
    answer: "Сохранить короткую цепочку артефактов: цель и критерии → контракт и решение → изменение кода → проверки → версия релиза → наблюдаемый результат. Глубина формализации зависит от риска."
    category: "Прослеживаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

