- id: 9be1931f-5771-4fb3-af9b-1f2cc7beca61
  question: Как превратить запрос «сделать экспорт операций» в проверяемую продуктовую
    цель?
  answer: 'Уточнить, кто и для какой работы выгружает операции, что сейчас мешает
    и какое изменение ожидается. Например: сократить время подготовки отчёта для операторов
    с измерением времени от начала задачи до готового отчёта. Само число скачиваний
    не доказывает пользу.'
  category: Ценность и цель
  context: 
