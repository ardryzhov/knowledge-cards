- id: 7b7255ec-73a8-4f74-9a40-1f0a8fe777be
  question: Как сформулировать продуктовую гипотезу так, чтобы её можно было проверить?
  answer: 'Указать группу пользователей, изменение, ожидаемое поведение и измеримый
    результат за оговорённый период. Например: если упростить повторный платёж, доля
    успешно завершённых повторных платежей среди начатых вырастет при сохранении допустимого
    уровня ошибок.'
  category: Ценность и цель
  context: 
