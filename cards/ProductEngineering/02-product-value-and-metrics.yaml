- id: a62a5319-06f8-4a96-b11d-32de7229b545
  question: Зачем вместе с основной метрикой задавать ограничивающие метрики?
  answer: 'Основной показатель можно улучшить ценой ухудшения другого важного свойства.
    Ограничивающие метрики фиксируют допустимые границы: например, долю ошибочных
    списаний, жалобы, задержку и нагрузку поддержки при росте успешных платежей.'
  category: Выбор метрик
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 424e4d6b-7eb9-47fd-947c-fd330a891e41
  question: Чем опережающий показатель отличается от запаздывающего в оценке фичи?
  answer: Опережающий отражает раннее поведение, которое может повлиять на итог, например
    начало использования нового сценария. Запаздывающий измеряет конечный результат,
    например сокращение времени обработки заявок. Связь между ними нужно проверять,
    а не предполагать.
  category: Выбор метрик
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 28de9c0a-98cd-498c-b2a8-c473f536ade5
  question: Что нужно записать в определении метрики, чтобы два человека рассчитали
    её одинаково?
  answer: Название, цель, источник данных, числитель и знаменатель либо формулу, единицу
    учёта, фильтры, временное окно, способ учёта дублей и исключений. Также указать
    владельца и частоту расчёта.
  category: Определение и данные
  context: 
