- id: 3cfc2f6f-df6a-4158-a6b0-096f03b73e5a
  question: Как понять, на каком шаге сценария новая фича теряет пользователей?
  answer: Описать последовательность значимых шагов и считать число уникальных подходящих
    пользователей или операций на каждом шаге по единому правилу. Проверить переходы
    и ошибки между соседними шагами, включая асинхронные завершения и задержки событий.
