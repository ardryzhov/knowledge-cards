  question: Как отличить улучшение метрики от изменения её расчёта после релиза?
  answer: Проверить, не изменились ли события, фильтры, идентификаторы, окно расчёта
    и состав аудитории. При изменении определения пересчитать старый период тем же
    способом или пометить разрыв ряда и не сравнивать значения напрямую.
