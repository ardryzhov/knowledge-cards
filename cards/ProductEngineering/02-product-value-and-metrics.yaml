- id: 90016709-09e4-42ad-8eca-46c8c2d74636
  question: Как выбрать основную метрику для фичи повторного платежа?
  answer: 'Начать с целевой пользы: например, доля успешно завершённых повторных платежей
    среди попыток подходящих пользователей. Определить, что считается попыткой и успехом,
    чтобы ускорение кликов или рост вызовов API не подменили результат.'
