  question: Что делать, если основная метрика выросла, но одновременно выросла доля
    ошибочных списаний?
  answer: Сверить рост с заранее согласованным порогом ограничивающей метрики и оценить
    ущерб. При нарушении безопасной границы остановить расширение или откатить фичу,
