- id: 9e099517-cbca-43ff-8168-5823d4094124
  question: Почему общая конверсия может скрыть ухудшение для важного сегмента пользователей?
  answer: 'Состав аудитории меняется: рост доли сегмента с высокой конверсией способен
    поднять общий показатель, даже если внутри отдельных сегментов стало хуже. Нужно
    сравнить сопоставимые сегменты, например новых и постоянных клиентов, и проверить
    критичные группы.'
  category: Сегментация
  context: 
