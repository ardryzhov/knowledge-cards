- id: 431a0bea-db74-4d28-95b7-d948fcf39d4c
  question: Почему число запросов к новому API само по себе плохо измеряет пользу
    фичи?
  answer: Запросы могут быть повторами, ошибками или действиями одного пользователя;
    они не показывают завершение нужного сценария. Нужен показатель успешного результата
    с понятной единицей учёта.
