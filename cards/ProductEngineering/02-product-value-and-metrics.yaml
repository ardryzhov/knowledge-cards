- id: cb09bbad-6054-42e2-9441-7dc343637eed
  question: Как повторы сообщений из Kafka могут исказить продуктовую метрику операций?
  answer: Если считать каждое доставленное событие отдельной операцией, повторная
    доставка завысит объём и может завысить число успехов. Для расчёта нужен устойчивый
    идентификатор бизнес-операции и правило дедупликации.
  category: Качество данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 40241af3-53a5-41a1-988c-67cc8bf974e7
  question: Почему технический HTTP 200 не всегда означает успешное завершение бизнес-сценария?
  answer: Ответ может подтверждать только приём запроса, тогда как бизнес-операция
    завершится позже или будет отклонена. Метрику успеха следует строить по финальному
    состоянию операции и явно учитывать асинхронные исходы.
  category: Качество данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 093f206b-eac8-40ad-8439-4df745aeac24
  question: Как проверить качество данных перед тем, как использовать новый дашборд
    для решения о фиче?
  answer: Сверить определения событий с реальным процессом, проверить пропуски, дубли,
    задержку поступления и изменение объёмов после релиза. Сопоставить агрегаты с
    независимым источником или выборкой бизнес-операций.
  category: Качество данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: efec8469-90af-4007-a476-26bcf20ce99a
  question: Зачем фиксировать исходное значение метрики до запуска фичи?
  answer: Оно даёт точку сравнения и помогает заметить естественные колебания до изменения.
    Вместе с ним фиксируют период, аудиторию, способ расчёта и качество данных, иначе
    сравнение после релиза будет ненадёжным.
  category: Оценка эффекта
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8376aa07-0c40-4062-a851-becc9d49f49e
  question: Почему сравнение метрики «до» и «после» релиза не доказывает, что изменение
    вызвано фичей?
  answer: На показатель могли повлиять сезонность, реклама, сбой, состав пользователей
    или другое изменение. Для более надёжного вывода нужна сопоставимая контрольная
    группа либо явный разбор альтернативных причин и ограничений сравнения.
  category: Оценка эффекта
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a9c5194a-96bd-4f86-ad69-b529c96d9ab7
  question: Что проверить перед сравнением результатов двух групп в A/B-эксперименте?
  answer: Проверить стабильное назначение пользователей в группы, одинаковое определение
    метрик и наблюдаемость, достаточный горизонт для исхода операции, отсутствие существенного
    перетекания между группами. Заранее задать критерий решения и следить за ограничивающими
    метриками.
  category: Оценка эффекта
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: a776f1c2-f490-4a7a-b5d9-c8f0abf96566
  question: Почему нельзя завершать A/B-эксперимент при первом случайном росте метрики?
  answer: При многократном просмотре результатов случайное отклонение может выглядеть
    убедительным. Период, критерий остановки и способ анализа задают заранее; раннюю
    остановку допускают по согласованным правилам безопасности или статистического
    анализа.
  category: Оценка эффекта
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 73584984-bb51-437d-a9dc-df50afdc9017
  question: Как оценить эффект фичи, если полноценный A/B-эксперимент провести нельзя?
  answer: Выбрать сопоставимые периоды или группы, учесть известные внешние изменения
    и проверить тенденцию до запуска. Представить результат как оценку с ограничениями,
    не выдавая простое совпадение по времени за доказанную причинную связь.
  category: Оценка эффекта
