- id: d4616000-0d60-448d-abab-00c8c459650a
  question: 'Почему при оценке пользовательского сценария важно выбрать единицу учёта:
    запрос, операция или пользователь?'
  answer: Один пользователь может сделать несколько операций, а одна операция — несколько
    запросов из-за повторов. Выбор единицы меняет числитель, знаменатель и смысл результата;
    её нужно связать с проверяемой целью.
