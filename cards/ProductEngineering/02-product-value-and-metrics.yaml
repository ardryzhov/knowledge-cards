  question: Чем продуктовый результат фичи отличается от факта её выпуска?
  answer: Выпуск подтверждает, что изменение доступно. Продуктовый результат показывает,
    решило ли оно задачу пользователей или бизнеса; его проверяют по согласованному
    показателю после выпуска.
