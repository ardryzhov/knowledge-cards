- id: 76d455d5-3c4e-404c-abb3-55b82e273569
  question: Как определить знаменатель метрики «доля успешных заявок», если часть
    заявок ещё обрабатывается?
  answer: Сначала задать когорту и окно наблюдения. В знаменатель включать заявки,
    для которых исход уже должен быть известен по правилам процесса; незавершённые
    учитывать отдельно или ждать фиксированное время. Иначе показатель меняется из-за
    задержки обработки, а не качества фичи.
  category: Определение и данные
