- id: 37f29d18-09b4-43a7-9bef-6a8f0e9cf02f
  question: Когда метрику лучше считать по когортам, а не только по календарным дням?
  answer: 'Когда результат проявляется спустя время после начала сценария: например,
    повторное использование функции или завершение длительной заявки. Когорта объединяет
    пользователей или операции по моменту входа, позволяя сравнивать их через одинаковый
    интервал наблюдения.'
