topic: "Продуктовая ценность и метрики"
cards:
  - question: "Чем продуктовый результат фичи отличается от факта её выпуска?"
    answer: "Выпуск подтверждает, что изменение доступно. Продуктовый результат показывает, решило ли оно задачу пользователей или бизнеса; его проверяют по согласованному показателю после выпуска."
    category: "Ценность и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как превратить запрос «сделать экспорт операций» в проверяемую продуктовую цель?"
    answer: "Уточнить, кто и для какой работы выгружает операции, что сейчас мешает и какое изменение ожидается. Например: сократить время подготовки отчёта для операторов с измерением времени от начала задачи до готового отчёта. Само число скачиваний не доказывает пользу."
    category: "Ценность и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сформулировать продуктовую гипотезу так, чтобы её можно было проверить?"
    answer: "Указать группу пользователей, изменение, ожидаемое поведение и измеримый результат за оговорённый период. Например: если упростить повторный платёж, доля успешно завершённых повторных платежей среди начатых вырастет при сохранении допустимого уровня ошибок."
    category: "Ценность и цель"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему число запросов к новому API само по себе плохо измеряет пользу фичи?"
    answer: "Запросы могут быть повторами, ошибками или действиями одного пользователя; они не показывают завершение нужного сценария. Нужен показатель успешного результата с понятной единицей учёта."
    category: "Выбор метрик"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как выбрать основную метрику для фичи повторного платежа?"
    answer: "Начать с целевой пользы: например, доля успешно завершённых повторных платежей среди попыток подходящих пользователей. Определить, что считается попыткой и успехом, чтобы ускорение кликов или рост вызовов API не подменили результат."
    category: "Выбор метрик"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем вместе с основной метрикой задавать ограничивающие метрики?"
    answer: "Основной показатель можно улучшить ценой ухудшения другого важного свойства. Ограничивающие метрики фиксируют допустимые границы: например, долю ошибочных списаний, жалобы, задержку и нагрузку поддержки при росте успешных платежей."
    category: "Выбор метрик"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем опережающий показатель отличается от запаздывающего в оценке фичи?"
    answer: "Опережающий отражает раннее поведение, которое может повлиять на итог, например начало использования нового сценария. Запаздывающий измеряет конечный результат, например сокращение времени обработки заявок. Связь между ними нужно проверять, а не предполагать."
    category: "Выбор метрик"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно записать в определении метрики, чтобы два человека рассчитали её одинаково?"
    answer: "Название, цель, источник данных, числитель и знаменатель либо формулу, единицу учёта, фильтры, временное окно, способ учёта дублей и исключений. Также указать владельца и частоту расчёта."
    category: "Определение и данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить знаменатель метрики «доля успешных заявок», если часть заявок ещё обрабатывается?"
    answer: "Сначала задать когорту и окно наблюдения. В знаменатель включать заявки, для которых исход уже должен быть известен по правилам процесса; незавершённые учитывать отдельно или ждать фиксированное время. Иначе показатель меняется из-за задержки обработки, а не качества фичи."
    category: "Определение и данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему при оценке пользовательского сценария важно выбрать единицу учёта: запрос, операция или пользователь?"
    answer: "Один пользователь может сделать несколько операций, а одна операция — несколько запросов из-за повторов. Выбор единицы меняет числитель, знаменатель и смысл результата; её нужно связать с проверяемой целью."
    category: "Определение и данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как повторы сообщений из Kafka могут исказить продуктовую метрику операций?"
    answer: "Если считать каждое доставленное событие отдельной операцией, повторная доставка завысит объём и может завысить число успехов. Для расчёта нужен устойчивый идентификатор бизнес-операции и правило дедупликации."
    category: "Качество данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему технический HTTP 200 не всегда означает успешное завершение бизнес-сценария?"
    answer: "Ответ может подтверждать только приём запроса, тогда как бизнес-операция завершится позже или будет отклонена. Метрику успеха следует строить по финальному состоянию операции и явно учитывать асинхронные исходы."
    category: "Качество данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить качество данных перед тем, как использовать новый дашборд для решения о фиче?"
    answer: "Сверить определения событий с реальным процессом, проверить пропуски, дубли, задержку поступления и изменение объёмов после релиза. Сопоставить агрегаты с независимым источником или выборкой бизнес-операций."
    category: "Качество данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем фиксировать исходное значение метрики до запуска фичи?"
    answer: "Оно даёт точку сравнения и помогает заметить естественные колебания до изменения. Вместе с ним фиксируют период, аудиторию, способ расчёта и качество данных, иначе сравнение после релиза будет ненадёжным."
    category: "Оценка эффекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему сравнение метрики «до» и «после» релиза не доказывает, что изменение вызвано фичей?"
    answer: "На показатель могли повлиять сезонность, реклама, сбой, состав пользователей или другое изменение. Для более надёжного вывода нужна сопоставимая контрольная группа либо явный разбор альтернативных причин и ограничений сравнения."
    category: "Оценка эффекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить перед сравнением результатов двух групп в A/B-эксперименте?"
    answer: "Проверить стабильное назначение пользователей в группы, одинаковое определение метрик и наблюдаемость, достаточный горизонт для исхода операции, отсутствие существенного перетекания между группами. Заранее задать критерий решения и следить за ограничивающими метриками."
    category: "Оценка эффекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему нельзя завершать A/B-эксперимент при первом случайном росте метрики?"
    answer: "При многократном просмотре результатов случайное отклонение может выглядеть убедительным. Период, критерий остановки и способ анализа задают заранее; раннюю остановку допускают по согласованным правилам безопасности или статистического анализа."
    category: "Оценка эффекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как оценить эффект фичи, если полноценный A/B-эксперимент провести нельзя?"
    answer: "Выбрать сопоставимые периоды или группы, учесть известные внешние изменения и проверить тенденцию до запуска. Представить результат как оценку с ограничениями, не выдавая простое совпадение по времени за доказанную причинную связь."
    category: "Оценка эффекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему общая конверсия может скрыть ухудшение для важного сегмента пользователей?"
    answer: "Состав аудитории меняется: рост доли сегмента с высокой конверсией способен поднять общий показатель, даже если внутри отдельных сегментов стало хуже. Нужно сравнить сопоставимые сегменты, например новых и постоянных клиентов, и проверить критичные группы."
    category: "Сегментация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как понять, на каком шаге сценария новая фича теряет пользователей?"
    answer: "Описать последовательность значимых шагов и считать число уникальных подходящих пользователей или операций на каждом шаге по единому правилу. Проверить переходы и ошибки между соседними шагами, включая асинхронные завершения и задержки событий."
    category: "Сегментация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда метрику лучше считать по когортам, а не только по календарным дням?"
    answer: "Когда результат проявляется спустя время после начала сценария: например, повторное использование функции или завершение длительной заявки. Когорта объединяет пользователей или операции по моменту входа, позволяя сравнивать их через одинаковый интервал наблюдения."
    category: "Сегментация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличить улучшение метрики от изменения её расчёта после релиза?"
    answer: "Проверить, не изменились ли события, фильтры, идентификаторы, окно расчёта и состав аудитории. При изменении определения пересчитать старый период тем же способом или пометить разрыв ряда и не сравнивать значения напрямую."
    category: "Качество данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если основная метрика выросла, но одновременно выросла доля ошибочных списаний?"
    answer: "Сверить рост с заранее согласованным порогом ограничивающей метрики и оценить ущерб. При нарушении безопасной границы остановить расширение или откатить фичу, разобраться в причине и повторно оценить результат после исправления."
    category: "Решение по результату"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как действовать, если после релиза основной показатель не изменился?"
    answer: "Проверить, дошла ли фича до целевой аудитории, корректно ли измеряется сценарий, хватает ли времени и данных для эффекта. Затем проверить исходную гипотезу и решить: доработать, продолжить наблюдение или убрать изменение."
    category: "Решение по результату"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему рост числа созданных заявок не обязательно означает улучшение продукта?"
    answer: "Заявок может стать больше из-за повторных попыток, ошибок или менее качественного потока. Надо проверить долю завершённых заявок, время обработки, отказы и нагрузку на сотрудников в расчёте на полезный результат."
    category: "Интерпретация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как связать технические показатели сервиса с продуктовой метрикой платежей?"
    answer: "Построить цепочку от доступности и задержки ключевых вызовов через бизнес-исход платежа к доле успешно завершённых операций. Технические показатели помогают объяснять провалы, но сами по себе не заменяют измерение пользовательского результата."
    category: "Интерпретация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как избежать ситуации, когда команда улучшает выбранную метрику, но ухудшает реальный пользовательский опыт?"
    answer: "Выбирать метрику, близкую к пользовательскому результату, задать ограничивающие показатели и проверять качественные сигналы: обращения, ошибки, ручные обходы. Периодически пересматривать, сохраняется ли связь показателя с исходной целью."
    category: "Интерпретация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как представить результат фичи заинтересованным сторонам после периода наблюдения?"
    answer: "Кратко показать исходную цель, аудиторию, период, основную и ограничивающие метрики, метод сравнения и качество данных. Отделить наблюдаемый эффект от предположения о его причине и предложить решение: масштабировать, доработать или остановить."
    category: "Решение по результату"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
