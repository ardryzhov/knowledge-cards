- id: 94b4559a-72b8-4836-ba40-31ef02fc9019
  question: 'Что полезнее спросить у ИИ перед реализацией незнакомой фичи: «напиши
    код» или «какие решения нужно принять»?'
  answer: 'Сначала выяснить решения и неизвестные: контракт, данные, ошибки, нагрузку,
    совместимость. Когда требования и ограничения ясны, можно поручать реализацию
    конкретной части и проверять её.'
