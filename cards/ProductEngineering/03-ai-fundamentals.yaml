- id: 24a1dda9-16a4-4338-8e1d-2420d4a81aac
  question: Как использовать ИИ для сравнения двух вариантов реализации без ложной
    уверенности в его выводе?
  answer: Задать одинаковые критерии и ограничения для обоих вариантов, попросить
    указать допущения и неизвестное. Ключевые различия проверить на документации,
    коде, измерениях или небольшом эксперименте.
