  question: Почему ИИ полезно просить указать неопределённости в ответе, но нельзя
    полагаться только на такой список?
  answer: Список помогает заметить часть допущений, однако модель может не распознать
    собственную ошибку или пропуск. Важные факты нужно независимо сверять с источниками
