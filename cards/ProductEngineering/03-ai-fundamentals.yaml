- id: 79ab87f4-c959-4cf9-bac6-28b609d86bcc
  question: Почему один и тот же запрос к языковой модели может дать разные ответы?
  answer: 'Генерация не обязана быть детерминированной: результат зависит от модели,
    настроек, переданного контекста и выбора следующего фрагмента ответа. Даже похожие
    ответы нужно оценивать по условиям задачи, а не ожидать побуквенного совпадения.'
  category: Возможности и ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: eb93352c-f199-431e-be72-c83a6d69e6d4
  question: Почему уверенный тон ответа ИИ не служит доказательством его правильности?
  answer: Модель формирует правдоподобный текст и может убедительно изложить неверный
    факт, придумать API или ссылку. Важные утверждения проверяют по доступным источникам,
    коду или воспроизводимому результату.
  category: Возможности и ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: fcdb4152-6d1f-4099-bbf2-7b5ff442b03c
  question: Что называют галлюцинацией модели в инженерной задаче?
  answer: 'Это сгенерированное утверждение, которое выглядит достоверным, но не подтверждается
    реальностью: например, несуществующий метод библиотеки или придуманное правило
    бизнеса. Сам термин не объясняет причину ошибки; утверждение нужно проверить и
    исправить исходные данные или постановку задачи.'
  category: Возможности и ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 77ff0eb5-2bdd-44fa-98b3-7a48168a2f39
  question: Как ограниченное окно контекста влияет на длинную работу с ИИ?
  answer: Модель учитывает только информацию, переданную и помещённую в доступный
    контекст конкретного обращения. В длинной истории часть важных фактов может отсутствовать
    или стать менее заметной; ключевые требования и текущее состояние задачи следует
    явно сохранять и при необходимости повторно передавать.
  category: Возможности и ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 04203e40-8ece-41e8-89e0-9849ebace796
  question: Почему нельзя считать, что модель знает актуальное состояние твоего проекта
    и внутренние правила банка?
  answer: Без доступа к конкретным источникам модель не видит текущий репозиторий,
    договорённости и внутренние требования. Нужные сведения надо передать через разрешённые
    источники, указав версии и происхождение фактов.
  category: Возможности и ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a9aaeb0b-4bc2-4866-8393-8b2e27dab2d6
  question: Когда для инженерной задачи лучше использовать детерминированный инструмент,
    а не просить ИИ ответить по памяти?
  answer: 'Когда результат можно точно получить командой, тестом, запросом к БД или
    статическим анализом: например, узнать текущую версию зависимости или число упавших
    тестов. ИИ полезен для интерпретации результата, но сам факт берут из инструмента.'
  category: Выбор подхода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ecdf8651-7c43-4e00-9074-40a4fb8dd49e
  question: Какие части сложной инженерной работы хорошо подходят для помощи ИИ?
  answer: Поиск вариантов, объяснение незнакомого кода, черновик изменений, генерация
    идей для проверок и структурирование требований. Польза выше, когда входные данные
    доступны, задача ограничена и результат можно проверить.
  category: Выбор подхода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: edb82a4e-8489-4dfe-abfc-42e58f5191e4
  question: Как выбрать между быстрым и более сильным режимом или моделью для задачи?
  answer: Сопоставить сложность задачи, требуемое качество, объём контекста, время
    ответа и стоимость. Начать с подходящего по ограничениям варианта и проверить
    его на реальных примерах; более дорогой вариант оправдан, если он заметно улучшает
    проверяемый результат.
  category: Выбор подхода
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e11924de-a300-4622-a26c-5c47d78fa416
  question: Какие сведения стоит дать ИИ перед просьбой изменить существующий backend-сервис?
  answer: Цель изменения, нужный участок кода или доступ к нему, текущий контракт,
    ограничения проекта, ожидаемое поведение и способ проверки. Отдельно указать неизвестные
    факты, которые следует выяснить до правки.
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 85a3ac0f-99c8-4f8a-9eb1-021731256e77
  question: Как переформулировать расплывчатое поручение «улучши обработку ошибок»
    для ИИ?
  answer: 'Назвать конкретный сценарий и желаемый контракт: какие ошибки сейчас возникают,
    как их должен видеть клиент, какие случаи нельзя менять и чем проверить результат.
    Например, попросить сохранить формат успешного ответа и добавить проверку для
    заданного класса ошибок.'
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bd726abd-b1da-41bd-84d3-8f0a1212861b
  question: Зачем в задаче для ИИ указывать критерий готовности?
  answer: 'Он задаёт наблюдаемый результат, по которому можно принять работу: например,
    корректный ответ API для конкретных случаев и проходящие профильные тесты. Без
    него модель может выполнить похожую, но другую задачу.'
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 30a6310b-e67b-4466-892d-f811cd01b8c6
  question: Что делать, если для ответа ИИ не хватает важного бизнес-правила?
  answer: Явно пометить правило как неизвестное и получить его у владельца процесса
    или из авторитетного источника. Можно попросить ИИ перечислить варианты и вопросы,
    но нельзя принимать придуманный вариант за согласованное требование.
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c5c20595-8dc2-49d5-9058-cb3414376ca3
  question: Почему при работе с ИИ полезно отделять факты проекта от предположений
    и предложений?
  answer: Иначе предложенный моделью вариант легко принять за существующее правило
    или проверенный факт. Пометка источника и статуса каждого важного утверждения
    помогает понять, что можно использовать сразу, а что требует подтверждения.
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f34473cd-6eaa-41b9-b5cd-c11a7b579c83
  question: Когда несколько примеров входа и ожидаемого выхода помогают ИИ лучше,
    чем длинное абстрактное описание?
  answer: Когда важны формат, пограничные случаи или повторяющееся правило преобразования.
    Примеры показывают ожидаемое поведение, но должны быть согласованы с общими требованиями
    и не заменять их для неохваченных случаев.
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 84ad4d95-3d81-48f6-b81b-976d1443b569
  question: Почему просьба «думай пошагово» не является универсальным способом повысить
    качество ответа модели?
  answer: Разные модели по-разному реагируют на такую инструкцию, а подробный текст
    рассуждений не гарантирует правильный результат. Надёжнее точно задать цель, условия
    и формат ответа, затем проверить результат на характерных случаях.
  category: Постановка задачи
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bf13bc02-9d4e-40ce-bc0c-7d981e4bf7b4
  question: Как разделить большую задачу для ИИ, если в ней одновременно есть требования,
    API, код и тесты?
  answer: 'Выделить последовательные проверяемые результаты: сначала прояснить требования
    и неизвестное, затем согласовать контракт, после этого менять код и тесты. На
    каждом шаге передавать актуальные ограничения и проверять вывод до следующего
    шага.'
  category: Итерации
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ec1df96a-e2a5-41b3-bae7-b0b6211fc33d
  question: Что делать, если первый ответ ИИ выглядит полезным, но не учитывает одно
    из ограничений задачи?
  answer: Указать конкретное нарушение, его источник и ожидаемое поведение, затем
    попросить исправить затронутую часть. После исправления проверить как новый случай,
    так и ранее выполненные условия.
  category: Итерации
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8330442d-f0e0-4512-b7bb-08474a3f4b0a
  question: Как понять, что дальнейшие уточнения промпта не решают проблему и нужно
    менять входные данные?
  answer: Если ответы снова зависят от отсутствующих фактов или противоречивых требований,
    новые формулировки лишь маскируют пробел. Нужно найти первоисточник, уточнить
    правило или предоставить актуальный код и примеры.
  category: Итерации
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 58ec47c8-f8de-4bc3-b983-ba48e7ebe3b0
  question: Как действовать, если ИИ при исправлении бага несколько раз возвращается
    к одному и тому же неверному решению?
  answer: Остановить цикл, зафиксировать неудачные варианты и воспроизводимый симптом.
    Сузить задачу до причины, дать результат теста или лог и явно запретить повторять
    уже опровергнутое предположение; при необходимости сменить подход или выполнить
    диагностику вручную.
  category: Итерации
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 4db3e9f4-aa7f-49f9-8188-c04d7bebfa08
  question: Почему изменение только формулировки промпта нельзя считать улучшением
    процесса без проверки результата?
  answer: Промпт может лучше работать на одном примере и хуже на других. Нужны хотя
    бы несколько типичных и пограничных случаев с одинаковыми критериями оценки до
    и после изменения.
  category: Итерации
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a8163d09-c2e5-4921-a7c2-56243f069cad
  question: Как попросить ИИ о помощи, если ты сам не понимаешь незнакомый участок
    Java-кода?
  answer: Дать ограниченный фрагмент и контекст вызова, попросить объяснить входы,
    побочные эффекты и зависимые компоненты. Затем сверить объяснение с кодом и тестами,
    уточняя непонятные места по одному.
  category: Практика инженера
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
