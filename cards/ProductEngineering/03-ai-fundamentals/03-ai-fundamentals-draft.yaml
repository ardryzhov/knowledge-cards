topic: "Основы работы с ИИ"
cards:
  - question: "Почему один и тот же запрос к языковой модели может дать разные ответы?"
    answer: "Генерация не обязана быть детерминированной: результат зависит от модели, настроек, переданного контекста и выбора следующего фрагмента ответа. Даже похожие ответы нужно оценивать по условиям задачи, а не ожидать побуквенного совпадения."
    category: "Возможности и ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему уверенный тон ответа ИИ не служит доказательством его правильности?"
    answer: "Модель формирует правдоподобный текст и может убедительно изложить неверный факт, придумать API или ссылку. Важные утверждения проверяют по доступным источникам, коду или воспроизводимому результату."
    category: "Возможности и ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что называют галлюцинацией модели в инженерной задаче?"
    answer: "Это сгенерированное утверждение, которое выглядит достоверным, но не подтверждается реальностью: например, несуществующий метод библиотеки или придуманное правило бизнеса. Сам термин не объясняет причину ошибки; утверждение нужно проверить и исправить исходные данные или постановку задачи."
    category: "Возможности и ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как ограниченное окно контекста влияет на длинную работу с ИИ?"
    answer: "Модель учитывает только информацию, переданную и помещённую в доступный контекст конкретного обращения. В длинной истории часть важных фактов может отсутствовать или стать менее заметной; ключевые требования и текущее состояние задачи следует явно сохранять и при необходимости повторно передавать."
    category: "Возможности и ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему нельзя считать, что модель знает актуальное состояние твоего проекта и внутренние правила банка?"
    answer: "Без доступа к конкретным источникам модель не видит текущий репозиторий, договорённости и внутренние требования. Нужные сведения надо передать через разрешённые источники, указав версии и происхождение фактов."
    category: "Возможности и ограничения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда для инженерной задачи лучше использовать детерминированный инструмент, а не просить ИИ ответить по памяти?"
    answer: "Когда результат можно точно получить командой, тестом, запросом к БД или статическим анализом: например, узнать текущую версию зависимости или число упавших тестов. ИИ полезен для интерпретации результата, но сам факт берут из инструмента."
    category: "Выбор подхода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие части сложной инженерной работы хорошо подходят для помощи ИИ?"
    answer: "Поиск вариантов, объяснение незнакомого кода, черновик изменений, генерация идей для проверок и структурирование требований. Польза выше, когда входные данные доступны, задача ограничена и результат можно проверить."
    category: "Выбор подхода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать между быстрым и более сильным режимом или моделью для задачи?"
    answer: "Сопоставить сложность задачи, требуемое качество, объём контекста, время ответа и стоимость. Начать с подходящего по ограничениям варианта и проверить его на реальных примерах; более дорогой вариант оправдан, если он заметно улучшает проверяемый результат."
    category: "Выбор подхода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие сведения стоит дать ИИ перед просьбой изменить существующий backend-сервис?"
    answer: "Цель изменения, нужный участок кода или доступ к нему, текущий контракт, ограничения проекта, ожидаемое поведение и способ проверки. Отдельно указать неизвестные факты, которые следует выяснить до правки."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как переформулировать расплывчатое поручение «улучши обработку ошибок» для ИИ?"
    answer: "Назвать конкретный сценарий и желаемый контракт: какие ошибки сейчас возникают, как их должен видеть клиент, какие случаи нельзя менять и чем проверить результат. Например, попросить сохранить формат успешного ответа и добавить проверку для заданного класса ошибок."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем в задаче для ИИ указывать критерий готовности?"
    answer: "Он задаёт наблюдаемый результат, по которому можно принять работу: например, корректный ответ API для конкретных случаев и проходящие профильные тесты. Без него модель может выполнить похожую, но другую задачу."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если для ответа ИИ не хватает важного бизнес-правила?"
    answer: "Явно пометить правило как неизвестное и получить его у владельца процесса или из авторитетного источника. Можно попросить ИИ перечислить варианты и вопросы, но нельзя принимать придуманный вариант за согласованное требование."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему при работе с ИИ полезно отделять факты проекта от предположений и предложений?"
    answer: "Иначе предложенный моделью вариант легко принять за существующее правило или проверенный факт. Пометка источника и статуса каждого важного утверждения помогает понять, что можно использовать сразу, а что требует подтверждения."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда несколько примеров входа и ожидаемого выхода помогают ИИ лучше, чем длинное абстрактное описание?"
    answer: "Когда важны формат, пограничные случаи или повторяющееся правило преобразования. Примеры показывают ожидаемое поведение, но должны быть согласованы с общими требованиями и не заменять их для неохваченных случаев."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему просьба «думай пошагово» не является универсальным способом повысить качество ответа модели?"
    answer: "Разные модели по-разному реагируют на такую инструкцию, а подробный текст рассуждений не гарантирует правильный результат. Надёжнее точно задать цель, условия и формат ответа, затем проверить результат на характерных случаях."
    category: "Постановка задачи"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как разделить большую задачу для ИИ, если в ней одновременно есть требования, API, код и тесты?"
    answer: "Выделить последовательные проверяемые результаты: сначала прояснить требования и неизвестное, затем согласовать контракт, после этого менять код и тесты. На каждом шаге передавать актуальные ограничения и проверять вывод до следующего шага."
    category: "Итерации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если первый ответ ИИ выглядит полезным, но не учитывает одно из ограничений задачи?"
    answer: "Указать конкретное нарушение, его источник и ожидаемое поведение, затем попросить исправить затронутую часть. После исправления проверить как новый случай, так и ранее выполненные условия."
    category: "Итерации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как понять, что дальнейшие уточнения промпта не решают проблему и нужно менять входные данные?"
    answer: "Если ответы снова зависят от отсутствующих фактов или противоречивых требований, новые формулировки лишь маскируют пробел. Нужно найти первоисточник, уточнить правило или предоставить актуальный код и примеры."
    category: "Итерации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как действовать, если ИИ при исправлении бага несколько раз возвращается к одному и тому же неверному решению?"
    answer: "Остановить цикл, зафиксировать неудачные варианты и воспроизводимый симптом. Сузить задачу до причины, дать результат теста или лог и явно запретить повторять уже опровергнутое предположение; при необходимости сменить подход или выполнить диагностику вручную."
    category: "Итерации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему изменение только формулировки промпта нельзя считать улучшением процесса без проверки результата?"
    answer: "Промпт может лучше работать на одном примере и хуже на других. Нужны хотя бы несколько типичных и пограничных случаев с одинаковыми критериями оценки до и после изменения."
    category: "Итерации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как попросить ИИ о помощи, если ты сам не понимаешь незнакомый участок Java-кода?"
    answer: "Дать ограниченный фрагмент и контекст вызова, попросить объяснить входы, побочные эффекты и зависимые компоненты. Затем сверить объяснение с кодом и тестами, уточняя непонятные места по одному."
    category: "Практика инженера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что полезнее спросить у ИИ перед реализацией незнакомой фичи: «напиши код» или «какие решения нужно принять»?"
    answer: "Сначала выяснить решения и неизвестные: контракт, данные, ошибки, нагрузку, совместимость. Когда требования и ограничения ясны, можно поручать реализацию конкретной части и проверять её."
    category: "Практика инженера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как использовать ИИ для сравнения двух вариантов реализации без ложной уверенности в его выводе?"
    answer: "Задать одинаковые критерии и ограничения для обоих вариантов, попросить указать допущения и неизвестное. Ключевые различия проверить на документации, коде, измерениях или небольшом эксперименте."
    category: "Практика инженера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему ИИ полезно просить указать неопределённости в ответе, но нельзя полагаться только на такой список?"
    answer: "Список помогает заметить часть допущений, однако модель может не распознать собственную ошибку или пропуск. Важные факты нужно независимо сверять с источниками и наблюдаемым поведением системы."
    category: "Практика инженера"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
