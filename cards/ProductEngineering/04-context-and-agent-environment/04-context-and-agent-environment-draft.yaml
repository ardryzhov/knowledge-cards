topic: "Контекст и агентное окружение"
cards:
  - question: "Что входит в агентное окружение помимо самой языковой модели?"
    answer: "Обычно это доступный контекст, инструкции и правила проекта, разрешённые инструменты, повторяемые процедуры и способы проверки результата. Конкретный набор зависит от платформы и задачи; окружение определяет, что агент знает и может сделать."
    category: "Состав окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Зачем команде хранить устойчивые правила работы агента рядом с проектом?"
    answer: "Так агент и коллеги получают одну версионируемую основу: структуру проекта, ограничения и команды проверки. Изменение правил можно обсуждать и отслеживать вместе с кодом, а не восстанавливать из личных чатов."
    category: "Правила проекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие сведения полезно включить в проектные инструкции для coding-агента?"
    answer: "Назначение сервиса, важные границы модулей, источник требований, правила изменения API и БД, команды сборки и проверок, а также ограничения на действия. Инструкции должны ссылаться на актуальные источники и не дублировать всю документацию."
    category: "Правила проекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему длинная инструкция с перечислением всех деталей репозитория может ухудшить работу агента?"
    answer: "В ней трудно найти сведения, относящиеся к текущей задаче, а устаревшие пункты начинают конфликтовать с кодом. Лучше оставить короткие устойчивые правила и дать ссылки на подробные источники, которые агент читает по необходимости."
    category: "Правила проекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем постоянное правило проекта отличается от контекста одной задачи?"
    answer: "Правило описывает повторяющееся ограничение или способ работы, например как проверять миграции. Контекст задачи содержит текущую цель, затронутые файлы, временные договорённости и критерии приёмки; его не стоит навсегда закреплять как общий стандарт."
    category: "Правила проекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как поступить, если инструкция команды противоречит обязательной политике банка?"
    answer: "Установить, какие правила обязательны и кто их владелец; более локальная инструкция не должна отменять обязательное ограничение. Зафиксировать конфликт, привести командное правило в соответствие и не поручать агенту выбирать удобный вариант самому."
    category: "Приоритет и конфликт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если проектная инструкция говорит одно, а актуальный код показывает другое?"
    answer: "Проверить версию и источник инструкции, историю изменений и фактическое поведение тестами или чтением кода. До выяснения не объявлять ни инструкцию, ни код автоматически правильными; уточнить у владельца правила и обновить устаревший источник."
    category: "Приоритет и конфликт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как ограничить область действия правила, которое относится только к одному модулю сервиса?"
    answer: "Разместить или описать его как локальное правило для конкретного модуля и указать границы применения. Общие инструкции оставить для требований ко всему проекту, чтобы правило одного компонента не влияло на остальные."
    category: "Правила проекта"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие источники стоит проверить перед тем, как дать агенту задачу изменить API банка?"
    answer: "Актуальный код и контракт, согласованные требования, правила безопасности и совместимости, тесты и сведения о потребителях. Для каждого важного утверждения полезно знать источник и дату или версию, чтобы не смешать факты с устаревшим описанием."
    category: "Источники контекста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему агенту нельзя передавать только текст задачи, если изменение затрагивает существующий контракт?"
    answer: "Без текущей схемы, потребителей и правил совместимости он может предложить формально рабочее, но несовместимое изменение. Нужно предоставить либо доступ к актуальным источникам, либо точные выдержки и указать, что проверять."
    category: "Источники контекста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличать источник истины от вспомогательного описания при подготовке контекста для агента?"
    answer: "Для каждого вида фактов определить владельца и актуальный артефакт: например, согласованный контракт для внешнего API и код с миграциями для реализованной схемы БД. Вспомогательные заметки полезны для понимания, но при расхождении требуют проверки, а не автоматического приоритета."
    category: "Источники контекста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как передать агенту большой документ, если для задачи нужны лишь два его раздела?"
    answer: "Указать нужные разделы и их источник либо предоставить точные выдержки с достаточным окружением. Сохранить ссылку на полный документ для проверки деталей; лишний объём повышает риск пропустить главное или использовать нерелевантный пункт."
    category: "Источники контекста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что нужно сохранить при передаче долгой задачи в новую сессию агента?"
    answer: "Исходную цель, принятые решения и их источники, сделанные изменения, результаты проверок, открытые вопросы и следующий шаг. Краткое состояние позволяет продолжить работу без догадок о том, что уже подтверждено."
    category: "Сохранение контекста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему краткое резюме предыдущей сессии нельзя считать полным доказательством сделанной работы?"
    answer: "Резюме может пропустить ограничения, ошибиться в фактах или назвать проверку выполненной без результата. Важные утверждения сверяют с файлами, историей изменений и выводом инструментов перед продолжением."
    category: "Сохранение контекста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое skill в агентном окружении и когда он полезен?"
    answer: "Skill — переиспользуемая инструкция для определённого класса задач, иногда с шаблонами или скриптами. Он полезен, когда команде нужен повторяемый процесс с ясными условиями запуска и проверки, например подготовка контрактных изменений."
    category: "Skills"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что должно быть понятно из описания skill до его запуска?"
    answer: "Для каких задач он предназначен, когда его применять, какие входные данные нужны, что он делает и каким результатом заканчивает. Это помогает агенту выбрать подходящую процедуру и не запускать её на похожей, но неподходящей задаче."
    category: "Skills"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему не стоит превращать каждое правило команды в отдельный skill?"
    answer: "Отдельный skill оправдан для повторяемой процедуры с шагами или ресурсами. Простое постоянное ограничение лучше хранить в общих или локальных правилах; избыток skills затрудняет выбор и сопровождение."
    category: "Skills"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить, что новый skill по подготовке API-контракта работает для команды, а не только для автора?"
    answer: "Дать коллеге выполнить типовую задачу по инструкции без устных подсказок, затем проверить получившийся контракт и пропущенные шаги. Добавить граничный и ошибочный сценарий, исправить неоднозначности и повторить проверку."
    category: "Skills"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем версионировать общие правила и skills агентного окружения?"
    answer: "Так можно понять, при каких инструкциях получен результат, сравнить изменения поведения и откатить неудачное обновление. Особенно важно, если одну процедуру используют несколько проектов или команд."
    category: "Изменения окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как безопасно изменить общее правило агента, которым пользуются несколько команд?"
    answer: "Описать ожидаемое поведение и затронутых потребителей, проверить изменение на характерных задачах каждой команды, выпустить с известной версией и планом отката. Сообщить, какие локальные правила могут конфликтовать с новой общей инструкцией."
    category: "Изменения окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что проверить, если после обновления инструкций агент стал менять лишние файлы?"
    answer: "Сопоставить старые и новые правила, проверить границы задачи, области действия инструкций и недавние изменения инструментов. Воспроизвести ситуацию на той же задаче; до исправления вернуть прежнюю рабочую конфигурацию либо сузить права и инструкции."
    category: "Диагностика окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как понять, что проблема агента вызвана нехваткой контекста, а не плохой формулировкой инструкции?"
    answer: "Проверить, были ли доступны исходные файлы, версии контракта и нужные правила в момент ответа. Если агент заполняет отсутствующие факты догадками, надо добавить источник; если факты есть, но задача трактуется неверно, уточнить цель и критерий результата."
    category: "Диагностика окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем фиксировать конфигурацию агентного окружения при разборе неудачного результата?"
    answer: "Без версии правил, доступных источников, skills, модели и настроек трудно воспроизвести ошибку и понять причину. Запись конфигурации позволяет сравнить работу до и после изменения и проверить исправление."
    category: "Диагностика окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как подготовить агентное окружение для нового участника команды?"
    answer: "Дать версионируемые правила проекта, доступ к разрешённым источникам, краткое описание доступных skills и инструкцию запуска и проверки. Попросить выполнить небольшую типовую задачу, чтобы выявить недостающий контекст и зависимость от устных знаний команды."
    category: "Сопровождение окружения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
