---
topic: MCP и инструменты
cards:
- id: 61af2347-2d6c-420a-83df-31c290e64392
  question: Что решает MCP в работе ИИ-агента?
  answer: MCP задаёт стандартный способ, которым приложение с моделью обнаруживает
    и использует внешние инструменты, ресурсы и шаблоны запросов. Он не определяет
    бизнес-логику самого сервиса и не делает результат модели достоверным автоматически.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: be2a6701-fb8f-401e-9155-fed58c5d1f5a
  question: Чем отличаются MCP host, client и server?
  answer: Host — приложение, управляющее работой ИИ. Внутри него MCP client поддерживает
    соединение с конкретным MCP server; server предоставляет доступные возможности,
    например инструменты или данные.
  category: Архитектура
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b48ddc00-0041-40b2-b152-7973b76a55b0
  question: Почему MCP-сервер не следует отождествлять с самой языковой моделью?
  answer: Сервер предоставляет возможности и данные через протокол, а модель решает,
    как использовать доступный контекст и инструменты в приложении. Сервер может работать
    без собственной модели.
  category: Архитектура
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 34310284-2588-4559-a325-c8beef72cdde
  question: Чем MCP tool отличается от MCP resource?
  answer: Tool описывает вызываемое действие с аргументами и результатом, например
    поиск задачи. Resource предоставляет данные для чтения как контекст, например
    схему БД или документ. Возможности конкретного сервера определяют, что именно
    доступно.
  category: Примитивы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3040c079-a24a-4e2e-92e0-7ab5f1e9a46b
  question: Для чего MCP server предоставляет prompts?
  answer: Для передачи готовых шаблонов взаимодействия с параметрами, которые клиент
    может показать и применить в подходящем сценарии. Prompt не равен исполняемому
    инструменту и сам по себе не предоставляет доступ к данным.
  category: Примитивы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9f8e279a-cc9c-448a-acfe-9d02d65ae250
  question: Почему описание входных параметров tool важно для его безопасного вызова?
  answer: Схема позволяет клиенту и серверу согласовать ожидаемые поля и типы. Однако
    схема проверяет форму, а не право на действие или смысл значения; сервер обязан
    дополнительно валидировать аргументы и полномочия.
  category: Примитивы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 170ceeca-0513-4f3e-9f7a-8fd2af0db76d
  question: Что означает URI у MCP resource?
  answer: Это идентификатор ресурса, по которому клиент обращается к предоставленным
    сервером данным. URI помогает различать источники; доступ к нему всё равно определяется
    возможностями сервера и настройками доступа.
  category: Примитивы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bd2bee19-b01e-4caf-a369-4437abddf002
  question: Чем отличаются локальное подключение MCP через stdio и удалённое через
    HTTP?
  answer: При stdio клиент общается с локальным процессом через стандартные потоки.
    Через HTTP клиент подключается к сетевому серверу; для него важны сетевой доступ,
    аутентификация и защита соединения. Примитивы MCP при этом могут быть одинаковыми.
  category: Подключение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ab464a38-f34e-4e5a-a2fb-ef756fba33bf
  question: Как в общих чертах подключить MCP-сервер к агентному приложению?
  answer: Выбрать доверенный сервер и транспорт, добавить его конфигурацию в host,
    настроить разрешённые учётные данные и права, затем проверить соединение, список
    доступных возможностей и пробный безопасный вызов. Точные поля конфигурации зависят
    от клиента.
  category: Подключение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0db91f1f-d273-4edf-8540-0d6a5305f7d1
  question: Как убедиться, что MCP-сервер подключён, а нужный tool действительно доступен
    агенту?
  answer: Проверить статус соединения и обнаруженный список инструментов, затем выполнить
    тестовый вызов с корректными аргументами и посмотреть результат или ошибку. Успешное
    соединение само по себе не означает, что конкретный tool объявлен и разрешён.
  category: Подключение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 244f93ff-3180-43e3-ad9f-389d87cefcbb
  question: Почему наличие tool в списке MCP-сервера не гарантирует успешное действие?
  answer: Вызов может быть запрещён правами, отклонён серверной валидацией или завершиться
    ошибкой внешней системы. После обнаружения tool нужно проверять доступ, аргументы
    и результат на реальном сценарии.
  category: Подключение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a4dbaf0b-b3ba-4d9d-b493-f8ae2b599c7f
  question: Как отличить проблему соединения MCP от ошибки конкретного tool?
  answer: Сначала проверить, отвечает ли сервер и можно ли получить его возможности.
    Если они доступны, проверить имя инструмента, схему аргументов, права и ответ
    вызываемого сервиса; эти ошибки возникают после установления соединения.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: be59f930-34b3-460f-8b1d-e02e02fb8958
  question: Какие сведения полезно записать при разборе сбоя MCP-вызова?
  answer: Имя сервера и инструмента, время, версию конфигурации, обезличенные аргументы,
    код или тип ошибки, идентификатор запроса и результат. Секреты и чувствительные
    данные в диагностические записи включать нельзя.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 37692b9c-3bb2-4cea-b85c-85b0ea78fab5
  question: Что делать, если удалённый MCP-сервер временно недоступен посреди задачи?
  answer: Не считать действие выполненным. Зафиксировать состояние, оценить возможность
    безопасного повтора и сообщить о недоступности; для необратимых операций сначала
    выяснить, прошёл ли предыдущий вызов.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: fc243094-b1d9-4f74-9598-0e525108530b
  question: Почему повтор MCP-вызова, который создаёт запись, может быть опасен?
  answer: Если ответ потерялся после успешного выполнения, повтор может создать дубль.
    Для таких действий нужен идентификатор операции, идемпотентность на стороне сервера
    или проверка фактического состояния перед повтором.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: bc6b6990-a5ac-41df-a2dc-388de1e7988c
  question: Как изменение схемы tool на сервере может повлиять на работу агента?
  answer: Агент или клиент может передать устаревшие аргументы либо иначе понять результат.
    Изменения интерфейса нужно версионировать или делать совместимыми и проверять
    на сценариях потребителей до обновления.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e14a1fa4-1bf5-485b-86b7-ac652101764d
  question: Почему сначала полезно дать агенту доступ на чтение через MCP, а запись
    добавить позже?
  answer: Чтение позволяет проверить качество контекста и выбор инструмента с меньшим
    риском побочных эффектов. Запись требует отдельной оценки полномочий, подтверждений,
    аудита и восстановления после ошибки.
  category: Права и границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f9c6cbba-e553-4c12-8324-fd175093ee16
  question: Чем аутентификация MCP-подключения отличается от авторизации конкретного
    действия?
  answer: Аутентификация устанавливает, кто подключился. Авторизация решает, вправе
    ли этот субъект читать ресурс или выполнять конкретный tool с указанными параметрами;
    успешно подключённый клиент не должен получать все действия автоматически.
  category: Права и границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e298a32e-2fc8-41db-989e-788e2ed4cb0d
  question: Как ограничить MCP-интеграцию с системой задач, если агенту нужно только
    читать задачи своего проекта?
  answer: Предоставить отдельную учётную запись или токен с минимальными правами,
    ограничить область проекта и открыть лишь нужные операции чтения. Проверить запрет
    на чтение чужих проектов и на изменение задач.
  category: Права и границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 6c5404fe-5b3e-4a6f-b526-68a6852137ad
  question: Почему подтверждение рискованного MCP-действия должно показывать конкретные
    аргументы вызова?
  answer: Название инструмента не раскрывает, какой объект будет изменён и в каком
    объёме. Человек должен видеть цель, действие и важные параметры до выполнения,
    чтобы заметить ошибку или превышение полномочий.
  category: Права и границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fee562df-a5c6-4cab-bc5d-74f58da72ad9
  question: Почему текст, полученный через MCP resource или tool, нельзя считать инструкцией
    для агента?
  answer: Это данные внешнего источника, где могут быть ошибочные или намеренно подложенные
    команды. Их используют как материал задачи, сохраняя приоритет доверенных инструкций
    и проверяя происхождение.
  category: Права и границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2fce2124-dba6-4889-b1b2-b7cc4895a757
  question: Когда обычного API-клиента достаточно и MCP-сервер создавать не нужно?
  answer: Когда интеграция нужна только обычному сервису, без обнаружения возможностей
    агентным приложением. MCP оправдан, если разные агентные клиенты должны безопасно
    получать единый интерфейс к данным или действиям.
  category: Выбор решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5a4c67d2-01d2-4b45-82b7-df66188945c7
  question: Как выбрать между MCP resource и tool для чтения актуального статуса заявки?
  answer: Если клиенту нужен адресуемый объект контекста, подходит resource. Если
    нужны параметры поиска, вычисление или управляемый вызов внешнего API, удобнее
    tool. Решение зависит от интерфейса сервера и нужного сценария.
  category: Выбор решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 13c7ce75-6d43-4cc3-8a5a-8d367b43261f
  question: Почему нельзя считать, что подключение MCP само решает вопрос доступа
    к внутренним данным банка?
  answer: Протокол описывает взаимодействие, а разрешённость данных и действий задают
    политика банка, доверие к серверу, учётные данные и права пользователя. До подключения
    нужно определить, какие данные могут покидать систему и кто их видит.
  category: Права и границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d79dbc93-3843-4607-99be-a5a336720683
  question: Что проверить перед заменой одного MCP-сервера другим с теми же названиями
    tools?
  answer: Сравнить схемы аргументов и ответов, побочные эффекты, права, обработку
    ошибок и происхождение данных. Одинаковые имена не гарантируют одинаковую семантику;
    нужны проверочные сценарии и план отката.
  category: Надёжность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
