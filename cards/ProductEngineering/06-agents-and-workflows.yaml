---
topic: Агенты и организация работы
cards:
- id: b95429f4-ac80-4875-a086-e2da9b7e6236
  question: Чем агент отличается от одиночного вызова языковой модели?
  answer: 'Агент выполняет цикл: получает задачу и контекст, выбирает действия или
    инструменты, наблюдает результаты и продолжает до критерия остановки. Один ответ
    модели может быть частью такого цикла, но сам по себе не организует работу.'
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 8cbafeef-7225-4d31-838f-273447f80ec6
  question: Когда задачу полезно поручить отдельному sub-agent?
  answer: 'Когда часть работы имеет ясный результат, ограниченный контекст и может
    быть проверена отдельно: например, анализ контракта или поиск тестовых сценариев.
    Делегирование имеет смысл, если выигрыш от специализации превышает затраты на
    передачу и сборку результата.'
  category: Делегирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ce7c5440-0972-4ac2-a96a-c378693e8f88
  question: Что необходимо передать sub-agent вместе с поручением?
  answer: Цель, входные материалы, границы изменений, ограничения, ожидаемый артефакт,
    критерий готовности и способ сообщить о неопределённости. Без этого он может решить
    похожую, но не нужную задачу.
  category: Делегирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5db9c157-d311-4f65-a44f-9eff7a6aed89
  question: Почему поручение «сделай всю фичу» нескольким sub-agents часто создаёт
    проблемы?
  answer: Их результаты могут дублироваться, противоречить друг другу и одновременно
    менять одни файлы. Работу нужно разделить по независимым результатам и назначить
    одного ответственного за интеграцию.
  category: Делегирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 217b13e0-319b-4d27-b32e-075db6977d91
  question: Когда можно безопасно запускать несколько агентов параллельно?
  answer: Когда задачи не зависят друг от друга по входам и не пишут в одни и те же
    артефакты либо имеют изолированные рабочие пространства. Перед запуском определить
    границы файлов, зависимости и порядок объединения.
  category: Параллельная работа
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 687a6e32-2041-4001-9899-795b5120fbe8
  question: Зачем изолировать рабочие каталоги или ветки при параллельной работе агентов?
  answer: Иначе изменения одного агента могут попасть в контекст другого, сломать
    промежуточную проверку или перезаписаться. Изоляция делает результат каждого поручения
    проверяемым перед объединением.
  category: Параллельная работа
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0b2d6b8b-73c7-4dc8-9163-2e88db51e25a
  question: Как объединить результаты аналитического и coding-агента, если они по-разному
    поняли бизнес-правило?
  answer: Вернуться к согласованному источнику требования, выявить конкретное расхождение
    и получить решение владельца правила. После этого обновить контракт и реализацию;
    нельзя автоматически выбрать самый уверенный ответ.
  category: Сборка результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 535eff2a-e246-45d9-a508-d24308fee767
  question: Кто отвечает за итог, если работу выполнили несколько агентов?
  answer: Назначенный инженер или владелец задачи собирает результаты, проверяет совместимость
    и принимает решение о готовности. Делегирование не переносит ответственность на
    модель.
  category: Сборка результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: aeeba06c-b7f2-48bf-bdae-dd662716be2e
  question: Чем workflow отличается от свободной работы агента?
  answer: Workflow задаёт последовательность шагов, условия перехода и проверки. Агент
    может принимать решения внутри шага; там, где порядок и результат заранее известны,
    workflow помогает сделать выполнение воспроизводимым.
  category: Workflow
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 63260abf-ab6d-4194-9756-96b51b49326f
  question: Какие элементы нужны для повторяемого workflow изменения API?
  answer: Входной контракт и требование, шаг анализа совместимости, изменение схемы
    и кода, проверки, критерии остановки и выходной артефакт. Следует описать, что
    делать при ошибке и кто принимает спорные решения.
  category: Workflow
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bd64a0fc-456c-4f29-ba09-6185065a15d6
  question: Что такое hook в агентном workflow?
  answer: Это действие, запускаемое при определённом событии или этапе, например проверка
    формата после изменения файла. Он полезен для повторяемых автоматических операций;
    его результат должен быть видим и не подменять смысловую проверку.
  category: Workflow
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4cfba00b-32a6-419e-8417-8039d89987f1
  question: Почему hook, запускающий тесты после изменения кода, не гарантирует готовность
    фичи?
  answer: Тесты проверяют только заложенные сценарии и могут не охватить бизнес-правило,
    контракт или последствия релиза. Нужны также критерии приёмки и оценка фактического
    изменения.
  category: Workflow
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 57316de5-b21d-44a2-ab1e-b0e5c09b9e7b
  question: Где в workflow нужен quality gate?
  answer: 'Перед переходом к следующему рискованному этапу: например, согласовать
    контракт перед кодом или проверить совместимость и тесты перед релизом. Gate должен
    иметь конкретное условие прохождения и понятное действие при отказе.'
  category: Workflow
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9747fb34-ee82-4979-87b9-ffe62f8bf747
  question: Как определить точку остановки для агента с длинной задачей?
  answer: Задать проверяемый результат, ограничения по шагам или ресурсам и условия
    остановки при неизвестном требовании, ошибке инструмента или рискованном действии.
    Агент должен сообщать о неполном результате, а не бесконечно продолжать.
  category: Контроль выполнения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 909e6db7-6f62-439f-8673-9b1fa2523300
  question: Почему автоматический повтор после ошибки инструмента может быть опасен
    в workflow?
  answer: Ошибка ответа не всегда означает, что действие не выполнено. Повтор записи
    или отправки сообщения может дать дубль; сначала нужно определить фактическое
    состояние и возможность идемпотентного повтора.
  category: Контроль выполнения
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 3aa7a335-1e69-41db-9ca1-fd584f6f0be0
  question: Как восстановить workflow после прерывания на середине?
  answer: Сохранить завершённые шаги, их артефакты и результаты проверок. При возобновлении
    сверить текущее состояние системы, затем выполнить только незавершённые и безопасные
    для повтора действия.
  category: Контроль выполнения
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 295a6085-dac0-49a8-821e-86dfa7d039f1
  question: Что делать, если sub-agent вернул полезный результат, но не выполнил требуемую
    проверку?
  answer: Считать поручение неполным, выполнить проверку отдельно или вернуть агенту
    конкретное замечание. В итог не включать неподтверждённое утверждение о готовности.
  category: Сборка результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f35f3b69-4ced-482f-b80b-3c21607f3b4b
  question: Как передать другому агенту результат первого без потери важного контекста?
  answer: Передать артефакт, исходные требования, подтверждённые решения, допущения,
    незакрытые вопросы и ссылки на проверки. Краткое резюме не должно заменять сами
    файлы и результаты инструментов.
  category: Сборка результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 05df5c29-b65b-4171-9075-d0fbe2c8ec68
  question: Когда handoff между специализированными агентами полезнее одного агента
    со всеми инструкциями?
  answer: Когда этапы требуют разного контекста и инструментов, а результат каждого
    этапа имеет явный контракт. Handoff оправдан, если можно проверить вход и выход
    передачи и не теряется ответственность за итог.
  category: Делегирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b1a60925-6ad1-40f2-ac91-c86d59570a35
  question: Как избежать цикла, в котором два агента постоянно передают задачу друг
    другу?
  answer: Назначить владельца решения и правило маршрутизации, ограничить число передач
    и определить, какие данные должен добавить каждый этап. Если причина передачи
    не устранена, остановить цикл и уточнить задачу.
  category: Контроль выполнения
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: f0af5bb9-595c-40b1-8d5b-df583ee7c47d
  question: Почему отчёт агента «готово» не равен завершённому workflow?
  answer: Отчёт может не отражать фактические файлы, ошибки инструментов и невыполненные
    проверки. Завершение определяется наблюдаемыми артефактами и условиями выхода
    каждого обязательного шага.
  category: Контроль выполнения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 17f7cf43-56ba-43c3-8978-e2040f78e532
  question: Как встроить агентный workflow в CI без доступа агента к продуктивной
    среде?
  answer: Дать ему ограниченный вход, изолированное окружение и только нужные операции,
    публиковать проверяемый артефакт или предложение изменения. Переход к деплою оставить
    за существующими контролями CI/CD и владельцами доступа.
  category: Workflow
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 2597a3c2-a776-462e-8ee1-e8603923add4
  question: Как оценить, стоит ли автоматизировать повторяющийся этап агентом?
  answer: Сравнить частоту и трудоёмкость этапа, стабильность входов, стоимость ошибок
    и возможность проверки результата. Если задача полностью формализована, сначала
    рассмотреть обычный скрипт или правило.
  category: Выбор организации
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c2cf6633-1a55-4be3-a248-a71ef33d42d8
  question: Как действовать, если параллельные агенты одновременно предлагают несовместимые
    изменения одной схемы?
  answer: Не объединять их автоматически. Сравнить предложения с исходным контрактом,
    выбрать согласованное решение, затем поручить единую правку схемы и повторить
    проверки потребителей.
  category: Параллельная работа
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: dbd9cd2d-947b-47ff-9760-4d957d10e43c
  question: Что должно остаться после выполнения workflow, чтобы коллега мог разобраться
    в результате?
  answer: Итоговые артефакты, версия входных требований и окружения, выполненные шаги,
    результаты проверок, решения по отклонениям и открытые риски. Такой след позволяет
    проверить или продолжить работу.
  category: Сборка результата
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
