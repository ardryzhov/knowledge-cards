topic: "Агенты и организация работы"
cards:
  - question: "Чем агент отличается от одиночного вызова языковой модели?"
    answer: "Агент выполняет цикл: получает задачу и контекст, выбирает действия или инструменты, наблюдает результаты и продолжает до критерия остановки. Один ответ модели может быть частью такого цикла, но сам по себе не организует работу."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда задачу полезно поручить отдельному sub-agent?"
    answer: "Когда часть работы имеет ясный результат, ограниченный контекст и может быть проверена отдельно: например, анализ контракта или поиск тестовых сценариев. Делегирование имеет смысл, если выигрыш от специализации превышает затраты на передачу и сборку результата."
    category: "Делегирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что необходимо передать sub-agent вместе с поручением?"
    answer: "Цель, входные материалы, границы изменений, ограничения, ожидаемый артефакт, критерий готовности и способ сообщить о неопределённости. Без этого он может решить похожую, но не нужную задачу."
    category: "Делегирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему поручение «сделай всю фичу» нескольким sub-agents часто создаёт проблемы?"
    answer: "Их результаты могут дублироваться, противоречить друг другу и одновременно менять одни файлы. Работу нужно разделить по независимым результатам и назначить одного ответственного за интеграцию."
    category: "Делегирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда можно безопасно запускать несколько агентов параллельно?"
    answer: "Когда задачи не зависят друг от друга по входам и не пишут в одни и те же артефакты либо имеют изолированные рабочие пространства. Перед запуском определить границы файлов, зависимости и порядок объединения."
    category: "Параллельная работа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем изолировать рабочие каталоги или ветки при параллельной работе агентов?"
    answer: "Иначе изменения одного агента могут попасть в контекст другого, сломать промежуточную проверку или перезаписаться. Изоляция делает результат каждого поручения проверяемым перед объединением."
    category: "Параллельная работа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как объединить результаты аналитического и coding-агента, если они по-разному поняли бизнес-правило?"
    answer: "Вернуться к согласованному источнику требования, выявить конкретное расхождение и получить решение владельца правила. После этого обновить контракт и реализацию; нельзя автоматически выбрать самый уверенный ответ."
    category: "Сборка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Кто отвечает за итог, если работу выполнили несколько агентов?"
    answer: "Назначенный инженер или владелец задачи собирает результаты, проверяет совместимость и принимает решение о готовности. Делегирование не переносит ответственность на модель."
    category: "Сборка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем workflow отличается от свободной работы агента?"
    answer: "Workflow задаёт последовательность шагов, условия перехода и проверки. Агент может принимать решения внутри шага; там, где порядок и результат заранее известны, workflow помогает сделать выполнение воспроизводимым."
    category: "Workflow"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие элементы нужны для повторяемого workflow изменения API?"
    answer: "Входной контракт и требование, шаг анализа совместимости, изменение схемы и кода, проверки, критерии остановки и выходной артефакт. Следует описать, что делать при ошибке и кто принимает спорные решения."
    category: "Workflow"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое hook в агентном workflow?"
    answer: "Это действие, запускаемое при определённом событии или этапе, например проверка формата после изменения файла. Он полезен для повторяемых автоматических операций; его результат должен быть видим и не подменять смысловую проверку."
    category: "Workflow"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему hook, запускающий тесты после изменения кода, не гарантирует готовность фичи?"
    answer: "Тесты проверяют только заложенные сценарии и могут не охватить бизнес-правило, контракт или последствия релиза. Нужны также критерии приёмки и оценка фактического изменения."
    category: "Workflow"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Где в workflow нужен quality gate?"
    answer: "Перед переходом к следующему рискованному этапу: например, согласовать контракт перед кодом или проверить совместимость и тесты перед релизом. Gate должен иметь конкретное условие прохождения и понятное действие при отказе."
    category: "Workflow"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как определить точку остановки для агента с длинной задачей?"
    answer: "Задать проверяемый результат, ограничения по шагам или ресурсам и условия остановки при неизвестном требовании, ошибке инструмента или рискованном действии. Агент должен сообщать о неполном результате, а не бесконечно продолжать."
    category: "Контроль выполнения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему автоматический повтор после ошибки инструмента может быть опасен в workflow?"
    answer: "Ошибка ответа не всегда означает, что действие не выполнено. Повтор записи или отправки сообщения может дать дубль; сначала нужно определить фактическое состояние и возможность идемпотентного повтора."
    category: "Контроль выполнения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как восстановить workflow после прерывания на середине?"
    answer: "Сохранить завершённые шаги, их артефакты и результаты проверок. При возобновлении сверить текущее состояние системы, затем выполнить только незавершённые и безопасные для повтора действия."
    category: "Контроль выполнения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если sub-agent вернул полезный результат, но не выполнил требуемую проверку?"
    answer: "Считать поручение неполным, выполнить проверку отдельно или вернуть агенту конкретное замечание. В итог не включать неподтверждённое утверждение о готовности."
    category: "Сборка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как передать другому агенту результат первого без потери важного контекста?"
    answer: "Передать артефакт, исходные требования, подтверждённые решения, допущения, незакрытые вопросы и ссылки на проверки. Краткое резюме не должно заменять сами файлы и результаты инструментов."
    category: "Сборка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда handoff между специализированными агентами полезнее одного агента со всеми инструкциями?"
    answer: "Когда этапы требуют разного контекста и инструментов, а результат каждого этапа имеет явный контракт. Handoff оправдан, если можно проверить вход и выход передачи и не теряется ответственность за итог."
    category: "Делегирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как избежать цикла, в котором два агента постоянно передают задачу друг другу?"
    answer: "Назначить владельца решения и правило маршрутизации, ограничить число передач и определить, какие данные должен добавить каждый этап. Если причина передачи не устранена, остановить цикл и уточнить задачу."
    category: "Контроль выполнения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему отчёт агента «готово» не равен завершённому workflow?"
    answer: "Отчёт может не отражать фактические файлы, ошибки инструментов и невыполненные проверки. Завершение определяется наблюдаемыми артефактами и условиями выхода каждого обязательного шага."
    category: "Контроль выполнения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как встроить агентный workflow в CI без доступа агента к продуктивной среде?"
    answer: "Дать ему ограниченный вход, изолированное окружение и только нужные операции, публиковать проверяемый артефакт или предложение изменения. Переход к деплою оставить за существующими контролями CI/CD и владельцами доступа."
    category: "Workflow"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как оценить, стоит ли автоматизировать повторяющийся этап агентом?"
    answer: "Сравнить частоту и трудоёмкость этапа, стабильность входов, стоимость ошибок и возможность проверки результата. Если задача полностью формализована, сначала рассмотреть обычный скрипт или правило."
    category: "Выбор организации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если параллельные агенты одновременно предлагают несовместимые изменения одной схемы?"
    answer: "Не объединять их автоматически. Сравнить предложения с исходным контрактом, выбрать согласованное решение, затем поручить единую правку схемы и повторить проверки потребителей."
    category: "Параллельная работа"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что должно остаться после выполнения workflow, чтобы коллега мог разобраться в результате?"
    answer: "Итоговые артефакты, версия входных требований и окружения, выполненные шаги, результаты проверок, решения по отклонениям и открытые риски. Такой след позволяет проверить или продолжить работу."
    category: "Сборка результата"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
