- id: 4e7bcdbf-0384-4640-8cc6-4f202002238f
  question: Почему успешно выполненная команда агента не доказывает правильность изменения?
  answer: 'Команда подтверждает только свой результат: например, сборка проверяет
    компиляцию, а тест — заданное ожидание. Нужно сопоставить изменение с требованием,
    контрактами и наблюдаемым поведением.'
  category: Основа проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a8dfcce4-e78b-4fd3-8b68-c1c2bca2700d
  question: Какие три уровня проверки нужны для кода, написанного ИИ-агентом?
  answer: Проверить смысл изменения по требованиям, техническую корректность кода
    и фактическое поведение через тесты или запуск. Каждый уровень обнаруживает свой
    класс ошибок; один не заменяет остальные.
  category: Основа проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 36921971-ee4b-4285-a24c-b04e6c07dc8a
  question: С чего начать ревью большого diff, созданного агентом?
  answer: Сверить список изменённых файлов и границы задачи, затем рассмотреть контракты
    и данные, основные ветки поведения и тесты. Неожиданные файлы и массовое форматирование
    выделить отдельно до подробного чтения.
  category: Ревью изменений
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 67ac2f98-5c47-459c-98f8-f73b41a420e5
  question: Почему особенно важно искать незапрошенные изменения в diff агента?
  answer: Агент может исправить соседний код или поменять контракт по собственному
    предположению. Такие правки расширяют риск, усложняют ревью и могут нарушить совместимость
    вне исходной задачи.
  category: Ревью изменений
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5a8ab000-e635-4fa3-bfa6-9e6f7b4f7120
  question: Что проверить, если агент изменил публичный API, хотя задача касалась
    только внутреннего расчёта?
  answer: Выяснить причину изменения, найти потребителей и контракт, оценить обратную
    совместимость. Если публичное изменение не требуется, убрать его; если необходимо,
    отдельно согласовать и проверить.
  category: Ревью изменений
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dfeb917a-e707-4430-b0dc-b35a161edb00
  question: Как проверить фактическое утверждение ИИ о поведении библиотеки?
  answer: Найти конкретную версию зависимости и сверить утверждение с её документацией
    или исходным кодом; при сомнении сделать минимальный воспроизводимый пример. Уверенная
    формулировка ответа доказательством не является.
  category: Проверка фактов
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c1b969b1-ebf2-4dd1-829d-b8557218076f
  question: Почему ссылка, приведённая ИИ, требует проверки?
  answer: Модель может придумать адрес, неверно пересказать страницу или сослаться
    на другую версию. Нужно открыть источник и убедиться, что он действительно поддерживает
    утверждение применительно к нужному контексту.
  category: Проверка фактов
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8109ec9e-80f0-4fd2-b3dc-f7b7dab6561f
  question: Что делать, если ИИ сгенерировал тесты и все они проходят?
  answer: Проверить, какие требования тесты охватывают, верно ли заданы ожидания и
    способны ли они обнаружить нужный дефект. Добавить независимые сценарии, особенно
    граничные и ошибочные, если их нет.
  category: Тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 245fbfa3-cd6d-4e54-ad96-f0040bbdc19a
  question: Как обнаружить тест, который лишь повторяет ошибочное предположение агента?
  answer: 'Сопоставить ожидаемый результат с независимым требованием или контрактом,
    а не с текущей реализацией. Полезно временно внести характерную ошибку или проверить
    заведомо неверный вход: тест должен упасть.'
  category: Тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ba14df89-5498-47e5-979b-a9aa56791569
  question: Почему unit-тесты не закрывают риск изменения интеграции с Kafka или PostgreSQL?
  answer: Они могут не проверить сериализацию, транзакции, порядок, миграции и реальные
    ограничения инфраструктуры. Для затронутых границ нужны интеграционные или контрактные
    проверки на подходящем окружении.
  category: Тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4f77b023-033f-4dfc-b88f-e1f04fdeed68
  question: Что проверить в миграции БД, предложенной ИИ, помимо синтаксиса SQL?
  answer: Совместимость старой и новой версии приложения, объём данных и время выполнения,
    блокировки, обратимость и сохранность значений. Синтаксически верная миграция
    может нарушить доступность или данные.
  category: Тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 88331b0e-cafd-4c3a-939d-bb13a0044389
  question: Как проверить, что изменение агента не нарушило контракт со смежным сервисом?
  answer: Сверить схему запросов или событий с согласованным контрактом, проверить
    старых и новых потребителей и выполнить профильные контрактные тесты. Если контракт
    меняется, согласовать стратегию развёртывания.
  category: Тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4148d5c6-e727-4e14-bcfa-29e63ce1d189
  question: Какие сценарии стоит включить в ручную проверку изменения, если агент
    добавил обработку ошибки внешнего сервиса?
  answer: Успешный ответ, ожидаемый отказ, таймаут, некорректный ответ и повтор после
    неопределённого исхода. Проверить, что клиент видит корректный результат, а побочные
    эффекты не дублируются.
  category: Тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4b6fddb3-6a75-44ec-bcbd-90fdb3ee6106
  question: Чем проверка артефакта отличается от проверки отчёта агента о проделанной
    работе?
  answer: Артефакт — это изменённые файлы, контракт, результат запуска или теста.
    Отчёт лишь описывает их и может быть неточным; вывод нужно сверять с фактическими
    артефактами.
  category: Основа проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 5771022d-7f58-47fa-8c92-bd20c9a10cdc
  question: Как проверить вывод агента «тесты проходят», если он не приложил результат
    запуска?
  answer: Запустить указанные тесты самому или запросить воспроизводимый лог команды,
    среду и код завершения. Если тесты не запускались, так и зафиксировать; нельзя
    считать утверждение проверкой.
  category: Проверка доказательств
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b792b92c-ecbf-4a84-88a2-822e04796f63
  question: Почему LLM-проверяющий не должен быть единственным судьёй корректности
    кода?
  answer: Другая модель тоже может ошибиться или разделить исходное предположение.
    Её замечания полезны как сигнал, но проверяемые свойства лучше подтверждать тестами,
    контрактами и независимым чтением источников.
  category: Проверка доказательств
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1339a122-320c-48f4-9e6c-af82fc5e48cb
  question: Что такое проверочный набор для агентного сценария?
  answer: Это несколько характерных входов с ожидаемыми результатами или критериями
    оценки, включая ошибки и границы. Его повторно прогоняют после изменения инструкций,
    модели или инструментов, чтобы обнаружить регрессии.
  category: Evals
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: aeb64552-0749-42b8-b68f-0fdb5e8326d2
  question: Почему проверочный набор должен содержать реальные сложные случаи, а не
    только учебные примеры?
  answer: Простые примеры могут не выявить потерю контекста, неверный выбор инструмента
    и ошибки на неполных данных. Случаи берут из типичных задач и прошлых отказов,
    очищая их от чувствительной информации.
  category: Evals
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2eeec1aa-1e65-4ab3-b7a3-dced6b2d6e6d
  question: Что оценивать в трассе работы агента помимо финального ответа?
  answer: Какие источники он использовал, какие инструменты и аргументы выбрал, где
    возникла ошибка, были ли опасные действия и выполнялись ли требуемые проверки.
    Правильный финальный текст может скрывать неверный процесс.
  category: Evals
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 99ee1273-8f15-45f4-93c3-7967d8463e21
  question: Что делать, если агент достиг правильного результата, но использовал запрещённый
    источник?
  answer: Считать выполнение неуспешным по правилам процесса, устранить доступ или
    изменить инструкции и повторить проверку. Корректный результат не оправдывает
    нарушение границ доступа.
  category: Evals
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 451cb290-e5db-44df-b656-45da2625de8c
  question: Как применять quality gate к изменению, сделанному агентом?
  answer: 'Задать конкретные условия прохождения: например, ревью контракта, профильные
    тесты, проверка уязвимостей и отсутствие незапрошенных правок. Gate должен блокировать
    переход при провале и сохранять причину.'
  category: Quality gates
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6c20767b-cc87-46c8-9d9e-187dc1f638f0
  question: Какие результаты проверки стоит приложить к изменению для ревью коллегой?
  answer: Краткую связь с требованием, перечень затронутых контрактов, результаты
    выполненных тестов и проверок, открытые допущения и риски. Отдельно указать, что
    не проверялось.
  category: Проверка доказательств
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d3f66454-c8c8-45cd-972d-062ee96b3a4b
  question: Как действовать, если проверка выявила ошибку только в одном из нескольких
    результатов агента?
  answer: Локализовать ошибку и её зависимые артефакты, исправить причину, затем повторно
    проверить затронутые сценарии. Не перезапускать бездумно всю работу, если остальные
    результаты независимо подтверждены.
  category: Исправление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e90f1a64-c0eb-4f21-b296-b16ec43166c0
  question: Почему после исправления ошибки агентом нужно повторить уже проходившие
    проверки?
  answer: Исправление может нарушить соседние ветки или вернуть старый дефект. Повторить
    профильные тесты и регрессионные случаи, связанные с изменённым кодом и контрактами.
  category: Исправление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: da86394e-e85e-4e51-a1fe-660da9f32a02
  question: Когда результат работы ИИ нельзя принимать даже при зелёных тестах и ревью?
  answer: Когда не подтверждено ключевое бизнес-правило, неясен источник данных или
    изменены критичные свойства без согласования. Технические проверки не заменяют
    решения владельца требования.
  category: Основа проверки
