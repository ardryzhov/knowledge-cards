topic: "Проверка работы ИИ"
cards:
  - question: "Почему успешно выполненная команда агента не доказывает правильность изменения?"
    answer: "Команда подтверждает только свой результат: например, сборка проверяет компиляцию, а тест — заданное ожидание. Нужно сопоставить изменение с требованием, контрактами и наблюдаемым поведением."
    category: "Основа проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие три уровня проверки нужны для кода, написанного ИИ-агентом?"
    answer: "Проверить смысл изменения по требованиям, техническую корректность кода и фактическое поведение через тесты или запуск. Каждый уровень обнаруживает свой класс ошибок; один не заменяет остальные."
    category: "Основа проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "С чего начать ревью большого diff, созданного агентом?"
    answer: "Сверить список изменённых файлов и границы задачи, затем рассмотреть контракты и данные, основные ветки поведения и тесты. Неожиданные файлы и массовое форматирование выделить отдельно до подробного чтения."
    category: "Ревью изменений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему особенно важно искать незапрошенные изменения в diff агента?"
    answer: "Агент может исправить соседний код или поменять контракт по собственному предположению. Такие правки расширяют риск, усложняют ревью и могут нарушить совместимость вне исходной задачи."
    category: "Ревью изменений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить, если агент изменил публичный API, хотя задача касалась только внутреннего расчёта?"
    answer: "Выяснить причину изменения, найти потребителей и контракт, оценить обратную совместимость. Если публичное изменение не требуется, убрать его; если необходимо, отдельно согласовать и проверить."
    category: "Ревью изменений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить фактическое утверждение ИИ о поведении библиотеки?"
    answer: "Найти конкретную версию зависимости и сверить утверждение с её документацией или исходным кодом; при сомнении сделать минимальный воспроизводимый пример. Уверенная формулировка ответа доказательством не является."
    category: "Проверка фактов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему ссылка, приведённая ИИ, требует проверки?"
    answer: "Модель может придумать адрес, неверно пересказать страницу или сослаться на другую версию. Нужно открыть источник и убедиться, что он действительно поддерживает утверждение применительно к нужному контексту."
    category: "Проверка фактов"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если ИИ сгенерировал тесты и все они проходят?"
    answer: "Проверить, какие требования тесты охватывают, верно ли заданы ожидания и способны ли они обнаружить нужный дефект. Добавить независимые сценарии, особенно граничные и ошибочные, если их нет."
    category: "Тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как обнаружить тест, который лишь повторяет ошибочное предположение агента?"
    answer: "Сопоставить ожидаемый результат с независимым требованием или контрактом, а не с текущей реализацией. Полезно временно внести характерную ошибку или проверить заведомо неверный вход: тест должен упасть."
    category: "Тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему unit-тесты не закрывают риск изменения интеграции с Kafka или PostgreSQL?"
    answer: "Они могут не проверить сериализацию, транзакции, порядок, миграции и реальные ограничения инфраструктуры. Для затронутых границ нужны интеграционные или контрактные проверки на подходящем окружении."
    category: "Тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить в миграции БД, предложенной ИИ, помимо синтаксиса SQL?"
    answer: "Совместимость старой и новой версии приложения, объём данных и время выполнения, блокировки, обратимость и сохранность значений. Синтаксически верная миграция может нарушить доступность или данные."
    category: "Тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, что изменение агента не нарушило контракт со смежным сервисом?"
    answer: "Сверить схему запросов или событий с согласованным контрактом, проверить старых и новых потребителей и выполнить профильные контрактные тесты. Если контракт меняется, согласовать стратегию развёртывания."
    category: "Тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие сценарии стоит включить в ручную проверку изменения, если агент добавил обработку ошибки внешнего сервиса?"
    answer: "Успешный ответ, ожидаемый отказ, таймаут, некорректный ответ и повтор после неопределённого исхода. Проверить, что клиент видит корректный результат, а побочные эффекты не дублируются."
    category: "Тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем проверка артефакта отличается от проверки отчёта агента о проделанной работе?"
    answer: "Артефакт — это изменённые файлы, контракт, результат запуска или теста. Отчёт лишь описывает их и может быть неточным; вывод нужно сверять с фактическими артефактами."
    category: "Основа проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как проверить вывод агента «тесты проходят», если он не приложил результат запуска?"
    answer: "Запустить указанные тесты самому или запросить воспроизводимый лог команды, среду и код завершения. Если тесты не запускались, так и зафиксировать; нельзя считать утверждение проверкой."
    category: "Проверка доказательств"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему LLM-проверяющий не должен быть единственным судьёй корректности кода?"
    answer: "Другая модель тоже может ошибиться или разделить исходное предположение. Её замечания полезны как сигнал, но проверяемые свойства лучше подтверждать тестами, контрактами и независимым чтением источников."
    category: "Проверка доказательств"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое проверочный набор для агентного сценария?"
    answer: "Это несколько характерных входов с ожидаемыми результатами или критериями оценки, включая ошибки и границы. Его повторно прогоняют после изменения инструкций, модели или инструментов, чтобы обнаружить регрессии."
    category: "Evals"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему проверочный набор должен содержать реальные сложные случаи, а не только учебные примеры?"
    answer: "Простые примеры могут не выявить потерю контекста, неверный выбор инструмента и ошибки на неполных данных. Случаи берут из типичных задач и прошлых отказов, очищая их от чувствительной информации."
    category: "Evals"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что оценивать в трассе работы агента помимо финального ответа?"
    answer: "Какие источники он использовал, какие инструменты и аргументы выбрал, где возникла ошибка, были ли опасные действия и выполнялись ли требуемые проверки. Правильный финальный текст может скрывать неверный процесс."
    category: "Evals"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если агент достиг правильного результата, но использовал запрещённый источник?"
    answer: "Считать выполнение неуспешным по правилам процесса, устранить доступ или изменить инструкции и повторить проверку. Корректный результат не оправдывает нарушение границ доступа."
    category: "Evals"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как применять quality gate к изменению, сделанному агентом?"
    answer: "Задать конкретные условия прохождения: например, ревью контракта, профильные тесты, проверка уязвимостей и отсутствие незапрошенных правок. Gate должен блокировать переход при провале и сохранять причину."
    category: "Quality gates"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие результаты проверки стоит приложить к изменению для ревью коллегой?"
    answer: "Краткую связь с требованием, перечень затронутых контрактов, результаты выполненных тестов и проверок, открытые допущения и риски. Отдельно указать, что не проверялось."
    category: "Проверка доказательств"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если проверка выявила ошибку только в одном из нескольких результатов агента?"
    answer: "Локализовать ошибку и её зависимые артефакты, исправить причину, затем повторно проверить затронутые сценарии. Не перезапускать бездумно всю работу, если остальные результаты независимо подтверждены."
    category: "Исправление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему после исправления ошибки агентом нужно повторить уже проходившие проверки?"
    answer: "Исправление может нарушить соседние ветки или вернуть старый дефект. Повторить профильные тесты и регрессионные случаи, связанные с изменённым кодом и контрактами."
    category: "Исправление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда результат работы ИИ нельзя принимать даже при зелёных тестах и ревью?"
    answer: "Когда не подтверждено ключевое бизнес-правило, неясен источник данных или изменены критичные свойства без согласования. Технические проверки не заменяют решения владельца требования."
    category: "Основа проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
