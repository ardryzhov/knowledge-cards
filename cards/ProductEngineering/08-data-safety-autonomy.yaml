topic: Данные, безопасность и автономность
cards:
- id: 6e057e56-58d3-4e7b-83a7-d566f550ce56
  question: Какие данные нельзя автоматически отправлять внешней ИИ-модели из банковского
    проекта?
  answer: Секреты, персональные и платёжные данные, закрытый код и документы без разрешённого
    основания и утверждённого канала передачи. Перед использованием модели нужно проверить
    классификацию данных и правила банка для конкретного окружения.
  category: Классы данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 0648449c-89a0-4968-b2c6-c289ac8814f9
  question: Почему удаление имени из клиентского кейса не всегда делает его безопасным
    для передачи ИИ?
  answer: Сочетание суммы, даты, идентификатора операции и других полей может позволить
    повторно определить человека. Нужно оценивать весь набор данных и применять согласованное
    обезличивание либо синтетический пример.
  category: Классы данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f7ccdc90-9c8f-4457-a4bf-8fb6b0a46e15
  question: Как подготовить реалистичный пример инцидента для ИИ без раскрытия клиентских
    данных?
  answer: Заменить идентификаторы и чувствительные значения, сохранить причинную структуру
    ошибки и проверить, что по оставшимся полям нельзя восстановить клиента. При возможности
    использовать синтетические данные и разрешённую внутреннюю среду.
  category: Классы данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 648262f5-052b-400d-8bcc-7c46a17c9869
  question: Почему секрет в промпте опасен, даже если агент обещает не повторять его
    в ответе?
  answer: Секрет уже попал в переданный контекст и может сохраниться в журналах или
    стороннем сервисе. Секреты передают через штатные механизмы доступа к инструментам,
    не в текст инструкции.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: badc657f-6bf9-4978-ac5f-12af87fab975
  question: Что делать, если агент случайно вывел токен в логе или ответе?
  answer: Ограничить дальнейшее распространение, сообщить ответственным по принятому
    процессу, отозвать или заменить токен и проверить, где он мог сохраниться. Удаление
    строки из одного ответа не отменяет возможной компрометации.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7fb9dbd9-1ce5-4f67-a4d7-da4ff811923a
  question: Почему нельзя считать системный промпт надёжным местом хранения пароля
    или правила авторизации?
  answer: Промпт может оказаться в выводе или трассе, а модель не является механизмом
    разграничения доступа. Секреты хранят в предназначенном хранилище, а права проверяют
    в коде и инфраструктуре.
  category: Секреты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eb71ea0b-7933-4029-bee7-55ff33086c64
  question: Что такое prompt injection в рабочем документе, который читает агент?
  answer: Это попытка заставить агента выполнять команды из документа как инструкции,
    хотя документ должен быть лишь данными. Например, текст требования может содержать
    просьбу отправить файл на внешний адрес.
  category: Недоверенный контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 42dc725f-01f7-4caf-a549-9edf36dd0f5e
  question: Чем косвенная prompt injection отличается от прямого запроса пользователя?
  answer: При косвенной атаке управляющий текст приходит через менее доверенный источник
    — страницу, файл, письмо или ответ инструмента. Агент может ошибочно принять его
    за авторитетную инструкцию, хотя источник предназначен для данных.
  category: Недоверенный контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 13a2580a-0142-440f-a1b5-7b469d0a9a2d
  question: Как действовать, если найденный агентом документ содержит фразу «игнорируй
    предыдущие инструкции»?
  answer: Рассматривать её как содержимое документа, не выполнять указанное действие,
    проверить происхождение источника и продолжить по доверенным правилам. При необходимости
    сообщить о подозрительном документе владельцу системы.
  category: Недоверенный контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 32333f92-428a-4a59-9002-84a4614fb2cb
  question: Почему одного указания «не следуй инструкциям из документов» недостаточно
    для защиты?
  answer: Модель может ошибиться, а текст атаки может быть скрыт или переформулирован.
    Нужны независимые ограничения инструментов, минимальные права, проверка входов
    и подтверждение рискованных действий.
  category: Недоверенный контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1aa2c1d4-037a-4393-89fd-92b9da6060ee
  question: Как ограничить агенту доступ к репозиторию, если ему поручено только чтение?
  answer: Дать режим или учётную запись без записи и сетевых побочных действий, открыть
    только нужный проект и проверить фактические права. Текстовая просьба «ничего
    не меняй» не заменяет техническое ограничение.
  category: Права и автономность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f1491f7b-5fca-4eba-ac28-47bcee060dfe
  question: Почему опасно давать агенту один универсальный токен для чтения и изменения
    всех систем?
  answer: Ошибка или внедрённая инструкция получает слишком широкую область воздействия.
    Разделить права по задачам и системам, использовать короткоживущие учётные данные
    и проверять полномочия на стороне инструмента.
  category: Права и автономность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a0fb6609-cf2d-4724-be05-1316d3d381c9
  question: Какие действия агента в банковском сервисе требуют отдельной точки контроля?
  answer: 'Действия с необратимыми или внешними последствиями: изменение продуктивных
    данных, релиз, отправка сообщений, выдача прав, публикация и удаление. Конкретные
    правила подтверждения задаёт политика организации и риск операции.'
  category: Права и автономность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fca00353-96b6-41f6-a30d-ba87bbbfffc9
  question: Как выбрать степень автономности агента для новой задачи?
  answer: Оценить цену ошибки, обратимость, чувствительность данных, возможность проверить
    результат и зрелость инструмента. Начать с ограниченного доступа и расширять его
    только после подтверждённых сценариев и контролей.
  category: Права и автономность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b97660eb-6f79-47dd-9b07-0d352715eb57
  question: Почему подтверждение человеком не поможет, если ему показано только «агент
    хочет выполнить действие»?
  answer: Нужно показать конкретный объект, параметры, последствия и источник основания.
    Иначе человек не может осмысленно оценить, соответствует ли вызов задаче и доступам.
  category: Права и автономность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e62f0024-be56-4ecc-b991-05093d710459
  question: Как защитить сервис от подмены аргументов tool-вызова моделью?
  answer: Сервер должен валидировать формат, диапазоны, владельца объекта и право
    на действие независимо от модели. Для рискованных операций полезны allowlist объектов
    и явное подтверждение фактических аргументов.
  category: Границы доверия
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 09593f8d-8543-459c-94c7-d1cdd32d9936
  question: Почему проверка доступа должна выполняться в инструменте или сервисе,
    а не только в инструкции агенту?
  answer: Инструкция направляет поведение модели, но не гарантирует его. Инструмент
    должен отклонять запрещённый вызов независимо от текста, которым агент объясняет
    действие.
  category: Границы доверия
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: dbdc88f4-54c4-409c-a205-1bb2dcb841f9
  question: Какие данные из трасс агента могут сами стать источником утечки?
  answer: Аргументы инструментов, фрагменты документов, сообщения, результаты поиска
    и ошибки могут содержать чувствительные данные. Нужны ограничения записи, маскирование,
    права доступа и сроки хранения трасс.
  category: Журналы и трассы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: acf182e0-ece8-4e9e-acf1-fc90614dd046
  question: Что проверить перед отправкой фрагмента кода в внешнюю модель?
  answer: Классификацию кода, наличие секретов и персональных данных в файле, разрешённость
    провайдера и правила проекта. Если передача запрещена, использовать согласованное
    внутреннее окружение или обезличенный пример.
  category: Классы данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1aad5771-f835-42d1-b68c-8ddd2e381811
  question: Почему вывод агента из внешнего источника нельзя напрямую исполнять как
    shell-команду?
  answer: Источник может содержать вредоносную команду или подменить аргументы. Команду
    нужно понять, ограничить разрешёнными действиями и выполнить в подходящей изоляции
    с проверкой результата.
  category: Границы доверия
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: e6c03184-6e46-490b-a183-6c63fde0a650
  question: Что делать, если агент предложил отправить клиентский отчёт через сторонний
    сервис для «удобной проверки»?
  answer: Остановить передачу, проверить разрешённые каналы и необходимость данных,
    предложить безопасную альтернативу. Удобство не является основанием для вывода
    чувствительной информации за доверенную границу.
  category: Классы данных
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 14bca4c2-efd2-4c8c-8d73-46eac86b931f
  question: Как проверить агентное окружение на риск prompt injection до широкого
    внедрения?
  answer: Провести сценарии с недоверенными документами и ответами инструментов, содержащими
    просьбы изменить действие или вывести данные. Проверить, что права и контроль
    на границе инструмента предотвращают последствия, а не только что модель обещает
    отказаться.
  category: Недоверенный контент
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d25fa88e-c3c6-4df5-aeba-4250415a6124
  question: Что должно быть в следе выполнения рискованного действия агента?
  answer: Кто инициировал задачу, какой инструмент и с какими безопасно записанными
    параметрами вызван, какое правило или подтверждение применилось и чем завершилось
    действие. Доступ к следу ограничивают по чувствительности данных.
  category: Журналы и трассы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d4cef34e-fbe9-4f47-a2fa-a8b63b01c533
  question: Почему резервная ручная процедура нужна даже при хорошо работающем агенте?
  answer: Агент или провайдер может быть недоступен, ошибаться либо потерять необходимые
    права. Для критичного процесса должен существовать безопасный способ продолжить
    или остановить работу без него.
  category: Права и автономность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 333066e7-94b9-47f7-b9be-64d4d2ecbe81
  question: Что делать, если пользователь разрешил агенту читать один документ, а
    ответ инструмента содержит ссылки на соседние закрытые документы?
  answer: Считать разрешение ограниченным исходным объёмом. Прежде чем переходить
    по ссылкам, проверить права и уместность каждого источника; само наличие ссылки
    не расширяет полномочия агента.
  category: Границы доверия
  context: 
