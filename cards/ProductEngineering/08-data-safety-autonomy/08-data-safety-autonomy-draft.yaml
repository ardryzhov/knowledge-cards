topic: "Данные, безопасность и автономность"
cards:
  - question: "Какие данные нельзя автоматически отправлять внешней ИИ-модели из банковского проекта?"
    answer: "Секреты, персональные и платёжные данные, закрытый код и документы без разрешённого основания и утверждённого канала передачи. Перед использованием модели нужно проверить классификацию данных и правила банка для конкретного окружения."
    category: "Классы данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему удаление имени из клиентского кейса не всегда делает его безопасным для передачи ИИ?"
    answer: "Сочетание суммы, даты, идентификатора операции и других полей может позволить повторно определить человека. Нужно оценивать весь набор данных и применять согласованное обезличивание либо синтетический пример."
    category: "Классы данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как подготовить реалистичный пример инцидента для ИИ без раскрытия клиентских данных?"
    answer: "Заменить идентификаторы и чувствительные значения, сохранить причинную структуру ошибки и проверить, что по оставшимся полям нельзя восстановить клиента. При возможности использовать синтетические данные и разрешённую внутреннюю среду."
    category: "Классы данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему секрет в промпте опасен, даже если агент обещает не повторять его в ответе?"
    answer: "Секрет уже попал в переданный контекст и может сохраниться в журналах или стороннем сервисе. Секреты передают через штатные механизмы доступа к инструментам, не в текст инструкции."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если агент случайно вывел токен в логе или ответе?"
    answer: "Ограничить дальнейшее распространение, сообщить ответственным по принятому процессу, отозвать или заменить токен и проверить, где он мог сохраниться. Удаление строки из одного ответа не отменяет возможной компрометации."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему нельзя считать системный промпт надёжным местом хранения пароля или правила авторизации?"
    answer: "Промпт может оказаться в выводе или трассе, а модель не является механизмом разграничения доступа. Секреты хранят в предназначенном хранилище, а права проверяют в коде и инфраструктуре."
    category: "Секреты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое prompt injection в рабочем документе, который читает агент?"
    answer: "Это попытка заставить агента выполнять команды из документа как инструкции, хотя документ должен быть лишь данными. Например, текст требования может содержать просьбу отправить файл на внешний адрес."
    category: "Недоверенный контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем косвенная prompt injection отличается от прямого запроса пользователя?"
    answer: "При косвенной атаке управляющий текст приходит через менее доверенный источник — страницу, файл, письмо или ответ инструмента. Агент может ошибочно принять его за авторитетную инструкцию, хотя источник предназначен для данных."
    category: "Недоверенный контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если найденный агентом документ содержит фразу «игнорируй предыдущие инструкции»?"
    answer: "Рассматривать её как содержимое документа, не выполнять указанное действие, проверить происхождение источника и продолжить по доверенным правилам. При необходимости сообщить о подозрительном документе владельцу системы."
    category: "Недоверенный контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему одного указания «не следуй инструкциям из документов» недостаточно для защиты?"
    answer: "Модель может ошибиться, а текст атаки может быть скрыт или переформулирован. Нужны независимые ограничения инструментов, минимальные права, проверка входов и подтверждение рискованных действий."
    category: "Недоверенный контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как ограничить агенту доступ к репозиторию, если ему поручено только чтение?"
    answer: "Дать режим или учётную запись без записи и сетевых побочных действий, открыть только нужный проект и проверить фактические права. Текстовая просьба «ничего не меняй» не заменяет техническое ограничение."
    category: "Права и автономность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему опасно давать агенту один универсальный токен для чтения и изменения всех систем?"
    answer: "Ошибка или внедрённая инструкция получает слишком широкую область воздействия. Разделить права по задачам и системам, использовать короткоживущие учётные данные и проверять полномочия на стороне инструмента."
    category: "Права и автономность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие действия агента в банковском сервисе требуют отдельной точки контроля?"
    answer: "Действия с необратимыми или внешними последствиями: изменение продуктивных данных, релиз, отправка сообщений, выдача прав, публикация и удаление. Конкретные правила подтверждения задаёт политика организации и риск операции."
    category: "Права и автономность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать степень автономности агента для новой задачи?"
    answer: "Оценить цену ошибки, обратимость, чувствительность данных, возможность проверить результат и зрелость инструмента. Начать с ограниченного доступа и расширять его только после подтверждённых сценариев и контролей."
    category: "Права и автономность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему подтверждение человеком не поможет, если ему показано только «агент хочет выполнить действие»?"
    answer: "Нужно показать конкретный объект, параметры, последствия и источник основания. Иначе человек не может осмысленно оценить, соответствует ли вызов задаче и доступам."
    category: "Права и автономность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как защитить сервис от подмены аргументов tool-вызова моделью?"
    answer: "Сервер должен валидировать формат, диапазоны, владельца объекта и право на действие независимо от модели. Для рискованных операций полезны allowlist объектов и явное подтверждение фактических аргументов."
    category: "Границы доверия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему проверка доступа должна выполняться в инструменте или сервисе, а не только в инструкции агенту?"
    answer: "Инструкция направляет поведение модели, но не гарантирует его. Инструмент должен отклонять запрещённый вызов независимо от текста, которым агент объясняет действие."
    category: "Границы доверия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие данные из трасс агента могут сами стать источником утечки?"
    answer: "Аргументы инструментов, фрагменты документов, сообщения, результаты поиска и ошибки могут содержать чувствительные данные. Нужны ограничения записи, маскирование, права доступа и сроки хранения трасс."
    category: "Журналы и трассы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить перед отправкой фрагмента кода в внешнюю модель?"
    answer: "Классификацию кода, наличие секретов и персональных данных в файле, разрешённость провайдера и правила проекта. Если передача запрещена, использовать согласованное внутреннее окружение или обезличенный пример."
    category: "Классы данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему вывод агента из внешнего источника нельзя напрямую исполнять как shell-команду?"
    answer: "Источник может содержать вредоносную команду или подменить аргументы. Команду нужно понять, ограничить разрешёнными действиями и выполнить в подходящей изоляции с проверкой результата."
    category: "Границы доверия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если агент предложил отправить клиентский отчёт через сторонний сервис для «удобной проверки»?"
    answer: "Остановить передачу, проверить разрешённые каналы и необходимость данных, предложить безопасную альтернативу. Удобство не является основанием для вывода чувствительной информации за доверенную границу."
    category: "Классы данных"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить агентное окружение на риск prompt injection до широкого внедрения?"
    answer: "Провести сценарии с недоверенными документами и ответами инструментов, содержащими просьбы изменить действие или вывести данные. Проверить, что права и контроль на границе инструмента предотвращают последствия, а не только что модель обещает отказаться."
    category: "Недоверенный контент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что должно быть в следе выполнения рискованного действия агента?"
    answer: "Кто инициировал задачу, какой инструмент и с какими безопасно записанными параметрами вызван, какое правило или подтверждение применилось и чем завершилось действие. Доступ к следу ограничивают по чувствительности данных."
    category: "Журналы и трассы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему резервная ручная процедура нужна даже при хорошо работающем агенте?"
    answer: "Агент или провайдер может быть недоступен, ошибаться либо потерять необходимые права. Для критичного процесса должен существовать безопасный способ продолжить или остановить работу без него."
    category: "Права и автономность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если пользователь разрешил агенту читать один документ, а ответ инструмента содержит ссылки на соседние закрытые документы?"
    answer: "Считать разрешение ограниченным исходным объёмом. Прежде чем переходить по ссылкам, проверить права и уместность каждого источника; само наличие ссылки не расширяет полномочия агента."
    category: "Границы доверия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
