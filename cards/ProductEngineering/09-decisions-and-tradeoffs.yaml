- id: f9428661-4933-4fc3-9a2a-1de86d2d7ebc
  question: Как объяснить бизнесу архитектурный компромисс без перечня технологий?
  answer: Описать последствия в терминах пользовательского результата, срока, риска
    отказа и стоимости изменений. Например, немедленный ответ даёт удобство, но требует
    устойчивой работы внешней системы в момент операции.
  category: Коммуникация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1b74f14f-21a0-4f1f-81d6-ab685b856c9e
  question: Почему «агент выбрал вариант» не является достаточным основанием на архитектурном
    ревью?
  answer: На ревью нужны условия, сравнение альтернатив, проверенные факты и последствия
    для системы. Рекомендация агента может быть входом для обсуждения, но решение
    принадлежит ответственным инженерам и владельцам требований.
