- id: 9557c8c9-536a-4333-99bd-6215521987c9
  question: Почему архитектурное решение нельзя принимать только по рекомендации ИИ?
  answer: Модель не знает всех ограничений продукта и может убедительно предложить
    неподходящий вариант. Инженер должен сверить факты, оценить последствия для данных,
    эксплуатации и пользователей, а затем принять и зафиксировать решение.
  category: Принятие решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 28d9a0be-a3c1-4af5-8b35-dd5aa164b651
  question: Какие критерии стоит задать перед сравнением двух архитектурных вариантов?
  answer: Целевой сценарий, ограничения по надёжности, безопасности, нагрузке, срокам,
    стоимости и сопровождению. Критерии задают до оценки вариантов, чтобы сравнение
    не подстраивалось под понравившееся решение.
  category: Принятие решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6a67eca6-2b03-4865-a7db-c37bfe51b0d9
  question: Как попросить ИИ помочь сравнить варианты без фиктивного «лучшего решения»?
  answer: Дать одинаковые исходные условия, попросить перечислить допущения, последствия
    и случаи, где каждый вариант выигрывает. Затем проверить спорные факты и решить
    по приоритетам конкретного продукта.
  category: Работа с ИИ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 41b979db-50a9-464f-bd33-9a1bb28e4c7c
  question: Что делать, если ИИ предложил паттерн Transactional Outbox для простой
    интеграции?
  answer: Проверить требование к атомарности изменения БД и публикации события, последствия
    потери или дубля, текущую инфраструктуру и стоимость сопровождения. Паттерн применять,
    когда он закрывает реальный риск, а не из-за его известности.
  category: Сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e51c3d10-2895-40de-a0c1-ef1ee24bc978
  question: Как выбрать между синхронным API и асинхронным событием для нового бизнес-действия?
  answer: Оценить, нужен ли вызывающему немедленный результат, допустима ли eventual
    consistency, как обрабатывать отказ, повтор и наблюдать операцию. Выбор делают
    по сценарию и контракту, а не по моде на брокер.
  category: Сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0f173370-3052-4472-8079-a68098a63bf5
  question: Почему локальная оптимизация одного сервиса может ухудшить весь пользовательский
    сценарий?
  answer: Ускорение собственного ответа может перенести очередь или нагрузку на соседний
    сервис и увеличить итоговое время. Нужно смотреть на путь операции целиком и связанные
    продуктовые и технические показатели.
  category: Системное мышление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fd342530-6c05-4572-b949-f5ce67119a01
  question: Как оценить влияние изменения схемы БД на аналитику, тестирование и эксплуатацию?
  answer: Проследить потребителей данных и запросы, миграцию и период совместной работы
    версий, новые тестовые данные и мониторинг. Одной оценки SQL-миграции недостаточно
    для сквозного решения.
  category: Системное мышление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ba64df9f-3b44-4a0c-8e36-6958484d24ff
  question: Когда стоит предпочесть более простое решение, даже если ИИ предложил
    гибкую архитектуру?
  answer: Когда дополнительные компоненты не закрывают подтверждённое требование и
    увеличивают число отказов и стоимость сопровождения. Сохранить возможность расширения
    в границах разумного, но не строить её заранее без основания.
  category: Принятие решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a28af47c-c9ab-4ba1-8b7b-4290b25f6267
  question: Как оценить обратимость архитектурного решения?
  answer: Посмотреть, можно ли вернуть прежний код и конфигурацию, что произойдёт
    с уже записанными данными и внешними контрактами, сколько потребителей нужно координировать.
    Чем труднее откат, тем раньше нужны проверка гипотез и план миграции.
  category: Риски
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 891e5965-8f28-44c1-abdd-3f2a7507fdf4
  question: Какие допущения нужно явно назвать перед выбором хранения нового набора
    данных?
  answer: Объём и рост, шаблоны чтения и записи, требования к консистентности, срок
    хранения, доступы и связь с существующей моделью. Неизвестные параметры лучше
    измерить или проверить на прототипе.
  category: Принятие решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 114cde49-399a-4aff-955e-cf99725a4d74
  question: Когда короткий технический эксперимент полезнее долгого обсуждения вариантов
    с ИИ?
  answer: 'Когда ключевой спор можно измерить: например, задержку запроса на репрезентативных
    данных или совместимость библиотеки. Заранее задать критерий, условия эксперимента
    и область применимости результата.'
  category: Проверка гипотез
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2c20efb6-761b-4889-a96a-32523ea90d7a
  question: Почему тест на маленькой пустой БД не подтверждает пригодность решения
    для продуктивной нагрузки?
  answer: Он не воспроизводит распределение данных, индексы, конкуренцию и объём.
    Результат эксперимента нужно интерпретировать вместе с условиями и при необходимости
    повторить на репрезентативной выборке.
  category: Проверка гипотез
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
