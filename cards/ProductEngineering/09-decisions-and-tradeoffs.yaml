- id: 3e2df875-7b28-44d6-b102-a0dabeef686a
  question: Как обнаружить, что два архитектурных варианта сравниваются по разным
    предположениям?
  answer: Сделать таблицу одинаковых критериев, входной нагрузки, требований и границ
    ответственности. Если один вариант оценивается с кешем, а другой без него, привести
    условия к сопоставимому виду.
  category: Работа с ИИ
  context: 
