  question: Когда событие в Kafka не стоит считать достаточным источником истины для
    бизнес-операции?
  answer: Когда нужны состояние, проверяемая история решения или согласованность с
    записью в БД, а событие может быть задержано, повторено или недоступно потребителю.
    Следует явно определить владельца состояния и контракт публикации.
