- id: d56d4fca-4157-4f49-acb0-6c9f4bc52fa4
  question: Что делать, если после релиза выяснилось, что ключевое допущение ADR неверно?
  answer: Зафиксировать новые данные, оценить влияние на цель и риски, пересмотреть
    решение и план изменения. ADR обновляют как историю принятого решения, не стирая
    прежние основания.
  category: Документирование
  context: 
