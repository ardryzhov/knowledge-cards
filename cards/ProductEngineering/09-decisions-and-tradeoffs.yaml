- id: 051c66c3-fd1e-4873-a489-a4a15a5ac8b3
  question: Что стоит записать в ADR по архитектурному решению?
  answer: Контекст и ограничение, рассмотренные варианты, выбранный вариант, причины,
    важные последствия и условия пересмотра. ADR помогает понять, почему решение было
    принято, когда исходные обстоятельства изменятся.
  category: Документирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8811c005-6b7b-463b-abc6-3db0456659c4
  question: Чем ADR отличается от подробного технического задания?
  answer: ADR фиксирует конкретное значимое решение и его мотивы. Техническое задание
    описывает требуемое поведение и ограничения; они могут ссылаться друг на друга,
    но отвечают на разные вопросы.
  category: Документирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 8ac9c8b7-b4f8-4161-aa17-6be72e37fad6
  question: Как действовать, если предложенная ИИ архитектура опирается на несуществующую
    возможность текущей платформы?
  answer: Проверить фактическую версию и документацию платформы, исключить неподтверждённый
    вариант и обновить сравнение. Полезно зафиксировать неверное допущение, чтобы
    оно не вернулось в следующих обсуждениях.
  category: Работа с ИИ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8584d288-0f02-4d0f-8251-fc9745995636
  question: Какие вопросы задать, если команда предлагает новое хранилище ради одной
    фичи?
  answer: Какую проблему не решает текущее хранилище, каковы требования к данным и
    нагрузке, кто будет поддерживать новое, как мигрировать и восстановиться после
    сбоя. Решение должно оправдывать эксплуатационную стоимость.
  category: Сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 68273bfe-ff0f-4aca-bb9c-eb0f66c9e4ca
  question: Как выбирать между быстрым временным решением и полноценной переработкой?
  answer: Оценить срок действия временного пути, риск отказа, обратимость, цену будущей
    переделки и влияние на пользователей. Если выбирается временный вариант, зафиксировать
    ограничения и условие его удаления.
  category: Принятие решения
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1682d1b5-85e8-4a78-95b2-119e9cfa7f61
  question: Почему требования безопасности и аудита могут изменить удобный для разработки
    архитектурный вариант?
  answer: Некоторые схемы не дают нужной прослеживаемости, разграничения прав или
    контроля передачи данных. Эти ограничения надо учесть до реализации, иначе переработка
    затронет контракты и данные.
  category: Системное мышление
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 934d3656-9bdf-4ca7-8f0d-a7312bf2c5e8
  question: Как учесть отказ внешнего провайдера модели при проектировании ИИ-функции?
  answer: Определить допустимое время ожидания, повтор, ограничение нагрузки и резервный
    пользовательский сценарий. Решение зависит от критичности функции; недоступность
    модели не должна создавать неопределённый бизнес-исход.
  category: Сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
