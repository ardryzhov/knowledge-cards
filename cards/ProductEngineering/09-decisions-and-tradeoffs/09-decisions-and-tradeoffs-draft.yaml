topic: "Решения и компромиссы"
cards:
  - question: "Почему архитектурное решение нельзя принимать только по рекомендации ИИ?"
    answer: "Модель не знает всех ограничений продукта и может убедительно предложить неподходящий вариант. Инженер должен сверить факты, оценить последствия для данных, эксплуатации и пользователей, а затем принять и зафиксировать решение."
    category: "Принятие решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие критерии стоит задать перед сравнением двух архитектурных вариантов?"
    answer: "Целевой сценарий, ограничения по надёжности, безопасности, нагрузке, срокам, стоимости и сопровождению. Критерии задают до оценки вариантов, чтобы сравнение не подстраивалось под понравившееся решение."
    category: "Принятие решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как попросить ИИ помочь сравнить варианты без фиктивного «лучшего решения»?"
    answer: "Дать одинаковые исходные условия, попросить перечислить допущения, последствия и случаи, где каждый вариант выигрывает. Затем проверить спорные факты и решить по приоритетам конкретного продукта."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если ИИ предложил паттерн Transactional Outbox для простой интеграции?"
    answer: "Проверить требование к атомарности изменения БД и публикации события, последствия потери или дубля, текущую инфраструктуру и стоимость сопровождения. Паттерн применять, когда он закрывает реальный риск, а не из-за его известности."
    category: "Сценарии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать между синхронным API и асинхронным событием для нового бизнес-действия?"
    answer: "Оценить, нужен ли вызывающему немедленный результат, допустима ли eventual consistency, как обрабатывать отказ, повтор и наблюдать операцию. Выбор делают по сценарию и контракту, а не по моде на брокер."
    category: "Сценарии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему локальная оптимизация одного сервиса может ухудшить весь пользовательский сценарий?"
    answer: "Ускорение собственного ответа может перенести очередь или нагрузку на соседний сервис и увеличить итоговое время. Нужно смотреть на путь операции целиком и связанные продуктовые и технические показатели."
    category: "Системное мышление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как оценить влияние изменения схемы БД на аналитику, тестирование и эксплуатацию?"
    answer: "Проследить потребителей данных и запросы, миграцию и период совместной работы версий, новые тестовые данные и мониторинг. Одной оценки SQL-миграции недостаточно для сквозного решения."
    category: "Системное мышление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда стоит предпочесть более простое решение, даже если ИИ предложил гибкую архитектуру?"
    answer: "Когда дополнительные компоненты не закрывают подтверждённое требование и увеличивают число отказов и стоимость сопровождения. Сохранить возможность расширения в границах разумного, но не строить её заранее без основания."
    category: "Принятие решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как оценить обратимость архитектурного решения?"
    answer: "Посмотреть, можно ли вернуть прежний код и конфигурацию, что произойдёт с уже записанными данными и внешними контрактами, сколько потребителей нужно координировать. Чем труднее откат, тем раньше нужны проверка гипотез и план миграции."
    category: "Риски"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Какие допущения нужно явно назвать перед выбором хранения нового набора данных?"
    answer: "Объём и рост, шаблоны чтения и записи, требования к консистентности, срок хранения, доступы и связь с существующей моделью. Неизвестные параметры лучше измерить или проверить на прототипе."
    category: "Принятие решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда короткий технический эксперимент полезнее долгого обсуждения вариантов с ИИ?"
    answer: "Когда ключевой спор можно измерить: например, задержку запроса на репрезентативных данных или совместимость библиотеки. Заранее задать критерий, условия эксперимента и область применимости результата."
    category: "Проверка гипотез"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему тест на маленькой пустой БД не подтверждает пригодность решения для продуктивной нагрузки?"
    answer: "Он не воспроизводит распределение данных, индексы, конкуренцию и объём. Результат эксперимента нужно интерпретировать вместе с условиями и при необходимости повторить на репрезентативной выборке."
    category: "Проверка гипотез"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что стоит записать в ADR по архитектурному решению?"
    answer: "Контекст и ограничение, рассмотренные варианты, выбранный вариант, причины, важные последствия и условия пересмотра. ADR помогает понять, почему решение было принято, когда исходные обстоятельства изменятся."
    category: "Документирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем ADR отличается от подробного технического задания?"
    answer: "ADR фиксирует конкретное значимое решение и его мотивы. Техническое задание описывает требуемое поведение и ограничения; они могут ссылаться друг на друга, но отвечают на разные вопросы."
    category: "Документирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как действовать, если предложенная ИИ архитектура опирается на несуществующую возможность текущей платформы?"
    answer: "Проверить фактическую версию и документацию платформы, исключить неподтверждённый вариант и обновить сравнение. Полезно зафиксировать неверное допущение, чтобы оно не вернулось в следующих обсуждениях."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие вопросы задать, если команда предлагает новое хранилище ради одной фичи?"
    answer: "Какую проблему не решает текущее хранилище, каковы требования к данным и нагрузке, кто будет поддерживать новое, как мигрировать и восстановиться после сбоя. Решение должно оправдывать эксплуатационную стоимость."
    category: "Сценарии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выбирать между быстрым временным решением и полноценной переработкой?"
    answer: "Оценить срок действия временного пути, риск отказа, обратимость, цену будущей переделки и влияние на пользователей. Если выбирается временный вариант, зафиксировать ограничения и условие его удаления."
    category: "Принятие решения"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему требования безопасности и аудита могут изменить удобный для разработки архитектурный вариант?"
    answer: "Некоторые схемы не дают нужной прослеживаемости, разграничения прав или контроля передачи данных. Эти ограничения надо учесть до реализации, иначе переработка затронет контракты и данные."
    category: "Системное мышление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как учесть отказ внешнего провайдера модели при проектировании ИИ-функции?"
    answer: "Определить допустимое время ожидания, повтор, ограничение нагрузки и резервный пользовательский сценарий. Решение зависит от критичности функции; недоступность модели не должна создавать неопределённый бизнес-исход."
    category: "Сценарии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда событие в Kafka не стоит считать достаточным источником истины для бизнес-операции?"
    answer: "Когда нужны состояние, проверяемая история решения или согласованность с записью в БД, а событие может быть задержано, повторено или недоступно потребителю. Следует явно определить владельца состояния и контракт публикации."
    category: "Сценарии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как обнаружить, что два архитектурных варианта сравниваются по разным предположениям?"
    answer: "Сделать таблицу одинаковых критериев, входной нагрузки, требований и границ ответственности. Если один вариант оценивается с кешем, а другой без него, привести условия к сопоставимому виду."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если после релиза выяснилось, что ключевое допущение ADR неверно?"
    answer: "Зафиксировать новые данные, оценить влияние на цель и риски, пересмотреть решение и план изменения. ADR обновляют как историю принятого решения, не стирая прежние основания."
    category: "Документирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как объяснить бизнесу архитектурный компромисс без перечня технологий?"
    answer: "Описать последствия в терминах пользовательского результата, срока, риска отказа и стоимости изменений. Например, немедленный ответ даёт удобство, но требует устойчивой работы внешней системы в момент операции."
    category: "Коммуникация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему «агент выбрал вариант» не является достаточным основанием на архитектурном ревью?"
    answer: "На ревью нужны условия, сравнение альтернатив, проверенные факты и последствия для системы. Рекомендация агента может быть входом для обсуждения, но решение принадлежит ответственным инженерам и владельцам требований."
    category: "Коммуникация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
