- id: af79afc0-fb01-49b9-a2a5-9933aa0f4e0a
  question: Почему изменение модели, промпта и кода одновременно усложняет разбор
    неудачного релиза?
  answer: Становится трудно определить источник изменения поведения. По возможности
    разделять независимые изменения или хранить точные версии и контрольные проверки
    для каждой конфигурации.
  category: Подготовка релиза
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
