- id: 749f54c0-4a02-4381-9583-b1214537625f
  question: Как спланировать откат ИИ-функции, если изменены и промпт, и схема ответа?
  answer: Проверить совместимость старого промпта и модели с текущим кодом и потребителями,
    сохранить прежние версии и тест отката. Если формат данных уже изменён, может
    понадобиться переходный адаптер или выключение функции.
  category: Откат
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7bcb2ec3-5b41-4158-b306-2cb1ff9f8092
  question: Зачем ИИ-функции нужен выключатель или резервный сценарий?
  answer: При сбое провайдера, некорректных ответах или превышении затрат можно безопасно
    остановить только ИИ-часть и сохранить допустимый основной процесс. Резервный
    путь следует заранее проверить.
  category: Откат
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 742fb445-b882-4d64-a56d-f1b85dabbf3b
  question: Что проверить сразу после релиза новой конфигурации модели?
  answer: Доступность, задержку, долю ошибок и отказов, стоимость вызовов, качество
    ответов на контрольных сценариях и влияние на пользовательский процесс. Сопоставить
    показатели с исходным уровнем и границами остановки.
  category: Наблюдение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 78ebd438-29ac-4132-b227-d13544fc825c
  question: Почему средняя задержка вызовов модели может скрыть проблему пользователей?
  answer: Длинный хвост ответов может быть значительно хуже среднего. Проверять распределение
    или высокие перцентили и задержку полного пользовательского сценария, а не только
    отдельного вызова модели.
  category: Наблюдение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
