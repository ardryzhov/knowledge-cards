- id: a3f6a9e1-b986-44b4-968e-324c784853db
  question: Какие версии следует зафиксировать для воспроизводимости ИИ-функции?
  answer: Версии кода, промпта, модели или провайдера, конфигурации инструментов и
    схемы входных данных. Без этого трудно объяснить, почему один и тот же сценарий
    изменил поведение после релиза.
  category: Подготовка релиза
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3133754f-8605-4f83-a892-da04db0cc229
  question: Что проверить перед выпуском фичи, в которой агент может вызывать внешние
    инструменты?
  answer: Проверить разрешённые инструменты и права, типовые и ошибочные сценарии,
    ограничения данных, задержку, стоимость и поведение при недоступности зависимостей.
    Проверки должны соответствовать риску действия.
  category: Подготовка релиза
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 8ba2238f-1b2d-40d7-9e53-0110af059ff4
  question: Почему зелёный CI не гарантирует готовность ИИ-функции к релизу?
  answer: CI обычно проверяет заданные автоматические свойства, но может не обнаружить
    ухудшение качества ответов, рост стоимости или неверный выбор инструмента. Нужны
    профильный проверочный набор и план наблюдения.
  category: Подготовка релиза
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f868eac2-dd89-483f-a0ce-2226740eb0a4
  question: Как безопасно выпускать новое поведение ИИ-функции на часть пользователей?
  answer: Использовать управляемое включение или постепенное расширение аудитории,
    заранее задать метрики качества и ограничения. При ухудшении остановить расширение
    и вернуть прежнюю конфигурацию.
  category: Развёртывание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d10c5139-9b7b-49cf-93a6-21c93d4aee87
  question: Почему для canary-выпуска ИИ-функции надо сравнивать сопоставимые группы?
  answer: Иначе различия в типах запросов и пользователей могут выглядеть как изменение
    качества модели. Сегменты, период и способ расчёта метрик должны быть определены
    заранее.
  category: Развёртывание
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5e5b0073-4926-4f30-8242-a06ffc11ba15
  question: Что делать, если новая версия модели отвечает быстрее, но чаще ошибается
    на редких банковских сценариях?
  answer: Не принимать решение только по средней задержке. Проверить критичные сценарии
    и ограничивающую метрику ошибок; при недопустимом ухудшении остановить выпуск
    или выбрать другую конфигурацию.
  category: Развёртывание
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
