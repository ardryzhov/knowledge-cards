- id: 25924452-d329-4ea2-96e7-8d9c1b1a3106
  question: Когда можно считать релиз ИИ-функции успешным?
  answer: Когда изменение доступно, ключевые сценарии дают приемлемый результат, ограничивающие
    метрики соблюдены и есть данные наблюдения за согласованный период. Само успешное
    развёртывание показывает лишь технический этап.
