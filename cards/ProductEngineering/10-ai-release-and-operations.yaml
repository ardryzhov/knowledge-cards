- id: b2da3ab9-956b-4a0b-acb1-5e41edec1e29
  question: Почему изменение промпта или версии модели нужно выпускать как управляемое
    изменение?
  answer: Оно может изменить ответы без правки обычного кода. Нужны версия конфигурации,
    профильные проверки, наблюдение после выпуска и способ вернуть предыдущий вариант.
  category: Подготовка релиза
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
