- id: d2f6ade6-2404-4e12-8a3f-b10f197ddf5c
  question: Какие данные нужны для диагностики неудачного ответа ИИ-функции?
  answer: Безопасно записанные версия промпта и модели, категория запроса, выбранные
    инструменты, статусы вызовов, длительность и итоговая оценка. Содержимое запросов
    и ответов хранить только по разрешённым правилам.
  category: Наблюдение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a0c2d078-f6d2-4fd2-9c51-d3982ff93cea
  question: Как различить сбой провайдера модели и ошибку собственной интеграции?
  answer: Сопоставить сетевой статус и время ответа провайдера с логами клиента, конфигурацией,
    лимитами и трассой вызова. Воспроизвести безопасный контрольный запрос и проверить,
    возникает ли ошибка до вызова, во время него или после обработки ответа.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2ba7827d-be00-41c2-8281-63eb7527c36d
  question: Что делать, если после релиза выросла доля невалидных JSON-ответов модели?
  answer: Остановить расширение, проверить версию промпта, схемы и обработчика, собрать
    обезличенные примеры отказов. Усилить валидацию и безопасное поведение при ошибке,
    затем повторить профильные проверки.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4a733d46-a2a0-4f8d-b5ea-24f2a308cecd
  question: Как действовать, если агент во время инцидента предлагает выполнить опасную
    команду восстановления?
  answer: Проверить команду, объект воздействия, основания и обратимость по runbook
    и текущему состоянию системы. Выполнять только разрешённое действие с нужным контролем;
    рекомендации агента не заменяют процедуру инцидента.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 5e5d36e6-edf1-4832-9439-15016b9815e5
  question: Что должно быть в runbook для сбоя ИИ-функции?
  answer: Признаки и алерты, способы проверить зависимости и версии, безопасное отключение
    или переключение, шаги восстановления и критерии окончания инцидента. Должен быть
    указан ответственный за решение.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ff514e56-5c84-41be-9e63-cefb149e1109
  question: Как сообщить о сбое ИИ-функции, если основной API возвращает HTTP 200?
  answer: 'Описать пользовательский симптом и бизнес-влияние: например, ответ создан,
    но неверно классифицирует заявки. Приложить показатели качества и трассы, не ограничиваясь
    доступностью API.'
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b23f814b-c1df-4b95-8a3e-1d42fc15b464
  question: Почему рост числа повторов вызовов модели может ухудшить инцидент?
  answer: Повторы увеличивают нагрузку, стоимость и задержку, а при общем лимите провайдера
    могут усилить отказ. Нужны ограничение повторов, паузы и возможность переключиться
    на резервный сценарий.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7963e7bc-d47b-47b5-b820-b3e313c46da7
  question: Что делать при резком росте стоимости вызовов ИИ после релиза?
  answer: Проверить объём вызовов, размер входа и выхода, повторы, выбранную модель
    и аномальные запросы. Остановить нецелевое потребление или вернуть конфигурацию,
    затем устранить причину и пересчитать эффект.
  category: Стоимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bc6fdbdf-7a4a-4f8d-b591-33e57727a268
  question: Как действовать, если провайдер модели изменил поведение без изменения
    вашего кода?
  answer: Сверить фактическую версию и изменения провайдера, повторить контрольный
    набор, оценить влияние на контракт и пользователей. При ухудшении переключить
    конфигурацию или резервный путь и зафиксировать внешнюю зависимость.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 02c81d4c-f469-4c97-8230-7ed4b7b17abc
  question: Почему нельзя автоматически отправлять полные пользовательские запросы
    в систему мониторинга ради диагностики?
  answer: Они могут содержать персональные или финансовые данные. Нужны разрешённые
    правила хранения, минимальный набор полей, маскирование и контроль доступа к трассам.
  category: Наблюдение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 81e3f9bd-ca5b-40d1-971e-e646559e18ae
  question: Что проверить перед закрытием инцидента после отката ИИ-функции?
  answer: Что проблемная версия выключена, основной пользовательский сценарий снова
    работает, метрики вернулись в допустимые границы и не осталось операций в неопределённом
    состоянии. Затем зафиксировать причину и дальнейшие действия.
  category: Инциденты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 02a50f55-b411-4d27-abef-ced9f016f733
  question: Как использовать ИИ для поиска причины инцидента, не превращая его гипотезу
    в факт?
  answer: Дать безопасные логи и симптомы, попросить несколько проверяемых гипотез
    и ранжировать их по наблюдениям. Подтверждать причину метриками, трассами или
    воспроизводимым тестом до исправления.
  category: Работа с ИИ
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
