topic: "Релиз и сопровождение с ИИ"
cards:
  - question: "Почему изменение промпта или версии модели нужно выпускать как управляемое изменение?"
    answer: "Оно может изменить ответы без правки обычного кода. Нужны версия конфигурации, профильные проверки, наблюдение после выпуска и способ вернуть предыдущий вариант."
    category: "Подготовка релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие версии следует зафиксировать для воспроизводимости ИИ-функции?"
    answer: "Версии кода, промпта, модели или провайдера, конфигурации инструментов и схемы входных данных. Без этого трудно объяснить, почему один и тот же сценарий изменил поведение после релиза."
    category: "Подготовка релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить перед выпуском фичи, в которой агент может вызывать внешние инструменты?"
    answer: "Проверить разрешённые инструменты и права, типовые и ошибочные сценарии, ограничения данных, задержку, стоимость и поведение при недоступности зависимостей. Проверки должны соответствовать риску действия."
    category: "Подготовка релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему зелёный CI не гарантирует готовность ИИ-функции к релизу?"
    answer: "CI обычно проверяет заданные автоматические свойства, но может не обнаружить ухудшение качества ответов, рост стоимости или неверный выбор инструмента. Нужны профильный проверочный набор и план наблюдения."
    category: "Подготовка релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как безопасно выпускать новое поведение ИИ-функции на часть пользователей?"
    answer: "Использовать управляемое включение или постепенное расширение аудитории, заранее задать метрики качества и ограничения. При ухудшении остановить расширение и вернуть прежнюю конфигурацию."
    category: "Развёртывание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему для canary-выпуска ИИ-функции надо сравнивать сопоставимые группы?"
    answer: "Иначе различия в типах запросов и пользователей могут выглядеть как изменение качества модели. Сегменты, период и способ расчёта метрик должны быть определены заранее."
    category: "Развёртывание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если новая версия модели отвечает быстрее, но чаще ошибается на редких банковских сценариях?"
    answer: "Не принимать решение только по средней задержке. Проверить критичные сценарии и ограничивающую метрику ошибок; при недопустимом ухудшении остановить выпуск или выбрать другую конфигурацию."
    category: "Развёртывание"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как спланировать откат ИИ-функции, если изменены и промпт, и схема ответа?"
    answer: "Проверить совместимость старого промпта и модели с текущим кодом и потребителями, сохранить прежние версии и тест отката. Если формат данных уже изменён, может понадобиться переходный адаптер или выключение функции."
    category: "Откат"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Зачем ИИ-функции нужен выключатель или резервный сценарий?"
    answer: "При сбое провайдера, некорректных ответах или превышении затрат можно безопасно остановить только ИИ-часть и сохранить допустимый основной процесс. Резервный путь следует заранее проверить."
    category: "Откат"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить сразу после релиза новой конфигурации модели?"
    answer: "Доступность, задержку, долю ошибок и отказов, стоимость вызовов, качество ответов на контрольных сценариях и влияние на пользовательский процесс. Сопоставить показатели с исходным уровнем и границами остановки."
    category: "Наблюдение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему средняя задержка вызовов модели может скрыть проблему пользователей?"
    answer: "Длинный хвост ответов может быть значительно хуже среднего. Проверять распределение или высокие перцентили и задержку полного пользовательского сценария, а не только отдельного вызова модели."
    category: "Наблюдение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие данные нужны для диагностики неудачного ответа ИИ-функции?"
    answer: "Безопасно записанные версия промпта и модели, категория запроса, выбранные инструменты, статусы вызовов, длительность и итоговая оценка. Содержимое запросов и ответов хранить только по разрешённым правилам."
    category: "Наблюдение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как различить сбой провайдера модели и ошибку собственной интеграции?"
    answer: "Сопоставить сетевой статус и время ответа провайдера с логами клиента, конфигурацией, лимитами и трассой вызова. Воспроизвести безопасный контрольный запрос и проверить, возникает ли ошибка до вызова, во время него или после обработки ответа."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если после релиза выросла доля невалидных JSON-ответов модели?"
    answer: "Остановить расширение, проверить версию промпта, схемы и обработчика, собрать обезличенные примеры отказов. Усилить валидацию и безопасное поведение при ошибке, затем повторить профильные проверки."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если агент во время инцидента предлагает выполнить опасную команду восстановления?"
    answer: "Проверить команду, объект воздействия, основания и обратимость по runbook и текущему состоянию системы. Выполнять только разрешённое действие с нужным контролем; рекомендации агента не заменяют процедуру инцидента."
    category: "Инциденты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что должно быть в runbook для сбоя ИИ-функции?"
    answer: "Признаки и алерты, способы проверить зависимости и версии, безопасное отключение или переключение, шаги восстановления и критерии окончания инцидента. Должен быть указан ответственный за решение."
    category: "Инциденты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как сообщить о сбое ИИ-функции, если основной API возвращает HTTP 200?"
    answer: "Описать пользовательский симптом и бизнес-влияние: например, ответ создан, но неверно классифицирует заявки. Приложить показатели качества и трассы, не ограничиваясь доступностью API."
    category: "Инциденты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему рост числа повторов вызовов модели может ухудшить инцидент?"
    answer: "Повторы увеличивают нагрузку, стоимость и задержку, а при общем лимите провайдера могут усилить отказ. Нужны ограничение повторов, паузы и возможность переключиться на резервный сценарий."
    category: "Инциденты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать при резком росте стоимости вызовов ИИ после релиза?"
    answer: "Проверить объём вызовов, размер входа и выхода, повторы, выбранную модель и аномальные запросы. Остановить нецелевое потребление или вернуть конфигурацию, затем устранить причину и пересчитать эффект."
    category: "Стоимость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как действовать, если провайдер модели изменил поведение без изменения вашего кода?"
    answer: "Сверить фактическую версию и изменения провайдера, повторить контрольный набор, оценить влияние на контракт и пользователей. При ухудшении переключить конфигурацию или резервный путь и зафиксировать внешнюю зависимость."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему нельзя автоматически отправлять полные пользовательские запросы в систему мониторинга ради диагностики?"
    answer: "Они могут содержать персональные или финансовые данные. Нужны разрешённые правила хранения, минимальный набор полей, маскирование и контроль доступа к трассам."
    category: "Наблюдение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить перед закрытием инцидента после отката ИИ-функции?"
    answer: "Что проблемная версия выключена, основной пользовательский сценарий снова работает, метрики вернулись в допустимые границы и не осталось операций в неопределённом состоянии. Затем зафиксировать причину и дальнейшие действия."
    category: "Инциденты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как использовать ИИ для поиска причины инцидента, не превращая его гипотезу в факт?"
    answer: "Дать безопасные логи и симптомы, попросить несколько проверяемых гипотез и ранжировать их по наблюдениям. Подтверждать причину метриками, трассами или воспроизводимым тестом до исправления."
    category: "Работа с ИИ"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему изменение модели, промпта и кода одновременно усложняет разбор неудачного релиза?"
    answer: "Становится трудно определить источник изменения поведения. По возможности разделять независимые изменения или хранить точные версии и контрольные проверки для каждой конфигурации."
    category: "Подготовка релиза"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда можно считать релиз ИИ-функции успешным?"
    answer: "Когда изменение доступно, ключевые сценарии дают приемлемый результат, ограничивающие метрики соблюдены и есть данные наблюдения за согласованный период. Само успешное развёртывание показывает лишь технический этап."
    category: "Наблюдение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
