- id: 5015d4ae-068f-4fc6-a20f-b04083bf88c7
  question: Почему простое сравнение средней скорости команды до и после внедрения
    ИИ может вводить в заблуждение?
  answer: На неё влияют сезонность, опыт команды, очередь согласований и сложность
    задач. Нужно учитывать эти факторы и показывать границы уверенности в выводе.
  category: Сравнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
