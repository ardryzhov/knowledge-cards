topic: Оценка пользы ИИ-процесса
cards:
- id: 3f558337-c170-4fc3-a2ea-ab2ce48d7f07
  question: Почему число запросов к ИИ не показывает пользу агентного процесса?
  answer: 'Оно измеряет активность, а не завершённые качественные задачи. Пользу оценивают
    по результату: времени до принятого изменения, качеству, объёму доработок и совокупной
    стоимости.'
  category: Цель измерения
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 60c24543-b3e8-45fc-8ffb-e4f3d809d36a
  question: Как определить единицу результата для оценки ИИ в разработке?
  answer: Выбрать проверяемый исход, например принятую и выпущенную задачу заданного
    класса, а не отдельный ответ модели. Для каждого класса задач зафиксировать критерии
    готовности и исключения.
  category: Цель измерения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f793c720-6ccc-4ade-944f-d02fd6dd4117
  question: Какие показатели полезно измерять при сравнении работы с ИИ и без него?
  answer: Время от начала до принятого результата, качество и дефекты, время ревью
    и доработок, стоимость модели и инфраструктуры. Сравнивать сопоставимые классы
    задач при одинаковом критерии готовности.
  category: Набор метрик
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4baa96bf-a2a5-4ad6-ae6c-8c2f5dbb448e
  question: Почему сокращение времени написания кода не означает ускорение доставки
    фичи?
  answer: Выигрыш может исчезнуть на уточнении требований, ревью, исправлении тестов
    и релизе. Нужно измерять полный путь задачи или хотя бы все затронутые этапы.
  category: Набор метрик
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bef1c23c-193e-4852-bc75-e25afe896c42
  question: Как учесть скрытую стоимость ИИ-помощи?
  answer: Добавить время подготовки контекста, проверки, исправления и поддержки окружения,
    а также стоимость вызовов и инструментов. Сравнивать стоимость принятого результата,
    а не только цену токенов.
  category: Стоимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1b244798-c7af-4093-af38-39bf31d09376
  question: Почему стоимость одного вызова модели плохо подходит для оценки экономичности
    решения?
  answer: Дешёвый вызов может требовать много повторов и ручного исправления. Полезнее
    считать полную стоимость выполненной и принятой задачи при сопоставимом качестве.
  category: Стоимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 380e7671-1d54-471d-8717-66801fc3c455
  question: Как проверить, что ИИ снизил время выполнения задачи, а не изменился состав
    задач?
  answer: Разделить задачи по типу и сложности, сравнить сопоставимые группы или повторяемый
    набор сценариев. Зафиксировать период, участников и изменения процесса, которые
    могли повлиять на время.
  category: Сравнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
