- id: 1caa77b0-3bb9-4096-9fdd-b5d21d188b7a
  question: Как выбрать базовый уровень для оценки нового агентного workflow?
  answer: Измерить текущий способ выполнения того же класса задач по времени, качеству
    и затратам до внедрения. Зафиксировать определения метрик и критерий завершения,
    чтобы сравнение было честным.
  category: Сравнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a143b2c7-970b-4ecc-b50e-e039cc389923
  question: Какие ограничивающие метрики нужны, если цель — ускорить разработку с
    ИИ?
  answer: Например, доля дефектов после релиза, регрессии контрактов, трудозатраты
    на ревью, нарушения правил безопасности и число возвратов задачи. Ускорение не
    должно ухудшать эти показатели сверх допустимых границ.
  category: Набор метрик
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 72de8004-11c9-40f5-9097-b77e99b9e7da
  question: Что показывает доля задач, которые пришлось существенно переделывать после
    ИИ?
  answer: Она сигнализирует о качестве постановки, генерации или проверки. Важно отдельно
    определить «существенную переделку» и анализировать причины, иначе метрика смешает
    обычные изменения требований с ошибками агента.
  category: Набор метрик
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bfdc343c-c967-4ecf-9a8b-2df2117b83ea
  question: Как оценить качество агентного процесса, если многие задачи уникальны?
  answer: 'Использовать несколько типов доказательств: повторяемые проверочные случаи,
    выборочный разбор реальных задач, дефекты и время до принятия результата. Не делать
    вывод по одному среднему числу на малой неоднородной выборке.'
  category: Сравнение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
