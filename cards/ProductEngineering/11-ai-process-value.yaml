- id: bc9459ee-8dcd-44e7-9a30-ceabc9498586
  question: Почему высокий процент использования ИИ командой не равен успешному внедрению?
  answer: Люди могут пользоваться агентом часто, но тратить больше времени на исправления
    или не улучшать доставку. Adoption полезен как показатель внедрения, но результат
    и качество измеряют отдельно.
  category: Интерпретация
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 5daefb67-14a4-4723-be96-6a928a6fea9a
  question: Как понять, на каком этапе агентный процесс теряет больше всего времени?
  answer: Разделить путь задачи на подготовку контекста, работу агента, ожидания,
    ревью, исправления и выпуск. Сопоставить длительности и причины задержек с базовым
    процессом.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3b0adb05-aef5-4525-a6dc-6a8af24cdacf
  question: Что делать, если ИИ ускорил простые задачи, но замедлил сложные?
  answer: Проверить результаты по классам задач, найти причины замедления и ограничить
    применение агента там, где он пока полезен. Для сложных задач изменить контекст,
    инструменты или способ проверки и повторно измерить.
  category: Интерпретация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: a4b1f304-08cf-4263-be13-e831b6534785
  question: Как использовать трассы агентных запусков для улучшения процесса?
  answer: Найти повторяющиеся ошибки выбора инструмента, циклы, потерю контекста и
    лишние шаги. Сформулировать конкретное изменение окружения и проверить его на
    тех же типах задач.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0233d6c5-95a6-468b-be8d-f2f0b533705e
  question: Почему нельзя оптимизировать агентный процесс только по количеству закрытых
    задач?
  answer: Метрику можно улучшить дроблением задач или снижением планки проверки. Нужны
    единое определение завершения, поправка на сложность и ограничивающие показатели
    качества.
  category: Интерпретация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 590f245c-268d-4797-9667-05333fa7a94f
  question: Как проверить, что новый промпт или skill действительно улучшил процесс?
  answer: Зафиксировать версию, прогнать одинаковый набор характерных задач и сравнить
    качество, время и стоимость с предыдущей версией. Проверить, не ухудшились ли
    граничные и рискованные сценарии.
  category: Проверка изменений
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6ac58422-94d2-43f8-8b66-3afbe7a79767
  question: Что делать, если после изменения модели качество выросло, но затраты стали
    заметно выше?
  answer: Посчитать стоимость принятого результата и ценность улучшения для целевых
    задач. Возможно, сильную модель стоит оставить только для сложных сценариев, а
    остальные направлять на более экономичный вариант.
  category: Стоимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: a11489ad-8065-4c79-a0f1-369132bca9fe
  question: Когда результаты небольшого эксперимента с ИИ нельзя переносить на всю
    команду?
  answer: Когда выборка мала или не включает типичные роли, репозитории, сложности
    и требования безопасности. Сначала проверить переносимость на нескольких реальных
    сценариях и описать ограничения вывода.
  category: Масштабирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f0a9adda-c998-457f-9e95-0be2275637df
  question: Как заметить, что метрика качества ИИ улучшается только потому, что команда
    подстроилась под тестовый набор?
  answer: Сравнивать с новыми и отложенными случаями из реальной работы, обновлять
    набор на основе отказов и не использовать единственный известный набор как весь
    критерий. Проверять пользовательский результат отдельно.
  category: Проверка изменений
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 28ebfb8e-e55d-4df3-975d-c1b5fa72ff5a
  question: Какие данные нужны для отчёта о пользе ИИ-процесса руководителю?
  answer: Цель внедрения, классы задач и объём выборки, базовый и новый результат
    по времени, качеству и стоимости, ограничения сравнения и решение о дальнейшем
    применении. Сырые счётчики вызовов без контекста малоинформативны.
  category: Коммуникация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 250cb9eb-b7b9-4e8d-a62a-c7510f2758a2
  question: Почему отрицательный результат пилота с агентом тоже полезен?
  answer: 'Он показывает границы применимости или проблему процесса: недостаточный
    контекст, высокую стоимость ревью либо неподходящий класс задач. Зафиксированные
    причины позволяют изменить подход или отказаться от автоматизации.'
  category: Интерпретация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 221d6448-8885-472b-8826-38ba32bdbf07
  question: Как решать, стоит ли масштабировать агентный workflow на другие команды?
  answer: Нужны подтверждённая польза на сопоставимых задачах, соблюдение ограничений
    качества и безопасности, переносимые инструкции и понятная стоимость сопровождения.
    При переносе повторить измерения в новом контексте.
  category: Масштабирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1ccd489c-553e-4e4e-b3bf-4af0b60a5d17
  question: Что пересмотреть, если агентный процесс сначала ускорял задачи, а через
    месяц эффект пропал?
  answer: Проверить изменения состава задач, модели, инструкций, инструментов, нагрузки
    на ревью и базового процесса. Сравнить трассы и метрики по периодам, затем исправить
    подтверждённую причину и заново оценить эффект.
