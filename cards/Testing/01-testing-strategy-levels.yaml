- id: 7dfb8a65-61c7-42a3-ad93-4296a081465c
  question: Чем тестирование отличается от отладки?
  answer: Тестирование выявляет несоответствие ожидаемому поведению и даёт информацию
    о качестве; отладка ищет причину конкретного дефекта и исправляет код.
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 005dc79a-3a1e-4f84-8f9d-2229354ff2b4
  question: Что такое тестовый оракул?
  answer: 'Источник ожидаемого результата: требование, бизнес-правило, инвариант,
    эталонный расчёт или независимая система. Без оракула тест может проверять лишь
    отсутствие исключения.'
  category: Основы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3270d7ab-5d9e-4196-b97d-3afc1b6f3df3
  question: Чем unit-тест отличается от интеграционного?
  answer: Unit-тест проверяет небольшую единицу поведения с контролируемыми зависимостями;
    интеграционный проверяет взаимодействие компонентов или инфраструктуры. Граница
    определяется тестируемым риском, а не одной аннотацией.
  category: Уровни
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a45708b7-5b06-46a4-8f05-3d3dbe0d9469
  question: Что проверяет E2E-тест?
  answer: Полный пользовательский или бизнес-сценарий через значимые реальные компоненты
    системы. Он выявляет сбои связей, но обычно медленнее и труднее диагностируется.
  category: Уровни
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 3f12dd6d-ff3c-4359-ac8b-9d1177877c54
  question: Что означает пирамида тестирования?
  answer: Обычно много быстрых проверок на нижних уровнях и меньше дорогих сквозных
    сценариев; это ориентир для стоимости обратной связи, а не фиксированная пропорция.
  category: Стратегия
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 676bcd48-e2e4-4e81-ac76-cb0fb70694a6
  question: Почему 100% unit-покрытие не доказывает работоспособность сервиса?
  answer: Unit-тесты могут не обнаружить неверную конфигурацию, SQL, сериализацию,
    сетевые ошибки и несовместимый контракт. Нужны проверки рисков на других уровнях.
  category: Покрытие
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 108d4a8c-78f1-4161-831c-dfc8e55f46a3
  question: Как выбрать уровень теста для нового бизнес-правила?
  answer: Чистую логику проверить unit-тестом; SQL и транзакции — интеграционно; важный
    полный сценарий — E2E. Не дублировать все комбинации на каждом уровне.
  category: Выбор теста
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 3f42b585-5316-4f56-9fa4-dbe7fdd4be7c
  question: Когда интеграционный тест полезнее набора мокированных unit-тестов?
  answer: 'Когда главный риск находится на границе: JPA-маппинг, транзакции, сериализация,
    брокер или внешний контракт. Моки не подтверждают работу реальной интеграции.'
  category: Выбор теста
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 468b331b-edda-4657-b83a-48684c364594
  question: Как расставить приоритеты тестирования при нехватке времени?
  answer: Оценить вероятность дефекта и последствия, частоту использования, новые
    и изменённые границы, историю сбоев. Критические сценарии и рисковые интеграции
    проверяют первыми.
  category: Риски
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ceb69bfc-3e06-4fc2-82ce-f05a93dddca0
  question: Что такое regression testing?
  answer: Проверка, что изменение не сломало ранее работавшее поведение. Набор выбирают
    по области влияния и риску, а не автоматически запускают всё вручную.
  category: Виды проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: fba06ef0-822c-4c19-84fb-07868ab0ce4b
  question: Чем smoke test отличается от полного регресса?
  answer: Smoke быстро подтверждает работоспособность ключевых путей сборки или среды;
    регресс глубже проверяет прежнее поведение после изменений.
  category: Виды проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: e77478dc-a4a8-465c-86b8-0173408c4ac6
  question: Когда нужен exploratory testing?
  answer: Когда сценарии неполны, поведение новое или есть подозрение на неописанные
    риски. Исследовательская проверка одновременно изучает продукт, проектирует и
    выполняет тесты с фиксацией находок.
  category: Виды проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 99895f5c-ca2f-423e-9ba5-c07b92a66fd5
  question: Почему тестирование стоит начинать до написания кода?
  answer: Ранний разбор требований и критериев выявляет неоднозначность и пропущенные
    ошибки дешевле, чем после реализации.
