  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d6f01c4c-ad89-4d3e-aaae-d88a6124e086
  question: Зачем тестировать отрицательные сценарии?
  answer: Ошибочный вход, отсутствие прав, таймаут или повтор часто выявляют незащищённые
    ветви и нарушения инвариантов, которых нет в happy path.
