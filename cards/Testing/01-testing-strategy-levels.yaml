- id: 4397df61-b740-44c0-ab59-71602fb2c293
  question: Почему тест, который проверяет только отсутствие исключения, часто слаб?
  answer: Он не подтверждает бизнес-результат или побочные эффекты. Нужны наблюдаемые
    assertions и проверка важных инвариантов.
  category: Качество теста
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 6d249752-fe61-468a-ab3e-d302769055d7
  question: Что означает детерминированность автотеста?
  answer: При одинаковых входах и контролируемых условиях он даёт один результат.
    Время, конкуренция, сеть и общие данные могут нарушать это свойство.
  category: Качество теста
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 82cce9e5-358c-40ba-9929-5f77e567610f
  question: Как отличить дефект продукта от ошибки теста или окружения?
  answer: Воспроизвести симптом, проверить ожидаемый результат, логи, данные и версии
    компонентов; сравнить запуск локально и в CI.
