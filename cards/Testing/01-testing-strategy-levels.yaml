- id: 64944201-541c-43f3-9663-ee6f38135115
  question: Как избежать повторения одних и тех же проверок на всех уровнях?
  answer: 'Назначить каждому уровню свой риск: unit — варианты правил, integration
    — реальные границы, E2E — ключевой путь. Дублировать только там, где есть отдельная
    цель.'
  category: Стратегия
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b9c2ad56-b92c-4f1e-818e-4cab8636fc63
  question: Что делать, если E2E-тесты нестабильны и тормозят релизы?
  answer: Измерить источники нестабильности, перенести часть проверок ниже, изолировать
    данные и исправить ожидания. Просто отключить suite без оценки риска нельзя.
  category: Стратегия
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ebc21842-9876-4cca-bfd0-a49daeebd4ff
  question: Как определить, какие проверки должны блокировать merge?
  answer: Выбрать быстрые и надёжные тесты критичных сценариев и контрактов; тяжёлые
    проверки запускать на подходящем этапе с явным решением по их результату.
  category: Quality gate
