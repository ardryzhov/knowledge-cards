- id: fa3dee54-be9c-4120-8a8b-193aab0cc1e7
  question: Что такое testability и как разработчик может её улучшить?
  answer: Способность системы давать управляемый вход и наблюдаемый результат. Помогают
    явные зависимости, стабильные идентификаторы, диагностические логи и возможность
    создать тестовые данные.
  category: Дизайн
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
