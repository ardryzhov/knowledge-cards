  code: 
- id: 57e87ca5-a017-446c-8f51-966a3e286b9c
  question: Чем функциональное тестирование отличается от нефункционального?
  answer: Первое проверяет поведение и бизнес-правила; второе — свойства вроде задержки,
    надёжности и безопасности при заданных условиях. Один сценарий может давать данные
    для обоих.
