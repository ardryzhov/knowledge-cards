topic: "Стратегия и уровни тестирования"
cards:
  - question: "Чем тестирование отличается от отладки?"
    answer: "Тестирование выявляет несоответствие ожидаемому поведению и даёт информацию о качестве; отладка ищет причину конкретного дефекта и исправляет код."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что такое тестовый оракул?"
    answer: "Источник ожидаемого результата: требование, бизнес-правило, инвариант, эталонный расчёт или независимая система. Без оракула тест может проверять лишь отсутствие исключения."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем unit-тест отличается от интеграционного?"
    answer: "Unit-тест проверяет небольшую единицу поведения с контролируемыми зависимостями; интеграционный проверяет взаимодействие компонентов или инфраструктуры. Граница определяется тестируемым риском, а не одной аннотацией."
    category: "Уровни"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что проверяет E2E-тест?"
    answer: "Полный пользовательский или бизнес-сценарий через значимые реальные компоненты системы. Он выявляет сбои связей, но обычно медленнее и труднее диагностируется."
    category: "Уровни"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что означает пирамида тестирования?"
    answer: "Обычно много быстрых проверок на нижних уровнях и меньше дорогих сквозных сценариев; это ориентир для стоимости обратной связи, а не фиксированная пропорция."
    category: "Стратегия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему 100% unit-покрытие не доказывает работоспособность сервиса?"
    answer: "Unit-тесты могут не обнаружить неверную конфигурацию, SQL, сериализацию, сетевые ошибки и несовместимый контракт. Нужны проверки рисков на других уровнях."
    category: "Покрытие"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как выбрать уровень теста для нового бизнес-правила?"
    answer: "Чистую логику проверить unit-тестом; SQL и транзакции — интеграционно; важный полный сценарий — E2E. Не дублировать все комбинации на каждом уровне."
    category: "Выбор теста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Когда интеграционный тест полезнее набора мокированных unit-тестов?"
    answer: "Когда главный риск находится на границе: JPA-маппинг, транзакции, сериализация, брокер или внешний контракт. Моки не подтверждают работу реальной интеграции."
    category: "Выбор теста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как расставить приоритеты тестирования при нехватке времени?"
    answer: "Оценить вероятность дефекта и последствия, частоту использования, новые и изменённые границы, историю сбоев. Критические сценарии и рисковые интеграции проверяют первыми."
    category: "Риски"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое regression testing?"
    answer: "Проверка, что изменение не сломало ранее работавшее поведение. Набор выбирают по области влияния и риску, а не автоматически запускают всё вручную."
    category: "Виды проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем smoke test отличается от полного регресса?"
    answer: "Smoke быстро подтверждает работоспособность ключевых путей сборки или среды; регресс глубже проверяет прежнее поведение после изменений."
    category: "Виды проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда нужен exploratory testing?"
    answer: "Когда сценарии неполны, поведение новое или есть подозрение на неописанные риски. Исследовательская проверка одновременно изучает продукт, проектирует и выполняет тесты с фиксацией находок."
    category: "Виды проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему тестирование стоит начинать до написания кода?"
    answer: "Ранний разбор требований и критериев выявляет неоднозначность и пропущенные ошибки дешевле, чем после реализации."
    category: "Shift-left"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое testability и как разработчик может её улучшить?"
    answer: "Способность системы давать управляемый вход и наблюдаемый результат. Помогают явные зависимости, стабильные идентификаторы, диагностические логи и возможность создать тестовые данные."
    category: "Дизайн"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему тест, который проверяет только отсутствие исключения, часто слаб?"
    answer: "Он не подтверждает бизнес-результат или побочные эффекты. Нужны наблюдаемые assertions и проверка важных инвариантов."
    category: "Качество теста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что означает детерминированность автотеста?"
    answer: "При одинаковых входах и контролируемых условиях он даёт один результат. Время, конкуренция, сеть и общие данные могут нарушать это свойство."
    category: "Качество теста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличить дефект продукта от ошибки теста или окружения?"
    answer: "Воспроизвести симптом, проверить ожидаемый результат, логи, данные и версии компонентов; сравнить запуск локально и в CI."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем тестировать отрицательные сценарии?"
    answer: "Ошибочный вход, отсутствие прав, таймаут или повтор часто выявляют незащищённые ветви и нарушения инвариантов, которых нет в happy path."
    category: "Покрытие"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем функциональное тестирование отличается от нефункционального?"
    answer: "Первое проверяет поведение и бизнес-правила; второе — свойства вроде задержки, надёжности и безопасности при заданных условиях. Один сценарий может давать данные для обоих."
    category: "Основы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что такое риск-ориентированная стратегия тестирования?"
    answer: "Выбор глубины, методов и уровня проверок по вероятности и последствиям отказа, с явным учётом времени и ресурсов команды."
    category: "Риски"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как избежать повторения одних и тех же проверок на всех уровнях?"
    answer: "Назначить каждому уровню свой риск: unit — варианты правил, integration — реальные границы, E2E — ключевой путь. Дублировать только там, где есть отдельная цель."
    category: "Стратегия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если E2E-тесты нестабильны и тормозят релизы?"
    answer: "Измерить источники нестабильности, перенести часть проверок ниже, изолировать данные и исправить ожидания. Просто отключить suite без оценки риска нельзя."
    category: "Стратегия"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как определить, какие проверки должны блокировать merge?"
    answer: "Выбрать быстрые и надёжные тесты критичных сценариев и контрактов; тяжёлые проверки запускать на подходящем этапе с явным решением по их результату."
    category: "Quality gate"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему тестовая стратегия должна учитывать конкретный стек Kafka/PostgreSQL?"
    answer: "Здесь риски включают транзакции, дубли и порядок сообщений, миграции и совместимость схем. Чистые unit-тесты этих границ не проверят."
    category: "Стек"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

