- id: 7a8f0b6c-739a-4148-8d60-2390f630b969
  question: Какие значения проверить для диапазона 18–65 включительно?
  answer: Как минимум 17, 18, 19, 64, 65, 66; дополнительно минимум и максимум типа
    или отсутствие значения, если это риск сценария.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
