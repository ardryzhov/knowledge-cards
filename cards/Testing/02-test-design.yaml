- id: d011c7db-1cbe-47eb-9eed-4544d8d8c23d
  question: Когда таблица решений полезнее списка отдельных тест-кейсов?
  answer: Когда результат зависит от нескольких условий, комбинации которых трудно
    удержать в тексте. Таблица выявляет пропущенные и противоречивые правила.
  category: Таблицы решений
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1ba5504f-b55b-4dba-b230-027c6beb5c61
  question: Как уменьшать таблицу решений без потери важных случаев?
  answer: Найти невозможные комбинации, объединить одинаковые исходы и отметить don't
    care только там, где условие действительно не влияет. Обоснование сокращения должно
    быть явным.
  category: Таблицы решений
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: be659156-80f1-43bd-bcb3-9553e207e444
  question: Что проверяет тестирование переходов состояний?
  answer: Допустимые и запрещённые переходы объекта при событиях, включая исходное
    состояние, действие и итог. Полезно для заявок и платежей.
  category: Состояния
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 311cdae9-e888-40a6-8d2b-a190dfb4ab13
  question: Как протестировать повторное событие «подтвердить» в состоянии «подтверждён»?
  answer: 'Определить ожидаемую реакцию по контракту: идемпотентный успех, отказ или
    игнорирование; проверить, что побочные эффекты не выполняются повторно.'
  category: Состояния
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 946ddad7-a0ce-4b64-8cd1-e48c426dac99
  question: Что такое pairwise testing и когда оно полезно?
  answer: Подбор набора случаев, покрывающего все пары значений параметров. Это уменьшает
    комбинаторный взрыв, но не гарантирует обнаружения ошибок, зависящих от трёх и
    более параметров.
  category: Комбинации
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 700a28f4-a8f7-45ac-8c92-16d5c436888e
  question: Почему попарное тестирование нельзя применять без анализа ограничений
    комбинаций?
  answer: Часть пар может быть невозможной, а важные бизнес-риски могут требовать
    полного сочетания нескольких условий. Сначала моделируют допустимые значения и
    зависимости.
  category: Комбинации
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
