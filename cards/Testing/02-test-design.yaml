- id: 60f596af-ef01-427b-abd0-9a9bc7604554
  question: Чем statement coverage отличается от branch coverage?
  answer: Первое показывает выполнение строк или инструкций, второе — исходов ветвлений.
    Даже 100% обоих не доказывают корректность assertions.
  category: Покрытие кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b95c7835-4d3a-4663-98ce-aeb536900b3f
  question: Почему высокий процент code coverage не равен качеству тестов?
  answer: Тест может проходить через код без проверки результата, а важные ошибки
    лежать на границах систем. Coverage — индикатор пробелов, не цель сама по себе.
  category: Покрытие кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 890e996e-2697-4cf3-b678-d8fb2b50f956
  question: Что такое mutation testing?
  answer: Инструмент вносит небольшие изменения в код и проверяет, падают ли тесты.
    Выжившие мутации могут показывать слабые assertions или непроверенное поведение.
  category: Покрытие кода
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b3ddb3eb-db19-4075-9231-66f1ebf9fd39
  question: Как составить набор тестов для денежной суммы?
  answer: Проверить ноль, минимум, максимум, отрицательные и слишком большие значения,
    точность, валюту и округление; ожидаемое зависит от бизнес-правила.
  category: Деньги
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 50f06c2a-2021-423c-b279-7b047a89faf1
  question: Какие даты особенно важны при тестировании срока действия?
  answer: Граница начала и конца, часовой пояс, смена суток, високосный день и переходы
    времени там, где они применимы.
  category: Время
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ec187b56-929b-4977-ba53-cf06a771149b
  question: Как тестировать валидацию списка из 1–100 элементов?
  answer: Проверить 0, 1, 2, 99, 100, 101, а также null, пустые элементы и дубликаты
    согласно контракту.
  category: Практический кейс
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e61bb8e4-a585-41a6-84fa-3caaefcb1bf5
  question: Зачем тестировать комбинацию «ошибка + повтор»?
  answer: Она выявляет дублирующиеся побочные эффекты и неправильную обработку неизвестного
    исхода первого запроса.
  category: Повторы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7c734a47-cc10-46b4-b562-269d95d84e31
  question: Как выбрать тесты для прав доступа к объекту?
  answer: Проверить разрешённую роль и владельца, чужой объект, отсутствие аутентификации,
    недостаточную роль и смену состояния объекта.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e110b0bd-f6fa-433d-90b0-cb67116efc16
  question: Почему тестовые случаи должны быть независимы друг от друга?
  answer: Зависимость от порядка приводит к нестабильности и скрывает причину падения.
    Каждый тест готовит необходимые условия или использует контролируемую фикстуру.
  category: Качество теста
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 5baf6e02-b846-4cf2-89c1-33258e73eff1
  question: Чем чек-лист отличается от подробного тест-кейса?
  answer: Чек-лист фиксирует объекты и идеи проверки без пошаговой инструкции; тест-кейс
    описывает условия, шаги и ожидаемые результаты. Выбор зависит от риска и повторяемости.
  category: Документирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 50b352ec-5f07-4246-a6e0-b2e2929fd06c
  question: Как применить cause-effect анализ к нескольким входным условиям?
  answer: Связать условия с результатами логическими правилами, учесть ограничения
    и преобразовать их в таблицу решений или набор проверок.
  category: Моделирование
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 8a524943-299b-444b-9eb6-aab9da2d6caa
  question: Как проверить, что тест-набор покрывает требование, а не только его happy
    path?
  answer: Связать каждое правило и критерий с проверками основного, граничного, ошибочного
    и повторного сценариев; оценить необработанные риски.
  category: Трассировка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c4ffc854-4ffc-47c7-b561-2e602f45f2e3
  question: Когда property-based тест полезнее набора примеров?
  answer: Когда можно сформулировать инвариант для широкого пространства входов, например
    сохранение суммы или сортировки. Генератор не заменяет проверку конкретных бизнес-границ.
  category: Генеративные тесты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 50e415db-bb18-43ed-b7f1-476bcfc265cf
  question: Почему пример «поле должно быть непустым» требует проверки пробелов и
    Unicode?
  answer: Простая проверка длины может пропустить строку из пробелов или некорректно
    трактовать символы. Нужно уточнить правило нормализации и допустимые символы.
