- id: 1f774441-4333-4bac-8ca5-df74ab9f1952
  question: Как выбрать классы для поля возраста с допустимым диапазоном 18–65 включительно?
  answer: 'Минимум три класса: меньше 18, от 18 до 65, больше 65. Отдельно проверить
    отсутствие значения и неверный формат, если они возможны.'
  category: Классы эквивалентности
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: d2ce2ec7-0700-4106-ba56-c501663212a3
  question: Что такое анализ граничных значений?
  answer: Проверка значений на границе и рядом с ней, где часто ошибаются с операторами
    сравнения и диапазонами.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
