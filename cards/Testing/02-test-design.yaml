  question: Что такое эквивалентное разбиение?
  answer: Данные делят на классы, для которых ожидается одинаковое поведение системы,
    и выбирают представителя каждого значимого класса. Допущение о равенстве поведения
    нужно проверять.
  category: Классы эквивалентности
  context: 
