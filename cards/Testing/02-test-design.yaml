- id: 8f92828e-d0d9-4758-9ef1-a56fcbb756d7
  question: Почему одного значения из допустимого диапазона недостаточно?
  answer: Оно не проверяет поведение на границах и условия включительности. Ошибка
    «<» вместо «<=» может остаться незамеченной.
