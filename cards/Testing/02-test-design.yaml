- id: f0887490-b4cd-4f6b-8b23-7e5a40b02c9d
  question: Что такое error guessing?
  answer: 'Выбор тестов на основе опыта типичных дефектов: пустые поля, дубли, таймауты,
    границы дат, неверные роли. Это дополняет систематические техники.'
  category: Опыт
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 96a4275d-1d6a-434f-a4ff-a93f08220e4e
  question: Как получить тесты из критериев приёмки, не ограничившись их буквальным
    текстом?
  answer: Разобрать предусловия, границы, альтернативы, права и ошибки; каждый неочевидный
    результат уточнить у владельца правила.
  category: Требования
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 229e371d-8cd8-4385-b0d1-eb61eddcde36
  question: Что делать, если ожидаемый результат теста не указан в требованиях?
  answer: 'Не придумывать его как факт: зафиксировать вопрос, получить решение и обновить
    контракт или критерий приёмки.'
  category: Тестовый оракул
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
