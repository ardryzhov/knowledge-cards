topic: "Тест-дизайн и покрытие"
cards:
  - question: "Что такое эквивалентное разбиение?"
    answer: "Данные делят на классы, для которых ожидается одинаковое поведение системы, и выбирают представителя каждого значимого класса. Допущение о равенстве поведения нужно проверять."
    category: "Классы эквивалентности"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как выбрать классы для поля возраста с допустимым диапазоном 18–65 включительно?"
    answer: "Минимум три класса: меньше 18, от 18 до 65, больше 65. Отдельно проверить отсутствие значения и неверный формат, если они возможны."
    category: "Классы эквивалентности"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое анализ граничных значений?"
    answer: "Проверка значений на границе и рядом с ней, где часто ошибаются с операторами сравнения и диапазонами."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие значения проверить для диапазона 18–65 включительно?"
    answer: "Как минимум 17, 18, 19, 64, 65, 66; дополнительно минимум и максимум типа или отсутствие значения, если это риск сценария."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему одного значения из допустимого диапазона недостаточно?"
    answer: "Оно не проверяет поведение на границах и условия включительности. Ошибка «<» вместо «<=» может остаться незамеченной."
    category: "Границы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда таблица решений полезнее списка отдельных тест-кейсов?"
    answer: "Когда результат зависит от нескольких условий, комбинации которых трудно удержать в тексте. Таблица выявляет пропущенные и противоречивые правила."
    category: "Таблицы решений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как уменьшать таблицу решений без потери важных случаев?"
    answer: "Найти невозможные комбинации, объединить одинаковые исходы и отметить don't care только там, где условие действительно не влияет. Обоснование сокращения должно быть явным."
    category: "Таблицы решений"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что проверяет тестирование переходов состояний?"
    answer: "Допустимые и запрещённые переходы объекта при событиях, включая исходное состояние, действие и итог. Полезно для заявок и платежей."
    category: "Состояния"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как протестировать повторное событие «подтвердить» в состоянии «подтверждён»?"
    answer: "Определить ожидаемую реакцию по контракту: идемпотентный успех, отказ или игнорирование; проверить, что побочные эффекты не выполняются повторно."
    category: "Состояния"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое pairwise testing и когда оно полезно?"
    answer: "Подбор набора случаев, покрывающего все пары значений параметров. Это уменьшает комбинаторный взрыв, но не гарантирует обнаружения ошибок, зависящих от трёх и более параметров."
    category: "Комбинации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему попарное тестирование нельзя применять без анализа ограничений комбинаций?"
    answer: "Часть пар может быть невозможной, а важные бизнес-риски могут требовать полного сочетания нескольких условий. Сначала моделируют допустимые значения и зависимости."
    category: "Комбинации"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое error guessing?"
    answer: "Выбор тестов на основе опыта типичных дефектов: пустые поля, дубли, таймауты, границы дат, неверные роли. Это дополняет систематические техники."
    category: "Опыт"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как получить тесты из критериев приёмки, не ограничившись их буквальным текстом?"
    answer: "Разобрать предусловия, границы, альтернативы, права и ошибки; каждый неочевидный результат уточнить у владельца правила."
    category: "Требования"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если ожидаемый результат теста не указан в требованиях?"
    answer: "Не придумывать его как факт: зафиксировать вопрос, получить решение и обновить контракт или критерий приёмки."
    category: "Тестовый оракул"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем statement coverage отличается от branch coverage?"
    answer: "Первое показывает выполнение строк или инструкций, второе — исходов ветвлений. Даже 100% обоих не доказывают корректность assertions."
    category: "Покрытие кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему высокий процент code coverage не равен качеству тестов?"
    answer: "Тест может проходить через код без проверки результата, а важные ошибки лежать на границах систем. Coverage — индикатор пробелов, не цель сама по себе."
    category: "Покрытие кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что такое mutation testing?"
    answer: "Инструмент вносит небольшие изменения в код и проверяет, падают ли тесты. Выжившие мутации могут показывать слабые assertions или непроверенное поведение."
    category: "Покрытие кода"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как составить набор тестов для денежной суммы?"
    answer: "Проверить ноль, минимум, максимум, отрицательные и слишком большие значения, точность, валюту и округление; ожидаемое зависит от бизнес-правила."
    category: "Деньги"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие даты особенно важны при тестировании срока действия?"
    answer: "Граница начала и конца, часовой пояс, смена суток, високосный день и переходы времени там, где они применимы."
    category: "Время"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как тестировать валидацию списка из 1–100 элементов?"
    answer: "Проверить 0, 1, 2, 99, 100, 101, а также null, пустые элементы и дубликаты согласно контракту."
    category: "Практический кейс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем тестировать комбинацию «ошибка + повтор»?"
    answer: "Она выявляет дублирующиеся побочные эффекты и неправильную обработку неизвестного исхода первого запроса."
    category: "Повторы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как выбрать тесты для прав доступа к объекту?"
    answer: "Проверить разрешённую роль и владельца, чужой объект, отсутствие аутентификации, недостаточную роль и смену состояния объекта."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему тестовые случаи должны быть независимы друг от друга?"
    answer: "Зависимость от порядка приводит к нестабильности и скрывает причину падения. Каждый тест готовит необходимые условия или использует контролируемую фикстуру."
    category: "Качество теста"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем чек-лист отличается от подробного тест-кейса?"
    answer: "Чек-лист фиксирует объекты и идеи проверки без пошаговой инструкции; тест-кейс описывает условия, шаги и ожидаемые результаты. Выбор зависит от риска и повторяемости."
    category: "Документирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как применить cause-effect анализ к нескольким входным условиям?"
    answer: "Связать условия с результатами логическими правилами, учесть ограничения и преобразовать их в таблицу решений или набор проверок."
    category: "Моделирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, что тест-набор покрывает требование, а не только его happy path?"
    answer: "Связать каждое правило и критерий с проверками основного, граничного, ошибочного и повторного сценариев; оценить необработанные риски."
    category: "Трассировка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда property-based тест полезнее набора примеров?"
    answer: "Когда можно сформулировать инвариант для широкого пространства входов, например сохранение суммы или сортировки. Генератор не заменяет проверку конкретных бизнес-границ."
    category: "Генеративные тесты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему пример «поле должно быть непустым» требует проверки пробелов и Unicode?"
    answer: "Простая проверка длины может пропустить строку из пробелов или некорректно трактовать символы. Нужно уточнить правило нормализации и допустимые символы."
    category: "Текст"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

