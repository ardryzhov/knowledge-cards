- id: 14fb9adc-523d-4670-b06b-a4f28ba00b61
  question: Когда deep stubs создают опасную иллюзию рабочего теста?
  answer: Когда длинную цепочку вызовов mock настраивает автоматически, тест закрепляет
    внутреннюю структуру и не проверяет реальные границы. Лучше упростить интерфейс
    зависимости.
  category: Качество
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
