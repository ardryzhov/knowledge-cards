- id: 2a52bdd0-bee8-41d0-a805-53d9eb883dc7
  question: Когда verify(mock, never()) полезен?
  answer: Когда отсутствие вызова — бизнес-инвариант, например при невалидном запросе
    нельзя отправлять платёж или событие. Он не должен фиксировать случайные внутренние
    детали.
