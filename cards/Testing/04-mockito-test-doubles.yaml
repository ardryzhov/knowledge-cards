- id: c91c3230-1d23-494e-bd35-709e1040ad63
  question: Почему mock брокера не доказывает идемпотентность consumer?
  answer: Он не воспроизводит повторную доставку и commit/ack. Нужно интеграционно
    отправить дубликат или повторно вызвать обработчик с реальным хранилищем дедупликации.
  category: Практический кейс
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
