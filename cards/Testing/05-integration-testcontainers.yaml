- id: acabbe40-5bee-46ca-ab59-813f24d53dd4
  question: Почему @Transactional на тесте может скрыть ошибку в production-транзакции?
  answer: Тест сам открывает транзакцию и может объединить вызовы, которые в приложении
    выполняются отдельно; rollback после теста также меняет наблюдаемое поведение.
  category: Транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 34db9a3e-4171-484c-bfee-23b65f733415
  question: Чем flush отличается от commit в проверке JPA-операции?
  answer: Flush отправляет SQL в БД внутри текущей транзакции, commit фиксирует её.
    Ограничения могут сработать при flush, но проверка поведения после commit требует
    отдельной границы.
  category: Транзакции
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: cc39ba16-e176-4b92-bd3c-0b24ca91e968
  question: Как интеграционно проверить optimistic locking через @Version?
  answer: Загрузить одну сущность в двух независимых контекстах или транзакциях, сохранить
    первое изменение, затем проверить конфликт второго при flush/commit.
  category: Конкуренция
  context: 
