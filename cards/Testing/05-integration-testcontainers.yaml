- id: 498048c7-94ad-4e51-9291-f3c6825251f0
  question: Почему фиксированный Thread.sleep в интеграционном тесте ненадёжен?
  answer: На медленном CI он может быть слишком коротким, а локально зря замедляет
    тест. Лучше ждать конкретное условие с timeout и диагностикой.
