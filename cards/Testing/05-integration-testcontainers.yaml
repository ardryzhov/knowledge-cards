- id: 505c9be5-2ad0-43f1-a0c1-cca2ff63097c
  question: Зачем тестировать запрос при реальном объёме и структуре данных?
  answer: Маленькая фикстура может скрыть N+1, плохой план и поведение пагинации.
    Для производительности нужен отдельный репрезентативный сценарий.
  category: Производительность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0c601d17-6f19-4327-a0d1-d06ba2c456b9
  question: Когда достаточно mock внешнего сервиса, а когда нужен запущенный stub
    server?
  answer: Mock подходит для логики вызывающего метода; stub server проверяет HTTP-клиент,
    URL, заголовки, сериализацию, таймауты и обработку статусов.
