- id: 88f81522-881b-41dd-894f-8d7a3c926a47
  question: Как тестировать Kafka consumer с реальным брокером?
  answer: Отправить событие, дождаться наблюдаемого изменения в БД или выходного события,
    проверить offset/повторы в нужном сценарии; не зависеть от произвольного sleep.
  category: Kafka
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 107552a8-171a-4c7a-aaac-4fae2512e77f
  question: Как проверить идемпотентность consumer при повторной доставке?
  answer: Доставить событие с тем же устойчивым идентификатором повторно и проверить,
    что бизнес-эффект и запись дедупликации не удвоились.
