- id: 6c604199-1163-43d8-8b2f-df9e6bb248e6
  question: Зачем изолировать данные интеграционных тестов?
  answer: Параллельные запуски и повторные прогоны не должны влиять друг на друга.
    Используют отдельные схемы, ключи, транзакции или очистку согласно характеру теста.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
