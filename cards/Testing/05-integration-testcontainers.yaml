  answer: Отправить последовательность с одинаковым ключом в выбранный топик и проверить
    порядок наблюдаемого эффекта при конфигурации consumer; не переносить вывод на
    разные партиции.
  category: Kafka
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 11bdd6a1-cb5d-448c-ae16-35f88f47526a
  question: Что проверить в интеграционном тесте Artemis redelivery?
  answer: Сбой обработки до ack, повторную доставку, задержку, предел попыток и DLQ
    по конфигурации. Проверить, что бизнес-эффект не дублируется.
  category: Artemis
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: d0f53216-73af-4e27-9cb4-26018295b6fc
  question: Почему отправку события и запись в БД нельзя считать атомарной только
    из-за одного Spring-теста?
  answer: Тестовая транзакция может откатить БД, но не внешнего брокера. Нужен отдельный
    тест outbox или согласованного механизма.
