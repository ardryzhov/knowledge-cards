- id: ddf5ad4d-5206-43e6-b7c2-8448faa728c0
  question: Что проверяет API-тест кроме HTTP-статуса?
  answer: Схему и смысл тела, заголовки, изменения состояния, права, ошибки и повторные
    запросы. Статус 200 сам по себе не доказывает бизнес-результат.
  category: API
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: bfdc9097-739a-4f3a-9cd7-ea66cb26eabb
  question: Чем MockMvc-тест отличается от теста через настоящий сетевой порт?
  answer: MockMvc выполняет Spring MVC обработку без реального сетевого сервера; тест
    на порту дополнительно проверяет запуск сервера и часть сетевой конфигурации.
  category: Spring Web
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: bbcc978b-4f10-4c3a-9536-f21b8403e047
  question: Когда использовать RestAssured или HTTP-клиент в тестах?
  answer: Когда важно проверить API как внешний потребитель через HTTP, включая методы,
    заголовки, сериализацию и ошибки.
  category: API
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b3229854-d9f2-44d9-bf4d-39e1aa1aac7c
  question: Зачем проверять 400 для невалидного тела запроса?
  answer: Это подтверждает серверную валидацию и стабильный формат ошибки; UI-валидации
    недостаточно.
  category: Негативные сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b0318882-0e25-4678-8b7c-a3fea617c744
  question: Чем тест 401 отличается от теста 403?
  answer: Первый проверяет отсутствие или неуспех аутентификации, второй — отказ уже
    распознанному субъекту с недостаточными правами.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
