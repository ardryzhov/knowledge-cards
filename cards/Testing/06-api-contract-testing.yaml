- id: 71339b02-c7bd-48cf-8166-957f7a859640
  question: Что делать, если контрактный тест падает после намеренного изменения API?
  answer: Определить затронутых потребителей, согласовать совместимый переход или
    версию и обновить контракт вместе с ними. Простое удаление проверки скрывает несовместимость.
  category: Управление
