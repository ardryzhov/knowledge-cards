- id: 055754d1-e75a-43e0-8e6d-d2695a7e7e64
  question: Почему проверка доступа только по роли не покрывает чужой объект?
  answer: Пользователь с той же ролью может не иметь права на ресурс другого владельца.
    Нужен тест объектного доступа.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ada267ff-8469-4d9b-97d3-f3d6507843cd
  question: Как проверить идемпотентность POST с Idempotency-Key?
  answer: Отправить одинаковый запрос с тем же ключом повторно и проверить один бизнес-эффект
    и согласованный ответ; затем проверить конфликтное содержимое с тем же ключом
    по контракту.
  category: Повторы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c9c77785-03d7-4aff-9932-0ad364851dac
  question: Что нужно тестировать при пагинации API?
  answer: Размер и порядок страниц, границы, пустой результат, стабильность сортировки
    и поведение при изменении набора между запросами.
  category: Пагинация
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 1a7e6605-5e58-49f3-9f7c-a1dfcb8f0916
  question: Почему тест JSON-ответа только по полному текстовому совпадению хрупок?
  answer: Порядок полей и форматирование могут измениться без изменения контракта.
    Лучше проверять структуру и важные значения; точное сравнение нужно только для
    точного формата.
  category: JSON
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 7e4d2642-2d91-4895-9b7d-f2779b06d8b8
  question: Чем отсутствующее поле отличается от поля с null в контрактном тесте?
  answer: Они могут иметь разную семантику и по-разному обрабатываться клиентом. Схема
    и тест должны фиксировать оба случая.
  category: JSON
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 732cf4a5-b498-41e2-b8fc-9f2bf3164e30
  question: Зачем проверять формат даты и часовой пояс в API?
  answer: Одинаковый текст без offset может обозначать разное время у клиентов. Контракт
    должен задавать формат и смысл поля.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b65b2062-c90a-4e47-ae8c-59abaf54924f
  question: Что проверяет контрактный тест между producer и consumer?
  answer: Что producer предоставляет формат и поведение, на которые рассчитывает consumer;
    это снижает риск несовместимости при независимых релизах.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 2857d2f7-77c0-45ea-8c37-41b6e4e5ca59
  question: Чем consumer-driven contract отличается от проверки только OpenAPI-схемы?
  answer: Consumer-driven контракт фиксирует реально используемые потребителем взаимодействия
    и проверяет их у provider; схема API описывает допустимый интерфейс, но не гарантирует
    нужный конкретный сценарий.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b155c520-fb6d-428e-b997-18e10ae5ff1d
  question: Почему контрактный тест не заменяет E2E?
  answer: Он проверяет согласованные границы, но не полный бизнес-сценарий, маршрутизацию
    и все зависимости в развёрнутой среде.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 50ebf767-f88e-4f85-adfe-99175b3c130a
  question: Какие изменения JSON API чаще всего ломают клиентов?
  answer: Удаление или переименование поля, изменение типа, обязательности, семантики
    или кода ошибки. Добавление поля тоже может ломать строгих клиентов, поэтому совместимость
    проверяют.
  category: Совместимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: a60ec3c2-8c19-490d-904e-0a473169df53
  question: Как проверить обратную совместимость новой версии API?
  answer: Прогнать контракты текущих потребителей и сценарии старых клиентов против
    новой реализации, сравнить схемы и правила обработки.
  category: Совместимость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9bfc6a08-8610-4c7d-a1ad-72d372ea7dc2
  question: Что важно проверить при ответе 202 Accepted?
  answer: Операция действительно принята, есть способ узнать её состояние, а итоговая
    ошибка и завершение доступны по контракту.
  category: Асинхронность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 868b43e2-507c-44ad-87ab-4cf5099d953f
  question: Почему тело ошибки должно проверяться как контракт?
  answer: Клиент может опираться на код, детали и идентификатор запроса; неожиданный
    формат мешает обработке и диагностике.
  category: Ошибки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: e2f92d22-9956-4290-829b-120e7f178cb9
  question: Как тестировать ETag и If-Match при обновлении?
  answer: Получить версию, выполнить успешное условное изменение, затем повторить
    со старой версией и проверить отказ без потери нового состояния.
  category: Конкуренция
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: e2d0f884-1753-4452-be13-515268e01a92
  question: Что проверяет тест на повтор после сетевого таймаута?
  answer: Что клиент не создаёт второй бизнес-эффект при неизвестном исходе первой
    попытки, если контракт обещает идемпотентность.
  category: Повторы
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: f273968a-92ac-42fb-8e75-e6c2a244c481
  question: Как проверить endpoint загрузки файла?
  answer: Проверить допустимый тип и размер, пустой и повреждённый файл, права, результат
    обработки и отказ на превышение лимита.
  category: Файлы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 130b3382-4380-465d-97f2-74a338139ba3
  question: Почему нельзя считать mock внешнего API достаточным контрактным тестом?
  answer: Mock может быть настроен по устаревшим предположениям и не проверяет реального
    provider. Нужна проверка опубликованного контракта у provider.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b07cdf54-0938-43a2-94be-b19ddd7d9981
  question: Что проверять в контракте сообщения Kafka или Artemis?
  answer: Структуру, обязательность, типы, ключ, версию и смысл события; отдельно
    порядок, повторы и ошибки обработки.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b3b61c88-f356-4b1a-bb84-fc826d0397ee
  question: Как проверить совместимость нового события со старым consumer?
  answer: Запустить контракт старого потребителя на новой схеме и проверить обработку
    старых и новых примеров с учётом retention и правил версионирования.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 262d03a0-d2c1-4ead-8a3f-0f78240befdc
  question: Почему тест API должен проверять не только happy path, но и недоступность
    зависимости?
  answer: Ошибка БД или upstream может изменить код и тело ответа либо привести к
    утечке внутренней информации. Нужна согласованная деградация.
  category: Отказы
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: f9e83589-cea7-4398-b8f8-1f017a542835
  question: Чем схема JSON Schema отличается от бизнес-проверки?
  answer: Схема проверяет структуру и типовые ограничения; правило вроде достаточности
    баланса зависит от состояния и требует отдельной проверки.
  category: Контракты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 39bf0d24-b219-4263-b1c9-32a7e21863c6
  question: Как тестировать 429 Too Many Requests?
  answer: Создать нагрузку выше лимита в контролируемой среде, проверить статус, область
    лимита и заголовок Retry-After, если он предусмотрен контрактом.
  category: Ограничения
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
