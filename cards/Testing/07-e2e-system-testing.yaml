- id: f27803a3-216c-4731-9416-6a9c625843bb
  question: Почему E2E-тесты не должны делить одну учётную запись при параллельном
    запуске?
  answer: Параллельные сценарии меняют состояние и мешают друг другу. Нужны изолированные
    пользователи или явно управляемые данные.
