- id: a9c205ca-2f14-49df-ab49-d2af12e20490
  question: Почему успешный E2E в тестовой среде не гарантирует production-релиз?
  answer: Среды могут различаться данными, конфигурацией, нагрузкой и правами. После
    деплоя нужны smoke и мониторинг реального сценария.
  category: Среды
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 779c9975-b9c6-4667-a0b1-421412508cbb
  question: Как тестировать асинхронный статус операции в E2E?
  answer: Отправить действие, сохранить ID, опрашивать статус или ждать событие до
    ограниченного срока, затем проверить финальный результат и ошибочный путь.
  category: Асинхронность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: cab1805d-d1da-4cab-b5d6-c9483ed09c2f
  question: Что проверить в E2E при отмене пользователем операции?
  answer: Право отмены, допустимое состояние, повторную отмену, итог в UI и backend,
    а также отсутствие лишнего побочного эффекта.
  category: Сценарии
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b8f9fe49-52f8-4f2f-9d74-3647d82cd447
  question: Когда тест в браузере должен проверять доступность UI?
  answer: Когда пользовательский сценарий зависит от клавиатуры, фокуса, подписей
    и семантики элементов. Такая проверка дополняет функциональные assertions.
  category: Доступность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: edddb342-2ca9-458e-a43d-4675fc3eab0a
  question: Как отделить проблему UI от backend при падении E2E?
  answer: Посмотреть сетевые запросы браузера, коды API, трассировку, логи и состояние
    данных; определить первый нарушенный контракт.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: fb169508-0de7-418a-8c92-141affc69b33
  question: Что сохранять как артефакты падения E2E?
  answer: Скриншот, trace или видео, сетевые ошибки, логи приложения, тестовые данные
    и версию среды без секретов.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
