- id: 8c73ca45-3c63-44a8-b504-a683677f2d3f
  question: Что делать с внешним сервисом, недоступным в тестовой среде?
  answer: Согласовать границу E2E и использовать управляемый stub для стабильного
    сценария; реальную межсистемную совместимость проверить отдельно на подходящей
    среде.
  category: Границы
  context: 
