- id: 7cbd8811-67db-43f8-bf7c-40f8f5d7970e
  question: Почему E2E-тестов обычно меньше, чем unit-тестов?
  answer: Они медленнее, дороже в поддержке и сложнее в диагностике, поскольку зависят
    от многих компонентов и среды.
  category: Стратегия
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
