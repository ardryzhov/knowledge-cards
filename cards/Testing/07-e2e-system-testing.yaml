- id: d4888979-a4bc-434b-801c-a36d09e9ac60
  question: Чем E2E через браузер отличается от API E2E?
  answer: Браузерный тест включает UI, навигацию и взаимодействие пользователя; API
    E2E проверяет полный backend-сценарий без интерфейса. Оба полезны для разных рисков.
  category: Границы
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a5d508af-8d9e-408b-b278-4b22541a2ea8
  question: Что считать успешным результатом E2E операции перевода?
  answer: 'Не только сообщение в UI: нужно проверить итоговое состояние операции и
    согласованные изменения счётов или проводок через доступный контракт.'
  category: Оракул
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: c11460f4-972d-4f99-b64d-afb0da60e349
  question: Почему фиксированный sleep в браузерном тесте плох?
  answer: На CI время ответа меняется; sleep бывает слишком коротким или зря замедляет
    прогон. Ждут конкретное состояние с timeout.
  category: Стабильность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
