- id: d53f7c70-18d1-4215-b4aa-08736705db9e
  question: Почему E2E-тест, зависящий от текущей даты, может ломаться ночью?
  answer: Смена суток и временной зоны меняет ожидаемые значения. Дату контролируют
    в тестовых данных или явно задают допустимый интервал.
  category: Время
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2f2f48fe-ddd2-4c59-9266-0faea7baf2d1
  question: Как проверить сценарий с несколькими ролями?
  answer: Создать независимые учётные записи, выполнить действие одной ролью и проверить
    наблюдаемый эффект и ограничения доступа другой.
  category: Авторизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 3bfebab6-4135-4444-a78a-d28b77d38ff7
  question: Чем manual exploratory проверка дополняет автоматизированный E2E?
  answer: Она помогает найти неожиданные сценарии и проблемы взаимодействия, которые
    не были заложены в сценарий автоматизации.
  category: Исследование
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 34073079-63d0-4a91-a7d1-a2ff4f406a8f
  question: Как не превратить E2E-тест в длинную цепочку зависимых бизнес-операций?
  answer: Подготовить предпосылки через управляемый API или фикстуру, а через UI проверить
    только выбранный путь. Исключения нужны, если сама цепочка и есть цель теста.
  category: Дизайн
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: e8d0c045-9281-4f1a-8a39-ea65ca310c94
  question: Почему E2E часто падает при shared staging?
  answer: Другие команды меняют версии, данные и конфигурацию. Нужны контроль версии,
    изоляция ключевых данных и метки среды в отчёте.
  category: Среды
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: bf585cc1-eb84-43cc-a28c-bc42af23b332
  question: Как определить, что E2E-сценарий устарел после изменения требований?
  answer: Сверить его цель и assertions с актуальным контрактом; отличить намеренное
    изменение поведения от регресса и обновить тест.
  category: Поддержка
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e8447e84-b6aa-40fa-987d-962c2743f200
  question: Что проверять при завершении полного сценария через Kafka?
  answer: Отправку события, обработку consumer, финальное состояние и отсутствие дубля
    при повторе, ожидая наблюдаемое условие с timeout.
  category: События
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 79f290c2-d8bf-4873-8b23-cc8df2baf686
  question: Почему браузерный тест не должен проверять все комбинации серверной валидации?
  answer: Это замедляет и усложняет suite; комбинации проверяют на уровне API или
    unit, а браузером — основные пользовательские пути и отображение ошибок.
  category: Стратегия
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 0c309ade-8c4f-44ac-b7d2-56e5a495f340
  question: Когда E2E-тест должен запускаться в pipeline?
  answer: Критичный smoke — после развёртывания в подходящую среду; полный дорогой
    suite — по установленному графику или перед релизом, если его результат влияет
    на решение.
  category: CI/CD
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
