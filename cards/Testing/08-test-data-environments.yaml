  hint_2: 
  difficulty: medium
  code: 
- id: 9bc4bac8-6336-4166-b646-60b254484e5a
  question: Что делать, если нужный тестовый сценарий нельзя воспроизвести без реальных
    персональных данных?
  answer: Найти минимальные свойства данных, необходимые для поведения, и сгенерировать
    синтетический эквивалент; если невозможно, использовать утверждённый защищённый
    процесс.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
