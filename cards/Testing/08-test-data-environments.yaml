- id: 158d8f50-7785-4c12-8775-a14b22985e7c
  question: Почему общая тестовая очередь может ломать независимость тестов?
  answer: Потребители разных прогонов читают сообщения друг друга, появляются гонки
    и дубли. Нужны уникальные адреса, ключи или изолированный брокер.
  category: Брокеры
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 361ac366-7dbd-467c-b274-25463f8cb784
  question: Как обеспечить воспроизводимый запуск интеграционных тестов на машине
    разработчика?
  answer: Автоматически поднять нужные версии зависимостей, применить миграции и подготовить
    данные через тестовый код или контейнеры, документировать требования к runtime.
  category: Воспроизводимость
  context: 
