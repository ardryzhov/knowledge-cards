- id: bd9cf41e-59a5-4e9b-b9e5-44d2709fd345
  question: Что такое quarantine теста и какой риск у неё есть?
  answer: Временное отделение нестабильного теста от блокирующего набора с владельцем
    и сроком исправления. Риск — потерять защиту сценария, если карантин станет постоянным.
  category: Flakiness
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
