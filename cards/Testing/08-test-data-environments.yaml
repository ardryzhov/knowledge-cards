- id: 5bce48ce-8a8c-4cd3-abcd-d9e20e079ee4
  question: Почему тестовые данные — часть тестового сценария, а не техническая мелочь?
  answer: Они задают предусловия и влияют на ожидаемый результат. Неизвестное или
    изменяемое состояние делает тест ненадёжным.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 7440aba2-2d99-4464-ab12-35d52c3c24ea
  question: Чем synthetic test data предпочтительнее копии production-данных?
  answer: Синтетические данные контролируемы, воспроизводимы и не содержат реальные
    персональные сведения. Копия production требует строгих прав и обезличивания.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 663788bf-209d-4fa4-bf2b-94cc0447c329
  question: Почему простой замены ФИО недостаточно для обезличивания production-выгрузки?
  answer: Человека можно повторно идентифицировать по сочетанию других полей, идентификаторам
    и истории операций. Нужна оценка риска и согласованный метод защиты.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: b55fb0dc-f46b-4478-9412-68d557906a07
  question: Как подготовить данные для теста миграции БД?
  answer: Создать предыдущую схему и представительные старые записи, применить миграцию,
    проверить сохранность и новые инварианты.
  category: Миграции
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 4ec9d391-f810-451c-b47c-14918b973c74
  question: Чем seed data отличается от фикстуры отдельного теста?
  answer: Seed задаёт базовое состояние среды для набора сценариев; фикстура готовит
    точные условия конкретного теста. Общий seed может устаревать и скрывать зависимости.
  category: Данные
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b71cc296-314d-44de-9215-b12835d73981
  question: Почему тесты не должны зависеть от порядка запуска?
  answer: Предыдущий тест может не создать нужные данные или оставить мусор. Каждый
    тест должен явно готовить и очищать своё состояние.
  category: Изоляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: d44c68eb-35c9-48d5-9388-3319d76bc827
  question: Как изолировать параллельные интеграционные тесты?
  answer: Использовать уникальные идентификаторы, отдельные схемы или контейнеры,
    изолированные очереди и управляемую очистку. Выбор зависит от стоимости и семантики
    теста.
  category: Изоляция
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2d5582f6-130f-4fec-a5e5-6a8a4c41c6db
  question: Когда rollback транзакции достаточно для очистки данных теста?
  answer: Когда проверяемые действия происходят в той же транзакции и нет асинхронных
    обработчиков или внешних эффектов. Иначе нужна явная очистка или отдельная среда.
  category: Очистка
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 3f8a7bef-6b1f-4372-baf8-90b20a6c062e
  question: Почему TRUNCATE всех таблиц после теста может быть опасен при параллельном
    запуске?
  answer: Он удалит данные другого теста, создавая гонки. Нужны изолированные схемы
    или уникальные ключи и локальная очистка.
  category: Очистка
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: dc14b8c7-fbc8-4c21-a02b-89f5d44042b4
  question: Как тестировать функцию, зависящую от текущего времени?
  answer: Внедрить Clock или управляемый источник времени, задать зону и проверить
    граничные моменты. Системные часы CI не должны быть тестовым входом.
  category: Время
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 475fe0a1-85d2-46e0-af2b-0ca11232243a
  question: Почему среда stage не обязана полностью повторять production и что важно
    сохранить?
  answer: Обычно отличается масштаб, но для рисковых проверок нужны сопоставимые версии
    БД, брокера, конфигурация контрактов и данные нужной формы.
  category: Среды
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
