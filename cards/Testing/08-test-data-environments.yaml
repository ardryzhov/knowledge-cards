- id: e61a171f-1497-4097-abbd-47c6f9465200
  question: Какие сведения о тестовой среде нужны в отчёте о падении?
  answer: Версии приложения и зависимостей, конфигурация, адрес или идентификатор
    среды, время, данные и изменения, влияющие на сценарий.
  category: Среды
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 8c5f08f7-a96f-448a-a363-98e6d10b2034
  question: Как определить, что падение теста вызвано окружением?
  answer: Сопоставить логи приложения и инфраструктуры, доступность зависимостей,
    версию среды и повторный запуск в контролируемых условиях.
  category: Диагностика
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
