- id: e4879cf2-a505-462f-9ace-a6f015af9398
  question: Почему тестовый API-ключ не стоит хранить в репозитории?
  answer: Даже тестовая среда может иметь данные и права; ключ может утечь и использоваться
    вне теста. Нужна безопасная выдача и ротация.
  category: Безопасность
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 38696634-0fe8-4e63-bcf4-e2b0ad7473cc
  question: Как выбрать данные для проверки пагинации?
  answer: Нужны записи до, на и после границы страницы, стабильные ключи сортировки,
    одинаковые значения сортируемого поля и изменения набора между запросами.
  category: Пагинация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
