- id: 8d7dbbcb-bb93-4e80-a780-a8cf08ac9685
  question: Почему retry падающего теста в CI не решает проблему?
  answer: Он может скрыть реальный дефект и ухудшить доверие к проверкам. Retry допустим
    как временная мера с метрикой и задачей на устранение причины.
  category: Flakiness
  context: 
