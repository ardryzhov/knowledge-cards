topic: "Тестовые данные и окружения"
cards:
  - question: "Почему тестовые данные — часть тестового сценария, а не техническая мелочь?"
    answer: "Они задают предусловия и влияют на ожидаемый результат. Неизвестное или изменяемое состояние делает тест ненадёжным."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Чем synthetic test data предпочтительнее копии production-данных?"
    answer: "Синтетические данные контролируемы, воспроизводимы и не содержат реальные персональные сведения. Копия production требует строгих прав и обезличивания."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему простой замены ФИО недостаточно для обезличивания production-выгрузки?"
    answer: "Человека можно повторно идентифицировать по сочетанию других полей, идентификаторам и истории операций. Нужна оценка риска и согласованный метод защиты."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как подготовить данные для теста миграции БД?"
    answer: "Создать предыдущую схему и представительные старые записи, применить миграцию, проверить сохранность и новые инварианты."
    category: "Миграции"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем seed data отличается от фикстуры отдельного теста?"
    answer: "Seed задаёт базовое состояние среды для набора сценариев; фикстура готовит точные условия конкретного теста. Общий seed может устаревать и скрывать зависимости."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему тесты не должны зависеть от порядка запуска?"
    answer: "Предыдущий тест может не создать нужные данные или оставить мусор. Каждый тест должен явно готовить и очищать своё состояние."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как изолировать параллельные интеграционные тесты?"
    answer: "Использовать уникальные идентификаторы, отдельные схемы или контейнеры, изолированные очереди и управляемую очистку. Выбор зависит от стоимости и семантики теста."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда rollback транзакции достаточно для очистки данных теста?"
    answer: "Когда проверяемые действия происходят в той же транзакции и нет асинхронных обработчиков или внешних эффектов. Иначе нужна явная очистка или отдельная среда."
    category: "Очистка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему TRUNCATE всех таблиц после теста может быть опасен при параллельном запуске?"
    answer: "Он удалит данные другого теста, создавая гонки. Нужны изолированные схемы или уникальные ключи и локальная очистка."
    category: "Очистка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как тестировать функцию, зависящую от текущего времени?"
    answer: "Внедрить Clock или управляемый источник времени, задать зону и проверить граничные моменты. Системные часы CI не должны быть тестовым входом."
    category: "Время"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему среда stage не обязана полностью повторять production и что важно сохранить?"
    answer: "Обычно отличается масштаб, но для рисковых проверок нужны сопоставимые версии БД, брокера, конфигурация контрактов и данные нужной формы."
    category: "Среды"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие сведения о тестовой среде нужны в отчёте о падении?"
    answer: "Версии приложения и зависимостей, конфигурация, адрес или идентификатор среды, время, данные и изменения, влияющие на сценарий."
    category: "Среды"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как определить, что падение теста вызвано окружением?"
    answer: "Сопоставить логи приложения и инфраструктуры, доступность зависимостей, версию среды и повторный запуск в контролируемых условиях."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему общая тестовая очередь может ломать независимость тестов?"
    answer: "Потребители разных прогонов читают сообщения друг друга, появляются гонки и дубли. Нужны уникальные адреса, ключи или изолированный брокер."
    category: "Брокеры"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как обеспечить воспроизводимый запуск интеграционных тестов на машине разработчика?"
    answer: "Автоматически поднять нужные версии зависимостей, применить миграции и подготовить данные через тестовый код или контейнеры, документировать требования к runtime."
    category: "Воспроизводимость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что делать, если нужный тестовый сценарий нельзя воспроизвести без реальных персональных данных?"
    answer: "Найти минимальные свойства данных, необходимые для поведения, и сгенерировать синтетический эквивалент; если невозможно, использовать утверждённый защищённый процесс."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему тестовый API-ключ не стоит хранить в репозитории?"
    answer: "Даже тестовая среда может иметь данные и права; ключ может утечь и использоваться вне теста. Нужна безопасная выдача и ротация."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как выбрать данные для проверки пагинации?"
    answer: "Нужны записи до, на и после границы страницы, стабильные ключи сортировки, одинаковые значения сортируемого поля и изменения набора между запросами."
    category: "Пагинация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Зачем иметь тестовые данные с отсутствующими и устаревшими значениями справочника?"
    answer: "Они выявляют ошибки миграции и совместимости, которые не видны на идеальном новом наборе данных."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как отличить flaky test от дефекта, который проявляется не всегда?"
    answer: "Собрать частоту, условия и артефакты падений; нестабильность может быть настоящей гонкой в продукте, а не только проблемой теста."
    category: "Flakiness"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему retry падающего теста в CI не решает проблему?"
    answer: "Он может скрыть реальный дефект и ухудшить доверие к проверкам. Retry допустим как временная мера с метрикой и задачей на устранение причины."
    category: "Flakiness"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое quarantine теста и какой риск у неё есть?"
    answer: "Временное отделение нестабильного теста от блокирующего набора с владельцем и сроком исправления. Риск — потерять защиту сценария, если карантин станет постоянным."
    category: "Flakiness"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить, что данные не остаются после E2E-теста?"
    answer: "Использовать управляемую очистку по уникальному идентификатору и проверять её результат; учитывать внешние сообщения и асинхронные действия."
    category: "Очистка"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему тесты с фиксированным userId могут конфликтовать в CI?"
    answer: "Несколько запусков используют одного пользователя и изменяют его состояние. Нужны уникальные учётные записи или изоляция по прогону."
    category: "Изоляция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null

