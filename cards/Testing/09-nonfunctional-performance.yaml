- id: 9d6e86a6-16ef-4149-b5d6-f88fdd5bf3af
  question: Чем closed workload отличается от open workload?
  answer: Closed-модель задаёт число параллельных пользователей, которые ждут ответа
    перед следующей операцией; open-модель задаёт скорость поступления независимо
    от ответа. При деградации они ведут себя по-разному.
  category: Модель нагрузки
