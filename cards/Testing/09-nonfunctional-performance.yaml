- id: 3a4de13e-e219-4754-af51-fa982cf3029a
  question: Чем performance regression test отличается от разового бенчмарка?
  answer: Он сравнивает результат с базой при сопоставимых условиях и выявляет деградацию
    после изменений. Разовый прогон без базовой линии не показывает регресс.
  category: Регресс
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
