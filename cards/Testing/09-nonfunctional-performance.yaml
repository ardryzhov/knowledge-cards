- id: 4773ce38-d33a-4b14-99c8-551cb6e3f518
  question: Почему тест только одного пользователя не обнаружит race condition?
  answer: Конкурирующие запросы могут нарушить лимит, уникальность или состояние.
    Нужны параллельные операции на общий ресурс и проверка итогового инварианта.
