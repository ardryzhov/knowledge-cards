  question: Почему нагрузочный тест на слабом стенде нельзя прямо переносить на production?
  answer: Ресурсы, сеть, данные и соседняя нагрузка отличаются. Результаты интерпретируют
    с учётом среды и проверяют узкие места отдельно.
