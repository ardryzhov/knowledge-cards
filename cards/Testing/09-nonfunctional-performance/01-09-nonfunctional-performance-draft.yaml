topic: "Нефункциональное тестирование и производительность"
cards:
  - question: "Чем нагрузочный тест отличается от stress test?"
    answer: "Нагрузочный проверяет систему при ожидаемом профиле работы; stress увеличивает нагрузку до предела и изучает деградацию и восстановление."
    category: "Виды нагрузки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что проверяет soak test?"
    answer: "Длительную работу под заданной нагрузкой для выявления утечек памяти, накопления очередей и деградации со временем."
    category: "Виды нагрузки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Когда нужен spike test?"
    answer: "Когда система должна переживать резкий скачок трафика или событий; проверяют ошибки, задержку и восстановление после пика."
    category: "Виды нагрузки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему число виртуальных пользователей само по себе не задаёт нагрузку?"
    answer: "Важны частота действий, think time, профиль операций и данные. Одинаковое число пользователей может давать разный RPS."
    category: "Модель нагрузки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие показатели собрать в нагрузочном тесте API?"
    answer: "RPS, долю ошибок, распределение задержек и насыщение ресурсов, а также метрики БД и брокера для поиска узкого места."
    category: "Метрики"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему средняя задержка не заменяет p95 или p99?"
    answer: "Небольшая доля очень медленных запросов может быть скрыта средним. Процентили показывают хвост распределения при достаточной выборке."
    category: "Метрики"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как задать критерий прохождения нагрузочного теста?"
    answer: "Указать профиль и длительность нагрузки, допустимые ошибки, p95/p99 задержки и ограничения ресурсов, привязанные к требованиям."
    category: "Критерии"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему важно прогреть JVM перед сравнением производительности?"
    answer: "JIT-компиляция, кэши и пул соединений меняют показатели первых запросов. Прогрев и его длительность фиксируют в методике."
    category: "Java"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему тест на пустой БД может дать ложное ощущение производительности?"
    answer: "План запросов и размер индексов меняются с объёмом и распределением данных. Нужна репрезентативная форма данных."
    category: "Данные"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличить узкое место приложения от БД при росте latency?"
    answer: "Сравнить traces, CPU, пул соединений, время SQL, блокировки и планы запросов на том же профиле нагрузки."
    category: "Диагностика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему увеличение числа Pod не обязательно повышает throughput?"
    answer: "Общая БД, брокер или внешний API могут стать пределом; дополнительные Pod увеличат конкуренцию."
    category: "Масштабирование"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое saturation ресурса?"
    answer: "Степень занятости или ожидания ресурса, например очередь соединений, CPU throttling или занятые workers. Она помогает объяснить рост задержки."
    category: "Метрики"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как проверить поведение сервиса при недоступной БД?"
    answer: "Создать контролируемый отказ в подходящей среде, проверить таймаут, ответ, ограничение повторов, освобождение ресурсов и восстановление."
    category: "Отказоустойчивость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем тест отказа одного Pod отличается от теста отказа БД?"
    answer: "Первый проверяет маршрутизацию и реплики приложения; второй — зависимость от общего состояния и политику деградации. Риски разные."
    category: "Отказоустойчивость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как проверить graceful shutdown Java-сервиса под нагрузкой?"
    answer: "Во время запросов отправить штатный сигнал завершения, проверить отсутствие новых запросов, завершение активных в срок и целостность операций."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему тест retry должен измерять нагрузку на зависимость?"
    answer: "При ошибке повторы могут умножить запросы и усилить аварию. Проверяют лимит, backoff, deadline и итог пользователя."
    category: "Повторы"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что проверить при массовой повторной доставке сообщений?"
    answer: "Idempotency, скорость обработки, рост очереди, состояние БД и поведение DLQ. Один успешный повтор не показывает предел системы."
    category: "Очереди"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем performance regression test отличается от разового бенчмарка?"
    answer: "Он сравнивает результат с базой при сопоставимых условиях и выявляет деградацию после изменений. Разовый прогон без базовой линии не показывает регресс."
    category: "Регресс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему нагрузочный тест на слабом стенде нельзя прямо переносить на production?"
    answer: "Ресурсы, сеть, данные и соседняя нагрузка отличаются. Результаты интерпретируют с учётом среды и проверяют узкие места отдельно."
    category: "Среда"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие угрозы покрывает базовое security testing API?"
    answer: "Проверки аутентификации, авторизации, доступа к чужому объекту, валидации ввода и утечки секретов в ошибках. Глубина зависит от модели угроз."
    category: "Безопасность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему тест только одного пользователя не обнаружит race condition?"
    answer: "Конкурирующие запросы могут нарушить лимит, уникальность или состояние. Нужны параллельные операции на общий ресурс и проверка итогового инварианта."
    category: "Конкуренция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить лимит в 100 операций при двух одновременных запросах?"
    answer: "Начать с 99, одновременно выполнить две операции и проверить, что итог не превышает 100, а один запрос получает согласованный отказ или иной предусмотренный результат."
    category: "Конкуренция"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что такое chaos experiment в ограниченном прикладном смысле?"
    answer: "Контролируемое внесение отказа с гипотезой, границами воздействия, метриками и планом остановки, чтобы проверить устойчивость и восстановление."
    category: "Отказоустойчивость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему при нагрузочном тесте нужно контролировать генератор нагрузки?"
    answer: "Если генератор сам перегружен, он не создаст нужный профиль и измерения будут неверными. Проверяют его CPU, сеть и фактический RPS."
    category: "Методика"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем closed workload отличается от open workload?"
    answer: "Closed-модель задаёт число параллельных пользователей, которые ждут ответа перед следующей операцией; open-модель задаёт скорость поступления независимо от ответа. При деградации они ведут себя по-разному."
    category: "Модель нагрузки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Как проверить, что система восстановилась после пикового теста?"
    answer: "Дождаться снижения очередей и ошибок до нормы, проверить задержку, доступность и отсутствие застрявших операций."
    category: "Восстановление"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

