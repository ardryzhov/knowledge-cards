- id: ba928f6d-444e-4b71-8e60-fea990d1188a
  question: Как отличить проблему тестирования от ошибки требований при найденном
    дефекте?
  answer: 'Сверить поведение с согласованным правилом: если правило определено и нарушено
    — дефект реализации; если не определено — пробел требований, который нужно решить.'
