topic: Качество релизов, дефекты и QA-процесс
cards:
- id: 4232bc2e-37fe-442a-8902-d0e9ee06cd0d
  question: Чем severity дефекта отличается от priority?
  answer: Severity описывает влияние дефекта на систему или пользователя; priority
    — срочность исправления с учётом бизнеса и сроков. Они могут не совпадать.
  category: Дефекты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: a8cd1808-6e49-4a6c-abdd-1023911d6ad0
  question: Что должен содержать полезный defect report?
  answer: Симптом, ожидаемый и фактический результат, шаги воспроизведения, данные,
    среду, версию, влияние и доступные логи или скриншоты без секретов.
  category: Дефекты
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: b3507a52-0870-448f-a8ff-a5388c9c2750
  question: Что делать, если дефект не воспроизводится повторно?
  answer: Сохранить артефакты первого сбоя, уточнить время, нагрузку, данные и окружение;
    не закрывать его автоматически как «случайный».
  category: Дефекты
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1f999573-bb3a-4eaf-8366-fe933c6b1368
  question: Чем retest отличается от regression testing?
  answer: Retest проверяет конкретное исправление ранее найденного дефекта; регресс
    проверяет, не нарушено ли другое поведение после изменения.
  category: Виды проверки
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 0734e4de-3f51-41a8-b0dc-b8a6e73a06cb
  question: Что такое defect escape?
  answer: Дефект, обнаруженный после этапа, на котором команда рассчитывала его найти,
    часто уже в production. Важно анализировать причины, а не только считать случаи.
  category: Метрики
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 2be7405b-cbbe-4d2a-a10d-2123a1fec09a
  question: Что показывает flakiness автотестов?
  answer: Нестабильность результата при одинаковом коде и условиях. Это подрывает
    доверие к pipeline; источник может быть в тесте, продукте или среде.
  category: Метрики
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 870f95ac-9cc0-4d15-b870-3a315e989cc6
  question: Как интерпретировать рост code coverage после релиза?
  answer: Он показывает, что тесты исполнили больше кода, но не доказывает корректность
    assertions или покрытие бизнес-рисков. Нужно смотреть качество тестов и дефекты.
  category: Метрики
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 2c2a50db-c6d6-4435-837d-9d1b2eaa6f44
  question: Чем Definition of Ready отличается от Definition of Done для проверки
    качества?
  answer: DoR помогает убедиться, что задача понятна перед началом; DoD задаёт общие
    условия завершения, включая тесты, документацию и наблюдаемость.
  category: Процесс
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: bee08ead-854f-46ee-821c-3d37ecfbf248
  question: Что такое quality gate в pipeline?
  answer: 'Набор обязательных проверок перед продвижением изменения: сборка, тесты,
    анализ и политика безопасности. Gate должен иметь понятный критерий и владельца.'
  category: CI/CD
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 78c2f7e3-f4d0-4320-9bb6-64d0c5bb0322
  question: Почему красный pipeline нельзя игнорировать из-за «неважного» теста без
    анализа?
  answer: Падение может указывать на реальную регрессию или нестабильность среды.
    Нужно выяснить причину и явно принять риск, а не обойти gate молча.
  category: CI/CD
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: ee9a7d44-5b0e-4569-b593-c648a1dd16bd
  question: Какие проверки нужны перед релизом изменения в контракте Kafka-события?
  answer: Совместимость producer и consumers, схемы старых событий, интеграционные
    тесты, план развёртывания и наблюдение ошибок обработки.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7bc1767c-ce7b-405c-bac2-7735417042ac
  question: Что значит готовность релиза с точки зрения тестирования?
  answer: Критичные сценарии и обязательные проверки пройдены, открытые дефекты и
    ограничения понятны, мониторинг и план отката готовы; решение принимает ответственная
    сторона.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1df161fb-488b-4886-84b0-b6fcd2eb4171
  question: Как принимать go/no-go при известном дефекте?
  answer: Оценить влияние, частоту, обходной путь, юридический и операционный риск,
    возможность отката и сроки исправления; решение зафиксировать с владельцем.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: ddb3394a-de68-41ca-a57c-a0d0aeb3fb3c
  question: Чем smoke после деплоя отличается от проверки pipeline до деплоя?
  answer: Smoke проверяет работающий артефакт в целевой среде, где могут проявиться
    ошибки конфигурации и интеграций, невидимые до развёртывания.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 1ca290ad-097d-4c20-aa75-aac535c05eb3
  question: Какие метрики наблюдать после canary release?
  answer: Долю ошибок, задержку, бизнес-результат, ресурсные показатели и поведение
    зависимостей для новой и старой версии при сопоставимом трафике.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7068031f-6b16-4057-8c4f-854455650ab8
  question: Почему результат автотеста без версии среды мало полезен?
  answer: Неясно, какой код и конфигурация проверялись; невозможно связать результат
    с конкретным релизом или воспроизвести дефект.
  category: Прослеживаемость
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 9a209e1b-dac6-4022-a7f3-94c5be5f1f21
  question: Что такое матрица покрытия требований?
  answer: Связь требований или рисков с тестами и результатами. Она помогает увидеть
    непротестированные части, но сама по себе не оценивает глубину проверок.
  category: Покрытие
  context: 
  hint_1: 
  hint_2: 
  difficulty: easy
  code: 
- id: 5527b368-e6dc-438d-9a92-7985c9a1b615
  question: Как выбирать, что автоматизировать в первую очередь?
  answer: Начать с частых, критичных и стабильных сценариев с ясным оракулом; учитывать
    стоимость поддержки и скорость обратной связи.
  category: Автоматизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: e851f20c-7592-4cf5-91db-1921b08ea31e
  question: Почему не каждый тест-кейс следует автоматизировать?
  answer: Редкие и быстро меняющиеся сценарии могут стоить дороже поддержки, чем дают
    пользы. Некоторые проверки лучше проводить исследовательски.
  category: Автоматизация
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: eeeacc58-3351-46fd-b6ac-6aac5b9b97c7
  question: Что такое test review и что в нём искать?
  answer: Ревью сценариев и кода тестов на связь с требованием, правильный оракул,
    границы, независимость, читаемость и устойчивость.
  category: Процесс
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: b01ed0ea-ea50-4462-823c-02c5ed05e088
  question: Как использовать анализ production-дефектов для улучшения тестов?
  answer: Выявить, какой риск и граница были пропущены, добавить подходящую проверку
    на самом дешёвом надёжном уровне и исправить процесс при системной причине.
  category: Обучение
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 7f7dde84-6c92-4283-bf4b-bcb0fcec2376
  question: Почему тестовый отчёт «все тесты зелёные» недостаточен для решения о релизе?
  answer: Нужно знать, какие сценарии проверялись, на какой версии и среде, какие
    проверки не запускались и какие риски остаются.
  category: Отчётность
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: c9efb326-77d0-4b08-9340-5fc073e54ac7
  question: Чем QA-процесс Product Engineer отличается от передачи задачи отдельному
    тестировщику?
  answer: Инженер сам помогает уточнять требования, выбирает уровни и данные тестов,
    автоматизирует проверки и оценивает риски релиза, сохраняя командное ревью.
  category: Роль
  context: 
  hint_1: 
  hint_2: 
  difficulty: medium
  code: 
- id: 1aa1724c-ad98-4b50-9b03-c1bf8131c06c
  question: Когда можно выпускать с отключённым нестабильным тестом?
  answer: Только после оценки покрываемого риска, альтернативной проверки, явного
    решения владельца и задачи на исправление; постоянное отключение опасно.
  category: Релиз
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: aa1b5855-b8f7-46c0-9758-ef6c2593b667
  question: Что проверять в rollback-плане перед релизом?
  answer: Совместимость старой версии с миграцией данных и событиями, время восстановления,
    команды и критерии решения об откате.
  category: Откат
  context: 
  hint_1: 
  hint_2: 
  difficulty: hard
  code: 
- id: 921fdca7-d173-4717-b445-22fc9899662e
  question: Почему после релиза нужно проверять бизнес-метрики, а не только HTTP 200?
  answer: Технически успешные запросы могут создавать неверные операции или не доводить
    асинхронный сценарий до результата.
