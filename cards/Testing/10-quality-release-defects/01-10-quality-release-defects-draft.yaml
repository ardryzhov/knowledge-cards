topic: "Качество релизов, дефекты и QA-процесс"
cards:
  - question: "Чем severity дефекта отличается от priority?"
    answer: "Severity описывает влияние дефекта на систему или пользователя; priority — срочность исправления с учётом бизнеса и сроков. Они могут не совпадать."
    category: "Дефекты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что должен содержать полезный defect report?"
    answer: "Симптом, ожидаемый и фактический результат, шаги воспроизведения, данные, среду, версию, влияние и доступные логи или скриншоты без секретов."
    category: "Дефекты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что делать, если дефект не воспроизводится повторно?"
    answer: "Сохранить артефакты первого сбоя, уточнить время, нагрузку, данные и окружение; не закрывать его автоматически как «случайный»."
    category: "Дефекты"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем retest отличается от regression testing?"
    answer: "Retest проверяет конкретное исправление ранее найденного дефекта; регресс проверяет, не нарушено ли другое поведение после изменения."
    category: "Виды проверки"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что такое defect escape?"
    answer: "Дефект, обнаруженный после этапа, на котором команда рассчитывала его найти, часто уже в production. Важно анализировать причины, а не только считать случаи."
    category: "Метрики"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что показывает flakiness автотестов?"
    answer: "Нестабильность результата при одинаковом коде и условиях. Это подрывает доверие к pipeline; источник может быть в тесте, продукте или среде."
    category: "Метрики"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как интерпретировать рост code coverage после релиза?"
    answer: "Он показывает, что тесты исполнили больше кода, но не доказывает корректность assertions или покрытие бизнес-рисков. Нужно смотреть качество тестов и дефекты."
    category: "Метрики"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем Definition of Ready отличается от Definition of Done для проверки качества?"
    answer: "DoR помогает убедиться, что задача понятна перед началом; DoD задаёт общие условия завершения, включая тесты, документацию и наблюдаемость."
    category: "Процесс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Что такое quality gate в pipeline?"
    answer: "Набор обязательных проверок перед продвижением изменения: сборка, тесты, анализ и политика безопасности. Gate должен иметь понятный критерий и владельца."
    category: "CI/CD"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Почему красный pipeline нельзя игнорировать из-за «неважного» теста без анализа?"
    answer: "Падение может указывать на реальную регрессию или нестабильность среды. Нужно выяснить причину и явно принять риск, а не обойти gate молча."
    category: "CI/CD"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Какие проверки нужны перед релизом изменения в контракте Kafka-события?"
    answer: "Совместимость producer и consumers, схемы старых событий, интеграционные тесты, план развёртывания и наблюдение ошибок обработки."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что значит готовность релиза с точки зрения тестирования?"
    answer: "Критичные сценарии и обязательные проверки пройдены, открытые дефекты и ограничения понятны, мониторинг и план отката готовы; решение принимает ответственная сторона."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как принимать go/no-go при известном дефекте?"
    answer: "Оценить влияние, частоту, обходной путь, юридический и операционный риск, возможность отката и сроки исправления; решение зафиксировать с владельцем."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Чем smoke после деплоя отличается от проверки pipeline до деплоя?"
    answer: "Smoke проверяет работающий артефакт в целевой среде, где могут проявиться ошибки конфигурации и интеграций, невидимые до развёртывания."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Какие метрики наблюдать после canary release?"
    answer: "Долю ошибок, задержку, бизнес-результат, ресурсные показатели и поведение зависимостей для новой и старой версии при сопоставимом трафике."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему результат автотеста без версии среды мало полезен?"
    answer: "Неясно, какой код и конфигурация проверялись; невозможно связать результат с конкретным релизом или воспроизвести дефект."
    category: "Прослеживаемость"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое матрица покрытия требований?"
    answer: "Связь требований или рисков с тестами и результатами. Она помогает увидеть непротестированные части, но сама по себе не оценивает глубину проверок."
    category: "Покрытие"
    context: null
    hint_1: null
    hint_2: null
    difficulty: easy
    code: null
  - question: "Как выбирать, что автоматизировать в первую очередь?"
    answer: "Начать с частых, критичных и стабильных сценариев с ясным оракулом; учитывать стоимость поддержки и скорость обратной связи."
    category: "Автоматизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Почему не каждый тест-кейс следует автоматизировать?"
    answer: "Редкие и быстро меняющиеся сценарии могут стоить дороже поддержки, чем дают пользы. Некоторые проверки лучше проводить исследовательски."
    category: "Автоматизация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Что такое test review и что в нём искать?"
    answer: "Ревью сценариев и кода тестов на связь с требованием, правильный оракул, границы, независимость, читаемость и устойчивость."
    category: "Процесс"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как использовать анализ production-дефектов для улучшения тестов?"
    answer: "Выявить, какой риск и граница были пропущены, добавить подходящую проверку на самом дешёвом надёжном уровне и исправить процесс при системной причине."
    category: "Обучение"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему тестовый отчёт «все тесты зелёные» недостаточен для решения о релизе?"
    answer: "Нужно знать, какие сценарии проверялись, на какой версии и среде, какие проверки не запускались и какие риски остаются."
    category: "Отчётность"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Чем QA-процесс Product Engineer отличается от передачи задачи отдельному тестировщику?"
    answer: "Инженер сам помогает уточнять требования, выбирает уровни и данные тестов, автоматизирует проверки и оценивает риски релиза, сохраняя командное ревью."
    category: "Роль"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Когда можно выпускать с отключённым нестабильным тестом?"
    answer: "Только после оценки покрываемого риска, альтернативной проверки, явного решения владельца и задачи на исправление; постоянное отключение опасно."
    category: "Релиз"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что проверять в rollback-плане перед релизом?"
    answer: "Совместимость старой версии с миграцией данных и событиями, время восстановления, команды и критерии решения об откате."
    category: "Откат"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Почему после релиза нужно проверять бизнес-метрики, а не только HTTP 200?"
    answer: "Технически успешные запросы могут создавать неверные операции или не доводить асинхронный сценарий до результата."
    category: "Мониторинг"
    context: null
    hint_1: null
    hint_2: null
    difficulty: medium
    code: null
  - question: "Как отличить проблему тестирования от ошибки требований при найденном дефекте?"
    answer: "Сверить поведение с согласованным правилом: если правило определено и нарушено — дефект реализации; если не определено — пробел требований, который нужно решить."
    category: "Классификация"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null
  - question: "Что делать, если после релиза выросло число повторных сообщений в DLQ?"
    answer: "Оценить влияние на операции, остановить расширение релиза при необходимости, изучить типы ошибок и совместимость схем, исправить причину и контролируемо переиграть сообщения."
    category: "Инцидент"
    context: null
    hint_1: null
    hint_2: null
    difficulty: hard
    code: null

