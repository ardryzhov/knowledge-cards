  - question: Когда уместнее IllegalArgumentException, а когда IllegalStateException?
    answer: IllegalArgumentException сообщает, что вызывающий код передал недопустимый аргумент. IllegalStateException сообщает, что операция невозможна из-за текущего состояния объекта или системы при допустимых аргументах. Различение помогает понять, что именно исправлять.
