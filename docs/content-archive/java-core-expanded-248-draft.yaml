  - question: Чем примитивный тип отличается от ссылочного с точки зрения значения переменной?
    answer: Переменная примитивного типа содержит само значение, а ссылочная переменная содержит ссылку на объект либо null. Присваивание примитива копирует значение; присваивание ссылки копирует ссылку, поэтому две переменные могут обращаться к одному объекту.
    category: Типы и ссылки
