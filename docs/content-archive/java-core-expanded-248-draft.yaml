  - question: Почему локальную переменную нельзя прочитать до явного присваивания, а поле объекта имеет значение по умолчанию?
    answer: "Компилятор требует определённой инициализации локальной переменной на каждом пути выполнения. Поля объекта и статические поля получают значения по умолчанию при создании объекта или инициализации класса: например, 0, false или null."
