  - question: Почему double обычно не подходит для точных денежных вычислений?
    answer: Многие десятичные дроби невозможно точно представить в двоичной форме double, поэтому операции могут накапливать ошибки округления. Для денег обычно используют BigDecimal с явно выбранными масштабом и правилами округления либо целое число минимальных денежных единиц.
