  - question: Почему new BigDecimal(0.1) и new BigDecimal("0.1") могут дать разные значения?
    answer: Конструктор с double получает уже неточное двоичное приближение 0.1 и сохраняет его десятичное представление. Конструктор со строкой разбирает именно десятичное значение 0.1. При работе с десятичными литералами используют строку или BigDecimal.valueOf(double).
    category: Типы и ссылки
