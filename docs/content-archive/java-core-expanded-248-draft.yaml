  - question: Почему выражение 5 / 2 даёт 2, а 5 / 2.0 даёт 2.5?
    answer: Когда оба операнда целочисленные, выполняется целочисленное деление с отбрасыванием дробной части. Если один операнд имеет тип с плавающей точкой, второй преобразуется и выполняется деление с плавающей точкой.
