  - question: Что произойдёт при переполнении int и почему исключение обычно не возникает?
    answer: Арифметика int в Java использует фиксированные 32 бита и при переполнении результат оборачивается по модулю 2^32. Обычные операции не выбрасывают исключение. Если переполнение недопустимо, используют методы Math.addExact и аналогичные либо тип с большим диапазоном.
    category: Типы и ссылки
