  - question: Почему распаковка Integer со значением null приводит к NullPointerException?
    answer: При unboxing JVM должна получить примитивное значение через метод обёртки. У null нет объекта, на котором можно вызвать этот метод, поэтому возникает NullPointerException. Особенно осторожно нужно работать с nullable-результатами и условными выражениями.
