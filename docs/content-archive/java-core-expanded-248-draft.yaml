    answer: Если после сбоя инвариант не восстановлен, код продолжит работу в некорректном состоянии, а первопричина проявится позднее. Обработчик должен действительно восстановиться, преобразовать ошибку в понятный результат или передать исключение выше. Логирование само по себе не является обработкой.
