  - question: "Что выбирает Java при перегрузке метода: расширение примитива, упаковку или varargs?"
    answer: При выборе применимого метода сначала рассматриваются вызовы без упаковки и varargs, затем допускается упаковка и распаковка, а varargs используются позже. Поэтому конкретный выбор зависит от набора перегрузок и объявленных типов аргументов; его нельзя определять только по визуальной близости типов.
